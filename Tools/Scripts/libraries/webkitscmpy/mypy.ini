[mypy]
python_version = 3.9
strict = True
warn_unused_configs = True
# Only report errors in the package being checked. Other libraries still provide their types.
follow_imports = silent
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../webkitcorepy:$MYPY_CONFIG_FILE_DIR/../webkitbugspy
# Modules that have not been annotated yet (see the ignore_errors section below).
untyped_calls_exclude = webkitscmpy.local,webkitscmpy.local.git,webkitscmpy.local.scm,webkitscmpy.local.svn,webkitscmpy.mocks,webkitscmpy.mocks.local,webkitscmpy.mocks.local.git,webkitscmpy.mocks.local.svn,webkitscmpy.mocks.remote,webkitscmpy.mocks.remote.bitbucket,webkitscmpy.mocks.remote.git_hub,webkitscmpy.mocks.remote.svn,webkitscmpy.program,webkitscmpy.program.apply,webkitscmpy.program.blame,webkitscmpy.program.branch,webkitscmpy.program.canonicalize,webkitscmpy.program.canonicalize.committer,webkitscmpy.program.canonicalize.message,webkitscmpy.program.checkout,webkitscmpy.program.cherry_pick,webkitscmpy.program.classify,webkitscmpy.program.clean,webkitscmpy.program.clone,webkitscmpy.program.command,webkitscmpy.program.commit,webkitscmpy.program.conflict,webkitscmpy.program.create_bug,webkitscmpy.program.credentials,webkitscmpy.program.diff,webkitscmpy.program.diff.diff,webkitscmpy.program.diff.editor_diff,webkitscmpy.program.diff.html_diff,webkitscmpy.program.diff.terminal_diff,webkitscmpy.program.find,webkitscmpy.program.install_git_lfs,webkitscmpy.program.install_hooks,webkitscmpy.program.land,webkitscmpy.program.log,webkitscmpy.program.pickable,webkitscmpy.program.publish,webkitscmpy.program.pull,webkitscmpy.program.pull_request,webkitscmpy.program.revert,webkitscmpy.program.review,webkitscmpy.program.setup,webkitscmpy.program.setup_git_svn,webkitscmpy.program.show,webkitscmpy.program.squash,webkitscmpy.program.trace,webkitscmpy.program.track,webkitscmpy.program.tracker_metadata,webkitscmpy.remote,webkitscmpy.remote.bitbucket,webkitscmpy.remote.git_hub,webkitscmpy.remote.scm,webkitscmpy.remote.svn

# Tests are checked with mypy's defaults, so unannotated tests aren't checked at all.
[mypy-webkitscmpy.test.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
check_untyped_defs = False
warn_return_any = False
disallow_any_generics = False
disallow_subclassing_any = False
implicit_reexport = True

[mypy-webkitscmpy.mocks.*]
warn_return_any = False
disallow_any_generics = False
disallow_subclassing_any = False

[mypy-mypy.*]
follow_imports = skip

[mypy-fasteners.*]
ignore_missing_imports = True

# Tests load git hooks, which aren't modules, by path.
[mypy-prepare_commit_msg]
ignore_missing_imports = True

# Radar's client library is Apple-internal, and isn't available everywhere.
[mypy-radarclient.*]
ignore_missing_imports = True

# AutoInstall only installs these packages once something imports them, so whether mypy can find
# them depends on what ran before. Treat them as untyped everywhere.
[mypy-jinja2.*,rapidfuzz.*]
follow_imports = skip
ignore_missing_imports = True

# These packages' types come from separate stub distributions, which AutoInstall doesn't
# install. Treat them as untyped everywhere, even where their stubs happen to be installed.
[mypy-requests.*,urllib3.*,xmltodict.*,yaml.*]
follow_imports = skip
follow_imports_for_stubs = True
ignore_missing_imports = True

# Modules that have not been annotated yet. Remove modules from this list, and from
# untyped_calls_exclude above, as they're annotated.
[mypy-webkitscmpy.local,webkitscmpy.local.git,webkitscmpy.local.scm,webkitscmpy.local.svn,webkitscmpy.mocks,webkitscmpy.mocks.local,webkitscmpy.mocks.local.git,webkitscmpy.mocks.local.svn,webkitscmpy.mocks.remote,webkitscmpy.mocks.remote.bitbucket,webkitscmpy.mocks.remote.git_hub,webkitscmpy.mocks.remote.svn,webkitscmpy.program,webkitscmpy.program.apply,webkitscmpy.program.blame,webkitscmpy.program.branch,webkitscmpy.program.canonicalize,webkitscmpy.program.canonicalize.committer,webkitscmpy.program.canonicalize.message,webkitscmpy.program.checkout,webkitscmpy.program.cherry_pick,webkitscmpy.program.classify,webkitscmpy.program.clean,webkitscmpy.program.clone,webkitscmpy.program.command,webkitscmpy.program.commit,webkitscmpy.program.conflict,webkitscmpy.program.create_bug,webkitscmpy.program.credentials,webkitscmpy.program.diff,webkitscmpy.program.diff.diff,webkitscmpy.program.diff.editor_diff,webkitscmpy.program.diff.html_diff,webkitscmpy.program.diff.terminal_diff,webkitscmpy.program.find,webkitscmpy.program.install_git_lfs,webkitscmpy.program.install_hooks,webkitscmpy.program.land,webkitscmpy.program.log,webkitscmpy.program.pickable,webkitscmpy.program.publish,webkitscmpy.program.pull,webkitscmpy.program.pull_request,webkitscmpy.program.revert,webkitscmpy.program.review,webkitscmpy.program.setup,webkitscmpy.program.setup_git_svn,webkitscmpy.program.show,webkitscmpy.program.squash,webkitscmpy.program.trace,webkitscmpy.program.track,webkitscmpy.program.tracker_metadata,webkitscmpy.remote,webkitscmpy.remote.bitbucket,webkitscmpy.remote.git_hub,webkitscmpy.remote.scm,webkitscmpy.remote.svn]
ignore_errors = True
