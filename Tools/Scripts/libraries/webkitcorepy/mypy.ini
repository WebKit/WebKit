[mypy]
python_version = 3.9
strict = True
warn_unused_configs = True
# Only report errors in the package being checked. Other libraries still provide their types.
follow_imports = silent
mypy_path = $MYPY_CONFIG_FILE_DIR
exclude = /_vendored/

# Tests are checked with mypy's defaults, so unannotated tests aren't checked at all.
[mypy-webkitcorepy.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
check_untyped_defs = False
warn_return_any = False
disallow_any_generics = False
disallow_subclassing_any = False
implicit_reexport = True

[mypy-webkitcorepy.mocks.*]
warn_return_any = False
disallow_any_generics = False
disallow_subclassing_any = False

[mypy-mypy.*]
follow_imports = skip

[mypy-webkitpy.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-jsone.*,tblib.*]
ignore_missing_imports = True

# AutoInstall only installs keyring once something imports it, so whether mypy can find it
# depends on what ran before. Treat it as untyped everywhere.
[mypy-keyring.*]
follow_imports = skip
ignore_missing_imports = True

# These packages' types come from separate stub distributions, which AutoInstall doesn't
# install. Treat them as untyped everywhere, even where their stubs happen to be installed.
[mypy-requests.*,urllib3.*,yaml.*]
follow_imports = skip
follow_imports_for_stubs = True
ignore_missing_imports = True
