<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>manipulation surface</title>
<style>
html, body { margin: 0; }

.spacer { height: 1000px; }

#surfaceFrame { display: block; width: 100%; height: 400px; border: none; }
</style>
</head>
<body>
<div class="spacer"></div>
<iframe id="surfaceFrame"></iframe>
<div class="spacer"></div>
<script>
window.surfaceEvents = { down: 0, move: 0, up: 0, wheel: 0, dx: 0, dy: 0 };

const surfaceMarkup = surfaceStyle => `<!DOCTYPE html>
<style>
html, body { margin: 0; height: 100%; }
#surface { height: 100%; background: linear-gradient(#fed, #dfe); ${surfaceStyle}; }
</style>
<div id="surface"></div>`;

function observeSurface(surface) {
    let previous = null;

    surface.addEventListener("mousedown", event => {
        window.surfaceEvents.down++;
        previous = event;
    });

    surface.addEventListener("mousemove", event => {
        if (!previous)
            return;

        window.surfaceEvents.move++;
        window.surfaceEvents.dx += event.clientX - previous.clientX;
        window.surfaceEvents.dy += event.clientY - previous.clientY;
        previous = event;
    });

    surface.addEventListener("mouseup", () => {
        window.surfaceEvents.up++;
        previous = null;
    });

    surface.addEventListener("wheel", () => window.surfaceEvents.wheel++, { passive: true });
}

window.loadSurface = surfaceStyle => new Promise(resolve => {
    const frame = document.getElementById("surfaceFrame");
    frame.addEventListener("load", () => {
        observeSurface(frame.contentDocument.getElementById("surface"));
        resolve();
    }, { once: true });
    frame.srcdoc = surfaceMarkup(surfaceStyle);
});
</script>
</body>
</html>
