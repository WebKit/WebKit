      $if: "'template' in w"
      then:
        $let:
          tag: {$if: "'tag' in w", then: {$eval: w.tag}, else: {$eval: w.template}}
          override: {$if: "'platform' in w", then: {platform: {$eval: w.platform}}, else: {}}
        in:
          $if: "'name' in w"
          then: [{$merge: [{name: {$eval: w.name}, tag: {$eval: tag}}, {$eval: "templates[w.template].worker"}, {$eval: override}, {$if: "'max_builds' in w", then: {max_builds: {$eval: w.max_builds}}, else: {}}]}]
          else:
            $map: {$eval: "range(0, w.count)"}
            each(i):
              $let:
                suffix: {$if: "'suffix' in w", then: {$eval: w.suffix}, else: ''}
              in: {$merge: [{name: "${w.prefix}${w.first + i}${suffix}", tag: {$eval: tag}}, {$eval: "templates[w.template].worker"}, {$eval: override}]}
      else: [{$merge: [{name: {$eval: w.name}, tag: null}, {$eval: w}]}]

builders:
  - name: Apple-Golden-Gate-Release-Build
    factory: BuildFactory
    platform: mac-golden-gate
    configuration: release
    architectures: [arm64]
    triggers: [golden-gate-release-applesilicon-tests-wk2, golden-gate-release-perf-tests, golden-gate-applesilicon-release-tests-test262, golden-gate-release-tests-wk2-accessibility-isolated-tree, golden-gate-release-world-leaks-tests]
    workernames: {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m2pro'\").name"}}
  - name: Apple-Golden-Gate-Release-World-Leaks-Tests
    factory: TestWorldLeaksFactory
    platform: mac-golden-gate
    configuration: release
    architectures: [arm64]
    additionalArguments: ['--no-retry-failures']
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m1'\").name"}}
  - name: Apple-Golden-Gate-Release-AppleSilicon-WK2-Tests
    factory: TestAllButJSCFactory
    platform: mac-golden-gate
    configuration: release
    architectures: [arm64]
    additionalArguments: ['--no-retry-failures', '-2', '-1']
    workernames: {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m2pro'\").name"}}
  - name: Apple-Golden-Gate-Release-AppleSilicon-Test262-Tests
    factory: Test262Factory
    platform: mac-golden-gate
    configuration: release
    architectures: [arm64]
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m1'\").name"}}
  - name: Apple-Golden-Gate-Release-WK2-Perf
    factory: DownloadAndPerfTestFactory
    platform: mac-golden-gate
    configuration: release
    architectures: [arm64]
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m1'\").name"}}
  - name: Apple-Golden-Gate-Release-WK2-Accessibility-Isolated-Tree-Tests
    factory: TestLayoutFactory
    platform: mac-golden-gate
    configuration: release
    architectures: [arm64]
    additionalArguments: ['--no-retry-failures', '--accessibility-isolated-tree', accessibility/]
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m1'\").name"}}
  - name: Apple-Golden-Gate-Debug-Build
    factory: BuildFactory
    platform: mac-golden-gate
    configuration: debug
    architectures: [arm64]
    triggers: [golden-gate-debug-applesilicon-tests-wk2, golden-gate-debug-tests-wk2-site-isolation-tree]
    workernames: {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m2pro'\").name"}}
  - name: Apple-Golden-Gate-Debug-AppleSilicon-WK2-Tests
    factory: TestAllButJSCFactory
    platform: mac-golden-gate
    configuration: debug
    architectures: [arm64]
    additionalArguments: ['--no-retry-failures', '-2', '-1']
    workernames: {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m2pro'\").name"}}
  - name: Apple-Golden-Gate-LLINT-CLoop-BuildAndTest
    factory: BuildAndTestLLINTCLoopFactory
    platform: mac-golden-gate
    configuration: debug
    architectures: [arm64]
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m1'\").name"}}
  - name: Apple-Golden-Gate-AppleSilicon-O3-Debug-JSC-BuildAndTest
    factory: BuildO3AndJSCTestsFactory
    platform: mac-golden-gate
    configuration: debug
    architectures: [arm64]
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'golden-gate-m1'\").name"}}
  - name: Apple-Golden-Gate-Debug-WK2-Site-Isolation-Tree-Tests
    factory: TestAllButJSCFactory
    platform: mac-golden-gate
    configuration: debug
    architectures: [arm64]
    additionalArguments: ['--no-retry-failures', '--site-isolation-enabled-by-default']
    workernames: {$map: {$eval: "range(0, 4)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-golden-gate-aircloud'\").name"}}
  - name: Apple-Tahoe-Release-Build
    factory: BuildFactory
    platform: mac-tahoe
    configuration: release
    architectures: [x86_64, arm64]
    triggers: [tahoe-release-tests-wk2, tahoe-release-applesilicon-tests-wk2]
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"name == 'bot678'\").name"}}
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-golden-gate-aws'\").name"}}
  - name: Apple-Tahoe-Release-AppleSilicon-WK2-Tests
    factory: TestAllButJSCFactory
    platform: mac-tahoe
    configuration: release
    architectures: [x86_64, arm64]
    additionalArguments: ['--no-retry-failures', '-2', '-1']
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m1'\").name"}}
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-tahoe-aircloud'\").name"}}
  - name: Apple-Tahoe-Release-WK2-Tests
    factory: TestAllButJSCFactory
    platform: mac-tahoe
    configuration: release
    architectures: [x86_64, arm64]
    additionalArguments: ['--no-retry-failures', '-2', '-1']
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-macpro-intel'\").name"}}
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"name == 'bot669'\").name"}}
  - name: Apple-Tahoe-Debug-Build
    factory: BuildFactory
    platform: mac-tahoe
    configuration: debug
    architectures: [x86_64, arm64]
    additionalArguments: ['--cmake']
    triggers: [tahoe-debug-tests-wk2, tahoe-debug-applesilicon-tests-wk2, tahoe-debug-tests-webdriver, tahoe-debug-tests-webdriver-site-isolation]
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"name == 'bot621'\").name"}}
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-golden-gate-aws'\").name"}}
  - name: Apple-Tahoe-Debug-WK2-Tests
    factory: TestAllButJSCFactory
    platform: mac-tahoe
    configuration: debug
    architectures: [x86_64, arm64]
    additionalArguments: ['--no-retry-failures', '-2', '-1']
    workernames: {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-macpro-intel'\").name"}}
  - name: Apple-Tahoe-Debug-AppleSilicon-WK2-Tests
    factory: TestAllButJSCFactory
    platform: mac-tahoe
    configuration: debug
    architectures: [x86_64, arm64]
    additionalArguments: ['--no-retry-failures', '-2', '-1']
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m1'\").name"}}
        - {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-tahoe-aircloud'\").name"}}
  - name: Apple-Tahoe-Debug-WebDriver-Tests
    factory: TestWebDriverFactory
    platform: mac-tahoe
    configuration: debug
    architectures: [x86_64, arm64]
    workernames: {$map: {$eval: workers}, each(w): {$if: "w.name == 'bot10015'", then: {$eval: w.name}}}
  - name: Apple-Tahoe-Debug-WebDriver-Site-Isolation-Tests
    factory: TestWebDriverFactory
    platform: mac-tahoe
    configuration: debug
    architectures: [x86_64, arm64]
    additionalArguments: ['--site-isolation']
    workernames: {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"name == 'bot10015'\").name"}}
  - name: Apple-Tahoe-Safer-CPP-Checks
    factory: SaferCPPStaticAnalyzerFactory
    platform: mac-tahoe
    configuration: release
    architectures: [arm64]
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 1)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m2pro'\").name"}}
        - {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-tahoe-aircloud'\").name"}}
  - name: Apple-Sequoia-Release-Build
    factory: BuildFactory
    platform: mac-sequoia
    configuration: release
