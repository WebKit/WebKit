      - {template: mac-tahoe-aws, prefix: ews, first: 3000, count: 41}
    each(w):
      $if: "'template' in w"
      then:
        $let:
          tag: {$if: "'tag' in w", then: {$eval: w.tag}, else: {$eval: w.template}}
        in:
          $if: "'name' in w"
          then: [{$merge: [{name: {$eval: w.name}, tag: {$eval: tag}}, {$eval: "templates[w.template].worker"}, {$if: "'max_builds' in w", then: {max_builds: {$eval: w.max_builds}}, else: {}}]}]
          else:
            $map: {$eval: "range(0, w.count)"}
            each(i):
              $let:
                suffix: {$if: "'suffix' in w", then: {$eval: w.suffix}, else: ''}
              in: {$merge: [{name: "${w.prefix}${w.first + i}${suffix}", tag: {$eval: tag}}, {$if: "'platform' in w", then: {platform: {$eval: w.platform}}, else: {}}, {$eval: "templates[w.template].worker"}]}
      else: [{$merge: [{name: {$eval: w.name}, tag: null}, {$eval: w}]}]

builders:
  - name: Style-EWS
    shortname: style
    icon: testOnly
    factory: StyleFactory
    platform: '*'
    workernames: {$map: {$eval: workers}, each(w): {$if: "w.tag == 'webkit-misc'", then: {$eval: w.name}}}
  - name: Bindings-Tests-EWS
    shortname: bindings
    icon: testOnly
    factory: BindingsFactory
    platform: '*'
    workernames: {$map: {$eval: workers}, each(w): {$if: "w.tag == 'webkit-misc'", then: {$eval: w.name}}}
  - name: WebKitPy-Tests-EWS
    shortname: webkitpy
    icon: testOnly
    factory: WebKitPyFactory
    platform: '*'
    workernames: {$map: {$eval: workers}, each(w): {$if: "w.tag == 'webkit-misc'", then: {$eval: w.name}}}
  - name: WebKitPerl-Tests-EWS
    shortname: webkitperl
    icon: testOnly
    factory: WebKitPerlFactory
    platform: '*'
    workernames: {$map: {$eval: workers}, each(w): {$if: "w.tag == 'webkit-misc'", then: {$eval: w.name}}}
  - name: Services-EWS
    shortname: services
    icon: testOnly
    factory: ServicesFactory
    platform: '*'
    workernames: {$map: {$eval: "range(0, 3)"}, each(i): {$eval: "pop(workers, \"tag == 'webkit-misc'\").name"}}
  - name: GTK-Build-EWS
    shortname: gtk
    icon: buildOnly
    factory: GTKBuildFactory
    platform: gtk
    configuration: release
    architectures: [x86_64]
    triggers: [api-tests-gtk-ews, gtk-wk2-tests-ews]
    workernames: {$map: {$eval: "range(0, 5)"}, each(i): {$eval: "pop(workers, \"tag == 'gtk-clang'\").name"}}
  - name: GTK-WK2-Tests-EWS
    shortname: gtk-wk2
    icon: testOnly
    factory: GTKTestsFactory
    platform: gtk
    configuration: release
    triggered_by: [gtk-build-ews]
    workernames: {$map: {$eval: "range(0, 8)"}, each(i): {$eval: "pop(workers, \"tag == 'igalia-gtk-big'\").name"}}
  - name: iOS-26-Build-EWS
    shortname: ios
    icon: buildOnly
    factory: iOSEmbeddedBuildFactory
    platform: ios-26
    configuration: release
    architectures: [arm64]
    workernames: {$map: {$eval: "range(0, 5)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-tahoe-aws'\").name"}}
  - name: iOS-26-Simulator-Build-EWS
    shortname: ios-sim
    icon: buildOnly
    factory: iOSBuildFactory
    platform: ios-simulator-26
    configuration: release
    architectures: [arm64]
    triggers: [api-tests-ios-sim-ews, ios-26-sim-wk2-tests-ews, ios-26-sim-wpt-wk2-tests-ews]
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 4)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m1'\").name"}}
        - {$map: {$eval: "range(0, 3)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-tahoe-aws'\").name"}}
  - name: iOS-26-Simulator-WK2-Tests-EWS
    shortname: ios-wk2
    icon: testOnly
    factory: iOSTestsFactory
    platform: ios-simulator-26
    configuration: release
    triggered_by: [ios-26-sim-build-ews]
    additionalArguments: [--child-processes=5, --exclude-tests, imported/w3c/web-platform-tests]
    workernames: {$map: {$eval: "range(0, 7)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m2pro'\").name"}}
  - name: iOS-26-Simulator-WPT-WK2-Tests-EWS
    shortname: ios-wk2-wpt
    icon: testOnly
    factory: iOSTestsFactory
    platform: ios-simulator-26
    configuration: release
    triggered_by: [ios-26-sim-build-ews]
    additionalArguments: [--child-processes=4, imported/w3c/web-platform-tests]
    workernames: {$map: {$eval: "range(0, 16)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m2pro'\").name"}}
  - name: macOS-Tahoe-Debug-Build-EWS
    shortname: mac-cmake-debug
    icon: buildOnly
    factory: macOSBuildOnlyFactory
    platform: mac-tahoe
    configuration: debug
    architectures: [arm64]
    additionalArguments: [--cmake]
    triggers: [macos-tahoe-debug-api-tests-ews, macos-tahoe-debug-wk2-tests-ews]
    workernames:
      $flatten:
        - {$map: {$eval: "range(0, 3)"}, each(i): {$eval: "pop(workers, \"tag == 'tahoe-m2pro'\").name"}}
        - {$map: {$eval: "range(0, 2)"}, each(i): {$eval: "pop(workers, \"tag == 'mac-tahoe-aws'\").name"}}
  - name: macOS-Tahoe-Debug-API-Tests-EWS
    shortname: api-mac-cmake-debug
    icon: testOnly
    factory: APITestsFactory
    platform: mac-tahoe
    configuration: debug
    triggered_by: [macos-tahoe-debug-build-ews]
    workernames:
