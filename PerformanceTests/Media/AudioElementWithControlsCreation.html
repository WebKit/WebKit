<!DOCTYPE html>
<html>
<head>
<style>
    audio { display: block; }
</style>
<script src="../resources/runner.js"></script>
<script>
    window.addEventListener('load', event => {
        const numberOfIterations = 20;
        const numberOfItems = 300;
        const syncTimes = [];
        window.syncTimes = syncTimes;

        PerfTestRunner.prepareToMeasureValuesAsync({
            customIterationCount: numberOfIterations,
            unit: 'ms',
            done: function () {
                PerfTestRunner.gc();
            }
        });

        function startIteration()
        {
            let target = document.createElement('div');
            document.body.appendChild(target);

            let startTime = PerfTestRunner.now();

            // Most of the elements are below the fold; only those near the viewport build their controls.
            for (let i = 0; i < numberOfItems; ++i) {
                let audio = document.createElement('audio');
                audio.controls = true;
                target.appendChild(audio);
            }

            syncTimes.push(PerfTestRunner.now() - startTime);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // The first iteration is a warm-up that the runner ignores. Log before the final
                    // measurement because the runner writes its output as soon as it finishes.
                    if (syncTimes.length > numberOfIterations)
                        PerfTestRunner.log("Synchronous loop times (ms): " + syncTimes.slice(1).map(value => value.toFixed(2)).join(", "));

                    let continueTesting = PerfTestRunner.measureValueAsync(PerfTestRunner.now() - startTime);
                    document.body.removeChild(target);
                    if (!continueTesting)
                        return;

                    PerfTestRunner.gc();
                    setTimeout(startIteration, 0);
                });
            });
        }

        startIteration();
    })
</script>
</head>
<body>
</body>
</html>
