<!DOCTYPE html>
<html>
<body>
<script src="../../resources/runner.js"></script>
<script src="../resources/webgl-bench.js"></script>
<script>

// 32 times: create a texture, upload 256x256 data to it, draw it at 1:1 with NEAREST sampling to
// one 256x256 tile of a 2048x1024 framebuffer, and delete it.
const textureSize = 256;
const width = 2048;
const height = 1024;
const tilesPerRow = width / textureSize;
const drawCount = tilesPerRow * (height / textureSize);
const patternCount = 5;

const vertexShader = `
attribute vec2 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main() {
    vTexCoord = aTexCoord;
    gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const fragmentShader = `
precision highp float;
uniform sampler2D uTexture;
varying vec2 vTexCoord;
void main() {
    gl_FragColor = texture2D(uTexture, vTexCoord);
}`;

let target;
let patterns = [];

function patternFor(n, draw)
{
    return patterns[(n + draw) % patternCount];
}

function expectedPixel(n, x, y, out)
{
    const pattern = patternFor(n, Math.floor(y / textureSize) * tilesPerRow + Math.floor(x / textureSize));
    const offset = ((y % textureSize) * textureSize + x % textureSize) * 4;
    for (let c = 0; c < 4; ++c)
        out[c] = pattern[offset + c];
    return out;
}

WebGLBench.run({
    description: "Measures 32 times creating a texture, uploading 256x256 RGBA8 data to it with texImage2D, drawing with it and deleting it, followed by a 1x1 readPixels.",
    setup(gl) {
        target = WebGLBench.createRenderTarget(gl, width, height);
        for (let i = 0; i < patternCount; ++i)
            patterns.push(WebGLBench.createPattern(textureSize * textureSize * 4, i));

        WebGLBench.createProgram(gl, vertexShader, fragmentShader, ["aPosition", "aTexCoord"]);
        const corners = [[0, 0], [1, 0], [0, 1], [0, 1], [1, 0], [1, 1]];
        const vertices = new Float32Array(drawCount * 6 * 4);
        for (let i = 0; i < drawCount; ++i) {
            const tileX = i % tilesPerRow;
            const tileY = Math.floor(i / tilesPerRow);
            corners.forEach(([x, y], vertex) => {
                const offset = (i * 6 + vertex) * 4;
                vertices[offset] = (tileX + x) * textureSize / (width / 2) - 1;
                vertices[offset + 1] = (tileY + y) * textureSize / (height / 2) - 1;
                vertices[offset + 2] = x;
                vertices[offset + 3] = y;
            });
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
    },
    iteration(gl, n) {
        for (let i = 0; i < drawCount; ++i) {
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, patternFor(n, i));
            gl.drawArrays(gl.TRIANGLES, i * 6, 6);
            gl.deleteTexture(texture);
        }
    },
    probe(gl, n) {
        const x = width - textureSize + WebGLBench.hash(n) % textureSize;
        const y = height - textureSize + WebGLBench.hash(n + 1) % textureSize;
        WebGLBench.probe(gl, target, x, y, expectedPixel(n, x, y, [0, 0, 0, 0]));
    },
    verify(gl, n) {
        WebGLBench.verifyTarget(gl, target, "Tiles", 0, (x, y, out) => expectedPixel(n, x, y, out));
    }
});

</script>
</body>
</html>
