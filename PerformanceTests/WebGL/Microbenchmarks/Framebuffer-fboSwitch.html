<!DOCTYPE html>
<html>
<body>
<script src="../../resources/runner.js"></script>
<script src="../resources/webgl-bench.js"></script>
<script>

// 256 draws, cycling through 8 framebuffers of 64x32 with a bindFramebuffer before each draw. Each
// framebuffer is split into 32 tiles of 8x8 pixels, and draw i fills tile i / 8 of framebuffer
// i % 8, so each draw needs a new render pass.
const width = 64;
const height = 32;
const tileSize = 8;
const tilesPerRow = width / tileSize;
const framebufferCount = 8;
const drawCount = framebufferCount * tilesPerRow * (height / tileSize);

const vertexShader = `
attribute vec2 aPosition;
void main() {
    gl_Position = vec4(aPosition / vec2(${width / 2}.0, ${height / 2}.0) - 1.0, 0.0, 1.0);
}`;

const fragmentShader = `
precision highp float;
uniform vec4 uColor;
void main() {
    gl_FragColor = uColor;
}`;

const targets = [];
let colorLocation;
const color = [0, 0, 0, 0];

function expectedPixel(n, f, x, y, out)
{
    const tile = Math.floor(y / tileSize) * tilesPerRow + Math.floor(x / tileSize);
    return WebGLBench.colorInto(n, tile * framebufferCount + f, out);
}

WebGLBench.run({
    description: "Measures 256 pairs of bindFramebuffer, cycling through 8 framebuffers, and a drawArrays of 2 triangles with uniform4f before it, followed by a 1x1 readPixels.",
    setup(gl) {
        for (let f = 0; f < framebufferCount; ++f)
            targets.push(WebGLBench.createRenderTarget(gl, width, height));
        const program = WebGLBench.createProgram(gl, vertexShader, fragmentShader, ["aPosition"]);
        colorLocation = gl.getUniformLocation(program, "uColor");
        const corners = [[0, 0], [1, 0], [0, 1], [0, 1], [1, 0], [1, 1]];
        const tileCount = drawCount / framebufferCount;
        const vertices = new Float32Array(tileCount * 6 * 2);
        for (let i = 0; i < tileCount; ++i) {
            const tileX = i % tilesPerRow;
            const tileY = Math.floor(i / tilesPerRow);
            corners.forEach(([x, y], vertex) => vertices.set([(tileX + x) * tileSize, (tileY + y) * tileSize], (i * 6 + vertex) * 2));
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    },
    iteration(gl, n) {
        for (let i = 0; i < drawCount; ++i) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, targets[i % framebufferCount].framebuffer);
            WebGLBench.colorInto(n, i, color);
            gl.uniform4f(colorLocation, color[0] / 255, color[1] / 255, color[2] / 255, 1);
            gl.drawArrays(gl.TRIANGLES, Math.floor(i / framebufferCount) * 6, 6);
        }
    },
    probe(gl, n) {
        // The last draw is to the last tile of the last framebuffer.
        const f = framebufferCount - 1;
        WebGLBench.probe(gl, targets[f], width - tileSize / 2, height - tileSize / 2, expectedPixel(n, f, width - 1, height - 1, [0, 0, 0, 0]), 1);
    },
    verify(gl, n) {
        targets.forEach((target, f) => {
            WebGLBench.verifyTarget(gl, target, "Framebuffer " + f, 1, (x, y, out) => expectedPixel(n, f, x, y, out));
        });
    }
});

</script>
</body>
</html>
