<!DOCTYPE html>
<html>
<body>
<script src="../../resources/runner.js"></script>
<script src="../resources/webgl-bench.js"></script>
<script src="../resources/fullscreen-shader-benchmark.js"></script>
<script>

const size = 2048;
const valueCount = 256;
const drawCount = 4;

// A weighted average of the array, with weights that depend on the pixel. The recurrence is
// contractive, so rounding differences do not grow.
const fragmentShader = `
precision highp float;
varying highp vec2 vPixel;
uniform vec4 uValues[${valueCount}];
void main() {
    float k = 0.5 + 0.4 * (vPixel.x / ${size}.0);
    float m = vPixel.y / ${size}.0;
    vec4 sum = vec4(0.0);
    for (int i = 0; i < ${valueCount}; i++)
        sum = sum * k + uValues[i] * m;
    gl_FragColor = sum * (1.0 - k);
}`;

let valuesLocation;
const values = new Float32Array(valueCount * 4);
let valuesIteration = -1;

function valuesFor(n)
{
    if (valuesIteration != n) {
        for (let i = 0; i < valueCount * 4; ++i)
            values[i] = FullscreenShaderBenchmark.random(n, i);
        valuesIteration = n;
    }
    return values;
}

FullscreenShaderBenchmark.run({
    description: "Measures " + drawCount + " fullscreen draws into a 2048x2048 framebuffer of a fragment shader that loops over a uniform vec4[" + valueCount + "] array, followed by a 1x1 readPixels. The array is uploaded with every run.",
    size,
    fragmentShader,
    drawCount,
    tolerance: 2,
    setup(gl, program) {
        valuesLocation = gl.getUniformLocation(program, "uValues");
    },
    update(gl, n) {
        gl.uniform4fv(valuesLocation, valuesFor(n));
    },
    expectedPixel(n, x, y, out) {
        const f = Math.fround;
        const values = valuesFor(n);
        const k = f(0.5 + f(0.4 * f(f(x + 0.5) / size)));
        const m = f(f(y + 0.5) / size);
        for (let c = 0; c < 4; ++c) {
            let sum = 0;
            for (let i = 0; i < valueCount; ++i)
                sum = sum * k + values[i * 4 + c] * m;
            out[c] = Math.round(Math.min(Math.max(sum * (1 - k), 0), 1) * 255);
        }
        return out;
    }
});

</script>
</body>
</html>
