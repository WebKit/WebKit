# Each key is a QuirkBehaviorID

#   available           BuildCondition expression; the table drops the behavior when false. Default: always.
#   conditions          QuirkConditionsSupported that .when() may add.
#   conditionsRequired  Every row must add all of the behavior's conditions.
#
# By default, an accessor named after the key (first letter lowercased) is generated. Its
# argument is derived from conditions: none for [], `const Node&` for [ElementSelector], and
# `const URL&` for [SecondaryURL]. Any other conditions need a custom implementation.
#
#   accessor            Overrides the accessor name.
#   static              Takes a const URL& and resolves top-URL quirks for it; needs no Document.
#   export              Adds WEBCORE_EXPORT to the declaration.
#   implementation      "custom" if the accessor is hand-written in Quirks. Only custom behaviors may set parameters
#   parameters          QuirkParametersNeeded

