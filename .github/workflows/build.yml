name: Build WebKit WiiU (WKC)

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every push used to start a full Wii U cross-build. Keep only the newest
# run for a ref so rapid WKC-only commits do not waste runner time.
concurrency:
  group: webkit-wiiu-build-${{ github.ref }}
  # Full WebKit cross-builds are long-running; let the active revision finish.
  # The pending run is replaced by newer commits, and consumers request the exact SHA.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      WUT_ROOT:  /opt/devkitpro/wut
      # Container workspace is deterministic for this repo; keep CCACHE_DIR in
      # sync with the actions/cache path (.ccache, resolved against workspace).
      CCACHE_DIR: /__w/webkit-wiiu/webkit-wiiu/.ccache
      CCACHE_MAXSIZE: "3G"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            Source/JavaScriptCore
            Source/WebCore
            Source/WebKit/WKC
            Source/WTF
            Source/bmalloc
            Source/ThirdParty/libwebrtc
            Tools/wiiu

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v5.0.4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-cmake-ninja-icu-gperf-ruby-perl

      - name: Install CMake + build tools
        run: |
          apt-get update -q
          apt-get install -y cmake ninja-build python3 libicu-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libpsl-dev libxml2-dev gperf ruby perl ccache

      # ccache makes the WKC modernization loop fast: object files are keyed on
      # preprocessed content, not mtime, so a fresh checkout (which re-stamps every
      # file) and the geometry-header injection (which rewrites headers included
      # everywhere) no longer force a full 40-min JSC/WTF rebuild. Only the WKC
      # translation units that actually changed get recompiled; everything else is
      # served from the cache.
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v5.0.4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install ICU headers
        run: |
          mkdir -p /tmp/icu-headers
          cp -r /usr/include/unicode /tmp/icu-headers/
          # OpenSSL API headers so the WKC TLS/certificate backend (X509 etc.)
          # compiles. Only headers are needed here; the actual crypto library
          # links later against a Wii U OpenSSL port at wave-browser build time.
          mkdir -p /tmp/ssl-headers
          cp -r /usr/include/openssl /tmp/ssl-headers/
          # opensslconf.h (and bn_conf/opensslv) live in the multiarch dir on Debian
          for d in /usr/include/*-linux-gnu/openssl; do cp -rn "$d/." /tmp/ssl-headers/openssl/ 2>/dev/null || true; done
          # libcurl API headers. Both the (legacy) WKC network layer and the upstream
          # curl port compile against <curl/curl.h>; the actual libcurl links later
          # against a Wii U curl port at wave-browser build time.
          mkdir -p /tmp/curl-headers/curl
          cp -rn /usr/include/curl/. /tmp/curl-headers/curl/ 2>/dev/null || true
          # On Debian/Ubuntu libcurl4-openssl-dev ships headers in the multiarch dir
          for d in /usr/include/*-linux-gnu/curl; do cp -rn "$d/." /tmp/curl-headers/curl/ 2>/dev/null || true; done
          # SQLite API headers for the curl port's CookieJarDB (SQLite-backed cookie
          # store). Links later against the Wii U SQLite (the WKC SQLite VFS).
          mkdir -p /tmp/sqlite-headers
          cp -n /usr/include/sqlite3.h /usr/include/sqlite3ext.h /tmp/sqlite-headers/ 2>/dev/null || true
          for d in /usr/include/*-linux-gnu; do cp -n "$d"/sqlite3*.h /tmp/sqlite-headers/ 2>/dev/null || true; done
          # libpsl API header for the curl port's PublicSuffixStoreCurl.
          mkdir -p /tmp/psl-headers
          cp -n /usr/include/libpsl.h /tmp/psl-headers/ 2>/dev/null || true
          for d in /usr/include/*-linux-gnu; do cp -n "$d"/libpsl.h /tmp/psl-headers/ 2>/dev/null || true; done

      - name: Cache generated WebCore files
        id: cache-generated
        uses: actions/cache@v5.0.4
        with:
          path: .generated-cache
          key: generated-headers-e3-${{ hashFiles('Source/WebCore/platform/network/HTTPHeaderNames.in', 'Source/WebCore/css/CSSValueKeywords.in', 'Source/WebCore/css/SVGCSSValueKeywords.in', 'Source/WebCore/page/FrameTreeSyncData.in', 'Source/WebCore/html/HTMLAttributeNames.in', 'Source/WebCore/html/HTMLTagNames.in', 'Source/WebCore/svg/svgattrs.in', 'Source/WebCore/svg/svgtags.in', 'Source/WebCore/mathml/mathattrs.in', 'Source/WebCore/mathml/mathtags.in', 'Source/WebCore/css/WebKitFontFamilyNames.in', 'Source/WebCore/css/CSSProperties.json', 'Source/WebCore/page/Settings.yaml', 'Source/WTF/Scripts/Preferences/UnifiedWebPreferences.yaml', 'Source/WebCore/dom/EventInterfaces.in', 'Source/WebCore/dom/EventTargetFactory.in', 'Source/WebCore/dom/EventNames.json') }}

      - name: Cache generated JSC files
        id: cache-jsc-generated
        uses: actions/cache@v5.0.4
        with:
          path: .generated-jsc-cache
          key: generated-jsc-headers-${{ hashFiles('Source/JavaScriptCore/bytecode/BytecodeList.rb', 'Source/JavaScriptCore/wasm/wasm.json', 'Source/JavaScriptCore/generator/main.rb') }}

      - name: Generate HTTPHeaderNames
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          cd $GITHUB_WORKSPACE/.generated-cache
          python3 $GITHUB_WORKSPACE/Source/WebCore/platform/network/create-http-header-name-table \
            $GITHUB_WORKSPACE/Source/WebCore/platform/network/HTTPHeaderNames.in \
            gperf

      - name: Generate CSSValueKeywords
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          cd $GITHUB_WORKSPACE/.generated-cache
          cat $GITHUB_WORKSPACE/Source/WebCore/css/CSSValueKeywords.in \
              $GITHUB_WORKSPACE/Source/WebCore/css/SVGCSSValueKeywords.in > CSSValueKeywords.in
          python3 $GITHUB_WORKSPACE/Source/WebCore/css/scripts/process-css-values.py \
            --gperf-executable gperf

      - name: Generate FrameTreeSyncData
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          python3 $GITHUB_WORKSPACE/Source/WebCore/Scripts/generate-process-sync-data.py \
            "FrameTree" \
            $GITHUB_WORKSPACE/Source/WebCore/page/FrameTreeSyncData.in \
            $GITHUB_WORKSPACE/.generated-cache

      - name: Generate HTML Names
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          perl $GITHUB_WORKSPACE/Source/WebCore/dom/make_names.pl \
            --outputDir $GITHUB_WORKSPACE/.generated-cache \
            --attrs $GITHUB_WORKSPACE/Source/WebCore/html/HTMLAttributeNames.in \
            --elements $GITHUB_WORKSPACE/Source/WebCore/html/HTMLTagNames.in \
            --factory --wrapperFactory

      - name: Generate SVG Names
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          perl $GITHUB_WORKSPACE/Source/WebCore/dom/make_names.pl \
            --outputDir $GITHUB_WORKSPACE/.generated-cache \
            --attrs $GITHUB_WORKSPACE/Source/WebCore/svg/svgattrs.in \
            --elements $GITHUB_WORKSPACE/Source/WebCore/svg/svgtags.in \
            --factory --wrapperFactory

      - name: Generate MathML Names
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          perl $GITHUB_WORKSPACE/Source/WebCore/dom/make_names.pl \
            --outputDir $GITHUB_WORKSPACE/.generated-cache \
            --attrs $GITHUB_WORKSPACE/Source/WebCore/mathml/mathattrs.in \
            --elements $GITHUB_WORKSPACE/Source/WebCore/mathml/mathtags.in \
            --factory --wrapperFactory

      - name: Generate Font Family Names
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          perl $GITHUB_WORKSPACE/Source/WebCore/dom/make_names.pl \
            --outputDir $GITHUB_WORKSPACE/.generated-cache \
            --fonts $GITHUB_WORKSPACE/Source/WebCore/css/WebKitFontFamilyNames.in

      - name: Generate CSS Properties
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          cd $GITHUB_WORKSPACE/.generated-cache
          perl -ne "print" $GITHUB_WORKSPACE/Source/WebCore/css/CSSProperties.json > CSSProperties.json
          python3 $GITHUB_WORKSPACE/Source/WebCore/css/scripts/process-css-properties.py \
            --defines "" \
            --gperf-executable gperf

      - name: Generate Settings
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          ruby $GITHUB_WORKSPACE/Source/WebCore/Scripts/GenerateSettings.rb \
            --outputDir $GITHUB_WORKSPACE/.generated-cache \
            --template $GITHUB_WORKSPACE/Source/WebCore/Scripts/SettingsTemplates/Settings.h.erb \
            --template $GITHUB_WORKSPACE/Source/WebCore/Scripts/SettingsTemplates/Settings.cpp.erb \
            $GITHUB_WORKSPACE/Source/WTF/Scripts/Preferences/UnifiedWebPreferences.yaml \
            $GITHUB_WORKSPACE/Source/WebCore/page/Settings.yaml

      - name: Generate Event factories
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          # make_event_factory.pl emits its outputs into the current working
          # directory: EventInterfaces.h + EventHeaders.h + EventFactory.cpp from
          # EventInterfaces.in, and EventTargetInterfaces.h + EventTargetHeaders.h
          # + EventTargetFactory.cpp from EventTargetFactory.in. The WKC glue layer
          # (device controllers, WKCEvent, FrameLoader/DocumentLoader clients, ...)
          # includes EventInterfaces.h / EventTargetInterfaces.h transitively, so
          # these headers must be on the WebCore include path. The later "Copy
          # generated files into build tree" step copies .generated-cache/*.h into
          # Source/WebCore/WebCore/, so drop them there.
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          cd $GITHUB_WORKSPACE/.generated-cache
          perl $GITHUB_WORKSPACE/Source/WebCore/dom/make_event_factory.pl \
            --input $GITHUB_WORKSPACE/Source/WebCore/dom/EventInterfaces.in \
            || echo "FAIL EventInterfaces.h"
          perl $GITHUB_WORKSPACE/Source/WebCore/dom/make_event_factory.pl \
            --input $GITHUB_WORKSPACE/Source/WebCore/dom/EventTargetFactory.in \
            || echo "FAIL EventTargetInterfaces.h"
          echo "=== Event factory headers ==="
          for f in EventInterfaces.h EventHeaders.h EventTargetInterfaces.h EventTargetHeaders.h; do
            if [ -s "$f" ]; then echo "  OK  $f ($(wc -l < "$f") lines)"; else echo "  MISSING $f"; fi
          done

      - name: Generate Event names
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          # make-event-names.py emits EventNames.h (+ EventNames.cpp) from
          # EventNames.json into the current working directory. WebCore::eventNames()
          # is declared in EventNames.h, which the WKC glue (WKCNode, ...) includes.
          mkdir -p $GITHUB_WORKSPACE/.generated-cache
          cd $GITHUB_WORKSPACE/.generated-cache
          python3 $GITHUB_WORKSPACE/Source/WebCore/dom/make-event-names.py \
            --event-names $GITHUB_WORKSPACE/Source/WebCore/dom/EventNames.json \
            || echo "FAIL EventNames.h"
          if [ -s EventNames.h ]; then echo "  OK  EventNames.h ($(wc -l < EventNames.h) lines)"; else echo "  MISSING EventNames.h"; fi

      - name: Generate JSC Bytecodes
        if: steps.cache-jsc-generated.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-jsc-cache
          ruby $GITHUB_WORKSPACE/Source/JavaScriptCore/generator/main.rb \
            --bytecodes_h $GITHUB_WORKSPACE/.generated-jsc-cache/Bytecodes.h \
            --init_bytecodes_asm $GITHUB_WORKSPACE/.generated-jsc-cache/InitBytecodes.asm \
            --bytecode_structs_h $GITHUB_WORKSPACE/.generated-jsc-cache/BytecodeStructs.h \
            --bytecode_indices_h $GITHUB_WORKSPACE/.generated-jsc-cache/BytecodeIndices.h \
            $GITHUB_WORKSPACE/Source/JavaScriptCore/bytecode/BytecodeList.rb \
            --wasm_json $GITHUB_WORKSPACE/Source/JavaScriptCore/wasm/wasm.json \
            --bytecode_dumper $GITHUB_WORKSPACE/.generated-jsc-cache/BytecodeDumperGenerated.cpp

      - name: Generate JSC Builtins
        run: |
          mkdir -p $GITHUB_WORKSPACE/.generated-jsc-cache
          mkdir -p $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore
          JSC_FILES=$(grep -o 'builtins/[A-Za-z0-9._-]*\.js' \
            $GITHUB_WORKSPACE/Source/JavaScriptCore/CMakeLists.txt \
            | sort | uniq \
            | sed "s|builtins/|$GITHUB_WORKSPACE/Source/JavaScriptCore/builtins/|" \
            | tr '\n' ' ')
          python3 $GITHUB_WORKSPACE/Source/JavaScriptCore/Scripts/generate-js-builtins.py \
            --framework JavaScriptCore \
            --output-directory $GITHUB_WORKSPACE/.generated-jsc-cache \
            $JSC_FILES
          # --- Owned post-processing: keep upstream JSC generator scripts pristine ---
          # The generated per-object *Builtins.h reference JSC enums (ConstructAbility,
          # ConstructorKind, ImplementationVisibility, InlineAttribute) and the generated
          # *Builtins.cpp call UnlinkedFunctionExecutable::link(). In this standalone,
          # non-unified build those types are not otherwise visible when the header's
          # externs / the generator body are parsed. Instead of editing the upstream
          # generator scripts, inject the needed includes into the GENERATED .cpp
          # (produced fresh each run — not upstream source), right after config.h and
          # before the primary "<Object>Builtins.h" include:
          #   BuiltinUtils.h               -> the four enums + forward-decls of
          #                                   VM/SourceCode/UnlinkedFunctionExecutable/Identifier
          #   UnlinkedFunctionExecutable.h -> complete type for the ->link() call
          for f in $GITHUB_WORKSPACE/.generated-jsc-cache/*Builtins.cpp; do
            [ -e "$f" ] || continue
            sed -i 's|#include "config.h"|#include "config.h"\n#include <JavaScriptCore/BuiltinUtils.h>\n#include <JavaScriptCore/UnlinkedFunctionExecutable.h>|' "$f"
          done
          echo "=== Post-processed generated *Builtins.cpp (top of ArrayPrototypeBuiltins.cpp) ==="
          head -20 $GITHUB_WORKSPACE/.generated-jsc-cache/ArrayPrototypeBuiltins.cpp 2>/dev/null || true

      - name: Create JSCBuiltins.h combined header
        run: |
          mkdir -p $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore
          mkdir -p $GITHUB_WORKSPACE/.generated-jsc-combined
          # Same builtin .js list used by the separate-file generation above.
          JSC_FILES=$(grep -o 'builtins/[A-Za-z0-9._-]*\.js' \
            $GITHUB_WORKSPACE/Source/JavaScriptCore/CMakeLists.txt \
            | sort | uniq \
            | sed "s|builtins/|$GITHUB_WORKSPACE/Source/JavaScriptCore/builtins/|" \
            | tr '\n' ' ')
          # Generate the REAL combined header. Unlike the previous hand-rolled
          # version (which only #included the per-object headers), this defines
          # JSC_FOREACH_BUILTIN_CODE, JSC_FOREACH_BUILTIN_FUNCTION_NAME,
          # JSC_FOREACH_BUILTIN_LINK_TIME_CONSTANT, the combined externs and the
          # DECLARE_BUILTIN_GENERATOR macros that BuiltinExecutables.h relies on.
          # Emit into a scratch dir: --combined also writes JSCBuiltins.cpp, which
          # must NOT reach the build tree or it would provide duplicate definitions
          # of the per-object *Builtins.cpp symbols we already compile.
          python3 $GITHUB_WORKSPACE/Source/JavaScriptCore/Scripts/generate-js-builtins.py \
            --combined \
            --framework JavaScriptCore \
            --output-directory $GITHUB_WORKSPACE/.generated-jsc-combined \
            $JSC_FILES
          # Place the real combined header where both this step and the later
          # "Copy generated files into build tree" step will pick it up (the latter
          # copies *.h out of .generated-jsc-cache).
          cp $GITHUB_WORKSPACE/.generated-jsc-combined/JSCBuiltins.h \
             $GITHUB_WORKSPACE/.generated-jsc-cache/JSCBuiltins.h
          cp $GITHUB_WORKSPACE/.generated-jsc-combined/JSCBuiltins.h \
             $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/JSCBuiltins.h
          echo "=== JSCBuiltins.h (combined, generated) — first 100 lines ==="
          head -100 $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/JSCBuiltins.h

      - name: Generate JSC derived sources (LUT tables + unicode/regex)
        run: |
          JSC=$GITHUB_WORKSPACE/Source/JavaScriptCore
          OUT=$GITHUB_WORKSPACE/.generated-jsc-cache
          mkdir -p "$OUT" "$OUT/yarr"
          # Keyword / lexer tables (from parser/Keywords.table).
          perl "$JSC/create_hash_table" "$JSC/parser/Keywords.table" > "$OUT/Lexer.lut.h" || echo "FAIL Lexer.lut.h"
          python3 "$JSC/KeywordLookupGenerator.py" "$JSC/parser/Keywords.table" > "$OUT/KeywordLookup.h" || echo "FAIL KeywordLookup.h"
          # Yarr regex table + lexer/yarr Unicode property tables + canonicalization source.
          python3 "$JSC/yarr/create_regex_tables" > "$OUT/RegExpJitTables.h" || echo "FAIL RegExpJitTables.h"
          python3 "$JSC/parser/generateLexerUnicodePropertyTables.py" "$JSC/ucd/UnicodeData.txt" "$OUT/LexerUnicodePropertyTables.h" || echo "FAIL LexerUnicodePropertyTables.h"
          python3 "$JSC/yarr/generateYarrUnicodePropertyTables.py" "$JSC/ucd" "$OUT/UnicodePatternTables.h" || echo "FAIL UnicodePatternTables.h"
          python3 "$JSC/yarr/generateYarrCanonicalizeUnicode" "$JSC/ucd/CaseFolding.txt" "$OUT/yarr/YarrCanonicalizeUnicode.cpp" || echo "FAIL YarrCanonicalizeUnicode.cpp"
          # WasmOps.h: opcode-enum header that BytecodeDumper.h (and other bytecode
          # headers) include unconditionally even though WebAssembly is disabled. It
          # is self-contained (generated from wasm.json), so generate it and let the
          # copy step place it on the JSC include path. (cd into wasm/ so the script's
          # sibling import of generateWasm resolves.)
          ( cd "$JSC/wasm" && python3 generateWasmOpsHeader.py wasm.json "$OUT/WasmOps.h" ) || echo "FAIL WasmOps.h"
          # Per-class perfect-hash lookup tables: one <Class>.lut.h per source
          # that defines a static hash table (create_hash_table emits nothing useful
          # for most TUs, which we drop). Generate tables for both runtime and wasm
          # sources: WKC_ENABLE_WEBASSEMBLY now includes the portable interpreter,
          # whose TUs may include generated wasm lookup tables.
          n=0
          for dir in "$JSC"/runtime "$JSC"/wasm "$JSC"/wasm/js; do
            [ -d "$dir" ] || continue
            for cpp in "$dir"/*.cpp; do
              [ -f "$cpp" ] || continue
              b=$(basename "$cpp" .cpp)
              if perl "$JSC/create_hash_table" "$cpp" > "$OUT/$b.lut.h" 2>/dev/null && [ -s "$OUT/$b.lut.h" ]; then
                n=$((n+1))
              else
                rm -f "$OUT/$b.lut.h"
              fi
            done
          done
          echo "=== JSC derived sources ==="
          echo "runtime .lut.h generated: $n"
          for f in Lexer.lut.h KeywordLookup.h RegExpJitTables.h LexerUnicodePropertyTables.h UnicodePatternTables.h yarr/YarrCanonicalizeUnicode.cpp; do
            if [ -s "$OUT/$f" ]; then echo "  OK  $f ($(wc -l < "$OUT/$f") lines)"; else echo "  MISSING $f"; fi
          done

      - name: Create WebCore forwarding headers
        run: |
          mkdir -p $GITHUB_WORKSPACE/Source/WebCore/WebCore
          find $GITHUB_WORKSPACE/Source/WebCore -name "*.h" \
            -not -path "*/WebCore/WebCore/*" \
            -not -path "*/network/soup/*" \
            -not -path "*/platform/soup/*" \
            -not -path "*/soup/*" \
            -not -path "*/cf/*" \
            -not -path "*/cocoa/*" \
            -not -path "*/cg/*" \
            -not -path "*/coretext/*" \
            -not -path "*/ca/*" \
            -not -path "*/avfoundation/*" \
            -not -name "PlatformPattern.h" \
            -not -name "PlatformImage.h" \
            -not -name "PlatformPath.h" \
            -not -name "FontCustomPlatformData.h" \
            -exec bash -c 'ln -sf "$1" "$GITHUB_WORKSPACE/Source/WebCore/WebCore/$(basename $1)"' _ {} \;
          # Several basenames exist in both WebCore/platform and WebCore/PAL/pal
          # (Logging.h, ThreadGlobalData.h, ...). The loop above symlinks by
          # basename, so PAL's copy can clobber WebCore's. Force the WebCore-owned
          # headers to win for `#include "Foo.h"` from WebCore TUs (PAL code reaches
          # PAL's copies via the pal/ include path). Without this, LOG(Network,...)
          # in the curl port fails with 'LogNetwork not declared'.
          ln -sf $GITHUB_WORKSPACE/Source/WebCore/platform/Logging.h $GITHUB_WORKSPACE/Source/WebCore/WebCore/Logging.h
          ln -sf $GITHUB_WORKSPACE/Source/WebCore/platform/ThreadGlobalData.h $GITHUB_WORKSPACE/Source/WebCore/WebCore/ThreadGlobalData.h
          # WebCore/platform/Logging.h #includes <WebCore/WebCoreLogDefinitions.h>,
          # normally generated from LogMessages. Its contents are only used under
          # ENABLE(LOGD_BLOCKING_IN_WEBCONTENT) (off for WKC), so an empty stub is
          # enough to satisfy the include.
          printf '#pragma once\n' > $GITHUB_WORKSPACE/Source/WebCore/WebCore/WebCoreLogDefinitions.h

      - name: Create JavaScriptCore forwarding headers
        run: |
          mkdir -p $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore
          find $GITHUB_WORKSPACE/Source/JavaScriptCore -name "*.h" -not -path "*/JavaScriptCore/JavaScriptCore/*" \
            -exec bash -c 'ln -sf "$1" "$GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/$(basename $1)"' _ {} \;

      # Generate the Inspector protocol bindings. InspectorProtocolObjects.h (and
      # the dispatcher headers) are code-generated from inspector/protocol/*.json;
      # they are pulled in via <JavaScriptCore/InspectorProtocolObjects.h> by the
      # console/inspector chain (JSRemoteInspector.cpp, ConsoleClient.cpp,
      # ConsoleObject.cpp) even with the debugger disabled, since console.log
      # routes through JSGlobalObjectConsoleClient. Drop the generated headers
      # into the JavaScriptCore forwarding dir so those includes resolve.
      - name: Generate Inspector protocol bindings
        run: |
          set -e
          JSC=$GITHUB_WORKSPACE/Source/JavaScriptCore
          FWD=$JSC/JavaScriptCore
          GEN=$GITHUB_WORKSPACE/.generated-inspector
          mkdir -p "$GEN/inspector"
          python3 "$JSC/Scripts/generate-combined-inspector-json.py" \
            "$JSC"/inspector/protocol/*.json "" > "$GEN/CombinedDomains.json"
          python3 "$JSC/inspector/scripts/generate-inspector-protocol-bindings.py" \
            --outputDir "$GEN/inspector" --framework JavaScriptCore "$GEN/CombinedDomains.json"
          cp "$GEN"/inspector/*.h "$FWD/"
          for source in "$GEN"/inspector/*.cpp; do
            [ -f "$source" ] || continue
            cp "$source" "$FWD/"
          done
          # WKC's static archive now includes the local Inspector backend and
          # agents, so these protocol-generated implementation files are
          # required just like their headers. Fail rather than silently ship a
          # debugger-enabled but incomplete archive.
          for expected in InspectorBackendDispatchers.cpp InspectorFrontendDispatchers.cpp InspectorProtocolObjects.cpp; do
            if [ ! -s "$FWD/$expected" ]; then
              echo "::error::Missing generated JavaScript Inspector source: $FWD/$expected"
              exit 1
            fi
          done
          echo "Generated inspector headers:"; ls "$FWD"/Inspector*.h
          echo "Generated inspector sources:"; ls "$FWD"/Inspector*.cpp

      - name: Copy generated files into build tree
        run: |
          cp $GITHUB_WORKSPACE/.generated-cache/*.h $GITHUB_WORKSPACE/Source/WebCore/WebCore/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.generated-cache/*.cpp $GITHUB_WORKSPACE/Source/WebCore/WebCore/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.generated-jsc-cache/Bytecodes.h $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.generated-jsc-cache/BytecodeStructs.h $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.generated-jsc-cache/BytecodeIndices.h $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/ 2>/dev/null || true
          find $GITHUB_WORKSPACE/.generated-jsc-cache -name "*.h" \
            -exec cp {} $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/ \; 2>/dev/null || true
          find $GITHUB_WORKSPACE/.generated-jsc-cache -name "*.cpp" \
            -exec cp {} $GITHUB_WORKSPACE/Source/JavaScriptCore/JavaScriptCore/ \; 2>/dev/null || true

      # The normal WebCore CMake graph generates thousands of bindings and derived
      # headers. The standalone Wii U CMake target doesn't load that graph, so invoke
      # the same upstream generators here and put only their outputs in the ignored
      # generated directory / working checkout.
      - name: Generate WebCore derived sources and DOM bindings for WKC
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/Source/WebKit/WKC/scripts/generate-webcore-derived-sources.py"

      - name: Restore CMake build
        id: cache-cmake-build
        uses: actions/cache/restore@v5.0.4
        with:
          path: build
          # Incremental object cache. Each run saves a fresh entry (unique run_id)
          # and restores the most recent via the restore-keys prefix, so already
          # compiled *.obj persist across runs. The Build step touches restored
          # objects so ninja skips them and only (re)builds files whose object is
          # missing (the still-failing set). The 'inc-' prefix (bumped from w2-)
          # forces this one run to start with no build cache = a clean full build
          # that establishes the complete set of passing objects.
          key: cmake-build-inc2-${{ github.run_id }}
          restore-keys: |
            cmake-build-inc2-

      - name: Add devkitPPC to PATH
        run: |
          echo "/opt/devkitpro/devkitPPC/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin"      >> $GITHUB_PATH

      # devkitPPC's newlib omits some POSIX thread-scheduling entry points
      # (runtime pthread_setschedparam, the pthread_attr scheduling-policy
      # setters, sched_get_priority_min/max). The WKC port *implements* them in
      # Source/WTF/wtf/wiiu/PthreadSchedCompatWKC.cpp (backed by the thread peer
      # -> OSSetThreadPriority). Declare them in the toolchain headers so the
      # standard pthread API is genuinely complete and usable. Idempotent; the
      # container is ephemeral so this only touches this build.
      - name: Provide POSIX thread-scheduling shims for devkitPPC
        run: |
          PTH=/opt/devkitpro/devkitPPC/powerpc-eabi/include/pthread.h
          SCH=/opt/devkitpro/devkitPPC/powerpc-eabi/include/sched.h
          if [ -f "$PTH" ] && ! grep -q 'WKC pthread scheduling shims' "$PTH"; then
            {
              echo ''
              echo '/* --- WKC pthread scheduling shims (implemented in PthreadSchedCompatWKC.cpp) --- */'
              echo '#include <sched.h>'
              echo '#ifdef __cplusplus'
              echo 'extern "C" {'
              echo '#endif'
              echo 'int pthread_setschedparam(pthread_t, int, const struct sched_param *);'
              echo 'int pthread_attr_setschedpolicy(pthread_attr_t *, int);'
              echo 'int pthread_attr_setinheritsched(pthread_attr_t *, int);'
              echo '#ifdef __cplusplus'
              echo '}'
              echo '#endif'
            } >> "$PTH"
            echo "Declared pthread_setschedparam/attr scheduling setters in $PTH"
          fi
          if [ -f "$SCH" ] && ! grep -q 'WKC sched shims' "$SCH"; then
            {
              echo ''
              echo '/* --- WKC sched shims (implemented in PthreadSchedCompatWKC.cpp) --- */'
              echo '#ifdef __cplusplus'
              echo 'extern "C" {'
              echo '#endif'
              echo 'int sched_get_priority_min(int);'
              echo 'int sched_get_priority_max(int);'
              echo '#ifdef __cplusplus'
              echo '}'
              echo '#endif'
            } >> "$SCH"
            echo "Declared sched_get_priority_min/max in $SCH"
          fi

      # Probe whether the devkitPPC/WUT toolchain declares the pthread functions
      # upstream ThreadingPOSIX.cpp needs -- especially the GC thread-suspend trio
      # (pthread_kill + SIGUSR1 + POSIX semaphores). This tells us up front whether
      # the "use upstream pthreads" threading strategy (approach B) is viable.
      - name: Probe pthread capabilities
        run: |
          GXX=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-g++
          FLAGS="-mcpu=750 -meabi -mhard-float -I/opt/devkitpro/wut/include"
          probe() {
            printf '#include <pthread.h>\n#include <signal.h>\n#include <semaphore.h>\nvoid* f(){ return (void*)&%s; }\n' "$1" > /tmp/p.cpp
            if $GXX $FLAGS -c /tmp/p.cpp -o /tmp/p.o 2>/tmp/p.err; then
              echo "  AVAILABLE: $1"
            else
              echo "  MISSING:   $1  -- $(grep -m1 -iE 'error|not declared|No such' /tmp/p.err | sed 's/.*error: //')"
            fi
          }
          # Compile-probe a code snippet (not just a symbol address). Used for
          # types/macros that "probe" (which takes &symbol) cannot express.
          snippet_probe() {
            printf '#include <pthread.h>\n#include <sched.h>\n#include <signal.h>\nint g(){ %s }\n' "$2" > /tmp/s.cpp
            if $GXX $FLAGS -c /tmp/s.cpp -o /tmp/s.o 2>/tmp/s.err; then
              echo "  AVAILABLE: $1"
            else
              echo "  MISSING:   $1  -- $(grep -m1 -iE 'error|not declared|No such' /tmp/s.err | sed 's/.*error: //')"
            fi
          }
          {
            echo "===== pthread capability probe (approach B viability) ====="
            for s in pthread_create pthread_join pthread_detach pthread_self \
                     pthread_kill pthread_setname_np pthread_setschedparam \
                     sem_init sem_wait sem_post sem_destroy sigaction sigemptyset; do
              probe "$s"
            done
            echo "(pthread_kill + sem_* + sigaction present => GC thread-suspend works => B is viable)"
            echo "===== creation-time scheduling probe (attr-based, for Wii U priority) ====="
            # pthread_setschedparam / attr scheduling setters / sched_get_priority_*
            # are provided by the WKC port (PthreadSchedCompatWKC.cpp, declared in
            # the toolchain headers by the "Provide POSIX thread-scheduling shims"
            # step), so they now resolve like the native pthread API.
            for s in pthread_setschedparam pthread_attr_setschedparam pthread_attr_setschedpolicy \
                     pthread_attr_setinheritsched pthread_attr_getschedparam \
                     sched_get_priority_min sched_get_priority_max; do
              probe "$s"
            done
            snippet_probe "struct sched_param"        "struct sched_param p; p.sched_priority = 0; return p.sched_priority;"
            snippet_probe "PTHREAD_EXPLICIT_SCHED"    "return PTHREAD_EXPLICIT_SCHED;"
            snippet_probe "SCHED_FIFO/RR/OTHER"       "return SCHED_FIFO + SCHED_RR + SCHED_OTHER;"
            echo "===== VERDICT ====="
            echo "  threading:       OK  (GC suspend/resume viable via pthread_kill + sem_* + sigaction)"
            echo "  thread priority: OK  (pthread scheduling API provided; applied via peer -> OSSetThreadPriority)"
          } | tee "$GITHUB_WORKSPACE/pthread_probe.txt"

      # The WKC port bridges upstream WebKit value types (WebCore geometry, WTF
      # String, WTF URL) to its own peer/wrapper types via converting constructors
      # and conversion operators. ACCESS declared those as members inside the
      # upstream headers; pristine upstream WebKit does not have them. We must NOT
      # edit the upstream headers in-repo (they'd be lost/conflict on the next
      # WebKit merge), so we inject the interop member declarations into the
      # checked-out copies here, at build time. The out-of-line definitions live in
      # the WKC glue (WKCWrappers.cpp, WKCString.cpp, WKCKURL.cpp).
      - name: Inject WKC interop into upstream WebKit headers
        run: |
          python3 - <<'PY'
          import os, re
          ws = os.environ['GITHUB_WORKSPACE']
          gfx = os.path.join(ws, 'Source/WebCore/platform/graphics')
          wtf = os.path.join(ws, 'Source/WTF/wtf')
          # (header, class, namespace-anchor, preamble-inserted-before-anchor, [member decls])
          specs = [
            (gfx+'/IntPoint.h',   'IntPoint',   'namespace WebCore {', '#include <wkc/wkcbase.h>\n\n',
                ['IntPoint(const WKCPoint&);', 'operator WKCPoint() const;']),
            (gfx+'/IntSize.h',    'IntSize',    'namespace WebCore {', '#include <wkc/wkcbase.h>\n\n',
                ['IntSize(const WKCSize&);', 'operator WKCSize() const;']),
            (gfx+'/IntRect.h',    'IntRect',    'namespace WebCore {', '#include <wkc/wkcbase.h>\n\n',
                ['IntRect(const WKCRect&);', 'operator WKCRect() const;']),
            (gfx+'/FloatPoint.h', 'FloatPoint', 'namespace WebCore {', '#include <wkc/wkcbase.h>\n\n',
                ['FloatPoint(const WKCFloatPoint&);', 'operator WKCFloatPoint() const;', 'operator WKCPoint() const;']),
            (gfx+'/FloatSize.h',  'FloatSize',  'namespace WebCore {', '#include <wkc/wkcbase.h>\n\n',
                ['FloatSize(const WKCFloatSize&);', 'operator WKCFloatSize() const;']),
            (gfx+'/FloatRect.h',  'FloatRect',  'namespace WebCore {', '#include <wkc/wkcbase.h>\n\n',
                ['FloatRect(const WKCFloatRect&);', 'operator WKCFloatRect() const;']),
            # WTF String <-> WKC::String (bridge used by nearly every WKC helper)
            (wtf+'/text/WTFString.h', 'String', 'namespace WTF {', 'namespace WKC { class String; }\n',
                ['String(const WKC::String&);', 'operator WKC::String() const;']),
            # WTF URL <-> WKC::URL
            (wtf+'/URL.h', 'URL', 'namespace WTF {', 'namespace WKC { class URL; }\n',
                ['URL(const WKC::URL&);', 'operator WKC::URL() const;']),
            # ResourceHandle: the WKC curl backend accesses the internal via the
            # historical public getInternal(); modern upstream made the 'd' member
            # protected and dropped the accessor. Re-expose it (inline; get() only
            # needs the forward-declared ResourceHandleInternal).
            (ws+'/Source/WebCore/platform/network/ResourceHandle.h', 'ResourceHandle', 'namespace WebCore {', '',
                ['ResourceHandleInternal* getInternal() { return d.get(); }']),
          ]
          MARK = '// --- WKC interop (injected by CI) ---'
          for path, name, anchor, preamble, decls in specs:
              src = open(path).read()
              if MARK in src:
                  print('already patched:', name); continue
              if preamble.strip() not in src:
                  src = src.replace(anchor, preamble + anchor, 1)
              m = re.search(r'class\s+(?:WTF_EXPORT_PRIVATE\s+|WEBCORE_EXPORT\s+)?' + name + r'\b[^{;]*\{', src)
              if not m:
                  print('WARN class not found:', name); continue
              i, depth = m.end(), 1
              while i < len(src) and depth:
                  if src[i] == '{': depth += 1
                  elif src[i] == '}': depth -= 1
                  i += 1
              line_start = src.rfind('\n', 0, i - 1) + 1
              # A trailing "public:" section guarantees the interop members are
              # usable by callers regardless of the access specifier they follow.
              block = 'public:\n    ' + MARK + '\n' + ''.join('    ' + d + '\n' for d in decls)
              src = src[:line_start] + block + src[line_start:]
              open(path, 'w').write(src)
              print('patched:', name)
          PY

      - name: Configure (CMake)
        run: |
          cmake -S $GITHUB_WORKSPACE/Source/WebKit/WKC -B build \
            --fresh \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/Source/WebKit/WKC/cmake/WiiUToolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DWKC_ENABLE_FULL_WEBCORE=OFF \
            -DWKC_ENABLE_WEB_AUDIO=ON \
            -DWKC_ENABLE_INDEXED_DATABASE=ON \
            -DWKC_ENABLE_GAMEPAD=ON \
            -DWKC_ENABLE_WEBRTC_API=ON \
            -DWKC_ENABLE_WEB_INSPECTOR=ON
          ccache --zero-stats || true

      # Generate LLIntAssembly.h (the C_LOOP interpreter body that
      # LowLevelInterpreter.cpp #includes) OUTSIDE the CMake build graph, so a
      # failure here can only leave that one file unable to find its header --
      # it can never zero the build. Runs after Configure so it can reuse the
      # exact per-TU compile flags CMake recorded in compile_commands.json to
      # compile the offset extractors identically (offsets are target-specific).
      # asm.rb reads struct offsets from magic markers in the compiled ELF
      # object, so the extractors only need to compile (-c), never link.
      - name: Generate LLIntAssembly.h (isolated; never fails the build)
        shell: bash
        run: |
          set +e
          JSC=$GITHUB_WORKSPACE/Source/JavaScriptCore
          GEN=$GITHUB_WORKSPACE/.llint
          GXX=$DEVKITPPC/bin/powerpc-eabi-g++
          mkdir -p "$GEN"
          echo "=== LLInt 1/6: InitBytecodes.asm ==="
          ruby $JSC/generator/main.rb --bytecodes_h $GEN/Bytecodes.h --init_bytecodes_asm $GEN/InitBytecodes.asm --bytecode_structs_h $GEN/BytecodeStructs.h --bytecode_indices_h $GEN/BytecodeIndices.h $JSC/bytecode/BytecodeList.rb --wasm_json $JSC/wasm/wasm.json --bytecode_dumper $GEN/BytecodeDumperGenerated.cpp
          echo "=== LLInt 2/6: LLIntDesiredSettings.h ==="
          ruby $JSC/offlineasm/generate_settings_extractor.rb -I$GEN/ $JSC/llint/LowLevelInterpreter.asm $GEN/LLIntDesiredSettings.h C_LOOP
          # Reuse CMake's exact flags for a JSC TU (minus per-file -c/-o/-M* and the compiler).
          FLAGS=$(python3 -c "import json,shlex; cc=json.load(open('build/compile_commands.json')); e=next(x for x in cc if '/JavaScriptCore/' in x['file'] and x['file'].endswith('.cpp')); a=shlex.split(e['command']); skip=('-c','-o','-MT','-MF','-MD'); print(' '.join(t for k,t in enumerate(a) if k>=2 and t not in skip and not t.endswith(('.cpp','.obj','.d'))))")
          echo "=== LLInt 3/6: compile LLIntSettingsExtractor.o ==="
          $GXX $FLAGS -I$GEN -c $JSC/llint/LLIntSettingsExtractor.cpp -o $GEN/LLIntSettingsExtractor.o
          echo "=== LLInt 4/6: LLIntDesiredOffsets.h ==="
          ruby $JSC/offlineasm/generate_offset_extractor.rb -I$GEN/ $JSC/llint/LowLevelInterpreter.asm $GEN/LLIntSettingsExtractor.o $GEN/LLIntDesiredOffsets.h C_LOOP normal
          echo "=== LLInt 5/6: compile LLIntOffsetsExtractor.o ==="
          $GXX $FLAGS -I$GEN -c $JSC/llint/LLIntOffsetsExtractor.cpp -o $GEN/LLIntOffsetsExtractor.o
          echo "=== LLInt 6/6: LLIntAssembly.h ==="
          ruby $JSC/offlineasm/asm.rb -I$GEN/ $JSC/llint/LowLevelInterpreter.asm $GEN/LLIntOffsetsExtractor.o $JSC/llint/LLIntAssembly.h normal --binary-format=ELF
          if [ -s $JSC/llint/LLIntAssembly.h ]; then echo "LLIntAssembly.h GENERATED ($(wc -l < $JSC/llint/LLIntAssembly.h) lines)"; else echo "LLIntAssembly.h MISSING — LowLevelInterpreter.cpp will fail, build continues"; fi
          exit 0

      - name: Build WKC library
        id: build-wkc
        shell: bash
        run: |
          # Incremental strategy (see "Cache CMake build"): objects restored from a
          # previous run are marked up-to-date so ninja skips them and only builds
          # files whose object is missing (the still-failing set) — checkout resets
          # source mtimes to "now", so without this every object would look stale
          # and rebuild. On the first (full) run there are no objects yet, so this
          # is a no-op and everything builds.
          # CONSTRAINT: only edit still-failing .cpp files. A file that already has
          # an object won't rebuild here unless its .obj is removed; if a fix must
          # touch a file that already compiled, delete its object first.
          if [ -d build ]; then
            find build -name '*.obj' -exec touch {} + 2>/dev/null || true
          fi
          # Keep collecting the compiler diagnostics, but preserve the actual
          # CMake/Ninja exit code so failed translation units cannot be packaged.
          set +e
          cmake --build build --parallel $(nproc) -- -k 0 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "===== ccache stats ====="
          ccache --show-stats || true
          echo "===== pthread capability probe (from earlier step) ====="
          cat "$GITHUB_WORKSPACE/pthread_probe.txt" 2>/dev/null || true
          echo "===== FAILED translation units: $(grep -c '^FAILED:' build.log) ====="
          # ninja prints 'FAILED: <target>' per failed edge; list the source files
          # so each fast round is a precise burn-down scoreboard.
          grep '^FAILED:' build.log \
            | sed -E 's#.*/(Source/[^ ]+\.(cpp|obj)).*#\1#; s#\.obj$##' \
            | sort -u || true
          echo "===== distinct compiler errors (top 50, numbers normalized) ====="
          grep -hoE 'error: .*' build.log | sed -E 's/[0-9]+/N/g' \
            | sort | uniq -c | sort -rn | head -50 || true
          echo "===== WTF-file errors (file: first error) ====="
          awk '/^FAILED:.*Source\/WTF\// {f=1} /error:/ && f {print; f=0}' build.log \
            | sed -E 's#.*(Source/WTF/[^ :]+).*(error:.*)#\1  \2#' | sort -u | head -40 || true
          echo "===== WTF warnings: distinct types (count) ====="
          # Warnings only surface for files actually (re)compiled this run; a warm
          # ccache leaves cached files silent, so a full/cold build is needed to see
          # them all. Scoped to Source/WTF; numbers normalized to group variants.
          grep -hoE 'Source/WTF/[^ ]+ ?.*warning: .*' build.log \
            | sed -E 's#.*(warning:.*)#\1#; s/[0-9]+/N/g' \
            | sort | uniq -c | sort -rn | head -50 || true
          echo "===== WTF warnings in wtf/wiiu (our files) ====="
          grep -hE 'Source/WTF/wtf/wiiu/[^ ]+:[0-9]+.*warning:' build.log \
            | sed -E 's#.*(Source/WTF/wtf/wiiu/[^ ]+:[0-9]+):[0-9]+: (warning:.*)#\1  \2#' \
            | sort -u | head -40 || true
          echo "===== WTF warnings (file:line, deduped) ====="
          grep -hoE 'Source/WTF/[^ ]+:[0-9]+:[0-9]+: warning: .*' build.log \
            | sort -u | head -40 || true
          echo "===== WKC-glue file -> first error (scoreboard) ====="
          awk '
            /^FAILED:.*WebKitWKC.dir\/(helpers|WebCoreSupport|webkit|accessor)\// {
              f=$0; sub(/.*WebKitWKC.dir\//,"",f); sub(/\.obj.*/,"",f); seen=0; next
            }
            /error:/ && f && !seen { sub(/^.*error:/,"error:",$0); print f "  " $0; seen=1 }
          ' build.log | sort -u | head -120 || true
          echo "===== CoreFoundation include chain (first occurrence) ====="
          awk '
            /In file included from/ { buf=$0; capturing=1; next }
            capturing && /^ *from / { buf=buf "\n" $0; next }
            capturing && /CoreFoundation\/CoreFoundation.h: No such file/ { print buf "\n" $0; exit }
            { capturing=0 }
          ' build.log | head -40 || true
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::WebKit WKC compilation failed (exit $BUILD_STATUS); refusing to package an incomplete libWebKitWKC.a."
            exit "$BUILD_STATUS"
          fi

      # Save the object directory before later feature checks can fail the job.
      - name: Save CMake build cache
        if: always() && steps.build-wkc.outcome == 'success' && steps.cache-cmake-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.4
        with:
          path: build
          key: cmake-build-inc2-${{ github.run_id }}

      # Apply port-only patches before either full WebCore+WebRTC or the standalone
      # WebRTC diagnostic build. The script only edits the ephemeral CI checkout; the
      # tracked vendored upstream source is left unchanged.
      - name: Apply Wii U-only WebRTC compatibility patches (temporary checkout)
        shell: bash
        run: |
          set +e
          python3 -m py_compile "$GITHUB_WORKSPACE/Source/WebKit/WKC/scripts/prepare-webrtc-wiiu.py" \
            > webrtc-pycompile.log 2>&1
          PY_COMPILE_STATUS=$?
          cat webrtc-pycompile.log
          if [ "$PY_COMPILE_STATUS" -ne 0 ]; then
            echo "ERROR: Wii U WebRTC patch script has a Python syntax error."
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/Source/WebKit/WKC/scripts/prepare-webrtc-wiiu.py" \
            --repo-root "$GITHUB_WORKSPACE" > webrtc-patches.log 2>&1
          PATCH_STATUS=$?
          cat webrtc-patches.log
          if [ "$PATCH_STATUS" -ne 0 ]; then
            echo "Wii U compatibility patching was incomplete; continue to capture compiler diagnostics."
          fi
          exit 0

      # This independent diagnostic target previously bypassed ccache and had no
      # build-directory cache, so every run recompiled 1,700+ WebRTC objects.
      - name: Restore libwebrtc build
        id: cache-webrtc
        uses: actions/cache/restore@v5.0.4
        with:
          path: build-webrtc
          key: libwebrtc-wiiu-${{ hashFiles('Source/ThirdParty/libwebrtc/Source/**/*', 'Tools/wiiu/libwebrtc/**/*', 'Source/WebKit/WKC/cmake/WebRTCPlatform.cmake', 'Source/WebKit/WKC/cmake/WiiUToolchain.cmake', 'Source/WebKit/WKC/scripts/prepare-webrtc-wiiu.py') }}
          restore-keys: |
            libwebrtc-wiiu-

      # A miss is normal on the first run that introduces this cache, or whenever
      # the cache key's source/toolchain inputs change. The post-job cache action saves
      # build-webrtc after the diagnostic step has populated it.
      - name: Report libwebrtc build cache status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.cache-webrtc.outputs.cache-hit }}" = "true" ]; then
            echo "Exact libwebrtc build cache restored."
          elif [ -f build-webrtc/build.ninja ]; then
            echo "::notice::No exact libwebrtc cache hit; a compatible build directory was restored and Ninja/ccache will validate or rebuild stale outputs."
          else
            echo "::notice::No prior libwebrtc build cache exists yet. This run will seed it; the cache is saved at job completion."
          fi

      # On an exact cache hit the inputs/config are identical. Checkout restores
      # fresh source mtimes, so re-stamp cached objects after the WKC-only patch
      # script has run; partial cache restores are not touched and rebuild normally.
      - name: Reuse cached libwebrtc objects
        if: steps.cache-webrtc.outputs.cache-hit == 'true'
        run: |
          if [ -f build-webrtc/build.ninja ]; then
            find build-webrtc -name '*.obj' -exec touch {} + 2>/dev/null || true
          fi

      # The engine's required job is real webpage loading: full WebCore DOM,
      # HTML, CSS, loader, layout/rendering, SVG, and JavaScriptCore. Web Audio
      # and WebRTC are not required for page loading, so keep them off here to
      # avoid making the full page engine depend on unrelated media stacks.
      # This is a required build, not a diagnostic probe: do not publish a
      # bootstrap-only archive as a substitute if the full engine fails.
      - name: Build full WebKit page engine (Wii U PPC)
        id: full-engine-probe
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "engine_ready=false" >> "$GITHUB_OUTPUT"
          set +e
          cmake -S "$GITHUB_WORKSPACE/Source/WebKit/WKC" -B build-full --fresh \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Source/WebKit/WKC/cmake/WiiUToolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DWKC_ENABLE_FULL_WEBCORE=ON \
            -DWKC_ENABLE_WEB_AUDIO=ON \
            -DWKC_ENABLE_INDEXED_DATABASE=ON \
            -DWKC_ENABLE_GAMEPAD=ON \
            -DWKC_ENABLE_WEBASSEMBLY=ON \
            -DWKC_ENABLE_WEBRTC_API=ON \
            -DWKC_ENABLE_WEB_INSPECTOR=ON \
 > build-full-configure.log 2>&1
          CONFIG_STATUS=$?

          # Preserve the source-list omission report even if the engine compile fails.
          if [ -s build-full/wkc-missing-webcore-sources.txt ]; then
            mkdir -p "$GITHUB_WORKSPACE/dist/diagnostics"
            cp build-full/wkc-missing-webcore-sources.txt "$GITHUB_WORKSPACE/dist/diagnostics/"
            MISSING_SOURCE_COUNT=$(grep -vc '^None$' build-full/wkc-missing-webcore-sources.txt || true)
            echo "===== WebCore Sources.txt entries omitted before compile: ${MISSING_SOURCE_COUNT:-0} ====="
            sed -n '1,80p' build-full/wkc-missing-webcore-sources.txt
          fi
          if [ "$CONFIG_STATUS" -ne 0 ] || [ ! -f build-full/build.ninja ]; then
            echo "===== full WebKit page-engine configure failed ====="
            grep -A5 -iE 'CMake Error|FATAL|Error' build-full-configure.log | head -100 || true
            tail -n 60 build-full-configure.log || true
            echo "::error::Full WebKit page-engine configuration failed; refusing to publish the bootstrap archive as the engine."
            exit 1
          fi

          echo "===== full WebCore source selection ====="
          grep -E 'WKC full WebCore probe:' build-full-configure.log || true
          cmake --build build-full --parallel "$(nproc)" -- -k 0 2>&1 | tee build-full.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "===== full WebCore FAILED translation units: $(grep -c '^FAILED:' build-full.log) ====="
          echo "===== distinct WebCore compile errors (top 80) ====="
          grep -hoE 'error: .*' build-full.log | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -80 || true
          echo "===== first failing full-WebCore sources ====="
          grep '^FAILED:' build-full.log | sed -E 's#.*(Source/WebCore/[^ ]+\.obj).*#\1#' | sort -u | head -100 || true
          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo "Full WebCore page-engine compilation passed; packaging the full static-library bundle."
            mkdir -p "$GITHUB_WORKSPACE/dist-full/lib" "$GITHUB_WORKSPACE/dist-full/diagnostics"
            if cmake --install build-full --prefix "$GITHUB_WORKSPACE/dist-full"; then
              # A static WebKit archive does not absorb its linked static dependencies.
              # Include every archive produced by this full CMake graph, not only
              # libWebKitWKC.a, so the browser consumer can link the WebRTC stack too.
              find build-full -type f -name '*.a' -exec cp -f {} "$GITHUB_WORKSPACE/dist-full/lib/" \;
              cp build-full-configure.log "$GITHUB_WORKSPACE/dist-full/diagnostics/"
              cp build-full.log "$GITHUB_WORKSPACE/dist-full/diagnostics/"
              if [ -s build-full/wkc-missing-webcore-sources.txt ]; then
                cp build-full/wkc-missing-webcore-sources.txt "$GITHUB_WORKSPACE/dist-full/diagnostics/"
              fi

              # A successful compile is not enough if install/package output is
              # incomplete. Refuse to advertise a full-engine artifact unless the
              # actual non-empty archive, core public SDK headers and archive
              # members are present and readable by the Wii U toolchain.
              FULL_ARCHIVE="$GITHUB_WORKSPACE/dist-full/lib/libWebKitWKC.a"
              if [ ! -s "$FULL_ARCHIVE" ]; then
                echo "::error::Full WebKit build produced no non-empty libWebKitWKC.a."
                exit 1
              fi
              for header in wkcbase.h WKCWebView.h WKCClientBuilders.h; do
                if [ ! -s "$GITHUB_WORKSPACE/dist-full/include/wkc/$header" ]; then
                  echo "::error::Full WebKit SDK header is missing: include/wkc/$header"
                  exit 1
                fi
              done
              MEMBER_COUNT=$("$DEVKITPPC/bin/powerpc-eabi-ar" t "$FULL_ARCHIVE" 2>/dev/null | wc -l)
              if [ "${MEMBER_COUNT:-0}" -lt 500 ]; then
                echo "::error::Full WebKit archive has only ${MEMBER_COUNT:-0} members; refusing to publish an incomplete engine."
                exit 1
              fi
              echo "Full WebKit archive verified: $MEMBER_COUNT members." | tee -a "$GITHUB_WORKSPACE/dist-full/BUILD_PROFILE.txt"
              {
                echo "Profile: Full WebKit page engine (DOM/HTML/CSS/loader/layout/rendering + JavaScriptCore)"
                echo "Target: Wii U PowerPC 750 / devkitPPC"
                echo "JavaScriptCore: CLoop interpreter; JIT disabled for Wii U"
                echo "WebAssembly: disabled pending a Wii U PowerPC calling-convention implementation"
                echo "Web Audio: disabled; not required for page loading"
                echo "WebRTC: disabled; not required for page loading"
                echo "Verification: full WebCore CMake build and install passed"
                echo "Not yet verified: Wave Browser final executable link or on-console runtime"
                echo
                echo "Static archives included:"
                find "$GITHUB_WORKSPACE/dist-full/lib" -maxdepth 1 -type f -name '*.a' -printf '%f\n' | sort
              } > "$GITHUB_WORKSPACE/dist-full/BUILD_PROFILE.txt"
              echo "engine_ready=true" >> "$GITHUB_OUTPUT"
              echo "Full WebKit page-engine bundle ready at dist-full/."
            else
              echo "::error::Full WebKit page engine compiled but CMake install failed."
              exit 1
            fi
          else
            echo "::error::Full WebKit page-engine build failed; refusing to publish a bootstrap-only archive as the engine."
            exit 1
          fi

      # Publish the successfully built page engine as a public release asset.
      # GitHub Actions artifacts are not a reliable cross-repository download
      # mechanism for Wave Browser's repository-scoped GITHUB_TOKEN. A release
      # asset is public, versioned to this exact source SHA, and needs no user token.
      - name: Publish full page-engine release asset
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.full-engine-probe.outputs.engine_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="webkit-wiiu-full-engine.tar.gz"
          tar -czf "$ASSET" -C dist-full .
          test -s "$ASSET"
          TAG="engine-$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "WebKit Wii U Engine $GITHUB_SHA" \
              --notes "Full WebKit page-engine bundle built from commit $GITHUB_SHA. See BUILD_PROFILE.txt for enabled and disabled features."
          fi

      # This is a required feature build, not a diagnostic-only probe. Fail before
      # Collect output/upload steps if WebRTC cannot produce its real static archive.
      - name: Build libwebrtc static archive for Wii U (PPC)
        id: build-webrtc
        shell: bash
        run: |
          set +e
          cmake -S "$GITHUB_WORKSPACE/Tools/wiiu/libwebrtc" -B build-webrtc -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Source/WebKit/WKC/cmake/WiiUToolchain.cmake" \
            -DLIBWEBRTC_DIR="$GITHUB_WORKSPACE/Source/ThirdParty/libwebrtc" \
            -DCMAKE_PROJECT_libwebrtc_wiiu_INCLUDE="$GITHUB_WORKSPACE/Source/WebKit/WKC/cmake/WebRTCPlatform.cmake" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            > webrtc-configure.log 2>&1
          CONFIG_STATUS=$?
          echo "configure_status=$CONFIG_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$CONFIG_STATUS" -ne 0 ] || [ ! -f build-webrtc/build.ninja ]; then
            echo "===== libwebrtc configure: FAILED (exit $CONFIG_STATUS) ====="
            grep -A6 -iE 'CMake Error|FATAL' webrtc-configure.log | head -80 || true
            tail -n 60 webrtc-configure.log || true
            echo "::error::libwebrtc CMake configuration failed; no feature archive will be published."
            ccache --show-stats || true
            exit 1
          fi

          echo "===== libwebrtc configure: OK ====="
          cmake --build build-webrtc --parallel "$(nproc)" -- -k 0 2>&1 | tee webrtc-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          FAILED_COUNT=$(grep -c '^FAILED:' webrtc-build.log || true)
          echo "===== libwebrtc build exit status: $BUILD_STATUS ====="
          echo "===== libwebrtc FAILED objects: $FAILED_COUNT ====="
          echo "===== ccache stats after libwebrtc build ====="
          ccache --show-stats || true
          echo "----- distinct compile errors (top 60, normalized) -----"
          grep -hoE 'error: .*' webrtc-build.log \
            | sed -E 's/[0-9]+/N/g; s/0x[0-9a-fA-F]+/0xN/g' \
            | sort | uniq -c | sort -rn | head -60 || true
          echo "----- first failing sources -----"
          grep '^FAILED:' webrtc-build.log \
            | sed -E 's#.*/(Source/[^ ]+)\.obj[^ ]*#\1#; s#.*/(Source/[^ ]+)\.o[^ ]*#\1#' \
            | sort -u | head -40 || true
          echo "----- first FAILED command block (full, to diagnose) -----"
          awk '/^FAILED:/{c++} c==1{print} c==2{exit}' webrtc-build.log | head -30 || true

          if [ "$BUILD_STATUS" -ne 0 ] || [ "$FAILED_COUNT" -ne 0 ]; then
            echo "::error::libwebrtc PowerPC cross-compile failed (exit $BUILD_STATUS; failed objects $FAILED_COUNT). Stopping before output collection; no empty/missing feature .a will be packaged."
            exit 1
          fi

          WEBRTC_ARCHIVE=$(find build-webrtc -type f \( -name 'libwebrtc.a' -o -name 'webrtc.a' \) -size +0c -print -quit)
          if [ -z "$WEBRTC_ARCHIVE" ]; then
            echo "::error::All libwebrtc compile steps passed but the required non-empty libwebrtc.a archive was not produced. Stopping before output collection."
            find build-webrtc -type f -name '*.a' -printf 'Found archive candidate: %p (%s bytes)\n' | head -80 || true
            exit 1
          fi
          AR="$DEVKITPPC/bin/powerpc-eabi-ar"
          MEMBER_COUNT=$("$AR" t "$WEBRTC_ARCHIVE" 2>/dev/null | wc -l)
          if [ "${MEMBER_COUNT:-0}" -lt 1 ]; then
            echo "::error::The generated libwebrtc.a is empty or unreadable: $WEBRTC_ARCHIVE"
            exit 1
          fi

          mkdir -p dist-webrtc/lib/deps dist-webrtc/diagnostics
          cp "$WEBRTC_ARCHIVE" dist-webrtc/lib/libwebrtc.a
          while IFS= read -r archive; do
            [ "$archive" = "$WEBRTC_ARCHIVE" ] && continue
            relative_path="${archive#build-webrtc/}"
            mkdir -p "dist-webrtc/lib/deps/$(dirname "$relative_path")"
            cp -f "$archive" "dist-webrtc/lib/deps/$relative_path"
          done < <(find build-webrtc -type f -name '*.a' -size +0c | sort)
          for log in webrtc-pycompile.log webrtc-patches.log webrtc-configure.log webrtc-build.log; do
            [ ! -f "$log" ] || cp "$log" dist-webrtc/diagnostics/
          done
          {
            echo "Profile: standalone libwebrtc static archive bundle"
            echo "Target: Wii U PowerPC 750 / devkitPPC"
            echo "Main archive: lib/libwebrtc.a"
            echo "Verification: CMake/Ninja build passed with zero failed objects; archive is non-empty"
            echo "Runtime status: hardware networking/ICE/capture not verified; the WKC ifaddrs declarations are not themselves an interface-enumeration implementation"
            echo
            echo "Static archives included:"
            find dist-webrtc/lib -type f -name '*.a' -printf '%P\n' | sort
          } > dist-webrtc/BUILD_PROFILE.txt
          echo "===== libwebrtc archive verified: $WEBRTC_ARCHIVE ($MEMBER_COUNT members) ====="

      # Save compiler output and partial object directory even when the required
      # feature build fails. Cache writes happen before normal output steps, which
      # GitHub skips after the hard failure above.
      - name: Save ccache before WebRTC failure gate
        if: always() && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}

      - name: Save libwebrtc build cache before failure gate
        if: always() && steps.cache-webrtc.outputs.cache-hit != 'true' && steps.build-webrtc.outcome != 'skipped'
        uses: actions/cache/save@v5.0.4
        with:
          path: build-webrtc
          key: libwebrtc-wiiu-${{ hashFiles('Source/ThirdParty/libwebrtc/Source/**/*', 'Tools/wiiu/libwebrtc/**/*', 'Source/WebKit/WKC/cmake/WebRTCPlatform.cmake', 'Source/WebKit/WKC/cmake/WiiUToolchain.cmake', 'Source/WebKit/WKC/scripts/prepare-webrtc-wiiu.py') }}

      - name: Collect output
        run: |
          mkdir -p dist/lib dist/include dist/diagnostics
          cat > dist/BUILD_PROFILE.txt <<'PROFILE'
          Profile: WKC bootstrap archive (not the complete WebCore engine)
          Includes: selected WTF/JSC interpreter sources, WKC glue and selected platform backends
          Excludes: the full DOM/HTML/CSS/rendering source list and the experimental WebRTC linkage
          This is the bootstrap WKC archive only; Wave Browser must use the separately published webkit-wiiu-full-engine bundle.
          PROFILE
          # Preserve build logs with the library artifact so porting errors can be
          # inspected without relying on truncated Actions console output.
          for log in build.log build-full-configure.log build-full.log \
                     webrtc-pycompile.log webrtc-patches.log \
                     webrtc-configure.log webrtc-build.log; do
            if [ -f "$log" ]; then cp "$log" dist/diagnostics/; fi
          done

          # Use the archive produced by CMake itself. Never fabricate a named
          # but empty archive or quietly rebuild a different archive from a partial
          # set of object files; a successful artifact must pass a real archive check.
          ARCHIVE="$GITHUB_WORKSPACE/build/libWebKitWKC.a"
          if [ ! -s "$ARCHIVE" ]; then
            echo "ERROR: CMake did not produce a non-empty libWebKitWKC.a"
            exit 1
          fi
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-ar t "$ARCHIVE" > dist/diagnostics/bootstrap-archive-members.txt
          MEMBER_COUNT=$(wc -l < dist/diagnostics/bootstrap-archive-members.txt)
          echo "CMake archive contains $MEMBER_COUNT members"
          if [ "$MEMBER_COUNT" -lt 500 ]; then
            echo "ERROR: libWebKitWKC.a has only $MEMBER_COUNT members; refusing to publish an incomplete bootstrap archive"
            exit 1
          fi
          cp "$ARCHIVE" dist/lib/libWebKitWKC.a
          echo "Archive members verified: $MEMBER_COUNT" >> dist/BUILD_PROFILE.txt
          ls -lh dist/lib/libWebKitWKC.a
          cp -r Source/WebKit/WKC/include/wkc dist/include/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: webkit-wiiu-lib
          path: dist/
          retention-days: 30

      - name: Upload full WebKit page-engine bundle
        if: ${{ !cancelled() && steps.full-engine-probe.outputs.engine_ready == 'true' }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: webkit-wiiu-full-engine
          path: dist-full/
          retention-days: 30

      - name: Upload standalone libwebrtc feature bundle
        uses: actions/upload-artifact@v7.0.0
        with:
          name: webkit-wiiu-libwebrtc
          path: dist-webrtc/
          retention-days: 30

      # Keep compiler diagnostics available even when the required full page
      # engine build fails. The full engine must never silently fall back to the
      # bootstrap archive, so these logs are the recovery path for build failures.
      - name: Upload WebKit build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: webkit-wiiu-build-diagnostics
          path: |
            build.log
            build-full-configure.log
            build-full.log
            build-full/wkc-missing-webcore-sources.txt
            webrtc-configure.log
            webrtc-build.log
          if-no-files-found: ignore
          retention-days: 14
