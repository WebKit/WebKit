<!DOCTYPE html>
<html class="reftest-wait"><meta charset="utf-8">
<title>Native selection overrides a custom-highlighted assembly</title>
<style>
@font-face { font-family: Operators; src: url("../imported/w3c/web-platform-tests/fonts/math/operators.woff"); }
body { margin: 0; }
.cell { display: inline-block; position: relative; width: 150px; height: 160px; padding: 20px; vertical-align: top; }
math { font: 20px Operators; }
mo::highlight(probe) { color: blue; }
mo::highlight(background) { color: transparent; background: rgba(0, 255, 0, .5); }
mo::highlight(lower) { color: transparent; background: rgba(255, 0, 0, .5); }
mo::highlight(upper) { background: rgba(0, 255, 0, .5); }
.background { position: absolute; z-index: -1; }
mo::selection { color: purple; background: transparent; }
mo { color:purple; }
</style><body>
<div class="cell"><math><mo id="vertical" lspace="0" rspace="0" symmetric="false">{</mo><mspace height="6em"/></math></div>

<script>
const reference = true;
const nextFrame = () => new Promise(requestAnimationFrame);
const rangeFor = node => { const range = new Range(); range.selectNodeContents(node); return range; };
const background = (token, width, height, color = "rgba(0,255,0,.5)", x = 0, y = 0) => {
    const rect = token.getBoundingClientRect();
    const box = document.createElement("div");
    box.className = "background";
    Object.assign(box.style, { left: `${rect.left + x}px`, top: `${rect.top + y}px`, width: `${width}px`, height: `${height}px`, background: color });
    document.body.append(box);
};
window.addEventListener("load", async () => {
    await document.fonts.ready;
    const token = document.querySelector("mo");
    const range = rangeFor(token);
    if (!reference) {
        CSS.highlights.set("probe", new Highlight(range));
        getSelection().addRange(range);
    }
    await nextFrame(); await nextFrame();
    document.documentElement.classList.remove("reftest-wait");
});
</script></body></html>
