<!DOCTYPE html>
<html class="reftest-wait"><meta charset="utf-8">
<title>Operator backgrounds use an em box and exclude spacing, border, and padding</title>
<style>
@font-face { font-family: Operators; src: url("../imported/w3c/web-platform-tests/fonts/math/operators.woff"); }
body { margin: 0; }
.cell { display: inline-block; position: relative; width: 150px; height: 160px; padding: 20px; vertical-align: top; }
math { font: 20px Operators; }
mo::highlight(probe) { color: blue; }
mo::highlight(background) { color: transparent; background: rgba(0, 255, 0, .5); }
mo::highlight(lower) { color: transparent; background: rgba(255, 0, 0, .5); }
mo::highlight(upper) { background: rgba(0, 255, 0, .5); }
.background { position: absolute; z-index: -1; }
@font-face { font-family: Thin; src: url("resources/highlight-operators.woff"); }
math { font-family: Thin; }
.background { z-index: auto; }
#minus, #rtl { color:transparent; } #foreground { color:blue; }
</style><body>
<div class="cell"><math><mo id="minus" lspace="8px" rspace="12px" style="border:3px solid black;padding:4px">-</mo></math></div>
<div class="cell"><math dir="rtl"><mo id="rtl" lspace="8px" rspace="12px" style="border:3px solid black;padding:4px">−</mo></math></div>
<div class="cell"><math><mo id="foreground" lspace="0" rspace="0">-</mo></math></div>

<script>
const reference = true;
const nextFrame = () => new Promise(requestAnimationFrame);
const rangeFor = node => { const range = new Range(); range.selectNodeContents(node); return range; };
const background = (token, width, height, color = "rgba(0,255,0,.5)", x = 0, y = 0) => {
    const rect = token.getBoundingClientRect();
    const box = document.createElement("div");
    box.className = "background";
    Object.assign(box.style, { left: `${rect.left + x}px`, top: `${rect.top + y}px`, width: `${width}px`, height: `${height}px`, background: color });
    document.body.append(box);
};
window.addEventListener("load", async () => {
    await document.fonts.ready;
    const tokens = [...document.querySelectorAll("mo")];
    const before = tokens.map(token => JSON.stringify(token.getBoundingClientRect().toJSON()));
    if (reference) {
        // Minus advance 1em, glyph top .5em above its baseline, font ascent 1em.
        // Padding/border add 7px; em top is 10px above the painted operator top.
        background(tokens[0],20,20,"rgba(0,255,0,.5)",15,-3);
        background(tokens[1],20,20,"rgba(0,255,0,.5)",19,-3);
        tokens[2].textContent = "−";
    } else {
        CSS.highlights.set("background",new Highlight(rangeFor(tokens[0]), rangeFor(tokens[1])));
        CSS.highlights.set("probe",new Highlight(rangeFor(tokens[2])));
    }
    if (tokens.some((token,i) => JSON.stringify(token.getBoundingClientRect().toJSON()) !== before[i])) document.body.textContent = "FAIL: highlights changed layout";
    await nextFrame(); await nextFrame();
    document.documentElement.classList.remove("reftest-wait");
});
</script></body></html>
