<!DOCTYPE html>
<html>
<head>
    <title>Releasing a delegated zoom out springs the page back onto the document</title>
    <style>
        body {
            margin: 0;
            width: 100%;
            height: 3000px;
            background: linear-gradient(silver, gray);
        }
    </style>
    <script src="../resources/ui-helper.js"></script>
    <script>
        if (window.testRunner) {
            testRunner.dumpAsText();
            testRunner.waitUntilDone();
        }

        // Zooming out from a point other than the one that was zoomed in at asks for a scroll position the settled page
        // can't reach: a page whose width fits the view has exactly one legal horizontal scroll position at page scale
        // 1, so keeping the pinched content under the cursor all the way down and then landing on the document are two
        // different requests. The pinch holds the anchor, off the document if that is what it takes, and the release is
        // where the page comes back to a position it can settle at - by exactly the overhang the pinch was holding, and
        // eased from where the layer actually was rather than jumped from a clamped position it was never at.
        //
        // This release also crosses the scale clamp, coming back up from the elastic range below the minimum
        // magnification, so the scale and the position spring together.
        async function anchorState()
        {
            const scale = await UIHelper.zoomScale();
            const override = await UIHelper.delegatedZoomOverrideAsText();
            const anchoringScrollPosition = override.match(/anchoring scroll position \((-?\d+), (-?\d+)\)/);
            const layerPosition = override.match(/scrolled contents layer position \((-?\d+), (-?\d+)\)/);
            if (!anchoringScrollPosition || !layerPosition)
                return { scale, x: NaN, y: NaN, layerX: NaN, layerY: NaN };

            return {
                scale,
                x: parseInt(anchoringScrollPosition[1]),
                y: parseInt(anchoringScrollPosition[2]),
                layerX: parseInt(layerPosition[1]),
                layerY: parseInt(layerPosition[2]),
            };
        }

        // The content point the cursor is over, in unscaled content coordinates.
        function contentPointUnderOrigin(state, origin)
        {
            return { x: state.x + origin.x / state.scale, y: state.y + origin.y / state.scale };
        }

        // What the document can reach at this scale. window.inner* is the viewport in content coordinates, so it
        // already covers more content as the scale falls.
        function isOnDocument(state)
        {
            const maxScrollX = document.scrollingElement.scrollWidth - window.innerWidth;
            const maxScrollY = document.scrollingElement.scrollHeight - window.innerHeight;
            return state.x >= -1 && state.y >= -1 && state.x <= maxScrollX + 1 && state.y <= maxScrollY + 1;
        }

        // The scrolled-contents layer position and the scroll position sent to the scrolling tree and the web process
        // are two expressions of the same anchoring position, so whatever is done to it has to reach both: when only
        // one of them was clamped the page tore sideways for a frame on release. WebKitTestRunner has no obscured
        // insets or header, so the content root sits at the origin and the layer just carries the scaled scroll
        // position.
        function layerPositionResult(state)
        {
            const expectedLayerX = -state.x * state.scale;
            const expectedLayerY = -state.y * state.scale;

            // Both positions are reported as integers, and the layer's is derived from the unrounded one.
            const agrees = Math.abs(state.layerX - expectedLayerX) <= 1.5 && Math.abs(state.layerY - expectedLayerY) <= 1.5;
            if (agrees)
                return `  at scale ${state.scale.toFixed(2)}: PASS (the scrolled contents layer carries the anchoring scroll position)`;

            return `  at scale ${state.scale.toFixed(2)}: FAIL (layer position (${state.layerX}, ${state.layerY}) for anchoring scroll position (${state.x}, ${state.y}), expected (${expectedLayerX.toFixed(0)}, ${expectedLayerY.toFixed(0)}))`;
        }

        async function doTest()
        {
            const output = [];
            const zoomOutOrigin = { x: 700, y: 500 };

            // Zoom in near the top left, so zooming back out from the other side of the view drives the anchor off
            // the document while the scale is still above the minimum magnification.
            await UIHelper.magnifyGestureAt(100, 100, 0.5);

            // Held, so the override is still on the layer when we read it, and continued rather than restarted, so
            // one gesture crosses page scale 1 the way a pinch out does.
            output.push('Zoomed in at (100, 100), then held a zoom out at (700, 500):');
            await UIHelper.beginMagnifyGestureAt(zoomOutOrigin.x, zoomOutOrigin.y, -0.125);
            output.push(layerPositionResult(await anchorState()));
            await UIHelper.continueMagnifyGesture(-0.125);

            const held = await anchorState();
            output.push(layerPositionResult(held));

            // Off the document is what makes the release interesting: if the held position already fits inside it,
            // the release has nothing to clamp and the test isn't reaching the case that used to fail.
            output.push(`  at scale ${held.scale.toFixed(2)}: ` + (isOnDocument(held) ? `FAIL (anchoring scroll position (${held.x}, ${held.y}) is on the document, so the release has nothing to clamp)` : 'PASS (the anchoring scroll position is held off the document)'));

            await UIHelper.endMagnifyGesture();

            // The page the web process settled on is what the cursor is left sitting over, so read the released state
            // from the document rather than from the UI process's bookkeeping.
            const released = { scale: await UIHelper.zoomScale(), x: window.scrollX, y: window.scrollY };
            const heldContentPoint = contentPointUnderOrigin(held, zoomOutOrigin);
            const releasedContentPoint = contentPointUnderOrigin(released, zoomOutOrigin);

            // What the release has to cover is the overhang: the anchor for the scale it settles at, less the nearest
            // position at that scale which is on the document. Any more than that and the release has moved the page
            // somewhere it didn't have to go; any less and it hasn't finished bringing it back. The anchor for the
            // settled scale comes from the held one, which is the same anchor read at a different scale, and
            // window.inner* is read after the release, so it is already the viewport at the settled scale.
            const anchorAtSettledScale = {
                x: held.x + zoomOutOrigin.x * (1 / held.scale - 1 / released.scale),
                y: held.y + zoomOutOrigin.y * (1 / held.scale - 1 / released.scale),
            };
            const maxScroll = { x: document.scrollingElement.scrollWidth - window.innerWidth, y: document.scrollingElement.scrollHeight - window.innerHeight };
            const overhang = {
                x: anchorAtSettledScale.x - Math.min(Math.max(anchorAtSettledScale.x, 0), maxScroll.x),
                y: anchorAtSettledScale.y - Math.min(Math.max(anchorAtSettledScale.y, 0), maxScroll.y),
            };
            const moved = { x: releasedContentPoint.x - heldContentPoint.x, y: releasedContentPoint.y - heldContentPoint.y };

            // Integer scroll positions on both sides, and the released one has been through LayoutUnit.
            const sprangBackByTheOverhang = Math.abs(moved.x + overhang.x) <= 2 && Math.abs(moved.y + overhang.y) <= 2;
            output.push(`After release at scale ${released.scale.toFixed(2)}:`);
            output.push('  ' + (sprangBackByTheOverhang ? `PASS (the page came back by (${(-overhang.x).toFixed(0)}, ${(-overhang.y).toFixed(0)}), the overhang the pinch was holding, and no more)` : `FAIL (the content under the cursor moved by (${moved.x.toFixed(0)}, ${moved.y.toFixed(0)}), expected (${(-overhang.x).toFixed(0)}, ${(-overhang.y).toFixed(0)}))`));
            output.push('  ' + (isOnDocument(released) ? 'PASS (the page is back on the document)' : `FAIL (scroll position (${released.x}, ${released.y}) is off the document)`));

            document.getElementById('output').textContent = output.join('\n');
            if (window.testRunner)
                testRunner.notifyDone();
        }

        window.addEventListener('load', doTest, false);
    </script>
</head>
<body>
    <pre id="output"></pre>
</body>
</html>
