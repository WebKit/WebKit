<!DOCTYPE html>
<html>
<head>
    <title>A delegated zoom out keeps fixed elements where the view puts them</title>
    <style>
        html, body {
            margin: 0;
        }

        /* Tall enough to scroll, like a real page. The pinch below still has to take the anchoring scroll position off
           the top left of the document to keep the pinched content under the cursor. */
        body {
            height: 3000px;
            background: linear-gradient(silver, gray);
        }

        .bar {
            position: fixed;
            width: 200px;
            height: 40px;
            background-color: black;
        }

        #top-left-bar {
            left: 10px;
            top: 10px;
        }

        #bottom-left-bar {
            left: 10px;
            bottom: 10px;
        }

        #top-right-bar {
            right: 10px;
            top: 10px;
        }

        /* Positioned in percentages of the viewport rather than against an edge, so it only lands in the middle of the
           window if the viewport the web process laid it out against is the size of the view. */
        #centred-bar {
            left: calc(50% - 100px);
            top: calc(50% - 20px);
        }
    </style>
    <script src="../resources/ui-helper.js"></script>
    <script>
        const inset = 10;
        const barWidth = 200;
        const barHeight = 40;

        // In document order, which is the order the fixed nodes come out of the tree dump: the dump has no anchor edges
        // in the constraints, and layer-position-at-last-layout is (0,0) for all of them, so nothing else tells them
        // apart. Each bar's position is derived from a viewport by the same CSS the style block above declares.
        const bars = [
            { name: 'top left bar    ', positionIn: viewport => ({ x: viewport.x + inset, y: viewport.y + inset }) },
            { name: 'bottom left bar ', positionIn: viewport => ({ x: viewport.x + inset, y: viewport.y + viewport.height - inset - barHeight }) },
            { name: 'top right bar   ', positionIn: viewport => ({ x: viewport.x + viewport.width - inset - barWidth, y: viewport.y + inset }) },
            { name: 'centred bar     ', positionIn: viewport => ({ x: viewport.x + (viewport.width - barWidth) / 2, y: viewport.y + (viewport.height - barHeight) / 2 }) },
        ];

        if (window.testRunner) {
            testRunner.dumpAsText();
            testRunner.waitUntilDone();
        }

        // The view, read before the gesture so nothing the zoom does can move it. This is the only reference that can
        // say whether a fixed element is still where the window puts it: the scrolling tree places fixed layers from the
        // layout viewport, so measuring them against that viewport answers 10px from the edge no matter where the
        // viewport itself has wandered off to.
        let viewSize = null;

        // Mid-gesture this all comes from the UI process. It owns the scale and the anchoring scroll position, and the
        // web process is still laid out at page scale 1, so the render tree can't answer this.
        async function viewRectInContentCoordinates()
        {
            const scale = await UIHelper.zoomScale();
            const override = await UIHelper.delegatedZoomOverrideAsText();
            const anchoringScrollPosition = override.match(/anchoring scroll position \((-?\d+), (-?\d+)\)/);

            // No override means no gesture in flight, so the page's own scroll position is the anchor.
            const origin = anchoringScrollPosition
                ? { x: parseInt(anchoringScrollPosition[1]), y: parseInt(anchoringScrollPosition[2]) }
                : { x: window.scrollX, y: window.scrollY };

            // The scrolled contents layer puts that content point at the top left of the view and scales from there, so
            // the view covers viewSize / scale of content starting at it.
            return { scale, x: origin.x, y: origin.y, width: viewSize.width / scale, height: viewSize.height / scale };
        }

        function point(match, index)
        {
            return { x: parseFloat(match[index]), y: parseFloat(match[index + 1]) };
        }

        function rect(match, index)
        {
            return { x: parseFloat(match[index]), y: parseFloat(match[index + 1]), width: parseFloat(match[index + 2]), height: parseFloat(match[index + 3]) };
        }

        // For each fixed node, the viewport and layer position it was last laid out against plus where its layer
        // actually is now, which the tree dump reads off the layer.
        async function fixedNodes()
        {
            const tree = await UIHelper.getScrollingTree();
            const nodes = [...tree.matchAll(/\(fixed node\s+\(fixed constraints\s+\(viewport-rect-at-last-layout \((-?[\d.]+),(-?[\d.]+)\) width=([\d.]+) height=([\d.]+)\)\s+\(layer-position-at-last-layout \((-?[\d.]+),(-?[\d.]+)\)\)\)\s+\(layer top left \((-?[\d.]+),(-?[\d.]+)\)\)/g)];

            return nodes.map(node => ({
                viewportAtLastLayout: rect(node, 1),
                layerPositionAtLastLayout: point(node, 5),
                layerTopLeft: point(node, 7),
            }));
        }

        // How far the bar has ended up from where the view would put it, in screen pixels.
        function offsetFromWhereTheViewPutsIt(bar, node, view)
        {
            // Where the bar was in content coordinates at the last layout, from its own CSS and the viewport it was laid
            // out against. The tree's layer positions are offsets from this.
            const laidOutAt = bar.positionIn(node.viewportAtLastLayout);

            // Plus however far the scrolling tree has moved the layer since, which is the same for the bar as for
            // whichever layer in its chain the fixed node owns.
            const content = {
                x: laidOutAt.x + node.layerTopLeft.x - node.layerPositionAtLastLayout.x,
                y: laidOutAt.y + node.layerTopLeft.y - node.layerPositionAtLastLayout.y,
            };

            const expected = bar.positionIn(view);
            return { x: (content.x - expected.x) * view.scale, y: (content.y - expected.y) * view.scale };
        }

        function barResult(bar, node, view)
        {
            const offset = offsetFromWhereTheViewPutsIt(bar, node, view);

            // The anchoring scroll position is reported as an integer, so allow a pixel of slack.
            if (Math.abs(offset.x) <= 1 && Math.abs(offset.y) <= 1)
                return `    ${bar.name}: PASS`;

            return `    ${bar.name}: FAIL (${offset.x.toFixed(1)}px across and ${offset.y.toFixed(1)}px down from where the view puts it)`;
        }

        async function barResults(description)
        {
            // Placing the percentage-positioned bar takes a relayout in the web process and a commit back, so measure
            // what the gesture settles on rather than how far behind it is at this instant.
            for (let i = 0; i < 4; ++i)
                await UIHelper.ensurePresentationUpdate();

            const view = await viewRectInContentCoordinates();
            const nodes = await fixedNodes();
            const output = [`  ${description} at scale ${view.scale.toFixed(2)}:`];

            if (nodes.length != bars.length) {
                output.push(`    FAIL (found ${nodes.length} of ${bars.length} fixed nodes in the scrolling tree)`);
                return output.join('\n');
            }

            bars.forEach((bar, index) => output.push(barResult(bar, nodes[index], view)));
            return output.join('\n');
        }

        async function doTest()
        {
            // The layout size rather than window.innerWidth/innerHeight, which count the space classic scrollbars take.
            // Both the page's own viewport and the one the UI process derives from the view leave that space out, so a
            // right-anchored bar sits 10px from the scrollbar, not 10px from the edge of the window.
            viewSize = { width: document.documentElement.clientWidth, height: document.documentElement.clientHeight };

            const output = ['Fixed bars inset 10px from the edges of the view, and one centred in it:'];

            // At page scale 1 nothing is overridden, so this row is also a check that the view really is the size the
            // rows below measure against.
            output.push(await barResults('Before zooming'));

            // Away from the top left, so anchoring the zoom out walks the scroll position off the document: below the
            // minimum magnification no position on the document keeps the pinched content under the cursor, and
            // clamping the layout viewport back onto the document is what used to leave the fixed layers behind with
            // the page while the view shrank around them, walking the bottom bar off the bottom of the window and
            // sliding the centred bar up and to the left.
            //
            // Held rather than released, and continued rather than restarted, so one gesture carries the scale past
            // the point where the anchor leaves the document.
            await UIHelper.beginMagnifyGestureAt(600, 400, -0.9);
            output.push(await barResults('Held zoom out'));
            await UIHelper.continueMagnifyGesture(-0.9);
            output.push(await barResults('Held zoom out'));
            await UIHelper.continueMagnifyGesture(-0.9);
            output.push(await barResults('Held zoom out'));
            await UIHelper.endMagnifyGesture();

            // And back where they started once the rubber band is gone, so this isn't passing on a leftover override.
            output.push(await barResults('After release'));

            document.getElementById('output').textContent = output.join('\n');
            if (window.testRunner)
                testRunner.notifyDone();
        }

        window.addEventListener('load', doTest, false);
    </script>
</head>
<body>
    <div id="top-left-bar" class="bar"></div>
    <div id="bottom-left-bar" class="bar"></div>
    <div id="top-right-bar" class="bar"></div>
    <div id="centred-bar" class="bar"></div>
    <pre id="output"></pre>
</body>
</html>
