<style>

body {
  background-image: repeating-conic-gradient(black 0% 25%, white 25% 50%);
  background-size: 32px 32px;
}

@keyframes blur {
    0% { backdrop-filter: blur(0px) }
    2% { backdrop-filter: blur(10px) }
    to { backdrop-filter: blur(10px) }
}

div {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 200px;
    background-color: rgba(255, 255, 255, 0.2);
    animation: blur 1s forwards;
}

</style>
<div></div>

<script src="threaded-animations/threaded-animations-utils.js"></script>
<script>

(async function() {
    // Wait until the animation is guaranteed to have progressed past the 2% keyframe.
    window.testRunner?.waitUntilDone();
    const animation = document.querySelector("div").getAnimations()[0];
    await animationAcceleration(animation);
    await new Promise(resolve => setTimeout(resolve, 20));
    window.testRunner?.notifyDone();
})();

</script>
