<!DOCTYPE html> <!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=false ] -->
<div id="target" style="width: 100px; height: 100px; background-color: black;"></div>
<script src="../resources/js-test.js"></script>
<script>
window.jsTestIsAsync = true;

const element = document.getElementById("target");
const duration = 1000;
const iterations = Infinity;

const shouldBecomeEqualAsync = async (actual, expected) => new Promise(resolve => shouldBecomeEqual(actual, expected, resolve));

(async () => {
    if (!window.testRunner || !window.internals) {
        debug("This test should be run in a test runner.");
        return;
    }


    // First, start a transform-related animation that can be accelerated.
    element.animate({ scale: [1, 2] }, { duration, iterations });
    await shouldBecomeEqualAsync("internals.acceleratedAnimationsForElement(element).length", "1");

    // Now, start another transform-related animation using a steps() timing function. On Cocoa
    // ports, CAMediaTimingFunction cannot represent steps(), so this should prevent this animation
    // from running accelerated and make the previous animation revert to a non-accelerated state
    // too. On other ports (e.g. GTK/WPE), the compositing backend implements steps() directly, so
    // both animations should remain accelerated.
    element.animate({ rotate: ["30deg", "60deg"] }, { duration, iterations, easing: "steps(60)" });
    const isCocoa = testRunner.isMac || testRunner.isIOSFamily;
    await shouldBecomeEqualAsync("internals.acceleratedAnimationsForElement(element).length", isCocoa ? "0" : "2");

    finishJSTest();
})();
    
</script>
