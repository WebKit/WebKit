<!DOCTYPE html>
<meta charset="utf-8">
<title>Inherited color changes must not restart an opacity transition</title>
<link rel="help" href="https://bugs.webkit.org/show_bug.cgi?id=331776">
<style>
#parent { color: black; transition: color 1s linear; }
#parent.changed { color: red; }
#child { opacity: 1; transition: opacity 1s linear; }
#parent.changed #child { opacity: 0; }
</style>
<div id="parent"><div id="child">child</div></div>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<script>

promise_test(async test => {
    const parent = document.getElementById("parent");
    const child = document.getElementById("child");
    test.add_cleanup(() => parent.remove());
    let transitionRuns = 0;
    let transitionCancels = 0;
    child.addEventListener("transitionrun", () => ++transitionRuns);
    child.addEventListener("transitioncancel", () => ++transitionCancels);
    const finished = new Promise(resolve => child.addEventListener("transitionend", resolve, { once: true }));

    getComputedStyle(child).opacity;
    parent.classList.add("changed");
    await finished;

    assert_equals(transitionRuns, 1, "The opacity transition starts once.");
    assert_equals(transitionCancels, 0, "The opacity transition is not canceled.");
}, "An opacity transition is not restarted while its inherited color transitions.");

</script>
