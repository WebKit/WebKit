<!DOCTYPE html>
<style>

@keyframes transform-and-opacity {
    from { opacity: 0.5; transform: translateX(0) }
    to   { opacity: 1; transform: translateX(100px) }
}

@keyframes sepia-and-opacity {
    from { opacity: 0.5; filter: sepia(0) }
    to   { opacity: 1; filter: sepia(1) }
}

div {
    width: 100px;
    height: 100px;
    background-color: black;
    filter: blur(2px);
    animation: transform-and-opacity 2s, sepia-and-opacity 2s 250ms;
}

</style>

<div>PASS if this does not crash.</div>

<script src="threaded-animations-utils.js"></script>
<script>

(async function () {
    window.testRunner?.dumpAsText();
    window.testRunner?.waitUntilDone();

    // Wait for the delayed animation to start and for the remote layer tree to apply it.
    await new Promise(resolve => document.querySelector("div").addEventListener("animationstart", event => {
        if (event.animationName == "sepia-and-opacity")
            resolve();
    }));
    await threadedAnimationsCommit();
    await threadedAnimationsCommit();

    window.testRunner?.notifyDone();
})();

</script>
