<html>
<head>
	<script>
	    if (window.testRunner)
		testRunner.dumpAsText()

	    function runTest() {
		// The width is in CSS pixels, which the zoom scales, so it stays about the same. It changes a little
		// because the scrollbar is not zoomed, and the text of the options does not scale exactly.
		var widthWithoutZoom = window.getComputedStyle(document.getElementById("toZoom")).getPropertyCSSValue('width').getFloatValue(CSSPrimitiveValue.CSS_NUMBER);
		document.getElementById('toZoom').style.zoom = 2;

		var realWidth = window.getComputedStyle(document.getElementById("toZoom")).getPropertyCSSValue('width').getFloatValue(CSSPrimitiveValue.CSS_NUMBER);
		var result = "";
		if (Math.abs(widthWithoutZoom - realWidth) > 15)
		    result = "FAIL";
		else
		    result = "PASS";
		result += " width with the zoom is the width without it +/-15.";
		document.getElementById('result').innerHTML = result;
	    }
	</script>
</head>

<body onload="runTest()">

<select id="toZoom" MULTIPLE>
	<option value="first">first
	<option value="second">second
</select>

<div>The test passes if both dimensions (not only height) of the listbox is resized according to the zoom.</div>
<div id="result"/>
</body>
</html>
