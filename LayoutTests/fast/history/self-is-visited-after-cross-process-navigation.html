<html>
<head>
<script src="../../resources/js-test.js"></script>
<script>
description('Tests that a link is still marked as visited after the main frame has navigated to another process and come back.');
jsTestIsAsync = true;

// This has to happen before the iframe below starts loading for its URL to be recorded as visited.
if (window.testRunner)
    testRunner.keepWebHistory();

// Navigation steps:
// 1- loads this page
// 2- loads this page + hash (doesn't call onload)
// 3- loads a data URL, which is loaded in a different process, that just navigates back
// 4- loads this page + hash (calls onload), which then checks the visited link styles

function navigateAwayAndBack()
{
    location.hash = 'hash';

    // Assigning to location does not create a history entry, so instead we simulate a link click.
    var event = document.createEvent('MouseEvents');
    event.initMouseEvent('click', true, true, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
    document.getElementById('anchor').dispatchEvent(event);
}

function compareStyles()
{
    firstStyle = internals.computedStyleIncludingVisitedInfo(document.getElementById('one'));
    secondStyle = internals.computedStyleIncludingVisitedInfo(document.getElementById('two'));
    shouldBecomeDifferent('firstStyle.color', 'secondStyle.color', function() {
        shouldBecomeDifferent('firstStyle.backgroundColor', 'secondStyle.backgroundColor', finishJSTest);
    });
}

function runTestStep()
{
    if (!window.internals || !window.testRunner)
        return finishJSTest();

    if (location.hash == '') {
        // Location changes need to happen outside the onload handler to generate history entries.
        setTimeout(navigateAwayAndBack, 0);
        return;
    }

    // The iframe below has visited resources/dummy.html, so the link to it should be styled as
    // visited while the link to a URL that was never loaded should not be.
    compareStyles();
}
</script>
<style>
:link { color: green; background-color: white }
:visited { color: orange; background-color: black }
</style>
</head>
<body onload="runTestStep()" onunload="/*suppress back/forward cache*/">
<iframe src="resources/dummy.html" style="display:none"></iframe>
<a id="anchor" href='data:text/html,<body onload="history.back()"></body>'>go away and come back</a>
<p>These two links should be different colors (green and orange):</p>
<p>
<a href="http://madeup.site.com" id="one">One</a>
<a href="resources/dummy.html" id="two">Two</a>
</p>
</body>
</html>
