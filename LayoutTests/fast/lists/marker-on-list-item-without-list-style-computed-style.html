<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
<style>
li { list-style: none; color: rgb(0, 0, 255); }
</style>
</head>
<body>
<ul>
  <li id="queried-entry">queried</li>
  <li id="animated-entry">animated</li>
</ul>
<script>
description("The ::marker of a list item without a list style has a computed style that follows the list item and Web Animations.");

function markerColor(element) {
    return getComputedStyle(element, "::marker").color;
}

const queriedEntry = document.getElementById("queried-entry");
const animatedEntry = document.getElementById("animated-entry");

document.body.offsetHeight;

debug("getComputedStyle()");
shouldBeEqualToString("markerColor(queriedEntry)", "rgb(0, 0, 255)");

debug("");
debug("Web Animation");
evalAndLog("animation = animatedEntry.animate({ color: ['rgb(255, 0, 0)', 'rgb(255, 0, 0)'] }, { duration: 1000000, pseudoElement: '::marker' })");
shouldBeEqualToString("markerColor(animatedEntry)", "rgb(255, 0, 0)");
evalAndLog("animation.cancel()");
shouldBeEqualToString("markerColor(animatedEntry)", "rgb(0, 0, 255)");
</script>
</body>
</html>
