<!DOCTYPE html><!-- webkit-test-runner [ useFlexibleViewport=true TextAutosizingEnabled=true TextAutosizingUsesIdempotentMode=false ] -->
<html>
<head>
<meta name="viewport" content="width=1024">
<meta name="text-scale" content="scale">
<script>
if (window.internals) {
    internals.settings.setTextAutosizingWindowSizeOverride(320, 480);
}
</script>
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
<script src="../../../resources/ui-helper.js"></script>
<style>
.text { font-size: 8px; }
</style>
</head>
<body>
<!-- Text autosizing only adjusts text when at least two text nodes share a style. -->
<p class="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean laoreet nisi felis, eu scelerisque dolor imperdiet in.</p>
<p class="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean laoreet nisi felis, eu scelerisque dolor imperdiet in.</p>
<script>
async function textFontSize() {
    await UIHelper.ensurePresentationUpdate();
    return parseFloat(getComputedStyle(document.querySelector(".text")).fontSize);
}

promise_test(async () => {
    assert_equals(await textFontSize(), 8);
}, "Text autosizing does not inflate text with <meta name=text-scale content=scale>");

promise_test(async t => {
    const meta = document.querySelector("meta[name=text-scale]");
    meta.remove();
    t.add_cleanup(() => {
        document.head.appendChild(meta);
        document.querySelectorAll(".text").forEach(text => text.remove());
    });
    assert_greater_than(await textFontSize(), 8, "after removing the meta");
    document.head.appendChild(meta);
    assert_equals(await textFontSize(), 8, "after adding the meta back");
}, "Removing and adding the text-scale meta toggles text autosizing");
</script>
</body>
</html>
