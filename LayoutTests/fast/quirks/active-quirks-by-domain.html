let output = "";
if (!window.internals)
    output = "FAIL: this test requires window.internals.\n";
else {
    for (const url of urls) {
        internals.setTopDocumentURLForQuirks(url);
        const active = internals.activeQuirks();
        output += url + "\n";
        for (const name of active.length ? active : ["(none)"])
            output += "    " + name + "\n";
    }
}
document.getElementById("output").textContent = output;
