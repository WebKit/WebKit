<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Element fullscreen is disabled for pages that do not opt into safe area insets</title>
<script>
if (window.testRunner)
    testRunner.dumpAsText();

const log = [];
function check(label) {
    log.push(`${label}: requestFullscreen ${"requestFullscreen" in Element.prototype ? "present" : "absent"}`);
}

// The viewport meta above has already been processed by the time this runs, so the quirk has already
// resolved and the API is already gone. Nothing observes it appearing and then disappearing.
check("after viewport meta, during head parse");
</script>
</head>
<body>
<pre id="output"></pre>
<script>
check("end of body parse");

document.addEventListener("DOMContentLoaded", () => {
    check("DOMContentLoaded");

    // Adding viewport-fit=cover now must not turn the API back on: the platform does not start
    // honoring safe area insets for a page that opts in after load, so neither does the quirk.
    const meta = document.createElement("meta");
    meta.name = "viewport";
    meta.content = "width=device-width, viewport-fit=cover";
    document.head.appendChild(meta);
    check("after adding viewport-fit=cover");

    document.getElementById("output").textContent = log.join("\n");
});
</script>
</body>
</html>
