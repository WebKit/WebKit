<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Embedded document that does not opt into safe area insets</title>
</head>
<body>
<script>
document.addEventListener("DOMContentLoaded", () => {
    parent.postMessage({
        label: "embed without viewport-fit=cover",
        present: "requestFullscreen" in Element.prototype,
    }, "*");
});
</script>
</body>
</html>
