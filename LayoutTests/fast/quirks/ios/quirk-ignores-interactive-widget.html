<!DOCTYPE html> <!-- webkit-test-runner [ useFlexibleViewport=true NeedsSiteSpecificQuirks=true ] -->
<html>
<head>
    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <style>
        input {
            width: 400px;
            height: 50px;
        }
    </style>
    <script src="../../../resources/js-test.js"></script>
    <script src="../../../resources/ui-helper.js"></script>
</head>
<body>
    <input id="input" type="text">
    <script>
        jsTestIsAsync = true;

        addEventListener("load", async () => {
            internals.setTopDocumentURLForQuirks("https://gemini.google.com/app");
            document.getElementById("viewport-meta").content = "width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content";
            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();

            window.initialLayoutViewportHeight = internals.layoutViewportRect().height;

            await UIHelper.activateElement(document.querySelector("input"));
            await UIHelper.waitForKeyboardToShow();
            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();

            shouldBe("internals.layoutViewportRect().height", "initialLayoutViewportHeight");
            finishJSTest();
        });
    </script>
</body>
</html>
