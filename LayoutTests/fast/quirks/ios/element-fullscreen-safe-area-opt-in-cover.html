<!DOCTYPE html> <!-- webkit-test-runner [ NeedsSiteSpecificQuirks=true FullscreenSafeAreaQuirkEnabled=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover">
<title>Element fullscreen stays enabled for pages that opt into safe area insets</title>
<script>
// Results are buffered and reported once js-test.js has loaded at the end of <body>. Loading it here
// would block the parser, and a blocked parser lets the preload scanner process later <meta> tags early.
const results = [];
function check(label, expected) {
    const actual = "requestFullscreen" in Element.prototype ? "present" : "absent";
    results.push({ label, expected, actual });
}
function report() {
    for (const { label, expected, actual } of results) {
        if (actual === expected)
            testPassed(`${label}: requestFullscreen is ${actual}`);
        else
            testFailed(`${label}: requestFullscreen is ${actual}, expected ${expected}`);
    }
}

check("during head parse", "present");
</script>
</head>
<body>
<script>
check("end of body parse", "present");

document.addEventListener("DOMContentLoaded", () => {
    check("DOMContentLoaded", "present");

    // Removing the opt-in once parsing has finished must not disable the API.
    document.querySelector("meta[name=viewport]").content = "width=device-width";
    check("after removing viewport-fit=cover", "present");

    report();
});
</script>
<script src="../../../resources/js-test.js"></script>
</body>
</html>
