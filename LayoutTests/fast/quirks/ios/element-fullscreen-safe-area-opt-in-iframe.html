<!DOCTYPE html> <!-- webkit-test-runner [ NeedsSiteSpecificQuirks=true FullscreenSafeAreaQuirkEnabled=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Safe area inset opt-in is per-document, so an embed can opt in independently of its embedder</title>
</head>
<body>
<script>
window.jsTestIsAsync = true;

// The embedder here does not opt in, so it should be quirked, but the embed that declares
// viewport-fit=cover should keep requestFullscreen regardless of what its embedder did.
// Reported in this fixed order, whichever order the frames finish loading in.
const expectations = new Map([
    ["embedder without viewport-fit=cover", "absent"],
    ["embed with viewport-fit=cover", "present"],
    ["embed without viewport-fit=cover", "absent"],
]);
const results = new Map();

function check(label, present) {
    results.set(label, present ? "present" : "absent");
    if (results.size < expectations.size)
        return;

    for (const [label, expected] of expectations) {
        const actual = results.get(label);
        if (actual === expected)
            testPassed(`${label}: requestFullscreen is ${actual}`);
        else
            testFailed(`${label}: requestFullscreen is ${actual}, expected ${expected}`);
    }
    finishJSTest();
}

window.addEventListener("message", event => check(event.data.label, event.data.present));

for (const src of ["resources/safe-area-opt-in-frame-cover.html", "resources/safe-area-opt-in-frame-no-cover.html"]) {
    const iframe = document.createElement("iframe");
    iframe.src = src;
    document.body.appendChild(iframe);
}

document.addEventListener("DOMContentLoaded", () => {
    check("embedder without viewport-fit=cover", "requestFullscreen" in Element.prototype);
});
</script>
<script src="../../../resources/js-test.js"></script>
</body>
</html>
