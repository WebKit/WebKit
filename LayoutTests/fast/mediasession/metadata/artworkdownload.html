<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html>
    <body>
        <script src="../../../resources/testharness.js"></script>
        <script src="../../../resources/testharnessreport.js"></script>
        <script>

const IMAGE_SRC = '../../images/resources/test-load.jpg';

promise_test((test) => {
    if (!window.internals)
        return Promise.rejects("Test needs internals");
    return internals.loadArtworkImage(IMAGE_SRC).then((data) => {
        assert_equals(data.codedWidth, 16);
        assert_equals(data.codedHeight, 16);
        data.close();
    });
}, "ensure loading artwork image method operates properly");

function svgImage(attributes)
{
    return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' ${attributes}><rect width='100%' height='100%' fill='green'/></svg>`);
}

for (const [attributes, width, height] of [
    ["width='40' height='20'", 40, 20],
    ["viewBox='0 0 40 20'", 512, 256],
    ["", 512, 512],
]) {
    promise_test(async (test) => {
        if (!window.internals)
            return Promise.rejects("Test needs internals");
        const data = await internals.loadArtworkImage(svgImage(attributes));
        assert_equals(data.codedWidth, width);
        assert_equals(data.codedHeight, height);
        data.close();
    }, `an SVG image with ${attributes || "no size"} is sized ${width}x${height}`);
}

promise_test(async (test) => {
    if (!window.internals)
        return Promise.rejects("Test needs internals");

    return promise_rejects_dom(test, 'InvalidAccessError', internals.loadArtworkImage("bad_image.jpg"));
}, "ensure loading invalid artwork causes a failure");

promise_test(async (test) => {
    if (!window.internals)
        return Promise.rejects("Test needs internals");

    return promise_rejects_dom(test, 'InvalidAccessError', internals.loadArtworkImage(""));
}, "ensure loading a non-image causes a failure");

        </script>
    </body>
</html>
