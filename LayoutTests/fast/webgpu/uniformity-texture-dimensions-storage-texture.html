<script src="../../resources/js-test.js"></script>
<script>

jsTestIsAsync = true;

description("textureDimensions() and textureNumLayers() of a storage texture are uniform, whatever the texel " +
            "access mode. Per https://www.w3.org/TR/WGSL/#texture-resource the texture handle 'is in the handle " +
            "address space and is always read-only', so an identifier resolving to it is uniform (CF), and the " +
            "only texture built-in the spec tags as possibly returning a non-uniform value is textureLoad() of a " +
            "read-write storage texture. The uniformity analysis used to treat the variable itself as non-uniform " +
            "whenever the texel access mode was not 'read', which wrongly rejected these shaders.");

const body = (textureType, condition) => `
@group(0) @binding(0) var t : ${textureType};

@compute @workgroup_size(64)
fn main(@builtin(workgroup_id) workgroup : vec3u) {
  if (${condition}) {
    workgroupBarrier();
  }
}
`;

const requiresReadWrite = "requires readonly_and_readwrite_storage_textures;\n";

const cases = [
    {
        name: "textureDimensions() of a write-only storage texture",
        code: body("texture_storage_2d<rgba8unorm, write>", "workgroup.x < textureDimensions(t).x"),
        shouldCompile: true,
    },
    {
        name: "textureDimensions() of a read-write storage texture",
        feature: "readonly_and_readwrite_storage_textures",
        code: requiresReadWrite + body("texture_storage_2d<r32float, read_write>", "workgroup.x < textureDimensions(t).x"),
        shouldCompile: true,
    },
    {
        name: "textureDimensions() of a read-only storage texture",
        feature: "readonly_and_readwrite_storage_textures",
        code: requiresReadWrite + body("texture_storage_2d<r32float, read>", "workgroup.x < textureDimensions(t).x"),
        shouldCompile: true,
    },
    {
        name: "textureDimensions() of a sampled texture",
        code: body("texture_2d<f32>", "workgroup.x < textureDimensions(t).x"),
        shouldCompile: true,
    },
    {
        name: "textureNumLayers() of a write-only storage texture array",
        code: body("texture_storage_2d_array<rgba8unorm, write>", "workgroup.x < textureNumLayers(t)"),
        shouldCompile: true,
    },
    {
        name: "textureLoad() of a read-only storage texture",
        feature: "readonly_and_readwrite_storage_textures",
        code: requiresReadWrite + body("texture_storage_2d<r32float, read>", "textureLoad(t, vec2(0)).x == 0.0"),
        shouldCompile: true,
    },
    {
        name: "textureLoad() of a read-write storage texture is non-uniform",
        feature: "readonly_and_readwrite_storage_textures",
        code: requiresReadWrite + body("texture_storage_2d<r32float, read_write>", "textureLoad(t, vec2(0)).x == 0.0"),
        shouldCompile: false,
    },
];

async function main() {
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();

    for (const testCase of cases) {
        if (testCase.feature && !navigator.gpu.wgslLanguageFeatures.has(testCase.feature)) {
            debug(`SKIP: ${testCase.name} (${testCase.feature} is not supported)`);
            continue;
        }

        device.pushErrorScope("validation");
        const module = device.createShaderModule({ code: testCase.code });
        const info = await module.getCompilationInfo();
        const scopeError = await device.popErrorScope();
        const errors = info.messages.filter(message => message.type === "error");
        const compiled = errors.length === 0 && !scopeError;

        if (compiled === testCase.shouldCompile)
            testPassed(`${testCase.name}: ${testCase.shouldCompile ? "compiled" : "was rejected"}`);
        else if (testCase.shouldCompile)
            testFailed(`${testCase.name}: was rejected: ${errors.map(m => m.message).join(", ")}`);
        else
            testFailed(`${testCase.name}: compiled, but should have been rejected`);
    }
}

main().catch(e => {
    testFailed("Exception: " + e);
}).finally(() => {
    finishJSTest();
});
</script>
