<script src="../../resources/js-test.js"></script>
<script>

jsTestIsAsync = true;

description("Tests that interleaved queue.writeBuffer and device.createBindGroup calls, strided copyBufferToBuffer batches, " +
           "shared zero-buffer lazy texture clears, partial getMappedRange(offset, size) readbacks, and uninitialized loadOp:'load' " +
           "render pass attachments produce correct results.");

async function main() {
    const adapter = await navigator.gpu.requestAdapter({});
    const device = await adapter.requestDevice({});
    device.pushErrorScope('validation');

    // 1. Verify lazy zero-clear using shared zeroBuffer across multiple texture sizes.
    async function checkLazyZeroClear(width, height) {
        const bytesPerRow = Math.ceil((width * 4) / 256) * 256;
        const byteLength = bytesPerRow * height;
        const texture = device.createTexture({
            size: [width, height],
            format: 'rgba8unorm',
            usage: GPUTextureUsage.COPY_SRC | GPUTextureUsage.TEXTURE_BINDING,
        });
        const readback = device.createBuffer({
            size: byteLength,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
        });
        const encoder = device.createCommandEncoder();
        encoder.copyTextureToBuffer({ texture }, { buffer: readback, bytesPerRow, rowsPerImage: height }, [width, height, 1]);
        device.queue.submit([encoder.finish()]);
        await readback.mapAsync(GPUMapMode.READ);
        const bytes = new Uint8Array(readback.getMappedRange());
        let nonZero = 0;
        for (let i = 0; i < bytes.length; ++i)
            nonZero |= bytes[i];
        readback.unmap();
        return nonZero === 0;
    }

    window.lazyClearSmallZeroed = await checkLazyZeroClear(64, 64);
    window.lazyClearLargeZeroed = await checkLazyZeroClear(256, 256);
    shouldBeTrue("lazyClearSmallZeroed");
    shouldBeTrue("lazyClearLargeZeroed");

    // 2. Verify uninitialized render pass attachment with loadOp: 'load', storeOp: 'store' clears to (0, 0, 0, 0)
    // and that an unsubmitted encoder does not forge the clear state.
    const rtWidth = 64;
    const rtHeight = 64;
    const rtBytesPerRow = 256;
    const rtByteLength = rtBytesPerRow * rtHeight;
    const renderTarget = device.createTexture({
        size: [rtWidth, rtHeight],
        format: 'rgba8unorm',
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });

    // Unsubmitted encoder with loadOp: 'load' must not mark renderTarget as cleared.
    {
        const unsubmitted = device.createCommandEncoder();
        const pass = unsubmitted.beginRenderPass({
            colorAttachments: [{
                view: renderTarget.createView(),
                loadOp: 'load',
                storeOp: 'store',
            }],
        });
        pass.end();
        unsubmitted.finish();
    }

    // Submitted encoder with loadOp: 'load' and storeOp: 'store' must clear to 0.
    {
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
            colorAttachments: [{
                view: renderTarget.createView(),
                loadOp: 'load',
                storeOp: 'store',
            }],
        });
        pass.end();
        const readback = device.createBuffer({
            size: rtByteLength,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
        });
        encoder.copyTextureToBuffer({ texture: renderTarget }, { buffer: readback, bytesPerRow: rtBytesPerRow, rowsPerImage: rtHeight }, [rtWidth, rtHeight, 1]);
        device.queue.submit([encoder.finish()]);
        await readback.mapAsync(GPUMapMode.READ);
        const bytes = new Uint8Array(readback.getMappedRange());
        let nonZero = 0;
        for (let i = 0; i < bytes.length; ++i)
            nonZero |= bytes[i];
        readback.unmap();
        window.renderPassLoadClearedToZero = (nonZero === 0);
        shouldBeTrue("renderPassLoadClearedToZero");
    }

    // 3. Interleaved queue.writeBuffer + device.createBindGroup + compute dispatches + strided copyBufferToBuffer
    // + partial getMappedRange(offset, size) readback (mirroring NGE's tile batch pattern).
    const tileCount = 16;
    const uniformStride = 256;
    const uniformArena = device.createBuffer({
        size: tileCount * uniformStride,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const scratchBuffer = device.createBuffer({
        size: tileCount * 16,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
    });
    const destinationBuffer = device.createBuffer({
        size: tileCount * 16,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    const sampledTexture = device.createTexture({
        size: [16, 16],
        format: 'rgba8unorm',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
    });
    device.queue.writeTexture(
        { texture: sampledTexture },
        new Uint8Array(16 * 16 * 4).fill(255),
        { bytesPerRow: 16 * 4, rowsPerImage: 16 },
        [16, 16, 1]
    );
    const sampler = device.createSampler();

    const module = device.createShaderModule({
        code: `
            @group(0) @binding(0) var<uniform> tileValue: u32;
            @group(0) @binding(1) var<storage, read_write> outWords: array<u32>;
            @group(0) @binding(2) var tex: texture_2d<f32>;
            @group(0) @binding(3) var samp: sampler;

            @compute @workgroup_size(1)
            fn main() {
                let sample = u32(textureLoad(tex, vec2u(0u, 0u), 0).r * 255.0);
                outWords[tileValue] = (tileValue + 1u) * 1000u + sample;
            }
        `,
    });
    const pipeline = device.createComputePipeline({
        layout: 'auto',
        compute: { module, entryPoint: 'main' },
    });
    const bgl = pipeline.getBindGroupLayout(0);

    const encoder = device.createCommandEncoder();
    encoder.clearBuffer(scratchBuffer);
    for (let i = 0; i < tileCount; ++i) {
        device.queue.writeBuffer(uniformArena, i * uniformStride, new Uint32Array([i]));
        const bindGroup = device.createBindGroup({
            layout: bgl,
            entries: [
                { binding: 0, resource: { buffer: uniformArena, offset: i * uniformStride, size: 4 } },
                { binding: 1, resource: { buffer: scratchBuffer } },
                { binding: 2, resource: sampledTexture.createView() },
                { binding: 3, resource: sampler },
            ],
        });
        const pass = encoder.beginComputePass();
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroups(1);
        pass.end();
        encoder.copyBufferToBuffer(scratchBuffer, i * 4, destinationBuffer, i * 4, 4);
    }
    device.queue.submit([encoder.finish()]);

    // Map a subrange [8, 24) and verify getMappedRange(offset, size) returns the exact subrange length and values.
    await destinationBuffer.mapAsync(GPUMapMode.READ, 8, 16);
    const subrange = new Uint32Array(destinationBuffer.getMappedRange(8, 16));
    window.subrangeLength = subrange.length;
    window.subrangeValues = Array.from(subrange).join(',');
    destinationBuffer.unmap();

    shouldBe("subrangeLength", "4");
    shouldBeEqualToString("subrangeValues", "3255,4255,5255,6255");

    window.validationError = await device.popErrorScope();
    shouldBeNull("validationError");
}

main().catch(e => {
    testFailed("Exception: " + e);
}).finally(() => {
    finishJSTest();
});

</script>
