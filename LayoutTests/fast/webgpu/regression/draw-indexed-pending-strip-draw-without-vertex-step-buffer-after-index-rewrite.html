<!-- webkit-test-runner [ enableMetalShaderValidation=true ] -->
<script src="../../../resources/js-test.js"></script>
<script>

jsTestIsAsync = true;

description("A finished but unsubmitted strip drawIndexed() with no vertex-step buffer must render the indices written to its index buffer before submit().");

async function main() {
    let adapter = await navigator.gpu.requestAdapter({});
    let device = await adapter.requestDevice({});
    let queue = device.queue;
    device.pushErrorScope('validation');

    const format = 'rgba8unorm';
    // The low two bits of the vertex index pick a quad corner, and red carries the rest of the index.
    let module = device.createShaderModule({ code: `
        struct VSOut {
            @builtin(position) pos: vec4f,
            @location(0) @interpolate(flat) color: vec4f,
        }
        @vertex fn vs(@builtin(vertex_index) v: u32, @location(0) a: f32) -> VSOut {
            let corner = v & 3u;
            var o: VSOut;
            o.pos = vec4f(select(-1.0, 1.0, (corner & 2u) != 0u), select(-1.0, 1.0, (corner & 1u) != 0u), 0, 1);
            o.color = vec4f(f32(v & 0xfcu) / 255.0, a, 0, 1);
            return o;
        }
        @fragment fn fs(in: VSOut) -> @location(0) vec4f { return in.color; }
    ` });
    function makePipeline(stepMode, primitive) {
        return device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module,
                entryPoint: 'vs',
                buffers: [{ arrayStride: 4, stepMode, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32' }] }],
            },
            fragment: { module, entryPoint: 'fs', targets: [{ format }] },
            primitive,
        });
    }
    let vertexStepPipeline = makePipeline('vertex', { topology: 'point-list' });
    let stripPipeline = makePipeline('instance', { topology: 'triangle-strip', stripIndexFormat: 'uint32' });

    // 10 vertices, so indices >= 10 are out of range for vertexStepPipeline.
    let vertexBuffer = device.createBuffer({ size: 40, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    queue.writeBuffer(vertexBuffer, 0, new Float32Array(10).fill(1));
    let instanceBuffer = device.createBuffer({ size: 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    queue.writeBuffer(instanceBuffer, 0, new Float32Array([1]));

    let indexBuffer = device.createBuffer({ size: 16, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });

    let texture = device.createTexture({ size: [2, 2], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    let readback = device.createBuffer({ size: 512, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

    function encodeDraw(pipeline, buffer, withReadback) {
        let commandEncoder = device.createCommandEncoder();
        let pass = commandEncoder.beginRenderPass({
            colorAttachments: [{ view: texture.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 1, a: 1 } }],
        });
        pass.setPipeline(pipeline);
        pass.setVertexBuffer(0, buffer);
        pass.setIndexBuffer(indexBuffer, 'uint32');
        pass.drawIndexed(4, 1, 0, 0, 0);
        pass.end();
        if (withReadback)
            commandEncoder.copyTextureToBuffer({ texture }, { buffer: readback, bytesPerRow: 256 }, [2, 2]);
        return commandEncoder.finish();
    }

    async function readPixels() {
        await readback.mapAsync(GPUMapMode.READ);
        let bytes = new Uint8Array(readback.getMappedRange());
        let result = [bytes.slice(0, 4), bytes.slice(4, 8), bytes.slice(256, 260), bytes.slice(260, 264)].map(pixel => [...pixel].join()).join(' ');
        readback.unmap();
        return result;
    }

    queue.writeBuffer(indexBuffer, 0, new Uint32Array([4, 5, 6, 7]));
    queue.submit([encodeDraw(vertexStepPipeline, vertexBuffer, false), encodeDraw(stripPipeline, instanceBuffer, true)]);
    await queue.onSubmittedWorkDone();
    window.primedPixels = await readPixels();
    shouldBeEqualToString('primedPixels', '4,255,0,255 4,255,0,255 4,255,0,255 4,255,0,255');
    // Give the completed handlers time to record both validated draws, which onSubmittedWorkDone() does not wait for.
    await new Promise(resolve => setTimeout(resolve, 1000));

    let pendingCommandBuffer = encodeDraw(stripPipeline, instanceBuffer, true);
    queue.writeBuffer(indexBuffer, 0, new Uint32Array([20, 21, 22, 23]));
    queue.submit([pendingCommandBuffer]);
    await queue.onSubmittedWorkDone();
    window.pendingPixels = await readPixels();
    shouldBeEqualToString('pendingPixels', '20,255,0,255 20,255,0,255 20,255,0,255 20,255,0,255');

    let error = await device.popErrorScope();
    if (error)
        testFailed(error.message);
}

main().catch(e => {
    testFailed("Exception: " + e);
}).finally(() => {
    finishJSTest();
});

</script>
