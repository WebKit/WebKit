<!-- webkit-test-runner [ enableMetalShaderValidation=true ] -->
<script src="../../../resources/js-test.js"></script>
<script>

jsTestIsAsync = true;

description("A render bundle's strip drawIndexed() with no vertex-step buffer must render its in-range indices.");

async function main() {
    let adapter = await navigator.gpu.requestAdapter({});
    let device = await adapter.requestDevice({});
    let queue = device.queue;
    device.pushErrorScope('validation');

    const format = 'rgba8unorm';
    // The low two bits of the vertex index pick a quad corner, and red carries the rest of the index.
    let module = device.createShaderModule({ code: `
        struct VSOut {
            @builtin(position) pos: vec4f,
            @location(0) @interpolate(flat) color: vec4f,
        }
        fn quad(v: u32, a: f32) -> VSOut {
            let corner = v & 3u;
            var o: VSOut;
            o.pos = vec4f(select(-1.0, 1.0, (corner & 2u) != 0u), select(-1.0, 1.0, (corner & 1u) != 0u), 0, 1);
            o.color = vec4f(f32(v & 0xfcu) / 255.0, a, 0, 1);
            return o;
        }
        @vertex fn vsInstance(@builtin(vertex_index) v: u32, @location(0) a: f32) -> VSOut { return quad(v, a); }
        @vertex fn vsNoBuffers(@builtin(vertex_index) v: u32) -> VSOut { return quad(v, 1.0); }
        @fragment fn fs(in: VSOut) -> @location(0) vec4f { return in.color; }
    ` });
    function makePipeline(entryPoint, buffers) {
        return device.createRenderPipeline({
            layout: 'auto',
            vertex: { module, entryPoint, buffers },
            fragment: { module, entryPoint: 'fs', targets: [{ format }] },
            primitive: { topology: 'triangle-strip', stripIndexFormat: 'uint32' },
        });
    }
    let instanceStepPipeline = makePipeline('vsInstance', [{ arrayStride: 4, stepMode: 'instance', attributes: [{ shaderLocation: 0, offset: 0, format: 'float32' }] }]);
    let noBuffersPipeline = makePipeline('vsNoBuffers', []);

    let instanceBuffer = device.createBuffer({ size: 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    queue.writeBuffer(instanceBuffer, 0, new Float32Array([1]));
    let indexBuffer = device.createBuffer({ size: 16, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
    queue.writeBuffer(indexBuffer, 0, new Uint32Array([20, 21, 22, 23]));

    let texture = device.createTexture({ size: [2, 2], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    let readback = device.createBuffer({ size: 512, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

    async function drawBundle(pipeline) {
        let bundleEncoder = device.createRenderBundleEncoder({ colorFormats: [format] });
        bundleEncoder.setPipeline(pipeline);
        if (pipeline === instanceStepPipeline)
            bundleEncoder.setVertexBuffer(0, instanceBuffer);
        bundleEncoder.setIndexBuffer(indexBuffer, 'uint32');
        bundleEncoder.drawIndexed(4, 1, 0, 0, 0);
        let bundle = bundleEncoder.finish();

        let commandEncoder = device.createCommandEncoder();
        let pass = commandEncoder.beginRenderPass({
            colorAttachments: [{ view: texture.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 1, a: 1 } }],
        });
        pass.executeBundles([bundle]);
        pass.end();
        commandEncoder.copyTextureToBuffer({ texture }, { buffer: readback, bytesPerRow: 256 }, [2, 2]);
        queue.submit([commandEncoder.finish()]);
        await queue.onSubmittedWorkDone();
        await readback.mapAsync(GPUMapMode.READ);
        let bytes = new Uint8Array(readback.getMappedRange());
        let result = [bytes.slice(0, 4), bytes.slice(4, 8), bytes.slice(256, 260), bytes.slice(260, 264)].map(pixel => [...pixel].join()).join(' ');
        readback.unmap();
        return result;
    }

    window.instanceStepPixels = await drawBundle(instanceStepPipeline);
    shouldBeEqualToString('instanceStepPixels', '20,255,0,255 20,255,0,255 20,255,0,255 20,255,0,255');
    window.noBuffersPixels = await drawBundle(noBuffersPipeline);
    shouldBeEqualToString('noBuffersPixels', '20,255,0,255 20,255,0,255 20,255,0,255 20,255,0,255');

    let error = await device.popErrorScope();
    if (error)
        testFailed(error.message);
}

main().catch(e => {
    testFailed("Exception: " + e);
}).finally(() => {
    finishJSTest();
});

</script>
