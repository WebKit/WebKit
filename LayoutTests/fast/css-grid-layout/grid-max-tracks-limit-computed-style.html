<!DOCTYPE html>
<title>The resolved grid-template-columns/rows of a grid limited to the maximum number of grid tracks</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#overlarge-grids">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#resolved-track-list">
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<style>
.grid { display: grid; width: 1000px; height: 1000px; }
.inline-grid { display: inline-grid; width: 1000px; height: 1000px; }
</style>
<div id="container"></div>
<script>
// The limit is 10 tracks. Style clamps repeat(<integer>) to it, so the auto-repeat of each of the templates below starts at
// track 9 or 10. Keep the CSS values in sync with this limit.
if (window.internals)
    window.internals.setGridMaxTracksLimit(10);

function resolvedValues(template, className)
{
    container.innerHTML = `<div class="${className}" style="grid-template-columns: ${template}; grid-template-rows: ${template}"><div style="grid-row: 1; grid-column: 1"></div></div>`;
    let style = getComputedStyle(container.firstChild);
    return { columns: style.gridTemplateColumns, rows: style.gridTemplateRows };
}

// "UAs may clamp the possible size of the implicit grid to be within a UA-defined limit, dropping all lines outside that limit."
// The 10 tracks before the auto-repeat fill the limited grid, so the repetitions are dropped. These grids are laid out by the
// grid formatting context (no line names in the template, no inline-grid).
const ten = "5px 5px 5px 5px 5px 5px 5px 5px 5px 5px";

test(() => {
    let values = resolvedValues("repeat(10, 5px) repeat(auto-fill, 7px)", "grid");
    assert_equals(values.columns, ten, "columns");
    assert_equals(values.rows, ten, "rows");
}, "Resolved tracks when the auto-repeat has no repetitions because it starts at the limit");

test(() => {
    let values = resolvedValues("repeat(9, 5px) repeat(auto-fill, 10px 20px 30px)", "grid");
    let expected = "5px 5px 5px 5px 5px 5px 5px 5px 5px 10px";
    assert_equals(values.columns, expected, "columns");
    assert_equals(values.rows, expected, "rows");
}, "Resolved tracks when the limit cuts the last repetition of the auto-repeat");

test(() => {
    let values = resolvedValues("repeat(10, 5px) repeat(10, 5px) repeat(auto-fill, 7px)", "grid");
    assert_equals(values.columns, ten, "columns");
    assert_equals(values.rows, ten, "rows");
}, "Resolved tracks when the auto-repeat starts past the limit");
</script>
