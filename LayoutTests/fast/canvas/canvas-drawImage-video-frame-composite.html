<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
</head>
<body>
<script>
description("drawImage() of a VideoFrame must honor globalCompositeOperation, including the modes that affect the whole canvas (copy, source-in, destination-in) and the ones that change how the frame is blended (destination-over, multiply).");

const red = [255, 0, 0, 255];
const transparent = [0, 0, 0, 0];

// The frame is drawn into (20, 20)-(80, 80).
const sourceCanvas = document.createElement("canvas");
sourceCanvas.width = 20;
sourceCanvas.height = 20;
const sourceContext = sourceCanvas.getContext("2d");
sourceContext.fillStyle = "rgb(0, 0, 255)";
sourceContext.fillRect(0, 0, 20, 20);
const frame = new VideoFrame(sourceCanvas, { timestamp: 0 });

function createContext()
{
    const canvas = document.createElement("canvas");
    canvas.width = 200;
    canvas.height = 100;
    return canvas.getContext("2d");
}

function fillCanvas(context, color)
{
    context.fillStyle = color;
    context.fillRect(0, 0, 200, 100);
}

function checkPixel(context, x, y, expected, expectedName)
{
    const pixel = Array.from(context.getImageData(x, y, 1, 1).data);
    const description = `pixel at (${x}, ${y}) is ${expectedName}`;
    if (pixel.every((value, i) => Math.abs(value - expected[i]) <= 3))
        testPassed(description);
    else
        testFailed(`${description}, was [${pixel}] but expected [${expected}]`);
}

// Draw with the default composite operation to find out what color the frame has.
const referenceContext = createContext();
referenceContext.drawImage(frame, 20, 20, 60, 60);
const frameColor = Array.from(referenceContext.getImageData(50, 50, 1, 1).data);
if (frameColor[3] === 255)
    testPassed("the frame draws an opaque pixel");
else
    testFailed(`the frame draws an opaque pixel, but it drew [${frameColor}]`);

// [name, composite operation, draws the existing canvas content, [x, y, expected color, name of the expected color] checks]
const testCases = [
    ["copy", "copy",
        context => fillCanvas(context, "rgb(0, 255, 0)"),
        [[50, 50, frameColor, "the frame color"], [150, 50, transparent, "transparent"], [5, 5, transparent, "transparent"]]],
    ["source-in", "source-in",
        context => fillCanvas(context, "rgb(255, 0, 0)"),
        [[50, 50, frameColor, "the frame color"], [150, 50, transparent, "transparent"], [5, 5, transparent, "transparent"]]],
    ["destination-in", "destination-in",
        context => fillCanvas(context, "rgb(255, 0, 0)"),
        [[50, 50, red, "red"], [150, 50, transparent, "transparent"], [5, 5, transparent, "transparent"]]],
    // The frame is drawn behind the red square (40, 40)-(80, 80).
    ["destination-over", "destination-over",
        context => {
            context.fillStyle = "rgb(255, 0, 0)";
            context.fillRect(40, 40, 40, 40);
        },
        [[60, 60, red, "red"], [30, 30, frameColor, "the frame color"], [150, 50, transparent, "transparent"]]],
    ["multiply", "multiply",
        context => fillCanvas(context, "rgb(255, 0, 0)"),
        [[50, 50, [frameColor[0], 0, 0, 255], "the frame color multiplied by red"], [150, 50, red, "red"]]],
];

for (const [name, compositeOperation, drawExistingContent, checks] of testCases) {
    debug("");
    debug(`${name}:`);
    const context = createContext();
    drawExistingContent(context);
    context.globalCompositeOperation = compositeOperation;
    context.drawImage(frame, 20, 20, 60, 60);
    for (const [x, y, expected, expectedName] of checks)
        checkPixel(context, x, y, expected, expectedName);
}

frame.close();
</script>
</body>
</html>
