<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<script src="../../../resources/js-test.js"></script>
<script>
var gl;

function runTest() {
    const canvas = document.createElement("canvas");
    gl = canvas.getContext("webgl2");

    const program = gl.createProgram();
    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, "attribute vec4 pos; void main() { gl_Position = pos; }");
    gl.compileShader(vertexShader);
    gl.attachShader(program, vertexShader);
    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, "void main() { gl_FragColor = vec4(1.0); }");
    gl.compileShader(fragmentShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    // A framebuffer whose only attachment is COLOR_ATTACHMENT1. It is complete, but draw
    // buffer 0 is COLOR_ATTACHMENT0, which has no attachment, so the draw renders nowhere.
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 16, 16, 0, gl.RGB, gl.UNSIGNED_SHORT_5_6_5, null);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texture, 0);

    // LINE_LOOP is emulated with a line strip plus a separate draw for the closing segment.
    // That second draw must be skipped along with the first one.
    gl.drawArrays(gl.LINE_LOOP, 0, 4);
    gl.finish();

    shouldBe("gl.getError()", "gl.NO_ERROR");
    testPassed("LINE_LOOP draw with nothing bound to draw buffer 0 did not crash.");
}
</script>
</head>
<body onload="runTest()">
</body>
</html>
