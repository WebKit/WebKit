<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
</head>
<body>
<script>
description("Tests that drawImage() honors an image's EXIF orientation for full-canvas composite modes, which draw through an intermediate buffer, the same way it does for source-over.");

window.jsTestIsAsync = true;

// Large enough that the destination rect below does not contain the canvas, so that drawImage()
// takes its isFullCanvasCompositeMode() path through fullCanvasCompositedDrawImage() rather than
// the rectContainsCanvas() one.
const canvasSize = 256;
const componentsPerPixel = 4;

// Orientation 1 applies no transform, so it is a control: the two paths have to agree on it
// whether or not orientation is being applied. If it fails, the paths differ for some reason
// other than orientation and the rest of the results say nothing about orientation.
const controlURL = "exif-orientation-1-ul.jpg";
const orientedURLs = [
    "exif-orientation-2-ur.jpg",
    "exif-orientation-3-lr.jpg",
    "exif-orientation-4-lol.jpg",
    "exif-orientation-5-lu.jpg",
    "exif-orientation-6-ru.jpg",
    "exif-orientation-7-rl.jpg",
    "exif-orientation-8-llo.jpg",
];

function loadImage(url)
{
    return new Promise((resolve, reject) => {
        const image = new Image;
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Failed to load ${url}`));
        image.src = url;
    });
}

function drawAndReadBack(image, composite)
{
    const element = document.createElement("canvas");
    element.width = canvasSize;
    element.height = canvasSize;
    const context = element.getContext("2d");
    if (composite != "source-over") {
        // "source-in" keeps the source only where the destination is already opaque, so the
        // destination needs opaque contents for anything to survive the composite.
        context.fillStyle = "white";
        context.fillRect(0, 0, canvasSize, canvasSize);
        context.globalCompositeOperation = composite;
    }
    context.drawImage(image, 0, 0, image.width, image.height);
    return context.getImageData(0, 0, image.width, image.height).data;
}

function isFlat(data)
{
    for (let component = 0; component < data.length; ++component) {
        if (data[component] != data[component % componentsPerPixel])
            return false;
    }
    return true;
}

function worstDifference(reference, composited)
{
    let difference = 0;
    let component = -1;
    for (let i = 0; i < reference.length; ++i) {
        const d = Math.abs(reference[i] - composited[i]);
        if (d > difference) {
            difference = d;
            component = i;
        }
    }
    return { difference, component };
}

async function compare(url, isControl)
{
    let image;
    try {
        image = await loadImage(`../images/resources/${url}`);
    } catch (error) {
        testFailed(`${error.message}`);
        return;
    }

    const reference = drawAndReadBack(image, "source-over");
    const composited = drawAndReadBack(image, "source-in");

    if (isFlat(reference)) {
        testFailed(`${url}: the "source-over" draw is a single flat color, so this comparison could not detect a dropped orientation.`);
        return;
    }

    const { difference, component } = worstDifference(reference, composited);
    if (!difference) {
        testPassed(`${url}: "source-in" matches "source-over"`);
        return;
    }

    const where = `by ${difference} at component ${component} of pixel ${Math.floor(component / componentsPerPixel)}`;
    if (isControl)
        testFailed(`${url}: "source-in" differs from "source-over" ${where}. This image needs no orientation transform, so the two paths differ for some other reason and the results below are inconclusive.`);
    else
        testFailed(`${url}: "source-in" differs from "source-over" ${where}, which suggests the orientation was not applied.`);
}

async function runTests()
{
    await compare(controlURL, true);
    for (const url of orientedURLs)
        await compare(url, false);

    finishJSTest();
}

runTests().catch(error => {
    testFailed(`Unexpected exception: ${error}`);
    finishJSTest();
});
</script>
</body>
</html>
