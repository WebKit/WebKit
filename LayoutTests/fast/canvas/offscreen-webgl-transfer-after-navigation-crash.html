<!DOCTYPE html>
<script>
testRunner?.dumpAsText();
testRunner?.waitUntilDone();
function test() {
    var iframe = document.querySelector("iframe");
    var canvas = iframe.contentDocument.createElement("canvas");
    var offscreen = canvas.transferControlToOffscreen();
    offscreen.getContext("webgl");
    iframe.onload = () => {
        try { offscreen.transferToImageBitmap(); } catch(e) {}
        testRunner?.notifyDone();
    };
    iframe.contentWindow.navigation.navigate("about:blank");
}
</script>
<body onload=test()>
PASS if no crash.
<iframe srcdoc="<p>Navigated away from.</p>"></iframe>
