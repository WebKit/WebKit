<!DOCTYPE html>
<title>createImageBitmap() sizes an SVG by its natural dimensions, not by its element's box</title>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<!-- No natural dimensions. -->
<img id="ratioOnly" style="width: 200px; height: 100px"
     src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="100%" height="100%" fill="green"/></svg>'>

<!-- 20x10, stretched by CSS. -->
<img id="sized" style="width: 200px; height: 100px"
     src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="10"><rect width="100%" height="100%" fill="green"/></svg>'>
<script>
function loaded(id)
{
    const image = document.getElementById(id);
    return image.complete ? Promise.resolve(image) : new Promise(resolve => image.onload = () => resolve(image));
}

promise_test(async t => {
    await promise_rejects_dom(t, "InvalidStateError", createImageBitmap(await loaded("ratioOnly")));
}, "A viewBox-only SVG, laid out at 200x100, is rejected");

promise_test(async () => {
    const bitmap = await createImageBitmap(await loaded("sized"));
    assert_equals(bitmap.width, 20);
    assert_equals(bitmap.height, 10);
}, "An SVG with a width and height of its own, laid out at 200x100, keeps them");
</script>
