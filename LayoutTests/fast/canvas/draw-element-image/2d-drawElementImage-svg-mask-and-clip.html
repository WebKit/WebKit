<!-- webkit-test-runner [ HTMLInCanvasEnabled=true ] -->
<!DOCTYPE html>
<meta name="fuzzy" content="maxDifference=0-113; totalPixels=0-1486">
<style>
    canvas {
        width: 300px;
        height: 100px;
    }
    .box {
        width: 100px;
        height: 100px;
    }
    svg {
        display: block;
    }
</style>
<body>
    <canvas id="canvas" width="300" height="100" content="drawable">
        <div id="mask" class="box" drawable>
            <svg width="100" height="100">
                <mask id="left-half">
                    <rect width="50" height="100" fill="white"/>
                </mask>
                <rect width="100" height="100" fill="green" mask="url(#left-half)"/>
            </svg>
        </div>
        <div id="clip" class="box" drawable>
            <svg width="100" height="100">
                <clipPath id="two-squares">
                    <rect width="50" height="50"/>
                    <rect x="50" y="50" width="50" height="50"/>
                </clipPath>
                <rect width="100" height="100" fill="green" clip-path="url(#two-squares)"/>
            </svg>
        </div>
        <div id="text" class="box" drawable>
            <svg width="100" height="100">
                <linearGradient id="gradient">
                    <stop offset="0" stop-color="green"/>
                    <stop offset="1" stop-color="blue"/>
                </linearGradient>
                <text x="10" y="60" font-family="Ahem" font-size="25" fill="url(#gradient)">X X</text>
            </svg>
        </div>
    </canvas>
    <script>
        if (window.testRunner)
            testRunner.waitUntilDone();

        function runTest() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawElementImage(mask, 0, 0);
            ctx.drawElementImage(clip, 100, 0);
            ctx.drawElementImage(text, 200, 0);

            if (window.testRunner)
                testRunner.notifyDone();
        }

        canvas.onpaint = runTest;
    </script>
</body>
