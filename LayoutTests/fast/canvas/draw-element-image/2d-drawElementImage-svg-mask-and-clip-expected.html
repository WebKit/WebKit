<!DOCTYPE html>
<style>
    .container {
        display: flex;
        width: 300px;
        height: 100px;
    }
    svg {
        display: block;
    }
</style>
<body>
    <div class="container">
        <svg width="100" height="100">
            <mask id="left-half">
                <rect width="50" height="100" fill="white"/>
            </mask>
            <rect width="100" height="100" fill="green" mask="url(#left-half)"/>
        </svg>
        <svg width="100" height="100">
            <clipPath id="two-squares">
                <rect width="50" height="50"/>
                <rect x="50" y="50" width="50" height="50"/>
            </clipPath>
            <rect width="100" height="100" fill="green" clip-path="url(#two-squares)"/>
        </svg>
        <svg width="100" height="100">
            <linearGradient id="gradient">
                <stop offset="0" stop-color="green"/>
                <stop offset="1" stop-color="blue"/>
            </linearGradient>
            <text x="10" y="60" font-family="Ahem" font-size="25" fill="url(#gradient)">X X</text>
        </svg>
    </div>
</body>
