<!DOCTYPE html> <!-- webkit-test-runner [ ContentInsetBackgroundFillEnabled=true TopContentInsetBackgroundCanChangeAfterScrolling=false pageTopColorSamplingEnabled=false useFlexibleViewport=true obscuredInset.top=50 ] -->
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<style>
body, html {
    font-family: system-ui;
    margin: 0;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    z-index: 100;
    background-color: light-dark(rgb(255, 99, 71), rgb(0, 128, 0));
}

.click-target {
    position: absolute;
    top: 150px;
    left: 100px;
    width: 100px;
    height: 200px;
    z-index: 2000;
}

.tall {
    height: 2000px;
}
</style>
<script src="../../resources/js-test.js"></script>
<script src="../../resources/ui-helper.js"></script>
<script>
// The color scheme of a page can also be changed with a meta tag, which doesn't change the color-scheme of any element
// but still changes the color of a header that uses light-dark(). The header has a child because an empty fixed
// element with a light-dark() background isn't sampled.
jsTestIsAsync = true;

async function interactWithPage()
{
    // On iOS, a tap only counts as user interaction if something on the page handles the click.
    const target = document.querySelector(".click-target");
    const clicked = new Promise(resolve => target.addEventListener("click", resolve, { once: true }));
    await UIHelper.activateElement(target);
    await clicked;
}

async function topEdgeColorAfterUpdate()
{
    await UIHelper.ensurePresentationUpdate();
    return (await UIHelper.fixedContainerEdgeColors()).top;
}

addEventListener("load", async () => {
    await UIHelper.setObscuredInsets(50, 0, 0, 0);
    const meta = document.querySelector("meta[name=color-scheme]");
    const header = document.querySelector("header");

    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(255, 99, 71)");

    await interactWithPage();
    header.style.backgroundColor = "rgb(255, 255, 0)";
    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(255, 99, 71)");
    header.style.removeProperty("background-color");

    meta.setAttribute("content", "dark");
    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(0, 128, 0)");

    meta.setAttribute("content", "light");
    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(255, 99, 71)");

    finishJSTest();
});
</script>
</head>
<body>
<header><div></div></header>
<div class="tall"></div>
<div class="click-target"></div>
</body>
</html>
