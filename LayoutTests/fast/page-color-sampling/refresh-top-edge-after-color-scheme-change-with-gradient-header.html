<!DOCTYPE html> <!-- webkit-test-runner [ ContentInsetBackgroundFillEnabled=true TopContentInsetBackgroundCanChangeAfterScrolling=false pageTopColorSamplingEnabled=false useFlexibleViewport=true obscuredInset.top=50 ] -->
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    color-scheme: light;
}

:root.dark {
    color-scheme: dark;
}

body, html {
    font-family: system-ui;
    margin: 0;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    z-index: 100;
    background: linear-gradient(rgb(200, 0, 0), rgb(200, 0, 0));
}

:root.dark header {
    background: linear-gradient(rgb(0, 0, 200), rgb(0, 0, 200));
}

.click-target {
    position: absolute;
    top: 150px;
    left: 100px;
    width: 100px;
    height: 200px;
    z-index: 2000;
}

.tall {
    height: 2000px;
}
</style>
<script src="../../resources/js-test.js"></script>
<script src="../../resources/ui-helper.js"></script>
<script>
// The color of a header that is painted with a gradient can't be read from its style, so it is normally only sampled
// once for as long as the same element is at the top. This checks that it is sampled again after a color scheme change.
jsTestIsAsync = true;

async function interactWithPage()
{
    // On iOS, a tap only counts as user interaction if something on the page handles the click.
    const target = document.querySelector(".click-target");
    const clicked = new Promise(resolve => target.addEventListener("click", resolve, { once: true }));
    await UIHelper.activateElement(target);
    await clicked;
}

async function topEdgeColorAfterUpdate()
{
    await UIHelper.ensurePresentationUpdate();
    return (await UIHelper.fixedContainerEdgeColors()).top;
}

addEventListener("load", async () => {
    await UIHelper.setObscuredInsets(50, 0, 0, 0);
    const root = document.documentElement;

    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(200, 0, 0)");

    await interactWithPage();

    root.classList.add("dark");
    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(0, 0, 200)");

    root.classList.remove("dark");
    topColor = await topEdgeColorAfterUpdate();
    shouldBeEqualToString("topColor", "rgb(200, 0, 0)");

    finishJSTest();
});
</script>
</head>
<body>
<header></header>
<div class="tall"></div>
<div class="click-target"></div>
</body>
</html>
