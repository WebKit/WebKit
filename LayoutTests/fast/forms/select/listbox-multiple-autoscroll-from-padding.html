<!DOCTYPE html>
<html>
<body>
<script src="../../../resources/js-test.js"></script>
<select id="select" size="3" multiple style="padding-left: 30px">
<option>Option 1</option>
<option selected>Option 2</option>
<option>Option 3</option>
<option>Option 4</option>
<option>Option 5</option>
</select>
<script>
description('Autoscrolling a multiple-selection listbox after pressing the mouse button outside of any option should not assert or change the selection.');
jsTestIsAsync = true;

const select = document.getElementById('select');

function selectedOptionsText()
{
    return Array.from(select.selectedOptions, option => option.text).join();
}

window.onload = () => {
    if (!window.eventSender) {
        debug('Press the mouse button in the left padding of the listbox, drag below the listbox and hold. The test passes if there is no crash and Option 2 is still the only selected option.');
        return;
    }

    // Pressing in the padding doesn't hit an option, so no selection anchor is set.
    const x = select.offsetLeft + 10;
    const y = select.offsetTop + 10;
    eventSender.dragMode = false;
    eventSender.mouseMoveTo(x, y);
    eventSender.mouseDown();
    eventSender.mouseMoveTo(x, y + 20);
    eventSender.mouseMoveTo(x, y + 200);

    setTimeout(() => {
        eventSender.mouseUp();
        testPassed('Did not crash.');
        shouldBeEqualToString('selectedOptionsText()', 'Option 2');
        finishJSTest();
    }, 200);
};
</script>
</body>
</html>
