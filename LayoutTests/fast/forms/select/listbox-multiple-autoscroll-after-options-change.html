<!DOCTYPE html>
<html>
<body>
<script src="../../../resources/js-test.js"></script>
<select id="select" size="3" multiple>
<option>Option 1</option>
<option>Option 2</option>
<option>Option 3</option>
<option>Option 4</option>
<option>Option 5</option>
</select>
<script>
description('Autoscrolling a multiple-selection listbox after its options were changed during the drag should not assert.');
jsTestIsAsync = true;

const select = document.getElementById('select');

function selectedOptionsText()
{
    return Array.from(select.selectedOptions, option => option.text).join();
}

window.onload = () => {
    if (!window.eventSender) {
        debug('Press the mouse button on an option, drag below the listbox and hold. The test passes if there is no crash.');
        return;
    }

    const x = select.offsetLeft + 7;
    const y = select.offsetTop + 7;
    eventSender.dragMode = false;
    eventSender.mouseMoveTo(x, y);
    eventSender.mouseDown();
    eventSender.mouseMoveTo(x, y + 20);
    eventSender.mouseMoveTo(x, y + 200);

    // Changing the options resets the active selection anchor while autoscroll is running.
    select.appendChild(new Option('Option 6'));

    setTimeout(() => {
        eventSender.mouseUp();
        testPassed('Did not crash.');
        shouldBeEqualToString('selectedOptionsText()', 'Option 1');
        finishJSTest();
    }, 200);
};
</script>
</body>
</html>
