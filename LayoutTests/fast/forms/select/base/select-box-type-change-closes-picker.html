<!DOCTYPE html>
<html>
<head>
<script src="../../../../resources/js-test.js"></script>
<script src="../../../../resources/ui-helper.js"></script>
<style>
select, select::picker(select) {
    appearance: base-select;
}
/* js-test grows its console at the top of the body, which would push these out of reach. */
#controls { position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<div id="controls">
<select id="becomesMultiple"><option>one</option><option>two</option></select>
<select id="becomesSized"><option>one</option><option>two</option></select>
<select id="staysADropdown" size="1"><option>one</option><option>two</option></select>
<select id="flipsBack"><option>one</option><option>two</option></select>
<select id="opensIntoAListBox"><option>one</option><option>two</option></select>
</div>
<div id="otherPopover" popover>other</div>
<script>
description("A select that stops being a dropdown box closes its picker, since only a dropdown box has one. The console messages below show which ones closed for that reason.");

jsTestIsAsync = true;

async function openPicker(select)
{
    await UIHelper.activateElement(select);
    await UIHelper.animationFrame();
}

(async () => {
    await openPicker(becomesMultiple);
    shouldBeTrue("becomesMultiple.matches(':open')");
    // The preferred size goes from one to four, so this is a list box now.
    becomesMultiple.multiple = true;
    await UIHelper.animationFrame();
    shouldBeFalse("becomesMultiple.matches(':open')");
    shouldBe("document.activeElement", "becomesMultiple");

    debug("");
    await openPicker(becomesSized);
    shouldBeTrue("becomesSized.matches(':open')");
    becomesSized.size = 4;
    await UIHelper.animationFrame();
    shouldBeFalse("becomesSized.matches(':open')");

    debug("");
    debug("Setting size to what it already is leaves the picker alone.");
    await openPicker(staysADropdown);
    shouldBeTrue("staysADropdown.matches(':open')");
    staysADropdown.size = 1;
    await UIHelper.animationFrame();
    shouldBeTrue("staysADropdown.matches(':open')");
    await UIHelper.activateElement(staysADropdown);

    debug("");
    debug("Turning multiple on and off again before the picker closes leaves it open.");
    await openPicker(flipsBack);
    shouldBeTrue("flipsBack.matches(':open')");
    flipsBack.multiple = true;
    flipsBack.multiple = false;
    await UIHelper.animationFrame();
    shouldBeTrue("flipsBack.matches(':open')");
    await UIHelper.activateElement(flipsBack);

    debug("");
    debug("Script run by opening the picker from the keyboard can make the select a list box, which closes the picker.");
    otherPopover.showPopover();
    const makeAListBox = () => { opensIntoAListBox.size = 4; };
    otherPopover.addEventListener("beforetoggle", makeAListBox, { once: true });
    opensIntoAListBox.focus();
    await UIHelper.keyDown(" ");
    await UIHelper.animationFrame();
    opensIntoAListBox.removeAttribute("size");
    shouldBeFalse("opensIntoAListBox.matches(':open')");
    // Space doesn't open the picker everywhere, so this may not have run yet.
    otherPopover.removeEventListener("beforetoggle", makeAListBox);
    otherPopover.hidePopover();

    finishJSTest();
})();
</script>
</body>
</html>
