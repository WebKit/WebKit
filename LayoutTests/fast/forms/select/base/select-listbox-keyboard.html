<!DOCTYPE html><!-- webkit-test-runner [ HTMLEnhancedSelectMultipleAndListBoxEnabled=true useHardwareKeyboardMode=true ] -->
<html>
<head>
<script src="../../../../resources/js-test.js"></script>
<script src="../../../../resources/ui-helper.js"></script>
<style>
select {
    appearance: base-select;
}
</style>
<style id="checkmarkStyle"></style>
<style>
/* js-test grows its console at the top of the body, which would push these out of the viewport
   and out of reach of the synthesized clicks below. */
#controls { position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<div id="controls">
<select id="keyboard" multiple>
    <option id="keyboardOne">one</option>
    <option id="keyboardTwo">two</option>
</select>
<input id="beforeTab">
<select id="tabbed" size="4">
    <option id="tabbedOne">one</option>
    <option id="tabbedTwo">two</option>
</select>
<input id="afterTab">
<select id="paging" size="3">
    <option id="pagingOne">alpha</option>
    <option>bravo</option>
    <option>charlie</option>
    <option>delta</option>
    <option id="pagingLast">echo</option>
</select>
<form id="submitting" action="about:blank">
    <select id="submitted" size="2">
        <option>one</option>
        <option>two</option>
    </select>
    <input type="submit">
</form>
</div>
<script>
description("Keyboard interaction with an appearance: base-select list box. Separate from select-listbox.html so that it can be skipped where key events cannot be synthesized.");

// Top level so that shouldBe()'s eval() can reach it.
let didSubmit = false;

jsTestIsAsync = true;

(async () => {
    debug("Arrow keys move focus from a focused list box into its options.");
    keyboard.focus();
    shouldBe("document.activeElement", "keyboard");

    await UIHelper.keyDown("downArrow");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "keyboardOne");

    await UIHelper.keyDown("downArrow");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "keyboardTwo");

    await UIHelper.keyDown("upArrow");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "keyboardOne");

    debug("");
    debug("Moving focus does not change the selection.");
    shouldBe("keyboard.selectedOptions.length", "0");

    debug("");
    debug("Tab reaches the list box itself rather than each of its options.");
    beforeTab.focus();
    await UIHelper.keyDown("\t");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "tabbed");
    await UIHelper.keyDown("\t");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "afterTab");

    debug("");
    debug("Home, End and the page keys move focus within the list box.");
    pagingOne.focus();
    await UIHelper.keyDown("end");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "pagingLast");
    await UIHelper.keyDown("home");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "pagingOne");
    // Three rows visible, so a page is two options.
    await UIHelper.keyDown("pageDown");
    await UIHelper.animationFrame();
    shouldBeEqualToString("document.activeElement.textContent", "charlie");
    await UIHelper.keyDown("pageUp");
    await UIHelper.animationFrame();
    shouldBe("document.activeElement", "pagingOne");

    debug("");
    debug("Type-ahead moves focus without selecting.");
    paging.focus();
    await UIHelper.keyDown("c");
    await UIHelper.animationFrame();
    shouldBeEqualToString("document.activeElement.textContent", "charlie");
    shouldBe("paging.selectedOptions.length", "0");

    debug("");
    debug("An untrusted keypress does not fall back to selecting type-ahead.");
    paging.dispatchEvent(new KeyboardEvent("keypress", { charCode: 100 /* d for delta */, bubbles: true }));
    shouldBe("paging.selectedOptions.length", "0");

    debug("");
    debug("Space picks the focused option.");
    pagingOne.focus();
    await UIHelper.keyDown(" ");
    await UIHelper.animationFrame();
    shouldBeTrue("pagingOne.selected");

    debug("");
    debug("Return submits the form implicitly.");
    submitting.addEventListener("submit", event => {
        event.preventDefault();
        didSubmit = true;
    });
    document.getElementById("submitted").focus();
    await UIHelper.keyDown("\r");
    await UIHelper.animationFrame();
    shouldBeTrue("didSubmit");

    finishJSTest();
})();
</script>
</body>
</html>
