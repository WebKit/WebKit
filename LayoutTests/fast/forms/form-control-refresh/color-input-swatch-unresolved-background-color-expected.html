<!DOCTYPE html>
<html>
<head>
<style>
input::-webkit-color-swatch {
    color: green;
    background-color: green;
}
</style>
</head>
<body>
    <p>Tests that a color input swatch paints a background-color that can only be resolved at use time.</p>
    <input type="color" id="currentColor">
    <input type="color" id="relativeColor">
</body>
</html>
