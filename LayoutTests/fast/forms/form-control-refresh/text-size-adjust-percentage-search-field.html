<!DOCTYPE html><!-- webkit-test-runner [ FormControlRefreshEnabled=true ] -->
<html>
<head>
<script>
if (window.internals) {
    internals.settings.setTextAutosizingEnabled(true);
    internals.settings.setTextAutosizingUsesIdempotentMode(false);
}
</script>
<script src="../../../resources/js-test.js"></script>
<style>
.adjust { -webkit-text-size-adjust: 130%; }
.adjust input { font-size: 20px; }
.control { -webkit-text-size-adjust: none; }
.control input { font-size: 26px; }
</style>
</head>
<body>
<div class="adjust"><input id="searchAdjusted" type="search" value="x"></div>
<div class="control"><input id="searchControl" type="search" value="x"></div>
<script>
description("Tests that em-sized search field parts include a percentage -webkit-text-size-adjust.");

function part(id, name) {
    const queue = [...internals.shadowRoot(document.getElementById(id)).children];
    while (queue.length) {
        const element = queue.shift();
        if (internals.userAgentPart(element) == name)
            return element.getBoundingClientRect();
        queue.push(...element.children);
    }
    return null;
}

shouldBe("part('searchAdjusted', '-webkit-search-decoration').width", "part('searchControl', '-webkit-search-decoration').width");
shouldBe("part('searchAdjusted', '-webkit-search-cancel-button').width", "part('searchControl', '-webkit-search-cancel-button').width");
shouldBe("part('searchControl', '-webkit-search-decoration').width", "26");
</script>
</body>
</html>
