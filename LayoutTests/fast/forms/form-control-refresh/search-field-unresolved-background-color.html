<!DOCTYPE html>
<html>
<head>
<script>
// An author-specified background-color disables the native appearance of the search field, so use a user style sheet.
window.testRunner?.addUserStyleSheet(`
    input[type="search"] { color: green; }
    #currentColor { background-color: currentcolor; }
    #relativeColor { background-color: rgb(from currentcolor r g b); }
`, true);
</script>
</head>
<body>
    <p>Tests that a search field paints a background-color that can only be resolved at use time.</p>
    <input type="search" id="currentColor">
    <input type="search" id="relativeColor">
</body>
</html>
