<!DOCTYPE html> <!-- webkit-test-runner [ useFlexibleViewport=true shouldHandleRunOpenPanel=false useHardwareKeyboardMode=true ] -->
<html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
<script src="../../../resources/js-test.js"></script>
<script src="../../../resources/ui-helper.js"></script>
<script src="resources/window-blur-focus-utils.js"></script>
<script>
jsTestIsAsync = true;

addEventListener("blur", (e) => {
    debug("BLUR");
});

addEventListener("focus", (e) => {
    debug("FOCUS");
});

addEventListener("load", async () => {
    description("This test verifies that presenting and dismissing the menu for file inputs correctly dispatches blur and focus events when the page focuses an editable element while presenting the menu with a hardware keyboard attached.");

    chooseFileButton.addEventListener("click", () => {
        fileInput.click();
        editor.focus();
    });

    await UIHelper.activateElement(chooseFileButton);
    await UIHelper.waitForContextMenuToShow();
    await waitForWindowBlur();
    await UIHelper.ensurePresentationUpdate();
    await UIHelper.activateAt(0, 0);
    await UIHelper.waitForContextMenuToHide();
    await waitForWindowFocus();
    await UIHelper.ensurePresentationUpdate();

    finishJSTest();
});
</script>
<style>
#chooseFileButton {
    position: fixed;
    bottom: 100px;
    left: 1em;
    width: 180px;
    height: 44px;
}
</style>
</head>
<body>
<div id="editor" contenteditable>Hello</div>
<input id="fileInput" type="file" style="display: none">
<button id="chooseFileButton">Show file picker</button>
</body>
</html>
