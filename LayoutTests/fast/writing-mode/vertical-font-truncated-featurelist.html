<!DOCTYPE html>
<html>
<head>
<title>Vertical text with a font whose GSUB FeatureList array ends mid-record</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<style type="text/css">
@font-face {
    font-family: 'truncated';
    /* DroidSansFallback-truncated-featurelist.ttf is DroidSansFallback-reduced.ttf with its GSUB
       table length cut to where the second FeatureRecord starts, and featureCount raised to 2.
       Looking for the 'vert' feature has to reject that array rather than read the record that is
       no longer inside the table. The font has no DFLT script, so the lookup takes the path that
       scans the FeatureList directly. */
    src: url('resources/DroidSansFallback-truncated-featurelist.ttf');
}
#test {
    font-size: 25px;
    font-family: truncated;
    -webkit-writing-mode: vertical-rl;
    height: 200px;
}
</style>
</head>
<body>
<p>
Laying out vertical text with this font must not read past the end of its GSUB table. There is
nothing to see here; the test is that the web process survives it.
</p>
<div id="test">。、「」（）：；ぁあぃい</div>
<pre id="log">PASS</pre>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

addEventListener("load", async () => {
    // Force the font to load and lay out before the text dump, so the GSUB tables are read.
    await document.fonts.load("25px truncated");
    document.getElementById("test").offsetHeight;

    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
</html>
