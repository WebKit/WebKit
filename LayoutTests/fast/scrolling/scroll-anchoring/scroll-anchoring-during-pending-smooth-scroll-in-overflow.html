<!DOCTYPE html><!-- webkit-test-runner [ AsyncOverflowScrollingEnabled=true ] -->
<html>
<head>
<style>
.scroller {
    width: 400px;
    height: 400px;
    overflow-y: scroll;
    border: 1px solid black;
}

.spacer {
    height: 4000px;
    background: repeating-linear-gradient(white, silver 200px);
}

.changing {
    height: 300px;
    background-color: orange;
}

.scroller.changed .changing {
    height: 400px;
}

.anchor {
    height: 300px;
    background-color: limegreen;
}

.content {
    height: 4000px;
    background: repeating-linear-gradient(white, silver 200px);
}
</style>
<script src="../../../resources/ui-helper.js"></script>
<script src="../../../resources/js-test.js"></script>
<script>
jsTestIsAsync = true;

description("Test that a scroll anchoring adjustment made before the next rendering update does not drop a pending smooth scroll in an overflow scroller");

let scroller;

async function runTest()
{
    scroller = document.querySelector(".scroller");

    scroller.scrollTo(0, 4400);
    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();

    scroller.scrollTo({ top: 0, behavior: "smooth" });
    // This grows content above the anchor, so the next rendering update makes a scroll anchoring adjustment.
    scroller.classList.add("changed");

    await UIHelper.waitForTargetScrollAnimationToSettle(scroller);

    shouldBe("scroller.scrollTop", "0");
    finishJSTest();
}

window.addEventListener("load", runTest);
</script>
</head>
<body>
<div class="scroller">
    <div class="spacer"></div>
    <div class="changing"></div>
    <div class="anchor"></div>
    <div class="content"></div>
</div>
<div id="console"></div>
</body>
</html>
