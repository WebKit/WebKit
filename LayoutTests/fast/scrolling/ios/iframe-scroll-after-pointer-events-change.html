<!DOCTYPE html> <!-- webkit-test-runner [ AsyncOverflowScrollingEnabled=true AsyncFrameScrollingEnabled=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    margin: 0;
}

#description {
    margin-top: 320px;
}

.container {
    position: absolute;
    top: 0;
    left: 0;
    width: 300px;
    height: 300px;
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
}
</style>
<script src="../../../resources/js-test.js"></script>
<script src="../../../resources/ui-helper.js"></script>
<script>
jsTestIsAsync = true;
description("This test verifies that an iframe that starts out with pointer-events: none can be scrolled after its pointer-events is changed to auto. To manually run the test, load the page and scroll the box.");

var iframe;

function hasFrameHostingNode() {
    return internals.scrollingStateTreeAsText().includes("Frame hosting node");
}

addEventListener("load", async () => {
    iframe = document.querySelector("iframe");

    if (!window.testRunner) {
        iframe.style.pointerEvents = "auto";
        return;
    }

    await UIHelper.ensurePresentationUpdate();
    shouldBe("hasFrameHostingNode()", "false");

    iframe.style.pointerEvents = "auto";
    await UIHelper.renderingUpdate();
    await UIHelper.ensurePresentationUpdate();
    shouldBe("hasFrameHostingNode()", "true");

    await UIHelper.immediateScrollElementAtContentPointToOffset(150, 150, 0, 200);
    await UIHelper.ensurePresentationUpdate();
    shouldBe("iframe.contentWindow.scrollY", "200");
    shouldBe("window.scrollY", "0");

    finishJSTest();
});
</script>
</head>
<body>
    <div class="container">
        <iframe srcdoc="<div style='height: 2000px; background-image: linear-gradient(green, blue);'></div>"></iframe>
    </div>
</body>
</html>
