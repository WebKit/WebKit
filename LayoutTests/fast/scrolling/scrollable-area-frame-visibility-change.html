<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
}

#description {
    margin-top: 220px;
}

.container {
    position: absolute;
    top: 0;
    left: 0;
    width: 200px;
    height: 200px;
    visibility: hidden;
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
<script src="../../resources/js-test.js"></script>
<script>
jsTestIsAsync = true;
description("This test verifies that a scrollable iframe is added to and removed from the scrollable areas when a style-only change on an ancestor makes it visible or hidden.");

var container;
var iframe;

function updateLayout() {
    document.body.offsetTop;
    iframe.contentDocument.body.offsetTop;
}

addEventListener("load", () => {
    container = document.querySelector(".container");
    iframe = document.querySelector("iframe");

    if (!window.internals) {
        finishJSTest();
        return;
    }

    updateLayout();
    shouldBe("internals.numberOfScrollableAreas()", "0");

    container.style.visibility = "visible";
    updateLayout();
    shouldBe("internals.numberOfScrollableAreas()", "1");

    container.style.visibility = "hidden";
    updateLayout();
    shouldBe("internals.numberOfScrollableAreas()", "0");

    finishJSTest();
});
</script>
</head>
<body>
    <div class="container">
        <iframe srcdoc="<div style='height: 2000px;'></div>"></iframe>
    </div>
</body>
</html>
