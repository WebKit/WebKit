<!DOCTYPE html> <!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<html>
<head>
<script src="../../../resources/ui-helper.js"></script>
<style>
    body {
        margin: 0;
        height: 5000px;
    }
    .sticky {
        position: sticky;
        top: 0;
        height: 20px;
        background-color: green;
    }
    .marker {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: blue;
    }
</style>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

window.addEventListener("load", async () => {
    if (!window.eventSender)
        return;

    await UIHelper.startMonitoringWheelEvents();
    eventSender.mouseMoveTo(100, 100);

    // mouseScrollBy() forces a rendering update and then sends the wheel event to the UI process without waiting. So the
    // change below happens after the rendering update, and the asynchronous document scroll can only reach the web
    // process once this script yields, normally before the next layout.
    eventSender.mouseScrollBy(0, -10);

    // Add a positioned layer, and resolve its style without laying it out.
    const marker = document.createElement("div");
    marker.className = "marker";
    document.body.appendChild(marker);
    getComputedStyle(marker).color;

    await UIHelper.waitForScrollCompletion();

    document.getElementById("result").textContent = window.scrollY > 0 ? "PASS: the document scrolled, and nothing crashed." : "FAIL: the document did not scroll.";
    testRunner.notifyDone();
});
</script>
</head>
<body>
<div class="sticky"></div>
<p id="result">This test requires WebKitTestRunner.</p>
</body>
</html>
