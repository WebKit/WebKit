<!DOCTYPE html> <!-- webkit-test-runner [ EventHandlerDrivenSmoothKeyboardScrollingEnabled=true ScrollAnimatorEnabled=true ] -->
<html>
<head>
<script src="../../../resources/ui-helper.js"></script>
<script src="../../../resources/js-test.js"></script>
<style>
body {
    height: 10000px;
}

#scroller {
    width: 300px;
    height: 300px;
    overflow: scroll;
}

#scroller > div {
    height: 10000px;
}
</style>
</head>
<body>
<div id="scroller" tabindex="0"><div></div></div>
<script>
description("Tests that pressing Home while an animated scroll to the end of the document is in progress scrolls all the way back to the start.");
jsTestIsAsync = true;

async function scrollToEndThenHome(scrollTarget, scrollEventTarget)
{
    const scrolled = new Promise(resolve => scrollEventTarget.addEventListener("scroll", resolve, { once: true }));
    await UIHelper.keyDown("end");
    await scrolled;
    await UIHelper.renderingUpdate();

    await UIHelper.keyDown("home");
    await UIHelper.waitForTargetScrollAnimationToSettle(scrollTarget);
}

async function runTest()
{
    debug("Document");
    await scrollToEndThenHome(document.scrollingElement, window);
    shouldBe("scrollY", "0");

    debug("Overflow scroller");
    scroller.focus();
    await scrollToEndThenHome(scroller, scroller);
    shouldBe("scroller.scrollTop", "0");
    shouldBe("scrollY", "0");

    finishJSTest();
}

window.addEventListener("load", runTest);
</script>
</body>
</html>
