<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div>
        <svg>
            <pattern id="pattern" width="1" height="1" patternContentUnits="objectBoundingBox">
                <rect width="1" height="1" fill="green" />
            </pattern>
            <rect id="rect" width="100" height="100" fill="url(#pattern)">
        </svg>
    </div>
</body>
</html>
