<!DOCTYPE html>
<title>Tests that an anchor() positioned element with position-visibility: anchors-visible follows repeated visibility changes of its anchor, with unrelated style changes in between</title>
<style>
  #container { visibility: hidden; }
  #anchor { anchor-name: --a1; width: 100px; height: 100px; background: orange; }
  #target {
    position: absolute;
    position-anchor: --a1;
    position-visibility: anchors-visible;
    left: anchor(left);
    top: anchor(bottom);
    width: 100px;
    height: 100px;
    background: green;
  }
  #unrelated { position: absolute; left: 300px; top: 0; width: 50px; height: 50px; background-color: rgb(0, 128, 0); }
</style>
<script src="../../../resources/ui-helper.js"></script>
<div id="container"><div id="anchor"></div></div>
<div id="target"></div>
<div id="unrelated"></div>
<script>
  if (window.testRunner) {
    testRunner.waitUntilDone();
    if (testRunner.dontForceRepaint)
      testRunner.dontForceRepaint();
  }

  async function unrelatedStyleChanges() {
    for (let i = 0; i < 3; ++i) {
      unrelated.style.backgroundColor = i % 2 ? "rgb(0, 128, 0)" : "rgb(0, 100, 0)";
      await UIHelper.renderingUpdate();
    }
    unrelated.style.backgroundColor = "rgb(0, 128, 0)";
    await UIHelper.renderingUpdate();
  }

  async function doTest() {
    await UIHelper.renderingUpdate();
    // hidden -> visible -> hidden -> visible, changing only the container's visibility.
    for (const visibility of ["visible", "hidden", "visible"]) {
      await unrelatedStyleChanges();
      container.style.visibility = visibility;
      await UIHelper.renderingUpdate();
    }
    await UIHelper.renderingUpdate();
    if (window.testRunner)
      testRunner.notifyDone();
  }
  window.addEventListener("load", doTest, false);
</script>
