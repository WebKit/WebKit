<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; }
#anchor { position: absolute; left: 100px; top: 0; width: 100px; height: 20px; anchor-name: --a; }
#wrapper { margin-left: 300px; }
#target { position: absolute; left: anchor(--a right, 7px); top: 50px; width: 20px; height: 20px; }
#unrelated { background-color: black; }
</style>
<script src="../../../resources/js-test.js"></script>
</head>
<body>
<div id="anchor"></div>
<div id="wrapper"><div id="target"></div></div>
<div id="unrelated"></div>
<script>
description("Tests anchor positioning when a clean positioned element acquires a containing block that excludes its anchor, and when a fixed element acquires a transformed containing block.");
let target = document.getElementById("target");
let wrapper = document.getElementById("wrapper");
let unrelated = document.getElementById("unrelated");
let color = 0;
function flushUnrelatedChanges()
{
    for (let i = 0; i < 3; ++i) {
        unrelated.style.backgroundColor = `rgb(${++color}, 0, 0)`;
        document.body.offsetTop;
    }
}
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "200");
wrapper.style.position = "relative";
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "307");
target.style.outlineColor = "red";
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "307");
wrapper.style.position = "static";
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "200");
target.style.position = "fixed";
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "200");
document.body.style.transform = "translateX(50px)";
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "250");
document.body.style.transform = "none";
flushUnrelatedChanges();
shouldBe("target.getBoundingClientRect().left", "200");
</script>
</body>
</html>
