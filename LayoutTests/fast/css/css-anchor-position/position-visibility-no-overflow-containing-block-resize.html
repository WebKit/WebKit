<!DOCTYPE html>
<title>Tests that a non-anchored out-of-flow element with position-visibility: no-overflow follows containing block resizes while its own style is unchanged</title>
<style>
  #container { position: relative; width: 400px; height: 150px; }
  #target {
    position: absolute;
    position-visibility: no-overflow;
    top: 0;
    left: 0;
    width: 100px;
    height: 200px;
    background: green;
  }
  #unrelated { position: absolute; left: 300px; top: 0; width: 50px; height: 50px; background-color: rgb(0, 128, 0); }
</style>
<script src="../../../resources/ui-helper.js"></script>
<div id="container"><div id="target"></div></div>
<div id="unrelated"></div>
<script>
  if (window.testRunner) {
    testRunner.waitUntilDone();
    if (testRunner.dontForceRepaint)
      testRunner.dontForceRepaint();
  }

  async function unrelatedStyleChanges() {
    for (let i = 0; i < 3; ++i) {
      unrelated.style.backgroundColor = i % 2 ? "rgb(0, 128, 0)" : "rgb(0, 100, 0)";
      await UIHelper.renderingUpdate();
    }
    unrelated.style.backgroundColor = "rgb(0, 128, 0)";
    await UIHelper.renderingUpdate();
  }

  async function doTest() {
    await UIHelper.renderingUpdate();
    // 150px: target (200px) overflows and is hidden. 250px: fits and is visible. Then back and forth.
    for (const height of ["250px", "150px", "250px"]) {
      await unrelatedStyleChanges();
      container.style.height = height;
      await UIHelper.renderingUpdate();
    }
    await UIHelper.renderingUpdate();
    if (window.testRunner)
      testRunner.notifyDone();
  }
  window.addEventListener("load", doTest, false);
</script>
