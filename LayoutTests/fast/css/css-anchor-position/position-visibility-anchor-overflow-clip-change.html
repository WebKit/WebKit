<!DOCTYPE html>
<title>Tests default-anchor visibility after changing only an intervening overflow clip</title>
<style>
#clip { width: 100px; height: 100px; overflow: visible; }
#anchor { margin-left: 200px; width: 50px; height: 50px; anchor-name: --a; background: orange; }
#target { position: absolute; position-anchor: --a; position-visibility: anchors-visible; left: anchor(left); top: anchor(bottom); width: 50px; height: 50px; background: red; }
#unrelated { position: absolute; left: 400px; top: 0; width: 50px; height: 50px; background: green; }
</style>
<script src="../../../resources/ui-helper.js"></script>
<div id="clip"><div id="anchor"></div></div>
<div id="target"></div><div id="unrelated"></div>
<script>
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.dontForceRepaint();
}
async function run()
{
    await UIHelper.renderingUpdate();
    for (let overflow of ["hidden", "visible", "hidden"]) {
        for (let i = 0; i < 3; ++i) {
            unrelated.style.outlineColor = i % 2 ? "black" : "white";
            await UIHelper.renderingUpdate();
        }
        clip.style.overflow = overflow;
        await UIHelper.renderingUpdate();
        await UIHelper.renderingUpdate();
    }
    if (window.testRunner)
        testRunner.notifyDone();
}
window.addEventListener("load", run);
</script>
