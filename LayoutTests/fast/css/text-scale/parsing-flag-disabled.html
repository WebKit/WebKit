<!DOCTYPE html><!-- webkit-test-runner [ CSSTextScaleMetaEnabled=false ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="text-scale" content="scale">
<link rel="help" href="https://drafts.csswg.org/css-fonts-5/">
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
</head>
<body>
<script>
test(() => {
    assert_equals(internals.textScaleMetaMode(), "legacy");
}, "Parser-inserted meta with content=scale gives legacy when the feature is disabled");

test(() => {
    for (const meta of [...document.querySelectorAll("meta[name]")])
        meta.remove();
    const meta = document.createElement("meta");
    meta.name = "text-scale";
    meta.content = "scale";
    document.head.appendChild(meta);
    assert_equals(internals.textScaleMetaMode(), "legacy", "after insertion");
    meta.content = "SCALE";
    assert_equals(internals.textScaleMetaMode(), "legacy", "after content change");
    meta.name = "TEXT-SCALE";
    assert_equals(internals.textScaleMetaMode(), "legacy", "after name change");
    meta.remove();
    assert_equals(internals.textScaleMetaMode(), "legacy", "after removal");
}, "Dynamic changes give legacy when the feature is disabled");
</script>
</body>
</html>
