<!DOCTYPE html>
<html>
<body>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

function finish(message)
{
    document.body.appendChild(document.createTextNode(message));
    if (window.testRunner)
        testRunner.notifyDone();
}

const worker = new Worker('resources/fallback-walk-prune-worker.js');
worker.onmessage = function (event) { finish("PASS if no crash, faces " + event.data); };
worker.onerror = function (event) { finish("FAIL: worker error: " + event.message); };
</script>
</body>
</html>
