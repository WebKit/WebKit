<!DOCTYPE html>
<html>
<head>
    <title>Container query units with page zoom - expected</title>
    <style>
        body {
            zoom: 2;
            margin: 0;
        }
        .container {
            width: 200px;
            height: 100px;
            background-color: red;
            overflow: hidden;
            position: relative;
        }
        .inner {
            /* 100cqw = 100% of 200px = 200px */
            width: 200px;
            /* 100cqh = 100% of 100px = 100px */
            height: 100px;
            background-color: green;
        }
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            /* 100cqw = 100% of 200px = 200px */
            width: 200px;
            text-align: center;
            /* 5cqmin = 5% of min(200px,100px) = 5px */
            font-size: 5px;
            line-height: 1.2;
            color: white;
            background: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="inner"></div>
        <div class="caption">Caption Text</div>
    </div>
</body>
</html>
