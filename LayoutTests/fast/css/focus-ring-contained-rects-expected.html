<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    overflow: hidden;
}

.ring {
    outline-style: auto;
    position: absolute;
    width: 200px;
    height: 120px;
    padding: 10px;
    font: 10px/12px monospace;
    color: transparent;
}

.offset {
    outline-offset: 4px;
}
</style>
</head>
<body>
<div class="ring" style="left: 20px; top: 20px;"></div>

<div class="ring offset" style="left: 300px; top: 20px;"></div>
</body>
</html>
