<!DOCTYPE html>
<style>
#a { view-transition-name: a; width: 50px; height: 50px; }
#b { view-transition-name: b; width: 50px; height: 50px; }
</style>
<div id="a"></div>
<div id="b"></div>
<pre id="log">This test passes if it does not crash.
</pre>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

const selectors = [
    "::view-transition",
    "::view-transition-group(*)",
    "::view-transition-image-pair(*)",
    "::view-transition-old(*), ::view-transition-new(*)",
];

async function runTest() {
    const style = document.head.appendChild(document.createElement("style"));
    for (const selector of selectors) {
        style.textContent = `${selector} { display: none; }`;
        await document.startViewTransition().finished;
        const count = document.getAnimations().length;
        document.getElementById("log").textContent += `${selector}: ${count ? "FAIL, " + count + " animations remain" : "PASS"}\n`;
    }
    window.testRunner?.notifyDone();
}

window.onload = () => requestAnimationFrame(runTest);
</script>
