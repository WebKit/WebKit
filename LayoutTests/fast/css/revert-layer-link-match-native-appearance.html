<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>revert-layer rollback must use the per-link-match origin when disabling native appearance</title>
<style>
@layer low, high;

@layer low {
    a:visited input { background-color: red; }
}

@layer high {
    input { background-color: revert-layer; }
}
</style>
<script>
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.addUserStyleSheet("input { background-color: rgb(0, 128, 0); }", true);
}
</script>
</head>
<body>
<a href="https://webkit.org/never-visited-revert-layer-link-match-native-appearance">
    <input type="color">
</a>
<script>
addEventListener("load", () => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
        testRunner?.notifyDone();
    }));
});
</script>
</body>
</html>
