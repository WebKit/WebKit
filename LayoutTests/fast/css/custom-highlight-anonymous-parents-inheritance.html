<!DOCTYPE html>
<meta charset="utf-8">
<title>Originating-element highlight inheritance through anonymous parents</title>
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#highlight-cascade">
<link rel="match" href="custom-highlight-anonymous-parents-inheritance-expected.html">
<link rel="issue" href="https://bugs.webkit.org/show_bug.cgi?id=307455">
<style>
@font-face { font-family: Ahem; src: url("../../resources/Ahem.ttf"); }
body { font: 20px Ahem; color: black; background: white; }
.row { margin: 10px 0; }
math { font: inherit; }
.ancestor::highlight(probe) { background-color: yellow; color: blue; }
.origin { --highlight-background: cyan; }
.origin::highlight(probe) { background-color: var(--highlight-background); }
.child::highlight(probe) { background-color: lime; color: red; }
</style>
<div class="ancestor">
    <div class="row origin" id="block">T XT</div>
    <div class="row origin" id="flex" style="display:flex">T XT</div>
    <div class="row origin" id="grid" style="display:grid">T XT</div>
    <div class="row origin" id="table" style="display:table">T XT</div>
    <div class="row"><math><mtext class="origin" id="math">T XT</mtext></math></div>
    <div class="row origin" style="display:flex"><span class="child" id="child">T XT</span></div>
    <div class="row" style="display:flex"><span class="origin" id="boxless-flex" style="display:contents">T XT</span></div>
    <div class="row"><math><mtext><span class="origin" id="boxless-math" style="display:contents">T XT</span></mtext></math></div>
</div>
<script>
const ranges = [...document.querySelectorAll('[id]')].map(element => {
    const range = new Range();
    range.selectNodeContents(element.firstChild);
    return range;
});
CSS.highlights.set('probe', new Highlight(...ranges));
</script>
