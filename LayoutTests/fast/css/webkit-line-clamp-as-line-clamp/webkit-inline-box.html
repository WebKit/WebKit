<!DOCTYPE html> <!-- webkit-test-runner [ CSSWebkitLineClampAsLineClampEnabled=true ] -->
<title>-webkit-line-clamp on a vertical -webkit-inline-box is laid out as line-clamp</title>
<link rel="match" href="webkit-inline-box-expected.html">
<style>
.clamp {
    display: -webkit-inline-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    white-space: pre;
    background-color: yellow;
}
</style>
<div class="clamp">Line 1
Line 2
Line 3
Line 4</div>
<p>This text follows the clamped box.</p>
