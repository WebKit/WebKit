<!DOCTYPE html>
<html>
<body>
<script src="../../resources/js-test.js"></script>
<script>

description("Tests that the 'size' shorthand is parsed but never generated during serialization, so copied and pasted markup stays compatible with engines and older WebKit that do not support it yet. See https://bugs.webkit.org/show_bug.cgi?id=289633");

var element = document.createElement('div');

debug('Longhands do not collapse into the size shorthand during serialization:');
element.style.cssText = 'width: 100px; height: 200px';
shouldBeEqualToString('element.style.cssText', 'width: 100px; height: 200px;');

debug('Equal width and height do not collapse either:');
element.style.cssText = 'width: 50px; height: 50px';
shouldBeEqualToString('element.style.cssText', 'width: 50px; height: 50px;');

debug('The size shorthand still expands to the width and height longhands:');
element.style.cssText = 'size: 100px 200px';
shouldBeEqualToString("element.style.getPropertyValue('width')", '100px');
shouldBeEqualToString("element.style.getPropertyValue('height')", '200px');

debug('Content authored with size serializes back as longhands, not as size:');
shouldBeEqualToString('element.style.cssText', 'width: 100px; height: 200px;');

debug('The size shorthand is still available when explicitly requested:');
shouldBeEqualToString("element.style.getPropertyValue('size')", '100px 200px');

</script>
</body>
</html>
