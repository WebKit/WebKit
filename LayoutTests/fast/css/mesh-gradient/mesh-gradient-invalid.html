<!DOCTYPE html><!-- webkit-test-runner [ CSSMeshGradientsEnabled=true ] -->
<html>
<head>
<meta charset="utf-8">
<title>CSS Images Module Level 5: parsing mesh-gradient() with invalid values</title>
<link rel="help" href="https://github.com/w3c/csswg-drafts/blob/main/css-images-5/explainers/2d-gradients.md#mesh-gradient">
<meta name="assert" content="mesh-gradient() rejects invalid values.">
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
<script src="../../../imported/w3c/web-platform-tests/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_invalid_value("background-image", "mesh-gradient()");
test_invalid_value("background-image", "mesh-gradient(red)");
test_invalid_value("background-image", "mesh-gradient(red, blue)");
test_invalid_value("background-image", "mesh-gradient(red; blue)");
test_invalid_value("background-image", "mesh-gradient(red, blue; green)");
test_invalid_value("background-image", "mesh-gradient(red, blue; green, yellow;)");
test_invalid_value("background-image", "mesh-gradient(red, blue,; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(in oklab; red, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(in oklab white black, red, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(white, red, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(red 0px 0px with 1px 1px / 2px 2px / 3px 3px / 4px 4px / 5px 5px, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(red 0px 0px with, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(red 0px 0px with 1px 1px from origin, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(red by 0px, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(red by 0px 0px with 1px 1px from start, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(red by left top, blue; green, yellow)");
test_invalid_value("background-image", "mesh-gradient(0px 0px red, blue; green, yellow)");
</script>
</body>
</html>
