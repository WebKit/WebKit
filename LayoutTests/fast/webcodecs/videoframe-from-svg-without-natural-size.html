<!DOCTYPE html>
<title>An SVG with no natural dimensions cannot be made into a VideoFrame, even when layout gave its element a box</title>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<!-- No natural dimensions.
     https://w3c.github.io/webcodecs/#dom-videoframe-videoframe-image-init -->
<img id="ratioOnly" style="width: 200px; height: 100px"
     src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="100%" height="100%" fill="green"/></svg>'>

<!-- 20x10. -->
<img id="sized" style="width: 200px; height: 100px"
     src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="10"><rect width="100%" height="100%" fill="green"/></svg>'>
<script>
function loaded(id)
{
    const image = document.getElementById(id);
    return image.complete ? Promise.resolve(image) : new Promise(resolve => image.onload = () => resolve(image));
}

promise_test(async () => {
    const image = await loaded("ratioOnly");
    assert_throws_dom("InvalidStateError", () => new VideoFrame(image, { timestamp: 0 }));
}, "An SVG with no natural dimensions throws");

promise_test(async () => {
    const frame = new VideoFrame(await loaded("sized"), { timestamp: 0 });
    assert_equals(frame.codedWidth, 20);
    assert_equals(frame.codedHeight, 10);
    frame.close();
}, "An SVG with a width and height of its own is usable");
</script>
