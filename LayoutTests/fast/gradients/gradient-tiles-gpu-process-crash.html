<!DOCTYPE html><!-- webkit-test-runner [ UseGPUProcessForDOMRenderingEnabled=true ] -->
<title>Tiled CSS gradients repaint after the GPU process crashes</title>
<style>
div {
    display: inline-block;
    width: 120px;
    height: 120px;
    margin: 10px;
    background-size: 20px 20px;
}
</style>
<div style="background-image: linear-gradient(to right, green, blue)"></div>
<div style="background-image: linear-gradient(45deg, green, blue)"></div>
<div style="background-image: radial-gradient(green, blue)"></div>
<div style="background-image: conic-gradient(green, blue, green)"></div>
<div style="background-image: repeating-linear-gradient(green 0 5px, blue 5px 10px)"></div>
<div style="background-image: image-set(linear-gradient(to bottom, green, blue) 1x)"></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

function nextFrame()
{
    return new Promise(resolve => requestAnimationFrame(() => resolve()));
}

window.addEventListener("load", async () => {
    // Let the first paint reach the GPU process, then crash it. The page repaints with the
    // same content once the connection to the new GPU process is made.
    await nextFrame();
    await nextFrame();
    if (window.testRunner)
        testRunner.terminateGPUProcess();
    await new Promise(resolve => setTimeout(resolve, 100));
    await nextFrame();
    await nextFrame();
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
