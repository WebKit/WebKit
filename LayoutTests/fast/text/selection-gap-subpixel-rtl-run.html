<!DOCTYPE html><!-- webkit-test-runner [ deviceScaleFactor=3 ] -->
<title>Line-end selection gaps meet both edges of RTL runs at subpixel positions</title>
<style>
#container { position: absolute; left: 20px; top: 20px; width: 150.3px; text-align: center; font: 5.3px/8px Ahem; }
::selection { background-color: rgba(0, 0, 255, 0.4); color: transparent; }
</style>
<!-- The runs are really RTL (bdo), so their visual left edge is their logical end. The selection starts at the beginning of the first line and ends at the beginning of the last one, so every line in between is fully selected and has to be filled exactly once. -->
<div id="container"><div style="text-align: left; color: transparent">X</div></div>
<script>
for (let i = 0; i < 20; ++i) {
    const row = document.createElement("div");
    row.style.paddingLeft = (i * 0.37) + "px";
    row.style.paddingRight = (i * 0.11) + "px";
    const bdo = document.createElement("bdo");
    bdo.dir = "rtl";
    bdo.textContent = "XX";
    row.append(bdo);
    container.append(row);
}
const end = document.createElement("div");
end.style.textAlign = "left";
end.style.color = "transparent";
end.textContent = "X";
container.append(end);
getSelection().setBaseAndExtent(container.firstChild.firstChild, 0, end.firstChild, 0);
</script>
