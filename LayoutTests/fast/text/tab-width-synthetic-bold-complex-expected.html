<!DOCTYPE html>
<html>
<head>
<style>
@font-face {
    font-family: DoesNotHaveBold;
    src: local("Times");
}
</style>
</head>
<body>
This test makes sure that, when the width of a tab is set to be a multiple of the space width, the tab measures exactly that multiple of the space advance, and that synthetic bold changes neither. The test passes if the width of the green box matches in both cases.
<div>
<pre style="font: bold 16px 'DoesNotHaveBold'; display: inline-block; background: green; tab-size: 16;">                </pre>
</div>
</body>
</html>
