<!DOCTYPE html>
<html>
<head>
<style>
    @font-face {
        font-family: "WebFont";
        src: url("resources/Ahem-SVG.ttf") format("truetype");
    }
    .WebFont {
        font-family: "WebFont" !important;
        font-size: 100px;
        margin-block-start: 0em;
        margin-block-end: 0em;
    }
</style>
</head>
<body>
    <h2>This tests that OpenType-SVG glyphs render in page text.</h2>
    <!-- "a" is an outline glyph (black square); "A" exists only as an SVG glyph (smaller green square). -->
    <p class="WebFont">aAaA</p>
</body>
</html>
