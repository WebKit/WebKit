<!DOCTYPE html>
<html>
<head>
<!-- Reference: the same full-square "A" glyph, but baked fill="green" in the
     font (Ahem-SVG.ttf). Identical layout to the test; the only difference is
     the test relies on currentColor resolving to color:green. -->
<style>
    @font-face {
        font-family: "WebFont";
        src: url("resources/Ahem-SVG.ttf") format("truetype");
    }
    .WebFont {
        font-family: "WebFont" !important;
        font-size: 100px;
        color: green;
        margin-block-start: 0em;
        margin-block-end: 0em;
    }
</style>
</head>
<body>
    <h2>This tests that currentColor propagates into OpenType-SVG glyphs.</h2>
    <p class="WebFont">A</p>
</body>
</html>
