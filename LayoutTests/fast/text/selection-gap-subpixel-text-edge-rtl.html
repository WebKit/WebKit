<!DOCTYPE html>
<html>
<head>
<title>RTL selection gaps meet the selected text without hairline overlaps at subpixel positions</title>
<style>
#container { position: absolute; left: 20px; top: 20px; width: 300px; direction: rtl; font: 5.3px/8px Ahem; color: white; }
.edge::selection { background-color: white; color: transparent; }
.mid::selection { background-color: rgba(0, 0, 255, 0.4); color: transparent; }
</style>
</head>
<body>
<!-- Each row's text starts at a different 1/64px offset from the right edge; the gap must meet the text's selection background exactly. -->
<div id="container"></div>
<script>
const container = document.getElementById("container");
function addRow(className, paddingRight) {
    const row = document.createElement("div");
    row.className = className;
    if (paddingRight)
        row.style.paddingRight = `calc(${paddingRight}px / 64)`;
    row.textContent = "XX";
    container.appendChild(row);
}
addRow("edge");
for (let i = 0; i < 64; ++i)
    addRow("mid", i);
addRow("edge");
getSelection().setBaseAndExtent(container.firstElementChild.firstChild, 0, container.lastElementChild.firstChild, 2);
</script>
</body>
</html>
