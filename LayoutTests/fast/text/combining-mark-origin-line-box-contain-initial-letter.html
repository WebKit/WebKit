<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="../../resources/js-test.js"></script>
<style>
    @font-face { font-family: mark-origin-y-test; src: url("../../imported/w3c/web-platform-tests/fonts/mark-origin-y-test.ttf"); }
    /* RenderTreeBuilderFirstLetter gives the initial letter's box this value. */
    div { font: 100px mark-origin-y-test; line-height: normal; -webkit-line-box-contain: initial-letter; width: 500px; }
</style>
</head>
<body>
<div id="base">A</div>
<div id="raised">A&#x301;</div>
<div id="lowered">A&#x316;</div>
<script>
description("With -webkit-line-box-contain: initial-letter the line box descent includes the vertical offset shaping gives a combining mark.");
jsTestIsAsync = true;

// imported/w3c/web-platform-tests/html/canvas/tools/generate-mark-origin-y-font.py: the font's cap height is 70px at 100px, which is the ascent
// initial-letter uses, and U+0316 is positioned to ink [-30,-10], so its descent is 30px.
function height(id)
{
    return document.getElementById(id).getBoundingClientRect().height;
}

document.fonts.load("100px mark-origin-y-test", "A\u0316").then(() => {
    shouldBe("height('base')", "70");
    shouldBe("height('raised')", "70");
    shouldBe("height('lowered')", "100");
    finishJSTest();
});
</script>
</body>
</html>
