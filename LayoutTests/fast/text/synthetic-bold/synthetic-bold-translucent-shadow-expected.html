<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: "RegularOnlyAhem";
    src: url("../../../resources/Ahem.ttf") format("truetype");
    font-weight: normal;
}
div {
    position: absolute;
    top: 20px;
    left: 20px;
    font: 72px/1 "RegularOnlyAhem";
    color: rgba(0, 0, 255, 0.5);
    text-shadow: 0 100px 0 rgba(0, 128, 0, 0.5);
}
</style>
</head>
<body>
<div>X&nbsp;XX</div>
<div id="offset">X&nbsp;XX</div>
<script>
// The synthetic bold offset is font-size / 36, i.e. 2px, divided by the device scale factor when it is
// larger than 1.
document.getElementById("offset").style.left = (20 + Math.min(2, 2 / window.devicePixelRatio)) + "px";
</script>
</body>
</html>
