<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: "WebFont";
    src: url("../resources/Ahem-COLR.ttf") format("truetype");
}
</style>
</head>
<body>
<div style="position: relative;">
<canvas id="canvas" width="700" height="500" style="width: 700px; height: 500px;"></canvas>
<div style="position: absolute; left: 98px; top: 18px; width: 304px; height: 4px; background: blue;"></div>
<div style="position: absolute; left: 98px; top: 118px; width: 304px; height: 4px; background: blue;"></div>
<div style="position: absolute; left: 98px; top: 18px; width: 4px; height: 104px; background: blue;"></div>
<div style="position: absolute; left: 198px; top: 18px; width: 4px; height: 104px; background: blue;"></div>
<div style="position: absolute; left: 218px; top: 18px; width: 4px; height: 104px; background: blue;"></div>
<div style="position: absolute; left: 238px; top: 18px; width: 4px; height: 104px; background: blue;"></div>
<div style="position: absolute; left: 298px; top: 18px; width: 4px; height: 104px; background: blue;"></div>
<div style="position: absolute; left: 398px; top: 18px; width: 4px; height: 104px; background: blue;"></div>
</div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

let font = "100px 'WebFont'";
document.fonts.load(font).then(function() {
    let canvas = document.getElementById("canvas");
    let context = canvas.getContext("2d");
    // Draw opaque text into a scratch canvas and composite it with the global alpha.
    let scratch = document.createElement("canvas");
    scratch.width = canvas.width;
    scratch.height = canvas.height;
    let scratchContext = scratch.getContext("2d");
    scratchContext.font = font;
    scratchContext.fillStyle = "green";
    scratchContext.shadowColor = "red";
    scratchContext.shadowOffsetX = 0;
    scratchContext.shadowOffsetY = 150;
    scratchContext.fillText("A", 200, 100);
    context.globalAlpha = 0.5;
    context.drawImage(scratch, 0, 0);
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
</html>
