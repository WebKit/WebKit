<!DOCTYPE html>
<html>
<head>
<style>
html {
    font-size: 15px;
    line-height: 30px;
}
.number {
    line-height: 1.5;
}
.length {
    line-height: 22.5px;
}
.percent {
    line-height: 150%;
}
.calc {
    line-height: calc(7.5px + 100%);
}
div[class] > div {
    font-size: 1lh;
    line-height: 2lh;
    letter-spacing: 0.1lh;
    word-spacing: calc(0.2lh + 1.5px);
    text-decoration: 0.1lh aqua underline;
    text-underline-offset: calc(0.05lh + 1.5px);
    border: solid 1px gray;
    margin: 0.5lh calc(10px + 0.5lh) 1rlh calc(10px + 5%);
    width: fit-content;
}
div.rlh > div {
    font-size: 1rlh;
    line-height: 1.5rlh;
    letter-spacing: 0.1rlh;
    word-spacing: calc(0.2rlh + 1.5px);
    text-decoration: 0.1rlh aqua underline;
    text-underline-offset: calc(0.05rlh + 1.5px);
}
</style>
</head>
<body>
<div class="number"><div>Text with lh against a 1.5 line-height</div></div>
<div class="length"><div>Text with lh against a 15px line-height</div></div>
<div class="percent"><div>Text with lh against a 150% line-height</div></div>
<div class="calc"><div>Text with lh against a calc(5px + 100%) line-height</div></div>
<div class="rlh"><div>Text with rlh against a 20px root line-height</div></div>
</body>
</html>
