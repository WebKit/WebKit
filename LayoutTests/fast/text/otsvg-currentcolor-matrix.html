<!DOCTYPE html>
<html>
<head>
<!-- currentColor into an OT-SVG glyph across fill and fill-opacity. The "A" of
     OTSVGMatrix-currentColor.ttf is a 3x3 grid derived from color:green; the
     reference bakes the same grid. Before bug 320029 these rendered black on
     CoreText: the OT-SVG run's ImageBuffer was never seeded with the fill brush.
     currentColor in gradient stops lives in otsvg-currentcolor-gradient-stops.html. -->
<meta name="fuzzy" content="maxDifference=0-64; totalPixels=0-40000" />
<style>
    @font-face {
        font-family: "WebFont";
        src: url("resources/OTSVGMatrix-currentColor.ttf") format("truetype");
    }
    .WebFont {
        font-family: "WebFont" !important;
        font-size: 300px;
        color: green;
        margin-block-start: 0em;
        margin-block-end: 0em;
    }
</style>
</head>
<body>
    <h2>This tests that currentColor propagates into OpenType-SVG glyphs through every spec-compliant path.</h2>
    <p class="WebFont">A</p>
</body>
</html>
