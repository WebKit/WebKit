<!DOCTYPE html>
<html>
<head>
<!-- Reference: the same 3x3 matrix "A" glyph, but with every colour reference
     baked in the font (OTSVGMatrix-baked.ttf) for color:green — currentColor ->
     #008000, --color1 -> #ff7fff. Identical layout/gradients to the test; the
     only difference is the test relies on currentColor / var() resolving. -->
<style>
    @font-face {
        font-family: "WebFont";
        src: url("resources/OTSVGMatrix-baked.ttf") format("truetype");
    }
    .WebFont {
        font-family: "WebFont" !important;
        font-size: 300px;
        color: green;
        margin-block-start: 0em;
        margin-block-end: 0em;
    }
</style>
</head>
<body>
    <h2>This tests that currentColor propagates into OpenType-SVG glyphs through every spec-compliant path.</h2>
    <p class="WebFont">A</p>
</body>
</html>
