<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
.roots { display: flex; flex-wrap: wrap; gap: 10px; align-items: start; }
.root { display: flow-root; width: 200px; background: lightgray; font: 10px/12px monospace; }
.l { float: left; width: 40px; height: 30px; background: rgba(0, 128, 0, 0.6); }
.s { float: left; width: 60px; height: 20px; background: rgba(0, 128, 128, 0.6); }
.c { background: rgba(255, 255, 0, 0.4); }
p { margin: 0; }
</style>
<div class="roots">
<div class="root"><div class="l" id="taller"></div><div style="clear: left"><div class="s"></div><div class="c" style="clear: left">a float above that gets taller</div></div></div>
<div class="root"><div class="l"></div><div style="clear: left"><div class="s" id="inner-taller"></div><div class="c" style="clear: left">an inner float that gets taller</div></div></div>
<div class="root"><div class="l"></div><div style="clear: left"><div class="s"></div><div class="c" id="clear-added">inner clear added</div></div></div>
<div class="root"><div class="l"></div><div id="outer-clear-added"><div class="s"></div><div class="c" style="clear: left">outer clear added</div></div></div>
<div class="root"><div class="l"></div><div style="clear: left"><div class="s"></div><div class="c" id="margin" style="clear: left; margin-top: 5px">an inner margin that grows</div></div></div>
</div>
<script>
document.body.offsetHeight;
document.getElementById("taller").style.height = "50px";
document.getElementById("inner-taller").style.height = "40px";
document.getElementById("clear-added").style.clear = "left";
document.getElementById("outer-clear-added").style.clear = "left";
document.getElementById("margin").style.marginTop = "70px";
</script>
