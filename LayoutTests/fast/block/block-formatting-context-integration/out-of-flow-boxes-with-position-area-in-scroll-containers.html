<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 10px monospace; }
.cb { position: relative; width: 200px; height: 100px; border: 1px solid; margin: 4px; }
.anchor { position: absolute; left: 70px; top: 35px; width: 60px; height: 30px; background: orange; }
.a { position: absolute; background: lightblue; }
</style>
<div class="cb" style="overflow: hidden"><div style="width: 400px; height: 300px"></div><div class="anchor" style="anchor-name: --a"></div><div class="a" style="position-anchor: --a; position-area: bottom right; width: 50%">scrollable</div></div>
<div class="cb" style="overflow: scroll" dir="rtl"><div style="height: 200px"></div><div class="anchor" style="anchor-name: --a"></div><div class="a" style="position-anchor: --a; position-area: center; width: 100%; height: 100%; background: green">left scrollbar</div></div>
<div class="cb" style="overflow: scroll; writing-mode: vertical-rl"><div style="height: 200px; width: 20px"></div><div class="anchor" style="anchor-name: --a"></div><div class="a" style="position-anchor: --a; position-area: center; width: 100%; height: 100%; background: green">vertical-rl</div></div>
