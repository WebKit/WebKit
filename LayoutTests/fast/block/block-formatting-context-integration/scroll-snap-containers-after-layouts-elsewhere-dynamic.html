<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { margin: 0; }
.scroller { width: 100px; height: 50px; overflow: hidden; scroll-snap-type: x proximity; white-space: nowrap; font-size: 0; }
.scroller > div { display: inline-block; width: 100px; height: 50px; scroll-snap-align: start; }
</style>
<div class=scroller><div style="background-color: green"></div><div style="background-color: blue"></div><div style="background-color: green"></div></div>
<div class=scroller style="position: absolute; top: 0; left: 120px"><div style="background-color: green"></div><div style="background-color: blue"></div><div style="background-color: green"></div></div>
<div id=target></div>
<script>
document.body.offsetHeight;
for (const scroller of document.querySelectorAll('.scroller'))
    scroller.scrollLeft = 100;
document.body.offsetHeight;
for (const scroller of document.querySelectorAll('.scroller'))
    scroller.scrollBy(10, 0);
document.body.offsetHeight;
document.getElementById('target').textContent = 'text';
document.body.offsetHeight;
</script>
