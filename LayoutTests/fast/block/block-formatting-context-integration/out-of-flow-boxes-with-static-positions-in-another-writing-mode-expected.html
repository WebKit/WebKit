<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>
body { margin: 0; font: 10px/12px serif; }
.cb { position: relative; display: inline-block; vertical-align: top; width: 56px; height: 46px; border: solid; border-width: 1px 2px 3px 4px; padding: 2px 3px 4px 5px; margin: 0 2px 2px 0; }
.parent { width: 28px; height: 24px; margin: 3px 5px 7px 9px; border: solid orange; border-width: 2px 1px 4px 3px; padding: 1px 2px 3px 4px; }
.abspos { position: absolute; width: 10px; height: 6px; margin: 1px 3px; background: green; }
.htb { writing-mode: horizontal-tb; }
.vrl { writing-mode: vertical-rl; }
.vlr { writing-mode: vertical-lr; }
.rtl { direction: rtl; }
</style>
<!-- An out-of-flow box whose static position is in a box with another writing mode than its containing block's: it aligns to the start in
the writing mode of the box it would be in with position: static. -->
<div id="combinations"></div>
<div>
<div class="cb htb"><div class="parent vrl"><div class="parent vlr" style="width: 14px; height: 12px; margin: 1px">a<div class="abspos"></div></div></div></div>
<div class="cb vrl"><div class="parent htb rtl" style="position: relative; left: 3px; top: 2px">a<div class="abspos"></div></div></div>
<div class="cb vlr"><div class="parent vrl">ab <span>cd<span class="abspos"></span></span></div></div>
<div class="cb htb"><div class="parent vrl" style="display: flex; justify-content: center; align-items: end"><div class="abspos"></div></div></div>
<div class="cb vlr"><div class="parent htb" style="display: flex; flex-direction: column; justify-content: end; align-items: center"><div class="abspos"></div></div></div>
<div class="cb htb"><div class="parent vrl" style="display: grid"><div class="abspos"></div></div></div>
<div class="cb htb rtl"><div class="parent vrl"><div class="abspos" style="width: auto; height: auto">text that wraps</div></div></div>
<div class="cb htb"><table class="vrl" style="border: 2px solid orange"><tr><td style="padding: 3px">a<div class="abspos"></div></td></tr></table></div>
<div class="cb vrl"><div class="parent htb"><div class="abspos vlr"></div></div></div>
</div>
<script>
for (const containingBlockMode of ["htb", "vrl", "vlr"]) {
    for (const containingBlockDirection of ["", "rtl"]) {
        for (const parentMode of ["htb", "vrl", "vlr"]) {
            for (const parentDirection of ["", "rtl"]) {
                const containingBlock = document.createElement("div");
                containingBlock.className = `cb ${containingBlockMode} ${containingBlockDirection}`;
                containingBlock.innerHTML = `<div class="parent ${parentMode} ${parentDirection}">x<div class="abspos"></div></div>`;
                combinations.appendChild(containingBlock);
            }
        }
    }
}
</script>
