<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 10px monospace; }
.stf { display: inline-block; vertical-align: top; border: 1px solid; margin: 2px; height: 80px; }
canvas { background: green; }
</style>
<div class="stf" id="height"><canvas style="display: block; height: 50%"></canvas></div>
<div class="stf"><canvas id="percent" style="display: block; height: 50%"></canvas></div>
<div class="stf"><div id="ratio" style="display: flex; height: 50%; aspect-ratio: 2 / 1; background: lightblue"></div></div>
<script>
document.body.offsetHeight;
document.getElementById("height").style.height = "120px";
document.getElementById("percent").style.height = "25%";
document.getElementById("ratio").style.aspectRatio = "1 / 1";
</script>
