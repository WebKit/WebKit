<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 10px/12px monospace; }
.clamp { line-clamp: 5; width: 180px; border: 1px solid; margin: 2px; float: left; }
p { margin: 3px 0; background: lightblue; }
.nested { max-lines: 1; background: lightgreen; }
</style>
<div class="clamp"><p>one</p><div class="nested" id=first>short</div><p>two lines of text after the nested one</p><p>hidden</p></div>
<div class="clamp"><p>one</p><div class="nested" id=second>nested text that wraps onto a few lines here</div><p>after</p><p>and more</p><p>hidden</p></div>
<div class="clamp"><p>one</p><div id=third>no budget yet, with two lines</div><p>after</p><p>hidden</p></div>
<script>
document.body.offsetHeight;
document.getElementById("first").firstChild.data = "nested with two lines of text in it";
document.getElementById("second").firstChild.data = "short";
document.getElementById("third").style.maxLines = "1";
document.body.offsetHeight;
</script>
