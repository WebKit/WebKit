<style>
.root { display: flow-root; margin-bottom: 5px; }
.box { background: green; }

<div class="root"><div class="box" style="width: max-content"><table><tr><td><div class="scroller"><div class="content" id="grows"></div></div></td></tr></table></div></div>

<script>
document.body.offsetHeight;
document.getElementById("grows").style.height = "40px";
document.getElementById("shrinks").style.height = "20px";
</script>
