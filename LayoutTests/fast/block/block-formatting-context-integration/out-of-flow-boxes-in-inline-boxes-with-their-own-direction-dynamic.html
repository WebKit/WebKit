<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 12px/16px sans-serif; margin: 4px; }
.root { width: 300px; border: 1px solid; margin-bottom: 4px; }
.rel { position: relative; background: lightyellow; border: 2px solid orange; padding: 0 4px; }
.a { position: absolute; background: lightblue; width: 20px; height: 8px; }
</style>
<div class=root>text <span class=rel dir=rtl id=grows>right to left<span class=a style="left: 0; right: 0;"></span></span> text</div>
<div class=root>text <span class=rel dir=rtl><span id=static>static</span><span class=a></span> after</span> text</div>
<div class=root>text <span class=rel id=direction>direction changes<span class=a style="left: 0; right: 0;"></span></span> text</div>
<script>
document.body.offsetHeight;
document.getElementById("grows").firstChild.data = "right to left, longer";
document.getElementById("static").firstChild.data = "static position moves";
document.getElementById("direction").dir = "rtl";
document.body.offsetHeight;
</script>
