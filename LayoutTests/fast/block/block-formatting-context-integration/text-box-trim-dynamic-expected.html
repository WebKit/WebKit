<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>
body { font: 20px/40px monospace; }
.root { display: inline-block; vertical-align: top; width: 140px; margin: 2px; background: lightgray; }
p { margin: 0; background: lightblue; }
</style>
<div class="root" id="trim"><p>first</p><p>last</p></div>
<div class="root" style="text-box-trim: trim-both"><p>first</p><p id="text">last</p></div>
<div class="root" style="text-box-trim: trim-end"><p>first</p><p id="appended">last</p></div>
<div class="root" style="text-box-trim: trim-start"><p id="padding">first</p><p>second</p></div>
<script>
document.body.offsetHeight;
document.getElementById("trim").style.textBoxTrim = "trim-both";
document.getElementById("text").firstChild.data = "longer last line text";
document.getElementById("appended").after(document.createElement("p"));
document.getElementById("padding").style.paddingTop = "6px";
</script>
