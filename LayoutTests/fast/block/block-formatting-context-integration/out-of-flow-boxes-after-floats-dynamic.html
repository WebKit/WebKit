<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
.roots { display: flex; flex-wrap: wrap; gap: 10px; align-items: start; }
.root { display: flow-root; position: relative; width: 200px; background: lightgray; font: 10px/12px monospace; }
.l { float: left; width: 40px; height: 30px; background: rgba(0, 128, 0, 0.6); }
.a { position: absolute; background: rgba(255, 128, 0, 0.8); }
p { margin: 0; }
</style>
<div class="roots">
<div class="root"><p>x</p><div class="l" id="wider"></div><span class="a">A</span><p>a float that gets wider</p></div>
<div class="root"><p>x</p><div class="l" id="removed"></div><span class="a">A</span><p>a float removed</p></div>
<div class="root"><p id="inserted-before">a float added</p><span class="a">A</span><p>y</p></div>
<div class="root"><p>x</p><div class="l"></div><span class="a" id="positioned">A</span><p>a box that becomes absolutely positioned</p></div>
<div class="root"><p>x</p><div class="l" id="taller" style="height: 5px"></div><p>a float that gets taller</p><span class="a">A</span></div>
</div>
<script>
document.body.offsetHeight;
document.getElementById("wider").style.width = "100px";
document.getElementById("removed").remove();
const added = document.createElement("div");
added.className = "l";
document.getElementById("inserted-before").after(added);
document.getElementById("positioned").style.position = "static";
document.body.offsetHeight;
document.getElementById("positioned").style.position = "absolute";
document.getElementById("taller").style.height = "40px";
</script>
