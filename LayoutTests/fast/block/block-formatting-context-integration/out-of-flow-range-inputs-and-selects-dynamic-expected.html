<style>body { font-family: monospace; font-size: 12px; } .root { position: relative; width: 300px; height: 60px; margin: 4px; border: 1px solid; } .a { position: absolute; }</style>
<div class="root" id="resized"><input type="range" class="a" style="top: 5px; left: 5px"></div>

<div class="root"><input type="range" class="a" id="insets" style="top: 5px; left: 5px"></div>
<div class="root"><select class="a" id="option" style="top: 2px; left: 10px"><option>option</option></select></div>
<div class="root"><select class="a" id="moved" style="top: 2px; left: 10px"><option>moved</option></select></div>
<script>
document.body.offsetHeight;
document.getElementById("resized").style.width = "200px";
document.getElementById("value").value = "90";

document.getElementById("moved").style.left = "auto";
document.getElementById("moved").style.right = "0";
</script>
