<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>

.a { position: absolute; background-color: rgba(0, 128, 0, 0.4); }
.c { width: 40px; height: 20px; background-color: rgba(0, 0, 255, 0.4); }
.initial .cb { height: 80px; }
.initial .c { width: 20px; }
</style>
<div class=initial id=cases>

<div class=cb><span id=t2>x</span><div class=a style="position-area: bottom right; inset: 0"><div class=c></div></div></div>
<div class=cb><span id=t3>x</span><div class=a style="position-area: top left; left: 10px; top: 10px"><div class=c></div></div></div>
<div class=cb><span id=t4>x</span><div class=a style="position-area: center; inset: 0"><div class=c></div></div></div>
<div class=cb><span id=t5>x</span><div class=a style="position-area: span-all; inset: 0; width: 50px"><div class=c></div></div></div>

<div class=cb><span id=t7>x</span><div class=a style="position-area: end; inset: 0; justify-self: start"><div class=c></div></div></div>

document.body.offsetHeight;
for (const text of document.querySelectorAll("span"))
    text.firstChild.data = "text";
document.getElementById("cases").className = "";
