<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { margin: 0; font-family: -apple-system; font-size: 10px; line-height: 12px; }
.mc { columns: 3; column-rule: 2px solid; width: 240px; border: 1px solid; margin-bottom: 6px; }
.s { column-span: all; background-color: lightblue; }
.r { position: relative; left: 20px; }
</style>
<div class=mc><span>a</span><div id=removed>b</div><span>c<div class=s>spanner</div>d</span><div class=s>spanner</div>e</div>
<div class=mc><span>a</span><div class=s id=removedSpanner>spanner</div><span>b<div class=s>spanner</div>c</span></div>
<div class=mc><span>a<div class=s id=spanner>spanner</div><div>block</div>b<div>block</div></span></div>
<div class=mc><span id=appended>a<div class=s>spanner</div>b</span></div>
<div class=mc><span class=r id=moved>a<div class=s>spanner</div>b</span></div>
<script>
document.body.offsetHeight;
document.getElementById("removed").style.display = "none";
document.getElementById("removedSpanner").style.display = "none";
document.getElementById("spanner").remove();
const block = document.createElement("div");
block.textContent = "appended";
document.getElementById("appended").appendChild(block);
document.getElementById("moved").style.left = "40px";
</script>
