<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 12px/16px sans-serif; margin: 4px; }
.root { width: 300px; height: 150px; border: 1px solid; margin-bottom: 4px; display: flow-root; padding: 3px; }
.leaf { background: lightblue; border: 2px solid blue; padding: 2px; margin: 4px 0; }
</style>
<div class=root style="height: auto; width: 200px; aspect-ratio: 2;" id=ratio><div style="display: flex; height: -webkit-fill-available;" class=leaf><div>from the aspect ratio</div></div></div>
<div class=root id=height><div style="display: flex; height: -webkit-fill-available;" class=leaf><div>height changes</div></div></div>
<script>
document.body.offsetHeight;
document.getElementById("ratio").style.width = "300px";
document.getElementById("height").style.height = "90px";
document.body.offsetHeight;
</script>
