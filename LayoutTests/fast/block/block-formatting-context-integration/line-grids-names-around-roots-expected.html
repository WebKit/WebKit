<script>
// The render tree lays out a block before it places it in the inline direction (RenderBlockFlow::layoutBlockChild), so its lines align to
// the grid from where it was before: they are laid out again once the block is where it goes.
document.body.offsetHeight;
for (const element of document.querySelectorAll(".back-on-a[style]")) {
    element.style.wordSpacing = "1px";
    document.body.offsetHeight;
    element.style.wordSpacing = "";
    document.body.offsetHeight;
}
</script>
