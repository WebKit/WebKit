<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 10px monospace; padding-top: 50px; }
.cb { position: relative; width: 170px; height: 40px; border: 1px solid; margin: 4px; display: inline-block; vertical-align: top; }
.p { width: 70px; margin-left: 40px; height: 30px; border-left: 5px solid silver; border-right: 7px solid silver; padding: 0 3px 0 9px; }
.s { position: absolute; background: lightblue; width: 40px; height: 20px; }
.fit { width: auto; white-space: nowrap; }
</style>
<div class="cb"><div class="p" id="width"><div style="height: 10px"></div><div class="s" style="justify-self: end">wi</div></div></div>
<div class="cb"><div class="p" id="margin"><div class="s" style="justify-self: center">ma</div></div></div>
<div class="cb"><div class="p" id="padding"><div class="s" style="justify-self: end">pa</div></div></div>
<div class="cb"><div class="p" id="direction"><div class="s" style="justify-self: start">di</div></div></div>
<div class="cb"><div class="p" id="items"><div class="s">it</div></div></div>
<div class="cb"><div class="p"><div class="s" id="justify" style="justify-self: start">ju</div></div></div>
<div class="cb" id="containingBlock"><div class="p"><div class="s" style="justify-self: center">cb</div></div></div>
<div class="cb"><div class="p"><div class="s fit" id="text" style="justify-self: center">text</div></div></div>
<script>
document.body.offsetHeight;
document.getElementById("width").style.width = "110px";
document.getElementById("margin").style.marginLeft = "20px";
document.getElementById("padding").style.paddingRight = "30px";
document.getElementById("direction").style.direction = "rtl";
document.getElementById("items").style.justifyItems = "end";
document.getElementById("justify").style.justifySelf = "center";
document.getElementById("containingBlock").style.width = "150px";
document.getElementById("text").firstChild.data = "a longer text";
</script>
