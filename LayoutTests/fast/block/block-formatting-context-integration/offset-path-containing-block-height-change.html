<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
.root { display: flow-root; width: 400px; background: lightgray; }
.container { height: 100px; background: rgba(0, 0, 255, 0.2); margin: 10px; }
.moved { offset-path: ray(135deg closest-side); width: 20px; height: 20px; background: green; }
</style>
<div class="root">
  <div class="container" id="container"><div class="moved"></div></div>
  <div class="container" id="other"><div class="moved" style="offset-path: ray(45deg farthest-side)"></div></div>
</div>
<script>
document.body.offsetHeight;
document.getElementById("container").style.height = "200px";
document.getElementById("other").style.height = "50px";
document.body.offsetHeight;
</script>
