<div class="leaf flex" style="height: 30px"><div class="inner" style="height: 50%"></div></div>
<div class="leaf grid"><div><div class="inner" style="height: 50%">x</div></div></div>
<div class="leaf flex" style="width: 40px"><div style="height: 50%; background: orange">y</div><div style="height: 20px; width: 10px"></div></div>

</html>
