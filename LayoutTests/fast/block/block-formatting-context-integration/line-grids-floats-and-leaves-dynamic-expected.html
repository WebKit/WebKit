<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>
body { font: 9px/11px sans-serif; margin: 4px; }
.grid { -webkit-line-grid: grid; -webkit-line-snap: baseline; font-size: 14px; line-height: 19px; width: 250px; padding: 3px; margin-bottom: 4px; }
.small { font-size: 9px; line-height: 11px; }
.moves { -webkit-line-snap: none; font-size: 9px; line-height: 11px; }
</style>
<div class=grid>
  <div class=moves id=first>text that grows by lines that are not on the grid, a few of them</div>
  <div class=small style="float: left; width: 80px; margin-top: 4px;">a float with<br>two lines</div>
  <div class=small style="margin-top: 2px;">a block beside the float</div>
  <div class=small style="float: right; width: 70px; margin-top: 3px;">a right float<br>two</div>
  <div class=small style="clear: both; margin-top: 3px;">after</div>
</div>
<div class=grid>
  <div class=moves id=second>more text that grows by lines that are not on the grid</div>
  <div class=small>first line <span style="float: left; margin-top: 3px; width: 70px;">a float in<br>inline content</span> text that wraps beside the float for a few lines</div>
</div>
<script>
// The render tree lays out a float in inline content before the inline formatting context places it, so it snaps its content to the line grid
// from where it was before: it is laid out again once it is where it goes.
document.body.offsetHeight;
for (const element of document.querySelectorAll("span")) {
    element.style.wordSpacing = "1px";
    document.body.offsetHeight;
    element.style.wordSpacing = "";
    document.body.offsetHeight;
}
</script>
