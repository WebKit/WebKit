<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 10px/12px monospace; margin: 4px; }
iframe { width: 180px; height: 120px; border: 1px solid; margin: 2px; vertical-align: top; }
</style>
<iframe id=resized srcdoc="<html style='height: 50%; padding: 4px; background: lightgray'><body style='margin: 4px; height: 50%; background: lightblue; font: 10px/12px monospace'><div style='height: 50%; background: green'>half</div>"></iframe>
<iframe id=changed srcdoc="<html id=html style='width: 80%; margin: 4px; border: 2px solid; background: lightgray'><body style='margin: 4px; font: 10px/12px monospace'><div id=text style='background: lightblue'>short</div><div style='position: absolute; background: orange'>abs</div>"></iframe>
<iframe id=quirks src="data:text/html,<html id=html style='margin: 5px; border: 2px solid; background: lightgray'><body style='margin: 6px; background: lightblue; font: 10px/12px monospace'><div id=text>quirks</div>"></iframe>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
window.addEventListener("load", () => {
    const resized = document.getElementById("resized");
    const changed = document.getElementById("changed").contentDocument;
    const quirks = document.getElementById("quirks").contentDocument;
    for (const doc of [resized.contentDocument, changed, quirks])
        doc.body.offsetHeight;

    resized.style.height = "160px";
    changed.getElementById("html").style.width = "60%";
    changed.getElementById("html").style.marginTop = "15px";
    changed.getElementById("text").firstChild.data = "much longer text that wraps";
    quirks.getElementById("html").style.marginTop = "20px";
    quirks.getElementById("text").firstChild.data = "changed quirks text";
    document.body.offsetHeight;
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
