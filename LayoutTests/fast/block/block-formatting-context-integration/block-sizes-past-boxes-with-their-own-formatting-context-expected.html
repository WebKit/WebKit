<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>
iframe { width: 150px; height: 100px; border: 1px solid; margin: 0 2px 2px 0; }
</style>
<body>
<!-- Percentage and available block sizes inside a box with a formatting context of its own look past the box, in quirks mode past the auto block sizes. -->
<script>
const colors = "html { background: lightblue; } body { font: 16px/20px serif; } .f { float: left; background: yellow; } #t { background: green; }";
const documents = [
    "body { margin: 5px 0 7px; padding: 3px; border: 1px solid; }|<div class='f'><div id='t' style='width: 20px; height: 50%'></div></div>",
    "|<div style='height: 80px'><div><div class='f'><div id='t' style='width: 20px; height: 50%'></div></div></div></div>",
    "body { margin: 4px 0 10px; }|<span style='display: inline-block'><div id='t' style='width: 20px; height: 40%'></div></span>",
    "body { margin: 4px 0 10px; }|<span style='display: inline-block'><span><canvas id='t' width='10' height='10' style='height: 30%'></canvas></span></span>",
    "|<table><tr><td><div class='f'><div id='t' style='width: 20px; height: 50%'>x</div></div></td></tr></table>",
    "body { margin: 3px; }|<div class='f' style='min-height: 10%'><div id='t' style='width: 20px; height: 40%'></div></div>",
    "body { margin: 6px; }|<div class='f'><div class='f'><div id='t' style='width: 20px; height: 30%'></div></div></div>",
    "|<div style='height: 60%'><div><div class='f'><div id='t' style='width: 20px; height: 50%'></div></div></div></div>",
    "body { margin: 9px 0 1px; }|<div class='f'><div id='t' style='height: 25%; aspect-ratio: 2'></div></div>",
    "body { margin: 2px; }|<div class='f' style='display: grid'><canvas id='t' width='10' height='10' style='height: 30%'></canvas></div>",
    "|<div style='writing-mode: vertical-rl'><div style='border: 1px solid'><div><table id='t' width='100%' cellpadding='0' cellspacing='0' bgcolor='green'><tr><td>x</td></tr></table></div></div></div>",
    "html { padding: 4px 0 6px; } body { margin: 2px; }|<div class='f'><div id='t' style='width: 20px; height: 50%'></div></div>",
    "|<table style='height: 80px'><tr><td><span style='display: inline-block'><div id='t' style='width: 20px; height: 50%'>x</div></span></td></tr></table>",
    "body { margin: 20px 0 30px; }|<div class='f'><div id='t' style='width: 20px; height: -webkit-fill-available'></div></div>|standards",
    "body { margin: 5px 0 7px; padding: 3px; border: 1px solid; }|<div class='f'><div id='t' style='width: 20px; height: 50%'></div></div><div>block</div>",
    "|<table style='height: 80px'><tr><td><div class='f'><div id='t' style='width: 20px; height: 50%'>x</div></div><div>block</div></td></tr></table>",
    "body { margin: 10px 0 20px; }|<div style='height: 50%'><span style='display: inline-block'><canvas id='t' width='10' height='10' style='height: 50%'></canvas></span></div>",
    "body { margin: 6px 0 14px; padding: 2px 0 3px; }|<div class='f'><li>x</li><div id='t' style='width: 20px; height: 50%'></div></div>",
    "body { margin: 6px 0 14px; }|<fieldset style='border: 0; margin: 0; padding: 0'><div id='t' style='width: 20px; height: 50%'></div></fieldset>",
];
const iframes = documents.map(() => {
    const iframe = document.createElement("iframe");
    iframe.scrolling = "no";
    return document.body.appendChild(iframe);
});
// The frames have their size before their documents are first laid out.
document.body.offsetHeight;
// The sizes from the first layout, which a later one of the frames may not show.
const sizes = document.body.appendChild(document.createElement("div"));
documents.forEach((description, index) => {
    const [style, content, mode] = description.split("|");
    const frameDocument = iframes[index].contentDocument;
    frameDocument.open();
    frameDocument.write(`${mode == "standards" ? "<!DOCTYPE html>" : ""}<style>${colors} ${style}</style>${content}`);
    frameDocument.close();
    const target = frameDocument.getElementById("t");
    sizes.append(`${target.offsetWidth}x${target.offsetHeight} `);
});
</script>
