<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
.grid { display: grid; width: 400px; background: lightgray; margin-bottom: 10px; }
.grid > div { background: rgba(0, 0, 255, 0.2); }
.grid > div > div { background: rgba(0, 128, 0, 0.3); }
</style>
<div class="grid" id="resized" style="grid-template-columns: 100px 1fr; gap: 5px">
  <div style="padding: 5px"><div style="margin: 10px 0">margins stay inside</div><div style="padding: 0 10%">percentage padding</div></div>
  <div><div>stretched</div><div style="height: 40px"></div></div>
  <div style="grid-column: span 2; align-self: start"><div style="margin-bottom: 15px">spanning, not stretched</div></div>
</div>
<div class="grid" style="grid-template-rows: 50px auto; grid-template-columns: repeat(3, 1fr)">
  <div><div style="height: 80px">taller than the row</div></div>
  <div><div style="display: flow-root"><div style="margin: 5px">flow-root</div></div></div>
  <div style="margin: 10px"><div style="max-height: 20px; height: 100px"></div></div>
  <div style="grid-column: 1 / -1"><div style="margin: 10px 20px">auto row</div></div>
</div>
<script>
document.body.offsetHeight;
document.getElementById("resized").style.width = "300px";
document.body.offsetHeight;
</script>
