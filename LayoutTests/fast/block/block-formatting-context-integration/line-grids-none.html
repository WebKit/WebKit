<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { font: 9px/11px sans-serif; margin: 4px; }
.grid { -webkit-line-grid: grid; -webkit-line-snap: baseline; font-size: 14px; line-height: 19px; width: 250px; padding: 3px; margin-bottom: 4px; position: relative; }
.small { font-size: 9px; line-height: 11px; }
.none { -webkit-line-grid: none; }
</style>
<div class=grid>
  <div class="small none" style="padding-top: 3px;">still in the line grid<br>two
    <div class=inline-float style="float: left; width: 80px;">a float<br>two</div>
    <div style="display: flex; margin-top: 2px;"><div id=flex-item>flex<br>item</div></div>
    <div style="position: absolute; left: 150px; top: 5px;" id=positioned>positioned<br>two</div>
    <div style="display: flow-root; margin-top: 3px;" id=flow-root>flow root<br>two</div>
  </div>
</div>
<div class=grid>
  <div class="small none" style="display: flow-root; margin-top: 3px; padding-top: 2px;">a root with none<br>two
    <div class=inline-float style="float: right; width: 80px;">a float<br>two</div>
    <div style="position: absolute; left: 150px; top: 40px;">positioned<br>two</div>
  </div>
</div>
<div class=grid style="-webkit-line-grid: a;">
  <div class="small none">
    <div style="-webkit-line-grid: b; line-height: 13px; margin-top: 3px;">a grid of its own under none</div>
    <div style="-webkit-line-grid: a; margin-top: 3px;">back on the line grid around<br>two</div>
  </div>
</div>
