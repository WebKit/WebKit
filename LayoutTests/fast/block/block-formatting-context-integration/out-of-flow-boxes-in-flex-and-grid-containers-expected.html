<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>
.roots { display: flex; flex-wrap: wrap; gap: 10px; align-items: start; }
.root { display: flow-root; position: relative; width: 200px; height: 70px; background: lightgray; font-family: monospace; font-size: 10px; line-height: 12px; }
.f { display: flex; justify-content: center; align-items: center; height: 40px; padding: 5px; background: silver; }
.g { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; background: silver; }
.a { position: absolute; background: rgba(0, 128, 0, 0.6); }
</style>
<div class="roots">
<div class="root"><div class="f"><span>item</span><div class="a" style="top: 5px; left: 10px">inset</div></div></div>
<div class="root"><div class="f"><div class="a" style="inset: 10px 20px">all insets</div></div></div>
<div class="root"><div class="f"><div class="a" style="right: 0; bottom: 0; width: 50px; height: 20px"></div></div></div>
<div class="root"><div class="f" style="flex-direction: column"><div class="a" style="top: 0; left: 0; width: 40%">percentage</div></div></div>
<div class="root"><div style="padding: 10px"><div class="f"><div class="a" style="top: 0; right: 0">deeper</div></div></div></div>
<div class="root" dir="rtl"><div class="f"><div class="a" style="top: 3px; right: 3px">right to left</div></div></div>
<div class="root"><div class="g"><div>a</div><div class="a">static position</div></div></div>
<div class="root"><div class="g" style="margin-left: 30px"><div>a</div><div class="a" style="top: 2px">inline static</div></div></div>
<div class="root"><div class="g"><div class="a" style="left: 5px; bottom: 5px">grid inset</div></div></div>
<div class="root" dir="rtl"><div class="g"><div>a</div><div class="a">right to left</div></div></div>
</div>
