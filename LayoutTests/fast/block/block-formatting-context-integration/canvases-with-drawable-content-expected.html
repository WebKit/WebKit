<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false HTMLInCanvasEnabled=true ] -->
<style>
canvas { background: lightgray; margin: 4px; }
.drawable { background: green; color: white; font-family: monospace; font-size: 10px; height: 20px; }
</style>
<div><canvas width="120" height="30" content=drawable><div drawable class="drawable">inline canvas</div></canvas></div>
<div><canvas width="120" height="30" content=drawable style="display: block"><div drawable class="drawable">block canvas</div></canvas></div>
<div style="width: 300px"><canvas width="120" height="30" content=drawable style="display: block"><div drawable class="drawable" style="width: 20%">percent</div></canvas></div>
<div><span>text <canvas width="120" height="30" content=drawable><div drawable class="drawable">in a span</div></canvas></span></div>
<div><span>text <canvas width="120" height="30" content=drawable style="display: block"><div drawable class="drawable" style="width: 50%">block in a span</div></canvas></span></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
onload = async () => {
    for (const canvas of document.querySelectorAll("canvas")) {
        await new Promise(resolve => {
            canvas.addEventListener("paint", resolve, { once: true });
            canvas.requestPaint();
        });
        canvas.getContext("2d").drawElementImage(canvas.firstElementChild, 0, 0);
    }
    if (window.testRunner)
        testRunner.notifyDone();
};
</script>
