<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=false ] -->
<style>
body { font: 12px/16px sans-serif; margin: 4px; }
.root { width: 300px; border: 1px solid; margin-bottom: 4px; }
.cv { content-visibility: hidden; border: 2px solid blue; padding: 3px; margin: 5px 0; }
.visible { content-visibility: visible; }
</style>
<div class=root>
  <div class="cv visible"><span>content that changed while it was hidden, on more lines</span><div style="float: left; width: 30px; height: 30px; background: green;"></div><div style="margin-top: 7px;">block</div></div>
  <div>after</div>
  <div class=cv>gets hidden<br>two</div>
  <div>after</div>
  <div class="cv visible" style="overflow: auto; height: 50px;" id=hidden-scroll-container>a scroll container that gets hidden<div style="height: 200px;"></div></div>
</div>
<script>
// The render tree keeps the overflow of the content content-visibility skips from where it was laid out last.
document.body.offsetHeight;
document.getElementById("hidden-scroll-container").classList.remove("visible");
</script>
