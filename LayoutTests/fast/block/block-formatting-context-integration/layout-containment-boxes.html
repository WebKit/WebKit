<!DOCTYPE html><!-- webkit-test-runner [ BlockFormattingContextIntegrationEnabled=true ] -->
<style>
body { margin: 0; font-family: -apple-system; font-size: 10px; line-height: 12px; }
.root { display: flow-root; width: 150px; background-color: lightgray; margin: 0 6px 6px 0; float: left; }
.f { float: left; width: 30px; height: 30px; background-color: rgba(0, 128, 0, 0.6); }
.m { margin: 10px 0; height: 10px; background-color: blue; }
.a { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; background-color: purple; }
.b { border: 2px solid orange; }
</style>
<div class=root><div class=b style="contain: layout"><div class=m></div></div></div>
<div class=root><div style="contain: layout; background-color: orange"><div class=m></div></div></div>
<div class=root><div style="contain: content; background-color: orange"><div class=m></div></div></div>
<div class=root><div class=f></div><div class=b style="contain: layout">beside the float</div></div>
<div class=root><div class=b style="contain: layout"><div class=f></div>x</div></div>
<div class=root><div class=b style="contain: layout; height: 30px">x<div class=a></div></div></div>
<div class=root>x<div class=b style="display: inline-block; contain: layout">a<br>b</div>y</div>
<div class=root><div class=b style="content-visibility: hidden; height: 20px">hidden content</div></div>
<div class=root><div class=b style="content-visibility: auto">visible content</div></div>
<div class=root><div class=b style="contain: layout"><div class=b style="contain: layout; margin: 5px"><div class=m></div></div></div></div>
<div class=root><div style="overflow: auto; height: 40px"><div class=b style="contain: layout; height: 20px"><div style="height: 80px; width: 10px; background-color: blue"></div></div></div></div>
