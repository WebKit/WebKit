<!DOCTYPE html>
<title>-webkit-fill-available sizing of an absolutely positioned box whose containing block is an inline box</title>
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
<style>
.container {
    font: 20px/1 Ahem;
    width: 400px;
    height: 300px;
}
.inline-box {
    position: relative;
    padding: 3px 4px;
}
.abs {
    position: absolute;
    inset: 0;
}
</style>
<div class="container">XX <span class="inline-box">XX<div class="abs" style="width: -webkit-fill-available; height: 5px"></div>XX</span> ZZ</div>
<script>
// -webkit-fill-available resolves against the containing block, which is the inline box here (and not its enclosing block).
const widthCase = document.querySelector(".container");
test(() => {
    const inlineBox = widthCase.querySelector(".inline-box").getBoundingClientRect();
    assert_approx_equals(widthCase.querySelector(".abs").getBoundingClientRect().width, inlineBox.width, 0.5);
}, "'width: -webkit-fill-available' fills the padding box of the inline box");
widthCase.remove();
</script>
