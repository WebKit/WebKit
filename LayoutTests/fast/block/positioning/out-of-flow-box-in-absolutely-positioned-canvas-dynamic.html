<!DOCTYPE html><!-- webkit-test-runner [ HTMLInCanvasEnabled=true ] -->
<html>
<body>
<p>This tests that an out-of-flow box inside an absolutely positioned drawable canvas is laid out after its width changes.</p>
<div style="position: relative"><div><canvas id="canvas" content="drawable" style="display: block"><span style="position: relative"><div id="target" style="position: absolute; width: 50px; height: 50px"></div></span></canvas></div></div>
<pre id="result"></pre>
<script>
if (window.testRunner)
    testRunner.dumpAsText();
// The canvas starts in-flow because an out-of-flow box that first appears inside an absolutely positioned drawable canvas is not laid out (webkit.org/b/331738).
// It is display: block so that becoming absolutely positioned does not rebuild its renderers.
document.body.offsetHeight;
canvas.style.position = "absolute";
document.body.offsetHeight;
target.style.width = "100px";
const width = target.getBoundingClientRect().width;
result.textContent = width == 100 ? "PASS" : "FAIL: width is " + width + "px, expected 100px";
</script>
</body>
</html>
