<!DOCTYPE html> <!-- webkit-test-runner [ useFlexibleViewport=true ] -->
<html>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<head>
<script src="../../../resources/js-test.js"></script>
<script src="../../../resources/ui-helper.js"></script>
<style>
.card {
    position: relative;
    width: 300px;
    margin: 20px;
}

.card input {
    position: absolute;
    top: 0;
    left: 0;
    width: 200px;
    height: 100px;
    margin: 0;
    opacity: 0;
}

.card label {
    display: block;
    height: 150px;
    border: 1px solid blue;
    border-radius: 12px;
}
</style>
</head>
<body>
<div class="card">
    <input type="radio" id="radio" name="choice">
    <label id="label" for="radio">Choice</label>
</div>
<div id="console"></div>
<script>
jsTestIsAsync = true;

addEventListener("load", async () => {
    description("Tapping a transparent form control layered over its label should highlight the label. To test manually, tap the empty area of the box; the highlight should cover the whole rounded box.");

    if (!window.testRunner)
        return;

    labelRect = document.getElementById("label").getBoundingClientRect();

    await UIHelper.activateElement(document.getElementById("radio"));
    await UIHelper.waitForDoubleTapDelay();

    do
        highlightRect = await UIHelper.tapHighlightViewRect();
    while (!highlightRect.width);

    shouldBeTrue("highlightRect.left <= labelRect.left");
    shouldBeTrue("highlightRect.top <= labelRect.top");
    shouldBeTrue("highlightRect.left + highlightRect.width >= labelRect.right");
    shouldBeTrue("highlightRect.top + highlightRect.height >= labelRect.bottom");

    finishJSTest();
});
</script>
</body>
</html>
