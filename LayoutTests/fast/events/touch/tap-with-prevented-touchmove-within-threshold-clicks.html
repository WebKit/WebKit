<!DOCTYPE html>
<html>
<head>
    <script src="../../../resources/js-test.js"></script>
    <script src="../../../resources/ui-helper.js"></script>

<style>
#target {
    position: absolute;
    left: 0px;
    top: 0px;
    width: 200px;
    height: 100px;
}

#sentinel {
    position: absolute;
    left: 0px;
    top: 300px;
    width: 200px;
    height: 100px;
}
</style>

</head>
<body>

<button id="target"></button>
<button id="sentinel"></button>
<div id="console"></div>

<script>
description("Tests that a tap still dispatches click when the page prevents a touchmove that stays within the tap threshold.");
window.jsTestIsAsync = true;

const target = document.getElementById("target");
const sentinel = document.getElementById("sentinel");
let preventedTouchMoveCount = 0;
let targetClickCount = 0;

window.addEventListener("load", async () => {
    target.addEventListener("touchmove", event => {
        event.preventDefault();
        preventedTouchMoveCount++;
    }, { passive: false });

    target.addEventListener("click", () => targetClickCount++);

    // A tap on the sentinel is used as a barrier: the click generated by the first tap
    // must have been dispatched before the click on the sentinel.
    sentinel.addEventListener("click", () => {
        shouldBe("preventedTouchMoveCount", "1");
        shouldBe("targetClickCount", "1");
        finishJSTest();
    });

    // Touches are only dispatched to the page within the touch event regions, which are updated on rendering updates.
    await UIHelper.renderingUpdate();

    eventSender.clearTouchPoints();
    eventSender.addTouchPoint(100, 50);
    await eventSender.asyncTouchStart();
    // Move less than the default drag threshold (8px).
    eventSender.updateTouchPoint(0, 103, 50);
    await eventSender.asyncTouchMove();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();

    await UIHelper.renderingUpdate();

    eventSender.addTouchPoint(100, 350);
    await eventSender.asyncTouchStart();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();
});
</script>
</body>

</html>
