<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
</head>
<body>
<button id="target" style="width: 100px; height: 100px"></button>
<script>
test(test => {
    internals.settings.setTouchEventEmulationEnabled(true);
    test.add_cleanup(() => internals.settings.setTouchEventEmulationEnabled(false));

    const target = document.getElementById("target");
    const events = [];
    for (const type of ["mousedown", "mouseup", "click"])
        target.addEventListener(type, event => events.push(event.type));
    target.addEventListener("click", test.step_func(event => assert_true(event.isTrusted)));
    target.addEventListener("pointerup", event => events.push(event.type), { once: true });
    target.addEventListener("pointerdown", test.step_func(event => {
        events.push(event.type);
        assert_equals(event.pointerType, "touch");
        event.preventDefault();
    }), { once: true });

    eventSender.mouseMoveTo(50, 50);
    eventSender.mouseDown();
    eventSender.mouseUp();
    assert_array_equals(events, ["pointerdown", "pointerup", "click"]);

    events.length = 0;
    eventSender.leapForward(1000);
    eventSender.mouseDown();
    eventSender.mouseUp();
    assert_array_equals(events, ["mousedown", "mouseup", "click"]);
}, "Canceling a touch pointerdown suppresses compatibility mouse events but preserves click.");
</script>
</body>
</html>
