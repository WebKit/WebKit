<!DOCTYPE html><!-- webkit-test-runner [ useFlexibleViewport=true ] -->
<html>
<head>
<title>This tests that clickable content with an empty box but visible floated children is not treated as being outside of the viewport</title>
<script src="../../../../../resources/basic-gestures.js"></script>
<style>
#tapthis {
    width: 400px;
    height: 400px;
    border: 1px solid green;
}

#becomesVisible {
    display: none;
}

#becomesVisible > div {
    float: left;
    width: 100px;
    height: 100px;
    background-color: green;
}
</style>
<script>
async function test() {
    if (!window.testRunner || !testRunner.runUIScript)
        return;
    if (window.internals)
        internals.settings.setContentChangeObserverEnabled(true);

    testRunner.waitUntilDone();
    testRunner.dumpAsText();

    let rect = tapthis.getBoundingClientRect();
    let x = rect.left + rect.width / 2;
    let y = rect.top + rect.height / 2;

    await tapAtPoint(x, y);
}
</script>
</head>
<body onload="test()">
<div id=tapthis>PASS if 'clicked' text is not shown below.</div>
<div id=becomesVisible><div></div><div></div></div>
<pre id=result></pre>
<script>
tapthis.addEventListener("mouseover", function( event ) {
    becomesVisible.style.display = "block";
    document.body.offsetHeight;
    setTimeout(function() {
        if (window.testRunner)
            testRunner.notifyDone();
    }, 300);
}, false);

becomesVisible.addEventListener("click", function( event ) {
    result.innerHTML = "clicked hidden";
}, false);

tapthis.addEventListener("click", function( event ) {
    result.innerHTML = "clicked";
}, false);
</script>
</body>
</html>
