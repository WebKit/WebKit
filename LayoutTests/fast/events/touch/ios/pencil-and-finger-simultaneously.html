<!DOCTYPE html> <!-- webkit-test-runner [ useFlexibleViewport=true ] -->
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../../resources/js-test.js"></script>
<script src="../../../../resources/ui-helper.js"></script>
<style>
body, html {
    margin: 0;
}

#target {
    width: 100%;
    height: 400px;
    touch-action: none;
    background: lightgray;
}
</style>
<script>
jsTestIsAsync = true;

function touchTypes(touchList)
{
    return Array.from(touchList).map(touch => touch.touchType).sort().join(", ");
}

function logTouchEvent(event)
{
    debug(`${event.type}: touches=[${touchTypes(event.touches)}] changedTouches=[${touchTypes(event.changedTouches)}]`);
}

function logPointerEvent(event)
{
    debug(`${event.type}: pointerType=${event.pointerType} isPrimary=${event.isPrimary}`);
}

function finger(phase)
{
    return { inputType: "finger", phase, id: 1, x: 50, y: 100, pressure: 0 };
}

function stylus(phase, offset = 0)
{
    return { inputType: "stylus", phase, id: 2, x: 200 + offset, y: 200 + offset, pressure: 0.5 };
}

function hidEvent(timeOffset, ...touches)
{
    return { inputType: "hand", timeOffset, touches };
}

addEventListener("load", async () => {
    description("Verifies that web content receives stylus touches while a finger is touching the screen, and vice versa. To test manually, rest a finger on the gray area and then touch it with Apple Pencil (and vice versa); both the finger and the pencil should be reported, and each should be the primary pointer of its type.");

    const target = document.getElementById("target");
    for (const type of ["touchstart", "touchend"])
        target.addEventListener(type, logTouchEvent);
    for (const type of ["pointerdown", "pointermove", "pointerup"])
        target.addEventListener(type, logPointerEvent);

    if (!window.testRunner)
        return;

    debug("\nFinger, then pencil:");
    await UIHelper.sendEventStream({
        events: [
            hidEvent(0, finger("began")),
            hidEvent(0.1, finger("stationary")),
            hidEvent(0.2, finger("stationary"), stylus("began")),
            hidEvent(0.3, finger("stationary"), stylus("moved", 10)),
            hidEvent(0.4, finger("stationary"), stylus("ended", 10)),
            hidEvent(0.5, finger("ended")),
        ]
    });
    await UIHelper.ensurePresentationUpdate();

    debug("\nPencil, then finger:");
    await UIHelper.sendEventStream({
        events: [
            hidEvent(0, stylus("began")),
            hidEvent(0.1, stylus("moved", 10)),
            hidEvent(0.2, stylus("stationary", 10), finger("began")),
            hidEvent(0.3, stylus("moved", 20), finger("stationary")),
            hidEvent(0.4, stylus("ended", 20), finger("stationary")),
            hidEvent(0.5, finger("ended")),
        ]
    });
    await UIHelper.ensurePresentationUpdate();

    finishJSTest();
});
</script>
</head>
<body>
<div id="target"></div>
<p id="description"></p>
<p id="console"></p>
</body>
</html>
