<!DOCTYPE html>
<html>
<head>
    <script src="../../../resources/js-test.js"></script>
    <script src="../../../resources/ui-helper.js"></script>

<style>
body {
    height: 3000px;
}

#target {
    position: absolute;
    left: 0px;
    top: 0px;
    width: 200px;
    height: 200px;
}

#sentinel {
    position: absolute;
    left: 0px;
    top: 300px;
    width: 200px;
    height: 100px;
}
</style>

</head>
<body>

<button id="target"></button>
<button id="sentinel"></button>
<div id="console"></div>

<script>
description("Tests that a swipe beyond the tap threshold does not dispatch click nor scroll when the page prevents touchmove, even if the first prevented touchmove stays within the threshold.");
window.jsTestIsAsync = true;

const target = document.getElementById("target");
const sentinel = document.getElementById("sentinel");
let preventedTouchMoveCount = 0;
let targetClickCount = 0;

window.addEventListener("load", async () => {
    target.addEventListener("touchmove", event => {
        event.preventDefault();
        preventedTouchMoveCount++;
    }, { passive: false });

    target.addEventListener("click", () => targetClickCount++);

    // A tap on the sentinel is used as a barrier: any click generated by the swipe
    // would have been dispatched before the click on the sentinel.
    sentinel.addEventListener("click", () => {
        shouldBe("preventedTouchMoveCount", "2");
        shouldBe("targetClickCount", "0");
        shouldBe("window.scrollY", "0");
        finishJSTest();
    });

    // Touches are only dispatched to the page within the touch event regions, which are updated on rendering updates.
    await UIHelper.renderingUpdate();

    eventSender.clearTouchPoints();
    eventSender.addTouchPoint(100, 150);
    await eventSender.asyncTouchStart();
    // First move stays within the default drag threshold (8px).
    eventSender.updateTouchPoint(0, 100, 147);
    await eventSender.asyncTouchMove();
    // Second move exceeds the threshold.
    eventSender.updateTouchPoint(0, 100, 90);
    await eventSender.asyncTouchMove();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();

    await UIHelper.renderingUpdate();

    eventSender.addTouchPoint(100, 350);
    await eventSender.asyncTouchStart();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();
});
</script>
</body>

</html>
