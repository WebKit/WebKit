<!DOCTYPE html>
<html>
<head>
    <script src="../../../resources/js-test.js"></script>
    <script src="../../../resources/ui-helper.js"></script>

<style>
#target {
    position: absolute;
    left: 0px;
    top: 0px;
    width: 200px;
    height: 100px;
}

#sentinel {
    position: absolute;
    left: 0px;
    top: 300px;
    width: 200px;
    height: 100px;
}
</style>

</head>
<body>

<button id="target"></button>
<button id="sentinel"></button>
<div id="console"></div>

<script>
description("Tests that a tap does not dispatch click when the page prevents touchstart.");
window.jsTestIsAsync = true;

const target = document.getElementById("target");
const sentinel = document.getElementById("sentinel");
let preventedTouchStartCount = 0;
let targetClickCount = 0;

window.addEventListener("load", async () => {
    target.addEventListener("touchstart", event => {
        event.preventDefault();
        preventedTouchStartCount++;
    }, { passive: false });

    target.addEventListener("click", () => targetClickCount++);

    // A tap on the sentinel is used as a barrier: any click generated by the first tap
    // would have been dispatched before the click on the sentinel.
    sentinel.addEventListener("click", () => {
        shouldBe("preventedTouchStartCount", "1");
        shouldBe("targetClickCount", "0");
        finishJSTest();
    });

    // Touches are only dispatched to the page within the touch event regions, which are updated on rendering updates.
    await UIHelper.renderingUpdate();

    eventSender.clearTouchPoints();
    eventSender.addTouchPoint(100, 50);
    await eventSender.asyncTouchStart();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();

    await UIHelper.renderingUpdate();

    eventSender.addTouchPoint(100, 350);
    await eventSender.asyncTouchStart();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();
});
</script>
</body>

</html>
