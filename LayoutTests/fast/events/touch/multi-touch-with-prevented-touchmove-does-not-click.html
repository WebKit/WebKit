<!DOCTYPE html>
<html>
<head>
    <script src="../../../resources/js-test.js"></script>
    <script src="../../../resources/ui-helper.js"></script>

<style>
#target {
    position: absolute;
    left: 0px;
    top: 0px;
    width: 200px;
    height: 200px;
}

#sentinel {
    position: absolute;
    left: 0px;
    top: 300px;
    width: 200px;
    height: 100px;
}
</style>

</head>
<body>

<button id="target"></button>
<button id="sentinel"></button>
<div id="console"></div>

<script>
description("Tests that a two-finger gesture does not dispatch click when the page prevents touchmove of the second finger, even if the first finger does not move.");
window.jsTestIsAsync = true;

const target = document.getElementById("target");
const sentinel = document.getElementById("sentinel");
let preventedTouchMoveCount = 0;
let targetClickCount = 0;

window.addEventListener("load", async () => {
    target.addEventListener("touchmove", event => {
        event.preventDefault();
        preventedTouchMoveCount++;
    }, { passive: false });

    target.addEventListener("click", () => targetClickCount++);

    // A tap on the sentinel is used as a barrier: any click generated by the two-finger
    // gesture would have been dispatched before the click on the sentinel.
    sentinel.addEventListener("click", () => {
        shouldBe("preventedTouchMoveCount", "1");
        shouldBe("targetClickCount", "0");
        finishJSTest();
    });

    // Touches are only dispatched to the page within the touch event regions, which are updated on rendering updates.
    await UIHelper.renderingUpdate();

    eventSender.clearTouchPoints();
    // First finger goes down and stays still.
    eventSender.addTouchPoint(50, 50);
    await eventSender.asyncTouchStart();
    // Second finger goes down and moves beyond the default drag threshold (8px).
    eventSender.addTouchPoint(150, 50);
    await eventSender.asyncTouchStart();
    eventSender.updateTouchPoint(1, 150, 150);
    await eventSender.asyncTouchMove();
    // Lift the second finger, then the first one.
    eventSender.releaseTouchPoint(1);
    await eventSender.asyncTouchEnd();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();

    await UIHelper.renderingUpdate();

    eventSender.addTouchPoint(100, 350);
    await eventSender.asyncTouchStart();
    eventSender.releaseTouchPoint(0);
    await eventSender.asyncTouchEnd();
});
</script>
</body>

</html>
