<!DOCTYPE html>
<html>
<head>
    <script src="../../resources/js-test.js"></script>
    <script>
    description('This tests that WebKit properly handles sub-frames with invalid URLs. It passes if it does not crash.');
    window.jsTestIsAsync = true;

    function runTest() {
        // The frame's navigation failed, so it shows an error document, whose origin is opaque.
        try {
            document.getElementById('target').contentWindow.document.open();
            testFailed("Opening the frame's document did not throw.");
        } catch (e) {
            if (e.name == "SecurityError")
                testPassed("Opening the frame's document threw a SecurityError.");
            else
                testFailed("Opening the frame's document threw " + e.name + ".");
        }
        finishJSTest();
    }
    </script>
</head>
<body onload="runTest()">
    <iframe id='target' src="http://255.255.255.255/" width="500" height="500"></iframe>
</body>
</html>
