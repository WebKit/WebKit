<!DOCTYPE html>
<html>
<head>
<script src="../../../resources/js-test.js"></script>
<script src="resources/image-document-frame.js"></script>
</head>
<body>
<script>
description("Tests dynamic import() from a user script running in an ImageDocument (a document without a text decoder, so with a null charset). "
    + "The importing script has a source origin (about:blank) but no script fetcher, so ScriptModuleLoader creates a CachedScriptFetcher from the document charset.");

window.jsTestIsAsync = true;
var importResult;

function importFinished(result)
{
    importResult = result;
    shouldBeEqualToString("importResult", "resolved: 42");
    finishJSTest();
}

if (window.testRunner) {
    const moduleURL = new URL("resources/module.js", location.href).href;
    testRunner.addUserScript(`
        if (window !== top && document.body && document.body.firstChild && document.body.firstChild.tagName === "IMG") {
            import(${JSON.stringify(moduleURL)}).then(
                (module) => parent.importFinished("resolved: " + module.value),
                (error) => parent.importFinished("rejected: " + error));
        }`, false, true);
    loadImageDocumentFrame();
} else
    debug("This test requires testRunner.addUserScript().");
</script>
</body>
</html>
