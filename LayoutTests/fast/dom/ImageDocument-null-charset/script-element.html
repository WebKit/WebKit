<!DOCTYPE html>
<html>
<head>
<script src="../../../resources/js-test.js"></script>
<script src="resources/image-document-frame.js"></script>
</head>
<body>
<script>
description("Tests that script elements inserted into an ImageDocument (a document without a text decoder, so with a null charset) run. "
    + "ScriptElement::prepareScript() uses the document charset as the script's character encoding.");

window.jsTestIsAsync = true;
var frameDocument;
var inlineScriptRan = false;
var externalScriptRan = false;

loadImageDocumentFrame().then((iframe) => {
    frameDocument = iframe.contentDocument;
    shouldBeEqualToString("frameDocument.body.firstChild.tagName", "IMG");
    shouldBeEqualToString("frameDocument.characterSet", "UTF-8");

    const inlineScript = frameDocument.createElement("script");
    inlineScript.textContent = "parent.inlineScriptRan = true;";
    frameDocument.body.appendChild(inlineScript);
    shouldBeTrue("inlineScriptRan");

    const externalScript = frameDocument.createElement("script");
    externalScript.onload = () => {
        shouldBeTrue("externalScriptRan");
        finishJSTest();
    };
    externalScript.onerror = () => {
        testFailed("The external script failed to load.");
        finishJSTest();
    };
    externalScript.src = "../ImageDocument-null-charset/resources/external-script.js";
    frameDocument.body.appendChild(externalScript);
});
</script>
</body>
</html>
