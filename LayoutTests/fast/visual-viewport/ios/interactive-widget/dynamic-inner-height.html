<!DOCTYPE html> <!-- webkit-test-runner [ useFlexibleViewport=true ] -->
<html>
<head>
    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content"/>
    <style>
        input {
            width: 400px;
            height: 50px;
        }
    </style>
    <script src="../../../../resources/js-test.js"></script>
    <script src="../../../../resources/ui-helper.js"></script>
</head>
<body>
    <input id="input" type="text">
    <script>
        jsTestIsAsync = true;

        async function setInteractiveWidget(value) {
            document.getElementById("viewport-meta").content = `width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=${value}`;
            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();
        }

        addEventListener("load", async () => {
            let textField = document.querySelector("input");
            window.innerHeightWithoutKeyboard = window.innerHeight;

            await UIHelper.activateElement(textField);
            await UIHelper.waitForKeyboardToShow();
            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();
            window.keyboardTopInView = (await UIHelper.inputViewBoundsInWebView()).top;

            debug("interactive-widget=resizes-content, keyboard shown:");
            shouldBeTrue('window.innerHeight < window.innerHeightWithoutKeyboard');
            shouldBeTrue('Math.abs(window.innerHeight - window.keyboardTopInView) < 1');
            shouldBeTrue('Math.abs(window.innerHeight - window.visualViewport.height) < 1');
            shouldBeTrue('Math.abs(window.innerHeight - internals.layoutViewportRect().height) < 1');

            await setInteractiveWidget("overlays-content");
            debug("\ninteractive-widget=overlays-content, keyboard shown:");
            await new Promise(resolve => shouldBecomeEqual('window.innerHeight', 'window.innerHeightWithoutKeyboard', resolve));

            await setInteractiveWidget("resizes-visual");
            debug("\ninteractive-widget=resizes-visual, keyboard shown:");
            await new Promise(resolve => shouldBecomeEqual('window.innerHeight', 'window.innerHeightWithoutKeyboard', resolve));

            await setInteractiveWidget("resizes-content");
            textField.blur();
            await UIHelper.waitForKeyboardToHide();
            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();
            debug("\ninteractive-widget=resizes-content, keyboard hidden:");
            await new Promise(resolve => shouldBecomeEqual('window.innerHeight', 'window.innerHeightWithoutKeyboard', resolve));

            finishJSTest();
        });
    </script>
</body>

</html>
