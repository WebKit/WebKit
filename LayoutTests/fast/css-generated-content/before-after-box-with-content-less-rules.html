<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
<style>
*::before, *::after { box-sizing: border-box; }
.box::before, .box::after { display: block; height: 25px; }
.before::before { content: ""; }
.after::after { content: ""; }
</style>
</head>
<body>
<div id="noContent" class="box"></div>
<div id="beforeContent" class="box before"></div>
<div id="afterContent" class="box after"></div>
<div id="bothContent" class="box before after"></div>
<div id="dynamic" class="box"></div>
<script>
description("::before and ::after get a box from a rule that sets 'content', even when other rules without 'content' also match them.");

shouldBe("noContent.offsetHeight", "0");
shouldBe("beforeContent.offsetHeight", "25");
shouldBe("afterContent.offsetHeight", "25");
shouldBe("bothContent.offsetHeight", "50");

debug("");
evalAndLog("dynamic.classList.add('before')");
shouldBe("dynamic.offsetHeight", "25");
evalAndLog("dynamic.classList.add('after')");
shouldBe("dynamic.offsetHeight", "50");
evalAndLog("dynamic.classList.remove('before')");
shouldBe("dynamic.offsetHeight", "25");
evalAndLog("dynamic.classList.remove('after')");
shouldBe("dynamic.offsetHeight", "0");
</script>
</body>
</html>
