<!DOCTYPE html>
<!-- webkit.org/b/322481 variant B: underline-offset (layout level style change), but the container is a
     plain block, so the containing block is not an inline level box in the body's IFC. -->
<script src="resources/text-based-repaint.js"></script>
<script>
function repaintTest() {
    document.getElementById('target').style.textDecorationLine = 'underline';
}
onload = runRepaintTest;
</script>
<style>
  body {
      /* Ahem, and text made only of characters it covers, so the rects are the same on every port. */
      font: 16px/20px Ahem;
      margin: 0;
  }
  #container {
      width: 300px;
      height: 300px;
  }
  .a {
      text-underline-offset: 0.3em;
      text-decoration: none;
  }
</style>

<div id=container>
  <a class=a id=target href=.>XXXX XXXX</a>
</div>
