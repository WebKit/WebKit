<!DOCTYPE html>
<style>
.box {
    width: 50px;
    height: 50px;
    margin: 10px;
    color: red;
}
#gradient {
    background-image: linear-gradient(currentColor, blue);
}
#color-mix-gradient {
    background-image: radial-gradient(color-mix(in srgb, currentColor, blue), blue);
}
#color-image {
    background-image: image(currentColor);
}
#cross-fade {
    background-image: cross-fade(linear-gradient(currentColor, blue) 50%, linear-gradient(blue, blue));
}
#fixed-outline-color {
    background-image: linear-gradient(currentColor, blue);
    outline-color: black;
}
#no-current-color {
    background-image: linear-gradient(red, blue);
}
</style>
<div class="box" id="gradient"></div>
<div class="box" id="color-mix-gradient"></div>
<div class="box" id="color-image"></div>
<div class="box" id="cross-fade"></div>
<div class="box" id="fixed-outline-color"></div>
<div class="box" id="no-current-color"></div>
<pre id="result"></pre>
<script>
if (window.testRunner)
    testRunner.dumpAsText();
document.body.offsetHeight;
if (window.internals)
    internals.startTrackingRepaints();
document.styleSheets[0].cssRules[0].style.color = "green";
document.body.offsetHeight;

if (window.internals) {
    result.innerText = internals.repaintRectsAsText();
    internals.stopTrackingRepaints();
}
</script>
