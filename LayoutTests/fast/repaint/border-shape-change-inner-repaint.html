<!DOCTYPE html>
<html>
<head>
<script src="../../resources/ui-helper.js"></script>
<title>Repaint when only the inner shape of a two-shape border-shape changes</title>
<style>
    body { margin: 0; }
    #target {
        width: 150px;
        height: 150px;
        margin: 20px;
        border: 20px solid blue;
        background: lightgreen;
        border-shape: polygon(50% 0, 100% 50%, 50% 100%, 0 50%) circle(30%);
    }
    body.changed #target {
        border-shape: polygon(50% 0, 100% 50%, 50% 100%, 0 50%) circle(45%);
    }
</style>
<script>
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.dontForceRepaint();
}

window.addEventListener('load', async () => {
    await UIHelper.renderingUpdate();

    document.body.classList.add('changed');

    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();

    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</head>
<body>
<div id="target"></div>
</body>
</html>
