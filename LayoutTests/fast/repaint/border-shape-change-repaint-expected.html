<!DOCTYPE html>
<html>
<head>
<title>Repaint when a single border-shape changes - reference</title>
<style>
    body { margin: 0; }
    #target {
        width: 150px;
        height: 150px;
        margin: 20px;
        border: 20px solid blue;
        background: lightgreen;
        border-shape: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }
</style>

</head>
<body>
<div id="target"></div>
</body>
</html>
