<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
<style>
body { margin: 0; }
#host { position: absolute; left: 100px; top: 100px; }
#grid { display: grid; width: 60px; grid-template-columns: 60px; grid-template-rows: 30px; background-color: blue; }
#inner { display: grid; grid-template-columns: 60px; grid-template-rows: 30px; box-shadow: 0 0 0 30px green; }
#item { background-color: yellow; }
</style>
</head>
<body>
<div id="host"><div id="grid"><div id="inner"><div id="item"></div></div></div></div>
<script>
description("The repaint rect of a grid container includes the box-shadow of a nested grid container that is its grid item.");

var grid = document.getElementById("grid");
document.body.offsetTop;

internals.startTrackingRepaints();
grid.style.backgroundColor = "green";
document.body.offsetTop;
var repaintRects = internals.repaintRectsAsText();
internals.stopTrackingRepaints();

debug(repaintRects);
shouldBeTrue("repaintRects.indexOf('(rect 70 70 120 90)') != -1");
</script>
</body>
</html>
