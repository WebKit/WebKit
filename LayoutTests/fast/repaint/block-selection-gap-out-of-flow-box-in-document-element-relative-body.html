<!DOCTYPE html>
<!-- The selection gap of a relatively positioned body is clipped out where the fixed positioned box of the document element is, which does not move with the body. -->
<html style="transform: translateX(0)">
<link rel="stylesheet" href="../../imported/w3c/web-platform-tests/fonts/ahem.css">
<style>
body { font: 20px/1 Ahem; width: 200px; margin: 0; position: relative; top: 20px; color: transparent; }
body::selection, body *::selection { background-color: green; color: transparent; }
.box { position: fixed; left: 120px; top: 20px; width: 20px; height: 20px; }
</style>
<body>XX XX<div class="box"></div><br>XX
<script>getSelection().selectAllChildren(document.body);</script>
</body>
</html>
