<!DOCTYPE html>
<!-- The selection gap of a scrolled body is clipped out where the absolutely positioned box of the document element is, which does not scroll with the body. -->
<html style="overflow: hidden; position: relative">
<link rel="stylesheet" href="../../imported/w3c/web-platform-tests/fonts/ahem.css">
<style>
body { font: 20px/1 Ahem; width: 200px; height: 200px; margin: 0; overflow: scroll; color: transparent; }
body::selection, body *::selection { background-color: green; color: transparent; }
.box { position: absolute; left: 120px; top: 40px; width: 20px; height: 20px; }
</style>
<body>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX XX<br>XX<div class="box"></div>
<script>document.body.scrollTop = 40; getSelection().selectAllChildren(document.body);</script>
</body>
</html>
