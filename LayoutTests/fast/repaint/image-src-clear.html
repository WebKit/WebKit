        window.addEventListener('load', async () => {
            description("Test repaint when an &lt;img&gt;'s src is cleared. The renderer's box should collapse to its no-image size and the previously painted region should be invalidated. webkit.org/b/314993");

            const x = document.getElementById('x');
            const loaded = new Promise(resolve => x.addEventListener('load', resolve, { once: true }));
            x.src = dataURL;
            await loaded;
            await UIHelper.renderingUpdate();

            if (window.internals)
                internals.startTrackingRepaints();

            x.src = '';

            await UIHelper.renderingUpdate();

            if (window.internals) {
                debug(window.internals.repaintRectsAsText());
                internals.stopTrackingRepaints();
            }

            finishJSTest();
        }, false);
    </script>
