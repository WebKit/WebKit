<!DOCTYPE html>
<!-- webkit.org/b/322481: pixel version of box-shadow-top-left-repaint.html. A box-shadow on an inline box is
     also an ink overflow only change, so it takes the recompute path. Paints before mutating, so shadow area
     the repaint fails to cover shows up against the reference. -->
<style>
body {
  margin: 0px;
}

div {
  padding: 50px;
  margin: 50px;
  font-family: Ahem;
  font-size: 10px;
}
</style>
<div><span id=box_shadow_horizontal>XXXXX</span></div>
<div style="writing-mode: vertical-lr"><span id=box_shadow_vertical>XXXXX</span></div>
<script src="resources/repaint.js" type="text/javascript"></script>
<script>
repaintTest = function() {
  box_shadow_horizontal.style.boxShadow = "-50px -25px 0px 50px green";
  box_shadow_vertical.style.boxShadow = "-50px -25px 0px 50px green";
};
onload = runRepaintTest;
</script>
