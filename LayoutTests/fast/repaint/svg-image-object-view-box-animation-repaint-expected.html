<!DOCTYPE html>
<html>
<head>
<title>Reference: animated SVG image with object-view-box after the animation finished</title>
<style>
    body {
        margin: 0;
    }
    img {
        display: block;
        width: 200px;
        height: 200px;
        object-view-box: inset(0 50% 50% 0);
    }
</style>
</head>
<body>
<p>You should see a green square in the bottom-right quarter of a white 200x200 box, with no red.</p>
<img src="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>
        <rect x='50' y='50' width='100' height='100' fill='green'/>
    </svg>">
</body>
</html>
