<!DOCTYPE html>
<meta charset="utf-8">
<title>text-overflow truncates a block ellipsis running opposite to the line by whole characters</title>
<style>
div {
    font: 20px/1.2 monospace;
    width: 10ch;
    overflow: hidden;
    text-overflow: ellipsis;
    line-clamp: 1 "א😀😀😀😀😀😀😀😀😀😀ב";
}
</style>
<div>x<br>y</div>
