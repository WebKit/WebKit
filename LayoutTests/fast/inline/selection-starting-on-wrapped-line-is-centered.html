<!DOCTYPE html>
<html>
<head>
<title>This tests that a selection starting on a wrapped line covers its line box and continues onto the next line without a gap.</title>
<style>
  ::selection { background-color: green; }
  body { margin: 0; font: 20px/60px Ahem; color: transparent; }
  .container { width: 50px; }
</style>
</head>
<body>
<div class="container" id="container">xx xx xx</div>
<script>
  var text = document.getElementById("container").firstChild;
  var range = document.createRange();
  range.setStart(text, 3);
  range.setEnd(text, 8);
  window.getSelection().addRange(range);
</script>
</body>
</html>
