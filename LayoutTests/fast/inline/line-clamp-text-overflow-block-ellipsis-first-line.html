<!DOCTYPE html>
<meta charset="utf-8">
<title>text-overflow measures a block ellipsis with the style it is painted with, not the ::first-line style</title>
<style>
div {
    font: 20px/1.2 monospace;
    width: 10ch;
    border: 1px solid;
    margin: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    line-clamp: 1 "very long block ellipsis";
}
/* The block ellipsis is not part of ::first-line, so it is painted without this letter spacing, and "very long…" fits. */
div::first-line {
    letter-spacing: 10px;
}
</style>
<div>x<br>y</div>
<div dir="rtl">x<br>y</div>
