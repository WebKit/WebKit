<!DOCTYPE html>
<style>
div {
    font: 100px/1 Ahem;
    color: green;
    writing-mode: vertical-rl;
    float: left;
}
.box {
    display: inline-block;
    width: 40px;
    height: 40px;
    background-color: blue;
}
</style>
<!-- Vertical lines are aligned on the central baseline, which the box synthesizes halfway between its margin edges. -->
<div>X<span class="box" style="alignment-baseline: central"></span></div>
<div>X<span class="box" style="alignment-baseline: alphabetic"></span></div>
<div>X<span class="box" style="alignment-baseline: text-top"></span></div>
