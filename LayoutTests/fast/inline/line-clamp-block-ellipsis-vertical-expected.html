<!DOCTYPE html>
<meta charset="utf-8">
<style>
div {
    font: 20px/1 Ahem;
    height: 12em;
    border: 1px solid;
    margin: 4px;
    float: left;
    white-space: pre;
}
.rl { writing-mode: vertical-rl; }
.lr { writing-mode: vertical-lr; }
.upright { text-orientation: upright; }
</style>
<!-- The block ellipsis is painted like the same text as content. -->
<div class="rl">line one<br>line (more)</div>
<div class="lr">line one<br>line (more)</div>
<div class="rl upright">line one<br>line (more)</div>
<div class="lr upright">line one<br>line (more)</div>
