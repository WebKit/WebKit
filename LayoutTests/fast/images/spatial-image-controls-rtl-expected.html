    div.background-tint {
        width: 45px;
        height: 45px;
        position: absolute;
        border-radius: 45px;
    }

    div.blur {
        background-color: rgba(0, 0, 0, 0.55);
        -webkit-backdrop-filter: saturate(180%) blur(17.5px);
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        position: absolute;
        border-radius: 45px;
    }

    div.tint {
        background-color: rgba(255, 255, 255, 0.14);
        mix-blend-mode: lighten;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        position: absolute;
        border-radius: 45px;
    }

        hsla(0,0%,0%,.46) 80%,
        hsla(0,0%,0%,.49) 90%,
        hsla(0,0%,0%,.5));
        position: absolute;
        bottom: 0;
        left: 0;
        height: 33%;
        width: 100%;
        border-bottom-right-radius: inherit;
        border-bottom-left-radius: inherit;
    }
