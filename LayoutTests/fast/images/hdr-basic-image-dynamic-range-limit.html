<!DOCTYPE html>
<html>
<meta name="fuzzy" content="maxDifference=0-40; totalPixels=0-80000" />
<style>
    .image-box {
        width: 200px;
        height: 200px;
        will-change: transform;
    }
    .box {
        position: fixed;
        top: 20px; 
    }
    .standard { 
        dynamic-range-limit: standard;
        left: 20px;
    }
    .no-limit { 
        dynamic-range-limit: no-limit;
        left: 240px;
    }
</style>
<body>
    <div class="standard box">
        <img class="image-box" src="resources/gainmap-red-green-1920x1920.jpg">
    </div>
    <div class="no-limit box">
        <img class="image-box" src="resources/gainmap-red-green-1920x1920.jpg">
    </div>
    <script>
        if (window.internals && window.testRunner)
            internals.setScreenContentsFormatsForTesting(["RGBA8", "RGBA16F"]);
    </script>
</body>
</html>
