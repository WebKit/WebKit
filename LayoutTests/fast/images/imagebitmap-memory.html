<!DOCTYPE html> <!-- webkit-test-runner [ runSingly=true ] -->
<html>
<body style="margin: 0px;">
<canvas id="c" width="2017" height="3333" style="image-rendering: pixelated"></canvas>
<pre id=log style="position: absolute; top: 0; left: 0"></pre>
<script>
// Allocates ImageBitmaps until GC decides to run a full collection. Tests that
// ImageBitmaps report their sizes to GC, so that GC is run when many of the
// images are alive, and collects them before memory runs out.

function heapSizeAtLastFullCollection()
{
    return internals.memoryInfo().usedJSHeapSizeAfterLastFullCollection;
}

window.testRunner?.waitUntilDone();

async function runTest() {
    if (!window.testRunner || !window.internals) {
        log.textContent = "Test must be run in WebKitTestRunner.";
        return;
    }

    // Perform an initial full collection so we have a reliable heapSizeBefore
    // to compare against.
    $vm?.gc();
    const heapSizeBefore = heapSizeAtLastFullCollection();
    const maxRounds = 300;
    let ctx = c.getContext("2d");
    let imageBitmap;
    let rounds = 0;
    // Keep allocating ImageBitmaps without holding a strong reference to them.
    // Poll heapSizeAtLastFullCollection to detect when a full collection has
    // taken place.
    while (rounds < maxRounds && (rounds % 2 || heapSizeAtLastFullCollection() == heapSizeBefore)) {
        ctx.fillStyle = (rounds % 2 == 1) ? "lime" : "red";
        ctx.fillRect(8, 9, 200, 200);
        imageBitmap = await createImageBitmap(c);
        ++rounds;
    }
    ctx.clearRect(0, 0, c.width, c.height);

    let succeeded = true;
    // The full collection can leave behind more than the canvas backing
    // store and the remaining strongly referenced ImageBitmap, due to
    // conservative stack scanning. Use 8 as a comfortable limit for
    // the multiple of backing store size in use after the full
    // collection has taken place.
    const backingStoreSize = c.width * c.height * 4;
    let heapUsed = heapSizeAtLastFullCollection() - heapSizeBefore;
    if (heapUsed > 0 && heapUsed < 8 * backingStoreSize) {
        succeeded = true;
    } else {
        succeeded = false;
        $vm?.print(`heap used: ${heapUsed} in ${rounds} rounds`);
    }
    if (succeeded)
        ctx.drawImage(imageBitmap, 0, 0); // Verify the bitmaps work.

    testRunner.notifyDone();
}

window.onload = runTest;
</script>
</body>
</html>
