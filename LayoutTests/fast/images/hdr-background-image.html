<!DOCTYPE html>
<html>
<meta name="fuzzy" content="maxDifference=0-13; totalPixels=0-80000" />
<style>
    .container {
        width: 200px;
        height: 200px;
        will-change: transform;
    }
    .sdr {
        background-image: url('resources/red-400x400.png');
    }
    .hdr {
        background-image: url('resources/gainmap-red-green-1920x1920.jpg');
    }
    .hdr-sdr {
        background-image: url('resources/gainmap-red-green-1920x1920.jpg'), url('resources/red-400x400.png');
        background-repeat: no-repeat;
    }
</style>
<body>
    <div style="position: fixed; top: 10px; left: 10px;">
        <div class="sdr container">&nbsp;</div>
    </div>
    <div style="position: fixed; top: 10px; left: 220px;">
        <div class="hdr container">&nbsp;</div>
    </div>
    <div style="position: fixed; top: 10px; left: 430px;">
        <div class="hdr-sdr container">&nbsp;</div>
    </div>
    <script>
        if (window.internals && window.testRunner)
            internals.setScreenContentsFormatsForTesting(["RGBA8", "RGBA16F"]);
    </script>
</body>
</html>
