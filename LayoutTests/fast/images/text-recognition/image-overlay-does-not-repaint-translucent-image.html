<!DOCTYPE html>
<html class="reftest-wait">
<body>
    <img src='data:image/svg+xml;utf8,
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <rect width="100%" height="100%" fill="green" fill-opacity="0.5"/>
        </svg>
    '>
    <script>
        async function test() {
            // Installing an image overlay gives the image UA shadow content.
            internals.installImageOverlay(document.querySelector("img"), [{
                topLeft : new DOMPointReadOnly(0, 0),
                topRight : new DOMPointReadOnly(0.5, 0),
                bottomRight : new DOMPointReadOnly(0.5, 0.25),
                bottomLeft : new DOMPointReadOnly(0, 0.25),
                children: [{
                    text : "foo",
                    topLeft : new DOMPointReadOnly(0, 0),
                    topRight : new DOMPointReadOnly(0.5, 0),
                    bottomRight : new DOMPointReadOnly(0.5, 0.25),
                    bottomLeft : new DOMPointReadOnly(0, 0.25),
                }]
            }]);

            await new Promise(requestAnimationFrame);
            await new Promise(requestAnimationFrame);

            document.documentElement.classList.remove("reftest-wait");
        }
        window.addEventListener('load', test, false);
    </script>
</body>
</html>
