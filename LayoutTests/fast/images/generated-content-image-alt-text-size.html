<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
<style>
.box { display: inline-block; font: 16px/1 monospace; margin: 4px; }
ul { font: 16px/1 monospace; margin: 4px; padding: 0; }
.inside { width: max-content; list-style-position: inside; }
.outside { padding-left: 300px; }
.line { display: inline-block; width: 10px; height: 16px; }
</style>
<script>
// Each run gets its own image URL: a broken image whose failed load is already in the memory cache
// isn't sized for its alt text, so a reused URL would test that instead (webkit.org/b/331332).
const missingImage = `resources/does-not-exist.png?${Math.random()}`;
document.write(`<style>
#oneImage::before { content: url(${missingImage}) / "A long alternative text"; }
#oneImageNoAlt::before { content: url(${missingImage}); }
#twoImages::before { content: url(${missingImage}) url(${missingImage}) / "A long alternative text"; }
#twoImagesNoAlt::before { content: url(${missingImage}) url(${missingImage}); }
#blockImage::before { display: block; content: url(${missingImage}) / "A long alternative text"; }
#blockImageNoAlt::before { display: block; content: url(${missingImage}); }
#tableImage::before { display: table; content: url(${missingImage}) / "A long alternative text"; }
#tableImageNoAlt::before { display: table; content: url(${missingImage}); }
#replaced { content: url(${missingImage}) / "A long alternative text"; }
#replacedNoAlt { content: url(${missingImage}); }
#markerInside li::marker, #markerOutside::marker { content: url(${missingImage}) / "A long alternative text"; }
#markerInsideNoAlt li::marker, #markerOutsideNoAlt::marker { content: url(${missingImage}); }
</style>`);
</script>
</head>
<body>
<span id="oneImage" class="box"></span>
<span id="oneImageNoAlt" class="box"></span>
<span id="twoImages" class="box"></span>
<span id="twoImagesNoAlt" class="box"></span>
<span id="blockImage" class="box"></span>
<span id="blockImageNoAlt" class="box"></span>
<span id="tableImage" class="box"></span>
<span id="tableImageNoAlt" class="box"></span>
<span id="replaced" class="box"></span>
<span id="replacedNoAlt" class="box"></span>
<ul id="markerInside" class="inside"><li></li></ul>
<ul id="markerInsideNoAlt" class="inside"><li></li></ul>
<ul class="outside"><li id="markerOutside"><span class="line"></span></li></ul>
<ul class="outside"><li id="markerOutsideNoAlt"><span class="line"></span></li></ul>
<p id="description"></p>
<div id="console"></div>
<script>
description("Tests that the alt text of CSS content is used to size broken images, whether the image replaces an element or is generated by a pseudo-element, including through anonymous boxes and in markers.");

function width(id) {
    return document.getElementById(id).getBoundingClientRect().width;
}

// An outside marker doesn't affect its list item's size, so probe it by hit testing to the left
// of the list item: hitting the marker hits the list item.
function hitsListItemAt(id, distance) {
    var listItem = document.getElementById(id);
    var rect = listItem.getBoundingClientRect();
    return document.elementFromPoint(rect.left - distance, rect.top + 8) == listItem;
}

function check() {
    shouldBeTrue('width("oneImage") > width("oneImageNoAlt")');
    shouldBeTrue('width("twoImages") > width("twoImagesNoAlt")');
    shouldBeTrue('width("twoImages") > width("oneImage")');
    shouldBeTrue('width("blockImage") > width("blockImageNoAlt")');
    shouldBeTrue('width("tableImage") > width("tableImageNoAlt")');
    shouldBeTrue('width("replaced") > width("replacedNoAlt")');
    shouldBeTrue('width("markerInside") > width("markerInsideNoAlt")');
    shouldBeTrue('hitsListItemAt("markerOutside", 10)');
    shouldBeTrue('hitsListItemAt("markerOutsideNoAlt", 10)');
    shouldBeTrue('hitsListItemAt("markerOutside", 100)');
    shouldBeFalse('hitsListItemAt("markerOutsideNoAlt", 100)');
    finishJSTest();
}

function settled() {
    return width("oneImage") > width("oneImageNoAlt") && width("replaced") > width("replacedNoAlt");
}

// The broken images only resize for their alt text some time after they fail to load. Wait for that,
// but not forever, so that a regression fails the checks instead of timing out.
var deadline;
function checkWhenSettled() {
    if (settled() || performance.now() > deadline)
        check();
    else
        setTimeout(checkWhenSettled, 0);
}

window.jsTestIsAsync = true;
addEventListener("load", () => {
    deadline = performance.now() + 3000;
    checkWhenSettled();
});
</script>
</body>
</html>
