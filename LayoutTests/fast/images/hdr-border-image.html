<!DOCTYPE html>
<html>
<meta name="fuzzy" content="maxDifference=0-13; totalPixels=0-40000" />
<style>
    .container {
        width: 200px;
        height: 200px;
        will-change: transform;
    }
    .sdr {
        border-image: url('resources/red-400x400.png') 30 fill;
    }
    .hdr {
        border-image: url('resources/gainmap-red-green-1920x1920.jpg') 30 fill;
    }
</style>
<body>
    <div style="position: fixed; top: 10px; left: 10px;">
        <div class="sdr container">&nbsp;</div>
    </div>
    <div style="position: fixed; top: 10px; left: 220px;">
        <div class="hdr container">&nbsp;</div>
    </div>
    <script>
        if (window.internals && window.testRunner)
            internals.setScreenContentsFormatsForTesting(["RGBA8", "RGBA16F"]);
    </script>
</body>
</html>
