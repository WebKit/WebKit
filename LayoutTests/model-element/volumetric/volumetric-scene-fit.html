<!DOCTYPE html> <!-- webkit-test-runner [ SpatialPortalEnabled=true ModelElementEnabled=true ModelProcessEnabled=true MockVolumetricSceneEnabled=true allowTestOnlyIPC=true ] -->
<meta charset="utf-8">
<title>Auto-fit for a connected volumetric scene</title>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<script src="../resources/model-element-test-utils.js"></script>
<script src="../resources/model-utils.js"></script>
<script src="resources/volumetric-utils.js"></script>
<body>
<script>
'use strict';

internals.disableModelLoadDelaysForTesting();

const fittedCenter = model => model.entityTransform.transformPoint(model.boundingBoxCenter);

const centerTolerance = model => {
    const center = model.boundingBoxCenter;
    return epsilon * Math.max(1, Math.hypot(center.x, center.y, center.z));
};

const fittedScale = model => {
    const m = model.entityTransform;
    return Math.hypot(m.m11, m.m12, m.m13);
};

// mockVolumeSizeInMeters in PortalPresentationManagerProxy.mm
const mockVolumeHeightInMeters = 0.5;
// defaultScaleFactor in ModelProcessModelPlayerProxy.mm
const entityTransformUnitsPerMeter = 0.36;
const volumeFloor = -mockVolumeHeightInMeters / 2 * entityTransformUnitsPerMeter;

const fittedBottom = model => {
    const center = model.boundingBoxCenter;
    const extents = model.boundingBoxExtents;
    let bottom = Infinity;
    for (const x of [-1, 1]) {
        for (const y of [-1, 1]) {
            for (const z of [-1, 1]) {
                const corner = new DOMPointReadOnly(center.x + x * extents.x / 2, center.y + y * extents.y / 2, center.z + z * extents.z / 2);
                bottom = Math.min(bottom, model.entityTransform.transformPoint(corner).y);
            }
        }
    }
    return bottom;
};

const assert_rests_on_volume_floor = (model, description) => {
    const center = fittedCenter(model);
    const tolerance = centerTolerance(model);
    assert_approx_equals(center.x, 0, tolerance, `${description}: content is centered in x`);
    assert_approx_equals(center.z, 0, tolerance, `${description}: content is centered in z`);
    assert_approx_equals(fittedBottom(model), volumeFloor, tolerance, `${description}: content rests on the floor`);
};

const waitForVolumetricFit = (test, model) =>
    test.step_wait(() => Math.abs(fittedCenter(model).z) < centerTolerance(model), 'the volumetric fit is applied');

const presentVolumetrically = async (test, model, rotation) => {
    if (rotation)
        model.entityTransform = rotation;

    await requestVolumetricScene(model);
    await waitForVolumetricFit(test, model);
};

promise_test(async t => {
    const [model] = createModelAndSource(t, "../resources/2x2x2-positive.usdz");
    await model.ready;
    t.add_cleanup(() => model.exitVolumetricScene());

    await presentVolumetrically(t, model);

    assert_rests_on_volume_floor(model, "volumetric fit");
}, `A volumetric scene fits the content resting on the floor of the volume`);

promise_test(async t => {
    const [model] = createModelAndSource(t, "../resources/2x2x2-positive.usdz");
    await model.ready;
    t.add_cleanup(() => model.exitVolumetricScene());

    await presentVolumetrically(t, model, new DOMMatrixReadOnly().rotate(25, 35, 45));

    assert_rests_on_volume_floor(model, "rotated volumetric fit");
}, `A volumetric scene fit rests off-center content on the floor under a rotation`);

promise_test(async t => {
    const [unrotated] = createModelAndSource(t, "../resources/2x2x2-positive.usdz");
    const [rotated] = createModelAndSource(t, "../resources/2x2x2-positive.usdz");
    await unrotated.ready;
    await rotated.ready;
    t.add_cleanup(() => { unrotated.exitVolumetricScene(); rotated.exitVolumetricScene(); });

    await presentVolumetrically(t, unrotated);
    const unrotatedScale = fittedScale(unrotated);

    unrotated.exitVolumetricScene();
    await waitForPresentationMode(t, unrotated, "inline");

    await presentVolumetrically(t, rotated, new DOMMatrixReadOnly().rotate(25, 35, 45));

    assert_approx_equals(fittedScale(rotated), unrotatedScale, epsilon,
        'A rotation does not change how large the content is fitted');
}, `A volumetric scene fit scales the content independently of its rotation`);

promise_test(async t => {
    const [model] = createModelAndSource(t, "../resources/2x2x2-positive.usdz");
    await model.ready;

    const inlineFit = model.entityTransform;
    assert_greater_than(Math.abs(fittedCenter(model).z), centerTolerance(model),
        'The inline fit sits the content behind its layer');

    await presentVolumetrically(t, model);
    assert_3d_matrix_not_equals(model.entityTransform, inlineFit);

    model.exitVolumetricScene();
    await waitForPresentationMode(t, model, "inline");

    await t.step_wait(() => Math.abs(fittedCenter(model).z) > centerTolerance(model),
        'the inline fit is restored');
}, `A volumetric scene fit replaces the inline fit and is restored on exit`);

promise_test(async t => {
    const [model, source] = createModelAndSource(t, "../resources/2x2x2-positive.usdz");
    await model.ready;
    t.add_cleanup(() => model.exitVolumetricScene());

    await presentVolumetrically(t, model);
    const originalScale = fittedScale(model);

    source.src = "../resources/heart.usdz";
    await model.ready;
    await waitForVolumetricFit(t, model);

    assert_greater_than(Math.abs(fittedScale(model) - originalScale), epsilon,
        'The arriving content is fitted to its own size');
    assert_rests_on_volume_floor(model, "re-fitted volumetric content");
}, `A volumetric scene re-fits content that arrives while it is presented`);

</script>
</body>
