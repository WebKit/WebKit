<!DOCTYPE html> <!-- webkit-test-runner [ SpatialPortalEnabled=true ModelElementEnabled=true ModelProcessEnabled=true allowTestOnlyIPC=true ] -->
<meta charset="utf-8">
<title>Connected volumetric scene API surface</title>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<script src="../resources/model-element-test-utils.js"></script>
<script src="resources/volumetric-utils.js"></script>
<style>
    .portal { spatial: portal; width: 300px; height: 150px; }
</style>
<body>
<script>
'use strict';

internals.disableModelLoadDelaysForTesting();

test(() => {
    const div = document.createElement("div");

    assert_true('requestVolumetricScene' in div, 'requestVolumetricScene should exist on Element');
    assert_equals(typeof div.requestVolumetricScene, 'function', 'requestVolumetricScene should be a function');

    assert_true('exitVolumetricScene' in div, 'exitVolumetricScene should exist on Element');
    assert_equals(typeof div.exitVolumetricScene, 'function', 'exitVolumetricScene should be a function');
}, 'The volumetric scene API is exposed on Element');

test(t => {
    const div = document.createElement("div");
    document.body.appendChild(div);
    t.add_cleanup(() => div.remove());

    assert_equals(presentationMode(div), "unavailable", 'An element that cannot host a scene reports no mode');
}, 'A plain element cannot host a volumetric scene');

promise_test(async t => {
    const [model] = createModelAndSource(t, "../resources/cube.usdz");
    await model.ready;

    assert_equals(presentationMode(model), "inline", 'A loaded model reports its inline mode');
}, 'A model element can host a volumetric scene and starts inline');

promise_test(async t => {
    const [model] = createModelAndSource(t, "../resources/cube.usdz");
    await model.ready;

    model.exitVolumetricScene();

    assert_equals(presentationMode(model), "inline", 'Exiting without a scene leaves the mode alone');
}, 'exitVolumetricScene() on an element with no scene is a no-op');

promise_test(async t => {
    const [portal] = await createPortalWithReadyModel(t);

    assert_true(internals.establishesSpatialPortal(portal), 'The element establishes a portal');
    assert_equals(presentationMode(portal), "inline", 'A loaded portal reports its inline mode');
}, 'A spatial portal can host a volumetric scene and starts inline');

promise_test(async t => {
    const [portal] = await createPortalWithReadyModel(t);

    portal.exitVolumetricScene();

    assert_equals(presentationMode(portal), "inline", 'Exiting without a scene leaves the mode alone');
}, 'exitVolumetricScene() on a portal with no scene is a no-op');

// An empty portal has no player, so there is nothing a scene could be opened for.
promise_test(async t => {
    const portal = createPortal(t);

    assert_equals(presentationMode(portal), "unavailable", 'A portal with no loaded model cannot host a scene');

    await promise_rejects_dom(t, "InvalidStateError", requestVolumetricScene(portal),
        'Should reject for a portal with nothing to present');
}, 'A spatial portal with no model cannot host a volumetric scene');
</script>
</body>
