<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sorting a 3D rendering context whose ground plane crosses the camera plane</title>
  <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#3d-rendering-contexts">
  <link rel="match" href="preserve-3d-plane-across-camera-plane-expected.html">
  <style>
    body { margin: 0; background: white; }
    .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 400px;
        height: 400px;
        overflow: hidden;
        perspective: 400px;
        perspective-origin: 50% 50%;
        background: gray;
    }
    .world {
        position: absolute;
        left: 200px;
        top: 200px;
        transform-style: preserve-3d;
    }
    .plane {
        position: absolute;
    }
    #far {
        background: red;
        width: 300px;
        height: 400px;
        margin-left: -150px;
        margin-top: -200px;
        transform: translate3d(-40px, 0, -1000px);
    }
    #near {
        background: blue;
        width: 300px;
        height: 400px;
        margin-left: -150px;
        margin-top: -200px;
        transform: translate3d(40px, 0, -500px);
    }
    #ground {
        background: green;
        width: 4000px;
        height: 3200px;
        margin-left: -2000px;
        margin-top: -1600px;
        transform: translate3d(0, 150px, -400px) rotateX(90deg);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="world">
      <div class="plane" id="ground"></div>
      <div class="plane" id="far"></div>
      <div class="plane" id="near"></div>
    </div>
  </div>
</body>
</html>
