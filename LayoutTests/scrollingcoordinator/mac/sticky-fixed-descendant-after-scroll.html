<!DOCTYPE html> <!-- webkit-test-runner [ ContentInsetBackgroundFillEnabled=false ] -->
<html>
<head>
<style>
    body {
        margin: 0;
        height: 3000px;
    }

    .sticky {
        position: sticky;
        top: 0;
        margin-top: 100px;
        height: 50px;
        background-color: blue;
    }

    /* Positioned against the viewport, but its layer is parented under the sticky element's layer, so its
       layer position must be recomputed every time the sticky offset changes. */
    .fixed {
        position: fixed;
        top: 200px;
        left: 100px;
        width: 100px;
        height: 100px;
        background-color: green;
    }
</style>
<script src="../../resources/ui-helper.js"></script>
<script>
    if (window.testRunner) {
        testRunner.dumpAsText();
        testRunner.waitUntilDone();
    }

    window.addEventListener('load', async () => {
        // The sticky element sticks from 100px on; after that, each scroll only changes its sticky offset.
        // Wheel scrolls of 150px each. Not window.scrollTo(): a programmatic scroll is followed by a full compositing
        // update (see LocalFrameView::shouldUpdateCompositingLayersAfterScrolling()), which would hide a skipped update.
        for (let i = 0; i < 4; ++i)
            await UIHelper.mouseWheelScrollAt(700, 550, 0, -1, 0, -14);

        if (window.internals) {
            document.getElementById('layers').textContent = internals.layerTreeAsText(document);
            document.getElementById('scrolling').textContent = internals.scrollingStateTreeAsText();
        }
        if (window.testRunner)
            testRunner.notifyDone();
    });
</script>
</head>
<body>
    <div class="sticky">
        <div class="fixed"></div>
    </div>
<pre id="layers"></pre>
<pre id="scrolling"></pre>
</body>
</html>
