<!DOCTYPE html>
<html>
<style>
    body { margin: 20px; }
    .card {
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        width: 300px;
        min-height: 80px;
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #86868b;
        border-radius: 12px;
        cursor: pointer;
    }
    .column {
        display: flex;
        flex-direction: column;
    }
    .right {
        text-align: end;
    }
    .icon-wrapper {
        width: 35px;
        height: 35px;
        margin-bottom: 20px;
        cursor: pointer;
    }
    .icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-color: gray;
    }
</style>
<body>
<!-- A role="button" card owns the glow: its nested blocks and text must not get regions of their own. -->
<div class="card clickable" role="button" tabindex="0"><div class="column"><div>Los Angeles</div><div>Dec 5 - 12</div></div><div class="column right"><div>$38</div><div><span>Nonstop</span> &middot; <span>1 hr 33 min</span></div></div></div>
<!-- A role="link" card owns its content the same way. -->
<div class="card clickable" role="link" tabindex="0"><div class="column"><div>Las Vegas</div><div>Dec 5 - 12</div></div><div class="column right"><div>$48</div><div><span>Nonstop</span> &middot; <span>1 hr 39 min</span></div></div></div>
<!-- A link inside the card is a separate target: it keeps its own region. -->
<div class="card clickable" role="button" tabindex="0"><div class="column"><div>San Diego</div><a href="#">Details</a></div></div>
<!-- Content that paints its own box keeps its own region inside a role="button". -->
<div class="icon-wrapper clickable" role="button"><div class="icon"></div></div>

<pre id="results"></pre>
<script>
for (const element of document.querySelectorAll(".clickable"))
    element.addEventListener("click", function() { });

if (window.testRunner)
    testRunner.dumpAsText();

window.onload = function () {
    if (window.internals)
       results.textContent = internals.layerTreeAsText(document, internals.LAYER_TREE_INCLUDES_EVENT_REGION | internals.LAYER_TREE_INCLUDES_ROOT_LAYER_PROPERTIES);
};
</script>
</body>
</html>
