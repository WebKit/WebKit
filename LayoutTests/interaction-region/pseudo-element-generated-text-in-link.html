<!DOCTYPE html>
<html>
<style>
    body { margin: 0; font: 20px/1 Ahem; }
    .chevron::after { content: "X"; }
    .leading-icon::before { content: "X"; }
    .hidden-tooltip::after { content: "XX"; opacity: 0; }
    .hidden-label::before { content: "XX"; opacity: 0; }
</style>
<body>
<!--
    Text generated by ::before or ::after has no node of its own, but it belongs to the link, so the link's region covers it.
    The first link ends with a glyph generated by ::after, and the second one starts with a glyph generated by ::before:
    each gets one region from its text through the generated glyph.
    The third link has no generated content.
    The last two links' generated text is invisible, like a tooltip that fades in on hover, so their regions only cover the
    link's own text, which the invisible ::before still pushes to the right.
-->
<section id="test">
    <div><a class="chevron" href="#">XXXX</a></div>
    <div><a class="leading-icon" href="#">XXXX</a></div>
    <div><a href="#">XXXX</a></div>
    <div><a class="hidden-tooltip" href="#">XXXX</a></div>
    <div><a class="hidden-label" href="#">XXXX</a></div>
</section>

<pre id="results"></pre>
<script>
if (window.testRunner)
    testRunner.dumpAsText();

window.onload = function () {
    if (!window.internals)
        return;

    results.textContent = internals.layerTreeAsText(document, internals.LAYER_TREE_INCLUDES_EVENT_REGION | internals.LAYER_TREE_INCLUDES_ROOT_LAYER_PROPERTIES);
    document.getElementById("test").remove();
};
</script>
</body>
</html>
