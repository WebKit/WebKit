<!DOCTYPE html><!-- webkit-test-runner [ CSSUserSelectEnabled=false ] -->
<html>
<head>
<meta charset="utf-8">
<script src="../../resources/js-test.js"></script>
</head>
<body>

<div id="container">
    <div style="-webkit-user-select: none">webkitNoneHost
        <span style="-webkit-user-select: auto">webkitAutoChild</span>
        <span style="user-select: text">unprefixedTextChild</span>
    </div>
    <div style="user-select: none">unprefixedNoneHost
        <span style="user-select: auto">unprefixedAutoChild</span>
        <span style="-webkit-user-select: text">webkitTextChild</span>
        <span style="-webkit-user-select: text; user-select: none">bothSpellingsChild</span>
    </div>
</div>

<div id="description"></div>
<div id="console"></div>
<script>
description("Verifies that 'user-select' has no effect at all while the feature flag is disabled, leaving '-webkit-user-select' as the only property that decides what is selectable.");

// Captured before anything is logged, because the console output would otherwise contain these
// same tokens and pollute the checks below.
(function() {
    const container = document.getElementById("container");
    const selection = getSelection();
    selection.removeAllRanges();
    selection.selectAllChildren(container);
    window.selectedText = selection.toString();
    selection.removeAllRanges();
    container.remove();
})();

debug("");
debug("Only the prefixed 'none' applies: the unprefixed one is inert, and the prefixed value wins when both are present.");
shouldBeFalse('selectedText.includes("webkitNoneHost")');
shouldBeTrue('selectedText.includes("unprefixedNoneHost")');
shouldBeTrue('selectedText.includes("bothSpellingsChild")');

debug("");
debug("'-webkit-user-select' applies as it always has, and its 'auto' still means 'text'.");
shouldBeTrue('selectedText.includes("webkitTextChild")');
shouldBeTrue('selectedText.includes("webkitAutoChild")');

debug("");
debug("'user-select' cannot override an inherited '-webkit-user-select', and cannot restrict its own descendants either.");
shouldBeFalse('selectedText.includes("unprefixedTextChild")');
shouldBeTrue('selectedText.includes("unprefixedAutoChild")');

</script>
</body>
</html>
