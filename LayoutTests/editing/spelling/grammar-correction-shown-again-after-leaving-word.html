<!DOCTYPE html><!-- webkit-test-runner [ spellCheckingDots=true ] -->
<html lang="en">
<meta charset="UTF-8">
<style>
div[contenteditable] {
    font-family: monospace;
    font-size: 32px;
    width: 100%;
}
</style>
<script src="../../resources/ui-helper.js"></script>
<script src="../../resources/js-test.js"></script>

<script>
jsTestIsAsync = true;

description(`This test verifies that grammar correction UI is shown again when the caret leaves a word
    with a grammar marker and then comes back to it.
    This test requires WebKitTestRunner to run.`);

if (window.internals)
    internals.setContinuousSpellCheckingEnabled(true);

async function runTest()
{
    const editor = document.getElementById("editor");
    const grammarText = "She have a dog";

    await UIHelper.activateElementAndWaitForInputSession(editor);

    document.execCommand("insertText", false, grammarText);
    document.execCommand("insertParagraph");
    await UIHelper.ensurePresentationUpdate();

    const selection = window.getSelection();
    const text = editor.firstChild;
    selection.collapse(text, 0);

    await shouldBecomeEqual('internals.hasGrammarMarker(4, 4)', 'true');

    selection.collapse(text, 12);
    await UIHelper.ensurePresentationUpdate();

    // Enter "have".
    selection.collapse(text, 6);
    await shouldBecomeEqual('internals.isAlternativeTextUIActive()', 'true');

    // Leave it for "dog".
    selection.collapse(text, 12);
    await shouldBecomeEqual('internals.isAlternativeTextUIActive()', 'false');
    await UIHelper.ensurePresentationUpdate();

    // Come back to "have".
    selection.collapse(text, 5);
    await shouldBecomeEqual('internals.isAlternativeTextUIActive()', 'true');

    editor.textContent = "";
    editor.blur();
    finishJSTest();
}
</script>
<body>
<div contenteditable="true" id="editor"></div>
<script>
UIHelper.setSpellCheckerResults({
    "She have a dog" : [
        {
            type: "grammar",
            from: 4,
            to: 8,
            details: [{ from: 0, to: 4, corrections: ["has"] }]
        }
    ],
    "She have a dog\n" : [
        {
            type: "grammar",
            from: 4,
            to: 8,
            details: [{ from: 0, to: 4, corrections: ["has"] }]
        }
    ]
}).then(runTest);
</script>
<pre id="description"></pre>
<pre id="console"></pre>
</body>
</html>
