<!DOCTYPE html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true IgnoreInvalidMessageWhenIPCTestingAPIEnabled=true DigitalCredentialsEnabled=true ] -->
<title>
  ShowDigitalCredentialsChooser rejects a request with no active frame
</title>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<body>
  <script>
    async function runTest() {
      const { CoreIPC, ArgumentSerializer, ArgumentParser } =
        await import("./coreipc.js");

      const messageDefinition =
        CoreIPC.messages["WebPageProxy_ShowDigitalCredentialsChooser"];
      const replyMessage =
        IPC.messages.WebPageProxy_ShowDigitalCredentialsChooserReply;
      assert_true(
        !!messageDefinition && !!replyMessage,
        "ShowDigitalCredentialsChooser message available",
      );

      // frameID = std::nullopt: the UI process cannot resolve a requesting frame, so it must reject.
      const origin = {
        data: {
          variantType: "WebCore::SecurityOriginData::Tuple",
          variant: { protocol: "https", host: "example.test", port: {} },
        },
      };
      const requestData = {
        variantType: "WebCore::DigitalCredentialsMobileDocumentRequestData",
        variant: { topOrigin: origin, documentOrigin: origin, requests: [] },
      };
      const serializedArguments = ArgumentSerializer.serializeArguments(
        messageDefinition.arguments,
        { frameID: {}, requestData },
      );

      const connection = IPC.connectionForProcessTarget("UI");
      let result = null;
      const replyID = connection.sendWithAsyncReply(
        IPC.webPageProxyID,
        messageDefinition.name,
        serializedArguments,
        (reply) => {
          // Reply is Expected<DigitalCredentialsResponseData, ExceptionData>; coreipc.js can't parse it whole, so decode the rejection shape by hand.
          [result] = ArgumentParser.parseReply(reply, [
            { name: "hasValue", type: "bool" },
            { name: "code", type: "uint8_t" },
            { name: "message", type: "String" },
          ]);
        },
      );
      // The high-level CoreIPC wrapper never pumps the reply; force dispatch (timeout in seconds).
      if (!result)
        connection.waitForAsyncReplyAndDispatchImmediately(
          replyID,
          replyMessage.name,
          10,
        );

      assert_not_equals(result, null, "reply received");
      assert_false(result.hasValue, "request was rejected");
      assert_equals(
        result.message,
        "Digital credentials request has no active frame.",
        "rejected as an inactive-frame AbortError",
      );
    }

    // On a build without the IPC testing API (e.g. Release), window.IPC is absent; the test
    // no-ops to a pass, matching LayoutTests/ipc/async-with-reply.html.
    promise_test(async () => {
      if (!window.IPC) return;
      await runTest();
    }, document.title);
  </script>
</body>
