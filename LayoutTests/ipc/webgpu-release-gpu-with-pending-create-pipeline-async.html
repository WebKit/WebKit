<!DOCTYPE html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true ] -->
<body>
<p>This test passes if it does not crash.</p>
<script>
window.testRunner?.dumpAsText();
window.testRunner?.waitUntilDone();

// Releases the GPU while its device's createComputePipelineAsync() calls are still compiling in the GPU process.
// The GPU process should neither crash nor leak the pending replies when the compiles finish.

function shaderCode(index)
{
    // Many functions make the shader slow to compile, so that the compiles are still running when the
    // GPU is released.
    let functions = '';
    let calls = '';
    for (let i = 0; i < 64; ++i) {
        functions += `
            fn f${index}_${i}(x: f32) -> f32 {
                var result = x;
                for (var j = 0; j < 16; j++) {
                    result = sin(result) * cos(result) + f32(j) * ${index}.${i};
                }
                return result;
            }`;
        calls += `
            result = f${index}_${i}(result);`;
    }
    return `
        @group(0) @binding(0) var<storage, read_write> values: array<f32>;
        ${functions}
        @compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id: vec3u) {
            var result = values[id.x];
            ${calls}
            values[id.x] = result;
        }
    `;
}

(async () => {
    if (!window.IPC) {
        window.testRunner?.notifyDone();
        return;
    }

    const TIMEOUT = 1000;
    let nextId = (Math.floor(Math.random() * 100000) + 1) * 100000;
    const freshId = () => ++nextId;

    const M = IPC.messages;
    const MSG_CreateRenderingBackend = M.GPUConnectionToWebProcess_CreateRenderingBackend.name;
    const MSG_CreateGPU = M.GPUConnectionToWebProcess_CreateGPU.name;
    const MSG_WasCreated = M.RemoteGPUProxy_WasCreated.name;
    const MSG_RequestAdapter = M.RemoteGPU_RequestAdapter.name;
    const MSG_IsValid = M.RemoteGPU_IsValid.name;
    const MSG_RequestDevice = M.RemoteAdapter_RequestDevice.name;
    const MSG_CreateShaderModule = M.RemoteDevice_CreateShaderModule.name;
    const MSG_CreatePipelineLayout = M.RemoteDevice_CreatePipelineLayout.name;
    const MSG_CreateComputePipelineAsync = M.RemoteDevice_CreateComputePipelineAsync.name;
    const MSG_ReleaseGPU = M.GPUConnectionToWebProcess_ReleaseGPU.name;

    const [rbSC, rbHandle] = IPC.createStreamClientConnection(14, TIMEOUT);
    rbSC.open();
    const backendID = freshId();
    IPC.sendMessage("GPU", 0, MSG_CreateRenderingBackend,
        [{ type: "uint64_t", value: backendID }, { type: "StreamServerConnectionHandle", value: rbHandle }]);

    async function iteration(pipelineCount)
    {
        const [gpuSC, gpuHandle] = IPC.createStreamClientConnection(18, TIMEOUT);
        gpuSC.open();
        const gpuID = freshId();
        IPC.sendMessage("GPU", 0, MSG_CreateGPU,
            [{ type: "uint64_t", value: gpuID }, { type: "uint64_t", value: backendID }, { type: "StreamServerConnectionHandle", value: gpuHandle }]);
        const wasCreated = gpuSC.waitForMessage(gpuID, MSG_WasCreated);
        if (!wasCreated || !wasCreated[0].value)
            return false;

        const adapterID = freshId();
        gpuSC.sendSyncMessage(gpuID, MSG_RequestAdapter,
            [{ type: "bool", value: 0 }, { type: "bool", value: 0 }, { type: "bool", value: 0 }, { type: "uint64_t", value: adapterID }]);
        const deviceID = freshId(), queueID = freshId();
        gpuSC.sendSyncMessage(adapterID, MSG_RequestDevice,
            [{ type: "String", value: "" }, { type: "Vector", value: [] }, { type: "Vector", value: [] },
             { type: "uint64_t", value: deviceID }, { type: "uint64_t", value: queueID }]);

        for (let i = 0; i < pipelineCount; ++i) {
            // Each shader is different, so that each pipeline is compiled.
            const moduleID = freshId(), layoutID = freshId();
            gpuSC.sendMessage(deviceID, MSG_CreateShaderModule,
                [{ type: "String", value: "" }, { type: "String", value: shaderCode(i) }, { type: "Vector", value: [] }, { type: "uint64_t", value: moduleID }]);
            // An 'auto' layout.
            gpuSC.sendMessage(deviceID, MSG_CreatePipelineLayout,
                [{ type: "String", value: "" }, { type: "bool", value: 0 }, { type: "uint64_t", value: layoutID }]);
            gpuSC.sendWithAsyncReply(deviceID, MSG_CreateComputePipelineAsync,
                [{ type: "String", value: "" }, { type: "bool", value: 0 }, { type: "uint64_t", value: layoutID },
                 { type: "uint64_t", value: moduleID }, { type: "String", value: "main" }, { type: "Vector", value: [] },
                 { type: "uint64_t", value: freshId() }], () => { });
        }
        // The GPU process handles the messages in order, so once this returns, it has started all the compiles.
        gpuSC.sendSyncMessage(gpuID, MSG_IsValid, [{ type: "uint64_t", value: deviceID }]);

        IPC.sendMessage("GPU", 0, MSG_ReleaseGPU, [{ type: "uint64_t", value: gpuID }]);
        gpuSC.invalidate();
        return true;
    }

    for (let i = 0; i < 5; ++i) {
        if (!await iteration(50))
            break;
    }
    // Let the compiles of the released GPUs finish.
    await new Promise(resolve => setTimeout(resolve, 2000));
    window.testRunner?.notifyDone();
})();
</script>
</body>
