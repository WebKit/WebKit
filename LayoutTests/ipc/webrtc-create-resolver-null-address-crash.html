<!DOCTYPE html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true PeerConnectionEnabled=true ] -->
<script>
window.testRunner?.dumpAsText();
window.testRunner?.waitUntilDone();

// The IPC testing API is only compiled into debug and ASan builds, so the messages below are best
// effort: what fails this test is the Networking process crashing, not the text dumped here.
if (!window.IPC)
    window.testRunner?.notifyDone();
else {
    let done = false;
    const finish = () => {
        if (done)
            return;
        done = true;
        window.testRunner?.notifyDone();
    };

    import('./coreipc.js').then(({ CoreIPC }) => {
        // CreateRTCProvider has an empty async reply, so waiting for it guarantees the
        // NetworkRTCProvider message receiver is registered before CreateResolver is sent.
        CoreIPC.Networking.NetworkConnectionToWebProcess.CreateRTCProvider(0, {}, () => {
            // A null String is a legal IPC payload. NetworkRTCProvider::createResolver passes the
            // address to NetworkMDNSRegister::hasRegisteredName(), which used to look it up in a
            // HashSet<String>; StringHash::hash() dereferences the null StringImpl.
            CoreIPC.Networking.NetworkRTCProvider.CreateResolver(0, { identifier: 393216, address: null });
            CoreIPC.Networking.NetworkRTCProvider.CreateResolver(0, { identifier: 393217, address: '' });

            // createResolver hops from the RTC network thread to the Networking process main run
            // loop, so ping a message handled on that run loop to give the hop a chance to run
            // before the test ends. 'A' is not a valid IPv4 address, so this fails fast without
            // registering anything.
            CoreIPC.Networking.NetworkMDNSRegister.RegisterMDNSName(0, {
                documentIdentifier: { object: { high: 1, low: 1 }, processIdentifier: 1 },
                ipAddress: 'A'
            }, finish);
        });

        setTimeout(finish, 2000);
    }).catch(finish);
}
</script>
<body>
<p>This test passes if the Networking process does not crash when CreateResolver is sent a null address.</p>
</body>
