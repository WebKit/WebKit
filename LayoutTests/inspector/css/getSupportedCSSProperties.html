<html>
<head>
<script src="../../http/tests/inspector/resources/protocol-test.js"></script>
<script>
// Keep the expected output independent of each port's experimental feature defaults.
window.internals.settings.setSpringTimingFunctionEnabled(false);

function test()
{
    InspectorProtocol.sendCommand("CSS.getSupportedCSSProperties", {}, (messageObject) => {
        if ("error" in messageObject) {
            ProtocolTest.log(messageObject.error.message);
            ProtocolTest.completeTest();
            return;
        }

        let result = messageObject["result"];
        let entries = result["cssProperties"];

        const expectedProperties = [
            "background-color",
            "background-image",
            "background-repeat",
            "box-sizing",
            "clip-path",
            "display",
            "filter",
            "font-style",
            "margin",
            "text-transform",
            "transition-timing-function",
        ];

        for (let expectedProperty of expectedProperties) {
            for (let entry of entries) {
                if (entry.name !== expectedProperty)
                    continue;

                ProtocolTest.log(`"${expectedProperty}" is supported`);

                if (entry.aliases) {
                    ProtocolTest.log(`"${expectedProperty}" has aliases:`);
                    for (let alias of entry.aliases)
                        ProtocolTest.log(` - "${alias}"`);
                }

                if (entry.longhands) {
                    ProtocolTest.log(`"${expectedProperty}" has longhands:`);
                    for (let longhand of entry.longhands)
                        ProtocolTest.log(` - "${longhand}"`);
                }

                if (entry.inherited)
                    ProtocolTest.log(`"${expectedProperty}" is inherited`);

                if (entry.isColorAware)
                    ProtocolTest.log(`"${expectedProperty}" is color-aware`);

                if (entry.isEasingAware)
                    ProtocolTest.log(`"${expectedProperty}" is easing-aware`);

                if (entry.values) {
                    ProtocolTest.log(`"${expectedProperty}" has values:`);
                    for (let value of entry.values)
                        ProtocolTest.log(` - "${value}"`);
                }

                break;
            }

            ProtocolTest.log("");
        }

        let colors = result["colors"];
        ProtocolTest.log(`"colors" is ${colors ? "present" : "absent"}`);
        if (colors) {
            for (let expectedColor of ["red", "currentcolor", "transparent", "rgb()", "color-mix()"])
                ProtocolTest.log(` - includes "${expectedColor}": ${colors.includes(expectedColor)}`);
        }

        ProtocolTest.completeTest();
    });
}
</script>
</head>
<body onLoad="runTest()">
</body>
</html>
