<!DOCTYPE html>
<html>
<head>
<script src="../../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="../resources/log-pause-location.js"></script>
<script src="resources/source-map-stepping-statement.js"></script>
<script>
function test()
{
    let suite = InspectorTest.createAsyncSuite("Debugger.SourceMapStepping.Statement");

    const sourceMappingURL = "source-map-stepping-statement.js.map";

    async function awaitSourceMap() {
        for (let sourceMap of WI.SourceMap.instances) {
            if (sourceMap.sourceMappingURL.endsWith(sourceMappingURL))
                return sourceMap;
        }
        while (true) {
            let {data} = await WI.SourceCode.awaitEvent(WI.SourceCode.Event.SourceMapAdded);
            if (data.sourceMap.sourceMappingURL.endsWith(sourceMappingURL))
                return data.sourceMap;
        }
    }

    // Two original statements on one line (`a(); b();`) only surface separately when the mapped
    // location is snapped to its original statement (not its original line), so parse the
    // boundaries up front to make the granularity deterministic instead of racing the lazy parse
    // the first step would otherwise trigger.
    async function awaitStatementBoundaries(sourceMap) {
        for (let resource of sourceMap.resources)
            resource.updateStatementBoundaryPositionsIfNeeded();
        await Promise.all(sourceMap.resources.map((resource) => new Promise((resolve) => {
            (function poll() {
                if (resource.statementBoundaryPositions?.length)
                    resolve();
                else
                    setTimeout(poll, 0);
            })();
        })));
    }

    let currentStepType = null;

    WI.debuggerManager.addEventListener(WI.DebuggerManager.Event.CallFramesDidChange, (event) => {
        if (!WI.debuggerManager.activeCallFrame)
            return;
        logPauseLocation();
        step(currentStepType);
    });

    function addTestCase({name, description, expression}) {
        suite.addTestCase({
            name, description,
            async test() {
                WI.settings.experimentalSourceMapStepping.value = true;
                currentStepType = "next";

                let resumed = WI.debuggerManager.awaitEvent(WI.DebuggerManager.Event.Resumed);
                InspectorTest.evaluateInPage(expression);
                await resumed;
                InspectorTest.log("RESUMED");

                WI.settings.experimentalSourceMapStepping.value = false;
            }
        });
    }

    // `a(); b();` are two original statements sharing one original line. Stepping must surface
    // each (statement granularity), not merge them as it would with line granularity.
    addTestCase({
        name: "Debugger.SourceMapStepping.Statement.TwoStatementsOneLine",
        description: "Two original statements on one line surface as two separate pauses.",
        expression: "setTimeout(twoStatementsOneLine)",
    });

    // `a() + b();` is a single original statement whose sub-expressions share one original line,
    // so its generated sub-expression pauses coalesce into one pause.
    addTestCase({
        name: "Debugger.SourceMapStepping.Statement.OneStatementOneLine",
        description: "Sub-expressions of a single original statement on one line coalesce into one pause.",
        expression: "setTimeout(oneStatementOneLine)",
    });

    awaitSourceMap().then(async (sourceMap) => {
        await awaitStatementBoundaries(sourceMap);
        suite.runTestCasesAndFinish();
    }).catch((error) => {
        InspectorTest.fail("Failed to load source map: " + error);
        InspectorTest.completeTest();
    });
}
</script>
</head>
<body onload="runTest()">
<p>Checking that debugger stepping distinguishes original statements from original lines when following source maps.</p>
</body>
</html>
