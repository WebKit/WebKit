// This comments prevents the inlined source map from being in the results.
function driver() { entry(); afterEntry(); }
function afterEntry() { }

<script>
function test()
{
    let suite = InspectorTest.createAsyncSuite("Debugger.Stepping.InlineScript.SourceMap");

    window.initializeSteppingTestSuite(suite);

    addSteppingTestCase({
        name: "Debugger.Stepping.InlineScript.SourceMap.OverIntoOut",
        description: "Stepping through a source-mapped inline <script> displays the correct original location, and stepping out to the document is not mis-mapped.",
        expression: "setTimeout(driver)",
        steps: ["over", "in", "out", "out", "resume"],
    });

    function entryScriptLoaded() {
        return WI.SourceMap.instances.some((sourceMap) => {
            let sourceCode = sourceMap.originalSourceCode;
            return sourceCode instanceof WI.Script && sourceCode.sourceURL === "inline-source-map-entry.js";
        });
    }

    async function runWhenReady() {
        for (let i = 0; i < 500; ++i) {
            if (entryScriptLoaded())
                break;
            await Promise.delay(10);
        }
        await loadMainPageContent();
        suite.runTestCasesAndFinish();
    }
    runWhenReady();
}
</script>
</head>
<body onload="runTest()">
<p>Tests that stepping through a source-mapped inline script displays the correct original location and that stepping out to a document location is not incorrectly mapped through the source map.</p>
