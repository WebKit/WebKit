<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script>
function test()
{
    let suite = InspectorTest.createAsyncSuite("Debugger.PauseCancelledWhenDebuggerIsDisabled");

    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    suite.addTestCase({
        name: "Debugger.PauseCancelledWhenDebuggerIsDisabled.Disable",
        description: "A pause requested for the next statement should be cancelled when the Debugger domain is disabled, so it does not stop the page after the domain is enabled again, and the domain should pause when asked to again.",
        async test() {
            let target = InspectorTest.mainFrameTarget;
            let paused = false;
            WI.debuggerManager.addEventListener(WI.DebuggerManager.Event.Paused, () => { paused = true; });

            await target.DebuggerAgent.pause();
            await target.DebuggerAgent.disable();
            await target.DebuggerAgent.enable();
            await target.DebuggerAgent.setBreakpointsActive(true);

            InspectorTest.evaluateInPage("window.timerRan = false; setTimeout(() => { window.timerRan = true; })");
            for (let i = 0; i < 100 && !paused; ++i) {
                if (await InspectorTest.evaluateInPage("window.timerRan"))
                    break;
                await sleep(20);
            }
            InspectorTest.expectFalse(paused, "The page should not pause.");
            InspectorTest.expectThat(await InspectorTest.evaluateInPage("window.timerRan"), "The timer callback should run.");

            let pausedPromise = WI.debuggerManager.awaitEvent(WI.DebuggerManager.Event.Paused);
            await target.DebuggerAgent.pause();
            InspectorTest.evaluateInPage("setTimeout(() => { 1 + 1 })");
            let result = await Promise.race([pausedPromise.then(() => "paused"), sleep(2000).then(() => "timed out")]);
            InspectorTest.expectEqual(result, "paused", "The page should pause when asked to again.");

            if (result === "paused")
                await WI.debuggerManager.resume();
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Tests that a pause requested for the next statement is cancelled when the Debugger domain is disabled.</p>
</body>
</html>
