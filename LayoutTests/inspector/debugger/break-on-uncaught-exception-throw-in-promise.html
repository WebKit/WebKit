<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/break-on-exception-tests.js"></script>
<script>
TestPage.allowUncaughtExceptions = true;

function test()
{
    // Pause on uncaught exception behavior in Promises is likely to change. This tests our
    // current behavior of not pausing for uncaught exception when the Promise swallows
    // the exception. See these bugs:
    // FIXME: <https://webkit.org/b/124066> Uncaught exceptions raised in promise completion functions are not printed to console

    WI.debuggerManager.uncaughtExceptionsBreakpoint.disabled = false;

    let suite = InspectorTest.createAsyncSuite("BreakOnUncaughtException.Promise");

    function addTestCase({name, description, expression, expectedPauseLocation}) {
        suite.addTestCase({
            name, description,
            test(resolve, reject) {
                let pauseCount = 0;
                let listener = WI.debuggerManager.addEventListener(WI.DebuggerManager.Event.Paused, (event) => {
                    ++pauseCount;
                    if (expectedPauseLocation) {
                        let callFrame = WI.debuggerManager.activeCallFrame;
                        let targetData = WI.debuggerManager.dataForTarget(callFrame.target);
                        InspectorTest.expectThat(targetData.pauseReason === "exception", "Should pause for exception.");
                        let location = callFrame.sourceCodeLocation;
                        InspectorTest.expectEqual(`${callFrame.functionName}:${location.lineNumber + 1}:${location.columnNumber + 1}`, expectedPauseLocation, "Should pause at the original throw location.");
                    } else
                        InspectorTest.fail("Should not have paused.");
                    WI.debuggerManager.resume();
                });

                InspectorTest.singleFireEventListener("AfterTestFunction", (event) => {
                    InspectorTest.expectEqual(pauseCount, expectedPauseLocation ? 1 : 0, expectedPauseLocation ? "Should pause once." : "Should not pause, exception is 'caught' by Promise.");
                    WI.debuggerManager.removeEventListener(WI.DebuggerManager.Event.Paused, listener);
                    resolve();
                });

                InspectorTest.evaluateInPage(expression);
                InspectorTest.evaluateInPage(`setTimeout(() => { TestPage.dispatchEventToFrontend("AfterTestFunction"); }, 50)`);
            }
        });
    }

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseConstructor",
        description: "Break on an exception thrown in Promise constructor.",
        expression: "setTimeout(testThrowingInPromise)",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseThenWithoutCatch",
        description: "Break on an exception thrown in Promise then handler with no catch handler.",
        expression: "setTimeout(testThrowingInPromiseThen)",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseThenWithCatch",
        description: "Break on an exception thrown in Promise then handler with a catch handler.",
        expression: "setTimeout(testThrowingInPromiseThenWithCatch)",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseThenWithRejectHandler",
        description: "Do not break when a subsequent then handler catches the rejection.",
        expression: "setTimeout(() => Promise.resolve().then(doThrow).then(undefined, () => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseThenWithOwnRejectHandler",
        description: "Break when the throwing then handler has its own rejection callback but no subsequent rejection handler.",
        expression: "setTimeout(() => Promise.resolve().then(doThrow, () => {}))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseThenWithTryCatch",
        description: "Do not break when a then handler catches its exception with try/catch.",
        expression: "setTimeout(() => Promise.resolve().then(testCatch))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseCatch",
        description: "Break on an exception thrown in Promise catch with no then handler.",
        expression: "setTimeout(testThrowingInPromiseWithCatch)",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ExceptionInPromiseThenAndRethrownInCatch",
        description: "Break on an exception thrown in Promise then handler, and then again when rethrown in catch handler.",
        expression: "setTimeout(testThrowingInPromiseWithRethrowInCatch)",
        expectedPauseLocation: "promiseCatch:86:16",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ChainWithoutCatch",
        description: "Follow fulfillment-only handlers to an unhandled rejection.",
        expression: "setTimeout(() => Promise.resolve().then(doThrow).then(() => {}).then(() => {}))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.ChainWithCatch",
        description: "Do not pause when a later catch handles the rejection.",
        expression: "setTimeout(() => Promise.resolve().then(doThrow).then(() => {}).then(() => {}).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.EmptyThenWithoutCatch",
        description: "Follow rejection forwarding through empty then calls.",
        expression: "setTimeout(() => Promise.resolve().then(doThrow).then().then())",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.BranchesWithUnhandledPath",
        description: "Pause if one branch is unhandled even when another branch catches the rejection.",
        expression: `setTimeout(() => {
            let promise = Promise.resolve().then(doThrow);
            promise.catch(() => {});
            promise.then(() => {});
        })`,
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.BranchesWithCatch",
        description: "Do not pause when all branches handle the rejection.",
        expression: `setTimeout(() => {
            let promise = Promise.resolve().then(doThrow);
            promise.then(() => {}).catch(() => {});
            promise.then(() => {}, () => {});
        })`,
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.FinallyWithoutCatch",
        expression: "setTimeout(() => Promise.resolve().then(doThrow).finally(() => {}))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.FinallyWithCatch",
        expression: "setTimeout(() => Promise.resolve().then(doThrow).finally(() => {}).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.FinallyCallbackWithoutCatch",
        expression: "setTimeout(() => Promise.resolve().finally(doThrow))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.FinallyCallbackWithCatch",
        expression: "setTimeout(() => Promise.resolve().finally(doThrow).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.FinallyAwaitWithoutCatch",
        expression: "setTimeout(() => Promise.resolve().finally(() => Promise.resolve().then(doThrow)))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.FinallyAwaitWithCatch",
        expression: "setTimeout(() => Promise.resolve().finally(() => Promise.resolve().then(doThrow)).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AllWithoutCatch",
        expression: "setTimeout(() => Promise.all([Promise.resolve().then(doThrow), Promise.resolve()]))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AllWithCatch",
        expression: "setTimeout(() => Promise.all([Promise.resolve().then(doThrow), Promise.resolve()]).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AllSettled",
        expression: "setTimeout(() => Promise.allSettled([Promise.resolve().then(doThrow)]))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.Any",
        expression: "setTimeout(() => Promise.any([Promise.resolve().then(doThrow), Promise.resolve()]))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AsyncAllWithoutCatch",
        expression: `setTimeout(() => Promise.all([(async function() {
            await 0;
            doThrow();
        })()]))`,
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AsyncAllWithCatch",
        expression: `setTimeout(() => Promise.all([(async function() {
            await 0;
            doThrow();
        })()]).catch(() => {}))`,
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.RaceWithoutCatch",
        expression: "setTimeout(() => Promise.race([Promise.resolve().then(doThrow), new Promise(() => {})]))",
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.RaceWithCatch",
        expression: "setTimeout(() => Promise.race([Promise.resolve().then(doThrow), new Promise(() => {})]).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.RaceBranchWithoutCatch",
        expression: `setTimeout(() => {
            let promise = Promise.resolve().then(doThrow);
            promise.catch(() => {});
            Promise.race([promise, new Promise(() => {})]);
        })`,
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.RaceBranchWithCatch",
        expression: `setTimeout(() => {
            let promise = Promise.resolve().then(doThrow);
            promise.catch(() => {});
            Promise.race([promise, new Promise(() => {})]).catch(() => {});
        })`,
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.RaceAlreadyFulfilled",
        expression: "setTimeout(() => Promise.race([Promise.resolve(), Promise.resolve().then(() => {}).then(doThrow)]))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.RaceAlreadyRejected",
        expression: "setTimeout(() => Promise.race([Promise.reject('first'), Promise.resolve().then(() => {}).then(doThrow)]).catch(() => {}))",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AsyncRaceWithoutCatch",
        expression: `setTimeout(() => Promise.race([(async function() {
            await 0;
            doThrow();
        })(), new Promise(() => {})]))`,
        expectedPauseLocation: "doThrow:8:22",
    });

    addTestCase({
        name: "BreakOnUncaughtException.Promise.AsyncRaceWithCatch",
        expression: `setTimeout(() => Promise.race([(async function() {
            await 0;
            doThrow();
        })(), new Promise(() => {})]).catch(() => {}))`,
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Checking no pauses within Promises when pausing on uncaught exceptions.</p>
</body>
</html>
