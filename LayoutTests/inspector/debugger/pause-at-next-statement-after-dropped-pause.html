<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/protocol-test.js"></script>
<script>
function createPageFunction()
{
    eval("window.pageFunction = function pageFunction() {\n    return 1;\n};\n//# sourceURL=PageFunction.js");
}

function test()
{
    let suite = ProtocolTest.createAsyncSuite("Debugger.PauseAtNextStatement.AfterDroppedPause");

    const blackboxedURL = "BlackboxedScript.js";

    suite.addTestCase({
        name: "Debugger.PauseAtNextStatement.AfterDroppedPause.BreakpointAfterBlackboxedScript",
        description: "Debugger.pause should pause after the debugger dropped a pending pause at a breakpoint that does not pause after a blackboxed script.",
        async test() {
            await InspectorProtocol.awaitCommand({method: "Debugger.enable", params: {}});
            await InspectorProtocol.awaitCommand({method: "Debugger.setBreakpointsActive", params: {active: true}});
            await InspectorProtocol.awaitCommand({method: "Debugger.setShouldBlackboxURL", params: {url: blackboxedURL, shouldBlackbox: true}});
            await InspectorProtocol.awaitCommand({method: "Debugger.setBreakpointByUrl", params: {url: "PageFunction.js", lineNumber: 1, options: {condition: "false"}}});
            await ProtocolTest.evaluateInPage("createPageFunction()");

            let pauseReasons = [];
            InspectorProtocol.eventHandler["Debugger.paused"] = (messageObject) => {
                pauseReasons.push(messageObject.params.reason);
                InspectorProtocol.sendCommand("Debugger.resume", {});
            };

            // Logging evaluates code in the page, which would take a pending pause.
            await InspectorProtocol.awaitCommand({method: "Debugger.pause", params: {}});
            await ProtocolTest.evaluateInPage(`pageFunction();\n//# sourceURL=${blackboxedURL}`);
            ProtocolTest.expectEqual(pauseReasons.length, 0, "Should not pause at the breakpoint with a false condition after the blackboxed script.");

            await InspectorProtocol.awaitCommand({method: "Debugger.pause", params: {}});
            await ProtocolTest.evaluateInPage("pageFunction()");
            ProtocolTest.expectEqual(pauseReasons.join(), "PauseOnNextStatement", "Should pause when asked to again.");
        },
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Tests that pausing at the next statement works after the debugger dropped a pending pause.</p>
</body>
</html>
