<!DOCTYPE html><!-- webkit-test-runner [ jscOptions=--alwaysUseSharedArrayBuffer=true ] -->
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script>
let blockedWorker = null;
let blockedWorkerState = null;

function createBlockedWorker() {
    blockedWorker = new Worker("resources/timeline-worker.js");
    blockedWorkerState = new Int32Array(new SharedArrayBuffer(4));
    blockedWorker.addEventListener("message", (event) => {
        if (event.data === "blocked")
            TestPage.dispatchEventToFrontend("WorkerBlocked");
    });
}

// The Worker handles no inspector messages until `releaseWorker()`.
function blockWorker() {
    Atomics.store(blockedWorkerState, 0, 0);
    blockedWorker.postMessage({block: blockedWorkerState.buffer});
}

function releaseWorker() {
    Atomics.store(blockedWorkerState, 0, 1);
    Atomics.notify(blockedWorkerState, 0);
}

function test()
{
    const domains = ["Timeline", "ScriptProfiler"];
    const CapturingState = WI.TimelineManager.CapturingState;

    let workerTarget = null;

    // Record, in order, every report from a target that one of its domains started or stopped tracking.
    let events = [];
    let eventListeners = [];
    for (let functionName of ["capturingStarted", "capturingStopped"]) {
        let original = WI.timelineManager[functionName];
        WI.timelineManager[functionName] = function(target, domain, ...rest) {
            events.push({functionName, target, domain});
            let result = original.call(this, target, domain, ...rest);

            for (let listener of eventListeners.slice()) {
                if (listener.functionName === functionName && listener.target === target && listener.domain === domain && !--listener.count) {
                    eventListeners.remove(listener);
                    listener.resolve();
                }
            }
            return result;
        };
    }

    function awaitTrackingEvent(functionName, target, domain, count = 1) {
        return new Promise((resolve) => {
            eventListeners.push({functionName, target, domain, count, resolve});
        });
    }

    function awaitCapturingState(capturingState) {
        return new Promise((resolve) => {
            let listener = WI.timelineManager.addEventListener(WI.TimelineManager.Event.CapturingStateChanged, (event) => {
                if (WI.timelineManager.capturingState !== capturingState)
                    return;

                WI.timelineManager.removeEventListener(WI.TimelineManager.Event.CapturingStateChanged, listener);
                resolve();
            });
        });
    }

    // Starts capturing with a new recording. Resolves once capturing is active and, unless the Worker is blocked, the
    // Worker started.
    async function startCapturing(workerIsBlocked) {
        events = [];

        let workerStartedPromises = workerIsBlocked ? [] : domains.map((domain) => awaitTrackingEvent("capturingStarted", workerTarget, domain));
        let activePromise = awaitCapturingState(CapturingState.Active);
        const newRecording = true;
        WI.timelineManager.startCapturing(newRecording);
        await activePromise;
        await Promise.all(workerStartedPromises);
    }

    async function stopCapturing() {
        let inactivePromise = awaitCapturingState(CapturingState.Inactive);
        WI.timelineManager.stopCapturing();
        await inactivePromise;
    }

    // Starts tracking a domain of a target like an instrument does. The tests start Heap and Animation tracking this
    // way because a capture reuses an empty recording, with its instruments, even after the enabled instruments change.
    async function startTracking(target, domain) {
        let startedPromise = awaitTrackingEvent("capturingStarted", target, domain);
        WI.timelineManager.willStartTrackingForTarget(target, domain);
        target[`${domain}Agent`].startTracking();
        await startedPromise;
    }

    // Resolves once a Heap snapshot of the Worker is recorded in the active recording.
    function awaitWorkerHeapRecord() {
        let heapAllocationsTimeline = WI.timelineManager.activeRecording.timelines.get(WI.TimelineRecord.Type.HeapAllocations);
        return new Promise((resolve) => {
            let listener = heapAllocationsTimeline.addEventListener(WI.Timeline.Event.RecordAdded, (event) => {
                if (event.data.record.heapSnapshot.target !== workerTarget)
                    return;

                heapAllocationsTimeline.removeEventListener(WI.Timeline.Event.RecordAdded, listener);
                resolve();
            });
        });
    }

    async function blockWorker() {
        let blockedPromise = InspectorTest.awaitEvent("WorkerBlocked");
        await InspectorTest.evaluateInPage(`blockWorker()`);
        await blockedPromise;
    }

    function releaseWorker() {
        return InspectorTest.evaluateInPage(`releaseWorker()`);
    }

    function expectBreakpointsDisabled(disabled, message) {
        InspectorTest.expectEqual(WI.debuggerManager.breakpointsDisabledTemporarily, disabled, message);
    }

    // Stops capturing, waits until every target except the blocked Worker has reported that it stopped, and then stops
    // waiting for the Worker.
    async function stopCapturingAndStopWaiting() {
        let stoppedPromises = [];
        for (let {functionName, target, domain} of events) {
            if (functionName === "capturingStarted" && target !== workerTarget && !target.isDestroyed)
                stoppedPromises.push(awaitTrackingEvent("capturingStopped", target, domain));
        }
        WI.timelineManager.stopCapturing();
        await Promise.all(stoppedPromises);
        InspectorTest.expectEqual(WI.timelineManager.capturingState, CapturingState.Stopping, "Capturing should still be stopping while the blocked Worker has not reported that it stopped.");

        WI.timelineManager.stopWaitingForTargets();
        InspectorTest.expectEqual(WI.timelineManager.capturingState, CapturingState.Inactive, "Capturing should be inactive after the user stops waiting.");
        expectBreakpointsDisabled(false, "Breakpoints should no longer be disabled temporarily.");
    }

    let suite = InspectorTest.createAsyncSuite("Timeline.StopWaiting.LateEvents");

    suite.addTestCase({
        name: "Timeline.StopWaiting.LateEvents.Setup",
        async test() {
            let workerTargetPromise = new Promise((resolve) => {
                let listener = WI.targetManager.addEventListener(WI.TargetManager.Event.TargetAdded, (event) => {
                    let {target} = event.data;
                    if (target.type !== WI.TargetType.Worker)
                        return;

                    WI.targetManager.removeEventListener(WI.TargetManager.Event.TargetAdded, listener);
                    resolve(target);
                });
            });
            await InspectorTest.evaluateInPage(`createBlockedWorker()`);
            workerTarget = await workerTargetPromise;
            InspectorTest.pass("Added a Worker target.");
        },
    });

    suite.addTestCase({
        name: "Timeline.StopWaiting.LateEvents.Heap",
        description: "Check that the Heap snapshot and garbage collections of a capture that the user stopped waiting for are dropped.",
        async test() {
            // Count the snapshots of the Worker that are parsed.
            let workerSnapshotCount = 0;
            let originalCreateSnapshot = WI.HeapSnapshotWorkerProxy.prototype.createSnapshot;
            WI.HeapSnapshotWorkerProxy.prototype.createSnapshot = function(targetId, snapshotStringData, callback) {
                if (targetId === workerTarget.identifier)
                    ++workerSnapshotCount;
                return originalCreateSnapshot.call(this, targetId, snapshotStringData, callback);
            };

            try {
                // Track the Worker's Heap only. Snapshots of the page are slow.
                await startCapturing();
                let heapRecordPromise = awaitWorkerHeapRecord();
                await startTracking(workerTarget, "Heap");
                await heapRecordPromise;
                await blockWorker();
                await stopCapturingAndStopWaiting();

                // The Worker still owes the Heap stop of the first capture, so a garbage collection from it is dropped.
                await startCapturing(true);
                WI.heapManager.garbageCollected(workerTarget, {startTime: 0, endTime: 1});
                let scriptTimeline = WI.timelineManager.activeRecording.timelines.get(WI.TimelineRecord.Type.Script);
                let garbageCollectedRecords = scriptTimeline.records.filter((record) => record.target === workerTarget && record.eventType === WI.ScriptTimelineRecord.EventType.GarbageCollected);
                InspectorTest.expectEqual(garbageCollectedRecords.length, 0, "A garbage collection of the first capture should not be added to the new capture.");

                // The Worker reports the stops of the first capture, then the starts of the new one.
                let snapshotCountBeforeRelease = workerSnapshotCount;
                let heapStoppedPromise = awaitTrackingEvent("capturingStopped", workerTarget, "Heap");
                let startedPromises = domains.map((domain) => awaitTrackingEvent("capturingStarted", workerTarget, domain));
                await releaseWorker();
                await heapStoppedPromise;
                await Promise.all(startedPromises);
                InspectorTest.expectEqual(workerSnapshotCount - snapshotCountBeforeRelease, 0, "The Heap snapshot of the first capture should not be parsed.");

                // A snapshot of the new capture is still recorded.
                heapRecordPromise = awaitWorkerHeapRecord();
                await startTracking(workerTarget, "Heap");
                await heapRecordPromise;
                InspectorTest.pass("Recorded a Heap snapshot from the Worker in the new capture.");

                await stopCapturing();
                InspectorTest.pass("The new capture stopped after the Worker stopped.");
            } finally {
                WI.HeapSnapshotWorkerProxy.prototype.createSnapshot = originalCreateSnapshot;
            }
        },
    });

    suite.addTestCase({
        name: "Timeline.StopWaiting.LateEvents.Animation",
        description: "Check that an Animation update of a capture that the user stopped waiting for is dropped.",
        async test() {
            let mainTarget = WI.assumingMainTarget();

            await startCapturing();
            await startTracking(mainTarget, "Animation");

            // Stop waiting before the main target reports that it stopped, so that its Animation domain also
            // belongs to the abandoned capture.
            WI.timelineManager.stopCapturing();
            WI.timelineManager.stopWaitingForTargets();
            InspectorTest.expectEqual(WI.timelineManager.capturingState, CapturingState.Inactive, "Capturing should be inactive after the user stops waiting.");

            // The late stops of the abandoned capture are still on their way.
            let activePromise = awaitCapturingState(CapturingState.Active);
            const newRecording = true;
            WI.timelineManager.startCapturing(newRecording);

            WI.timelineManager.animationTrackingUpdated(mainTarget, 0, {
                trackingAnimationId: "abandoned-capture-animation",
                animationName: "abandoned-capture-animation",
                animationState: InspectorBackend.Enum.Animation.AnimationState.Active,
            });
            let mediaTimeline = WI.timelineManager.activeRecording.timelines.get(WI.TimelineRecord.Type.Media);
            InspectorTest.expectThat(!mediaTimeline.recordForTrackingAnimationId("abandoned-capture-animation"), "The Animation update of the abandoned capture should not be added.");

            await activePromise;
            await stopCapturing();
            InspectorTest.pass("The new capture stopped.");
            expectBreakpointsDisabled(false, "Breakpoints should no longer be disabled temporarily.");
        },
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Tests that the late Heap and Animation events of a target that the user stopped waiting for are dropped.</p>
</body>
</html>
