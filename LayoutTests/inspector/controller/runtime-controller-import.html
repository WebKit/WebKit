<!doctype html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script>

function pauseForAwaitContext() {
    debugger;
}

function test()
{
    let suite = InspectorTest.createAsyncSuite("RuntimeManager");
    let lastImportCompleted = Promise.withResolvers();
    let lastImportLogged = false;
    let importListener = WI.consoleManager.addEventListener(WI.ConsoleManager.Event.MessageAdded, (event) => {
        if (event.data.message.messageText.includes("Cappuccino is Awesome."))
            lastImportLogged = true;
        else if (lastImportLogged && event.data.message.messageText === "%o") {
            WI.consoleManager.removeEventListener(WI.ConsoleManager.Event.MessageAdded, importListener);
            lastImportCompleted.resolve();
        }
    });

    suite.addTestCase({
        name: "RuntimeManager.prototype.evaluateInInspectedWindow.ImportFromConsole",
        description: "Test evaluating an import expression from console.",
        test(resolve, reject) {
            function testSource(expression, count) {
                return new Promise((resolve, reject) => {
                    WI.runtimeManager.evaluateInInspectedWindow(expression, {objectGroup: "test"}, (result, wasThrown) => {
                        InspectorTest.log("Source: " + expression);
                        InspectorTest.expectThat(result.isUndefined(), "Transformed. Should log the value or an exception.");
                        resolve();
                    });
                })
            }

            testSource("await import('')", 0)
            .then(() => {
                return testSource("await import('./not-found.js')");
            })
            .then(() => {
                return testSource("await import('./resources/cocoa.js').then((cocoa) => { console.log(`${cocoa.name} is ${cocoa.taste}.`); })");
            })
            .then(() => {
                return testSource("await import('./resources/drink.js').then((ns) => { console.log(`${ns.Cocoa.name} is ${ns.Cocoa.taste}. ${ns.Cappuccino.name} is ${ns.Cappuccino.taste}.`); })");
            })
            .then(resolve);
        }
    });

    suite.addTestCase({
        name: "RuntimeManager.AwaitCallFrameScope",
        description: "Await evaluation preserves this and arguments from a selected call frame.",
        async test() {
            await lastImportCompleted.promise;
            let previousCallFrameUsage = WI.runtimeManager.useActiveCallFrame;
            WI.runtimeManager.useActiveCallFrame = true;
            try {
                let paused = WI.debuggerManager.awaitEvent(WI.DebuggerManager.Event.Paused);
                InspectorTest.evaluateInPage("setTimeout(() => pauseForAwaitContext.call({value: 24}, 25))");
                await paused;
                let messages = WI.consoleManager.awaitEvent(WI.ConsoleManager.Event.MessageAdded);
                let result = await new Promise((resolve) => {
                    WI.runtimeManager.evaluateInInspectedWindow("await Promise.resolve(this.value + arguments[0])", {objectGroup: "test"}, resolve);
                });
                InspectorTest.expectTrue(result.isUndefined(), "Await evaluation should use the convenience.");
                await WI.debuggerManager.resume();
                let {data: {message}} = await messages;
                InspectorTest.expectEqual(message.parameters[1].value, 49, "Await evaluation should preserve the selected call frame values.");
            } finally {
                if (WI.debuggerManager.paused)
                    await WI.debuggerManager.resume();
                WI.runtimeManager.useActiveCallFrame = previousCallFrameUsage;
            }
        },
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Tests for RuntimeManager operations.</p>
</body>
</html>
