<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script>
function test()
{
    let suite = InspectorTest.createSyncSuite("Cookie");

    suite.addTestCase({
        name: "WI.Cookie.parseCookieRequestHeader",
        description: "Cookie request header.",
        test() {
            function test(header, expectedCookies) {
                InspectorTest.log(`HEADER: Cookie: ${header}`);
                let cookies = WI.Cookie.parseCookieRequestHeader(header);
                InspectorTest.expectEqual(cookies.length, expectedCookies.length, `Should have ${expectedCookies.length} cookies.`);
                for (let i = 0; i < cookies.length; ++i) {
                    let cookie = cookies[i];
                    let expected = expectedCookies[i];
                    InspectorTest.expectThat(cookie instanceof WI.Cookie, `Value should be a WI.Cookie.`);
                    InspectorTest.expectEqual(cookie.type, WI.Cookie.Type.Request, `cookie.type should be WI.Cookie.Type.Request.`);
                    InspectorTest.expectEqual(cookie.name, expected.name, `cookie.name should be '${expected.name}'.`);
                    InspectorTest.expectEqual(cookie.value, expected.value, `cookie.value should be '${expected.value}'.`);
                }
                InspectorTest.log("");
            }

            test("", []);

            test(`foo=bar`, [
                {name: "foo", value: "bar"},
            ]);

            test(`foo=bar; alpha=beta`, [
                {name: "foo", value: "bar"},
                {name: "alpha", value: "beta"},
            ]);

            test(`foo=a,b,c, d, e, f,g; alpha=123423 qwerty; beta=gamma`, [
                {name: "foo", value: "a,b,c, d, e, f,g"},
                {name: "alpha", value: "123423 qwerty"},
                {name: "beta", value: "gamma"},
            ]);

            return true;
        }
    });

    suite.addTestCase({
        name: "WI.Cookie.parseSetCookieResponseHeader",
        description: "Set-Cookie response headers.",
        test() {
            function test(header, expected) {
                InspectorTest.log(`HEADER: Set-Cookie: ${header}`);
                let cookie = WI.Cookie.parseSetCookieResponseHeader(header);
                InspectorTest.expectThat(cookie instanceof WI.Cookie, `Value should be a WI.Cookie.`);
                InspectorTest.expectEqual(cookie.header, header, `cookie.header should be the original header text.`);
                InspectorTest.expectEqual(cookie.type, WI.Cookie.Type.Response, `cookie.type should be WI.Cookie.Type.Response.`);
                InspectorTest.expectEqual(cookie.name, expected.name, `cookie.name should be '${expected.name}'.`);
                InspectorTest.expectEqual(cookie.value, expected.value, `cookie.value should be '${expected.value}'.`);
                if (cookie.expires && expected.expires)
                    InspectorTest.expectEqual(cookie.expires.getTime(), expected.expires.getTime(), `cookie.expires should be ${expected.expires.getTime()}.`);
                else
                    InspectorTest.expectEqual(cookie.expires, expected.expires, `cookie.expires should be '${expected.expires}'.`);
                InspectorTest.expectEqual(cookie.maxAge, expected.maxAge, `cookie.maxAge should be '${expected.maxAge}'.`);
                InspectorTest.expectEqual(cookie.path, expected.path, `cookie.path should be '${expected.path}'.`);
                InspectorTest.expectEqual(cookie.domain, expected.domain, `cookie.domain should be '${expected.domain}'.`);
                InspectorTest.expectEqual(cookie.secure, expected.secure, `cookie.secure should be '${expected.secure}'.`);
                InspectorTest.expectEqual(cookie.httpOnly, expected.httpOnly, `cookie.httpOnly should be '${expected.httpOnly}'.`);
                InspectorTest.expectEqual(cookie.sameSite, expected.sameSite, `cookie.sameSite should be '${expected.sameSite}'.`);
                InspectorTest.log("");
            }

            InspectorTest.expectNull(WI.Cookie.parseSetCookieResponseHeader(""), "Empty header should produce null.");

            test(`name=value`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; path=/foo`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: "/foo",
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; domain=example.com`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: "example.com",
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; secure`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: true,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; Secure`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: true,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; HttpOnly`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: false,
                httpOnly: true,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; SameSite=lax`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.Lax,
            });

            test(`name=value; SameSite=strict`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.Strict,
            });

            // SameSite with unknown value is ignored.
            test(`name=value; SameSite=invalid`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            // SameSite without value is ignored.
            test(`name=value; SameSite`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: null,
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; expires=Fri 06-Oct-2017 03:20:27 GMT; Max-Age=3600`, {
                name: "name",
                value: "value",
                expires: new Date("Fri 06-Oct-2017 03:20:27 GMT"),
                maxAge: 3600,
                path: null,
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; expires=Fri 06-Oct-2017 03:43:47 GMT; Max-Age=5000; path=/foo; domain=example.com; secure; HttpOnly`, {
                name: "name",
                value: "value",
                expires: new Date("Fri 06-Oct-2017 03:43:47 GMT"),
                maxAge: 5000,
                path: "/foo",
                domain: "example.com",
                secure: true,
                httpOnly: true,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; Unknown; path=/one/two`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: "/one/two",
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=value; Unknown=Ignored; path=/one/two`, {
                name: "name",
                value: "value",
                expires: null,
                maxAge: null,
                path: "/one/two",
                domain: null,
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            test(`name=somewhat longer value than normal with spaces, and commas; domain=other.example.com`, {
                name: "name",
                value: "somewhat longer value than normal with spaces, and commas",
                expires: null,
                maxAge: null,
                path: null,
                domain: "other.example.com",
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            // Some servers omit the required space after the semicolon.
            test(`name==value=;Domain=.example.com;Expires=Wed, 04-Apr-2018 03:34:02 GMT`, {
                name: "name",
                value: "=value=",
                expires: new Date("Wed, 04-Apr-2018 03:34:02 GMT"),
                maxAge: null,
                path: null,
                domain: ".example.com",
                secure: false,
                httpOnly: false,
                sameSite: WI.Cookie.SameSiteType.None,
            });

            return true;
        }
    });

    suite.addTestCase({
        name: "WI.Cookie.session",
        description: "Cookie session property.",
        test() {
            let sessionCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value`);
            InspectorTest.expectThat(sessionCookie.session, `A cookie without Expires or Max-Age should be a session cookie.`);
            InspectorTest.expectNull(sessionCookie.expirationDate(new Date(0)), `Session cookie expirationDate should be null.`);

            let expiresCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; expires=Fri 06-Oct-2017 03:20:27 GMT`);
            InspectorTest.expectFalse(expiresCookie.session, `A cookie with Expires should be persistent.`);

            let maxAgeCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; Max-Age=3600`);
            InspectorTest.expectFalse(maxAgeCookie.session, `A cookie with Max-Age should be persistent.`);
            InspectorTest.expectEqual(maxAgeCookie.expirationDate(new Date(0)).getTime(), 1000 * 60 * 60, `Max-Age cookie expirationDate should be requestSentDate + Max-Age.`);

            let zeroMaxAgeCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; Max-Age=0`);
            InspectorTest.expectFalse(zeroMaxAgeCookie.session, `A cookie with Max-Age=0 should be persistent.`);
            InspectorTest.expectEqual(zeroMaxAgeCookie.maxAge, 0, `cookie.maxAge should be 0 for Max-Age=0.`);
            InspectorTest.expectEqual(zeroMaxAgeCookie.expirationDate(new Date(1000)).getTime(), 0, `Max-Age=0 cookie expirationDate should be the epoch.`);

            let negativeMaxAgeCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; Max-Age=-1`);
            InspectorTest.expectFalse(negativeMaxAgeCookie.session, `A cookie with a negative Max-Age should be persistent.`);
            InspectorTest.expectEqual(negativeMaxAgeCookie.maxAge, -1, `cookie.maxAge should be -1 for Max-Age=-1.`);
            InspectorTest.expectEqual(negativeMaxAgeCookie.expirationDate(new Date(1000)).getTime(), 0, `Max-Age=-1 cookie expirationDate should be the epoch.`);

            let hugeNegativeMaxAgeCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; Max-Age=-100000000000`);
            InspectorTest.expectFalse(hugeNegativeMaxAgeCookie.session, `A cookie with a huge negative Max-Age should be persistent.`);
            InspectorTest.expectEqual(hugeNegativeMaxAgeCookie.expirationDate(new Date(1000)).getTime(), 0, `A huge negative Max-Age should have the epoch as its expiration date.`);

            let hugeMaxAgeCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; Max-Age=99999999999999999999`);
            InspectorTest.expectFalse(hugeMaxAgeCookie.session, `A cookie with a huge Max-Age should be persistent.`);
            InspectorTest.expectNull(hugeMaxAgeCookie.expirationDate(new Date(0)), `A cookie whose Max-Age is beyond the date range should have no expiration date.`);

            let pastYear9999Cookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; Max-Age=253402300800`);
            InspectorTest.expectFalse(pastYear9999Cookie.session, `A cookie with a Max-Age past year 9999 should be persistent.`);
            InspectorTest.expectEqual(pastYear9999Cookie.expirationDate(new Date(0)).getTime(), 253402300800 * 1000, `A Max-Age past year 9999 should not change its expiration date.`);

            // Max-Age takes precedence over Expires.
            let expiresAndMaxAgeCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; expires=Fri 06-Oct-2017 03:20:27 GMT; Max-Age=0`);
            InspectorTest.expectThat(expiresAndMaxAgeCookie.expires instanceof Date, `A cookie with both attributes should still have its Expires date.`);
            InspectorTest.expectEqual(expiresAndMaxAgeCookie.expirationDate(new Date(1000)).getTime(), 0, `Max-Age should take precedence over Expires for the expiration date.`);

            return true;
        }
    });

    suite.addTestCase({
        name: "WI.HARBuilder.date",
        description: "HAR dates should be ISO 8601 with a 4-digit year.",
        test() {
            InspectorTest.expectEqual(WI.HARBuilder.date(null), "", `A missing date should be an empty string.`);
            InspectorTest.expectEqual(WI.HARBuilder.date(new Date(NaN)), "", `An invalid date should be an empty string.`);
            InspectorTest.expectEqual(WI.HARBuilder.date(new Date(1000)), "1970-01-01T00:00:01.000Z", `A date should be an ISO 8601 string.`);
            InspectorTest.expectEqual(WI.HARBuilder.date(new Date(-1000)), "1970-01-01T00:00:00.000Z", `A date before 1970 should clamp to the epoch.`);
            InspectorTest.expectEqual(WI.HARBuilder.date(new Date(Date.UTC(9999, 11, 31, 23, 59, 59, 999))), "9999-12-31T23:59:59.999Z", `The end of year 9999 should not be clamped.`);
            InspectorTest.expectEqual(WI.HARBuilder.date(new Date(253402300800 * 1000)), "9999-12-31T23:59:59.999Z", `A date past year 9999 should clamp to the end of year 9999.`);
            return true;
        }
    });

    suite.addTestCase({
        name: "WI.Cookie.url",
        description: "Cookie url property.",
        test() {
            let cookieWithDomain = WI.Cookie.parseSetCookieResponseHeader(`name=value; domain=example.com`);
            InspectorTest.expectEqual(cookieWithDomain.url, "http://example.com", "Cookie url should include domain.");

            let cookieWithDomainAndPath = WI.Cookie.parseSetCookieResponseHeader(`name=value; domain=example.com; path=/foo`);
            InspectorTest.expectEqual(cookieWithDomainAndPath.url, "http://example.com/foo", "Cookie url should include domain and path.");

            let secureCookie = WI.Cookie.parseSetCookieResponseHeader(`name=value; domain=example.com; secure`);
            InspectorTest.expectEqual(secureCookie.url, "https://example.com", "Secure cookie url should begin with 'https'.");

            return true;
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Testing WI.Cookie.</p>
</body>
</html>
