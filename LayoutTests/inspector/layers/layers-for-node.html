<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/layer-utilities.js"></script>
<script>

function addCompositedLayer()
{
    let element = document.createElement("div");
    element.className = "composited";
    element.id = "last-element";
    document.body.appendChild(element);

    // Force layout, then wait a frame, so the new layer has reached the layer tree before the
    // frontend asks for it again.
    document.body.offsetWidth;

    requestAnimationFrame(() => {
        setTimeout(() => {
            TestPage.dispatchEventToFrontend("TestPageDidAddLayer");
        }, 0);
    });
};

function test()
{
    // Some layer sizes follow the window size, which differs per port. Every layer this test
    // cares about is 100px or smaller, so report anything larger as just its type.
    function describeRect(rect)
    {
        let width = rect.width > 100 ? typeof rect.width : rect.width;
        let height = rect.height > 100 ? typeof rect.height : rect.height;
        return `(${rect.x}, ${rect.y}) ${width} x ${height}`;
    }

    function dumpLayers(layers)
    {
        InspectorTest.log(`Layer count: ${layers.length}`);

        for (let layer of layers) {
            InspectorTest.assert(typeof layer.layerId === "string", "Layer should have a layer id.");
            InspectorTest.assert(typeof layer.nodeId === "number", "Layer should have a node id.");
            InspectorTest.assert(typeof layer.memory === "number", "Layer should have a memory size.");
            InspectorTest.assert(typeof layer.paintCount === "number", "Layer should have a paint count.");

            // `WI.Layer` offsets `compositedBounds` into the layer's global position, so it is
            // reported here relative to the page rather than to the layer as the protocol sends it.
            InspectorTest.log(`    bounds ${describeRect(layer.bounds)}, composited bounds ${describeRect(layer.compositedBounds)}`);
        }
    }

    let suite = InspectorTest.createAsyncSuite("LayerTree.layersForNode");

    suite.addTestCase({
        name: "LayerTree.layersForNode",
        description: "Adding a composited element should add a layer that names the new element.",
        async test() {
            let {documentNode, layers: initialLayers} = await getDocumentAndLayers();

            InspectorTest.log("Initial layer tree:");
            dumpLayers(initialLayers);

            InspectorTest.newline();
            InspectorTest.log("Adding a composited element...");

            let didAddLayer = InspectorTest.awaitEvent("TestPageDidAddLayer");
            await InspectorTest.evaluateInPage(`addCompositedLayer()`);
            await didAddLayer;

            let modifiedLayers = await getLayersForNode(documentNode);

            InspectorTest.newline();
            InspectorTest.log("Modified layer tree:");
            dumpLayers(modifiedLayers);
            InspectorTest.newline();

            let {additions} = WI.layerTreeManager.layerTreeMutations(initialLayers, modifiedLayers);
            InspectorTest.expectEqual(additions.length, 1, "Should have exactly one new layer.");

            let node = await getNodeForSelector(documentNode, "#last-element");
            InspectorTest.expectNotNull(node, "Should have a node for #last-element.");
            InspectorTest.expectEqual(additions[0].nodeId, node.id, "The new layer should be generated by #last-element.");
            InspectorTest.expectEqual(node.getAttribute("id"), "last-element", "The new layer's node should have the id \"last-element\".");
        },
    });

    suite.runTestCasesAndFinish();
};

</script>
<style type="text/css">

    div {
        position: absolute;
        top: 0;
        left: 0;
    }

    .regular {
        width: 100px;
        height: 100px;
        background-color: black;
    }

    .composited {
        top: 25px;
        left: 25px;
        width: 50px;
        height: 50px;
        background-color: blue;
        -webkit-transform: translateZ(0);
    }

    .offset {
        left: 200px;
        -webkit-transform: translateZ(0);
    }

</style>
</head>
<body onload="runTest()">

    <div class="regular"></div>

    <div class="composited">
        <div class="composited"></div>
    </div>

    <div class="regular offset">
        <div class="composited"></div>
    </div>

</body>
</html>
