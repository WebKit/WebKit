<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/layer-utilities.js"></script>
<script>

function test()
{
    let suite = InspectorTest.createAsyncSuite("LayerTree.layersForNode.GeneratedContentLayers");

    suite.addTestCase({
        name: "LayerTree.layersForNode.GeneratedContentLayers",
        description: "Layers for generated content should share their generating element's node id but have distinct pseudo-element ids.",
        async test() {
            let {documentNode, layers} = await getDocumentAndLayers();

            let beforeLayers = [];
            let afterLayers = [];
            for (let layer of layers) {
                if (!layer.isGeneratedContent)
                    continue;
                if (layer.pseudoElement === "before")
                    beforeLayers.push(layer);
                else if (layer.pseudoElement === "after")
                    afterLayers.push(layer);
            }

            InspectorTest.expectEqual(beforeLayers.length, 1, "Should have exactly one ::before layer.");
            InspectorTest.expectNotEqual(beforeLayers[0].pseudoElementId, "", "The ::before layer should have a pseudo-element id.");

            // The second ::after layer is the reflection of the first, generated by `-webkit-box-reflect`.
            InspectorTest.expectEqual(afterLayers.length, 2, "Should have exactly two ::after layers.");
            InspectorTest.expectNotEqual(afterLayers[0].pseudoElementId, "", "The first ::after layer should have a pseudo-element id.");
            InspectorTest.expectNotEqual(afterLayers[1].pseudoElementId, "", "The second ::after layer should have a pseudo-element id.");
            InspectorTest.expectTrue(afterLayers[1].isReflection, "The second ::after layer should be a reflection.");
            InspectorTest.expectEqual(afterLayers[0].nodeId, afterLayers[1].nodeId, "Both ::after layers should have the same node id.");
            InspectorTest.expectEqual(afterLayers[0].pseudoElementId, afterLayers[1].pseudoElementId, "Both ::after layers should have the same pseudo-element id.");

            InspectorTest.expectEqual(beforeLayers[0].nodeId, afterLayers[0].nodeId, "The ::before and ::after layers should have the same node id.");
            InspectorTest.expectNotEqual(beforeLayers[0].pseudoElementId, afterLayers[0].pseudoElementId, "The ::before and ::after layers should have different pseudo-element ids.");

            let node = await getNodeForSelector(documentNode, "#generator");
            InspectorTest.expectNotNull(node, "Should have a node for #generator.");
            InspectorTest.expectEqual(beforeLayers[0].nodeId, node.id, "The generated content should be generated by #generator.");
            InspectorTest.expectEqual(node.localName(), "div", "The generating node should be a <div>.");
            InspectorTest.expectEqual(node.getAttribute("id"), "generator", "The generating node should have the id \"generator\".");
        },
    });

    suite.runTestCasesAndFinish();
};

</script>
<style type="text/css">

    #generator::before,
    #generator::after {
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: black;
        -webkit-transform: translateZ(0);
        content: "";
    }

    #generator::after {
        -webkit-box-reflect:below 1px -webkit-gradient(linear, left top, left bottom, from(transparent), color-stop(0.5, transparent), to(white));
    }

</style>
</head>
<body onload="runTest()">

    <div id="generator"></div>

</body>
</html>
