<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/layer-utilities.js"></script>
<script>

function test()
{
    let suite = InspectorTest.createAsyncSuite("LayerTree.reasonsForCompositingLayer");

    suite.addTestCase({
        name: "LayerTree.reasonsForCompositingLayer",
        description: "Each composited element should report the reasons it was given its own layer.",
        async test() {
            let {documentNode, layers} = await getDocumentAndLayers();

            async function reasonsForElement(selector) {
                let node = await getNodeForSelector(documentNode, selector);
                InspectorTest.expectNotNull(node, `Should have a node for ${selector}.`);

                let layer = layers.find((existingLayer) => existingLayer.nodeId === node.id);
                InspectorTest.expectNotNull(layer, `Should have a layer for ${selector}.`);
                if (!layer)
                    return {};

                return await getReasonsForCompositingLayer(layer);
            }

            let opacityContainerReasons = await reasonsForElement("#opacity-container");
            InspectorTest.expectTrue(opacityContainerReasons.opacityWithCompositedDescendants, "#opacity-container should be composited due to having an opacity style and a composited child.");

            let childReasons = await reasonsForElement("#child");
            InspectorTest.expectTrue(childReasons.transform3D, "#child should be composited due to having a 3D transform.");
            InspectorTest.expectTrue(childReasons.backfaceVisibilityHidden, "#child should be composited due to having \"backface-visibility: hidden\".");

            let canvasReasons = await reasonsForElement("#canvas");
            InspectorTest.expectTrue(canvasReasons.transform3D, "#canvas should be composited due to having a 3D transform.");
        },
    });

    suite.runTestCasesAndFinish();
};

</script>
<style type="text/css">

    #opacity-container {
        opacity: 0.5;
    }

    #child {
        -webkit-backface-visibility: hidden;
        -webkit-transform: translateZ(0);
    }

    #canvas {
        transform: translate3D(0,0,0);
    }

</style>
</head>
<body onload="runTest()">

    <div id="fixed"></div>

    <div id="opacity-container">
        <div id="child"></div>
    </div>

    <canvas id="canvas" width="65537" height="65537"></canvas>

</body>
</html>
