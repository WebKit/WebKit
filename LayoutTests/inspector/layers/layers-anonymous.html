<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/layer-utilities.js"></script>
<script>

function test()
{
    let suite = InspectorTest.createAsyncSuite("LayerTree.layersForNode.AnonymousLayers");

    suite.addTestCase({
        name: "LayerTree.layersForNode.AnonymousLayers",
        description: "An anonymous layer should name the pseudo-element it paints and the element that generates it.",
        async test() {
            let {documentNode, layers} = await getDocumentAndLayers();

            let anonymousLayers = layers.filter((layer) => layer.isAnonymous);
            InspectorTest.expectEqual(anonymousLayers.length, 1, "Should have exactly one anonymous layer.");

            let layer = anonymousLayers[0];
            InspectorTest.expectNotEqual(layer.nodeId, 0, "The anonymous layer should have a non-zero node id.");
            InspectorTest.expectEqual(layer.pseudoElement, "first-letter", "The anonymous layer should be for a ::first-letter pseudo-element.");

            let node = await getNodeForSelector(documentNode, "#first-letter");
            InspectorTest.expectNotNull(node, "Should have a node for #first-letter.");
            InspectorTest.expectEqual(layer.nodeId, node.id, "The anonymous layer should be generated by #first-letter.");
            InspectorTest.expectEqual(node.localName(), "p", "The generating node should be a <p>.");
            InspectorTest.expectEqual(node.getAttribute("id"), "first-letter", "The generating node should have the id \"first-letter\".");
        },
    });

    suite.runTestCasesAndFinish();
};

</script>
<style type="text/css">

    #first-letter::first-letter {
        float: left;
        -webkit-transform: translateZ(0);
    }

</style>
</head>
<body onload="runTest()">

    <p id="first-letter">This is a test</p>

</body>
</html>
