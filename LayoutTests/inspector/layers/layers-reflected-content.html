<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/layer-utilities.js"></script>
<script>

function test()
{
    let suite = InspectorTest.createAsyncSuite("LayerTree.layersForNode.ReflectedContentLayers");

    suite.addTestCase({
        name: "LayerTree.layersForNode.ReflectedContentLayers",
        description: "A reflection layer should name the element being reflected.",
        async test() {
            let {documentNode, layers} = await getDocumentAndLayers();

            // Only the composited reflection gets its own layer; the non-composited one does not.
            let reflectedLayers = layers.filter((layer) => layer.isReflection);
            InspectorTest.expectEqual(reflectedLayers.length, 1, "Should have exactly one reflection layer.");

            let layer = reflectedLayers[0];
            InspectorTest.expectGreaterThan(layer.nodeId, 0, "The reflection layer should have a node id.");

            let node = await getNodeForSelector(documentNode, ".reflected.composited");
            InspectorTest.expectNotNull(node, "Should have a node for .reflected.composited.");
            InspectorTest.expectEqual(layer.nodeId, node.id, "The reflection layer should be generated by .reflected.composited.");
            InspectorTest.expectEqual(node.localName(), "div", "The reflected node should be a <div>.");
            InspectorTest.expectEqual(node.attributes().length, 1, "The reflected node should have exactly one attribute.");
            InspectorTest.expectEqual(node.getAttribute("class"), "reflected composited", "The reflected node should have the class \"reflected composited\".");
        },
    });

    suite.runTestCasesAndFinish();
};

</script>
<style type="text/css">

    .reflected {
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: black;
        -webkit-box-reflect: below;
    }

    .composited {
        -webkit-transform: translateZ(0);
    }

</style>
</head>
<body onload="runTest()">

    <div class="reflected"></div>
    <div class="reflected composited"></div>

</body>
</html>
