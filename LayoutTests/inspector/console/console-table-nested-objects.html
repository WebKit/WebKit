<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/protocol-test.js"></script>
<script>
function test()
{
    let suite = ProtocolTest.createAsyncSuite("Console.table.NestedObjects");

    async function logTable(expression) {
        let [messageAddedEvent] = await Promise.all([
            InspectorProtocol.awaitEvent({event: "Console.messageAdded"}),
            InspectorProtocol.awaitCommand({method: "Runtime.evaluate", params: {expression}}),
        ]);
        let message = messageAddedEvent.params.message;
        ProtocolTest.expectEqual(message.type, "table", `Should add a table message for '${expression}'.`);
        return message.parameters[0].preview;
    }

    function cellsOfFirstRow(tablePreview) {
        let row = tablePreview.properties[0];
        ProtocolTest.expectThat(row.valuePreview, "Row 0 should have a preview.");
        let cells = {};
        for (let cell of row.valuePreview.properties)
            cells[cell.name] = cell;
        return cells;
    }

    suite.addTestCase({
        name: "Console.table.RowWithElement",
        description: "A row that holds a DOM element should show the element without previewing its properties.",
        async test() {
            let preview = await logTable(`console.table([{name: "a", element: document.createElement("div")}])`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(cells.name.value, "a", "Cell 'name' should be 'a'.");
            ProtocolTest.expectEqual(cells.element.subtype, "node", "Cell 'element' should be a node.");
            ProtocolTest.expectEqual(cells.element.value, "<div>", "Cell 'element' should be described as '<div>'.");
            ProtocolTest.expectFalse("valuePreview" in cells.element, "Cell 'element' should not have a preview.");
        }
    });

    suite.addTestCase({
        name: "Console.table.RowWithBody",
        description: "A row that holds an element in the document should show the element.",
        async test() {
            let preview = await logTable(`console.table([{body: document.body}])`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(cells.body.value, "<body>", "Cell 'body' should be described as '<body>'.");
        }
    });

    suite.addTestCase({
        name: "Console.table.DocumentFragment",
        description: "A table of the properties of a DocumentFragment should be logged.",
        async test() {
            let preview = await logTable(`console.table(new Range().extractContents())`);
            ProtocolTest.expectGreaterThan(preview.properties.length, 0, "Table should have rows.");
            let ownerDocumentRow = preview.properties.find((property) => property.name === "ownerDocument");
            ProtocolTest.expectThat(ownerDocumentRow?.valuePreview, "Row 'ownerDocument' should have a preview.");
        }
    });

    suite.addTestCase({
        name: "Console.table.CyclicRow",
        description: "A row that refers back to itself through a cell should be logged.",
        async test() {
            let preview = await logTable(`(function() { let a = {name: "a"}; a.wrapper = {a}; console.table([a]); })()`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(cells.wrapper.value, "Object", "Cell 'wrapper' should be described as 'Object'.");
            ProtocolTest.expectFalse("valuePreview" in cells.wrapper, "Cell 'wrapper' should not have a preview.");
        }
    });

    suite.addTestCase({
        name: "Console.table.CellPreviews",
        description: "Cells that hold simple objects should keep a preview.",
        async test() {
            let preview = await logTable(`console.table([{point: {x: 1, y: 2}, list: [1, 2], big: {a: 1, b: 2, c: 3, d: 4}}])`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(cells.point.valuePreview?.properties.map((property) => `${property.name}: ${property.value}`).join(", "), "x: 1, y: 2", "Cell 'point' should have a preview with 'x' and 'y'.");
            ProtocolTest.expectEqual(cells.list.valuePreview?.properties.length, 2, "Cell 'list' should have a preview with 2 items.");
            ProtocolTest.expectEqual(cells.big.value, "Object", "Cell 'big' should be described as 'Object'.");
        }
    });

    suite.addTestCase({
        name: "Console.table.WideRow",
        description: "A row should show more than the 5 properties of a normal preview.",
        async test() {
            let preview = await logTable(`console.table([{c1: 1, c2: 2, c3: 3, c4: 4, c5: 5, c6: 6, c7: 7, c8: 8}])`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(Object.keys(cells).length, 8, "Row should have 8 cells.");
        }
    });

    suite.addTestCase({
        name: "Console.table.WideRowWithoutColumns",
        description: "Without given columns, a row should stop at the 15 properties that the table shows.",
        async test() {
            let preview = await logTable(`console.table([Object.fromEntries(Array.from({length: 20}, (_, i) => ["c" + i, i]))])`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(Object.keys(cells).length, 15, "Row should have 15 cells.");
        }
    });

    suite.addTestCase({
        name: "Console.table.WideRowWithColumns",
        description: "With given columns, a row should keep properties after the first 15.",
        async test() {
            let preview = await logTable(`console.table([Object.fromEntries(Array.from({length: 20}, (_, i) => ["c" + i, i]))], ["c19"])`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(cells.c19?.value, "19", "Cell 'c19' should be '19'.");
        }
    });

    suite.addTestCase({
        name: "Console.table.ElementRows",
        description: "A row that is an element should stop at 15 properties, so not every native getter runs.",
        async test() {
            let preview = await logTable(`console.table([document.createElement("a"), document.createElement("a")])`);
            ProtocolTest.expectEqual(preview.properties.length, 2, "Table should have 2 rows.");
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(Object.keys(cells).length, 15, "Row 0 should have 15 cells.");
        }
    });

    suite.addTestCase({
        name: "Console.table.ElementRowsWithColumns",
        description: "With given columns, an element row should include a column that comes late in its properties.",
        async test() {
            let preview = await logTable(`(function() { let div = document.createElement("div"); div.id = "row"; console.table([div], ["id"]); })()`);
            let cells = cellsOfFirstRow(preview);
            ProtocolTest.expectEqual(cells.id?.value, "row", "Cell 'id' should be 'row'.");
        }
    });

    suite.addTestCase({
        name: "Console.table.ManyRows",
        description: "A table should show more than the 10 items of a normal preview.",
        async test() {
            let preview = await logTable(`console.table(Array.from({length: 20}, (_, i) => ({i, element: document.body})))`);
            ProtocolTest.expectEqual(preview.properties.length, 20, "Table should have 20 rows.");
        }
    });

    ProtocolTest.log("Enabling Console domain...");
    InspectorProtocol.sendCommand("Console.enable", {}, () => {
        suite.runTestCasesAndFinish();
    });
}
</script>
</head>
<body onload="runTest()">
<p>Tests that console.table() previews its rows in full, and the objects in its cells like a normal preview.</p>
</body>
</html>
