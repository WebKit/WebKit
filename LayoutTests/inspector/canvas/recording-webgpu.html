<!-- webkit-test-runner [ WebGPUEnabled=true ] -->
<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/recording-utilities.js"></script>
<script>
let device = null;
let context = null;

async function render(clearValue) {
    let commandEncoder = device.createCommandEncoder();
    let renderPassEncoder = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue,
            loadOp: "clear",
            storeOp: "store",
        }],
    });
    renderPassEncoder.setViewport(0, 0, 4, 4, 0, 1);
    renderPassEncoder.end();
    device.queue.submit([commandEncoder.finish()]);
    await device.queue.onSubmittedWorkDone();
    return commandEncoder;
}

function cancelActions() {
    // This function is expected by "resources/recording-utilities.js".
}

async function performActions() {
    device.label = "device";
    device.label;
    let bindGroup = device.createBindGroup({layout: device.createBindGroupLayout({entries: []}), entries: []});
    bindGroup.label = "bindGroup";
    let buffer = device.createBuffer({size: 4, usage: GPUBufferUsage.COPY_DST});
    device.queue.writeBuffer(buffer, 0, new Uint8Array(4));
    await Promise.all([
        render({r: 0, g: 1, b: 0, a: 1}),
        render({r: 0, g: 0, b: 1, a: 1}),
    ]);
    setTimeout(() => TestPage.dispatchEventToFrontend("LastFrame"), 0);
}

function performConsoleActions() {
    console.record(device, {name: "TEST"});

    device.label = "recorded";

    console.recordEnd(device);

    device.label;
}

async function load() {
    let adapter = await navigator.gpu.requestAdapter();
    device = await adapter.requestDevice();

    context = document.querySelector("canvas").getContext("webgpu");
    context.configure({
        device,
        format: navigator.gpu.getPreferredCanvasFormat(),
    });
    await render({r: 1, g: 0, b: 0, a: 1});

    runTest();
}

function test() {
    let suite = InspectorTest.createAsyncSuite("Canvas.recordingWebGPU");

    suite.addTestCase({
        name: "Canvas.recordingWebGPU.singleFrame",
        description: "Check that WebGPU device actions record stable receivers and snapshots.",
        test(resolve, reject) {
            async function checkRecording(recording) {
                let actions = recording.frames.flatMap((frame) => frame.actions);

                InspectorTest.expectEqual(recording.type, WI.Recording.Type.CanvasWebGPU, "The recording should have the WebGPU type.");
                InspectorTest.expectGreaterThan(recording.initialState.content.length, "data:image/png;base64,".length, "The recording should have initial canvas content.");

                let deviceLabelActions = actions.filter((action) => action.name === "label" && !action.receiver);
                InspectorTest.expectEqual(deviceLabelActions.length, 2, "Device actions should use the implicit device receiver.");
                InspectorTest.expectFalse(deviceLabelActions[0].isGetter, "Setting a label should be recorded as an attribute setter.");
                InspectorTest.expectTrue(deviceLabelActions[1].isGetter, "Getting a label should be recorded as an attribute getter.");

                let bindGroupLabelAction = actions.find((action) => action.name === "label" && action.receiver === "bindGroup");
                InspectorTest.expectTrue(bindGroupLabelAction, "The recording should create a concise name for a WebGPU receiver.");

                let writeBufferAction = actions.find((action) => action.name === "writeBuffer");
                InspectorTest.expectEqual(typeof writeBufferAction?.parameters[0], "number", "WebGPU object arguments should be swizzled as identifiers.");

                let receiverTypes = Array.from(new Set(actions.filter((action) => action.receiver).map((action) => action.receiver.replace(/\d+$/, "")))).sort();
                InspectorTest.expectEqual(receiverTypes.join(", "), "bindGroup, commandEncoder, queue, renderPassEncoder, texture", "The recording should identify each explicit receiver type.");

                let beginRenderPassActions = actions.filter((action) => action.name === "beginRenderPass");
                let finishActions = actions.filter((action) => action.name === "finish");
                InspectorTest.expectEqual(beginRenderPassActions[0].receiver, finishActions[0].receiver, "Command encoder actions should have the same receiver.");
                InspectorTest.expectNotEqual(beginRenderPassActions[0].receiver, beginRenderPassActions[1].receiver, "Different command encoders should have different receivers.");
                InspectorTest.expectTrue(beginRenderPassActions.every((action) => /^commandEncoder\d+$/.test(action.receiver)), "Receivers should include identifiers when multiple objects have the same type.");

                let setViewportAction = actions.find((action) => action.name === "setViewport");
                let endAction = actions.find((action) => action.name === "end");
                InspectorTest.expectEqual(setViewportAction.receiver, endAction.receiver, "Render pass actions should have the same receiver.");

                let submitAction = actions.find((action) => action.name === "submit");
                let workDoneAction = actions.find((action) => action.name === "onSubmittedWorkDone");
                InspectorTest.expectEqual(submitAction.receiver, workDoneAction.receiver, "Queue actions should have the same receiver.");
                InspectorTest.expectGreaterThan(submitAction.snapshot.length, "data:image/png;base64,".length, "Submitting work should capture a snapshot.");

                let serializedRecording = recording.toJSON();
                let serializedAction = beginRenderPassActions[0].toJSON(serializedRecording.version);
                InspectorTest.expectEqual(serializedAction.length, 5, "An action without a snapshot should not include a snapshot placeholder.");
                InspectorTest.expectTrue(Array.isArray(serializedAction[4]) && serializedAction[4].length === 2 && typeof serializedAction[4][0] === "number" && serializedAction[4][1] === WI.Recording.Swizzle.GPUCommandEncoder, "The serialized receiver should contain an identifier and swizzle type.");

                let serializedSnapshotAction = submitAction.toJSON(serializedRecording.version);
                InspectorTest.expectEqual(serializedSnapshotAction[4][1], WI.Recording.Swizzle.GPUQueue, "The serialized receiver should precede the snapshot.");
                InspectorTest.expectTrue(serializedRecording.data[serializedSnapshotAction[5]].startsWith("data:image/png;base64,"), "The serialized snapshot should follow the receiver.");
            }

            startRecording(WI.Canvas.ContextType.WebGPU, resolve, reject, {frameCount: 1, callback: checkRecording});
        },
        timeout: -1,
    });

    suite.addTestCase({
        name: "Canvas.recordingWebGPU.Console",
        description: "Check that a recording can be triggered by console.record().",
        test(resolve, reject) {
            consoleRecord(WI.Canvas.ContextType.WebGPU, resolve, reject);
        },
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="window.testRunner?.waitUntilDone(); load()">
    <canvas width="4" height="4"></canvas>
    <p>Test that CanvasManager is able to record actions made to WebGPU devices.</p>
</body>
</html>
