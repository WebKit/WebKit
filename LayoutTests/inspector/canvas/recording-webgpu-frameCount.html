<!-- webkit-test-runner [ HTMLInCanvasEnabled=true WebGPUEnabled=true ] -->
<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/recording-utilities.js"></script>
<script src="resources/recording-webgpu.js"></script>
<script>
function test() {
    let suite = InspectorTest.createAsyncSuite("Canvas.recordingWebGPU");

    suite.addTestCase({
        name: "Canvas.recordingWebGPU.singleFrame",
        description: "Check that the recording is stopped after a single frame.",
        test(resolve, reject) {
            startRecording(WI.Canvas.ContextType.WebGPU, resolve, reject, {frameCount: 1});
        },
        timeout: -1,
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="window.testRunner?.waitUntilDone(); load()">
    <canvas width="4" height="4"></canvas>
    <p>Test that CanvasManager is able to record actions made to WebGPU devices.</p>
</body>
</html>
