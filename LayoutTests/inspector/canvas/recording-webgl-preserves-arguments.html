<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/recording-utilities.js"></script>
<script>
if (window.internals)
    window.internals.settings.setWebGLErrorsToConsoleEnabled(false);

let webGLContext = null;

function performActions() {
    // These run while a recording is active, which is when the canvas call
    // tracer processes each argument before the context receives it.
    webGLContext.clearColor(0, 1, 0, 1);
    webGLContext.clear(webGLContext.COLOR_BUFFER_BIT);

    let pixels = new Uint8Array(4);
    webGLContext.readPixels(0, 0, 1, 1, webGLContext.RGBA, webGLContext.UNSIGNED_BYTE, pixels);
    TestPage.addResult("readPixels() filled its destination: " + pixels.some((component) => component));

    let texture = webGLContext.createTexture();
    webGLContext.bindTexture(webGLContext.TEXTURE_2D, texture);
    webGLContext.texImage2D(webGLContext.TEXTURE_2D, 0, webGLContext.RGBA, 2, 2, 0, webGLContext.RGBA, webGLContext.UNSIGNED_BYTE, null);
    webGLContext.bindTexture(webGLContext.TEXTURE_2D, null);
    webGLContext.bindBuffer(webGLContext.ARRAY_BUFFER, null);
    webGLContext.bindFramebuffer(webGLContext.FRAMEBUFFER, null);
    webGLContext.bindRenderbuffer(webGLContext.RENDERBUFFER, null);
    webGLContext.uniform1f(null, 2.5);
    webGLContext.useProgram(null);
    TestPage.addResult("Unbinding and texture allocation produce no WebGL error: " + (webGLContext.getError() === webGLContext.NO_ERROR));

    setTimeout(() => TestPage.dispatchEventToFrontend("LastFrame"), 0);
}

function cancelActions() {
    // This function is expected by "resources/recording-utilities.js".
}

function load() {
    webGLContext = document.querySelector("canvas").getContext("webgl");
    runTest();
}

function test() {
    let suite = InspectorTest.createAsyncSuite("Canvas.recordingWebGLPreservesArguments");

    suite.addTestCase({
        name: "Canvas.recordingWebGLPreservesArguments.readPixels",
        description: "Check that recording an action leaves its typed array argument for the context to use.",
        test(resolve, reject) {
            async function checkRecording(recording) {
                let actions = recording.frames.flatMap((frame) => frame.actions);
                InspectorTest.expectTrue(actions.some((action) => action.name === "readPixels"), "The recording should contain the readPixels() action.");

                let allocation = actions.find((action) => action.name === "texImage2D");
                InspectorTest.expectEqual(allocation.parameters[8], null, "Texture allocation should retain the null pixel source.");

                let boundTexture = actions.find((action) => action.name === "bindTexture");
                InspectorTest.expectGreaterThan(boundTexture.parameters[1], 0, "A non-null texture should retain its object identifier.");

                for (let name of ["bindBuffer", "bindFramebuffer", "bindRenderbuffer", "bindTexture"]) {
                    let action = actions.findLast((action) => action.name === name);
                    InspectorTest.expectEqual(action.parameters[1], null, `${name} should retain its null binding.`);
                }

                let uniform = actions.find((action) => action.name === "uniform1f");
                InspectorTest.expectShallowEqual(uniform.parameters, [null, 2.5], "A missing uniform should not shift the recorded numeric argument.");

                let program = actions.find((action) => action.name === "useProgram");
                InspectorTest.expectShallowEqual(program.parameters, [null], "Unbinding a program should retain its null argument.");
            }

            startRecording(WI.Canvas.ContextType.WebGL, resolve, reject, {frameCount: 1, callback: checkRecording});
        },
        timeout: -1,
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="load()">
    <canvas width="4" height="4"></canvas>
    <p>Test that CanvasManager does not consume the typed array arguments it records.</p>
</body>
</html>
