<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Custom Highlight API: shadow tree content enclosed by a highlight range is highlighted</title>
<style>
#target {
    font: 16px/20px monospace;
    white-space: pre;
    width: max-content;
    color: black;
}
#target::highlight(test),
#host::highlight(test) {
    background-color: lime;
}
</style>
</head>
<body>
<p>PASS if the bar below is one solid lime rectangle with no gap in the middle.</p>
<div id="target">AAAA<span id="host"></span>AAAA</div>
<script>
const host = document.getElementById("host");
host.attachShadow({ mode: "open" }).innerHTML = "AAAA";

const target = document.getElementById("target");
const range = new Range();
range.setStart(target, 0);
range.setEnd(target, target.childNodes.length);
CSS.highlights.set("test", new Highlight(range));
</script>
</body>
</html>
