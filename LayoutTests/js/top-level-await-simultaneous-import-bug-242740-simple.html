<!DOCTYPE HTML>
<html>
<head>
<script src="../resources/js-test-pre.js"></script>
</head>
<body>
<script>
description('Test simple case of bug 242740: simultaneous imports of module with top-level await');
window.jsTestIsAsync = true;

async function runTest() {
    try {
        // This reproduces the exact bug report case
        const [module1, module2] = await Promise.all([
            import('./top-level-await-simultaneous-import-bug-242740-simple-module.js'),
            import('./top-level-await-simultaneous-import-bug-242740-simple-module.js')
        ]);
        
        // Make variables global for shouldBeEqualToString
        window.module1 = module1;
        window.module2 = module2;
        
        shouldBeEqualToString('module1.default', 'simple-module-loaded');
        shouldBeEqualToString('module2.default', 'simple-module-loaded');
        
        finishJSTest();
    } catch (error) {
        debug(`FAIL: failed with error ${error.message}`);
        finishJSTest();
    }
}

runTest();
</script>
<script src="../resources/js-test-post.js"></script>
</body>
</html>
