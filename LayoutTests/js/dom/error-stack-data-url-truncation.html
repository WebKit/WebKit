<html>
<head>
<script src="../../resources/js-test.js"></script>
</head>
<body>
<p id="description"></p>
<div id="console"></div>
<script>
description("Tests that a source URL over 1024 characters is cut down in Error.stack, error.sourceURL, and ErrorEvent.filename, that the cut avoids %XX escapes, and that a short URL is left alone.");

window.jsTestIsAsync = true;

const limit = 1024;

// Makes a module whose data: URL is exactly totalLength characters.
// percentAt puts a %20 escape at that index.
function makeModuleURL(totalLength, percentAt)
{
    const prefix = "data:text/javascript,export%20function%20mk()%7Breturn%20new%20Error('t')%7D%3B%2F%2F";
    let url = prefix;
    while (url.length < totalLength) {
        if (percentAt !== undefined && url.length === percentAt && totalLength - url.length >= 3) {
            url += "%20";
            continue;
        }
        if (percentAt !== undefined && url.length > percentAt - 3 && url.length < percentAt)
            url += "a";
        else
            url += "abcdefghij".charAt(url.length % 10);
    }
    return url.substring(0, totalLength);
}

// A frame looks like fn@url:line:column. Pull out the url.
function sourceURLOfFrame(stack, prefix)
{
    const frame = stack.split("\n").filter(function (each) { return each.indexOf(prefix) !== -1; })[0];
    if (!frame)
        return null;
    return frame.substring(frame.indexOf(prefix)).replace(/:\d+:\d+$/, "");
}

async function lengthsFor(totalLength, percentAt)
{
    const module = await import(makeModuleURL(totalLength, percentAt));
    const error = module.mk();
    const url = sourceURLOfFrame(error.stack, "data:text/javascript,");
    return {
        stack: url === null ? -1 : url.length,
        source: error.sourceURL.length,
    };
}

// This file's own URL is short, so it stays whole.
// Read it here: inside the async function below there is no caller frame.
window.ordinaryFrameSurvives = new Error().stack.indexOf("error-stack-data-url-truncation.html") !== -1;

async function runTests()
{
    try {
        // Long data: URL, cut to 1024 in the stack and in sourceURL.
        const plain = await lengthsFor(5000);
        window.plainLength = plain.stack;
        window.plainSourceLength = plain.source;
        shouldBe("plainLength", "1024");
        shouldBe("plainSourceLength", "1024");

        // %20 starts at 1023, so cut before it.
        const escapeAtEnd = await lengthsFor(5000, limit - 1);
        window.escapeAtEndLength = escapeAtEnd.stack;
        window.escapeAtEndSourceLength = escapeAtEnd.source;
        shouldBe("escapeAtEndLength", "1023");
        shouldBe("escapeAtEndSourceLength", "1023");

        // %20 starts at 1022, so cut before it.
        const escapeStraddling = await lengthsFor(5000, limit - 2);
        window.escapeStraddlingLength = escapeStraddling.stack;
        window.escapeStraddlingSourceLength = escapeStraddling.source;
        shouldBe("escapeStraddlingLength", "1022");
        shouldBe("escapeStraddlingSourceLength", "1022");

        // %20 starts at 1021, the whole escape fits, so no cut before it.
        const escapeFits = await lengthsFor(5000, limit - 3);
        window.escapeFitsLength = escapeFits.stack;
        window.escapeFitsSourceLength = escapeFits.source;
        shouldBe("escapeFitsLength", "1024");
        shouldBe("escapeFitsSourceLength", "1024");

        // Under 1024, so unchanged.
        const short = await lengthsFor(500);
        window.shortLength = short.stack;
        window.shortSourceLength = short.source;
        shouldBe("shortLength", "500");
        shouldBe("shortSourceLength", "500");

        // This file's own URL is short, so it stays whole.
        shouldBeTrue("ordinaryFrameSurvives");

        const filename = await new Promise(function (resolve) {
            window.addEventListener("error", function (event) {
                event.preventDefault();
                resolve(event.filename);
            }, { once: true });
            window.expectingError = true;
            const script = document.createElement("script");
            script.type = "module";
            script.src = "data:text/javascript,throw%20new%20Error('t')%3B%2F%2F" + "a".repeat(3000);
            document.body.appendChild(script);
        });
        window.filenameLength = filename.length;
        shouldBe("filenameLength", "1024");
    } catch (exception) {
        testFailed("threw " + exception);
    }
    finishJSTest();
}

runTests();
</script>
</body>
</html>
