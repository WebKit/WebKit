<!DOCTYPE HTML>
<html>
<head>
<script src="../resources/js-test-pre.js"></script>
</head>
<body>
<script>
description('Comprehensive test for bug 242740: stress test multiple simultaneous imports with top-level await');
window.jsTestIsAsync = true;

async function runComprehensiveTest() {
    try {
        const testCount = 10;
        const promises = [];
        
        // Create multiple simultaneous import promises
        for (let i = 0; i < testCount; i++) {
            promises.push(import('./top-level-await-simultaneous-import-bug-242740-module.js'));
        }
        
        // Wait for all imports to complete
        const results = await Promise.all(promises);
        
        // Make variables global for shouldBeEqualToString
        window.results = results;
        window.firstResult = results[0].default;
        
        // Verify all results are the same
        shouldBeEqualToString('firstResult', 'module-loaded');
        
        for (let i = 1; i < results.length; i++) {
            shouldBeEqualToString(`results[${i}].default`, 'module-loaded');
        }
        
        finishJSTest();
    } catch (error) {
        debug(`FAIL: failed with error ${error.message}`);
        finishJSTest();
    }
}

runComprehensiveTest();
</script>
<script src="../resources/js-test-post.js"></script>
</body>
</html>
