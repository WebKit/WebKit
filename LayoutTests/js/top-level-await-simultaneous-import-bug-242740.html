<!DOCTYPE HTML>
<html>
<head>
<script src="../resources/js-test-pre.js"></script>
</head>
<body>
<script>
description('Test that multiple modules can simultaneously import a module with top-level await without ReferenceError');
window.jsTestIsAsync = true;

let testResults = [];

function log(message) {
    testResults.push(message);
    console.log(message);
}

async function runTests() {
    try {
        // Test case 1: Simple simultaneous imports
        log('Testing simultaneous imports...');
        const [result1, result2] = await Promise.all([
            import('./top-level-await-simultaneous-import-bug-242740-module.js'),
            import('./top-level-await-simultaneous-import-bug-242740-module.js')
        ]);
        
        // Make variables global for shouldBeEqualToString
        window.result1 = result1;
        window.result2 = result2;
        
        shouldBeEqualToString('result1.default', 'module-loaded');
        shouldBeEqualToString('result2.default', 'module-loaded');

        // Test case 2: Multiple modules importing the same module
        log('Testing multiple modules importing the same module...');
        const [import1, import2, import3] = await Promise.all([
            import('./top-level-await-simultaneous-import-bug-242740-import1.js'),
            import('./top-level-await-simultaneous-import-bug-242740-import2.js'),
            import('./top-level-await-simultaneous-import-bug-242740-import3.js')
        ]);
        
        // Make variables global for shouldBeEqualToString
        window.import1 = import1;
        window.import2 = import2;
        window.import3 = import3;
        
        shouldBeEqualToString('import1.default', 'import-successful');
        shouldBeEqualToString('import2.default', 'import-successful');
        shouldBeEqualToString('import3.default', 'import-successful');

        log('All tests completed successfully');
        finishJSTest();
    } catch (error) {
        debug(`FAIL: failed with error ${error.message}`);
        finishJSTest();
    }
}

runTests();
</script>
<script src="../resources/js-test-post.js"></script>
</body>
</html>
