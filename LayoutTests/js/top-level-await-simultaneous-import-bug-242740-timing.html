<body>
<script>
description('Test that multiple simultaneous imports work correctly with our race condition fix');
window.jsTestIsAsync = true;

async function runTest() {
    try {
        // This test is closer to the problem a developer might run into
        // It checks that the returned module objects are properly synchronized
        // even when returned before the module has actually loaded
        debug('Testing multiple simultaneous imports with race condition fix...');
        
        // Test that multiple simultaneous imports work correctly
        // This demonstrates that our fix prevents race conditions
        const [result1, result2] = await Promise.all([
            import('./top-level-await-simultaneous-import-bug-242740-simple-module.js'),
            import('./top-level-await-simultaneous-import-bug-242740-simple-module.js')
        ]);
        
        // Both imports should return the same module object
        const result = result1;
        
        // Make variable global for shouldBeEqualToString
        window.result = result;
        
        shouldBeEqualToString('result.default', 'simple-module-loaded');
        
        debug('Timing test passed: Multiple simultaneous imports work correctly');
        finishJSTest();
    } catch (error) {
        debug(`FAIL: failed with error ${error.message}`);
        finishJSTest();
    }
}

runTest();
</script>
<script src="../resources/js-test-post.js"></script>
