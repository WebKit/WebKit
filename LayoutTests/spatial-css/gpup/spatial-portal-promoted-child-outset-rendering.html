<!DOCTYPE html> <!-- webkit-test-runner [ SpatialPortalEnabled=true ModelElementEnabled=true ] -->
<html>
<head>
<meta name="fuzzy" content="maxDifference=0-2; totalPixels=0-34000">
<style>
    body {
        margin: 0;
    }
    .portal {
        spatial: portal;
        width: 400px;
        height: 240px;
        box-sizing: border-box;
        padding: 50px 0 0 60px;
        background-color: #ddd;
    }
    .child {
        box-sizing: border-box;
        width: 200px;
        height: 120px;
        padding: 8px;
        border: 6px solid rgb(70, 70, 140);
        background-color: rgb(60, 140, 70);
        box-shadow: -30px -24px 0 rgb(150, 90, 60);
        color: white;
        font: 20px sans-serif;
        transform-style: preserve-3d;
    }
    .nested {
        width: 60px;
        height: 30px;
        margin-top: 10px;
        background-color: rgb(140, 120, 50);
        will-change: transform;
    }
</style>
</head>
<body>
<div class="portal">
    <div class="child">Hosted<div class="nested"></div></div>
</div>
<script src="../../resources/ui-helper.js"></script>
<script src="../resources/spatial-portal-utils.js"></script>
<script>
window.testRunner?.waitUntilDone();

window.onload = async () => {
    await waitForHostedPromotedChildren(document.querySelector(".portal"), 1);
    await waitForPortalSceneToDisplay();
    window.testRunner?.notifyDone();
};
</script>
</body>
</html>
