<!DOCTYPE html> <!-- webkit-test-runner [ SpatialPortalEnabled=true ModelElementEnabled=true ] -->
<html>
<head>
<style>
    body {
        margin: 0;
    }
    .portal {
        spatial: portal;
        width: 300px;
        height: 200px;
        background-color: #ddd;
    }
    .child {
        box-sizing: border-box;
        width: 160px;
        height: 90px;
        margin: 20px 0 0 30px;
        padding: 8px;
        border: 6px solid rgb(70, 70, 140);
        background-color: rgb(60, 140, 70);
        color: white;
        font: 20px sans-serif;
    }
</style>
</head>
<body>
<div class="portal">
    <div class="child">Hosted</div>
</div>
</body>
</html>
