<!DOCTYPE html> <!-- webkit-test-runner [ SpatialPortalEnabled=true ModelElementEnabled=true ] -->
<html>
<head>
<meta name="fuzzy" content="maxDifference=0-3; totalPixels=0-2000">
<style>
    body {
        margin: 0;
    }
    .portal {
        spatial: portal;
        width: 400px;
        height: 200px;
        background-color: #ddd;
    }
    .child {
        position: absolute;
        top: 20px;
        box-sizing: border-box;
        width: 160px;
        height: 90px;
        padding: 8px;
        border: 6px solid rgb(70, 70, 140);
        background-color: rgb(60, 140, 70);
        color: white;
        font: 20px sans-serif;
        transform: translateZ(0.1px);
    }
    .faded {
        left: 20px;
        opacity: 0.5;
    }
    .filtered {
        left: 210px;
        filter: grayscale(1);
    }
</style>
</head>
<body>
<div class="portal">
    <div class="child faded">Faded</div>
    <div class="child filtered">Filtered</div>
</div>
<script src="../../resources/ui-helper.js"></script>
<script src="../resources/spatial-portal-utils.js"></script>
<script>
window.testRunner?.waitUntilDone();

window.onload = async () => {
    await new Promise(resolve => setTimeout(resolve, 1000));
    await waitForPortalSceneToDisplay();
    window.testRunner?.notifyDone();
};
</script>
</body>
</html>
