<!DOCTYPE html><!-- webkit-test-runner [ SpatialPortalEnabled=true ] -->
<html>
<head>
<style>
    .portal {
        spatial: portal;
        width: 300px;
        height: 300px;
    }
    .box {
        width: 100px;
        height: 50px;
        background-color: green;
    }
    .preserve-3d {
        transform-style: preserve-3d;
    }
</style>
<script>
    if (window.testRunner)
        testRunner.setRenderTreeDumpOptions(testRunner.RENDER_TREE_SHOW_COMPOSITED_LAYERS);
</script>
</head>
<body>
<div class="portal">
    <div class="box preserve-3d"></div>
    <div class="box"></div>
    <div class="box preserve-3d" style="overflow: hidden"></div>
    <div>
        <div class="box preserve-3d"></div>
    </div>
    <div style="display: contents">
        <div class="box preserve-3d"></div>
    </div>
    <div class="box preserve-3d" style="position: absolute"></div>
</div>
<div class="box preserve-3d"></div>
</body>
</html>
