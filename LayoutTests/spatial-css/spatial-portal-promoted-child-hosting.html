<!DOCTYPE html> <!-- webkit-test-runner [ SpatialPortalEnabled=true ModelElementEnabled=true ] -->
<html>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<script src="../model-element/resources/model-utils.js"></script>
<script src="resources/spatial-portal-utils.js"></script>
<style>
    .portal {
        spatial: portal;
        width: 300px;
        height: 200px;
    }
    .child {
        width: 100px;
        height: 50px;
        background-color: green;
    }
    .preserve-3d {
        transform-style: preserve-3d;
    }
    .translate-z {
        transform: translateZ(-10px);
    }
    .container {
        width: 200px;
        height: 100px;
        transform: translateZ(-20px) rotateY(10deg);
        transform-style: preserve-3d;
    }
    .composited {
        width: 50px;
        height: 30px;
        background-color: blue;
        will-change: transform;
    }
</style>
<body>
<script>
'use strict';

const layersHostedInScene = () => internals.layerTreeAsText(document).split("(hostedInSpatialPortalScene 1)").length - 1;

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="child preserve-3d"></div><div class="child translate-z"></div><div class="child translate-z"></div>`;
    await waitForHostedPromotedChildren(portal, 3);
}, "Every promoted child of a portal is hosted, with preserve-3d or with a 3D transform");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="child translate-z"></div><div class="child translate-z"></div>`;
    await waitForHostedPromotedChildren(portal, 2);
    assert_equals(layersHostedInScene(), 2, "The layers of hosted children are hidden from compositing");

    portal.lastElementChild.style.opacity = "0.5";
    await waitFor(() => layersHostedInScene() === 1, "one layer to be hosted in the portal scene");
    assert_equals(internals.numberOfHostedPromotedChildrenInSpatialPortal(portal), 1);
}, "The layer of a hosted child is hidden from compositing for as long as the scene draws the child");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="child translate-z"></div>`;
    const child = portal.firstElementChild;
    await waitForHostedPromotedChildren(portal, 1);

    child.style.opacity = "0.5";
    await waitForHostedPromotedChildren(portal, 0);

    child.style.opacity = "";
    child.style.filter = "blur(2px)";
    await waitForHostedPromotedChildren(portal, 0);

    child.style.filter = "";
    child.style.clipPath = "circle(40%)";
    await waitForHostedPromotedChildren(portal, 0);

    child.style.clipPath = "";
    child.style.backfaceVisibility = "hidden";
    await waitForHostedPromotedChildren(portal, 0);

    child.style.backfaceVisibility = "";
    await waitForHostedPromotedChildren(portal, 1);
}, "A child with a layer effect that a hosted quad cannot reproduce stays flat");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="child translate-z"></div>`;
    const child = portal.firstElementChild;
    await waitForHostedPromotedChildren(portal, 1);

    child.style.transform = "none";
    await waitForHostedPromotedChildren(portal, 0);

    child.style.transform = "rotateY(30deg)";
    await waitForHostedPromotedChildren(portal, 1);
}, "A child stops being hosted when it loses its 3D transform and is hosted again when it regains one");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="container"><div class="composited"></div><div class="composited" style="margin-left: 100px"></div></div>`;
    await waitForHostedPromotedChildren(portal, 1);
}, "A promoted child is hosted together with its composited descendants, even with no content of its own");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="container"><div class="composited"></div></div>`;
    const descendant = portal.querySelector(".composited");
    await waitForHostedPromotedChildren(portal, 1);

    descendant.style.opacity = "0.5";
    await waitForHostedPromotedChildren(portal, 0);

    descendant.style.opacity = "";
    await waitForHostedPromotedChildren(portal, 1);
}, "A promoted child stays flat while one of its composited descendants has a layer effect");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="container"><div style="width: 20px; height: 20px"><div class="composited"></div></div></div>`;
    const clip = portal.querySelector(".composited").parentElement;
    await waitForHostedPromotedChildren(portal, 1);

    clip.style.overflow = "hidden";
    await waitForHostedPromotedChildren(portal, 0);

    clip.style.overflow = "";
    await waitForHostedPromotedChildren(portal, 1);
}, "A promoted child stays flat while one of its composited descendants is clipped");

promise_test(async test => {
    const portal = createPortal(test);
    portal.innerHTML = `<div class="child translate-z"></div>`;
    const child = portal.firstElementChild;
    await waitForHostedPromotedChildren(portal, 1);

    child.remove();
    await waitForHostedPromotedChildren(portal, 0);

    portal.appendChild(child);
    await waitForHostedPromotedChildren(portal, 1);
}, "A child that is removed from and inserted back into a portal is hosted again");
</script>
</body>
</html>
