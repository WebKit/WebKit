<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN"><!-- webkit-test-runner [ IsAccessibilityIsolatedTreeEnabled=true ] -->
<html>
<head>
<script src="../../../resources/accessibility-helper.js"></script>
<script src="../../../resources/js-test.js"></script>
</head>
<body>

<div id="menu" style="display:contents" role="menu" aria-activedescendant="item1">
   <div role="menuitem" id="item1" tabindex="-1">Menu item 1</div>
   <div role="menuitem" id="item2" tabindex="-1">Menu item 2</div>
</div>

<script>
var output = "This test ensures that the aria-activedescendant of a display:contents menu is considered selected where an active menu item is (ATSPI).\n\n";

if (window.accessibilityController) {
    // ARIA menu items have no selected state, so only ATSPI reports the active one as selected.
    var activeDescendantIsSelected = accessibilityController.platformName == "atspi";
    output += expect("accessibilityController.accessibleElementById('item1').isSelected", "activeDescendantIsSelected");
    output += expect("accessibilityController.accessibleElementById('item2').isSelected", "false");
    debug(output);
}
</script>
</body>
</html>
