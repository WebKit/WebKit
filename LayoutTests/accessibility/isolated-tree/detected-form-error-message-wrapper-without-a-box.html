<!DOCTYPE HTML><!-- webkit-test-runner [ AccessibilityFormErrorDetectionEnabled=true IsAccessibilityIsolatedTreeEnabled=true ] -->
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
<style>
/* The outermost element of the message groups it without taking up space itself, so its own box is empty
   and only its contents have a position. */
#origin-error { display: contents; }
</style>
</head>
<body>

<form id="form">
  <label for="origin">From</label><input id="origin" type="text">
  <div id="origin-error"></div>
  <button id="submit" type="submit">Search</button>
</form>

<script>
var output = "This tests that a message is still placed next to its field when the element holding the whole message has no box of its own. Sites group a message in a wrapper that takes up no space, and the position of such a wrapper has to come from what is inside it.\n\n";

if (window.accessibilityController) {
    window.jsTestIsAsync = true;
    internals.setAccessibilityFormErrorSettleDelay(0.1);

    document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("origin-error").innerHTML = '<div><span>Please enter a valid origin.</span></div>';
    });

    function axElement(id) {
        return accessibilityController.accessibleElementById(id);
    }

    setTimeout(async function() {
        output += expect("axElement('origin').stringAttributeValue('AXInvalid')", "'false'");

        document.getElementById("submit").click();

        output += await expectAsync("axElement('origin').stringAttributeValue('AXInvalid')", "'true'");
        output += await expectAsync("errorMessageText(axElement('origin'))", "'Please enter a valid origin.'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
