<!DOCTYPE HTML><!-- webkit-test-runner [ AccessibilityFormErrorDetectionEnabled=true IsAccessibilityIsolatedTreeEnabled=true ] -->
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
<style>
.field-error { color: #c62828; }
.field-error.orange { color: #ea580c; }
</style>
</head>
<body>

<div id="checkout">
  <label for="name">Name</label><input id="name" type="text">
  <div id="name-error" class="field-error"></div>
  <label for="email">Email</label><input id="email" type="text">
  <div id="email-error" class="field-error orange"></div>
  <div id="place-order" role="button" tabindex="0">Place order</div>
</div>

<script>
var output = "This tests that errors are found on a page that collects input without a form element, where the control the user activates is not a submit button. With no form there is no submission to watch for, so activating the control is what starts the watch. One message is red and the other orange, both colors a site gives an error.\n\n";

if (window.accessibilityController) {
    window.jsTestIsAsync = true;
    internals.setAccessibilityFormErrorSettleDelay(0.1);

    var payload = "";
    accessibilityController.addNotificationListener((element, notification, userInfo) => {
        if (notification == "AXPossibleFormValidationError")
            payload = formatFormValidationUserInfo(userInfo);
    });

    document.getElementById("place-order").addEventListener("click", () => {
        document.getElementById("name-error").textContent = "Enter your name.";
        document.getElementById("email-error").textContent = "Enter a valid email address.";
    });

    function axElement(id) {
        return accessibilityController.accessibleElementById(id);
    }

    setTimeout(async function() {
        // Read the field first, since nothing arms detection on a page no assistive technology has looked at.
        output += expect("axElement('name').stringAttributeValue('AXInvalid')", "'false'");

        axElement("place-order").press();

        output += await expectAsync("axElement('name').stringAttributeValue('AXInvalid')", "'true'");
        output += await expectAsync("errorMessageText(axElement('name'))", "'Enter your name.'");
        output += await expectAsync("axElement('email').stringAttributeValue('AXInvalid')", "'true'");
        output += await expectAsync("errorMessageText(axElement('email'))", "'Enter a valid email address.'");
        output += await expectAsync("payload", "'AXFormValidationUnannouncedText: Enter your name. | Enter a valid email address.\\nAXFormValidationErrorFieldCount: 2\\n'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
