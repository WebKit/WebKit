<!DOCTYPE HTML><!-- webkit-test-runner [ IsAccessibilityIsolatedTreeEnabled=true ] -->
<html>
<head>
<script src="../../../resources/accessibility-helper.js"></script>
<script src="../../../resources/js-test.js"></script>
</head>
<body>

<div contenteditable id="editable">First line.<br>Second line.</div>
<div id="after">After the editable.</div>

<script>
var output = "This tests that a line's text marker range includes its trailing line break, and that a line\n"
    + "that ends its block, which has no trailing line break, ends with its own text.\n\n";

var editable, fullRange, firstLineRange, lastLineRange, endMarker;

if (window.accessibilityController) {
    window.jsTestIsAsync = true;

    setTimeout(async function() {
        editable = await waitForElementById("editable");
        fullRange = editable.textMarkerRangeForElement(editable);
        var startMarker = editable.startTextMarkerForTextMarkerRange(fullRange);
        firstLineRange = editable.lineTextMarkerRangeForTextMarker(startMarker);

        // "First line." is 11 characters; the line range must also include the trailing line break (the <br>) for 12.
        output += expect("editable.textMarkerRangeLength(firstLineRange)", "12");
        output += expect("editable.stringForTextMarkerRange(firstLineRange) === 'First line.\\n'", "true");

        // The last line has no trailing line break of its own.
        endMarker = editable.endTextMarkerForTextMarkerRange(fullRange);
        lastLineRange = editable.lineTextMarkerRangeForTextMarker(endMarker);
        output += expect("editable.textMarkerRangeLength(lastLineRange)", "12");
        output += expect("editable.stringForTextMarkerRange(lastLineRange) === 'Second line.'", "true");
        output += expect("editable.endTextMarkerForTextMarkerRange(lastLineRange).isEqual(endMarker)", "true");

        // The two lines together account for the editable's text exactly once.
        output += expect("editable.textMarkerRangeLength(fullRange)", "24");

        debugEscaped(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
