<!DOCTYPE html><!-- webkit-test-runner [ HTMLEnhancedSelectMultipleAndListBoxEnabled=true IsAccessibilityIsolatedTreeEnabled=true ] -->
<html>
<head>
<script src="../../../resources/accessibility-helper.js"></script>
<script src="../../../resources/js-test.js"></script>
<style>
.base {
    appearance: base-select;
}
</style>
</head>
<body>

<div id="content">
<select id="native" size="6">
    <option id="native-text">Apple</option>
    <option id="native-label" label="Banana">Yellow fruit</option>
    <option id="native-element"><span>Cherry</span></option>
    <option id="native-image"><img alt="Date" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></option>
    <optgroup label="Fruit"><option>Elderberry</option></optgroup>
</select>

<select id="base" class="base" size="6">
    <option id="base-text">Apple</option>
    <option id="base-label" label="Banana">Yellow fruit</option>
    <option id="base-element"><span>Cherry</span></option>
    <option id="base-image"><img alt="Date" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></option>
    <optgroup label="Fruit"><option>Elderberry</option></optgroup>
</select>
</div>

<script>
var output = "This test ensures that the options of a base appearance list box and its optgroups expose their text through AXValue without an AXTitle, like those of a native list box.\n\n";

function describeElement(element) {
    return `${element?.role} | ${element?.title} | ${element?.stringValue} | ${element?.description}`;
}

function describe(id) {
    return describeElement(accessibilityController.accessibleElementById(id));
}

function describeOptGroup(selectID) {
    const select = accessibilityController.accessibleElementById(selectID);
    for (let i = 0; i < (select?.childrenCount ?? 0); i++) {
        const item = select.childAtIndex(i);
        if (item?.stringValue == "AXValue: Fruit")
            return describeElement(item);
    }
    return "(none)";
}

if (window.accessibilityController) {
    window.jsTestIsAsync = true;

    setTimeout(async function() {
        await waitForElementById("native");
        await waitForElementById("base");
        for (const kind of ["text", "label", "element", "image"])
            output += expect(`describe("base-${kind}")`, `describe("native-${kind}")`);
        output += expect(`describeOptGroup("base")`, `describeOptGroup("native")`);
        output += expect(`describe("native-image")`, `"AXRole: AXStaticText | AXTitle:  | AXValue: Date | AXDescription: "`);

        document.getElementById("content").style.display = "none";
        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
