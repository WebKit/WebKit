<!DOCTYPE HTML><!-- webkit-test-runner [ AccessibilityFormErrorDetectionEnabled=true IsAccessibilityIsolatedTreeEnabled=true ] -->
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
</head>
<body>

<form id="form">
  <label for="origin">From</label><input id="origin" type="text">
  <div id="origin-error"></div>
  <button id="submit" type="submit">Search</button>
</form>

<script>
var output = "This tests that a message written by the page's own submit listener is found even when accessibility has already looked at the page before the listener returns. Watching has to begin before the submit event is dispatched, because by the time it returns the message has been written and, with an assistive technology attached, already processed.\n\n";

if (window.accessibilityController) {
    window.jsTestIsAsync = true;
    internals.setAccessibilityFormErrorSettleDelay(0.1);

    document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("origin-error").textContent = "Please enter a valid origin.";

        // Reading the tree here is what an attached assistive technology does at any moment, and it
        // applies every pending change right now rather than after this listener returns.
        accessibilityController.accessibleElementById("origin-error");
    });

    function axElement(id) {
        return accessibilityController.accessibleElementById(id);
    }

    setTimeout(async function() {
        output += expect("axElement('origin').stringAttributeValue('AXInvalid')", "'false'");

        document.getElementById("submit").click();

        output += await expectAsync("axElement('origin').stringAttributeValue('AXInvalid')", "'true'");
        output += await expectAsync("errorMessageText(axElement('origin'))", "'Please enter a valid origin.'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
