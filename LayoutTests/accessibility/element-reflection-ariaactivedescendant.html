<!DOCTYPE html>
<script src="../resources/js-test.js"></script>
<script src="../resources/accessibility-helper.js"></script>
<ul id="target1" role="menubar" tabindex="0">
  <li id="descendant1" role="menuitem">a</li>
</ul>
<ul id="target2" role="menubar" tabindex="0">
  <li id="descendant2" role="menuitem">b</li>
</ul>
<ul id="target3" role="menubar" tabindex="0">
  <li id="descendant3" role="menuitem">c</li>
</ul>

<script>
  description("Checks that element reflection is exposed to the a11y tree for 'ariaActiveDescendantElement'");
  if (!window.accessibilityController) {
    debug("This test requires accessibilityController");
  } else {
    window.jsTestIsAsync = true

    var ax = accessibilityController;
    var axTarget2, axDescendant1, axDescendant2, axDescendantFirstChild, axDescendant3, focusedElement;
    var output = "";

    // Focusing a menubar makes its active descendant the focused element.
    async function focusAndWaitForFocusedElement(target, expectedElement) {
        target.focus();
        await waitFor(() => {
            focusedElement = accessibilityController.focusedElement;
            return focusedElement && focusedElement.isEqual(expectedElement);
        });
    }

    async function runTest() {
        target1.ariaActiveDescendantElement = descendant1;
        axDescendant1 = accessibilityController.accessibleElementById("descendant1");
        await focusAndWaitForFocusedElement(target1, axDescendant1);
        output += expect("focusedElement.isEqual(axDescendant1)", "true");

        target2.ariaActiveDescendantElement = descendant2;
        target2.setAttribute("aria-activedescendant", "descendant2");
        axTarget2 = accessibilityController.accessibleElementById("target2");
        axDescendant2 = accessibilityController.accessibleElementById("descendant2");
        axDescendantFirstChild = axTarget2.childAtIndex(0);
        await focusAndWaitForFocusedElement(target2, axDescendantFirstChild);
        output += expect("focusedElement.isEqual(axDescendantFirstChild)", "true");

        target2.setAttribute("aria-activedescendant", "descendant2");
        await focusAndWaitForFocusedElement(target2, axDescendant2);
        output += expect("focusedElement.isEqual(axDescendant2)", "true");

        target3.ariaActiveDescendantElement = descendant3;
        descendant3.id = "descendant3-new";
        axDescendant3 = await waitForElementById("descendant3-new");
        await focusAndWaitForFocusedElement(target3, axDescendant3);
        output += expect("focusedElement.isEqual(axDescendant3)", "true");

        debug(output);
        finishJSTest();
    }

    setTimeout(runTest, 0);
  }
</script>
