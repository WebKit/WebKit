<!DOCTYPE html>
<html>
<head>
<script src="../resources/js-test.js"></script>
<script src="../resources/accessibility-helper.js"></script>
<style>
    ol {
        display: -webkit-box;
    }
    ul {
        display: -webkit-box;
    }
    li {
        display: -webkit-box;
    }
</style> 
</head>
<body id="body">
  <div>
    <div>
      <ul>
        <li id="test 1">test 1</li>
        <li>test 2</li>
      </ul>
    </div>
  </div>
  <div>
    <div>
      <ol>
        <li id="test a">test a</li>
        <li>test b</li>
      </ol>
    </div>
  </div>

    <script>
        var output = "";
        
        if (window.accessibilityController) {
            var olListElement = window.accessibilityController.accessibleElementById("test 1");
            output += 'il in ol role: ' + olListElement.role + "\n\n";

            var ulListElement = window.accessibilityController.accessibleElementById("test a");
            output += 'il in ul role: ' + ulListElement.role + "\n\n";
            
            debug(output);
        }
    </script>
</body>
</html>
