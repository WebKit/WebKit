<!DOCTYPE HTML><!-- webkit-test-runner [ AccessibilityFormErrorDetectionEnabled=true ] -->
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
</head>
<body>

<form id="form">
  <label for="email">Email</label><input id="email" type="email" value="a@b.c">
  <button id="submit" type="submit">Sign in</button>
</form>

<input id="outside" type="text" form="form" value="outside the form element">
<input id="unowned" type="text" value="no form at all">

<div id="container"></div>

<script>
var output = "This tests that a control reports the form it belongs to through AXFormOwner. That is how an assistive technology gets from a submit button to the form it submits. Membership is read from the DOM rather than remembered, so a form built by script answers the same as one that was parsed, and a control moved out of a form stops reporting an owner.\n\n";

if (window.accessibilityController) {
    window.jsTestIsAsync = true;

    function formOwnerIdentifier(fieldIdentifier) {
        var field = accessibilityController.accessibleElementById(fieldIdentifier);
        if (!field)
            return "no such field";

        var owner = field.formOwnerElement();
        return owner ? owner.domIdentifier : "none";
    }

    setTimeout(async function() {
        output += expect("formOwnerIdentifier('email')", "'form'");

        // The button takes no input, but reaching the form from it is the path that matters most.
        output += expect("formOwnerIdentifier('submit')", "'form'");

        // Associated by the form attribute rather than by containment, so a subtree walk would miss it.
        output += expect("formOwnerIdentifier('outside')", "'form'");

        output += expect("formOwnerIdentifier('unowned')", "'none'");

        // Built after the tree already exists, so none of this form was seen at parse time.
        output += evalAndReturn("var created = document.createElement('form');"
            + "created.id = 'createdForm';"
            + "var field = document.createElement('input');"
            + "field.id = 'createdField'; field.type = 'text';"
            + "created.appendChild(field);"
            + "document.getElementById('container').appendChild(created);");

        output += await expectAsync("formOwnerIdentifier('createdField')", "'createdForm'");

        // Moved out, so it belongs to nothing now.
        output += evalAndReturn("document.getElementById('container').appendChild(document.getElementById('createdField'));");

        output += await expectAsync("formOwnerIdentifier('createdField')", "'none'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
