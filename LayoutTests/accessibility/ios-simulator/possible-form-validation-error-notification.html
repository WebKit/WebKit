<!DOCTYPE HTML><!-- webkit-test-runner [ AccessibilityFormErrorDetectionEnabled=true ] -->
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
</head>
<body>

<form id="form">
  <label for="origin">From</label><input id="origin" type="text">
  <div id="origin-error"></div>
  <button id="submit" type="submit">Search</button>
</form>

<script>
var output = "This tests that iOS is told about a submission that reported a validation error nothing announced, and that the message it carries is the text the page put on screen. The notification is what an assistive technology has to work from, since nothing about a plain div says an error appeared.\n\n";

if (window.accessibilityController) {
    window.jsTestIsAsync = true;
    internals.setAccessibilityFormErrorSettleDelay(0.1);

    var notifications = 0;
    var payload = "";
    accessibilityController.addNotificationListener(function(element, notification, userInfo) {
        if (notification != "AXPossibleFormValidationError")
            return;
        notifications++;
        payload = formatFormValidationUserInfo(userInfo);
    });

    document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("origin-error").textContent = "Please enter a valid origin.";
    });

    function axElement(id) {
        return accessibilityController.accessibleElementById(id);
    }

    setTimeout(async function() {
        output += expect("axElement('origin').stringAttributeValue('AXInvalid')", "'false'");

        document.getElementById("submit").click();

        output += await expectAsync("notifications", "1");
        output += expect("payload", "'AXFormValidationUnannouncedText: Please enter a valid origin.\\n'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
