<!DOCTYPE HTML><!-- webkit-test-runner [ AccessibilityFormErrorDetectionEnabled=true ] -->
<html>
<head>
<script src="../resources/accessibility-helper.js"></script>
<script src="../resources/js-test.js"></script>
<style>
.field-error { color: #c62828; }
</style>
</head>
<body>

<!-- Associated with the form by id from before it, so it is not found by searching the form's subtree. -->
<label for="promo">Promo code</label><input id="promo" type="text" form="checkout">

<form id="checkout">
  <!-- A field the page built itself comes before the native fields on the page, though it is not one of the form's listed elements. -->
  <div id="gift-message" role="textbox" contenteditable="true" aria-label="Gift message"></div>
  <label for="name">Name</label><input id="name" type="text">
  <div id="name-error" class="field-error"></div>
  <label for="email">Email</label><input id="email" type="text">
  <div id="email-error" class="field-error"></div>
  <!-- Not rendered, so the user can't reach it to fix it. -->
  <label for="company">Company</label><input id="company" type="text" style="display: none">
  <input id="token" type="hidden" value="abc">
  <button id="submit" type="submit">Place order</button>
</form>

<script>
var output = "This tests that the possible form validation error notification lists the fields of the form it is about, in the order they come on the page, so an assistive technology can offer them without searching the form for them. The list includes a field associated with the form by its form attribute from outside it and a field the page built itself, and leaves out a field that isn't rendered.\n\n";

if (window.accessibilityController) {
    window.jsTestIsAsync = true;
    internals.setAccessibilityFormErrorSettleDelay(0.1);

    var payload = "";
    var fields;
    accessibilityController.addNotificationListener((element, notification, userInfo) => {
        if (notification == "AXPossibleFormValidationError") {
            payload = formatFormValidationUserInfo(userInfo);
            fields = userInfo["AXFormValidationFields"].map((field) => field.domIdentifier).join(", ");
        }
    });

    document.getElementById("checkout").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("name-error").textContent = "Enter your name.";
        document.getElementById("email-error").textContent = "Enter a valid email address.";
    });

    function axElement(id) {
        return accessibilityController.accessibleElementById(id);
    }

    setTimeout(async function() {
        output += expect("axElement('name').stringAttributeValue('AXInvalid')", "'false'");

        axElement("submit").press();

        output += await expectAsync("payload", "'AXFormValidationUnannouncedText: Enter your name. | Enter a valid email address.\\nAXFormValidationErrorFieldCount: 2\\n'");
        output += expect("fields", "'promo, gift-message, name, email'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
