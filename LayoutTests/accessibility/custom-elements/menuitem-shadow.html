<!DOCTYPE html>
<html>
<body>
<script src="../../resources/js-test.js"></script>
<script src="../../resources/accessibility-helper.js"></script>
<custom-menu id="menu-1" tabindex="0">
<div id="host">
<custom-menuitem id="item-1" aria-label="item 1"></custom-menuitem>
<custom-menuitem id="item-2" aria-label="item 2"></custom-menuitem>
</div>
<script>

class CustomMenuElement extends HTMLElement {
    constructor()
    {
        super();
        const internals = this.attachInternals();
        internals.role = 'menubar';
        internals.ariaActiveDescendantElement = document.getElementById('item-2');
        window.customMenuInternals = internals;
        shouldBe('customMenuInternals.ariaActiveDescendantElement', 'document.getElementById("item-2")');
    }
};
customElements.define('custom-menu', CustomMenuElement);

class CustomMenuItemElement extends HTMLElement {
    constructor()
    {
        super();
        const internals = this.attachInternals();
        internals.role = 'menuitem';
    }
}
customElements.define('custom-menuitem', CustomMenuItemElement);

const shadowRoot = host.attachShadow({mode: 'closed'});
shadowRoot.innerHTML = '<custom-menu id="menu-1"><slot></slot></custom-menu>';

description("This tests that aria fallback roles work correctly.");
if (!window.accessibilityController)
    debug('This test requires accessibilityController');
else {
    window.jsTestIsAsync = true;
    // ARIA menu items have no selected state, so only ATSPI reports the active one as selected.
    var activeDescendantIsSelected = accessibilityController.platformName == "atspi";

    setTimeout(async function() {
        // Focusing a menubar makes its active descendant the focused element.
        document.getElementById("menu-1").focus();
        await waitFor(() => accessibilityController.focusedElement && accessibilityController.focusedElement.domIdentifier == "item-2");
        shouldBeEqualToString('platformValueForW3CName(accessibilityController.focusedElement)', 'item 2');
        shouldBe('accessibilityController.focusedElement.isSelected', 'activeDescendantIsSelected');
        finishJSTest();
    }, 0);
}

</script>
</body>
</html>
