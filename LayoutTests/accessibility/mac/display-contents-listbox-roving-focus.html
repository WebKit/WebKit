<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
<style>
.input-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 4px;
}
/* The listbox generates no box, so its options are flex items of .input-container. */
.tokens-listbox {
    display: contents;
}
.token {
    display: flex;
    align-items: center;
}
.input-wrapper {
    flex: auto;
}
</style>
</head>
<body>

<div id="content">
<div role="none" class="input-container">
    <div id="listbox" role="listbox" aria-label="Items" tabindex="-1" class="tokens-listbox"></div>
    <div class="input-wrapper">
        <div id="combobox" role="combobox" tabindex="0" contenteditable="plaintext-only" aria-autocomplete="list" aria-expanded="false" aria-label="Translation languages"></div>
    </div>
</div>
</div>

<script>
var output = "This test ensures that focus is exposed correctly when it moves between the options of a display:contents listbox with a roving tabindex, including when the focused option is removed.\n\n";

var listboxElement = document.getElementById("listbox");
var comboboxElement = document.getElementById("combobox");
var labels = ["English", "French", "Portuguese"];
var activeIndex = labels.length - 1;

function optionElements() {
    return Array.from(listboxElement.querySelectorAll("[role='option']"));
}

// Like the selected items of a multi-select combobox, rebuild every option whenever the items change, giving only
// the active option a tabindex of 0. While the options have focus, the active option is the selected one.
function renderOptions() {
    const hasFocus = listboxElement.contains(document.activeElement);
    listboxElement.textContent = "";
    labels.forEach((label, index) => {
        const option = document.createElement("div");
        option.id = label.toLowerCase();
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", hasFocus && index === activeIndex);
        option.tabIndex = index === activeIndex ? 0 : -1;
        option.innerHTML = `<span class="token" contenteditable="false"><span>${label}</span><span aria-hidden="true"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 4L16 16M16 4L4 16" stroke="currentColor"/></svg></span></span>`;
        listboxElement.appendChild(option);
    });
}

function focusOption(index) {
    activeIndex = index;
    optionElements().forEach((option, i) => {
        option.tabIndex = i === index ? 0 : -1;
        option.setAttribute("aria-selected", i === index);
    });
    optionElements()[index].focus();
}

listboxElement.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft")
        focusOption(Math.max(0, activeIndex - 1));
    else if (event.key === "ArrowRight" && activeIndex === labels.length - 1)
        comboboxElement.focus();
    else if (event.key === "ArrowRight")
        focusOption(activeIndex + 1);
    else if (event.key === "Home")
        focusOption(0);
    else if (event.key === "End")
        focusOption(labels.length - 1);
    else if (event.key === "Delete") {
        labels.splice(activeIndex, 1);
        activeIndex = Math.min(activeIndex, labels.length - 1);
        renderOptions();
        optionElements()[activeIndex].focus();
    } else
        return;
    event.preventDefault();
});

// Like the combobox of a multi-select, pressing left arrow at the start of the combobox moves focus to the active option.
comboboxElement.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowLeft")
        return;
    event.preventDefault();
    focusOption(activeIndex);
});

renderOptions();

var focusNotificationCount = 0;
var previousFocusNotificationCount = 0;
var selectedChildrenNotificationCount = 0;
async function pressKeyAndExpectFocus(key, expectedId) {
    previousFocusNotificationCount = focusNotificationCount;
    eventSender.keyDown(key);
    output += await expectAsync("accessibilityController.focusedElement?.domIdentifier", `'${expectedId}'`);
    output += await expectAsync("focusNotificationCount > previousFocusNotificationCount", "true");
}

if (window.accessibilityController) {
    window.jsTestIsAsync = true;

    var listbox, focusedOption, frenchBeforeRemoval;
    setTimeout(async function() {
        listbox = await waitForElementById("listbox");
        await waitFor(() => listbox.childrenCount === 3);
        accessibilityController.addNotificationListener((element, notification) => {
            if (notification == "AXFocusChanged")
                ++focusNotificationCount;
            else if (notification == "AXSelectedChildrenChanged" && element.domIdentifier == "listbox")
                ++selectedChildrenNotificationCount;
        });

        output += "Focusing the listbox, which generates no box, does nothing.\n";
        comboboxElement.focus();
        await waitFor(() => accessibilityController.focusedElement?.domIdentifier === "combobox");
        listboxElement.focus();
        output += expect("document.activeElement.id", "'combobox'");
        output += expect("listbox.isFocused", "false");

        output += "\nPressing left arrow in the combobox to focus the last option.\n";
        await pressKeyAndExpectFocus("leftArrow", "portuguese");
        focusedOption = accessibilityController.focusedElement;
        output += expect("focusedOption.role", "'AXRole: AXStaticText'");
        output += expect("focusedOption.isFocused", "true");
        output += expect("focusedOption.parentElement().isEqual(listbox)", "true");
        output += await expectAsync("listbox.selectedChildren()[0]?.domIdentifier", "'portuguese'");

        output += "\nPressing left arrow to move focus to #french.\n";
        await pressKeyAndExpectFocus("leftArrow", "french");
        output += expect("accessibilityController.accessibleElementById('portuguese').isFocused", "false");
        output += expect("accessibilityController.accessibleElementById('french').isFocused", "true");
        output += await expectAsync("listbox.selectedChildren()[0]?.domIdentifier", "'french'");
        output += await expectAsync("selectedChildrenNotificationCount > 0", "true");

        output += "\nPressing home to move focus to #english.\n";
        await pressKeyAndExpectFocus("home", "english");
        output += await expectAsync("listbox.selectedChildren()[0]?.domIdentifier", "'english'");

        output += "\nPressing end to move focus to #portuguese.\n";
        await pressKeyAndExpectFocus("end", "portuguese");

        output += "\nPressing delete to remove the focused option, which rebuilds the options and focuses the new #french.\n";
        frenchBeforeRemoval = accessibilityController.accessibleElementById("french");
        await pressKeyAndExpectFocus("delete", "french");
        output += await expectAsync("listbox.childrenCount", "2");
        output += expect("childDOMIdentifiers(listbox)", "'english, french'");
        output += expect("accessibilityController.focusedElement.isEqual(frenchBeforeRemoval)", "false");
        output += expect("accessibilityController.focusedElement.isFocused", "true");
        output += expect("accessibilityController.focusedElement.parentElement().isEqual(listbox)", "true");
        output += await expectAsync("listbox.selectedChildren()[0]?.domIdentifier", "'french'");

        output += "\nPressing right arrow on the last option to move focus back to the combobox.\n";
        await pressKeyAndExpectFocus("rightArrow", "combobox");
        output += expect("accessibilityController.accessibleElementById('french').isFocused", "false");

        output += "\nMoving focus to #english with an AX focus request.\n";
        accessibilityController.accessibleElementById("english").takeFocus();
        output += await expectAsync("document.activeElement.id", "'english'");
        output += await expectAsync("accessibilityController.focusedElement?.domIdentifier", "'english'");

        accessibilityController.removeNotificationListener();
        document.getElementById("content").style.display = "none";
        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
