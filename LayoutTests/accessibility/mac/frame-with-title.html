<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
</head>
<body id="body">

<iframe id="frame1" src="image-map2.html" width=100 height=100 name="packageListFrame" title="All Packages">
</iframe>

<iframe id="frame2" src="image-map2.html" width=100 height=100 name="packageListFrame" >
</iframe>

<script>
var output = "This test makes sure that a frame with a title will use that value instead of the name.\n\n";

var focusedDescription;

// Read the focused element from inside the focus notification rather than polling for it, so this
// also checks we answer with the right one at the moment assistive technologies are told to look.
function focusAndReadFocusedElementAtNotification(id) {
    return new Promise(resolve => {
        accessibilityController.addNotificationListener((axElement, notification) => {
            if (notification != "AXFocusChanged")
                return;
            accessibilityController.removeNotificationListener();
            let focusedElement = accessibilityController.focusedElement;
            resolve(focusedElement ? focusedElement.description : "no focused element");
        });
        document.getElementById(id).focus();
    });
}

if (window.accessibilityController) {
    window.jsTestIsAsync = true;

    setTimeout(async function() {
        focusedDescription = await focusAndReadFocusedElementAtNotification("frame1");
        output += expect("focusedDescription", "'AXDescription: All Packages'");

        focusedDescription = await focusAndReadFocusedElementAtNotification("frame2");
        output += expect("focusedDescription", "'AXDescription: packageListFrame'");

        debug(output);
        finishJSTest();
    }, 0);
}
</script>

</body>
</html>
