<!DOCTYPE html><!-- webkit-test-runner [ HTMLEnhancedSelectMultipleDropdownBoxEnabled=true ] -->
<html>
<head>
<script src="../../resources/accessibility-helper.js"></script>
<script src="../../resources/js-test.js"></script>
<style>
.base, .base::picker(select) {
    appearance: base-select;
}
</style>
</head>
<body>

<select id="nativeMultiple" multiple size="1">
    <option id="nativeMultipleCheese" selected>Cheese</option>
    <option id="nativeMultipleHam">Ham</option>
    <option selected>Olives</option>
</select>

<select id="baseMultiple" class="base" multiple size="1">
    <option id="baseMultipleCheese" selected>Cheese</option>
    <option id="baseMultipleHam">Ham</option>
    <option selected>Olives</option>
</select>

<select id="nativeButton">
    <button>Fruit: <selectedcontent></selectedcontent></button>
    <option>Apple</option>
    <option id="nativeButtonBanana">Banana</option>
</select>

<select id="baseButton" class="base">
    <button>Fruit: <selectedcontent></selectedcontent></button>
    <option>Apple</option>
    <option id="baseButtonBanana">Banana</option>
</select>

<select id="nativeNestedButton">
    <button><span>Fruit: </span><selectedcontent></selectedcontent></button>
    <option>Apple</option>
    <option>Banana</option>
</select>

<select id="baseNestedButton" class="base">
    <button><span>Fruit: </span><selectedcontent></selectedcontent></button>
    <option>Apple</option>
    <option>Banana</option>
</select>

<select id="nativeHiddenContent">
    <button><span aria-hidden="true">Hidden </span><span style="display: none">Not rendered </span>Fruit: <selectedcontent></selectedcontent></button>
    <option>Apple</option>
    <option id="nativeHiddenContentBanana">Banana</option>
</select>

<select id="baseHiddenContent" class="base">
    <button><span aria-hidden="true">Hidden </span><span style="display: none">Not rendered </span>Fruit: <selectedcontent></selectedcontent></button>
    <option>Apple</option>
    <option id="baseHiddenContentBanana">Banana</option>
</select>

<select id="nativeAlternativeText">
    <button><span>Fruit:</span><selectedcontent></selectedcontent><img alt="(ripe)" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></button>
    <option aria-label="Red apple">Apple</option>
    <option id="nativeAlternativeTextBanana">Banana</option>
</select>

<select id="baseAlternativeText" class="base">
    <button><span>Fruit:</span><selectedcontent></selectedcontent><img alt="(ripe)" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></button>
    <option aria-label="Red apple">Apple</option>
    <option id="baseAlternativeTextBanana">Banana</option>
</select>

<select id="nativeMultipleButton" multiple size="1">
    <button>Toppings: <selectedcontent></selectedcontent></button>
    <option id="nativeMultipleButtonCheese" selected>Cheese</option>
    <option id="nativeMultipleButtonHam">Ham</option>
    <option selected>Olives</option>
</select>

<select id="baseMultipleButton" class="base" multiple size="1">
    <button>Toppings: <selectedcontent></selectedcontent></button>
    <option id="baseMultipleButtonCheese" selected>Cheese</option>
    <option id="baseMultipleButtonHam">Ham</option>
    <option id="baseMultipleButtonOlives" selected>Olives</option>
</select>

<select id="baseMultipleButtonSpanish" class="base" multiple size="1" lang="es">
    <button>Ingredientes: <selectedcontent></selectedcontent></button>
    <option selected>Queso</option>
    <option>Tomate</option>
    <option selected>Aceitunas</option>
</select>

<script>
var output = "This test ensures that the value of a dropdown box is the text its button shows.\n\n";

function selectOnly(id, optionIds)
{
    for (const option of document.getElementById(id).options)
        option.selected = optionIds.includes(option.id);
}

async function expectValues(id, values)
{
    window.axSelect = await waitForElementById(id);
    output += `${id}:\n`;
    output += await expectAsync("axSelect.stringValue", `'AXValue: ${values[0]}'`);
    document.getElementById(`${id}Banana`).selected = true;
    output += await expectAsync("axSelect.stringValue", `'AXValue: ${values[1]}'`);
}

if (window.accessibilityController) {
    window.jsTestIsAsync = true;

    setTimeout(async function() {
        for (const id of ["nativeMultiple", "baseMultiple"]) {
            window.axSelect = await waitForElementById(id);
            output += `${id}:\n`;
            output += await expectAsync("axSelect.stringValue", "'AXValue: 2 Items'");
            selectOnly(id, [`${id}Cheese`]);
            output += await expectAsync("axSelect.stringValue", "'AXValue: Cheese'");
            selectOnly(id, [`${id}Ham`]);
            output += await expectAsync("axSelect.stringValue", "'AXValue: Ham'");
            selectOnly(id, []);
            output += await expectAsync("axSelect.stringValue", "'AXValue: 0 Items'");
        }

        for (const id of ["nativeButton", "baseButton"]) {
            window.axSelect = await waitForElementById(id);
            output += `${id}:\n`;
            output += await expectAsync("axSelect.stringValue", "'AXValue: Fruit: Apple'");
            document.getElementById(`${id}Banana`).selected = true;
            output += await expectAsync("axSelect.stringValue", "'AXValue: Fruit: Banana'");
            document.querySelector(`#${id} > button`).firstChild.data = "Pick: ";
            output += await expectAsync("axSelect.stringValue", "'AXValue: Pick: Banana'");
        }

        for (const id of ["nativeNestedButton", "baseNestedButton"]) {
            window.axSelect = await waitForElementById(id);
            output += `${id}:\n`;
            output += await expectAsync("axSelect.stringValue", "'AXValue: Fruit: Apple'");
            document.querySelector(`#${id} span`).firstChild.data = "Pick: ";
            output += await expectAsync("axSelect.stringValue", "'AXValue: Pick: Apple'");
        }

        // With base appearance the button renders, and the value is its content as accessibility reads it.
        await expectValues("nativeHiddenContent", ["Hidden Not rendered Fruit: Apple", "Hidden Not rendered Fruit: Banana"]);
        await expectValues("baseHiddenContent", ["Fruit: Apple", "Fruit: Banana"]);
        await expectValues("nativeAlternativeText", ["Fruit:Apple", "Fruit:Banana"]);
        await expectValues("baseAlternativeText", ["Fruit: Red apple (ripe)", "Fruit: Banana (ripe)"]);

        window.axSelect = await waitForElementById("nativeMultipleButton");
        output += "nativeMultipleButton:\n";
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: 2 Items'");
        selectOnly("nativeMultipleButton", ["nativeMultipleButtonHam"]);
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: Ham'");
        selectOnly("nativeMultipleButton", []);
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: 0 Items'");

        // With base appearance the selected options are listed in the language of the select.
        window.axSelect = await waitForElementById("baseMultipleButton");
        output += "baseMultipleButton:\n";
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: Cheese and Olives'");
        selectOnly("baseMultipleButton", ["baseMultipleButtonCheese", "baseMultipleButtonHam"]);
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: Cheese and Ham'");
        selectOnly("baseMultipleButton", ["baseMultipleButtonCheese", "baseMultipleButtonHam", "baseMultipleButtonOlives"]);
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: Cheese, Ham, and Olives'");
        selectOnly("baseMultipleButton", ["baseMultipleButtonHam"]);
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings: Ham'");
        selectOnly("baseMultipleButton", []);
        output += await expectAsync("axSelect.stringValue", "'AXValue: Toppings:'");

        window.axSelect = await waitForElementById("baseMultipleButtonSpanish");
        output += "baseMultipleButtonSpanish:\n";
        output += await expectAsync("axSelect.stringValue", "'AXValue: Ingredientes: Queso y Aceitunas'");

        for (const select of document.querySelectorAll("select"))
            select.style.display = "none";
        debug(output);
        finishJSTest();
    }, 0);
}
</script>
</body>
</html>
