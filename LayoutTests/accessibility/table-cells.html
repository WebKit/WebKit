<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html>
<head>
<script src="../resources/js-test.js"></script>
<script src="../resources/accessibility-helper.js"></script>
</head>
<body id="body">
    
    
    <table id="testTable" align="center" border="1" cellpadding="5" cellspacing="0">
        <caption> Example #1: Nested Stubs </caption>
        <tr>
            <th class="center" colspan="2" rowspan="2">Ruritanian<br> Population
                <br> Survey</th>
            <th class="center" rowspan="2">All<br> Genders</th>
            
            <th class="center" colspan="2">By Gender</th>
            </tr>
        <tr>
            <th class="center">Males</th>
            <th class="center">Females</th>
            </tr>
        <tr>
            
            <th align="left" rowspan="2">All Regions</th>
            <th>North</th>
            <td align="right">3333</td>
            <td align="right">1111</td>
            <td align="right">2222</td>
            </tr>
        
        <tr>
            <th>South</th>
            <td align="right">3333</td>
            <td align="right">1111</td>
            <td align="right">2222</td>
            </tr>
        <tr>
            <th>South</th>
            <td align="right">3333</td>
            <td align="right" colspan="2">1111</td>
            <td align="right">2222</td>
            </tr>
        <tr>
            <th>South</th>
            <td align="right" colspan="2">3333</td>
            <td align="right">1111</td>
            <td align="right">2222</td>
            </tr>
    </table>
    
    <script>
        var output = "";
        
        if (window.testRunner)
            testRunner.dumpAsText();

        if (window.accessibilityController) {
            var body = document.getElementById("body");
            body.focus();
            var table = accessibilityController.focusedElement.childAtIndex(0);
            
            output += "------------------------\n"; 
            output += "[0,0]\n" + table.cellForColumnAndRow(0,0).allAttributes() + "\n";
            output += "------------------------\n"; 
            output += "[3,1]\n" + table.cellForColumnAndRow(3,1).allAttributes() + "\n"; 
            output += "------------------------\n"; 
            output += "[1,1]\n" + table.cellForColumnAndRow(1,1).allAttributes() + "\n"; 
            output += "------------------------\n"; 
            output += "[2,2]\n" + table.cellForColumnAndRow(2,2).allAttributes() + "\n"; 
            output += "------------------------\n"; 
            output += "[3,5]\n" + table.cellForColumnAndRow(3,5).allAttributes() + "\n"; 
            output += "------------------------\n"; 
            output += "[100,0]\n";
            outOfRangeCell = table.cellForColumnAndRow(100,0);
            output += outOfRangeCell != null ? outOfRangeCell.allAttributes() : "";
            output += "\n";
            output += "------------------------\n";
            outOfRangeCell = table.cellForColumnAndRow(0,100);
            output += "[0,100]\n";
            output += outOfRangeCell != null ? outOfRangeCell.allAttributes() : "";
            output += "\n";
            
            debug(output);
        }
    </script>
</body>
</html>
