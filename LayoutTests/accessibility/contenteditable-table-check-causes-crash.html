<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html>
<head>
<script src="../resources/js-test.js"></script>
</head>
<body>

<script>
var output = "Ensures that this snippet does not lead to a crash in the code that detects if a table is contenteditable. Bug 87409.";
</script>

<style>
.tableStyle { display: inline-table; content: counter(section);</style>
<script>
function crash() {
  var node = document.createElement('keygen');
  node.setAttribute('autofocus', 'autofocus');
  node.setAttribute('class', 'tableStyle');
  document.documentElement.appendChild(node);
}
window.onload = crash;

debug(output);
</script>

</body>
</html>
