<!DOCTYPE html>
<head>
<!--
    Like resize-observer-iframe-scrollbar.html, but the ::-webkit-scrollbar rule sits on the
    owner iframe element. Overlay scrollbars are on so that only that custom style can make a
    scrollbar take layout space.
-->
<style>
    #container {
        width: 200px;
        height: 300px;
    }

    iframe {
        height: 100%;
        width: 100%;
        border: 0;
    }

    iframe::-webkit-scrollbar {
        width: 30px;
        background: silver;
    }

    iframe::-webkit-scrollbar-thumb {
        background: gray;
    }
</style>
<script src="../resources/js-test.js"></script>
<script>
    jsTestIsAsync = true;

    if (window.internals)
        internals.setUsesOverlayScrollbars(true);

    const maxRAFsWithoutResizeObserver = 3;
    const maxRAFsOnFailure = 10;

    let rAFFireCount = 0;
    let rAFsWithoutResizeObserverCount = 0;

    function animationFrame()
    {
        ++rAFsWithoutResizeObserverCount;
        ++rAFFireCount;
        if (rAFsWithoutResizeObserverCount == maxRAFsWithoutResizeObserver) {
            testPassed(`Got ${rAFsWithoutResizeObserverCount} rAF callbacks without Resize Observer firing`);
            finishJSTest();
            return;
        }

        if (rAFFireCount == maxRAFsOnFailure) {
            testFailed(`Got ${rAFFireCount} rAF callbacks and the Resize Observer is still firing`);
            finishJSTest();
            return;
        }

        requestAnimationFrame(animationFrame)
    }

    let resizeObserverCount = 0;
    window.addEventListener("message", (event) => {
        if (!resizeObserverCount)
            requestAnimationFrame(animationFrame)

            ++resizeObserverCount;
        rAFsWithoutResizeObserverCount = 0;
        const container = document.getElementById("container");
        container.style.height = event.data.height + "px";

    }, false);
</script>
</head>
<body>
    <div id="container">
        <iframe srcdoc="
<style>
    html {
        font: 20px/20px Ahem;
    }
    body {
        margin: 0;
    }
</style>
<body>
    <div>xxxx xxxx</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
    <div>x</div>
<script>
    const ro = new ResizeObserver(entries => {
        for (let entry of entries) {
            const cr = entry.contentRect;
            const message = {
                width: cr.width,
                height: cr.height
            };
            window.parent.postMessage(message, '*');
        }
    });
    ro.observe(document.documentElement);
</script>
</body>
    "></iframe>
    </div>
    <div id="console"></div>
</body>
</html>
