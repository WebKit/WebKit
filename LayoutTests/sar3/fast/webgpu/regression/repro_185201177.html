<!-- webkit-test-runner [ enableMetalShaderValidation=true ] -->
<script src="../../../resources/js-test-pre.js"></script>
<script>
globalThis.testRunner?.waitUntilDone();

// Group 1 declares @binding(1) before @binding(0), so its module-scope declaration order differs
// from its @binding order while both groups still present identical {binding, visibility, type}
// entry lists. The synthetic __X_ArrayLength words the WGSL emitter adds for the runtime-sized
// arrays must land in argument buffer slots chosen by @binding, not by declaration order, or the
// two groups' length slots are semantically swapped.
const wgsl = `
@group(0) @binding(0) var<storage, read_write> a0 : array<u32>;
@group(0) @binding(1) var<storage, read_write> a1 : array<u32>;
@group(1) @binding(1) var<storage, read_write> b1 : array<u32>;
@group(1) @binding(0) var<storage, read_write> b0 : array<u32>;

@compute @workgroup_size(1)
fn main() {
    a0[0] = arrayLength(&b0);
    a0[1] = arrayLength(&b1);
    b1[a1[0]] = a1[1];
    a0[2] = b1[a1[0]];
}`;

const largeBytes = 1024 * 1024;
const smallBytes = 16;

let device, pipeline, observations, inputs, bindGroup0;

// a0 collects what the shader observed, a1 supplies the index to store at and the value to store.
// 0x800 is far past the small buffer, so a swapped length slot turns the store into a device write
// 8192 bytes past a 16 byte allocation.
function createGroup0()
{
    observations = device.createBuffer({ size: 64, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    inputs = device.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE, mappedAtCreation: true });
    new Uint32Array(inputs.getMappedRange()).set([0x800, 0x41414141, 0, 0]);
    inputs.unmap();
    bindGroup0 = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: observations } },
            { binding: 1, resource: { buffer: inputs } },
        ],
    });
}

async function dispatchAndReadObservations(bindGroup1)
{
    device.pushErrorScope('validation');
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup0);
    pass.setBindGroup(1, bindGroup1);
    pass.dispatchWorkgroups(1);
    pass.end();
    const readback = device.createBuffer({ size: 64, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    encoder.copyBufferToBuffer(observations, 0, readback, 0, 64);
    device.queue.submit([encoder.finish()]);
    const error = await device.popErrorScope();
    await device.queue.onSubmittedWorkDone();
    await readback.mapAsync(GPUMapMode.READ);
    const observed = new Uint32Array(readback.getMappedRange());
    return { error, lengthOfB0: observed[0], lengthOfB1: observed[1] };
}

onload = async () => {
    try {
        const adapter = await navigator.gpu.requestAdapter();
        device = await adapter.requestDevice();
        const module = device.createShaderModule({ code: wgsl });
        pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });

        const large = device.createBuffer({ size: largeBytes, usage: GPUBufferUsage.STORAGE });
        const small = device.createBuffer({ size: smallBytes, usage: GPUBufferUsage.STORAGE });

        // A bind group encoded against group 0's layout, set at group index 1. Both layouts were
        // auto-generated by the same pipeline and have identical entries, so whether this is
        // accepted comes down to whether their argument buffer indices agree. Either outcome is
        // safe; what must never happen is the shader seeing one binding's arrayLength() while
        // dereferencing the other binding's pointer.
        createGroup0();
        const crossBindGroup = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: large } },
                { binding: 1, resource: { buffer: small } },
            ],
        });
        const crossResult = await dispatchAndReadObservations(crossBindGroup);
        const rejected = !!crossResult.error && !crossResult.lengthOfB0 && !crossResult.lengthOfB1;
        const matchesBoundBuffers = !crossResult.error
            && crossResult.lengthOfB0 === largeBytes / 4
            && crossResult.lengthOfB1 === smallBytes / 4;
        if (rejected || matchesBoundBuffers)
            testPassed("the shader never observed another binding's arrayLength");
        else
            testFailed(`arrayLength(&b0) = ${crossResult.lengthOfB0} and arrayLength(&b1) = ${crossResult.lengthOfB1}, expected ${largeBytes / 4} and ${smallBytes / 4}${crossResult.error ? ` (rejected: ${crossResult.error.message})` : ''}`);

        // Positive control: binding each group with its own auto-generated layout must keep working
        // and must report each buffer's real length, so this test cannot pass by rejecting
        // everything.
        createGroup0();
        const ownBindGroup = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(1),
            entries: [
                { binding: 0, resource: { buffer: large } },
                { binding: 1, resource: { buffer: small } },
            ],
        });
        const ownResult = await dispatchAndReadObservations(ownBindGroup);
        if (ownResult.error)
            testFailed(`a bind group made from the pipeline's own layout for group 1 was rejected: ${ownResult.error.message}`);
        else if (ownResult.lengthOfB0 === largeBytes / 4 && ownResult.lengthOfB1 === smallBytes / 4)
            testPassed("each group bound with its own auto-generated layout reads its own arrayLength");
        else
            testFailed(`with its own layout the shader read arrayLength(&b0) = ${ownResult.lengthOfB0} and arrayLength(&b1) = ${ownResult.lengthOfB1}, expected ${largeBytes / 4} and ${smallBytes / 4}`);
    } catch (e) {
        testFailed(`${e}`);
    }
    globalThis.testRunner?.notifyDone();
};
</script>
