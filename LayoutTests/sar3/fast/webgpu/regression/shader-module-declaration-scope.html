<script src="../../../resources/js-test-pre.js"></script>
<script>
globalThis.testRunner?.waitUntilDone();

// https://www.w3.org/TR/WGSL/#scope: the scope of a function-scope declaration starts just after
// the declaration, so its own initializer resolves names against the enclosing scope. WGSL's
// dependency-sorting visitor introduced the name before visiting the declaration, which made a
// module-scope declaration invisible to it whenever a local shadowed it, dropping the dependency
// edge on the shadowed declaration.

// A compute entry point may use workgroup storage, shadowing local or not.
const workgroupInCompute = `
var<workgroup> w : u32;
@group(0) @binding(0) var<storage, read_write> out : array<u32>;
@compute @workgroup_size(1) fn main() {
    var w : u32 = w;
    out[0] = w;
}`;

// `g` in the initializer is the module-scope function, so `f` depends on `g` and `g` has to be
// sorted before it. The dependency edge used to be dropped, `g` stayed after `f`, and this valid
// module was rejected with "unresolved call target 'g'".
const forwardDependency = `
fn f() -> u32 { var g : u32 = g(); return g; }
fn g() -> u32 { return 7u; }
@compute @workgroup_size(1) fn main() { _ = f(); }`;

// The same module with `g` already ahead of `f`, which compiled either way: it isolates the failure
// above to the sorting rather than to name resolution.
const forwardDependencyPresorted = `
fn g() -> u32 { return 7u; }
fn f() -> u32 { var g : u32 = g(); return g; }
@compute @workgroup_size(1) fn main() { _ = f(); }`;

// The same lost edge for a module-scope variable rather than a function. This was rejected with
// "unresolved identifier 'g'".
const forwardVariableDependency = `
fn f() -> u32 { var g : u32 = g; return g; }
var<private> g : u32 = 7u;
@compute @workgroup_size(1) fn main() { _ = f(); }`;

let device;

async function compile(code)
{
    device.pushErrorScope('validation');
    const module = device.createShaderModule({ code });
    const messages = (await module.getCompilationInfo()).messages;
    const error = await device.popErrorScope();
    const errors = messages.filter(message => message.type === 'error').map(message => message.message);
    if (error && !errors.length)
        errors.push(error.message);
    return errors;
}

async function shouldCompile(description, code)
{
    const errors = await compile(code);
    if (!errors.length)
        testPassed(description);
    else
        testFailed(`${description}: ${JSON.stringify(errors)}`);
}

onload = async () => {
    try {
        const adapter = await navigator.gpu.requestAdapter();
        device = await adapter.requestDevice();

        await shouldCompile('workgroup storage in a compute entry point still compiles',
            workgroupInCompute);

        await shouldCompile('a shadowing local does not drop the dependency on the declaration it shadows',
            forwardDependency);
        await shouldCompile('the same module compiles when the dependency is already declared first',
            forwardDependencyPresorted);
        await shouldCompile('a shadowing local does not drop the dependency on a later module-scope variable',
            forwardVariableDependency);
    } catch (e) {
        testFailed(`${e}`);
    }
    globalThis.testRunner?.notifyDone();
};
</script>
