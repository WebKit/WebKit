<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Testing media controls in XHTML</title>
<meta http-equiv="content-type" content="application/xhtml+xml; charset=iso-8859-1" />
<script src="../../../resources/js-test.js"></script>
</head>
<body>
<video src="../../content/test.mp4" controls="true"></video>
<script type="text/javascript">
jsTestIsAsync = true;
description("Testing that media controls are correctly created in an XHTML document.");
const media = document.querySelector("video");
shouldBecomeDifferent("window.internals.shadowRoot(media)", "null", () => {
    shouldBeTrue("window.internals.shadowRoot(media).querySelector('.media-controls') instanceof HTMLDivElement");
    finishJSTest();
});
</script>
</body>
</html>
