<script src="../../../resources/js-test.js"></script>
<script src="../resources/media-controls-utils.js" type="text/javascript"></script>
<body>
<video controls style="cursor: wait"></video>
<script type="text/javascript">
jsTestIsAsync = true;

description("Testing that setting 'cursor: wait' on the &lt;video> element is respected in the media controls shadow root.");

const media = document.querySelector("video");
shouldBecomeDifferent("internals.shadowRoot(media)", "null", () => {
    shouldBeEqualToString("getComputedStyle(window.internals.shadowRoot(media).querySelector('.media-controls-container')).cursor", "wait");
    finishJSTest();
});

</script>
</body>
