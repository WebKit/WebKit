<!-- webkit-test-runner [ SpatialVideoRenderingEnabled=true ] -->
<!DOCTYPE html>
<script src="../../../resources/js-test.js"></script>
<script src="../resources/media-controls-loader.js" type="text/javascript"></script>
<body>
<video src="../../content/test.mp4" style="width: 320px; height: 240px;" projection="equirectangular"></video>
<div id="shadow"></div>
<script type="text/javascript">

description("Testing that <code>SpatialVideoSupport</code> renders again after the media controls are disabled and re-enabled, as they are when a video enters and leaves fullscreen on iOS.");

window.jsTestIsAsync = true;

const media = document.querySelector("video");
const shadowRoot = document.querySelector("div#shadow").attachShadow({ mode: "open" });
const container = shadowRoot.appendChild(document.createElement("div"));

media.addEventListener("loadedmetadata", () => {
    window.support = new SpatialVideoSupport({
        media,
        host: { spatialVideoRenderingEnabled: true },
        shadowRoot,
        container,
    });

    shouldBeTrue("support._active");
    shouldBeTrue("!!support._canvas");

    debug("");
    debug("Disabling the controls tears the renderer down:");
    support.disable();
    shouldBeFalse("support._active");
    shouldBeNull("support._canvas");

    debug("");
    debug("Re-enabling them brings it back:");
    support.enable();
    shouldBeTrue("support._active");
    shouldBeTrue("!!support._canvas");

    media.remove();
    shadowRoot.host.remove();
    finishJSTest();
}, { once: true });

</script>
</body>
