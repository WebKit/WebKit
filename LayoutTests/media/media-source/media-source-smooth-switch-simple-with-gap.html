<!DOCTYPE html>
<html>
<head>
    <title>media-source-smooth-switch-simple-with-gap</title>
    <script src="mock-media-source.js"></script>
    <script src="../video-test.js"></script>
    <script src="smooth-switch-test.js"></script>
    <script>
    smoothSwitchTest(async () => {
        run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, 2)');
        await sourceBufferAppend(1, [[0, 3], [3, 6], [6, 9], [12, 15]]);
        await showEnqueuedSamples();

        await sourceBufferAppend(2, [[0, 3], [3, 6]]);
        await sourceBufferAppend(3, [[9, 12]]);
        run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, QUEUE_DEPTH_UNLIMITED)');

        consoleWrite("<br>The first GOP was already partially enqueued so it must stay in the old generation, followed by the second GOP of the new generation.");
        consoleWrite("The GOP between times 12 and 15 that was present in the first generation followed by a gap, must still be there.");
        consoleWrite("The gap must have been correctly filled by the third generation.");
        await showEnqueuedSamples();
        await showBufferedSamples();
    });
    </script>
</head>
<body>
    <video controls></video>
</body>
</html>
