<!DOCTYPE html>
<html>

<head>
  <title>media-source-smooth-switch-twice</title>
  <script src="mock-media-source.js"></script>
  <script src="../video-test.js"></script>
  <script src="smooth-switch-test.js"></script>
  <script>
    smoothSwitchTest(async () => {
      run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, 7)');
      await sourceBufferAppend(1, [[0, 8]]);
      await showEnqueuedSamples();

      await sourceBufferAppend(2, [[2, 10]]);
      run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, 8)');
      consoleWrite("<br>Samples of the second generation must be enqueued as non-displaying.")
      await showEnqueuedSamples();

      await sourceBufferAppend(3, [[4, 12]]);
      run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, QUEUE_DEPTH_UNLIMITED)');
      consoleWrite("<br>Samples of the third generation must also be enqueued as non-displaying, but only up to the end of the generation 1 GOP.");
      consoleWrite("No more samples of the second generation must be enqueued, since they are no longer useful to catch-up the decoder.");
      await showEnqueuedSamples();
      await showBufferedSamples();
    });
  </script>
</head>

<body>
  <video controls></video>
</body>

</html>
