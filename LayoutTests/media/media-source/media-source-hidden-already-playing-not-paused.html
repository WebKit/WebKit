<!DOCTYPE html> <!-- webkit-test-runner [ MediaSourceEnabled=true ] -->
<html>
<head>
    <title>media-source-hidden-already-playing-not-paused</title>
    <script src="../../media/media-source/media-source-loader.js"></script>
    <script src="../../media/video-test.js"></script>
    <script src="../../media/utilities.js"></script>
    <script>
    async function hidePage() {
        const hidden = waitFor(document, 'visibilitychange', true);
        run('testRunner.setPageVisibility("hidden")');
        await hidden;
    }

    var loader;
    var source;
    var sourceBuffer;

    function loaderPromise(loader) {
        return new Promise((resolve, reject) => {
            loader.onload = resolve;
            loader.onerror = reject;
        });
    }

    async function appendUntil(time) {
        do {
            sourceBuffer.timestampOffset = sourceBuffer.buffered.length ? sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1) : 0;
            sourceBuffer.appendBuffer(loader.mediaSegment(0));
            await once(sourceBuffer, 'update');
        } while (sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1) < time);
    }

    window.addEventListener('load', async event => {
        try {
            findMediaElement();

            let manifests = [ 'content/test-opus-manifest.json', 'content/test-vorbis-manifest.json', 'content/test-48khz-manifest.json' ];
            for (const manifest of manifests) {
                loader = new MediaSourceLoader(manifest);
                await loaderPromise(loader);
                if (MediaSource.isTypeSupported(loader.type()))
                    break;
            }

            waitFor(video, 'error').then(failTest);

            run('internals.setMediaElementRestrictions(video, "RequireUserGestureToStartAudiblePlaybackWhenHidden")');
            run('internals.setMediaElementGracePeriodForResumingPlaybackInBackground(video, 0)');

            run('source = new MediaSource()');
            run('video.src = URL.createObjectURL(source)');
            await waitFor(source, 'sourceopen');

            run('sourceBuffer = source.addSourceBuffer(loader.type())');
            run('sourceBuffer.appendBuffer(loader.initSegment())');
            await waitFor(sourceBuffer, 'update');

            consoleWrite('Appending 10s of data');
            await appendUntil(10);

            await shouldResolve(run('video.play()'));

            video.addEventListener('pause', () => failTest('Playing media was paused while hidden'));

            await hidePage();

            run('video.volume = 0.5');
            await sleepFor(100);
            testExpected('video.paused', false);

            run('video.muted = true');
            run('video.muted = false');
            await sleepFor(100);
            testExpected('video.paused', false);

            await shouldResolve(run('video.play()'));

            consoleWrite('Removing buffered data ahead of the current position to force a rebuffer');
            run('sourceBuffer.remove(video.currentTime + 0.5, source.duration)');
            await Promise.all([waitFor(video, 'waiting'), waitFor(sourceBuffer, 'update', true)]);

            let resumed = waitFor(video, 'playing');
            consoleWrite('Appending more data');
            await appendUntil(video.currentTime + 5);
            await resumed;
            testExpected('video.paused', false);

            endTest();
        } catch (e) {
            failTest(`Caught exception: "${e}"`);
        }
    });
    </script>
</head>
<body>
    <video></video>
</body>
</html>
