<!DOCTYPE html>
<html>
<head>
    <title>media-source-smooth-need-to-rewind</title>
    <script src="mock-media-source.js"></script>
    <script src="../video-test.js"></script>
    <script src="smooth-switch-test.js"></script>
    <script>
    smoothSwitchTest(async () => {
        run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, 5)');
        await sourceBufferAppend(1, [[0, 3], [3, 6], [6, 9], [15, 18]]);
        await showEnqueuedSamples();

        await sourceBufferAppend(2, [[3, 11]]);
        run('internals.setMaximumQueueDepthForTrackID(sourceBuffer, TRACK_ID, QUEUE_DEPTH_UNLIMITED)');
        consoleWrite("<br>Since this GOP extends past the discontinuity boundary, the browser needs to enqueue all the samples.")
        consoleWrite("New samples with PTS less or equal than highestEnqueuedPresentationTime are marked as non-displaying.")
        await showEnqueuedSamples();
        await showBufferedSamples();
    });
    </script>
</head>
<body>
    <video controls></video>
</body>
</html>
