<!DOCTYPE html>
<html>
<head>
    <script src=../video-test.js></script>
    <script type="text/javascript">
    var mock;
    var promise;
    var mediaKeySystemAccess;
    var mediaKeys;
    var mediaKeySession;
    var capabilities = {};
    var initData;

    function doTest()
    {
        if (!window.internals) {
            failTest("Internals is required for this test.")
            return;
        }

        run('internals.initializeMockMediaSource()');
        run('mock = internals.registerMockCDM()');
        run('mock.supportedDataTypes = ["cenc"]');
        run('capabilities.initDataTypes = ["cenc"]');
        run(`capabilities.videoCapabilities = [{ contentType: 'video/mock; codecs="mock"' }] `);
        run('promise = navigator.requestMediaKeySystemAccess("org.webkit.mock", [capabilities])');
        shouldResolve(promise).then(gotMediaKeySystemAccess, failTest);
    }

    function next() {
        if (!tests.length) {
            mock.unregister();
            endTest()
            return;
        }

        var nextTest = tests.shift();
        consoleWrite('');
        nextTest();
    }

    function gotMediaKeySystemAccess(result) {
        mediaKeySystemAccess = result;
        next();
    }

    function gotMediaKeys(result) {
        mediaKeys = result;
        next();
    }

    // "cenc" initData which is not a valid pssh box and holds no zero byte, so nothing
    // inside it can terminate a C string. The sanitizer must stay within its length.
    function unterminatedInitData(size, lastByte)
    {
        var array = new Uint8Array(size);
        array.fill(0x41);
        if (lastByte !== undefined)
            array[size - 1] = lastByte;
        return array;
    }

    tests = [
        function() {
            run('promise = mediaKeySystemAccess.createMediaKeys()');
            shouldResolve(promise).then(gotMediaKeys, failTest);
        },

        function() {
            consoleWrite('A "cenc" initData at least kCencMaxBoxSize long with no zero byte should reject.')
            run('initData = unterminatedInitData(64 * 1024)');
            run('mediaKeySession = mediaKeys.createSession("temporary")');
            run('promise = mediaKeySession.generateRequest("cenc", initData)');
            shouldReject(promise).then(next, next);
        },

        function() {
            consoleWrite('A short "cenc" initData whose first box is not a pssh box should reject.')
            run('initData = unterminatedInitData(16)');
            run('mediaKeySession = mediaKeys.createSession("temporary")');
            run('promise = mediaKeySession.generateRequest("cenc", initData)');
            shouldReject(promise).then(next, next);
        },

        function() {
            consoleWrite('A "cenc" initData whose only open angle bracket is its last byte should reject.')
            run('initData = unterminatedInitData(16, 0x3c)');
            run('mediaKeySession = mediaKeys.createSession("temporary")');
            run('promise = mediaKeySession.generateRequest("cenc", initData)');
            shouldReject(promise).then(next, next);
        },
    ];
    </script>
</head>
<body onload="doTest()">
</body>
</html>
