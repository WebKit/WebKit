<!DOCTYPE html>
<html>
<head>
<script src="../resources/js-test.js"></script>
<script type="text/javascript" src="resources/audio-testing.js"></script>
</head>
<body>
<script>
description("Test that decoding a 5.1 opus webm file succeeds");

window.jsTestIsAsync = true;

var context = new window.AudioContext({ sampleRate: 48000 });
var request = new XMLHttpRequest();
request.open("GET", 'resources/media/opus-5.1.webm', true);
request.responseType = "arraybuffer";

request.onload = function() {
    context.decodeAudioData(request.response, (buffer) => {
        testPassed("Successfully decoded content");
        if (buffer.numberOfChannels === 6)
          testPassed("Decoding returned 6 channels.");
        else
          testFailed("Decoding returned the wrong number of channels: " + buffer.numberOfChannels);
        finishJSTest();
      }, () => {
        testFailed("Failed to decode file");
        finishJSTest();
      });
}
request.send();

</script>
</body>
</html>
