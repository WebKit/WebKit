<DOCTYPE html>
<html>
<body>
<script src="../resources/js-test.js"></script>
<script>
description("Validate the value returned by AudioContext.getOutputTimestamp()");
jsTestIsAsync = true;

const audioContext = new AudioContext();
const gainNode = new GainNode(audioContext, { gain: 0.01 });
const oscillatorNode = new OscillatorNode(audioContext);

oscillatorNode.connect(gainNode).connect(audioContext.destination);
oscillatorNode.start();

handle = setInterval(() => {
    if (audioContext.currentTime < 0.1)
        return;
    clearInterval(handle);

    var timestamp = audioContext.getOutputTimestamp();
    contextTime = timestamp.contextTime;
    performanceTime = timestamp.performanceTime;
    shouldBeTrue("contextTime > 0");
    shouldBeTrue("contextTime <= audioContext.currentTime");
    shouldBeTrue("performanceTime > 0");
    finishJSTest();
}, 10);
</script>
</body>
</html>
