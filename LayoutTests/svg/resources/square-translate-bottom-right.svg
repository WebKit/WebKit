<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect x="100" y="100" width="100" height="100" fill="green">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; -100,-100"
      keyTimes="0; 0.5"
      dur="0.1s"
      begin="0s"
      fill="freeze"
      calcMode="discrete"
    />
  </rect>
</svg>
