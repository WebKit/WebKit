<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Changing only paint-order schedules a repaint</title>
<style>
    body { margin: 0; }
</style>
</head>
<body>
<svg width="100" height="100">
    <rect id="target" width="100" height="100" fill="green" stroke="red" stroke-width="20"
          style="paint-order: fill stroke markers;"/>
</svg>
<pre id="result">FAIL: test did not run.</pre>
<script>
function run() {
    const result = document.getElementById("result");
    if (!window.internals || !window.testRunner) {
        result.textContent = "This test requires window.internals and window.testRunner.";
        return;
    }
    testRunner.dumpAsText();

    const target = document.getElementById("target");

    document.body.offsetHeight;

    internals.startTrackingRepaints();

    target.style.paintOrder = "stroke fill markers";

    // Force a style recalc / layout so the difference is computed.
    document.body.offsetHeight;

    const rects = internals.repaintRectsAsText();
    internals.stopTrackingRepaints();

    if (rects.indexOf("(rect ") !== -1)
        result.textContent = "PASS: paint-order change scheduled a repaint.";
    else
        result.textContent = "FAIL: paint-order change did not schedule a repaint.\n" + rects;
}

run();
</script>
</body>
</html>
