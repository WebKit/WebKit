<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<script src="../../fast/repaint/resources/text-based-repaint.js"></script>
</head>
<body>
<svg style="position: absolute; top: 0px; left: 0px; width: 500px; height: 400px; font-family: Ahem; font-size: 100px">
<g id="group" stroke="green" stroke-width="2"><rect x="50" y="50" width="100" height="100" fill="green"/></g>
<rect id="shape" x="250" y="50" width="100" height="100" fill="green" stroke="green" stroke-width="2"/>
<text id="label" x="50" y="330" fill="green" stroke="green" stroke-width="2">X</text>
</svg>
<script>
    // The group, the rect and the text switch to a wider stroke and repaint the area it covers.
    function repaintTest() {
        for (const element of [group, shape, label])
            element.setAttribute("stroke-width", "20");
    }
    onload = runRepaintTest;
</script>
</body>
</html>
