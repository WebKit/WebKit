<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<script src="../../fast/repaint/resources/text-based-repaint.js"></script>
</head>
<body>
<svg style="position: absolute; top: 0px; left: 0px; width: 400px; height: 400px">
    <g style="transform-box: fill-box; transform-origin: center; transform: scale(2)">
        <rect x="50" y="50" width="20" height="20" fill="green"/>
        <rect id="target" x="80" y="50" width="20" height="20" fill="green"/>
    </g>
</svg>
<script>
    // Moving a rect changes the bounding box and thus the transform of the group, so the group is repainted at its old and its new place.
    function repaintTest() {
        document.getElementById("target").setAttribute("x", "120");
    }
    onload = runRepaintTest;
</script>
</body>
</html>
