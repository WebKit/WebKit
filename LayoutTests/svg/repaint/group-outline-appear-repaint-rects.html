<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<script src="../../fast/repaint/resources/text-based-repaint.js"></script>
<style>
    g.outlined { outline: 4px solid blue; }
</style>
</head>
<body>
<svg style="position: absolute; top: 0px; left: 0px; width: 400px; height: 400px">
    <g id="plain"><rect x="50" y="50" width="100" height="100" fill="green"/></g>
    <g id="layered" style="isolation: isolate"><rect x="250" y="50" width="100" height="100" fill="green"/></g>
</svg>
<script>
    // The left group has no layer of its own, the right one has. Both repaint their whole new outline.
    function repaintTest() {
        for (const id of ["plain", "layered"])
            document.getElementById(id).classList.add("outlined");
    }
    onload = runRepaintTest;
</script>
</body>
</html>
