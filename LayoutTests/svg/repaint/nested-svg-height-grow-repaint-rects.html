<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<script src="../../fast/repaint/resources/text-based-repaint.js"></script>
</head>
<body>
<svg style="position: absolute; top: 0px; left: 0px; width: 400px; height: 400px">
    <svg id="viewport" x="50" y="50" width="100" height="40"><rect width="100" height="100" fill="green"/></svg>
</svg>
<script>
    // Growing the viewport reveals the clipped part of the rect, which must be repainted.
    function repaintTest() {
        document.getElementById("viewport").setAttribute("height", "100");
    }
    onload = runRepaintTest;
</script>
</body>
</html>
