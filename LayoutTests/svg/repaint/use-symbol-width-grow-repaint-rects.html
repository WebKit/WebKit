<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<script src="../../fast/repaint/resources/text-based-repaint.js"></script>
</head>
<body>
<svg style="position: absolute; top: 0px; left: 0px; width: 400px; height: 400px">
    <symbol id="symbol"><rect width="100" height="100" fill="green"/></symbol>
    <use id="use" href="#symbol" x="50" y="50" width="40" height="100"/>
</svg>
<script>
    // Growing the use viewport reveals the clipped part of the symbol content, which must be repainted.
    function repaintTest() {
        document.getElementById("use").setAttribute("width", "100");
    }
    onload = runRepaintTest;
</script>
</body>
</html>
