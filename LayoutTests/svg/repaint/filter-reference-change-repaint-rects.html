<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<script src="../../fast/repaint/resources/text-based-repaint.js"></script>
</head>
<body>
<svg style="position: absolute; top: 0px; left: 0px; width: 500px; height: 400px">
<filter id="near" x="0" y="0" width="1" height="1"><feOffset dx="30"/></filter>
<filter id="far" x="0" y="0" width="2" height="1"><feOffset dx="60"/></filter>
<g id="group" filter="url(#near)"><rect x="50" y="50" width="100" height="100" fill="green"/></g>
<rect id="shape" x="250" y="50" width="100" height="100" fill="green" filter="url(#near)"/>
</svg>
<script>
    // The group on the left and the rect on the right switch to a filter that moves them further, and repaint the old and the new area.
    function repaintTest() {
        for (const element of [group, shape])
            element.setAttribute("filter", "url(#far)");
    }
    onload = runRepaintTest;
</script>
</body>
</html>
