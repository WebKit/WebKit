<!DOCTYPE html>
<html class="reftest-wait">
<script>
onload = () => requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("reftest-wait")));
</script>
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feFlood flood-color="green" result="flood"/>
    <feImage style="display: none" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='red'/></svg>" result="image"/>
    <feMerge>
      <feMergeNode in="flood"/>
      <feMergeNode in="image"/>
    </feMerge>
  </filter>
  <rect width="100" height="100" fill="red"/>
  <rect width="100" height="100" filter="url(#filter)"/>
</svg>
