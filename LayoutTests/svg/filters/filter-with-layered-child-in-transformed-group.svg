<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
    <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
        <feOffset dx="0" dy="0"/>
    </filter>
    <rect x="150" y="150" width="100" height="100" fill="red"/>
    <g transform="translate(100, 100)" style="isolation: isolate">
        <g filter="url(#filter)">
            <rect x="50" y="50" width="100" height="100" fill="green" style="isolation: isolate"/>
        </g>
    </g>
</svg>
