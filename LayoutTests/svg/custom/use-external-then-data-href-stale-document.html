<!DOCTYPE html>
<html class="reftest-wait">
<head>
<script>
function loaded(event) {
    var use = event.target;
    use.onload = null;
    // Switching to a data: URL must drop the previously loaded external document,
    // so nothing should be rendered (green rect must disappear).
    use.setAttribute("href", "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100' height='100' fill='red'/%3E%3C/svg%3E");
    setTimeout(function() {
        document.documentElement.classList.remove("reftest-wait");
    }, 0);
}
</script>
</head>
<body>
<p>Passes if no green or red rect is rendered below.</p>
<svg width="100" height="100">
    <use href="resources/use-external-green-rect.svg" onload="loaded(evt)"/>
</svg>
</body>
</html>
