<!DOCTYPE html><!-- webkit-test-runner [ UseGPUProcessForDOMRenderingEnabled=true LayerBasedSVGEngineEnabled=true ] -->
<title>SVG pattern fill, stroke and non-scaling stroke repaint with their tiles after the GPU process crashes</title>
<svg width="450" height="150">
    <defs>
        <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="green"/>
            <rect x="10" y="10" width="10" height="10" fill="blue"/>
        </pattern>
    </defs>
    <rect x="10" y="10" width="130" height="130" fill="url(#checker)"/>
    <rect x="170" y="20" width="110" height="110" fill="none" stroke="url(#checker)" stroke-width="20"/>
    <g transform="scale(2)">
        <rect x="160" y="10" width="55" height="55" fill="none" stroke="url(#checker)" stroke-width="20" vector-effect="non-scaling-stroke"/>
    </g>
</svg>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

function nextFrame()
{
    return new Promise(resolve => requestAnimationFrame(() => resolve()));
}

window.addEventListener("load", async () => {
    // Let the first paint reach the GPU process, then crash it. The page repaints with the
    // same content once the connection to the new GPU process is made.
    await nextFrame();
    await nextFrame();
    if (window.testRunner)
        testRunner.terminateGPUProcess();
    await new Promise(resolve => setTimeout(resolve, 100));
    await nextFrame();
    await nextFrame();
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
