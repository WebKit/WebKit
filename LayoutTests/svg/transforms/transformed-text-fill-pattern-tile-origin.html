<!DOCTYPE html>
<html>
<head>
<title>SVG text filled with a pattern that has a non-zero tile origin, inside a scaled container</title>
<!-- The pattern tile origin must end up in the same place for text as it does
     for a shape covering the same area, even though text painting removes the
     scaling part of the CTM. https://bugs.webkit.org/show_bug.cgi?id=291897 -->
</head>
<body>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
 <defs>
   <pattern id="pat" patternUnits="userSpaceOnUse" x="5" y="5" width="10" height="10">
     <rect width="10" height="10" fill="#00aa00"/>
     <rect width="5" height="5" fill="#0000ff"/>
   </pattern>
 </defs>
 <!-- Ahem renders 'A' as a solid box covering the whole em box, i.e. the user
      space rect (10, 10, 50, 50) for this text element. -->
 <g transform="scale(4)">
  <text x="10" y="50" font-family="Ahem" font-size="50" fill="url(#pat)">A</text>
 </g>
</svg>
</body>
</html>
