<!DOCTYPE html>
<html>
<head>
<title>SVG text decoration filled with a pattern, inside a scaled container</title>
<!-- The underline is painted with the same paint server as the glyphs, so the
     pattern tile must have the same size for both, even though text painting
     removes the scaling part of the CTM. https://bugs.webkit.org/show_bug.cgi?id=291897
     The text is a single Ahem space so that only the decoration is inked. -->
</head>
<body>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
 <defs>
   <pattern id="pat" patternUnits="userSpaceOnUse" x="0" y="0" width="10" height="10">
     <rect width="10" height="10" fill="#00aa00"/>
     <rect width="5" height="5" fill="#0000ff"/>
   </pattern>
 </defs>
 <!-- The underline of a 50px Ahem run at (10, 50) covers the user space rect
      (10, 50 + 50 * 0.075, 50, 50 * 0.05) == (10, 53.75, 50, 2.5). -->
 <g transform="scale(4)">
  <text xml:space="preserve" x="10" y="50" font-family="Ahem" font-size="50" fill="url(#pat)" style="text-decoration: underline"> </text>
 </g>
</svg>
</body>
</html>
