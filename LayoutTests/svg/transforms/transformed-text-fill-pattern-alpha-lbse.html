<!DOCTYPE html> <!-- webkit-test-runner [ LayerBasedSVGEngineEnabled=true ] -->
<html>
<head>
<title>LBSE: SVG text filled with a translucent pattern</title>
<!-- LBSE paints pattern-filled text by filling a rect with the pattern and then
     masking it with the glyph coverage. The glyph mask must be opaque, otherwise
     the tile alpha is applied twice.
     https://bugs.webkit.org/show_bug.cgi?id=291897 -->
</head>
<body>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
 <defs>
   <!-- Uniform 50% alpha, so only the number of times the alpha is applied can
        change the result, not the tile placement. -->
   <pattern id="pat" patternUnits="userSpaceOnUse" x="0" y="0" width="10" height="10">
     <rect width="10" height="10" fill="#00aa00" fill-opacity="0.5"/>
     <rect width="5" height="5" fill="#0000ff" fill-opacity="0.5"/>
   </pattern>
 </defs>
 <!-- Ahem renders 'A' as a solid box covering the whole em box, i.e. the user
      space rect (10, 10, 50, 50) for this text element. -->
 <g transform="scale(4)">
  <text x="10" y="50" font-family="Ahem" font-size="50" fill="url(#pat)">A</text>
 </g>
</svg>
</body>
</html>
