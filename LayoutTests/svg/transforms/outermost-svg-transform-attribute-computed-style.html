<!DOCTYPE html>
<script src="../../resources/js-test.js"></script>
<svg id="svg" width="200" height="200"></svg>
<script>
description("The transform attribute of an outermost svg element maps to the CSS transform property function by function, not as a single matrix.");

var svg = document.getElementById("svg");

function computedTransform(attribute) {
    svg.setAttribute("transform", attribute);
    return svg.computedStyleMap().get("transform").toString();
}

shouldBeEqualToString("computedTransform('translate(10, 20)')", "translate(10px, 20px)");
shouldBeEqualToString("computedTransform('translate(10)')", "translate(10px, 0px)");
shouldBeEqualToString("computedTransform('scale(2, 3)')", "scale(2, 3)");
shouldBeEqualToString("computedTransform('rotate(45)')", "rotate(45deg)");
shouldBeEqualToString("computedTransform('rotate(45, 10, 20)')", "translate(10px, 20px) rotate(45deg) translate(-10px, -20px)");
shouldBeEqualToString("computedTransform('skewX(30)')", "skewX(30deg)");
shouldBeEqualToString("computedTransform('skewY(30)')", "skewY(30deg)");
shouldBeEqualToString("computedTransform('matrix(1, 2, 3, 4, 5, 6)')", "matrix(1, 2, 3, 4, 5, 6)");
shouldBeEqualToString("computedTransform('translate(10, 20) rotate(90)')", "translate(10px, 20px) rotate(90deg)");
shouldBeEqualToString("computedTransform('rotate(45)'); getComputedStyle(svg).transform", "matrix(0.707107, 0.707107, -0.707107, 0.707107, 0, 0)");
shouldBeEqualToString("computedTransform('')", "none");
svg.removeAttribute("transform");
shouldBeEqualToString("svg.computedStyleMap().get('transform').toString()", "none");
</script>
