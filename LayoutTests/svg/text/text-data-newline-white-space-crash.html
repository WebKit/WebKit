<script>
if (window.testRunner)
    testRunner.dumpAsText();
document.body.offsetHeight;
for (const text of document.querySelectorAll("text")) {

    while (node.firstChild)
        node = node.firstChild;
    node.data = "a\nb";
    document.body.offsetHeight;

styleChange.style.whiteSpace = "normal";
