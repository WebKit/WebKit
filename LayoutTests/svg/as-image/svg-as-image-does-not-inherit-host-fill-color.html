<!DOCTYPE html>
<!-- webkit-test-runner [ SVGImageDisplayListCacheEnabled=true ] -->
<!-- The half-transparent border is deliberate: it leaves a non-default fill color on the
     context the image draws into. Black is the default, so both are needed to trigger the bug. -->
<style>
  body { margin: 0; }
  .box { display: block; margin: 10px; border: 4px solid rgba(0, 0, 255, 0.5); }
</style>
<img class="box" width="100" height="100"
     src="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='black'/></svg>">
