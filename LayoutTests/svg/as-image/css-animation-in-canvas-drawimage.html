<!DOCTYPE html>
<style>
  canvas { display: block; }
</style>
<canvas width="100" height="100"></canvas>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

// The animation must start in this test.
if (window.internals)
    internals.clearMemoryCache();

function waitForAnimation() {
    return new Promise(resolve => setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(resolve)), 300));
}

const image = new Image;
image.src = "resources/css-animation-turns-green.svg";
image.decode().then(async () => {
    const context = document.querySelector("canvas").getContext("2d");
    context.drawImage(image, 0, 0);

    await waitForAnimation();
    context.drawImage(image, 0, 0);

    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
