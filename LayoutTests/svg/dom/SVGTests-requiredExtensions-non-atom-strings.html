<!DOCTYPE html>
<html>
<head>
<script src="../../resources/js-test.js"></script>
</head>
<body>
<svg id="svg" width="200" height="50" xmlns="http://www.w3.org/2000/svg">
    <rect id="xhtml" x="0" width="10" height="10" requiredExtensions="http://www.w3.org/1999/xhtml"/>
    <rect id="mathml" x="10" width="10" height="10" requiredExtensions="http://www.w3.org/1998/Math/MathML"/>
    <rect id="both" x="20" width="10" height="10" requiredExtensions="http://www.w3.org/1999/xhtml http://www.w3.org/1998/Math/MathML"/>
    <rect id="padded" x="30" width="10" height="10" requiredExtensions="  http://www.w3.org/1999/xhtml  "/>
    <rect id="unknown" x="40" width="10" height="10" requiredExtensions="http://example.com/unknown-extension"/>
    <rect id="knownAndUnknown" x="50" width="10" height="10" requiredExtensions="http://www.w3.org/1999/xhtml http://example.com/unknown-extension"/>
    <rect id="wrongCase" x="60" width="10" height="10" requiredExtensions="http://www.w3.org/1999/XHTML"/>
    <rect id="empty" x="70" width="10" height="10" requiredExtensions=""/>
    <rect id="viaSetAttribute" x="80" width="10" height="10"/>
    <rect id="viaAppendItem" x="90" width="10" height="10" requiredExtensions="http://example.com/unknown-extension"/>
    <switch>
        <rect id="switchUnknown" x="100" width="10" height="10" requiredExtensions="http://example.com/unknown-extension"/>
        <rect id="switchXHTML" x="110" width="10" height="10" requiredExtensions="http://www.w3.org/1999/xhtml"/>
        <rect id="switchFallback" x="120" width="10" height="10"/>
    </switch>
</svg>
<script>
description("Tests that requiredExtensions matches the XHTML and MathML namespaces by string content. "
    + "Every token of the attribute value (and every string added via the SVGStringList API) is a newly created, "
    + "non-atomic string, so comparing it with the namespace atom by identity would never match.");

function isRendered(id)
{
    return document.getElementById(id).getBoundingClientRect().width > 0;
}

// Build the namespace strings at runtime so that they are not atomic string literals.
var xhtmlNamespace = ["http://www.w3.org", "1999", "xhtml"].join("/");
var mathmlNamespace = ["http://www.w3.org", "1998", "Math", "MathML"].join("/");

document.getElementById("viaSetAttribute").setAttribute("requiredExtensions", mathmlNamespace + " " + xhtmlNamespace);

var appendItemList = document.getElementById("viaAppendItem").requiredExtensions;
appendItemList.clear();
appendItemList.appendItem(xhtmlNamespace);

shouldBeTrue("isRendered('xhtml')");
shouldBeTrue("isRendered('mathml')");
shouldBeTrue("isRendered('both')");
shouldBeTrue("isRendered('padded')");
shouldBeFalse("isRendered('unknown')");
shouldBeFalse("isRendered('knownAndUnknown')");
shouldBeFalse("isRendered('wrongCase')");
shouldBeFalse("isRendered('empty')");
shouldBeTrue("isRendered('viaSetAttribute')");
shouldBeEqualToString("appendItemList.getItem(0)", "http://www.w3.org/1999/xhtml");
shouldBeTrue("isRendered('viaAppendItem')");

debug("");
debug("switch renders only its first child that passes conditional processing:");
shouldBeFalse("isRendered('switchUnknown')");
shouldBeTrue("isRendered('switchXHTML')");
shouldBeFalse("isRendered('switchFallback')");
</script>
</body>
</html>
