<title>SVGAngle parsing of edge case strings</title>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<svg xmlns="http://www.w3.org/2000/svg"><marker id="marker"/></svg>

// [ value, result of setAttribute("orient", value), result of baseVal.valueAsString = value ]

    ["\n5", "orient 2 type 1 specified 5 string 5", "ok 1 5 5"],

    ["%", "orient 2 type 1 specified 0 string 0", "SyntaxError"],

    ["5/**/deg", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["1e3.5", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["1.5e3rad", "orient 2 type 3 specified 1500 string 1500rad", "ok 3 1500 1500rad"],
    ["-1.5E-3grad", "orient 2 type 4 specified -0.001500000013038516 string -0.0015grad", "ok 4 -0.001500000013038516 -0.0015grad"],

    [".deg", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["-deg", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["+%", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5deg auto", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5 5", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5deg,", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5deg;", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5\\64 eg", "orient 2 type 2 specified 5 string 5deg", "ok 2 5 5deg"],
    ["5\\64\\65g", "orient 2 type 2 specified 5 string 5deg", "ok 2 5 5deg"],
    ["5d\\65g", "orient 2 type 2 specified 5 string 5deg", "ok 2 5 5deg"],
    ["5\u00e9", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5deg\u00e9", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["-5e-2rad", "orient 2 type 3 specified -0.05000000074505806 string -0.05rad", "ok 3 -0.05000000074505806 -0.05rad"],
    ["+.5e+1turn", "orient 2 type 0 specified 5 string 5turn", "ok 0 5 5turn"],
    ["5e-324", "orient 2 type 1 specified 0 string 0", "ok 1 0 0"],
    ["5Q", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5vw", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5ms", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5s", "orient 2 type 1 specified 0 string 0", "SyntaxError"],
    ["5dpi", "orient 2 type 1 specified 0 string 0", "SyntaxError"]
];

const marker = document.getElementById("marker");

function parseViaAttribute(value)
{
    marker.setAttribute("orient", "77");
    marker.setAttribute("orient", value);
    const angle = marker.orientAngle.baseVal;
    return `orient ${marker.orientType.baseVal} type ${angle.unitType} specified ${angle.valueInSpecifiedUnits} string ${angle.valueAsString}`;
}

function parseViaValueAsString(value)
{
    marker.setAttribute("orient", "77");
    const angle = marker.orientAngle.baseVal;
    try {
        angle.valueAsString = value;
    } catch (e) {
        return e.name;
    }
    return `ok ${angle.unitType} ${angle.valueInSpecifiedUnits} ${angle.valueAsString}`;
}

function make16Bit(value)
{
    return (value + "\u0100").slice(0, -1);
}

for (const [value, expectedAttribute, expectedValueAsString] of expectations) {
    test(() => {
        assert_equals(parseViaAttribute(make16Bit(value)), parseViaAttribute(value), "attribute");
        assert_equals(parseViaValueAsString(make16Bit(value)), parseViaValueAsString(value), "valueAsString");
    }, `${JSON.stringify(value)} parses the same as a 16-bit string`);

    // The empty string is not parsed.
    if (value.length) {
        // A leading comment forces full tokenization without changing the tokens.
        test(() => {
            assert_equals(parseViaAttribute("/**/" + value), parseViaAttribute(value), "attribute");
            assert_equals(parseViaValueAsString("/**/" + value), parseViaValueAsString(value), "valueAsString");
        }, `${JSON.stringify(value)} parses the same after a leading comment`);
    }

    test(() => {
        assert_equals(parseViaAttribute(value), expectedAttribute);
    }, `setAttribute("orient", ${JSON.stringify(value)})`);

    test(() => {
        assert_equals(parseViaValueAsString(value), expectedValueAsString);
    }, `baseVal.valueAsString = ${JSON.stringify(value)}`);
}
</script>
