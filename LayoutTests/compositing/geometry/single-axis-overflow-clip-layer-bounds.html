<!DOCTYPE html>
<html>
<head>
<style>
.container {
    will-change: transform;
    overflow-x: clip;
    overflow-y: visible;
    width: 300px;
    height: 50px;
}
.child {
    position: absolute;
    top: 0;
    width: 100px;
    height: 200px;
    background-color: green;
}
</style>
<script>
if (window.testRunner)
    testRunner.dumpAsText();
window.addEventListener("load", () => {
    if (window.internals)
        document.getElementById("layers").textContent = internals.layerTreeAsText(document);
});
</script>
</head>
<body>
<div class="container">
    <div class="child" style="left: 0"></div>
    <div class="child" style="left: 1000px"></div>
</div>
<pre id="layers"></pre>
</body>
</html>
