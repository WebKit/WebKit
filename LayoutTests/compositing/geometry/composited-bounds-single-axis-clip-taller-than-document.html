<!DOCTYPE html>
<html>
<head>
<style>
  #clip-host {
      position: relative;
      overflow: hidden;
      width: 400px;
      height: 300px;
  }

  .composited {
      width: 50px;
      height: 50px;
      will-change: transform;
  }

  .provider {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 300px;
      height: 300px;
  }

  .clipper {
      overflow-x: clip;
      overflow-y: visible;
      width: 300px;
  }

  .sharing {
      position: relative;
      width: 200px;
      height: 3000px;
      background: green;
  }
</style>
</head>
<body>
<script>
  if (window.testRunner) {
      testRunner.dumpAsText();
      testRunner.waitUntilDone();
  }

  window.addEventListener("load", () => requestAnimationFrame(() => {
      if (window.testRunner) {
          document.getElementById('layers').innerText = window.internals.layerTreeAsText(document);
          testRunner.notifyDone();
      }
  }));
</script>

<p>Bug 295662: a backing-sharing layer clipped in one axis but taller than the document (as in a code editor with a large paste) must get bounds covering its full content, not clamped to the document rect.</p>
<div id="clip-host">
  <div class="composited"></div>
  <div class="provider"><div class="clipper"><div class="sharing"></div></div></div>
</div>
<pre id="layers"></pre>
</body>
</html>
