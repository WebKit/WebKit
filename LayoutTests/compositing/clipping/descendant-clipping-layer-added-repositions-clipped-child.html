<!DOCTYPE html>
<html class="reftest-wait">
<style>
#container {
    width: 100px;
    height: 100px;
    border: 10px solid gray;
    overflow: hidden;
    will-change: opacity;
}

#child {
    width: 50px;
    height: 50px;
    background: green;
    will-change: transform;
}

#escaping {
    position: fixed;
}
</style>
<div id="container">
    <div id="child"></div>
    <div id="escaping"></div>
</div>
<script src="../../resources/ui-helper.js"></script>
<script>
document.getElementById("escaping").animate({ opacity: [1, 0.5] }, 100).finished.then(async () => {
    await UIHelper.renderingComplete();
    document.getElementById("container").style.backgroundColor = "white";
    await UIHelper.renderingComplete();
    document.documentElement.classList.remove("reftest-wait");
});
</script>
</html>
