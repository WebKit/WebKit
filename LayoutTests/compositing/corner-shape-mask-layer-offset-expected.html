<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Borders and Box Decorations 4: 'corner-shape' mask is positioned by the mask layer's offset from the renderer — reference</title>
    <style>
        body {
            margin: 0;
            background-color: white;
        }

        .stage {
            position: relative;
            margin: 60px;
            width: 320px;
            height: 240px;
            border-radius: 80px;
            corner-shape: notch scoop bevel squircle;
            overflow: hidden;
            box-shadow: -50px -40px 0 0 rgba(0, 128, 0, 0.001);
        }

        .contents {
            position: absolute;
            left: -40px;
            top: -40px;
            width: 400px;
            height: 320px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="contents"></div>
    </div>
</body>
</html>
