<!DOCTYPE html> <!-- webkit-test-runner [ AsyncOverflowScrollingEnabled=true ] -->
<html>
<head>
    <style>
        #scroller {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 200px;
            height: 200px;
            overflow: auto;
        }
        .nested-fixed {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 300px;
            height: 50px;
            background-color: green;
        }
        .contents {
            height: 1000px;
        }
    </style>
    <script>
        if (window.internals)
            internals.setUsesOverlayScrollbars(true);

        if (window.testRunner)
            testRunner.dumpAsText();

        window.addEventListener('load', () => {
            if (window.internals)
                document.getElementById('layers').textContent = internals.layerTreeAsText(document);
        }, false);
    </script>
</head>
<body>
    <!-- The nested fixed element is parented outside the scroller's scroll container, but below its overlay scrollbars, which paint above positive z-order descendants. -->
    <div id="scroller">
        <div class="nested-fixed"></div>
        <div class="contents"></div>
    </div>
<pre id="layers"></pre>
</body>
</html>
