<!DOCTYPE html>
<html>
<head>
    <title>CSS Borders and Box Decorations 4: 'corner-shape' on a composited video</title>
    <style>
        body {
            margin: 0;
            background-color: white;
        }

        .stage {
            position: relative;
            width: 320px;
            height: 240px;
            margin: 20px;
            background-color: red;
        }

        .stage > * {
            position: absolute;
            left: 0;
            top: 0;
            width: 320px;
            height: 240px;
            border-radius: 80px;
            corner-shape: notch scoop bevel squircle;
        }

        .cover {
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cover"></div>
    </div>
</body>
</html>
