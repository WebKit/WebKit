<!DOCTYPE html> <!-- webkit-test-runner [ PasswordFieldScreenCaptureProtectionEnabled=true ] -->
<html>
<head>
<style>
input {
    appearance: none;
    box-sizing: border-box;
    width: 200px;
    height: 30px;
    margin: 0;
    padding: 0 4px;
    border: 1px solid black;
    font: 20px/1 Ahem;
}
</style>
<script src="../../../resources/ui-helper.js"></script>
</head>
<body>
<input type="password">
<pre id="layers"></pre>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

addEventListener("load", async () => {
    const input = document.querySelector("input");
    input.focus();
    document.execCommand("insertText", false, "secret");
    await UIHelper.renderingUpdate();

    input.type = "text";
    await UIHelper.renderingUpdate();

    if (window.internals)
        document.getElementById("layers").textContent = internals.layerTreeAsText(document);

    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
</html>
