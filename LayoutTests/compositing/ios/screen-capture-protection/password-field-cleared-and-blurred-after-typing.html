<!DOCTYPE html> <!-- webkit-test-runner [ PasswordFieldScreenCaptureProtectionEnabled=true ] -->
<html>
<head>
<style>
input {
    appearance: none;
    box-sizing: border-box;
    width: 200px;
    height: 30px;
    margin: 0;
    padding: 0 4px;
    border: 1px solid black;
    font: 20px/1 Ahem;
}

.composited {
    position: absolute;
    top: 8px;
    left: 300px;
    width: 10px;
    height: 10px;
    will-change: transform;
}
</style>
<script src="../../../resources/ui-helper.js"></script>
</head>
<body>
<input type="password">
<!-- Ensures that there is a layer tree to dump, since the password field is not composited. -->
<div class="composited"></div>
<pre id="layers"></pre>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

addEventListener("load", async () => {
    const input = document.querySelector("input");
    input.focus();
    document.execCommand("insertText", false, "secret");
    await UIHelper.renderingUpdate();

    document.execCommand("selectAll");
    document.execCommand("delete");
    await UIHelper.renderingUpdate();

    input.blur();
    await UIHelper.renderingUpdate();

    if (window.internals)
        document.getElementById("layers").textContent = internals.layerTreeAsText(document);

    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
</html>
