<!DOCTYPE html> <!-- webkit-test-runner [ PasswordFieldScreenCaptureProtectionEnabled=true ] -->
<html>
<head>
<style>
input {
    appearance: none;
    box-sizing: border-box;
    width: 200px;
    height: 30px;
    margin: 0;
    padding: 0 4px;
    border: 1px solid black;
    font: 20px/1 Ahem;
}

.composited {
    position: absolute;
    top: 8px;
    left: 300px;
    width: 10px;
    height: 10px;
    will-change: transform;
}
</style>
</head>
<body>
<input type="password" placeholder="Password">
<!-- Ensures that there is a layer tree to dump, since the password field is not composited. -->
<div class="composited"></div>
<pre id="layers"></pre>
<script>
if (window.testRunner)
    testRunner.dumpAsText();

if (window.internals)
    document.getElementById("layers").textContent = internals.layerTreeAsText(document);
</script>
</body>
</html>
