<!DOCTYPE html>
<html>
  <head>
    <!-- A rotation under a perspective maps the layer plane projectively, so the composited layers below
         are rasterized in their own plane and resampled by the composite. The unaccelerated rendering
         rasterizes the same shapes as geometry instead, which lands within a pixel of it rather than on it. -->
    <style>
      body {
        perspective: 1000px;
        position: absolute;
        top: 100px;
        left: 100px;
        height: 300px;
        width: 300px;
        transform-style: preserve-3d;
      }
      .scene {
        will-change: transform;
        transform-style: preserve-3d;
        position: absolute;
        width: 800px;
        height: 500px;
        transform: rotateY(30deg);
      }
      div div {
        background: green;
        position: absolute;
        width: 100px;
        height: 100px;
        top: 100px;
        filter: drop-shadow(20px 20px black);
      }
      .a { transform: translate(150px, 0) rotate(90deg); }
      .b { transform: translate(300px, 0) rotate(180deg); }
      .c { transform: translate(450px, 0) rotate(270deg); }
    </style>
  </head>
  <body>
    <div class=scene>
      <div class=a></div>
      <div class=b></div>
      <div class=c></div>
    </div>
  </body>
</html>
