<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
      }
      .scene {
        position: absolute;
        width: 400px;
        height: 400px;
        background: linear-gradient(to right, green 0 200px, blue 200px 400px);
      }
      .backdrop {
        position: absolute;
        left: 50px;
        top: 50px;
        width: 100px;
        height: 100px;
        transform: scale(2);
        transform-origin: 0 0;
        -webkit-backdrop-filter: blur(5px);
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="backdrop"></div>
    </div>
  </body>
</html>
