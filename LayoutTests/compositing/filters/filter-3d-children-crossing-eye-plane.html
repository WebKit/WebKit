<!DOCTYPE html>
<html>
  <head>
    <!-- A filtered layer whose children are planes reaching from in front of the eye to the eye plane
         itself. The subtree bounds in the layer plane are projective and some vertices land on w = 0,
         so the bounds have to be built from the clipped polygon rather than from a plain box map. -->
    <meta name="fuzzy" content="maxDifference=0-160; totalPixels=0-8000">
    <style>
      body { margin: 0; background: white; }
      .group {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 100px;
        height: 100px;
        perspective: 100px;
        filter: drop-shadow(30px 30px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .group > div {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
      }
      .r { background: green; transform: translate3d(50px, 0, 50px) rotateY(90deg); }
      .l { background: orange; transform: translate3d(-50px, 0, 50px) rotateY(90deg); }
      .t { background: blue; transform: translate3d(0, -50px, 50px) rotateX(90deg); }
      .b { background: red; transform: translate3d(0, 50px, 50px) rotateX(90deg); }
    </style>
  </head>
  <body>
    <div class=group>
      <div class=r></div>
      <div class=l></div>
      <div class=t></div>
      <div class=b></div>
    </div>
  </body>
</html>
