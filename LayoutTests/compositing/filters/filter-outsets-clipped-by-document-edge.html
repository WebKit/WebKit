<!DOCTYPE html>
<html>
<head>
<title>A composited filter must not lose the content the document rect cuts away</title>
<style>
html { overflow: hidden; }
body { margin: 0; }
.blurred {
    position: absolute;
    top: -50px;
    left: -50px;
    width: calc(100vw + 100px);
    height: calc(100vh + 100px);
    background: green;
    filter: blur(10px);
    will-change: filter;
}
</style>
</head>
<body>
<div class="blurred"></div>
</body>
</html>
