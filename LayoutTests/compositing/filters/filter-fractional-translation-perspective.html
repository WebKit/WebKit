<!DOCTYPE html>
<html>
<head>
<title>A filtered layer that a perspective scales to a fractional device position should cover the same pixels as without the filter.</title>
<meta name="fuzzy" content="maxDifference=0-1; totalPixels=0-1600">
<style>
.container {
    position: absolute;
    top: 0;
    left: 0;
    width: 200px;
    height: 200px;
    perspective: 800px;
}
.test {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 100px;
    height: 100px;
    background: repeating-linear-gradient(90deg, black 0 1px, white 1px 2px);
    transform: translateZ(20px);
    will-change: transform;
    /* The shadow lands far outside the viewport, so only the source graphic is visible. */
    filter: drop-shadow(0 2000px 0 red);
}
</style>
</head>
<body>
<div class="container">
<div class="test"></div>
</div>
</body>
</html>
