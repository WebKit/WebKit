<!DOCTYPE html>
<html>
<head>
<title>Ancestor filter outsets must widen the clips above the filter, even when a nearer clip sits between the filter and the composited layer</title>
<style>
.clip {
    position: relative;
    overflow: hidden;
    width: 100px;
    height: 100px;
}
.filtered {
    position: absolute;
    top: 0;
    left: -100px;
    width: 200px;
    height: 100px;
    filter: drop-shadow(100px 0 0 green);
}
.nearerClip {
    overflow: hidden;
    width: 200px;
    height: 100px;
}
.box {
    width: 0;
    height: 0;
    border: 50px solid green;
    will-change: transform;
}
</style>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

window.onload = () => {
    requestAnimationFrame(() => {
        document.getElementById("layers").textContent = internals.layerTreeAsText(document);
        if (window.testRunner)
            testRunner.notifyDone();
    });
};
</script>
</head>
<body>
<div class="clip">
    <div class="filtered">
        <div class="nearerClip">
            <div class="box"></div>
        </div>
    </div>
</div>
<pre id="layers"></pre>
</body>
</html>
