<!DOCTYPE html>
<html>
  <head>
    <!-- A filtered layer turned edge-on maps its plane to zero area, so neither it nor its subtree can
         contribute a single pixel. The layers painted after it have to be unaffected by that. -->
    <style>
      body { margin: 0; background: white; }
      .edge {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 200px;
        height: 200px;
        background: green;
        transform: rotateY(90deg);
        filter: drop-shadow(20px 20px 0 rgba(0, 0, 0, 0.6));
      }
      .edge > div {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background: orange;
      }
      .after {
        position: absolute;
        top: 100px;
        left: 100px;
        width: 150px;
        height: 150px;
        background: blue;
      }
    </style>
  </head>
  <body>
    <div class=edge><div></div></div>
    <div class=after></div>
  </body>
</html>
