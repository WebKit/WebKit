<!DOCTYPE html>
<html>
  <head>
    <!-- An edge-on layer that carries both a filter and a backdrop filter. Its plane maps to zero area, so
         the whole group is invisible and the backdrop capture must not change what the layers painted
         after it look like. -->
    <meta name="fuzzy" content="maxDifference=0-2; totalPixels=0-400">
    <style>
      body { margin: 0; background: white; }
      .behind {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 300px;
        background: linear-gradient(to right, red, yellow);
        will-change: transform;
      }
      .edge {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 200px;
        height: 200px;
        transform: rotateY(90deg);
        backdrop-filter: invert(1);
        filter: drop-shadow(20px 20px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .edge > div {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background: orange;
        will-change: transform;
      }
      .after {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 120px;
        height: 120px;
        background: blue;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class=behind></div>
    <div class=edge><div></div></div>
    <div class=after></div>
  </body>
</html>
