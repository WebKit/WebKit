<!DOCTYPE html>
<html>
<head>
<title>A running filter animation must grow the composited bounds of descendants by the largest outsets of its keyframes</title>
<style>
@keyframes grow-blur {
    from { filter: blur(0px); }
    to { filter: blur(30px); }
}
.clip {
    position: relative;
    overflow: hidden;
    width: 100px;
    height: 100px;
}
.filtered {
    position: absolute;
    top: 0;
    left: -100px;
    width: 200px;
    height: 100px;
    filter: blur(0px);
    animation: grow-blur 1000s linear;
}
.box {
    width: 0;
    height: 0;
    border: 50px solid green;
    will-change: transform;
}
</style>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

window.onload = () => {
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.getElementById("layers").textContent = internals.layerTreeAsText(document);
            if (window.testRunner)
                testRunner.notifyDone();
        });
    });
};
</script>
</head>
<body>
<div class="clip">
    <div class="filtered">
        <div class="box"></div>
    </div>
</div>
<pre id="layers"></pre>
</body>
</html>
