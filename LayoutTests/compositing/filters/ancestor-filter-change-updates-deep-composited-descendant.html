<!DOCTYPE html>
<html>
<head>
<title>Adding a drop-shadow to an ancestor must grow the composited bounds of composited descendants of its composited descendants</title>
<style>
.clip {
    position: relative;
    overflow: hidden;
    width: 100px;
    height: 100px;
}
.filtered {
    position: absolute;
    top: 0;
    left: -100px;
    width: 200px;
    height: 100px;
    filter: blur(0px);
}
.outer {
    margin-left: 100px;
    width: 100px;
    height: 100px;
    will-change: transform;
}
.inner {
    position: absolute;
    top: 0;
    left: -100px;
    width: 0;
    height: 0;
    border: 50px solid green;
    will-change: transform;
}
</style>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

window.onload = () => {
    requestAnimationFrame(() => {
        document.querySelector(".filtered").style.filter = "drop-shadow(100px 0 0 green)";
        requestAnimationFrame(() => {
            document.getElementById("layers").textContent = internals.layerTreeAsText(document);
            if (window.testRunner)
                testRunner.notifyDone();
        });
    });
};
</script>
</head>
<body>
<div class="clip">
    <div class="filtered">
        <div class="outer">
            <div class="inner"></div>
        </div>
    </div>
</div>
<pre id="layers"></pre>
</body>
</html>
