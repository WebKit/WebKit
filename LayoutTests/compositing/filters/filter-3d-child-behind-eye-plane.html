<!DOCTYPE html>
<html>
  <head>
    <!-- A filtered layer with one child pushed entirely behind the eye - all four corners map to w < 0 and
         the child contributes nothing to the bounds - and one child in front of it that still has to
         be filtered normally. -->
    <meta name="fuzzy" content="maxDifference=0-160; totalPixels=0-8000">
    <style>
      body { margin: 0; background: white; }
      .group {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 100px;
        height: 100px;
        perspective: 100px;
        filter: drop-shadow(30px 30px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .group > div {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
      }
      .behind { background: green; transform: translateZ(200px); }
      .front { background: blue; transform: translateZ(-100px); }
    </style>
  </head>
  <body>
    <div class=group>
      <div class=behind></div>
      <div class=front></div>
    </div>
  </body>
</html>
