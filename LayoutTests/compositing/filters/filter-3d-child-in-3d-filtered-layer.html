<!DOCTYPE html>
<html>
  <head>
    <!-- A filtered layer that is itself rotated under a perspective and that establishes a perspective of
         its own for a rotated child. Both the layer plane and the child mapping into it are
         projective, so the two projections have to compose correctly. -->
    <meta name="fuzzy" content="maxDifference=0-160; totalPixels=0-8000">
    <style>
      body { margin: 0; background: white; }
      .stage {
        position: absolute;
        top: 100px;
        left: 100px;
        perspective: 700px;
      }
      .filtered {
        width: 200px;
        height: 200px;
        background: green;
        transform: rotateY(35deg);
        perspective: 150px;
        filter: drop-shadow(20px 20px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .face {
        position: absolute;
        top: 50px;
        left: 0;
        width: 200px;
        height: 100px;
        background: red;
        transform-style: preserve-3d;
        transform: translate3d(0, 0, 60px) rotateX(90deg);
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class=stage>
      <div class=filtered><div class=face></div></div>
    </div>
  </body>
</html>
