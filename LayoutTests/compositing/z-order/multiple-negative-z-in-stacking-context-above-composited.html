<!DOCTYPE html>
<html>
<head>
    <style>
        /* Multiple negative z-index children in a stacking context should all
           appear in front of an external composited layer with lower stacking order.

           As in the single-child test, the composited box is offset horizontally so that it
           does not cover the stacking context's own (empty, inflated to 1x1) overlap rect,
           which would promote the stacking context before its negative z-order children
           are overlap-tested. */
        .stacking-context {
            position: relative;
            z-index: 1;
        }

        .neg-child {
            position: absolute;
            left: 0;
            width: 400px;
            height: 50px;
            background-color: limegreen;
        }

        .neg-1 {
            z-index: -1;
            top: 30px;
        }

        .neg-2 {
            z-index: -2;
            top: 90px;
        }

        .neg-3 {
            z-index: -3;
            top: 150px;
        }

        .composited {
            position: absolute;
            top: 20px;
            left: 200px;
            transform: translateZ(0);
            height: 300px;
            width: 300px;
            background-color: cyan;
        }
    </style>
</head>
<body>
    <p>All three green bars should paint in front of the cyan box.</p>
    <div class="stacking-context">
        <div class="neg-child neg-1"></div>
        <div class="neg-child neg-2"></div>
        <div class="neg-child neg-3"></div>
    </div>
    <div class="composited"></div>
</body>
</html>
