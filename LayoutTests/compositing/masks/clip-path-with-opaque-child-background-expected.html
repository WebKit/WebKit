<!DOCTYPE html>
<style>
  .c {
      position: relative;
      will-change: transform;
  }
  .clip {
      width: 200px;
      height: 200px;
      clip-path: circle();
  }
  .blue {
      width: 100%;
      height: 100%;
      background: blue;
  }
</style>

You should see a blue circle without a black square.

<div class="c">
  <div class="clip">
    <div class="blue"></div>
  </div>
</div>
