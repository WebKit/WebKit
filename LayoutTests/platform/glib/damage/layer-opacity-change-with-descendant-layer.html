<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .layer {
          position: fixed;
          left: 7px;
          top: 3px;
          width: 50px;
          height: 50px;
          background-color: green;
          will-change: transform;
      }
      /* Composited on its own and outside the parent bounds, so the parent damage cannot cover it. */
      .descendant {
          position: absolute;
          left: 60px;
          top: 0;
          width: 50px;
          height: 50px;
          background-color: blue;
          will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class="layer">
      <div class="descendant"></div>
    </div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});

      var layer = document.getElementsByClassName("layer")[0];

      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { layer.style.opacity = 0.5; },
          () => { assertRectsEq(latestFrameDamage().rects, [[7, 3, 50, 50], [67, 3, 50, 50]]); },
          () => { layer.style.opacity = 0.4; },
          () => { assertRectsEq(latestFrameDamage().rects, [[7, 3, 50, 50], [67, 3, 50, 50]]); },
      ], 0);
    </script>
  </body>
</html>
