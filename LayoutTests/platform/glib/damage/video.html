<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
  </head>
  <body>
    <video style="display: block" width="160" height="120" src="./content/test.mp4"></video>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});

      var video = document.getElementsByTagName("video")[0];
      video.addEventListener("timeupdate", () => {
          const framesBeforeCheck = allFramesDamages().length;
          const checkFrames = () => {
              const damagedFrames = allFramesDamages().slice(framesBeforeCheck).filter(damage => damage.rects.length);
              if (damagedFrames.length < 3) {
                  requestAnimationFrame(checkFrames);
                  return;
              }
              video.pause();
              for (const damage of damagedFrames) {
                  if (!assertRectsEq(damage.rects, [[0, 0, 160, 120]])) {
                      failTest(failure);
                      return;
                  }
              }
              passTest();
          };
          requestAnimationFrame(checkFrames);
      }, { once: true });
      video.play();
    </script>
  </body>
</html>
