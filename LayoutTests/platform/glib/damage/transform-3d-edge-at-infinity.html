<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      body {
          overflow: hidden;
      }
      /* Test case from https://bugs.webkit.org/show_bug.cgi?id=247042. */
      .container {
          position: absolute;
          top: 50%;
          left: 70%;
          width: 200px;
          height: 200px;
          perspective: 50px;
          perspective-origin: 0 50%;
          border: green 2px solid;
      }
      /* Turned edge-on, it reaches 100px towards the viewer, past the camera that sits 50px
         away, so its right side lies at infinity. */
      #plane {
          position: absolute;
          transform-style: preserve-3d;
          width: 100%;
          height: 100%;
          transform: rotateY(-90deg);
          background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="container"><div id="plane"></div></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});

      var plane = document.getElementById("plane");

      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { plane.style.backgroundColor = "green"; },
          // The plane only paints the lower right of the frame, so the damage must not reach the top.
          () => {
              const damage = latestFrameDamage();
              if (!assert(damage, "no damage was recorded for the frame"))
                  return;
              assertRectsEq(damage.rects, [[594, 166, 206, 434]]);
          },
      ], 0);
    </script>
  </body>
</html>
