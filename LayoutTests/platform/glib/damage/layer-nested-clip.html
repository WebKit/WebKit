<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .outer { position: fixed; left: 10px; top: 10px; width: 60px; height: 60px; overflow: hidden; will-change: transform; }
      .middle { position: absolute; left: 0; top: 0; width: 40px; height: 40px; overflow: hidden; will-change: transform; }
      .inner { position: absolute; left: 0; top: 0; width: 30px; height: 30px; background-color: green; will-change: transform; }
    </style>
  </head>
  <body>
    <div class="outer"><div class="middle"><div class="inner"></div></div></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { document.getElementsByClassName("inner")[0].style.left = "20px"; },
          () => { assertRectsEq(latestFrameDamage().rects, [[10, 10, 40, 30]]); },
      ], 0);
    </script>
  </body>
</html>
