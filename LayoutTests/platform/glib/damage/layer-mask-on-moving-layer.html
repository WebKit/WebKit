<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .layer { position: fixed; left: 10px; top: 10px; width: 50px; height: 50px; background-color: green; -webkit-mask-image: linear-gradient(black, black); -webkit-mask-size: 25px 25px; }
    </style>
  </head>
  <body>
    <div class="layer"></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { document.getElementsByClassName("layer")[0].style.left = "200px"; },
          () => { assertRectsEq(latestFrameDamage().rects, [[10, 10, 50, 50], [200, 10, 50, 50]]); },
      ], 0);
    </script>
  </body>
</html>
