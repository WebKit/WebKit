<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .layer { position: fixed; left: 10px; top: 10px; width: 50px; height: 50px; background-color: green;
               -webkit-box-reflect: below 10px; }
    </style>
  </head>
  <body>
    <div class="layer"></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      var layer = document.getElementsByClassName("layer")[0];
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { layer.style.left = "200px"; },
          () => { assertRectsEq(latestFrameDamage().rects, [[10, 10, 50, 110], [200, 10, 50, 110]]); },
      ], 0);
    </script>
  </body>
</html>
