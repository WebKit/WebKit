<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .layer { position: fixed; left: 50px; top: 50px; width: 50px; height: 50px; background-color: green; filter: blur(10px); }
    </style>
  </head>
  <body>
    <div class="layer"></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      var layer = document.getElementsByClassName("layer")[0];
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { layer.style.filter = "none"; },
          // A blur paints outside the layer's bounds, so removing it has to repaint the halo the blur
          // left behind, not just the layer itself.
          () => { assertRectsEq(latestFrameDamage().rects, [[22, 22, 106, 106]]); },
      ], 0);
    </script>
  </body>
</html>
