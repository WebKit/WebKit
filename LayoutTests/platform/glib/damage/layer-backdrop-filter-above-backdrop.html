<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .under { position: fixed; left: 10px; top: 10px; width: 30px; height: 30px; background-color: green; }
      .b1 { position: fixed; left: 10px; top: 10px; width: 50px; height: 50px; backdrop-filter: blur(3px); }
      .b2 { position: fixed; left: 40px; top: 40px; width: 50px; height: 50px; backdrop-filter: blur(3px); }
    </style>
  </head>
  <body>
    <div class="under"></div>
    <div class="b1"></div>
    <div class="b2"></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { document.getElementsByClassName("under")[0].style.backgroundColor = "red"; },
          () => { assertRectsEq(latestFrameDamage().rects, [[10, 10, 50, 30], [10, 40, 80, 20], [40, 60, 50, 30]]); },
      ], 0);
    </script>
  </body>
</html>
