<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .layer { position: absolute; left: 10px; top: 10px; width: 50px; height: 50px; background-color: green; will-change: transform; }
    </style>
  </head>
  <body>
    <div class="layer"></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      var layer = document.getElementsByClassName("layer")[0];
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { layer.style.willChange = "auto"; },
          () => { assertRectsEq(latestFrameDamage().rects, [[10, 10, 50, 50]]); },
      ], 0);
    </script>
  </body>
</html>
