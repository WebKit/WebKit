<!DOCTYPE html> <!-- webkit-test-runner [ UnifyDamagedRegions=false ] -->
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .layer { position: fixed; left: 10px; top: 10px; width: 50px; height: 50px; background-color: green; -webkit-box-reflect: below 10px; -webkit-mask-image: linear-gradient(black, black); -webkit-mask-size: 50px 50px; }
    </style>
  </head>
  <body>
    <div class="layer"></div>
    <script src="./common.js"></script>
    <script>
      setupTestCase({disableConsoleLog: true});
      processAnimationFrameSequence({skipFirstFrameToEnsureInitialPaintingDone: true}, [
          () => { document.getElementsByClassName("layer")[0].style.webkitMaskSize = "25px 25px"; },
          () => { assertRectsEq(latestFrameDamage().rects, [[10, 10, 50, 50], [10, 70, 50, 50]]); },
      ], 0);
    </script>
  </body>
</html>
