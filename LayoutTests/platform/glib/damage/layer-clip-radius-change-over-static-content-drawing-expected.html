<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./common.css">
    <style>
      .clip { position: absolute; left: 30px; top: 30px; width: 60px; height: 50px; overflow: hidden; border-radius: 20px; will-change: transform; }
      .inner { position: absolute; left: 0; top: 0; width: 60px; height: 50px; background: repeating-linear-gradient(90deg, green 0 7px, blue 7px 13px); will-change: transform; }
    </style>
  </head>
  <body>
    <div class="clip"><div class="inner"></div></div>
  </body>
</html>
