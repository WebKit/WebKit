<!DOCTYPE html>
<meta charset="utf-8">
<title>Terminating a service worker while a fetch event waits for a navigation preload</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/service-workers/service-worker/resources/test-helpers.sub.js"></script>
<script>
const resources = '/service-workers/service-worker/navigation-preload/resources/';
const script = resources + 'read-after-respondwith-worker.js';
const scope = resources + 'read-after-respondwith-scope.py';

function preload_result(url) {
  return new Promise(resolve => {
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data.url === url)
        resolve(e.data.result);
    });
  });
}

promise_test(async t => {
  assert_own_property(window, 'internals');
  const registration =
      await service_worker_unregister_and_register(t, script, scope);
  t.add_cleanup(() => registration.unregister());
  await wait_for_state(t, registration.installing, 'activated');

  // The worker answers right away and then waits in waitUntil() for the
  // preload, which the server delays by one second.
  const frame = await with_iframe(`${scope}?delay=headers`);
  t.add_cleanup(() => frame.remove());
  assert_equals(frame.contentDocument.body.textContent, 'synthetic');
  await internals.terminateServiceWorker(registration.active);

  const url = new URL(`${scope}?delay=none`, location).href;
  const result = preload_result(url);
  const otherFrame = await with_iframe(url);
  t.add_cleanup(() => otherFrame.remove());
  assert_equals(otherFrame.contentDocument.body.textContent, 'synthetic');
  assert_equals(await result, 'preload body');
}, 'A new navigation works after the service worker was terminated while waiting for a navigation preload');
</script>
