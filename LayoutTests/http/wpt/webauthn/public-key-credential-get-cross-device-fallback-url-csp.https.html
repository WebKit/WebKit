<!DOCTYPE html><!-- webkit-test-runner [ WebAuthenticationModernEnabled=true WebAuthenticationCrossDeviceFallbackURLEnabled=true allowTestOnlyIPC=true ] -->
<meta http-equiv="Content-Security-Policy" content="connect-src https://allowed.example">
<title>Web Authentication API: PublicKeyCredential's [[get]] applies the Content Security Policy to crossDeviceFallbackUrl.</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="./resources/util.js"></script>
<script>
    if (window.internals)
        internals.setMockWebAuthenticationConfiguration({ });

    const cspMessage = "The cross-device fallback URL is blocked by the Content Security Policy.";

    function getOptionsWithFallbackUrl(url)
    {
        return {
            publicKey: {
                challenge: asciiToUint8Array("123456"),
                timeout: 10,
                extensions: { crossDeviceFallbackUrl: url }
            }
        };
    }

    promise_test(t => {
        return promiseRejects(t, "SecurityError",
            navigator.credentials.get(getOptionsWithFallbackUrl("https://blocked.example/fallback")), cspMessage);
    }, "crossDeviceFallbackUrl that the Content Security Policy blocks");

    promise_test(t => {
        // Whatever happens to the request after the CSP check, the CSP must not be what rejects it.
        return navigator.credentials.get(getOptionsWithFallbackUrl("https://allowed.example/fallback"))
            .then(t.unreached_func("Should have rejected"), e => assert_not_equals(e.message, cspMessage));
    }, "crossDeviceFallbackUrl that the Content Security Policy allows");
</script>
