<!DOCTYPE html><!-- webkit-test-runner [ WebAuthenticationModernEnabled=true WebAuthenticationCrossDeviceFallbackURLEnabled=true allowTestOnlyIPC=true ] -->
<title>Web Authentication API: PublicKeyCredential's [[get]] with the crossDeviceFallbackUrl extension.</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="./resources/util.js"></script>
<script>
    if (window.internals)
        internals.setMockWebAuthenticationConfiguration({ });

    function getOptionsWithFallbackUrl(url)
    {
        return {
            publicKey: {
                challenge: asciiToUint8Array("123456"),
                extensions: { crossDeviceFallbackUrl: url }
            }
        };
    }

    test(() => {
        assert_equals(typeof WebAuthnOperationException, "function");
        assert_true(WebAuthnOperationException.prototype instanceof DOMException);
    }, "WebAuthnOperationException is a DOMException subclass");

    test(() => {
        const exception = new WebAuthnOperationException("cross-device-fallback", "message");
        assert_true(exception instanceof DOMException);
        assert_equals(exception.name, "WebAuthnOperationException");
        assert_equals(exception.message, "message");
        assert_equals(exception.operationError, "cross-device-fallback");
        assert_throws_js(TypeError, () => new WebAuthnOperationException("unknown"));
    }, "WebAuthnOperationException constructor and operationError");

    promise_test(t => {
        return promiseRejects(t, "SecurityError",
            navigator.credentials.get(getOptionsWithFallbackUrl("abc")), "The cross-device fallback URL is not a valid https URL.");
    }, "crossDeviceFallbackUrl that is not a URL");

    promise_test(t => {
        return promiseRejects(t, "SecurityError",
            navigator.credentials.get(getOptionsWithFallbackUrl("http://localhost/fallback")), "The cross-device fallback URL is not a valid https URL.");
    }, "crossDeviceFallbackUrl that is not https");

    promise_test(t => {
        return promiseRejects(t, "SecurityError",
            navigator.credentials.get(getOptionsWithFallbackUrl("https://127.0.0.1/fallback")), "The effective domain of the cross-device fallback URL is not a valid domain.");
    }, "crossDeviceFallbackUrl with an IP address host");
</script>
