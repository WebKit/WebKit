<!DOCTYPE html><!-- webkit-test-runner [ WebAuthenticationModernEnabled=true WebAuthenticationCrossDeviceFallbackURLEnabled=false allowTestOnlyIPC=true ] -->
<title>Web Authentication API: crossDeviceFallbackUrl is ignored when the feature is disabled.</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="./resources/util.js"></script>
<script>
    if (window.internals)
        internals.setMockWebAuthenticationConfiguration({ });

    test(() => {
        assert_equals(typeof WebAuthnOperationException, "undefined");
    }, "WebAuthnOperationException is not exposed");

    promise_test(t => {
        const options = {
            publicKey: {
                challenge: asciiToUint8Array("123456"),
                timeout: 10,
                extensions: { crossDeviceFallbackUrl: "http://127.0.0.1/fallback" }
            }
        };

        // The invalid URL would be a SecurityError if the member were recognized.
        return promiseRejects(t, "NotAllowedError",
            navigator.credentials.get(options), "Operation timed out.");
    }, "crossDeviceFallbackUrl is ignored");
</script>
