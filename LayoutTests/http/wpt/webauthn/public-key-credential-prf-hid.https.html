<!DOCTYPE html><!-- webkit-test-runner [ WebAuthenticationModernEnabled=false allowTestOnlyIPC=true ] -->
<title>Web Authentication API: PRF / hmac-secret with a mock HID authenticator that uses internal UV.</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="./resources/util.js"></script>
<script>
    const expectedPrfFirst = Base64URL.parse(testHmacSecretOutput32Base64);
    const expectedPrfBoth = Base64URL.parse(testHmacSecretOutput64Base64);
    const prfEvalFirst = new Uint8Array([1, 2, 3, 4]).buffer;
    const prfEvalSecond = new Uint8Array([5, 6, 7, 8]).buffer;

    function hidPrfConfig({
        expectKeyAgreement = false,
        requireHmacSecretExtension = false,
        rejectHmacSecretExtension = false,
        supportHmacSecretMc = false,
        keyAgreementError = false,
        malformedKeyAgreement = false,
        hmacSecretOutputBase64 = "",
        payloadBase64 = []
    } = {}) {
        return {
            hid: {
                supportInternalUV: true,
                supportHmacSecret: true,
                supportHmacSecretMc,
                expectKeyAgreement,
                requireHmacSecretExtension,
                rejectHmacSecretExtension,
                rejectPinUvAuth: true,
                keyAgreementError,
                malformedKeyAgreement,
                hmacSecretOutputBase64,
                payloadBase64
            }
        };
    }

    function createOptions(prf) {
        return {
            publicKey: {
                rp: { name: "localhost" },
                user: {
                    name: "John Appleseed",
                    id: Base64URL.parse(testUserhandleBase64),
                    displayName: "Appleseed",
                },
                challenge: Base64URL.parse("MTIzNDU2"),
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: { userVerification: "preferred" },
                extensions: { prf },
                timeout: 1000
            }
        };
    }

    function getOptions(prf) {
        return {
            publicKey: {
                challenge: Base64URL.parse("MTIzNDU2"),
                userVerification: "preferred",
                extensions: { prf },
                timeout: 1000
            }
        };
    }

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: true,
                requireHmacSecretExtension: true,
                hmacSecretOutputBase64: testHmacSecretOutput32Base64,
                payloadBase64: [testHmacSecretGetAssertionMessageBase64]
            }));
        }

        return navigator.credentials.get(getOptions({ eval: { first: prfEvalFirst } })).then(credential => {
            const prf = credential.getClientExtensionResults().prf;
            assert_true(!!prf, "prf extension results should be present");
            assert_true(!!prf.results, "prf.results should be present after evaluation");
            assert_array_equals(new Uint8Array(prf.results.first), expectedPrfFirst);
            assert_equals(prf.results.second, undefined);
        });
    }, "Internal-UV assertion with PRF evaluation fetches key agreement and returns expected PRF bytes.");

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: true,
                requireHmacSecretExtension: true,
                hmacSecretOutputBase64: testHmacSecretOutput64Base64,
                payloadBase64: [testHmacSecretGetAssertion64MessageBase64]
            }));
        }

        return navigator.credentials.get(getOptions({ eval: { first: prfEvalFirst, second: prfEvalSecond } })).then(credential => {
            const prf = credential.getClientExtensionResults().prf;
            assert_true(!!prf && !!prf.results, "prf.results should be present after two-input evaluation");
            assert_array_equals(new Uint8Array(prf.results.first), expectedPrfBoth.subarray(0, 32));
            assert_array_equals(new Uint8Array(prf.results.second), expectedPrfBoth.subarray(32, 64));
        });
    }, "Internal-UV assertion with two PRF inputs returns both expected outputs.");

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: true,
                requireHmacSecretExtension: true,
                supportHmacSecretMc: true,
                hmacSecretOutputBase64: testHmacSecretOutput32Base64,
                payloadBase64: [testHmacSecretMakeCredentialMessageBase64]
            }));
        }

        return navigator.credentials.create(createOptions({ eval: { first: prfEvalFirst } })).then(credential => {
            const prf = credential.getClientExtensionResults().prf;
            assert_true(!!prf, "prf extension results should be present");
            assert_true(!!prf.results, "prf.results should be present after hmac-secret-mc evaluation");
            assert_array_equals(new Uint8Array(prf.results.first), expectedPrfFirst);
        });
    }, "Internal-UV creation with hmac-secret-mc evaluation fetches key agreement and returns expected PRF bytes.");

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: false,
                rejectHmacSecretExtension: true,
                payloadBase64: [testAssertionMessageBase64]
            }));
        }

        return navigator.credentials.get(getOptions({ })).then(credential => {
            const extensions = credential.getClientExtensionResults();
            assert_equals(extensions.prf && extensions.prf.results, undefined, "prf.results must be absent without eval");
        });
    }, "PRF requested without eval does not perform key agreement or send hmac-secret inputs.");

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: false,
                rejectHmacSecretExtension: true,
                supportHmacSecretMc: true,
                payloadBase64: [testHmacSecretMakeCredentialMessageBase64]
            }));
        }

        return navigator.credentials.create(createOptions({ })).then(credential => {
            const prf = credential.getClientExtensionResults().prf;
            assert_true(!!prf && prf.enabled, "prf.enabled should still be advertised");
            assert_equals(prf.results, undefined, "prf.results must be absent without eval");
        });
    }, "PRF create without eval does not perform key agreement or send hmac-secret-mc inputs.");

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: true,
                keyAgreementError: true
            }));
        }

        return promiseRejects(t, "UnknownError", navigator.credentials.get(getOptions({ eval: { first: prfEvalFirst } })),
            "Could not obtain authenticator key agreement for PRF.");
    }, "Failed key-agreement response fails the PRF assertion without a PIN prompt.");

    promise_test(t => {
        if (window.internals) {
            internals.setMockWebAuthenticationConfiguration(hidPrfConfig({
                expectKeyAgreement: true,
                supportHmacSecretMc: true,
                malformedKeyAgreement: true
            }));
        }

        return promiseRejects(t, "UnknownError", navigator.credentials.create(createOptions({ eval: { first: prfEvalFirst } })),
            "Could not obtain authenticator key agreement for PRF.");
    }, "Malformed key-agreement response fails hmac-secret-mc creation without retrying.");
</script>
