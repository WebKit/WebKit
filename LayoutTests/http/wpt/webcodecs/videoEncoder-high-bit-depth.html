<!DOCTYPE html><!-- webkit-test-runner [ WebCodecsHighBitDepthEnabled=true ] -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// An 8-bit round trip moves each of these 10-bit samples by 2, whichever way it rounds.
const width = 128;
const height = 96;
const tenBitSamples = [403, 507, 516];
const tolerance = 1;

const inputFormats = ['I420P10', 'I422P10', 'I444P10', 'I420P12', 'I422P12', 'I444P12'];
const alphaInputFormats = ['I420AP10', 'I422AP10', 'I444AP10', 'I420AP12', 'I422AP12', 'I444AP12'];
const opaqueAlpha = 1023;
const highBitDepthCodec = 'vp09.02.10.10';
const eightBitCodec = 'vp09.00.10.08';
const hevcMain10Codec = 'hvc1.2.4.L93.B0';
const hevcMainCodec = 'hvc1.1.6.L93.B0';
const hevcMain42210Codec = 'hvc1.4.10.L93.9D.08';

function chromaSize(format, frameWidth = width, frameHeight = height)
{
    if (format.startsWith('I420'))
        return [frameWidth / 2, frameHeight / 2];
    if (format.startsWith('I422'))
        return [frameWidth / 2, frameHeight];
    return [frameWidth, frameHeight];
}

function createFrame(format, fullRange = false)
{
    const shift = format.endsWith('P12') ? 2 : 0;
    const [chromaWidth, chromaHeight] = chromaSize(format);
    const planeSizes = [width * height, chromaWidth * chromaHeight, chromaWidth * chromaHeight];
    const planeSamples = [...tenBitSamples];
    if (alphaInputFormats.includes(format)) {
        planeSizes.push(width * height);
        planeSamples.push(opaqueAlpha);
    }
    const data = new Uint16Array(planeSizes.reduce((total, size) => total + size));
    let offset = 0;
    for (let plane = 0; plane < planeSizes.length; ++plane) {
        data.fill(planeSamples[plane] << shift, offset, offset + planeSizes[plane]);
        offset += planeSizes[plane];
    }
    return new VideoFrame(data, {
        format,
        codedWidth: width,
        codedHeight: height,
        timestamp: 0,
        colorSpace: { primaries: 'bt709', transfer: 'bt709', matrix: 'bt709', fullRange },
    });
}

async function encodeDecode(t, codec, frame, encodedWidth = width, encodedHeight = height, checkDecoderConfig = null)
{
    const config = { codec, width: encodedWidth, height: encodedHeight, bitrate: 2000000, framerate: 30 };
    const support = await VideoEncoder.isConfigSupported(config);
    assert_implements_optional(support.supported, `${codec} encoding is not supported`);

    const chunks = [];
    let decoderConfig;
    const encoder = new VideoEncoder({
        output: (chunk, metadata) => {
            chunks.push(chunk);
            if (metadata?.decoderConfig)
                decoderConfig = metadata.decoderConfig;
        },
        error: t.unreached_func('encoder error'),
    });
    encoder.configure(config);
    encoder.encode(frame, { keyFrame: true });
    await encoder.flush();
    encoder.close();
    assert_equals(chunks.length, 1, 'chunk count');
    assert_not_equals(decoderConfig, undefined, 'decoderConfig');
    checkDecoderConfig?.(decoderConfig);

    const decoded = [];
    const decoder = new VideoDecoder({
        output: frame => decoded.push(frame),
        error: t.unreached_func('decoder error'),
    });
    decoder.configure(decoderConfig);
    decoder.decode(chunks[0]);
    await decoder.flush();
    decoder.close();
    assert_equals(decoded.length, 1, 'decoded frame count');
    return decoded[0];
}

// ISO/IEC 14496-15 8.3.3.1 HEVCDecoderConfigurationRecord.
function hvcCChecker(profileIDC, chromaFormatIDC, bitDepth)
{
    return decoderConfig => {
        const record = new Uint8Array(ArrayBuffer.isView(decoderConfig.description) ? decoderConfig.description.buffer : decoderConfig.description);
        assert_greater_than_equal(record.length, 23, 'hvcC size');
        assert_equals(record[1] & 0x1f, profileIDC, 'hvcC general_profile_idc');
        assert_equals(record[16] & 0x3, chromaFormatIDC, 'hvcC chroma_format_idc');
        assert_equals((record[17] & 0x7) + 8, bitDepth, 'hvcC luma bit depth');
    };
}

async function checkTenBitSamples(decoded, expectedFormat = 'I420P10')
{
    assert_equals(decoded.format, expectedFormat, 'decoded format');

    const buffer = new ArrayBuffer(decoded.allocationSize());
    const layout = await decoded.copyTo(buffer);
    const { width: decodedWidth, height: decodedHeight } = decoded.visibleRect;
    const [chromaWidth, chromaHeight] = chromaSize(expectedFormat, decodedWidth, decodedHeight);
    const planeSizes = [decodedWidth * decodedHeight, chromaWidth * chromaHeight, chromaWidth * chromaHeight];
    for (let plane = 0; plane < 3; ++plane) {
        const samples = new Uint16Array(buffer, layout[plane].offset, planeSizes[plane]);
        const mismatch = samples.findIndex(sample => Math.abs(sample - tenBitSamples[plane]) > tolerance);
        assert_equals(mismatch, -1, `plane ${plane} sample ${mismatch} is ${samples[mismatch]}, expected ${tenBitSamples[plane]}`);
    }
}

for (const format of [...inputFormats, ...alphaInputFormats]) {
    promise_test(async t => {
        const frame = createFrame(format);
        t.add_cleanup(() => frame.close());
        const decoded = await encodeDecode(t, highBitDepthCodec, frame);
        t.add_cleanup(() => decoded.close());
        await checkTenBitSamples(decoded);
    }, `${format} frame encoded with ${highBitDepthCodec} keeps 10 bits`);
}

for (const format of [...inputFormats, ...alphaInputFormats]) {
    promise_test(async t => {
        const frame = createFrame(format, true);
        t.add_cleanup(() => frame.close());
        const decoded = await encodeDecode(t, highBitDepthCodec, frame, width, height, decoderConfig => {
            assert_true(decoderConfig.colorSpace?.fullRange, 'decoderConfig full range');
        });
        t.add_cleanup(() => decoded.close());
        assert_true(decoded.colorSpace.fullRange, 'decoded full range');
        await checkTenBitSamples(decoded);
    }, `${format} full range frame encoded with ${highBitDepthCodec} keeps 10 bits and its range`);
}

promise_test(async t => {
    const frame = createFrame('I420P10');
    t.add_cleanup(() => frame.close());
    const decoded = await encodeDecode(t, highBitDepthCodec, frame, 96, 64);
    t.add_cleanup(() => decoded.close());
    assert_equals(decoded.codedWidth, 96, 'decoded width');
    assert_equals(decoded.codedHeight, 64, 'decoded height');
    await checkTenBitSamples(decoded);
}, `I420P10 frame scaled by a ${highBitDepthCodec} encoder keeps 10 bits`);

promise_test(async t => {
    const frame = createFrame('I420P10');
    t.add_cleanup(() => frame.close());
    const decoded = await encodeDecode(t, eightBitCodec, frame);
    t.add_cleanup(() => decoded.close());
    assert_in_array(decoded.format, ['I420', 'NV12'], 'decoded format');
}, `I420P10 frame encoded with ${eightBitCodec} decodes to 8 bits`);

for (const format of [...inputFormats, ...alphaInputFormats]) {
    promise_test(async t => {
        const frame = createFrame(format);
        t.add_cleanup(() => frame.close());
        const decoded = await encodeDecode(t, hevcMain10Codec, frame, width, height, hvcCChecker(2, 1, 10));
        t.add_cleanup(() => decoded.close());
        await checkTenBitSamples(decoded);
    }, `${format} frame encoded with ${hevcMain10Codec} keeps 10 bits`);
}

promise_test(async t => {
    const frame = createFrame('I420P10');
    t.add_cleanup(() => frame.close());
    const decoded = await encodeDecode(t, hevcMainCodec, frame, width, height, hvcCChecker(1, 1, 8));
    t.add_cleanup(() => decoded.close());
    assert_in_array(decoded.format, ['I420', 'NV12'], 'decoded format');
}, `I420P10 frame encoded with ${hevcMainCodec} decodes to 8 bits`);

promise_test(async t => {
    const frame = createFrame('I422P10');
    t.add_cleanup(() => frame.close());
    const decoded = await encodeDecode(t, hevcMain42210Codec, frame, width, height, hvcCChecker(4, 2, 10));
    t.add_cleanup(() => decoded.close());
    await checkTenBitSamples(decoded, 'I422P10');
}, `I422P10 frame encoded with ${hevcMain42210Codec} keeps 10 bits and 4:2:2`);

for (const codec of ['hvc1.4.10.L93.98', 'hvc1.4.10.L93']) {
    promise_test(async t => {
        const mainSupport = await VideoEncoder.isConfigSupported({ codec: hevcMainCodec, width, height });
        assert_implements_optional(mainSupport.supported, `${hevcMainCodec} encoding is not supported`);
        const support = await VideoEncoder.isConfigSupported({ codec, width, height });
        assert_false(support.supported);
    }, `${codec} encoding is not supported`);
}
</script>
