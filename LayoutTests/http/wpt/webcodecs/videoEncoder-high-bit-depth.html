<!DOCTYPE html><!-- webkit-test-runner [ WebCodecsHighBitDepthEnabled=true ] -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// An 8-bit round trip moves each of these 10-bit samples by 2, whichever way it rounds.
const width = 128;
const height = 96;
const tenBitSamples = [403, 507, 516];
const tolerance = 1;

const inputFormats = ['I420P10', 'I422P10', 'I444P10', 'I420P12', 'I422P12', 'I444P12'];
const highBitDepthCodec = 'vp09.02.10.10';
const eightBitCodec = 'vp09.00.10.08';

function chromaSize(format)
{
    if (format.startsWith('I420'))
        return [width / 2, height / 2];
    if (format.startsWith('I422'))
        return [width / 2, height];
    return [width, height];
}

function createFrame(format)
{
    const shift = format.endsWith('P12') ? 2 : 0;
    const [chromaWidth, chromaHeight] = chromaSize(format);
    const planeSizes = [width * height, chromaWidth * chromaHeight, chromaWidth * chromaHeight];
    const data = new Uint16Array(planeSizes[0] + planeSizes[1] + planeSizes[2]);
    let offset = 0;
    for (let plane = 0; plane < 3; ++plane) {
        data.fill(tenBitSamples[plane] << shift, offset, offset + planeSizes[plane]);
        offset += planeSizes[plane];
    }
    return new VideoFrame(data, {
        format,
        codedWidth: width,
        codedHeight: height,
        timestamp: 0,
        colorSpace: { primaries: 'bt709', transfer: 'bt709', matrix: 'bt709', fullRange: false },
    });
}

async function encodeDecode(t, codec, frame, encodedWidth = width, encodedHeight = height)
{
    const config = { codec, width: encodedWidth, height: encodedHeight, bitrate: 2000000, framerate: 30 };
    const support = await VideoEncoder.isConfigSupported(config);
    assert_implements_optional(support.supported, `${codec} encoding is not supported`);

    const chunks = [];
    let decoderConfig;
    const encoder = new VideoEncoder({
        output: (chunk, metadata) => {
            chunks.push(chunk);
            if (metadata?.decoderConfig)
                decoderConfig = metadata.decoderConfig;
        },
        error: t.unreached_func('encoder error'),
    });
    encoder.configure(config);
    encoder.encode(frame, { keyFrame: true });
    await encoder.flush();
    encoder.close();
    assert_equals(chunks.length, 1, 'chunk count');
    assert_not_equals(decoderConfig, undefined, 'decoderConfig');

    const decoded = [];
    const decoder = new VideoDecoder({
        output: frame => decoded.push(frame),
        error: t.unreached_func('decoder error'),
    });
    decoder.configure(decoderConfig);
    decoder.decode(chunks[0]);
    await decoder.flush();
    decoder.close();
    assert_equals(decoded.length, 1, 'decoded frame count');
    return decoded[0];
}

async function checkTenBitSamples(decoded)
{
    assert_equals(decoded.format, 'I420P10', 'decoded format');

    const buffer = new ArrayBuffer(decoded.allocationSize());
    const layout = await decoded.copyTo(buffer);
    const lumaSize = decoded.codedWidth * decoded.codedHeight;
    const planeSizes = [lumaSize, lumaSize / 4, lumaSize / 4];
    for (let plane = 0; plane < 3; ++plane) {
        const samples = new Uint16Array(buffer, layout[plane].offset, planeSizes[plane]);
        const mismatch = samples.findIndex(sample => Math.abs(sample - tenBitSamples[plane]) > tolerance);
        assert_equals(mismatch, -1, `plane ${plane} sample ${mismatch} is ${samples[mismatch]}, expected ${tenBitSamples[plane]}`);
    }
}

for (const format of inputFormats) {
    promise_test(async t => {
        const frame = createFrame(format);
        t.add_cleanup(() => frame.close());
        const decoded = await encodeDecode(t, highBitDepthCodec, frame);
        t.add_cleanup(() => decoded.close());
        await checkTenBitSamples(decoded);
    }, `${format} frame encoded with ${highBitDepthCodec} keeps 10 bits`);
}

promise_test(async t => {
    const frame = createFrame('I420P10');
    t.add_cleanup(() => frame.close());
    const decoded = await encodeDecode(t, highBitDepthCodec, frame, 96, 64);
    t.add_cleanup(() => decoded.close());
    assert_equals(decoded.codedWidth, 96, 'decoded width');
    assert_equals(decoded.codedHeight, 64, 'decoded height');
    await checkTenBitSamples(decoded);
}, `I420P10 frame scaled by a ${highBitDepthCodec} encoder keeps 10 bits`);

promise_test(async t => {
    const frame = createFrame('I420P10');
    t.add_cleanup(() => frame.close());
    const decoded = await encodeDecode(t, eightBitCodec, frame);
    t.add_cleanup(() => decoded.close());
    assert_in_array(decoded.format, ['I420', 'NV12'], 'decoded format');
}, `I420P10 frame encoded with ${eightBitCodec} decodes to 8 bits`);
</script>
