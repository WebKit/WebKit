<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/videoframe-utilities.js"></script>
<canvas style="display: none" id="resultCanvas" width="64" height="2"></canvas>
<script>
// Tests that VideoFrame constructed from I420 data has correct RGBA pixel values when uploaded
// to a WebGL texture and drawn, for each YCbCr matrix.
// 1. Create sRGB RGBA test pattern.
// 2. Convert that to I420 data with a reference JS implementation.
// 3. Create VideoFrame of this I420 data, upload it with texImage2D and draw it to the canvas.
// Expect that the drawn pixels are correct.
// To verify that the pixels are correct:
// V1. Convert the I420 data to sRGB RGBA data with a reference JS implementation.
// V2. Expect that reference and result match.
// The frames use BT709 primaries and the sRGB transfer function, so that the YCbCr matrix is the only
// conversion needed to upload them to the RGBA texture.
const matrices = ["bt709", "smpte170m", "bt470bg", "smpte240m", "bt2020-ncl"];
// Blue and magenta are the colors which the BT709 and SMPTE240M matrices convert most differently,
// by about 5 in a channel.
const colors = [[255, 0, 0, 255], [0, 255, 0,  255], [0, 0, 255, 255], [255, 0, 255, 255], [0, 255, 255, 255], [30, 30, 230, 255], [3, 3, 77, 255]];

const vertexShaderSource = `
attribute vec2 position;
varying vec2 uv;
void main() {
    uv = position * 0.5 + 0.5;
    gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragmentShaderSource = `
precision mediump float;
uniform sampler2D videoTexture;
varying vec2 uv;
void main() {
    gl_FragColor = texture2D(videoTexture, uv);
}
`;

const gl = resultCanvas.getContext("webgl");

function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexShaderSource));
gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource));
gl.bindAttribLocation(program, 0, "position");
gl.linkProgram(program);
gl.useProgram(program);

// One oversized triangle covering the viewport.
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// Uploads videoFrame to a texture, draws it and returns the RGBA values of the bottom left pixel.
function drawTexImage2D(videoFrame) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, videoFrame);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    assert_equals(gl.getError(), gl.NO_ERROR);
    return Array.from(pixel);
}

function runTest(matrix, fullRange, color) {
    const pattern = createTestImageData(resultCanvas.width, resultCanvas.height, color);
    const i420Data = sRGBImageDataToI420(pattern, { primaries: "bt709", transfer: "iec61966-2-1", matrix, fullRange });
    const videoFrame = createVideoFrame(i420Data);
    // This is being tested.
    const resultColor = drawTexImage2D(videoFrame);
    videoFrame.close();

    // For clarity, convert the data also with JS-based reference implementation and
    // compare that against the above native implementation.
    const referenceColor = Array.from(I420ToSRGB(i420Data).data.slice(0, 4));
    // The matrices are close to each other, so a wrong matrix is detected only by a tight tolerance.
    assert_array_approx_equals(resultColor, referenceColor, 1);
    assert_array_approx_equals(resultColor, color, 5);
}

for (let matrix of matrices) {
    for (let fullRange of [true, false]) {
        for (let color of colors) {
            test(() => {
                runTest(matrix, fullRange, color);
            }, `VideoFrame from I420 data drawn through WebGL texture has correct RGBA pixel values. matrix: ${matrix} fullRange: ${fullRange} color:${color}`);
        }
    }
}
</script>
