// resources/test-vp8-hiddenframes.webm is a copy of media/content/test-vp8-hiddenframes.webm; see
// media/media-vp8-hiddenframes.html for how it was generated. Frames marked hidden are alternate
// reference frames with show_frame unset: they update the reference buffers and produce no output.
// FRAMES was generated with:
// $ paste -d, <(ffprobe -v error -select_streams v:0 -show_entries packet=pts,size,pos -of csv=p=0 test-vp8-hiddenframes.webm) \
//     <(ffmpeg -v trace -i test-vp8-hiddenframes.webm -map 0:v -c copy -bsf:v trace_headers -f null - 2>&1 | grep -o "show_frame .* = [01]$" | grep -o "[01]$") \
//     | awk -F, '{ printf "    {offset: %d, size: %d, timestamp: %d%s},\n", $3 + 4, $2, $1 * 1000, $4 ? "" : ", hidden: true" }'
// ffprobe reports the position of the SimpleBlock payload; the frame starts after its 4-byte header
// (track number, timecode and flags). Timestamps are in milliseconds in the file.

promise_test(async () => {
    const support = await VideoDecoder.isConfigSupported(CONFIG);
    assert_true(support.supported, "VP8 is supported");

    const buffer = await (await fetch("resources/test-vp8-hiddenframes.webm")).arrayBuffer();
    const shownTimestamps = FRAMES.filter(frame => !frame.hidden).map(frame => frame.timestamp);

    const outputTimestamps = [];
    let decodeError = null;
    const decoder = new VideoDecoder({
        output: frame => {
            outputTimestamps.push(frame.timestamp);
            frame.close();
        },
        error: e => decodeError = e,
    });
    decoder.configure(CONFIG);
    FRAMES.forEach((frame, index) => {
        decoder.decode(new EncodedVideoChunk({
            type: index ? "delta" : "key",
            timestamp: frame.timestamp,
            data: new Uint8Array(buffer, frame.offset, frame.size)
        }));
    });
    await decoder.flush().catch(() => { });

    assert_equals(decodeError?.message, undefined, "no decode error");
    assert_equals(decoder.state, "configured", "decoder state");
    assert_array_equals(outputTimestamps, shownTimestamps, "one output per shown frame");
    decoder.close();
}, "VP8 frames with show_frame unset produce no output and are not a decoding error");
