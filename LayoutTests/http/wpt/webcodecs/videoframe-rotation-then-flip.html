<!DOCTYPE html>
<html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// A 4x2 source image:
//   y y r r
//   b b g g
const width = 4, height = 2;
const colors = { y: [255, 255, 0], r: [255, 0, 0], b: [0, 0, 255], g: [0, 255, 0] };
const source = [
    ['y', 'y', 'r', 'r'],
    ['b', 'b', 'g', 'g'],
];

function makeFrame(rotation)
{
    const data = new Uint8Array(width * height * 4);
    source.forEach((row, y) => row.forEach((name, x) => data.set([...colors[name], 255], 4 * (y * width + x))));
    const frame = new VideoFrame(data, { format: 'RGBA', codedWidth: width, codedHeight: height, timestamp: 0, rotation });
    const mirrored = internals.mirroredVideoFrame(frame);
    frame.close();
    return mirrored;
}

// WebCodecs transformation order: the frame is rotated clockwise first, then flipped horizontally.
function expectedColorName(rotation, x, y)
{
    const rotatedWidth = (rotation % 180) ? height : width;
    const sourceX = rotatedWidth - 1 - x; // Horizontal flip applied on the rotated image.
    switch (rotation) {
    case 0: return source[y][sourceX];
    case 90: return source[height - 1 - sourceX][y];
    case 180: return source[height - 1 - y][width - 1 - sourceX];
    case 270: return source[sourceX][width - 1 - y];
    }
}

function verifyPixels(pixels, rotation)
{
    const w = (rotation % 180) ? height : width;
    const h = (rotation % 180) ? width : height;
    assert_equals(pixels.length, w * h * 4, "pixels length");
    for (let y = 0; y < h; ++y) {
        for (let x = 0; x < w; ++x) {
            const name = expectedColorName(rotation, x, y);
            const offset = 4 * (y * w + x);
            const actual = Array.from(pixels.subarray(offset, offset + 3));
            for (let i = 0; i < 3; ++i)
                assert_approx_equals(actual[i], colors[name][i], 2, `pixel (${x}, ${y}) should be ${name} [${colors[name]}] but is [${actual}]`);
        }
    }
}

for (const rotation of [0, 90, 180, 270]) {
    promise_test(async t => {
        const frame = makeFrame(rotation);
        t.add_cleanup(() => frame.close());
        assert_equals(frame.rotation, rotation, "rotation");
        const w = (rotation % 180) ? height : width;
        const h = (rotation % 180) ? width : height;
        const canvas = new OffscreenCanvas(w, h);
        const context = canvas.getContext('2d');
        context.drawImage(frame, 0, 0);
        verifyPixels(context.getImageData(0, 0, w, h).data, rotation);
    }, `drawImage of a mirrored VideoFrame rotated by ${rotation} degrees`);

    promise_test(async t => {
        const frame = makeFrame(rotation);
        t.add_cleanup(() => frame.close());
        const bitmap = await createImageBitmap(frame);
        t.add_cleanup(() => bitmap.close());
        const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
        const context = canvas.getContext('2d');
        context.drawImage(bitmap, 0, 0);
        verifyPixels(context.getImageData(0, 0, bitmap.width, bitmap.height).data, rotation);
    }, `createImageBitmap of a mirrored VideoFrame rotated by ${rotation} degrees`);
}
</script>
</body>
</html>
