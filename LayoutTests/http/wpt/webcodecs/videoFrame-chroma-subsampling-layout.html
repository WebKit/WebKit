<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const width = 4;
const height = 2;

const formats = [
    { format: "I420", planes: [{ stride: 4, rows: 2 }, { stride: 2, rows: 1 }, { stride: 2, rows: 1 }] },
    { format: "I422", planes: [{ stride: 4, rows: 2 }, { stride: 2, rows: 2 }, { stride: 2, rows: 2 }] },
    { format: "I444", planes: [{ stride: 4, rows: 2 }, { stride: 4, rows: 2 }, { stride: 4, rows: 2 }] },
];

function makeFrame(format, planes, init = { })
{
    const size = planes.reduce((total, plane) => total + plane.stride * plane.rows, 0);
    return new VideoFrame(new Uint8Array(size), { format, timestamp: 0, codedWidth: width, codedHeight: height, ...init });
}

for (const { format, planes } of formats) {
    test(() => {
        const frame = makeFrame(format, planes);
        const expectedSize = planes.reduce((total, plane) => total + plane.stride * plane.rows, 0);
        assert_equals(frame.allocationSize(), expectedSize);
        frame.close();
    }, `${format} allocationSize`);

    promise_test(async () => {
        const frame = makeFrame(format, planes);
        const buffer = new Uint8Array(frame.allocationSize());
        const layout = await frame.copyTo(buffer);
        let offset = 0;
        assert_equals(layout.length, planes.length);
        for (let i = 0; i < planes.length; ++i) {
            assert_equals(layout[i].offset, offset, `plane ${i} offset`);
            assert_equals(layout[i].stride, planes[i].stride, `plane ${i} stride`);
            offset += planes[i].stride * planes[i].rows;
        }
        frame.close();
    }, `${format} copyTo layout`);
}

test(() => {
    const frame = makeFrame("I422", formats[1].planes);
    const options = { rect: { x: 0, y: 1, width: 4, height: 1 } };
    assert_equals(frame.allocationSize(options), 4 + 2 + 2);
    assert_throws_js(TypeError, () => frame.allocationSize({ rect: { x: 1, y: 0, width: 2, height: 2 } }));
    frame.close();
}, "I422 allows an odd rect.y and rejects an odd rect.x");

test(() => {
    const frame = makeFrame("I444", formats[2].planes);
    assert_equals(frame.allocationSize({ rect: { x: 1, y: 1, width: 3, height: 1 } }), 3 * 3);
    frame.close();
}, "I444 allows an odd rect offset");
</script>
