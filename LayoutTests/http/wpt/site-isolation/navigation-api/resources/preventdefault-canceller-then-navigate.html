<!doctype html>
<meta charset="utf-8">
<title>Subframe that cancels its own cross-site navigation and immediately starts another one</title>
<script>
window.__canceller = "alive";

const params = new URLSearchParams(location.search);
const remote = params.get("remote");
const next = params.get("next");

navigation.onnavigate = e => {
    navigation.onnavigate = null;
    const report = { type: "navigate", cancelable: e.cancelable, destination: e.destination.url };
    if (e.cancelable)
        e.preventDefault();
    parent.postMessage(report, "*");

    // Reentrancy probe: the UI process asks for this dispatch while its navigation policy decision for
    // `remote` is still outstanding, so this starts a second navigation from inside that window.
    if (next)
        location.href = next;
};

addEventListener("load", () => {
    const a = document.createElement("a");
    a.href = remote;
    document.body.appendChild(a);
    a.click();
});
</script>
<body></body>
