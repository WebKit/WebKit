<!doctype html>
<meta charset="utf-8">
<title>Subframe that cancels its own cross-site navigation</title>
<script>
// Read by the parent after the settle window to tell "still this document" from "replaced".
window.__canceller = "alive";

const remote = new URLSearchParams(location.search).get("remote");

navigation.onnavigate = e => {
  navigation.onnavigate = null;
  const report = { type: "navigate", cancelable: e.cancelable, destination: e.destination.url };
  if (e.cancelable)
    e.preventDefault();
  parent.postMessage(report, "*");
};

// Self-initiated: a parent-initiated cross-site navigation is not same-origin with this frame and
// would dispatch no navigate event here.
addEventListener("load", () => {
  const a = document.createElement("a");
  a.href = remote;
  document.body.appendChild(a);
  a.click();
});
</script>
<body></body>
