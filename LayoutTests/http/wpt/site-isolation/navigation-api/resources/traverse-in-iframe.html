<!doctype html>
<meta charset="utf-8">
<script>
function report(data) {
    parent.postMessage(data, "*");
}

async function traverse(step, traversal) {
    try {
        await traversal().finished;
        report({ step, index: navigation.currentEntry.index, hash: location.hash });
    } catch (error) {
        report({ step, error: error.name, index: navigation.currentEntry.index, hash: location.hash });
    }
}

onload = async () => {
    await navigation.navigate("#1").finished;
    await navigation.navigate("#2").finished;
    report({ step: "ready", index: navigation.currentEntry.index, length: navigation.entries().length });
};

onmessage = event => {
    if (event.data === "traverseTo")
        traverse("traverseTo", () => navigation.traverseTo(navigation.entries()[0].key));
    else if (event.data === "forward")
        traverse("forward", () => navigation.forward());
};
</script>
