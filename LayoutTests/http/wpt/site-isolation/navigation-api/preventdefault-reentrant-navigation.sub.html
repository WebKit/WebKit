<!doctype html><!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<meta charset="utf-8">
<title>Navigation API: starting a navigation from the navigate event handler that cancels a cross-site process swap (Site Isolation)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<!--
  The navigate event for a process-swapping navigation is dispatched by the UI process while its
  navigation policy decision is still outstanding, so the handler runs at a point where script
  previously could not run. This covers the reentrant case: the handler cancels the cross-site
  navigation and immediately starts a same-origin one from inside that window.

  The subframe must end up on the second navigation's URL and never on the cross-site destination,
  and the reply to the outstanding decision must not resurrect the cancelled swap.
-->
<script>
const REMOTE = "http://{{hosts[alt][]}}:{{ports[http][0]}}/WebKit/site-isolation/navigation-api/resources/preventdefault-destination.html";
const NEXT = "resources/preventdefault-destination.html?after-cancel";
const CANCELLER = "resources/preventdefault-canceller-then-navigate.html"
    + "?remote=" + encodeURIComponent(REMOTE)
    + "&next=" + encodeURIComponent(NEXT);

function waitFor(predicate, timeoutMs, description) {
    return new Promise((resolve, reject) => {
        const start = Date.now();
        const tick = () => {
            if (predicate()) {
                resolve();
                return;
            }
            if (Date.now() - start >= timeoutMs) {
                reject(new Error(`timed out waiting for ${description}`));
                return;
            }
            setTimeout(tick, 25);
        };
        tick();
    });
}

promise_test(async t => {
    const reports = [];
    const onMessage = e => reports.push(e.data);
    window.addEventListener("message", onMessage);
    t.add_cleanup(() => window.removeEventListener("message", onMessage));

    const iframe = document.createElement("iframe");
    const loaded = new Promise(resolve => iframe.onload = () => resolve());
    iframe.src = CANCELLER;
    document.body.appendChild(iframe);
    await loaded;

    const expectedURL = new URL(NEXT, iframe.contentWindow.location.href).href;

    await waitFor(() => reports.length > 0, 4000, "the subframe's navigate event");
    assert_equals(reports[0].destination, REMOTE, "the cancelled navigation was the cross-site one");

    // Bound the cross-site round trip by a real fetch of it rather than a guessed sleep, so a swap
    // that was only deferred rather than cancelled would have committed by now.
    await fetch(REMOTE, { mode: "no-cors" });
    await waitFor(() => {
        try {
            return iframe.contentWindow.location.href === expectedURL;
        } catch (e) {
            return false;
        }
    }, 4000, "the subframe to reach the navigation started from the handler");

    let currentURL;
    try {
        currentURL = iframe.contentWindow.location.href;
    } catch (e) {
        assert_unreached(`subframe committed the cross-site destination (lost same-origin access: ${e})`);
    }
    assert_equals(currentURL, expectedURL, "subframe is on the navigation started from the handler");
}, "A navigation started from the navigate event handler replaces a cancelled cross-site process swap (Site Isolation)");
</script>
</body>
