<!doctype html><!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<meta charset="utf-8">
<title>Navigating a frame in another process replaces its session history entry when HTML says so</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// This document is on localhost. A web-platform.test document goes in the process cross-site frames share, and a
// loopback site like 127.0.0.1 gets a process of its own, so a navigation can stay in another process or move to a third.
const helperPath = "/html/browsers/history/the-location-interface/resources/cross-site-navigation-helper.html";
const thisSite = `http://localhost:{{ports[http][0]}}${helperPath}`;
const sharedSite = `http://{{host}}:{{ports[http][0]}}${helperPath}`;
const isolatedSite = `http://127.0.0.1:{{ports[http][0]}}${helperPath}`;
const sites = { "this site": thisSite, "the shared process": sharedSite, "a process of its own": isolatedSite };

function reportOf(url) {
  return new Promise(resolve => {
    addEventListener("message", function listener(event) {
      if (event.data.type !== "report" || event.data.url !== url)
        return;
      removeEventListener("message", listener);
      resolve(event.data);
    });
  });
}

// Navigates a new iframe or popup at from using navigate(window, url) and resolves with how much its session history grew.
async function historyGrowth(t, kind, from, to, navigate) {
  const id = `${t.name}`.replace(/\W+/g, "-");
  const startURL = `${from}?${id}`;
  const startReport = reportOf(startURL);
  let target, historyLength;
  if (kind == "iframe") {
    const iframe = document.createElement("iframe");
    iframe.src = startURL;
    document.body.append(iframe);
    t.add_cleanup(() => iframe.remove());
    target = iframe.contentWindow;
  } else {
    target = open(startURL);
    t.add_cleanup(() => target.close());
  }
  historyLength = (await startReport).historyLength;
  if (kind == "iframe")
    historyLength = history.length;
  const url = `${to}?${id}-navigated`;
  const report = reportOf(url);
  navigate(target, url);
  const newHistoryLength = (await report).historyLength;
  return (kind == "iframe" ? history.length : newHistoryLength) - historyLength;
}

function article(kind) {
  return kind == "iframe" ? "an" : "a";
}

const stays = [["the shared process", "the shared process"], ["a process of its own", "a process of its own"]];
const moves = [["the shared process", "a process of its own"], ["the shared process", "this site"], ["a process of its own", "the shared process"]];

for (const kind of ["iframe", "popup"]) {
  for (const [from, to] of [...stays, ...moves]) {
    promise_test(async t => {
      assert_equals(await historyGrowth(t, kind, sites[from], sites[to], (target, url) => target.location.replace(url)), 0);
    }, `location.replace() of ${article(kind)} ${kind} in ${from} to ${to}`);
  }

  for (const [from, to] of moves) {
    promise_test(async t => {
      assert_equals(await historyGrowth(t, kind, sites[from], sites[to], (target, url) => target.postMessage({ action: "navigate-replace", url }, "*")), 0);
    }, `navigation.navigate() with history: "replace" of ${article(kind)} ${kind} in ${from} to ${to}`);
  }

  const [from, to] = stays[0];
  promise_test(async t => {
    assert_equals(await historyGrowth(t, kind, sites[from], sites[to], (target, url) => target.location.href = url), 1);
  }, `Setting location.href of ${article(kind)} ${kind} in ${from} to ${to}`);
}
</script>
</body>
