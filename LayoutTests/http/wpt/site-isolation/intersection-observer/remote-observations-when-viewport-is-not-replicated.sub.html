<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body style="margin: 0">

<iframe id="firstFrame" style="position: absolute; left: 0; top: 1000px; width: 200px; height: 200px; border: none"
    src="http://{{hosts[alt][]}}:{{ports[http][0]}}/WebKit/site-isolation/intersection-observer/resources/report-target-intersection-frame.html"></iframe>
<div style="height: 20000px"></div>

<script>

const latestReports = new Map;
window.addEventListener("message", event => latestReports.set(event.source, JSON.parse(event.data)));

function latestReportFor(iframe)
{
    return latestReports.get(iframe.contentWindow);
}

async function settle()
{
    for (let i = 0; i < 20; i++)
        await new Promise(resolve => requestAnimationFrame(resolve));
}

async function scrollToAndSettle(y)
{
    window.scrollTo(0, y);
    await settle();
}

async function waitForReportFrom(iframe)
{
    while (!latestReportFor(iframe))
        await new Promise(resolve => requestAnimationFrame(resolve));
    await settle();
}

promise_test(async t => {
    t.add_cleanup(() => window.scrollTo(0, 0));

    await waitForReportFrom(firstFrame);

    assert_false(latestReportFor(firstFrame).isIntersecting,
        "a target in a cross-site frame below the fold must not be intersecting");

    await scrollToAndSettle(400);
    assert_true(latestReportFor(firstFrame).isIntersecting,
        "the target's top edge intersects the bottom viewport and should be counted as intersecting");

    await scrollToAndSettle(1000);
    assert_true(latestReportFor(firstFrame).isIntersecting, "the frame is fully within the viewport");

    await scrollToAndSettle(1200);
    assert_true(latestReportFor(firstFrame).isIntersecting,
        "the target's bottom edge intersects the top of the viewport and should be counted as intersecting");

    await scrollToAndSettle(2000);
    assert_false(latestReportFor(firstFrame).isIntersecting,
        "the target is fully offscreen and should be counted as not intersecting");

    await scrollToAndSettle(15000);
    assert_false(latestReportFor(firstFrame).isIntersecting,
        "the target continues to be offscreen and should count as not intersecting even if viewport replication IPC is stopped");

    // Add a cross-site frame that is outside the viewport, but that would intersect the viewport
    // that was last broadcast by the main frame (at y=2000). We should give the newly added frame
    // the main frame's current viewport and not report an intersection.
    const addedFrame = document.createElement("iframe");
    addedFrame.style.cssText = "position: absolute; left: 0; top: 2200px; width: 200px; height: 200px; border: none";
    addedFrame.src = firstFrame.src;
    document.body.appendChild(addedFrame);

    await waitForReportFrom(addedFrame);
    assert_false(latestReportFor(addedFrame).isIntersecting,
        "a target in a frame added outside the viewport while viewport replication IPC is stopped must not be intersecting");

    await scrollToAndSettle(2000);
    assert_true(latestReportFor(addedFrame).isIntersecting,
        "the added frame should be intersecting after scrolling back to the viewport that was last broadcast");
}, "Remote intersection observations stay correct once the viewport stops being replicated");

</script>
