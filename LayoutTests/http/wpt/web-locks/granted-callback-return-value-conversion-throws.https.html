<!DOCTYPE html>
<meta charset="utf-8">
<title>A lock request rejects with the exception thrown while resolving the granted callback's returned promise</title>
<link rel="help" href="https://webidl.spec.whatwg.org/#invoke-a-callback-function">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
function promiseWithThrowingConstructorGetter(error)
{
    const promise = Promise.resolve();
    Object.defineProperty(promise, "constructor", { get() { throw error; } });
    return promise;
}

promise_test(t => {
    const error = new Error("boom");
    return promise_rejects_exactly(t, error, navigator.locks.request(location.pathname, () => promiseWithThrowingConstructorGetter(error)));
}, "navigator.locks.request() rejects with the exception thrown by the returned promise's constructor getter");
</script>
