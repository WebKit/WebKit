<!DOCTYPE html>
<meta charset="utf-8">
<title>Digital Credential API: an OpenID4VP request that does not validate still reaches the virtual wallet</title>
<link rel="help" href="https://w3c-fedid.github.io/digital-credentials/" />
<link rel="author" href="mailto:pascoe@apple.com">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js?feature=bidi"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body></body>
<script type="module">
import { makeGetOptions } from "../ISO18013/support/helper.js";

promise_test(async (t) => {
  await test_driver.set_virtual_wallet_behavior("respond", "openid4vp-v1-signed", { vp_token: { mdl: ["token"] } });
  t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));
  await test_driver.bless("user activation");

  const options = makeGetOptions({ protocol: "openid4vp-v1-signed" });
  const result = await navigator.credentials.get(options);

  assert_equals(result.protocol, "openid4vp-v1-signed");
  assert_array_equals(result.data.vp_token.mdl, ["token"]);
}, "openid4vp-v1-signed: a virtual wallet answers a request for another origin.");
</script>
