<!DOCTYPE html>
<meta charset="utf-8">
<title>Digital Credential API: OpenID4VP virtual wallet roundtrip</title>
<link rel="help" href="https://w3c-fedid.github.io/digital-credentials/" />
<link rel="author" href="mailto:pascoe@apple.com">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js?feature=bidi"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body></body>
<script type="module">
import { makeGetOptions } from "../ISO18013/support/helper.js";

async function setMockResponse(t, protocol, responseObj) {
  await test_driver.set_virtual_wallet_behavior("respond", protocol, responseObj);
  t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));
}

const roundtripTests = [
  { protocol: "openid4vp-v1-signed", token: "eyJhbGciOiJFUzI1NiJ9.eyJpc3MiOiJ3YWxsZXQifQ.signature" },
  { protocol: "openid4vp-v1-multisigned", token: "eyJhbGciOiJFZERTQSJ9.eyJpc3MiOiJ3YWxsZXQifQ.multisig" },
  { protocol: "openid4vp-v1-unsigned", token: "eyJhbGciOiJub25lIn0.eyJpc3MiOiJ3YWxsZXQifQ." },
];

for (const { protocol, token } of roundtripTests) {
  promise_test(async (t) => {
    const responseData = { vp_token: { pid: [token] } };
    await setMockResponse(t, protocol, responseData);
    await test_driver.bless("user activation");

    const options = makeGetOptions({ protocol });
    const result = await navigator.credentials.get(options);

    assert_equals(result.protocol, protocol);
    assert_array_equals(result.data.vp_token.pid, [token]);
  }, `${protocol}: roundtrip passes through response data.`);
}

promise_test(async (t) => {
  await test_driver.set_virtual_wallet_behavior("decline");
  t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));
  await test_driver.bless("user activation");

  const options = makeGetOptions({ protocol: "openid4vp-v1-signed" });
  await promise_rejects_dom(t, "NotAllowedError", navigator.credentials.get(options));
}, "openid4vp-v1-signed: decline rejects with NotAllowedError.");

promise_test(async (t) => {
  await test_driver.set_virtual_wallet_behavior("wait");
  t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));
  await test_driver.bless("user activation");

  const controller = new AbortController();
  const reason = new Error("test abort reason");
  const options = makeGetOptions({ protocol: "openid4vp-v1-signed", signal: controller.signal });
  const promise = navigator.credentials.get(options);
  controller.abort(reason);
  await promise_rejects_exactly(t, reason, promise);
}, "openid4vp-v1-signed: wait + abort rejects with the abort reason.");

promise_test(async (t) => {
  const responseData = { vp_token: { pid: ["mdoc-takes-precedence"] } };
  await setMockResponse(t, "org-iso-mdoc", responseData);
  await test_driver.bless("user activation");

  const options = makeGetOptions({ protocol: ["org-iso-mdoc", "openid4vp-v1-signed"] });
  const result = await navigator.credentials.get(options);

  assert_equals(result.protocol, "org-iso-mdoc");
}, "Mixed mdoc + openid4vp request: mdoc takes precedence.");
</script>
