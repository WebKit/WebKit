description("Tests that eval inside an external script reports the external script's URL as the source origin.");

<script src="resources/eval-check-origin.js"></script>

if (window.internals) {
    shouldBeTrue("evalInExternalScriptOrigin.indexOf('eval-check-origin.js') !== -1");

    var inlineOrigin = internals.currentSourceOrigin();

} else
    debug("This test requires window.internals.");

</script>
