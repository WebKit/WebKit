<!DOCTYPE html>
<html>
<head>
    <script src="/js-test-resources/js-test.js"></script>
    <script src="resources/util.js"></script>
</head>
<body>
<script>
    description("Tests that deleteCookie is blocked by ITP when called from a third-party context.");
    jsTestIsAsync = true;

    const thirdPartyOrigin = "http://localhost:8000";
    const cookieName = "crossSiteCookie";

    function openIframe(url, onLoadHandler) {
        const element = document.createElement("iframe");
        element.src = url;
        if (onLoadHandler)
            element.onload = onLoadHandler;
        document.body.appendChild(element);
    }

    function runTest() {
        // Step 3: Enable third-party cookie blocking.
        testRunner.setStatisticsShouldBlockThirdPartyCookies(true, function() {
            // Step 4: iframe from localhost calls internals.deleteCookie(cookieName).
            // IPC: firstParty=127.0.0.1, url=localhost -> shouldBlockCookies blocks it.
            openIframe(thirdPartyOrigin + "/resourceLoadStatistics/resources/delete-raw-cookie.html", function() {
                // Step 5: disable ITP and verify cookie was not deleted.
                testRunner.setStatisticsShouldBlockThirdPartyCookies(false, function() {
                    testRunner.dumpChildFramesAsText();
                    openIframe(thirdPartyOrigin + "/resourceLoadStatistics/resources/get-cookies.py?name1=" + cookieName + "&message=Cross-site delete result:", function() {
                        setEnableFeature(false, function() {
                            testRunner.setAlwaysAcceptCookies(false);
                            finishJSTest();
                        });
                    });
                });
            });
        });
    }

    // Step 1: Allow cross-site cookie storage so the localhost cookie can be pre-seeded
    // from a 127.0.0.1 main page. Without this, NSHTTPCookieStorage rejects the cookie
    // because the mainDocumentURL (127.0.0.1) doesn't match the cookie domain (localhost).
    testRunner.setAlwaysAcceptCookies(true);

    // Step 2: Set cookie for localhost BEFORE enabling ITP. ITP is off, so
    // shouldBlockCookies returns false; setAlwaysAcceptCookies lets CFNetwork store it.
    openIframe(thirdPartyOrigin + "/resourceLoadStatistics/resources/set-raw-cookie.html", function() {
        testRunner.setAlwaysAcceptCookies(false);
        setEnableFeature(true, function() {
            runTest();
        });
    });
</script>
</body>
</html>
