<!DOCTYPE html> <!-- webkit-test-runner [ ApplePayReferenceSessionEnabled=true useEphemeralSession=true ] -->
<html>
<head>
<meta charset="utf-8">
<script src="/js-test-resources/js-test.js"></script>
</head>
<body>
<script>

description("Test that ApplePayReferenceSession.prepare() in Private Browsing still resolves, and tells the payment coordinator not to disclose Apple Pay capability.");

window.jsTestIsAsync = true;

let token;

window.onload = async () => {
    internals.mockPaymentCoordinator.setReferenceSessionToken("mock-token");
    token = await new ApplePayReferenceSession({ clientIdentifier: "com.example.client" }).prepare();
    shouldBeEqualToString("token", "mock-token");
    shouldBeFalse("internals.mockPaymentCoordinator.referenceSessionShouldDiscloseCapability");

    finishJSTest();
};

</script>
</body>
</html>
