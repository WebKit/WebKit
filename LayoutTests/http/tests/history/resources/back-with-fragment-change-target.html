<script>
onload = function() {
    setTimeout(function() {
        // Start to go back (runs asynchronously). back-with-fragment-change.py loads slowly, so the
        // traversal is still in flight when the fragment navigation below runs.
        history.back();
        // The fragment navigation adds a history entry, but must not cancel the traversal.
        setTimeout(function(){window.location = '#foo'}, 0);
    }, 0);
}

onhashchange = function() {
    // If the traversal completes, this document is unloaded before the timer fires. Wait well past
    // the 2 second load of back-with-fragment-change.py before concluding that it was canceled.
    setTimeout(fail, 4000);
}

function fail() {
    delete sessionStorage.didNavigate;
    document.getElementById('result').textContent = 'FAIL: The fragment navigation canceled the traversal.';
    if (window.testRunner)
        testRunner.notifyDone();
}
</script>
<p id="result"></p>
