<!DOCTYPE html>
<title>The disk cache keeps responses to requests with and without credentials apart</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const url = "/cache/disk-cache/resources/generate-response.cgi?Content-Type=text/plain&Cache-Control=max-age%3D100&uniqueId=" + Math.random();

async function responseSource(credentials)
{
    internals.clearMemoryCache();
    const response = await fetch(url, { credentials });
    await response.text();
    // Give the disk cache time to store the response.
    await new Promise(resolve => setTimeout(resolve, 100));
    return internals.fetchResponseSource(response);
}

promise_test(async () => {
    assert_equals(await responseSource("include"), "Network");
    assert_equals(await responseSource("include"), "Disk cache");
    assert_equals(await responseSource("omit"), "Network", "a request without credentials doesn't get a response to one with them");
    assert_equals(await responseSource("omit"), "Disk cache");
    assert_equals(await responseSource("include"), "Disk cache", "the response to a request with credentials is still there");
});
</script>
