<!DOCTYPE html>
<template id="page">
<title>The disk cache keeps responses to requests with and without credentials apart when the first party has no host</title>
<script src="http://127.0.0.1:8000/resources/testharness.js"></script>
<script src="http://127.0.0.1:8000/resources/testharnessreport.js"></script>
<script>
const url = "http://127.0.0.1:8000/cache/disk-cache/resources/credentials/echo-authorization.py";

function storeCredential()
{
    return new Promise(resolve => {
        const iframe = document.createElement("iframe");
        iframe.onload = resolve;
        iframe.src = url.replace("http://", "http://user:pass@") + "?challenge";
        document.documentElement.append(iframe);
    });
}

function loadScript(query)
{
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.onload = () => resolve(scriptResult);
        script.onerror = reject;
        script.src = url + query;
        document.documentElement.append(script);
    });
}

promise_test(async () => {
    assert_equals(location.href, "about:blank");
    await storeCredential();
    const id = Math.random();
    // Cookies are off for this document, but stored credentials are not.
    assert_equals(await loadScript("?redirect&script&id=" + id), "Basic dXNlcjpwYXNz");
    // Give the disk cache time to store the response.
    await new Promise(resolve => setTimeout(resolve, 100));
    internals.clearMemoryCache();
    const response = await fetch(url + "?script&id=" + id, { credentials: "omit" });
    assert_equals(await response.text(), 'scriptResult = "none";', "a request without credentials doesn't get a response to one with them");
    assert_equals(internals.fetchResponseSource(response), "Network");
});
</script>
</template>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.queueLoadHTMLString(document.getElementById("page").innerHTML);
}
</script>
