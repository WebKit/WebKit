<!DOCTYPE html>
<html>
<head>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

const resource = "/cache/resources/no-vary-search-delayed-prefetch.py?nvs=params%3D(%22b%22)";

async function clearAndNavigate()
{
    await fetch("/cache/resources/clear-prefetch-cache.py");
    // The evicted prefetch must not serve this URL, which only differs in an ignored parameter.
    window.location = resource + "&a=1&b=2";
}

// Give the prefetch time to finish before it is cleared.
window.addEventListener("load", () => setTimeout(clearAndNavigate, 1000));
</script>
<script type="speculationrules">
{
    "prefetch": [{
        "urls": ["/cache/resources/no-vary-search-delayed-prefetch.py?nvs=params%3D(%22b%22)&a=1&b=1"],
        "eagerness": "immediate",
        "expects_no_vary_search": "params=(\"b\")"
    }]
}
</script>
</head>
<body>
<p>A prefetch evicted by Clear-Site-Data does not serve a navigation to a No-Vary-Search equivalent URL.</p>
<p>The page is replaced by the response it was served. "Purpose: none" means the navigation went to the server.</p>
</body>
</html>
