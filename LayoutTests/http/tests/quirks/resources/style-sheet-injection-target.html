<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="style-sheet-injection.js"></script>
<style>#target { color: rgb(255, 0, 0) !important; }</style>
</head>
<body>
<p id="target" style="color: rgb(0, 0, 255) !important">Target</p>
<pre id="output"></pre>
<script>
window.addEventListener("pageshow", event => {
    window.lastPageShowPersisted = event.persisted;
});

if (window.parent !== window)
    window.parent.postMessage(StyleSheetQuirkHelpers.state(), "*");
else {
    document.getElementById("output").textContent = StyleSheetQuirkHelpers.state();
    if (window.testRunner)
        testRunner.notifyDone();
}
</script>
</body>
</html>
