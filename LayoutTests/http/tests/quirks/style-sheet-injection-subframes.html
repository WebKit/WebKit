<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="resources/style-sheet-injection.js"></script>
</head>
<body>
<pre id="output"></pre>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

let output = "";
function log(message) { output += message + "\n"; }

function loadSubframe(description, url)
{
    return new Promise(resolve => {
        const frame = document.createElement("iframe");
        window.addEventListener("message", event => {
            log(description + ":\n" + event.data + "\n");
            resolve();
        }, { once: true });
        frame.src = url;
        document.body.appendChild(frame);
    });
}

async function run()
{
    const sameOriginTarget = "resources/style-sheet-injection-target.html";
    const crossOriginTarget = "http://localhost:8000/quirks/resources/style-sheet-injection-target.html";

    StyleSheetQuirkHelpers.installQuirk("*://127.0.0.1/*");
    await loadSubframe("Same-origin subframe", sameOriginTarget);
    await loadSubframe("Cross-origin subframe", crossOriginTarget);

    StyleSheetQuirkHelpers.installQuirk("*://not-127.0.0.1.example/*");
    await loadSubframe("Subframe of a top document that does not match", sameOriginTarget);
}

if (!window.internals)
    log("FAIL: this test requires window.internals.");

(window.internals ? run() : Promise.resolve()).then(() => {
    document.getElementById("output").textContent = output;
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
</html>
