<!DOCTYPE html>
<html>
<head>
<title>Image with object-fit: contain should not leave stale pixels when src changes to a different aspect ratio</title>
<script src="/js-test-resources/ui-helper.js"></script>
<style>
    body {
        margin: 0;
    }
    img {
        object-fit: contain;
    }
</style>
</head>
<body>
<img id="image" width="200" height="120" src="../security/resources/red200x100.png">
<script>
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.dontForceRepaint();
}

window.addEventListener("load", async () => {
    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();

    const loaded = new Promise(resolve => image.addEventListener("load", resolve, { once: true }));
    image.src = "/resources/load-and-stall.py?name=../../../fast/images/resources/green-400x400.png&mimeType=image/png&stallAt=0&stallFor=1&rand=" + Math.random();
    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();
    await loaded;

    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();
    window.testRunner?.notifyDone();
});
</script>
</body>
</html>
