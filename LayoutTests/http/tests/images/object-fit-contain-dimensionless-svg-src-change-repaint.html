<!DOCTYPE html>
<html>
<head>
<title>Image with object-fit: contain should not leave stale pixels when src changes between dimensionless SVGs with different aspect ratios</title>
<script src="/js-test-resources/ui-helper.js"></script>
<style>
    body {
        margin: 0;
    }
    img {
        object-fit: contain;
    }
</style>
</head>
<body>
<img id="image" width="200" height="200" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><rect width='100%' height='100%' fill='red'/></svg>">
<script>
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.dontForceRepaint();
}

window.addEventListener("load", async () => {
    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();

    const loaded = new Promise(resolve => image.addEventListener("load", resolve, { once: true }));
    image.src = "/resources/load-and-stall.py?name=../images/resources/green-viewbox-2x1.svg&mimeType=image/svg%2Bxml&stallAt=0&stallFor=1&rand=" + Math.random();
    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();
    await loaded;

    await UIHelper.renderingUpdate();
    await UIHelper.renderingUpdate();
    window.testRunner?.notifyDone();
});
</script>
</body>
</html>
