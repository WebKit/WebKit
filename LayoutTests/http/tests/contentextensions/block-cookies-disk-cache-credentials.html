<!DOCTYPE html>
<title>The disk cache keeps responses to requests with and without credentials apart when a content blocker blocks cookies</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const directory = "/cache/disk-cache/resources/credentials/";
const url = directory + "echo-authorization.py?id=" + Math.random();

function storeCredential()
{
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", directory + "echo-authorization.py?challenge", true, "user", "pass");
        xhr.onload = () => resolve(xhr.responseText);
        xhr.onerror = reject;
        xhr.send();
    });
}

async function load(credentials)
{
    internals.clearMemoryCache();
    const response = await fetch(url, { credentials });
    const text = await response.text();
    // Give the disk cache time to store the response.
    await new Promise(resolve => setTimeout(resolve, 100));
    return [internals.fetchResponseSource(response), text];
}

promise_test(async () => {
    assert_equals(await storeCredential(), "Basic dXNlcjpwYXNz");
    assert_array_equals(await load("include"), ["Network", "Basic dXNlcjpwYXNz"]);
    assert_array_equals(await load("include"), ["Disk cache", "Basic dXNlcjpwYXNz"]);
    assert_array_equals(await load("omit"), ["Network", "none"], "a request without credentials doesn't get a response to one with them");
});
</script>
