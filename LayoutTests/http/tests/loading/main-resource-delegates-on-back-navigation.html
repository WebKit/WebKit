<!-- webkit-test-runner [ UsesBackForwardCache=true dumpResourceLoadCallbacks=true ] -->
<!DOCTYPE html>
<html>
<body>
Test that main resource load delegates are the same when page cache is enabled and disabled
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.dumpFrameLoadCallbacks();
    testRunner.waitUntilDone();
}

window.addEventListener('pageshow', function() {
    if (!sessionStorage.testLoadCount)
        sessionStorage.testLoadCount = 1;
    else
        sessionStorage.testLoadCount = parseInt(sessionStorage.testLoadCount, 10) + 1
    var pageCacheEnabled;
    switch(parseInt(sessionStorage.testLoadCount, 10)) {
    case 1:
        pageCacheEnabled = 0;
        break;
    case 2:
        pageCacheEnabled = 1;
        break;
    case 3:
        // Final load: return so the navigation below isn't scheduled, which
        // would otherwise log a stray client redirect under site isolation.
        // Wait two frames so the network process's resource-load callbacks
        // reach the UI process before notifyDone() dumps results.
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                delete sessionStorage.testLoadCount;
                testRunner.notifyDone();
            });
        });
        return;
    }

    setTimeout(function() {
        window.location.href = "resources/page-go-back-onload.html";
    }, 0);
}, false);
</script>
</body>
</html>
