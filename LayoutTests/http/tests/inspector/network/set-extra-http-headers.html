<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="../resources/inspector-test.js"></script>
<script>
function triggerFetch(headers = {}) {
    fetch("resources/echo.py?content=test&r=" + Math.random(), {headers});
}

function test()
{
    const headerA = "X-WebKit-Test-Header-A";
    const valueA = "ValueA";
    const headerB = "X-WebKit-Test-Header-B";
    const valueB = "ValueB";

    let suite = InspectorTest.createAsyncSuite("Network.setExtraHTTPHeaders");

    async function loadAndGetResource(headers = {}) {
        let [resourceWasAddedEvent] = await Promise.all([
            WI.Frame.awaitEvent(WI.Frame.Event.ResourceWasAdded),
            InspectorTest.evaluateInPage(`triggerFetch(${JSON.stringify(headers)})`),
        ]);
        return resourceWasAddedEvent.data.resource;
    }

    suite.addTestCase({
        name: "Network.setExtraHTTPHeaders.Replace",
        description: "A subsequent Network.setExtraHTTPHeaders call replaces the previously set headers instead of accumulating them.",
        async test() {
            // First call sets header A twice.
            await NetworkAgent.setExtraHTTPHeaders([{name: headerA, value: valueA}, {name: headerA.toLowerCase(), value: valueA}]);
            let firstResource = await loadAndGetResource({[headerA]: "Original"});
            InspectorTest.expectEqual(firstResource.requestHeaders.get(headerA), `${valueA}, ${valueA}`, `First request should replace its original value and retain both extra values for "${headerA}".`);
            InspectorTest.expectEqual(firstResource.requestHeaders.getAll(headerA).length, 2, "Repeated extra headers should remain separate fields.");

            // Second call sets header B only. Header A must no longer be sent.
            await NetworkAgent.setExtraHTTPHeaders([{name: headerB, value: valueB}]);
            let secondResource = await loadAndGetResource();
            InspectorTest.expectEqual(secondResource.requestHeaders.get(headerB), valueB, `Second request should include "${headerB}".`);
            InspectorTest.expectThat(!secondResource.requestHeaders.get(headerA), `Second request should not include "${headerA}" from the previous call.`);

            await NetworkAgent.setExtraHTTPHeaders([]);
            let clearedResource = await loadAndGetResource();
            InspectorTest.expectFalse(clearedResource.requestHeaders.has(headerA) || clearedResource.requestHeaders.has(headerB), "An empty header list should clear the previous extra headers.");
        }
    });

    suite.addTestCase({
        name: "Network.setExtraHTTPHeaders.InvalidObject",
        async test() {
            await InspectorTest.expectException(() => NetworkAgent.setExtraHTTPHeaders([null]));
        }
    });

    suite.addTestCase({
        name: "Network.setExtraHTTPHeaders.MissingName",
        async test() {
            await InspectorTest.expectException(() => NetworkAgent.setExtraHTTPHeaders([{value: "value"}]));
        }
    });

    suite.addTestCase({
        name: "Network.setExtraHTTPHeaders.InvalidName",
        async test() {
            await InspectorTest.expectException(() => NetworkAgent.setExtraHTTPHeaders([{name: 42, value: "value"}]));
        }
    });

    suite.addTestCase({
        name: "Network.setExtraHTTPHeaders.MissingValue",
        async test() {
            await InspectorTest.expectException(() => NetworkAgent.setExtraHTTPHeaders([{name: "X-Example"}]));
        }
    });

    suite.addTestCase({
        name: "Network.setExtraHTTPHeaders.InvalidValue",
        async test() {
            await InspectorTest.expectException(() => NetworkAgent.setExtraHTTPHeaders([{name: "X-Example", value: 42}]));
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Tests that Network.setExtraHTTPHeaders replaces previously set headers instead of accumulating them.</p>
</body>
</html>
