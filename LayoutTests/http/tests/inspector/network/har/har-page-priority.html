<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/resources/dummy.css" media="screen" />
<script src="../../resources/inspector-test.js"></script>
<script>
function test()
{
    if (window.GCController) {
        GCController.collect();
    }
    let suite = InspectorTest.createAsyncSuite("HAR.Page");

    suite.addTestCase({
        name: "HAR.Page.Priority",
        description: "Should be able to generate a HAR with all of this test page's resources.",
        async test() {
            function buildHAR(entries) {
                return {
                    log: {
                        version: "1.2",
                        creator: WI.HARBuilder.creator(),
                        pages: WI.HARBuilder.pages(),
                        entries: entries.map((entry, index) => WI.HARBuilder.entry(entry, "")),
                    }
                };
            }

            await NetworkAgent.setResourceCachingDisabled(false);

            await Promise.all([
                WI.networkManager.mainFrame.removeAllResources(),
                WI.networkManager.mainFrame.clearProvisionalLoad(false),
            ]);

            await new Promise(resolve => setTimeout(resolve, 100)); // Microtask yield

            await Promise.all([
                InspectorTest.awaitEvent("LoadComplete"),
                InspectorTest.reloadPage({ignoreCache: true}),
            ]);

            await new Promise(resolve => setTimeout(resolve, 100)); // Microtask yield

            let resources = [WI.networkManager.mainFrame.mainResource, ...WI.networkManager.mainFrame.resourceCollection];
            if (resources.length) {
                let har = buildHAR(resources);
                let localResources = WI.networkManager.processHAR({json: har});

                localResources?.forEach((entry) => {
                    if ((/html$/).test(entry.url)) {
                        InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.initialPriority), "Very High", `HTML ${entry.url} should start with a Very High priority`);
                        InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.priority), "Very High", "- HTML should still have Very High priority");
                    } else if ((/javascript$/).test(entry.mimeType)) {
                        InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.initialPriority), "High", `JavaScript ${entry.url} should start with a High priority`);
                        if ((/async$/).test(entry.url)) {
                            InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.priority), "Medium", `- Async JavaScript should be reduced to Medium priority`);
                        } else {
                            InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.priority), "High", `- JavaScript should still have a High priority`);
                        }
                    } else if ((/\.css/).test(entry.url)) {
                        InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.initialPriority), "High", `Stylesheet ${entry.url} should start with a High priority`);
                        if ((/print$/).test(entry.url)) {
                            InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.priority), "Very Low", `- Print stylesheet should be reduced to a Very Low priority`);
                        } else if ((/low$/).test(entry.url)) {
                            InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.priority), "Medium", `- Priority was only reduced to Medium`);
                        } else {
                            InspectorTest.expectEqual(WI.Resource.displayNameForPriority(entry.priority), "High", `- Screen stylesheet should stay at a High priority`);
                        }
                    }
                });
            }
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<h1>HAR Priorities Test.</h1>
<script>
window.addEventListener("load", () => {
    TestPage.dispatchEventToFrontend("LoadComplete");
});
</script>
</body>
</html>
