<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="../resources/inspector-test.js"></script>
<script>
async function startServiceWorker()
{
    var registration = await navigator.serviceWorker.register("resources/fetch-service-worker.js", { scope : "/inspector/network/resources/"});
    await new Promise(resolve => {
        if (registration.active)
            resolve();
        worker = registration.installing;
        if (worker.state === "activated")
            resolve();
        worker.addEventListener("statechange", () => {
            if (worker.state === "activated")
                resolve();
        });
    });

    var frame;
    await new Promise(function(resolve) {
        frame = document.createElement('iframe');
        frame.src = "/inspector/network/resources/";
        frame.onload = function() { resolve(frame); };
        document.body.appendChild(frame);
    });
    window.fetch = frame.contentWindow.fetch
    TestPage.dispatchEventToFrontend("SetupComplete");
}

async function triggerServiceWorkerLoad(url) {
    try { await fetch(url); } catch { }
    TestPage.dispatchEventToFrontend("LoadComplete");
}

function test()
{
    WI.reportInternalError = (e) => { };
    let suite = InspectorTest.createAsyncSuite("Resource.ResponseSource.ServiceWorker");

    function addTestCase({name, description, setup, expression, statusCode, responseSource, expectedMIMEType}) {
        suite.addTestCase({
            name, description, setup,
            test(resolve, reject) {
                let resource = null;
                let urlDidChangeCount = 0;
                let urlDidChangeListener = null;
                let mimeTypeDidChangeCount = 0;
                let mimeTypeDidChangeListener = null;

                function removeEventListeners() {
                    if (!resource || !urlDidChangeListener)
                        return;

                    resource.removeEventListener(WI.Resource.Event.URLDidChange, urlDidChangeListener);
                    resource.removeEventListener(WI.Resource.Event.MIMETypeDidChange, mimeTypeDidChangeListener);
                }

                let resourceWasAddedPromise = new Promise((resolve) => {
                    WI.Frame.singleFireEventListener(WI.Frame.Event.ResourceWasAdded, (event) => {
                        resource = event.data.resource;
                        let data = {url: resource.url, mimeType: resource.mimeType};

                        if (expectedMIMEType) {
                            urlDidChangeListener = resource.addEventListener(WI.Resource.Event.URLDidChange, () => { ++urlDidChangeCount; });
                            mimeTypeDidChangeListener = resource.addEventListener(WI.Resource.Event.MIMETypeDidChange, () => { ++mimeTypeDidChangeCount; });
                        }

                        resolve(data);
                    });
                });
                let responseReceivedPromise = WI.Resource.awaitEvent(WI.Resource.Event.ResponseReceived);
                let loadCompletePromise = InspectorTest.awaitEvent("LoadComplete");

                InspectorTest.evaluateInPage(expression);
                Promise.all([
                    resourceWasAddedPromise,
                    responseReceivedPromise,
                    loadCompletePromise,
                ]).then(([resourceWasAddedData, responseReceivedEvent, loadCompleteEvent]) => {
                    InspectorTest.expectThat(resource instanceof WI.Resource, "Resource should be created.");
                    InspectorTest.expectEqual(resource, responseReceivedEvent.target, "Resource should receive a Response.");
                    if (responseSource)
                        InspectorTest.expectEqual(resource.responseSource, responseSource, `responseSource should be ${String(responseSource)}`);
                    if (expectedMIMEType) {
                        InspectorTest.expectEqual(resource.url, resourceWasAddedData.url, "Resource URL should not change when the response does not provide a URL.");
                        InspectorTest.expectEqual(urlDidChangeCount, 0, "Resource should not dispatch URLDidChange when its URL does not change.");
                        InspectorTest.expectThat(resource.mimeType !== resourceWasAddedData.mimeType, "Resource MIME type should change after receiving the response.");
                        InspectorTest.expectEqual(resource.mimeType, expectedMIMEType, `Resource MIME type should be ${expectedMIMEType}.`);
                        InspectorTest.expectEqual(mimeTypeDidChangeCount, 1, "Resource should dispatch MIMETypeDidChange when its MIME type changes.");
                    }
                    InspectorTest.log("RESPONSE: " + resource.statusCode + " " + resource.statusText);
                }).finally(removeEventListeners).then(resolve, reject);
            }
        });
    }

    addTestCase({
        name: "Resource.ResponseSource.ServiceWorker.200",
        setup(resolve) { InspectorTest.evaluateInPage(`startServiceWorker()`); InspectorTest.awaitEvent("SetupComplete").then(resolve); },
        expression: `triggerServiceWorkerLoad("test-200")`,
        responseSource: WI.Resource.ResponseSource.ServiceWorker,
        expectedMIMEType: "text/plain",
    });

    addTestCase({
        name: "Resource.ResponseSource.ServiceWorker.500",
        expression: `triggerServiceWorkerLoad("test-500")`,
        responseSource: WI.Resource.ResponseSource.ServiceWorker,
    });

    suite.addTestCase({
        name: "Resource.ResponseSource.ServiceWorker.Error",
        description: "ServiceWorker may respond with an error.",
        test(resolve, reject) {
            InspectorTest.evaluateInPage(`triggerServiceWorkerLoad("test-error")`);
            Promise.all([
                WI.Frame.awaitEvent(WI.Frame.Event.ResourceWasAdded),
                InspectorTest.awaitEvent("LoadComplete"),
            ]).then(([resourceWasAddedEvent, loadCompleteEvent]) => {
                let resource = resourceWasAddedEvent.data.resource;
                InspectorTest.expectThat(resource instanceof WI.Resource, "Resource should be created.");
                InspectorTest.expectThat(resource.failed, "Resource should have failed.");
            }).then(resolve, reject);
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Test for `Resource.ResponseSource.ServiceWorker`.</p>
</body>
</html>
