<!DOCTYPE html>
<html>
<head>
<script src="../resources/inspector-test.js"></script>
<script>
function test()
{
    let suite = InspectorTest.createAsyncSuite("Resource.URLFragment.MemoryCache");

    suite.addTestCase({
        name: "Resource.URLFragment.MemoryCache",
        description: "Resources served from the memory cache should have the fragment they were requested with, not the one they were first loaded with.",
        async test() {
            await Promise.all([
                InspectorTest.awaitEvent(FrontendTestHarness.Event.TestPageDidLoad),
                InspectorTest.reloadPage(),
            ]);

            for (let [label, query] of [["CSS background-image", "css"], ["<img>", "img"]]) {
                let resource = WI.networkManager.resourcesForURL(`http://127.0.0.1:8000/inspector/network/resources/search.svg?resource-url-fragment-memory-cache-${query}#dark`).firstValue;
                InspectorTest.expectThat(resource, `Should find the ${label} resource by its URL with the '#dark' fragment.`);
                InspectorTest.expectEqual(resource?.responseSource, WI.Resource.ResponseSource.MemoryCache, "responseSource should be Symbol(memory-cache).");
            }
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Test that resources served from the memory cache keep the URL fragment they were requested with.</p>
<button id="css">Search</button>
<img id="img">
<script>
let fragment = performance.getEntriesByType("navigation")[0].type === "reload" ? "dark" : "light";
document.getElementById("css").style.backgroundImage = `url(resources/search.svg?resource-url-fragment-memory-cache-css#${fragment})`;
document.getElementById("img").src = `resources/search.svg?resource-url-fragment-memory-cache-img#${fragment}`;
</script>
</body>
</html>
