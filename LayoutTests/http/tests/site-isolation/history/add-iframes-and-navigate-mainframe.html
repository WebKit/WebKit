<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="/js-test-resources/js-test.js"></script>
<script>
description("Verifies that navigating the main frame while adding an iframe only increments history.length by one.");
jsTestIsAsync = true;

function addIframe() {
    const iframe = document.createElement('iframe');
    iframe.src = 'http://localhost:8000/site-isolation/resources/green-background.html';
    document.body.appendChild(iframe);
}

onload = async () => {
    if (sessionStorage.didNavigate) {
        delete sessionStorage.didNavigate;
        shouldBe("history.length", "2");
        finishJSTest();
        return;
    }

    // Load one cross-site iframe first so that its process is running before iframes are added in a loop.
    // Otherwise the loop adds iframes for as long as that process takes to launch and load its first frame,
    // which on slow configurations is hundreds of iframes and makes the test time out.
    await new Promise(resolve => {
        onmessage = resolve;
        addIframe();
    });
    await testRunner?.clearBackForwardList();

    onmessage = () => {
        onmessage = null;
        setTimeout(() => {
            sessionStorage.didNavigate = true;
            location.href = 'data:text/html,<script> history.back(); <\/script>';
        }, 10);
    };
    setInterval(addIframe, 1);
}
</script>
