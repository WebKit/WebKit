<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->

<!DOCTYPE html>
<html>
<body>
<script src="/js-test-resources/js-test.js"></script>
<script>
description("Tests that an animated GIF in an out-of-process subframe stops while the page is hidden");

var jsTestIsAsync = true;
var imageIsAnimating = "";
var testFrame;

// The subframe is cross-origin, so its internals object cannot be reached directly.
window.addEventListener("message", function(event) {
    imageIsAnimating = event.data;
}, false);

function runTest()
{
    testFrame = document.getElementById("testFrame");

    // Ask repeatedly: the visibility of the page reaches the process of the subframe asynchronously, and
    // a bitmap image only notices that it is offscreen when its next frame is decoded.
    setInterval(function() {
        testFrame.contentWindow.postMessage("report-image-animating", "*");
    }, 50);

    debug("The page is visible and the frame is inside the viewport, so the image should animate.");
    shouldBecomeEqualToString("imageIsAnimating", "true", hidePage);
}

function hidePage()
{
    // The subframe has no view of its own in the process that owns the window, so the visibility of the
    // page has to reach the view of the local root directly.
    debug("Hiding the page.");
    testRunner.setPageVisibility("hidden");
    shouldBecomeEqualToString("imageIsAnimating", "false", showPage);
}

function showPage()
{
    debug("Showing the page again.");
    testRunner.resetPageVisibility();
    shouldBecomeEqualToString("imageIsAnimating", "true", finishJSTest);
}
</script>
<iframe id="testFrame" src="http://localhost:8000/site-isolation/resources/animated-image-frame.html?image=animated-red-green-blue-repeat-infinite.gif" onload="runTest()"></iframe>
</body>
</html>
