<!DOCTYPE html> <!-- webkit-test-runner [ SiteIsolationEnabled=true pageTopColorSamplingEnabled=true ContentInsetBackgroundFillEnabled=true TopContentInsetBackgroundCanChangeAfterScrolling=false ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The top edge stops changing once the page is scrolled. The frames at the top and the bottom turn orange together,
     so once the bottom is orange the top frame has had its chance to be sampled. -->
<link rel="stylesheet" href="resources/edge-sampling.css">
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<script src="resources/edge-sampling.js"></script>
</head>
<body>
<div class="edge top"><iframe id="top" data-src="http://localhost:8000/site-isolation/resources/paint-on-message-frame.html"></iframe></div>
<div class="edge bottom"><iframe id="bottom" data-src="http://localhost:8000/site-isolation/resources/paint-on-message-frame.html"></iframe></div>
<div class="tall"></div>
<script>
async function runTest()
{
    await waitForEdgeSamplingFramesToLoad();
    await UIHelper.ensurePresentationUpdate();
    await setTopAndBottomEdgeInsets();
    await UIHelper.scrollDown();
    await UIHelper.waitForZoomingOrScrollingToEnd();
    await UIHelper.ensurePresentationUpdate();

    await messageEdgeSamplingFrame(document.getElementById("top"), "paint");
    await messageEdgeSamplingFrame(document.getElementById("bottom"), "paint");

    edgeSamplingColors = await settledEdges({ bottom: "rgb(255, 120, 0)" });
    assertEdges({ bottom: "rgb(255, 120, 0)", top: null });
    finishJSTest();
}

runTest();
</script>
</body>
</html>
