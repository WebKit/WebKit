<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<style>
body { color: blue; }
@media print {
    body { color: green; }
}
</style>
<script src="../../../inspector/resources/inspector-test.js"></script>
<script>
let iframe;

function addCrossOriginIFrame() {
    let crossOriginHost = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
    iframe = document.createElement("iframe");
    iframe.src = `http://${crossOriginHost}:8000/site-isolation/inspector/page/resources/emulated-media-frame.html`;
    document.body.appendChild(iframe);
}

function armMediaChange() {
    matchMedia("print").addEventListener("change", () => { TestPage.dispatchEventToFrontend("MediaChanged"); }, { once: true });
}

function test() {
    async function addIFrameAndGetTarget() {
        // Under Site Isolation, TargetAdded fires for the iframe's provisional about:blank target
        // before the cross-origin document commits; evaluating then hits the empty realm. Await the
        // committed target + its execution context, mirroring set-emulated-media-cross-origin-iframe.html.
        let committedPromise = WI.targetManager.awaitEvent(WI.TargetManager.Event.DidCommitProvisionalTarget);
        InspectorTest.evaluateInPage("addCrossOriginIFrame()");
        let event = await committedPromise;
        let target = event.data.target;
        if (!target.executionContext)
            await target.awaitEvent(WI.FrameTarget.Event.ExecutionContextAdded);
        return target;
    }

    async function getComputedColorInTarget(target) {
        // Wait for the iframe document to fully load before checking computed styles.
        // TargetAdded fires when the JS context is created, before DOM and CSS are ready.
        await target.RuntimeAgent.evaluate.invoke({
            expression: "new Promise(resolve => { if (document.readyState === 'complete') resolve(); else window.addEventListener('load', resolve); })",
            objectGroup: "test",
            awaitPromise: true,
        });

        let response = await target.RuntimeAgent.evaluate.invoke({expression: "window.getComputedStyle(document.body).getPropertyValue('color')", objectGroup: "test", returnByValue: true});
        InspectorTest.assert(response.result.value, "Should be able to evaluate computed style in cross-origin target.");
        return response.result.value;
    }

    // The emulated-media override reaches the cross-origin iframe process via the UIProcess
    // ProxyingPageAgent broadcast, which is not ordered against the cross-origin target's own
    // RuntimeAgent channel. Arm a one-shot media change listener in the frame before issuing the
    // command, then await it before reading the computed style.
    async function armMediaChangeInTarget(target) {
        await target.RuntimeAgent.evaluate.invoke({
            expression: `window.__mediaChanged = new Promise(r => matchMedia("print").addEventListener("change", r, { once: true }))`,
            objectGroup: "test",
        });
    }

    async function awaitMediaChangeInTarget(target) {
        await target.RuntimeAgent.evaluate.invoke({
            expression: "window.__mediaChanged",
            objectGroup: "test",
            awaitPromise: true,
        });
    }

    // Arm one-shot media change listeners in the main page and the cross-origin iframe, run the
    // command, then wait until both frames have re-evaluated their media queries.
    async function runAndAwaitMediaChange(target, command) {
        let mainMediaChanged = InspectorTest.awaitEvent("MediaChanged");
        await InspectorTest.evaluateInPage("armMediaChange()");
        await armMediaChangeInTarget(target);
        await command();
        await mainMediaChanged;
        await awaitMediaChangeInTarget(target);
    }

    function getMainPageColor() {
        return InspectorTest.evaluateInPage(`getComputedStyle(document.body).color`);
    }

    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Page.SetEmulatedMediaDisableRestore");

    suite.addTestCase({
        name: "SiteIsolation.Page.SetEmulatedMedia.DisableRestoresRealMedia",
        description: "Disabling Page instrumentation should revert the main page and a cross-origin iframe from an emulated-media override back to its real platform media, without a reload. The override is rejected while disabled and not restored on re-enable.",
        async test() {
            // (a) The OOPIF starts on its real (screen) media -- blue.
            let target = await addIFrameAndGetTarget();
            InspectorTest.expectEqual(target.type, WI.TargetType.Frame, "Added target should have Frame type.");

            InspectorTest.expectEqual(await getMainPageColor(), "rgb(0, 0, 255)", "Main page should start with screen styles (blue).");
            let iframeColorBefore = await getComputedColorInTarget(target);
            InspectorTest.expectEqual(iframeColorBefore, "rgb(0, 0, 255)", "Cross-origin iframe should start with screen styles (blue).");

            // (b) Emulate print -- the OOPIF switches to print media (green).
            InspectorTest.log("Emulating print media...");
            await runAndAwaitMediaChange(target, () => WI.backendTarget.PageAgent.setEmulatedMedia("print"));
            InspectorTest.expectEqual(await getMainPageColor(), "rgb(0, 128, 0)", "Main page should switch to print styles (green).");
            let iframeColorPrint = await getComputedColorInTarget(target);
            InspectorTest.expectEqual(iframeColorPrint, "rgb(0, 128, 0)", "Cross-origin iframe should switch to print styles (green).");

            // (c) Disable the Page domain on the backend target. This unwinds through the UIProcess
            // ProxyingPageAgent::disable(), which sends DisablePageInstrumentation to every hosting
            // process -- i.e. the WebInspectorBackend::disablePageInstrumentation() teardown path,
            // NOT the setEmulatedMedia("") set path (which already re-evaluates). See webkit.org/b/308898.
            InspectorTest.log("Disabling Page instrumentation on the backend target...");
            await runAndAwaitMediaChange(target, () => WI.backendTarget.PageAgent.disable());

            // (d) The OOPIF reverts to its real platform media (blue). The override is gone; restore is
            // a re-evaluation against real media, not a replay of a prior override.
            InspectorTest.expectEqual(await getMainPageColor(), "rgb(0, 0, 255)", "Main page should revert to real screen media (blue) after Page instrumentation is disabled.");
            let iframeColorRestored = await getComputedColorInTarget(target);
            InspectorTest.expectEqual(iframeColorRestored, "rgb(0, 0, 255)", "Cross-origin iframe should revert to real screen media (blue) after Page instrumentation is disabled.");

            // (e) With the Page domain still disabled, the override is rejected instead of being silently dropped.
            InspectorTest.log("Emulating print media while the Page domain is disabled...");
            let error = await InspectorTest.expectException(() => WI.backendTarget.PageAgent.setEmulatedMedia("print"));
            InspectorTest.expectThat(String(error && error.message || error).includes("Page domain must be enabled"), "setEmulatedMedia should fail while disabled because the Page domain must be enabled.");

            // (f) Re-enabling the Page domain does not restore the cleared override.
            InspectorTest.log("Re-enabling the Page domain on the backend target...");
            await WI.backendTarget.PageAgent.enable();
            InspectorTest.expectEqual(await getMainPageColor(), "rgb(0, 0, 255)", "Main page should stay on real screen media after re-enabling the Page domain (blue).");
            let iframeColorReenabled = await getComputedColorInTarget(target);
            InspectorTest.expectEqual(iframeColorReenabled, "rgb(0, 0, 255)", "Cross-origin iframe should stay on real screen media after re-enabling the Page domain (blue).");

            // (g) A new override applies again once the Page domain is enabled.
            InspectorTest.log("Emulating print media again...");
            await runAndAwaitMediaChange(target, () => WI.backendTarget.PageAgent.setEmulatedMedia("print"));
            InspectorTest.expectEqual(await getMainPageColor(), "rgb(0, 128, 0)", "Main page should switch to print styles (green) again.");
            let iframeColorPrintAgain = await getComputedColorInTarget(target);
            InspectorTest.expectEqual(iframeColorPrintAgain, "rgb(0, 128, 0)", "Cross-origin iframe should switch to print styles (green) again.");

            await WI.backendTarget.PageAgent.setEmulatedMedia("");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>

<body onload="runTest()">
<p>Test that disabling Page instrumentation reverts a cross-origin iframe from an emulated-media override back to its real platform media under site isolation.</p>
</body>
