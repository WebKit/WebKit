<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../network/resources/frame-load-rows-test-utilities.js"></script>
<script>
function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Page.ResourcesFinishLoadingAfterReload");

    async function expectFinishedWithContent(resource, label, expectedText) {
        InspectorTest.expectEqual(await awaitResourceSettled(resource), "finished", `${label} should finish loading.`);

        let {content, error} = await Promise.race([
            resource.requestContent(),
            new Promise((resolve) => setTimeout(() => resolve({error: "timed out waiting for the content"}), awaitTimeout)),
        ]);
        if (error)
            InspectorTest.log(`${label}: requestContent() failed with: ${error}`);
        InspectorTest.expectThat(typeof content === "string" && content.includes(expectedText), `${label} content should contain "${expectedText}".`);
    }

    suite.addTestCase({
        name: "SiteIsolation.Page.ResourcesFinishLoadingAfterReload.EveryFrameKind",
        description: "Reloading with the inspector open should leave every frame's main resource finished, with its content available.",
        async test() {
            // The cross-origin frame is described by the aggregated resource tree, which can arrive after test() starts.
            let crossOriginFrameBeforeReload = await awaitChildFrame((frame) => frame.name === "cross-origin-frame" && frame.mainResource.url.includes("resource-tree-frame-with-subresource.html"), awaitLaunchTimeout);
            InspectorTest.expectThat(!!crossOriginFrameBeforeReload, "Cross-origin frame should be attached before the reload.");
            if (crossOriginFrameBeforeReload) {
                InspectorTest.expectEqual(await awaitResourceSettled(crossOriginFrameBeforeReload.mainResource), "finished", "Cross-origin frame's main resource should finish loading before the reload.");
                InspectorTest.expectThat(!!await awaitSubresource(crossOriginFrameBeforeReload, "resource-tree-subframe-style.css"), "Cross-origin frame's stylesheet should be listed before the reload.");
            }

            let framesBeforeReload = new Set(WI.networkManager.frames);
            let mainLoaderBeforeReload = WI.networkManager.mainFrame.loaderIdentifier;

            InspectorTest.log("Reloading...");
            await InspectorTest.reloadPage();
            await InspectorTest.awaitEvent(FrontendTestHarness.Event.TestPageDidLoad);

            // TestPageDidLoad and the Page events arrive on different connections, so the old frames can still be in the model here.
            let mainFrameCommitted = await pollUntil(() => WI.networkManager.mainFrame?.loaderIdentifier !== mainLoaderBeforeReload);
            InspectorTest.expectThat(!!mainFrameCommitted, "Main frame should commit the reload.");
            if (!mainFrameCommitted)
                return;

            await expectFinishedWithContent(WI.networkManager.mainFrame.mainResource, "Main frame's main resource", "main-frame-marker");

            async function expectChildFrame(label, name, mainResourceURLPart, expectedText, timeout) {
                let frame = await awaitChildFrame((frame) => !framesBeforeReload.has(frame) && frame.name === name && frame.mainResource.url.includes(mainResourceURLPart), timeout);
                InspectorTest.expectThat(!!frame, `${label} frame should be attached to the main frame.`);
                if (!frame)
                    return null;

                await expectFinishedWithContent(frame.mainResource, `${label} frame's main resource`, expectedText);
                return frame;
            }

            async function expectSubresource(frame, label, urlPart) {
                if (!frame)
                    return;
                InspectorTest.expectThat(!!await awaitSubresource(frame, urlPart), `${label} frame's stylesheet should be one of its subresources.`);
            }

            await expectChildFrame("Same-origin srcdoc", "static-frame", "about:srcdoc", "srcdoc-frame-marker");

            let sameOriginFrame = await expectChildFrame("Same-origin src", "same-origin-frame", "same-origin-src-frame.html", "same-origin-src-frame-marker");
            await expectSubresource(sameOriginFrame, "Same-origin src", "resource-tree-subframe-style.css");

            let crossOriginFrame = await expectChildFrame("Cross-origin", "cross-origin-frame", "resource-tree-frame-with-subresource.html", "cross-origin-frame-marker", awaitLaunchTimeout);
            await expectSubresource(crossOriginFrame, "Cross-origin", "resource-tree-subframe-style.css");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
<body onload="runTest()">
<p>main-frame-marker</p>
<p>Tests that the main frame and every kind of iframe finish loading after a reload with the inspector open under Site Isolation.</p>
<iframe name="static-frame" srcdoc="<p>srcdoc-frame-marker</p>"></iframe>
<iframe name="same-origin-frame" src="resources/same-origin-src-frame.html"></iframe>
<iframe id="cross-origin-frame" name="cross-origin-frame"></iframe>
<script>
{
    // Set during parsing so the frame goes through the reload together with the other iframes.
    let crossOriginHost = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
    document.getElementById("cross-origin-frame").src = `http://${crossOriginHost}:8000/site-isolation/inspector/page/resources/resource-tree-frame-with-subresource.html`;
}
</script>
</body>
