<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<script>
// Runs inside the cross-origin iframe, which is a separate WebContent process under Site Isolation.
// The cookie is for the iframe's host, which the parent frame never requests any resource from, so the
// parent's process has no cached-resource URL that would match it. The in-process Page.getCookies
// looks cookies up by the parent process's known resource URLs, so it cannot discover this cookie;
// Storage.getCookies also asks the iframe's process, whose document URL matches it.
document.cookie = "CrossOriginScriptCookie=PASS; path=/";
</script>
</body>
</html>
