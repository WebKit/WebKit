<!DOCTYPE html>
<meta charset="utf-8">
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script src="resources/frame-timeline-test-utilities.js"></script>
<script src="resources/timeline-events.js"></script>
<script>
// Each load of the page creates a Worker, so that the auto-capture has a Worker target when it starts and gets a new
// one during the load.
window.worker = new Worker(URL.createObjectURL(new Blob(["onmessage = () => { };"])));

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Timeline.AutoCaptureWithHeapAllocations");

    // The targets that the frontend asks to start Heap, the main frame's main resource at that time, and the URL of the
    // target's frame at that time.
    let heapStartedTargets = [];
    let mainResourceWhenHeapStartedForTarget = new Map;
    let frameURLWhenHeapStartedForTarget = new Map;
    let originalWillStartTrackingForTarget = WI.timelineManager.willStartTrackingForTarget;
    WI.timelineManager.willStartTrackingForTarget = function(target, domain) {
        if (domain === "Heap") {
            heapStartedTargets.push(target);
            mainResourceWhenHeapStartedForTarget.set(target, WI.networkManager.mainFrame.mainResource);
            frameURLWhenHeapStartedForTarget.set(target, WI.networkManager.frameForIdentifier(target.executionContext?.frameId)?.mainResource.url);
        }
        return originalWillStartTrackingForTarget.call(this, target, domain);
    };

    // Sets the instruments of the next capture. Starting a capture reuses the active recording while it is empty, so
    // that recording gets the same instruments.
    function setTimelineTypes(timelineTypes) {
        WI.timelineManager.enabledTimelineTypes = timelineTypes;

        let recording = WI.timelineManager.activeRecording;
        for (let instrument of recording.instruments.slice()) {
            if (!timelineTypes.includes(instrument.timelineRecordType))
                recording.removeInstrument(instrument);
        }
        for (let timelineType of timelineTypes) {
            if (!recording.instruments.some((instrument) => instrument.timelineRecordType === timelineType))
                recording.addInstrument(WI.Instrument.createForTimelineType(timelineType));
        }
    }

    function awaitWorkerTarget(excludedTarget) {
        let workerTarget = WI.targetManager.workerTargets.find((target) => target !== excludedTarget);
        if (workerTarget)
            return Promise.resolve(workerTarget);

        return new Promise((resolve) => {
            let listener = WI.targetManager.addEventListener(WI.TargetManager.Event.TargetAdded, (event) => {
                if (event.data.target.type !== WI.TargetType.Worker || event.data.target === excludedTarget)
                    return;

                WI.targetManager.removeEventListener(WI.TargetManager.Event.TargetAdded, listener);
                resolve(event.data.target);
            });
        });
    }

    suite.addTestCase({
        name: "SiteIsolation.Timeline.AutoCaptureWithHeapAllocations.Reload",
        description: "An auto-capture started by a reload, with JavaScript Allocations enabled, should start Heap on each frame target once its frame has committed a document other than the initial about:blank document, and not on the Worker targets or the page target.",
        async test() {
            // Layout starts Timeline.
            setTimelineTypes([WI.TimelineRecord.Type.Layout, WI.TimelineRecord.Type.HeapAllocations]);
            WI.timelineManager.autoCaptureOnPageLoad = true;

            // Otherwise the auto-capture can stop on its own while the test waits for records.
            WI.settings.timelinesAutoStop.value = false;

            let iframeTargetBeforeReload = await waitForFrameTargetForURLContaining("timeline-frame.html");
            InspectorTest.expectNotNull(iframeTargetBeforeReload, "Should find the cross-origin iframe target.");
            let scriptInsertedIframeTargetBeforeReload = await waitForFrameTargetForURLContaining("delayed-frame.py");
            InspectorTest.expectNotNull(scriptInsertedIframeTargetBeforeReload, "Should find the script-inserted iframe target.");
            let workerTargetBeforeReload = await awaitWorkerTarget();
            InspectorTest.pass("Should find the Worker target.");
            InspectorTest.expectFalse(WI.timelineManager.isCapturing(), "TimelineManager should not be capturing.");

            FrameTimelineTest.clearTrackingEvents();
            let mainResourceBeforeReload = WI.networkManager.mainFrame.mainResource;

            let activePromise = FrameTimelineTest.awaitCapturingState(WI.TimelineManager.CapturingState.Active);
            await Promise.all([
                InspectorTest.awaitEvent(FrontendTestHarness.Event.TestPageDidLoad),
                activePromise,
                InspectorTest.reloadPage(),
            ]);
            InspectorTest.pass("The reload started an auto-capture.");

            // FIXME: <https://webkit.org/b/332030> Use an InspectorTest helper that waits for the main frame target,
            // instead of matching this test's URL. InspectorTest.mainFrameTarget falls back to the page target while the
            // frontend does not yet know the main frame target's frame.
            let mainFrameTarget = await waitForFrameTargetForURLContaining("/auto-capture-reload-with-heap-allocations.html");
            InspectorTest.assert(mainFrameTarget, "Should find the main frame's target.");
            let iframeTarget = await waitForFrameTargetForURLContaining("timeline-frame.html");
            InspectorTest.expectThat(iframeTarget && iframeTarget !== iframeTargetBeforeReload, "The reload should create a new cross-origin iframe target.");
            let scriptInsertedIframeTarget = await waitForFrameTargetForURLContaining("delayed-frame.py");
            InspectorTest.expectThat(scriptInsertedIframeTarget && scriptInsertedIframeTarget !== scriptInsertedIframeTargetBeforeReload, "The reload should create a new script-inserted iframe target.");
            let workerTarget = await awaitWorkerTarget(workerTargetBeforeReload);
            InspectorTest.pass("The reload should create a new Worker target.");

            // The frontend starts the other targets, which shows that it handled them.
            for (let [target, description] of [[mainFrameTarget, "main frame target"], [iframeTarget, "cross-origin iframe target"]]) {
                await FrameTimelineTest.awaitTrackingEvent("capturingStarted", target);
                InspectorTest.pass(`The ${description} started Timeline.`);
            }

            // Each frame target starts Heap once its frame has committed the new document.
            for (let [target, description] of [[mainFrameTarget, "main frame target"], [iframeTarget, "cross-origin iframe target"], [scriptInsertedIframeTarget, "script-inserted iframe target"]]) {
                await FrameTimelineTest.awaitTrackingEvent("capturingStarted", target, "Heap");
                InspectorTest.pass(`The ${description} started Heap.`);
            }

            await FrameTimelineTest.stopCapturing();
            InspectorTest.pass("Capturing stopped.");

            InspectorTest.expectEqual(heapStartedTargets.filter((target) => target === mainFrameTarget).length, 1, "The frontend should start Heap on the main frame target once.");
            InspectorTest.expectNotEqual(mainResourceWhenHeapStartedForTarget.get(mainFrameTarget), mainResourceBeforeReload, "The frontend should start Heap on the main frame target after the main frame committed the new document.");
            InspectorTest.expectEqual(heapStartedTargets.filter((target) => target === iframeTarget).length, 1, "The frontend should start Heap on the cross-origin iframe target once.");
            InspectorTest.expectFalse(heapStartedTargets.includes(iframeTargetBeforeReload), "The frontend should not start Heap on the cross-origin iframe target that existed before the reload.");

            // The script-inserted iframe first commits its initial about:blank document, which should not get the snapshot.
            InspectorTest.expectEqual(heapStartedTargets.filter((target) => target === scriptInsertedIframeTarget).length, 1, "The frontend should start Heap on the script-inserted iframe target once.");
            InspectorTest.expectThat(frameURLWhenHeapStartedForTarget.get(scriptInsertedIframeTarget)?.includes("delayed-frame.py"), "The frontend should start Heap on the script-inserted iframe target after its frame committed its real document, not its initial about:blank document.");
            for (let [target, description] of [[workerTargetBeforeReload, "Worker target that existed before the reload"], [workerTarget, "Worker target created by the reload"], [WI.pageTarget, "page target"]])
                InspectorTest.expectFalse(FrameTimelineTest.didReportTrackingEvent("capturingStarted", target, "Heap"), `The ${description} should not report that Heap started.`);

            WI.timelineManager.autoCaptureOnPageLoad = false;
            WI.settings.timelinesAutoStop.reset();
        }
    });

    suite.runTestCasesAndFinish();
}
</script>

<body onload="runTest()">
<p>Test that under Site Isolation, an auto-capture with JavaScript Allocations enabled starts Heap on each frame target only after its frame has committed a document other than the initial about:blank document, and not on the Worker targets.</p>
<iframe src="http://localhost:8000/site-isolation/inspector/timeline/resources/timeline-frame.html"></iframe>
<script>
// Inserting the iframe before giving it a URL makes it commit its initial about:blank document first. Its real document
// loads after a delay.
let scriptInsertedIframe = document.createElement("iframe");
document.body.appendChild(scriptInsertedIframe);
scriptInsertedIframe.src = "resources/delayed-frame.py";
</script>
</body>
