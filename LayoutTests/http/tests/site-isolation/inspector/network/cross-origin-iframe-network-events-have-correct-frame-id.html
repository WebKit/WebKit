<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../../../inspector/resources/stable-id-map.js"></script>
<script src="../debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script>
function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Network.CrossOriginIFrameFrameId");

    suite.addTestCase({
        name: "SiteIsolation.Network.CrossOriginIFrame.FrameIdMatchesIFrame",
        description: "Network events for a cross-origin iframe fetch should carry the iframe's frame ID.",
        async test() {
            let frameIdMap = new StableIdMap;

            let frameTarget = await frameTargetForURLContaining("iframe-with-fetch.html");
            InspectorTest.assert(frameTarget instanceof WI.FrameTarget, "Cross-origin iframe frame target should exist.");

            // Make sure the iframe's script has run before triggering the fetch.
            await waitForExpressionInTarget(frameTarget, "typeof triggerFetch === 'function'");

            let mainFrameId = WI.networkManager.mainFrame.id;

            // Trigger fetch and wait for the resource.
            let resourceAddedPromise = WI.Frame.awaitEvent(WI.Frame.Event.ResourceWasAdded);
            await frameTarget.RuntimeAgent.evaluate.invoke({expression: "triggerFetch()", objectGroup: "test"});
            let resourceEvent = await resourceAddedPromise;
            let resource = resourceEvent.data.resource;

            InspectorTest.expectThat(resource instanceof WI.Resource, "Resource should be created.");

            let resourceFrame = resource.parentFrame;
            InspectorTest.expectThat(resourceFrame instanceof WI.Frame, "Resource should have a parent WI.Frame.");
            InspectorTest.expectEqual(resourceFrame.parentFrame, WI.networkManager.mainFrame, "Resource's frame should be a direct child of the main frame.");
            InspectorTest.expectNotEqual(resourceFrame.id, mainFrameId, "Resource frame ID should not equal main frame ID.");
            InspectorTest.expectThat(!!resourceFrame.id, "Resource frame ID should not be null.");
            InspectorTest.log(`Main frame ID: ${frameIdMap.get(mainFrameId)}`);
            InspectorTest.log(`Resource frame ID: ${frameIdMap.get(resourceFrame.id)}`);
        }
    });

    suite.runTestCasesAndFinish();
}
</script>

<body onload="runTest()">
<p>Test that network events for a cross-origin iframe fetch carry the iframe's frame ID, not the main frame's.</p>
<iframe src="http://localhost:8000/site-isolation/inspector/network/resources/iframe-with-fetch.html"></iframe>
</body>
