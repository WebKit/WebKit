<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="../../../inspector/resources/inspector-test.js"></script>
<script>
let iframe;

function addCrossOriginIFrame() {
    let crossOriginHost = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
    iframe = document.createElement("iframe");
    iframe.src = `http://${crossOriginHost}:8000/site-isolation/inspector/network/resources/iframe-with-fetch.html`;
    document.body.appendChild(iframe);
}

function test() {
    // No load is paused for this requestId, so the verbs that resume a paused load must fail with
    // the same "missing pending intercept" errors as the single-process agent instead of silently
    // succeeding. Loads that are paused are covered by intercept-request-cross-origin-iframe.html
    // and intercept-response-cross-origin-iframe.html.
    const missingRequestError = "Missing pending intercept request for given requestId";
    const missingResponseError = "Missing pending intercept response for given requestId";

    // Invoke the commands directly against the backend connection, which hosts the Network domain
    // under Site Isolation.
    function invokeInterceptionCommand(name, parameters) {
        return InspectorBackend.invokeCommand(`Network.${name}`, WI.TargetType.Page, WI.backendTarget.connection, parameters);
    }

    async function expectRejection(name, parameters, expectedError) {
        let resolvedValue;
        try {
            resolvedValue = await invokeInterceptionCommand(name, parameters);
        } catch (e) {
            let message = e.message || String(e);
            InspectorTest.expectEqual(message, expectedError, `Network.${name} should fail with "${expectedError}".`);
            return;
        }
        InspectorTest.expectThat(false, `Network.${name} should have failed, but it resolved with ${JSON.stringify(resolvedValue)}.`);
    }

    async function addIFrameAndGetTarget() {
        let targetAddedPromise = WI.targetManager.awaitEvent(WI.TargetManager.Event.TargetAdded);
        InspectorTest.evaluateInPage("addCrossOriginIFrame()");
        let event = await targetAddedPromise;
        return event.data.target;
    }

    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Network.InterceptionUnknownRequestId");

    suite.addTestCase({
        name: "SiteIsolation.Network.InterceptionUnknownRequestId.CrossOriginIFrameTargetExists",
        description: "A genuine separate-process cross-origin iframe target must exist before driving the interception commands.",
        async test() {
            let target = await addIFrameAndGetTarget();
            InspectorTest.expectEqual(target.type, WI.TargetType.Frame, "Added target should have Frame type.");
            InspectorTest.expectThat(target instanceof WI.FrameTarget, "Added target should be a FrameTarget, proving a separate-process OOPIF.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Network.InterceptionUnknownRequestId.PausedRequestCommands",
        description: "The commands that act on a paused intercepted request should fail for a requestId that is not paused.",
        async test() {
            const requestId = "request-1.1";
            await expectRejection("interceptContinue", {requestId, stage: "request"}, missingRequestError);
            await expectRejection("interceptWithRequest", {requestId, method: "GET"}, missingRequestError);
            await expectRejection("interceptWithResponse", {requestId, content: "intercepted", base64Encoded: false}, missingResponseError);
            await expectRejection("interceptRequestWithResponse", {requestId, content: "intercepted", base64Encoded: false, mimeType: "text/plain", status: 200, statusText: "OK", headers: {}}, missingRequestError);
            await expectRejection("interceptRequestWithError", {requestId, errorType: "General"}, missingRequestError);
        }
    });

    suite.runTestCasesAndFinish();
}
</script>

<body onload="runTest()">
<p>Test that the Network interception commands that resolve a paused load fail for a requestId that is not paused under Site Isolation.</p>
</body>
