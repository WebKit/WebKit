<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="resources/frame-load-rows-test-utilities.js"></script>
<script>
function test() {
    const crossOriginDocumentURLPart = "iframe-with-script.html?reload-";
    const crossOriginScriptURLPart = "iframe-script.js?reload-";

    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Network.ReloadWithIFramesRows");

    suite.addTestCase({
        name: "SiteIsolation.Network.ReloadWithIFramesRows.Reload",
        description: "After a reload, the main document and each iframe's document and script should be listed once, with no rows left from before the reload.",
        async test() {
            // The cross-origin frame is described by the aggregated resource tree, which can arrive after test() starts.
            let srcdocFrame = await awaitChildFrame((frame) => frame.name === "static-frame");
            InspectorTest.expectThat(!!srcdocFrame, "srcdoc frame should be attached before the reload.");
            let crossOriginFrame = await awaitChildFrame((frame) => frame.mainResource.url.includes(crossOriginDocumentURLPart));
            InspectorTest.expectThat(!!crossOriginFrame, "Cross-origin frame should be attached before the reload.");
            if (crossOriginFrame)
                InspectorTest.expectThat(!!await awaitSubresource(crossOriginFrame, crossOriginScriptURLPart), "Cross-origin script should be listed before the reload.");

            let framesBeforeReload = new Set(WI.networkManager.frames);
            let mainResourceBeforeReload = WI.networkManager.mainFrame.mainResource;
            let mainLoaderBeforeReload = WI.networkManager.mainFrame.loaderIdentifier;

            let recorder = new FrameLoadRowRecorder;
            recorder.seedFromFrameTree(WI.networkManager.mainFrame);

            InspectorTest.log("Reloading...");
            let pageDidLoad = InspectorTest.awaitEvent(FrontendTestHarness.Event.TestPageDidLoad);
            await InspectorTest.reloadPage();
            await pageDidLoad;

            // TestPageDidLoad and the Page events arrive on different connections, so the old frames can still be in the model here.
            let mainFrameCommitted = await pollUntil(() => {
                let loaderIdentifier = WI.networkManager.mainFrame?.loaderIdentifier;
                return loaderIdentifier && loaderIdentifier !== mainLoaderBeforeReload;
            });
            InspectorTest.expectThat(!!mainFrameCommitted, "Main frame should commit the reload.");

            srcdocFrame = await awaitChildFrame((frame) => !framesBeforeReload.has(frame) && frame.name === "static-frame");
            InspectorTest.expectThat(!!srcdocFrame, "srcdoc frame should be attached after the reload.");
            crossOriginFrame = await awaitChildFrame((frame) => !framesBeforeReload.has(frame) && frame.mainResource.url.includes(crossOriginDocumentURLPart));
            InspectorTest.expectThat(!!crossOriginFrame, "Cross-origin frame should be attached after the reload.");

            // Let the cross-origin frame finish loading before the inspector closes.
            let script = crossOriginFrame && await awaitSubresource(crossOriginFrame, crossOriginScriptURLPart);
            InspectorTest.expectThat(!!script, "Cross-origin script should be added after the reload.");
            if (script)
                InspectorTest.expectEqual(await awaitResourceSettled(script), "finished", "Cross-origin script should finish loading.");

            let mainRows = recorder.rowsForURL(mainResourceBeforeReload.url);
            InspectorTest.expectEqual(mainRows.length, 1, "Main document should be listed once.");
            InspectorTest.expectThat(!mainRows.includes(mainResourceBeforeReload), "Main document row from before the reload should be gone.");
            InspectorTest.expectThat(mainRows.includes(WI.networkManager.mainFrame?.mainResource), "Main frame's current document should be listed.");
            InspectorTest.expectEqual(recorder.rowsForURL("about:srcdoc").length, 1, "srcdoc document should be listed once.");
            InspectorTest.expectEqual(recorder.rowsForURLPart(crossOriginDocumentURLPart).length, 1, "Cross-origin document should be listed once.");
            InspectorTest.expectEqual(recorder.rowsForURLPart(crossOriginScriptURLPart).length, 1, "Cross-origin script should be listed once.");
            expectNoAboutBlankRow(recorder);

            recorder.stop();
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
<body onload="runTest()">
<p>Tests that reloading a page with a srcdoc iframe and a cross-origin iframe lists each document and script once under Site Isolation.</p>
<!-- Only one same-process iframe on purpose. With two or more, ProxyingNetworkAgent (which still counts per process) drops the
     new main document's responseReceived and loadingFinished after the reload, so its row would never finish.
     FIXME: Add a second same-process iframe and assert the main document finishes once Network counts per frame. -->
<iframe name="static-frame" srcdoc="<p>srcdoc-frame-marker</p>"></iframe>
<script>
{
    // A new token on every load, so the reloaded iframe's document and script are not served from the memory cache.
    let crossOriginHost = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
    let iframe = document.createElement("iframe");
    iframe.name = "cross-origin-frame";
    iframe.src = `http://${crossOriginHost}:8000/site-isolation/inspector/network/resources/iframe-with-script.html?reload-${String(Math.random()).slice(2)}`;
    document.body.appendChild(iframe);
}
</script>
</body>
