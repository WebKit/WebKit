<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script>
    var passphrase = "main-page-value";
    let blobStackWorker = null;
    let blobStackWorkerURL = null;

    function stackFromDeveloperServer() {
        return new Error("developer-server-stack").stack;
    }

    function scheduleDeveloperServerStack() {
        return new Promise((resolve) => {
            setTimeout(function developerServerCallback() {
                resolve(stackFromDeveloperServer());
            }, 500);
        });
    }

    function createBlobWorkerStack() {
        let source = `
            function stackFromBlobWorker() {
                return new Error("blob-worker-stack").stack;
            }
            setTimeout(function blobWorkerCallback() {
                console.log(stackFromBlobWorker());
            }, 500);
        `;
        blobStackWorkerURL = URL.createObjectURL(new Blob([source], {type: "text/javascript"}));
        blobStackWorker = new Worker(blobStackWorkerURL);
    }

    function removeBlobWorkerStack() {
        blobStackWorker?.terminate();
        URL.revokeObjectURL(blobStackWorkerURL);
        blobStackWorker = null;
        blobStackWorkerURL = null;
    }

    function test() {
        let suite = InspectorTest.createAsyncSuite("SiteIsolation.Runtime.CrossOriginEvaluate");

        let crossOriginTarget;

        suite.addTestCase({
            name: "SiteIsolation.Runtime.CrossOrigin.FrameTargetCreated",
            description: "The static cross-origin iframe should have a frame target with an execution context.",
            async test() {
                let frameTargets = WI.targets.filter((t) => t.type === WI.TargetType.Frame);
                let urlTargetMap = await fetchDocumentURLsForTargets(frameTargets);
                let mainFrameTarget = urlTargetMap.get(WI.networkManager.mainFrame.url);
                crossOriginTarget = frameTargets.find((t) => t !== mainFrameTarget);

                InspectorTest.assert(crossOriginTarget instanceof WI.FrameTarget);
                InspectorTest.expectNotNull(crossOriginTarget.RuntimeAgent, "Cross-origin frame target should have a RuntimeAgent.");
                InspectorTest.expectNotNull(crossOriginTarget.executionContext, "Cross-origin frame target should have an ExecutionContext.");
            }
        });

        suite.addTestCase({
            name: "SiteIsolation.Runtime.CrossOrigin.EvaluatePassphrase",
            description: "Evaluating in the cross-origin frame should return values from that frame's context.",
            async test() {
                let passphraseValue = await waitForExpressionInTarget(crossOriginTarget, "window.passphrase");
                InspectorTest.expectEqual(passphraseValue, "cross-origin-secret", "Cross-origin frame should have passphrase 'cross-origin-secret'.");

                let pageResponse = await WI.pageTarget.RuntimeAgent.evaluate.invoke({ expression: "window.passphrase", objectGroup: "test", returnByValue: true });
                InspectorTest.expectEqual(pageResponse.result.value, "main-page-value", "Main page should have passphrase 'main-page-value'.");

                InspectorTest.expectNotEqual(passphraseValue, pageResponse.result.value, "Cross-origin frame and main page should have different passphrase values.");
            }
        });

        suite.addTestCase({
            name: "SiteIsolation.Runtime.CrossOrigin.DeveloperServerStack",
            description: "An actual Error stack from a local developer server should be recognized as a Console stack string.",
            async test() {
                let response = await WI.pageTarget.RuntimeAgent.evaluate.invoke({
                    expression: "scheduleDeveloperServerStack()",
                    objectGroup: "test",
                });
                InspectorTest.assert(!response.wasThrown, "Creating an Error stack in the actual webpage should not throw.");
                let completed = await WI.pageTarget.RuntimeAgent.awaitPromise.invoke({promiseObjectId: response.result.objectId, returnByValue: true});
                InspectorTest.assert(!completed.wasThrown, "The page callback should produce its actual Error stack.");
                let stack = WI.RemoteObject.fromPayload(completed.result, WI.pageTarget);
                InspectorTest.expectEqual(stack.type, "string", "The actual Error stack should be a string.");
                InspectorTest.expectTrue(stack.description.includes("stackFromDeveloperServer@http://127.0.0.1:8000/"), "The actual Error stack should contain the developer server port.");
                InspectorTest.expectTrue(WI.StackTrace.isLikelyStackTrace(stack.description), "The Console string heuristic should recognize the actual developer server stack.");
            },
        });

        suite.addTestCase({
            name: "SiteIsolation.Runtime.CrossOrigin.BlobWorkerStack",
            description: "A real Error stack logged by a Blob-backed worker should be recognized as a Console stack string.",
            async test() {
                try {
                    let [event] = await Promise.all([
                        WI.consoleManager.awaitEvent(WI.ConsoleManager.Event.MessageAdded),
                        InspectorTest.evaluateInPage("createBlobWorkerStack()"),
                    ]);
                    let {message} = event.data;
                    InspectorTest.expectEqual(message.target.type, WI.TargetType.Worker, "The actual Console stack should come from a worker.");
                    let stack = message.parameters[0];
                    InspectorTest.expectEqual(stack.type, "string", "The Blob worker should log its actual Error stack as a string.");
                    InspectorTest.expectTrue(stack.value.includes("stackFromBlobWorker@blob:http://127.0.0.1:8000/"), "The actual Error stack should contain a Blob URL from the developer server.");
                    InspectorTest.expectTrue(WI.StackTrace.isLikelyStackTrace(stack.value), "The Console string heuristic should recognize the actual Blob worker stack.");

                    let callFrames = WI.StackTrace._parseStackTrace(stack.value);
                    InspectorTest.expectEqual(callFrames.length, 2, "The actual Blob worker stack should have two call frames.");
                    InspectorTest.expectEqual(callFrames[0].functionName, "stackFromBlobWorker", "The parsed stack should preserve the actual worker function name.");
                    InspectorTest.expectTrue(callFrames[0].url.startsWith("blob:http://127.0.0.1:8000/"), "The parsed stack should preserve the complete Blob source URL.");
                    InspectorTest.expectTrue(callFrames[0].lineNumber > 0 && callFrames[0].columnNumber > 0, "The parsed stack should preserve actual source line and column numbers.");
                } finally {
                    await InspectorTest.evaluateInPage("removeBlobWorkerStack()");
                }
            },
        });

        suite.addTestCase({
            name: "SiteIsolation.Runtime.CrossOrigin.EvaluateHostname",
            description: "Evaluating document.location.hostname should return the cross-origin hostname.",
            async test() {
                let frameHostname = await waitForExpressionInTarget(crossOriginTarget, "document.location.hostname");
                let pageResponse = await WI.pageTarget.RuntimeAgent.evaluate.invoke({ expression: "document.location.hostname", objectGroup: "test", returnByValue: true });

                InspectorTest.expectNotEqual(frameHostname, pageResponse.result.value, "Cross-origin frame hostname should differ from main page hostname.");
                InspectorTest.log(`Main page hostname: ${pageResponse.result.value}`);
                InspectorTest.log(`Cross-origin frame hostname: ${frameHostname}`);
            }
        });

        suite.addTestCase({
            name: "SiteIsolation.Runtime.CrossOrigin.CallFunctionOn",
            description: "callFunctionOn should work with objects created in the cross-origin frame's context.",
            async test() {
                let createResponse = await crossOriginTarget.RuntimeAgent.evaluate.invoke({ expression: "({key: 'from-cross-origin'})", objectGroup: "test" });
                InspectorTest.expectThat(!createResponse.wasThrown, "Creating object in cross-origin frame should not throw.");
                InspectorTest.expectNotNull(createResponse.result.objectId, "Created object should have an objectId.");

                let callResponse = await crossOriginTarget.RuntimeAgent.callFunctionOn.invoke({
                    objectId: createResponse.result.objectId,
                    functionDeclaration: "function() { return this.key; }",
                    returnByValue: true,
                });
                InspectorTest.expectEqual(callResponse.result.value, "from-cross-origin", "callFunctionOn should return the object's key value.");
                InspectorTest.expectThat(!callResponse.wasThrown, "callFunctionOn should not throw.");
            }
        });

        suite.runTestCasesAndFinish();
    }
</script>

<body onload="runTest()">
    <p>Test that Runtime.evaluate and callFunctionOn work correctly in cross-origin iframes under site isolation.</p>
    <iframe src="http://localhost:8000/site-isolation/inspector/runtime/resources/frame-with-passphrase.html"></iframe>
</body>
