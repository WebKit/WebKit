<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<html>
<head>
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script>
function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.DOM.Search");

    // Assembled at runtime so this script's own text never matches. Never log it: test output is
    // appended to this page's DOM, which the page target searches.
    const needle = ["global", "search", "needle"].join("-");
    const expectedMatchCount = 8;
    const unloadedOwnerFrameSubstring = "//localhost:8000/site-isolation/inspector/dom/resources/dom-search-unloaded-owner-frame.html";
    const chainOuterFrameSubstring = "//localhost:8000/site-isolation/inspector/dom/resources/dom-search-chain-outer-frame.html";
    const chainInnerFrameSubstring = "//127.0.0.1:8000/site-isolation/inspector/dom/resources/dom-search-chain-inner-frame.html";

    // Same polling as frame-document-splicing-frame-target.html, plus an execution context, which the
    // deduplication in WI.DOMManager.performSearch keys on.
    async function frameTargetWhenReady(substring) {
        for (let attempt = 0; attempt < 50; ++attempt) {
            let target = await frameTargetForURLContaining(substring);
            if (target && !target.isProvisional && target.executionContext && WI.domManager.frameTargetDocumentForTarget(target))
                return target;
            await new Promise((resolve) => setTimeout(resolve, 100));
        }
        return null;
    }

    function describeMatch(node) {
        let url = new URL(node.ownerDocument.documentURL);
        let name = url.hostname + "/" + url.pathname.substring(url.pathname.lastIndexOf("/") + 1);
        return name + (node.isInShadowTree() ? " (shadow tree)" : "") + " via " + (node.owningTarget ? "frame target" : "page target");
    }

    function logMatches(nodes) {
        let descriptions = nodes.map(describeMatch).sort();
        for (let description of descriptions)
            InspectorTest.log(description);
        InspectorTest.expectEqual(new Set(descriptions).size, descriptions.length, "Each match should be reported once.");
    }

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.Setup",
        description: "Wait for every frame target to commit and produce a document.",
        async test() {
            InspectorTest.expectNotNull(await WI.domManager.requestDocument(), "Page target should have a document.");
            for (let [label, substring] of [
                ["same-origin frame", "/dom-search-same-origin-frame.html"],
                ["cross-origin frame", "//localhost:8000/site-isolation/inspector/dom/resources/dom-search-cross-origin-frame.html"],
                ["same-site nested frame", "//localhost:8000/site-isolation/inspector/dom/resources/dom-search-nested-frame.html"],
                ["main-site nested frame", "//127.0.0.1:8000/site-isolation/inspector/dom/resources/dom-search-nested-frame.html"],
                ["unloaded-owner frame", unloadedOwnerFrameSubstring],
                ["chain outer frame", chainOuterFrameSubstring],
                ["chain inner frame", chainInnerFrameSubstring],
            ])
                InspectorTest.expectNotNull(await frameTargetWhenReady(substring), `Should find the ${label} target.`);
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.EveryFrameOnce",
        description: "Each frame's match should be reported exactly once, from the page target for frames in the main frame's process and from the frame's own target otherwise.",
        async test() {
            let nodes = await WI.domManager.performSearch(needle);
            InspectorTest.expectEqual(nodes.length, expectedMatchCount, "Should find every match.");
            logMatches(nodes);
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.Root",
        description: "With a root, as for a DOM tree outline, every match should be under it and in tree order. Frame documents whose owner elements were never loaded should be spliced in by the search, also when the owner is in another such frame document that has no match.",
        async test() {
            let pageDocument = await WI.domManager.requestDocument();
            let frameDocumentForURL = async (substring) => WI.domManager.frameTargetDocumentForTarget(await frameTargetWhenReady(substring));
            let unloadedOwnerDocument = await frameDocumentForURL(unloadedOwnerFrameSubstring);
            let chainOuterDocument = await frameDocumentForURL(chainOuterFrameSubstring);
            let chainInnerDocument = await frameDocumentForURL(chainInnerFrameSubstring);
            InspectorTest.expectFalse(pageDocument.isAncestor(unloadedOwnerDocument), "The unloaded-owner frame document should not be in the page tree before the search.");
            InspectorTest.expectFalse(pageDocument.isAncestor(chainOuterDocument), "The chain outer frame document should not be in the page tree before the search.");
            InspectorTest.expectFalse(pageDocument.isAncestor(chainInnerDocument), "The chain inner frame document should not be in the page tree before the search.");

            let nodes = await WI.domManager.performSearch(needle, {root: pageDocument});
            InspectorTest.expectEqual(nodes.length, expectedMatchCount, "Should find every match.");
            InspectorTest.expectThat(nodes.every((node) => pageDocument.isAncestor(node)), "Every match should be under the root.");
            InspectorTest.expectThat(pageDocument.isAncestor(unloadedOwnerDocument), "The unloaded-owner frame document should be in the page tree after the search.");
            InspectorTest.expectThat(pageDocument.isAncestor(chainInnerDocument), "The chain inner frame document should be in the page tree after the search.");

            InspectorTest.log("Matches in tree order:");
            for (let node of nodes)
                InspectorTest.log(describeMatch(node));
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.RootSkipsUnsplicedFrameDocument",
        description: "A tree outline cannot reveal a match in a frame document that is not spliced into its tree, so a search with a root should not count it.",
        async test() {
            let pageDocument = await WI.domManager.requestDocument();
            let target = await frameTargetWhenReady(unloadedOwnerFrameSubstring);
            let frameDocument = WI.domManager.frameTargetDocumentForTarget(target);

            // Loads the owner element, so asking for it again later does not splice the document back.
            await WI.domManager.performSearch(needle, {root: pageDocument});
            InspectorTest.expectThat(pageDocument.isAncestor(frameDocument), "The frame document should be spliced after a search with a root.");

            // Stands in for a frame document whose owner element never arrives.
            WI.domManager._unspliceFrameDocument(frameDocument);
            try {
                let nodes = await WI.domManager.performSearch(needle, {root: pageDocument});
                InspectorTest.expectEqual(nodes.length, expectedMatchCount - 1, "Should find every match except the one in the unspliced frame document.");
                InspectorTest.expectFalse(nodes.some((node) => node.owningTarget === target), "Should not report a node of the unspliced frame document.");
                InspectorTest.expectEqual((await WI.domManager.performSearch(needle)).length, expectedMatchCount, "A search without a root should still report it.");
            } finally {
                WI.domManager._trySpliceUnsplicedFrameDocuments();
            }
            InspectorTest.expectThat(pageDocument.isAncestor(frameDocument), "The frame document should be spliced again.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.IndependentOwners",
        description: "A search should only replace an earlier search of the same owner, so that the Search tab and a DOM tree's find banner do not cancel each other.",
        async test() {
            let firstOwner = {};
            let secondOwner = {};
            let replacedSearch = WI.domManager.performSearch(needle, {owner: firstOwner});
            let otherOwnerSearch = WI.domManager.performSearch(needle, {owner: secondOwner});
            let newerSearch = WI.domManager.performSearch(needle, {owner: firstOwner});
            InspectorTest.expectNull(await replacedSearch, "The replaced search should resolve to null.");
            InspectorTest.expectEqual((await otherOwnerSearch)?.length, expectedMatchCount, "The search of the other owner should find every match.");
            InspectorTest.expectEqual((await newerSearch)?.length, expectedMatchCount, "The newer search should find every match.");
            WI.domManager.discardSearchResults(firstOwner);
            WI.domManager.discardSearchResults(secondOwner);
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.CaseSensitive",
        description: "caseSensitive applies to every target.",
        async test() {
            InspectorTest.expectEqual((await WI.domManager.performSearch(needle.toUpperCase(), {caseSensitive: true})).length, 0, "Case-sensitive search with the wrong case should find nothing.");
            InspectorTest.expectEqual((await WI.domManager.performSearch(needle.toUpperCase(), {caseSensitive: false})).length, expectedMatchCount, "Case-insensitive search should find every match.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.Superseded",
        description: "Starting a new search should make the previous one resolve to null.",
        async test() {
            let first = WI.domManager.performSearch(needle);
            let second = WI.domManager.performSearch(needle);
            InspectorTest.expectNull(await first, "The replaced search should resolve to null.");
            InspectorTest.expectEqual((await second).length, expectedMatchCount, "The newer search should find every match.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.DOM.Search.MatchesResolveToResources",
        description: "SearchSidebarPanel groups DOM matches by the resource for their document URL; each match must resolve to one.",
        async test() {
            let nodes = await WI.domManager.performSearch(needle);
            nodes.sort((a, b) => describeMatch(a) < describeMatch(b) ? -1 : 1);
            for (let node of nodes) {
                let resource = WI.networkManager.resourcesForURL(node.ownerDocument.documentURL).firstValue;
                InspectorTest.expectNotNull(resource, `${describeMatch(node)} should resolve to a resource.`);
            }
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="runTest()">
<p>Tests that WI.DOMManager.performSearch searches cross-origin frame targets under site isolation and reports each match once. With a root, it reports the matches a DOM tree outline can reveal, in tree order.</p>
<div data-search="global-search-needle"></div>
<iframe src="resources/dom-search-same-origin-frame.html"></iframe>
<iframe src="http://localhost:8000/site-isolation/inspector/dom/resources/dom-search-cross-origin-frame.html"></iframe>
<div><div><iframe src="http://localhost:8000/site-isolation/inspector/dom/resources/dom-search-unloaded-owner-frame.html"></iframe></div></div>
<div><div><iframe src="http://localhost:8000/site-isolation/inspector/dom/resources/dom-search-chain-outer-frame.html"></iframe></div></div>
</body>
</html>
