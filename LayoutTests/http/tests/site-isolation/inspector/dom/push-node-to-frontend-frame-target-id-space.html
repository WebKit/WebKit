<!doctype html>
<html>
<head>
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script>
function setup()
{
    let shadow = document.getElementById("host").attachShadow({mode: "open"});
    let input = document.createElement("input");
    input.name = "Username";
    shadow.appendChild(input);

    window.canvasContext = document.getElementById("canvas").getContext("2d");

    runTest();
}

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.DOM.FrameDOMAgent.PushNodeToFrontend");

    let mainFrameTarget = null;
    let sameOriginFrameTarget = null;
    let crossOriginFrameTarget = null;

    async function pushNodeForExpression(target, expression) {
        let {result} = await target.RuntimeAgent.evaluate.invoke({expression, objectGroup: "test"});
        let remoteObject = WI.RemoteObject.fromPayload(result, target);
        let nodeId = await new Promise((resolve) => remoteObject.pushNodeToFrontend(resolve));
        return WI.domManager.nodeForId(nodeId);
    }

    async function waitForCanvasOnTarget(target) {
        let existing = Array.from(WI.canvasManager.canvasCollection).find((canvas) => canvas.target === target);
        if (existing)
            return existing;

        return new Promise((resolve) => {
            let listener = WI.canvasManager.canvasCollection.addEventListener(WI.Collection.Event.ItemAdded, (event) => {
                if (event.data.item.target !== target)
                    return;
                WI.canvasManager.canvasCollection.removeEventListener(WI.Collection.Event.ItemAdded, listener);
                resolve(event.data.item);
            });
        });
    }

    async function expectNodeInPageTree(node) {
        let pageDocument = await WI.domManager.requestDocument();
        let root = node;
        while (root?.parentNode)
            root = root.parentNode;
        InspectorTest.expectThat(root === pageDocument, "Pushed node should be in the page tree.");
        InspectorTest.expectNull(node?.owningTarget, "Pushed node should not be owned by a frame target.");
    }

    suite.addTestCase({
        name: "Setup",
        description: "Under site isolation the main frame, a frame in its process, and a cross-origin frame each have a frame target.",
        async test() {
            mainFrameTarget = await waitForFrameTargetForURLContaining("push-node-to-frontend-frame-target-id-space.html");
            InspectorTest.expectNotNull(mainFrameTarget, "Should find the main frame's target.");

            sameOriginFrameTarget = await waitForFrameTargetForURLContaining("?same-origin");
            InspectorTest.expectNotNull(sameOriginFrameTarget, "Should find the same-origin frame's target.");

            crossOriginFrameTarget = await waitForFrameTargetForURLContaining("?cross-origin");
            InspectorTest.expectNotNull(crossOriginFrameTarget, "Should find the cross-origin frame's target.");

            InspectorTest.expectNotNull(await WI.domManager.requestDocument(), "Page target should have a document.");
        }
    });

    suite.addTestCase({
        name: "NodeInDocumentTree",
        description: "A node pushed from the main frame's target should resolve to the page tree's node, not to a copy in that target's own tree.",
        async test() {
            let expression = `document.getElementById("paragraph")`;
            let node = await pushNodeForExpression(mainFrameTarget, expression);
            let pageTargetNode = await pushNodeForExpression(WI.mainTarget, expression);

            InspectorTest.expectEqual(node?.nodeName(), "P", "Pushed node should be the paragraph.");
            InspectorTest.expectThat(node === pageTargetNode, "Pushed node should be the node the page target pushes.");
            await expectNodeInPageTree(node);
        }
    });

    suite.addTestCase({
        name: "NodeInShadowTree",
        description: "A node inside a shadow tree pushed from the main frame's target should resolve to the page tree's node.",
        async test() {
            let expression = `document.getElementById("host").shadowRoot.querySelector("input")`;
            let node = await pushNodeForExpression(mainFrameTarget, expression);
            let pageTargetNode = await pushNodeForExpression(WI.mainTarget, expression);

            InspectorTest.expectEqual(node?.nodeName(), "INPUT", "Pushed node should be the input inside the shadow tree.");
            InspectorTest.expectEqual(node?.getAttribute("name"), "Username", "Pushed node should be the shadow tree's Username input.");
            InspectorTest.expectThat(node === pageTargetNode, "Pushed node should be the node the page target pushes.");
            await expectNodeInPageTree(node);
        }
    });

    suite.addTestCase({
        name: "NodeInSameOriginFrame",
        description: "A node pushed from the target of a frame in the main frame's process should resolve to the page tree's node even before its <iframe> owner is expanded.",
        async test() {
            InspectorTest.expectEqual(Array.from(WI.domManager.attachedNodes({filter: (node) => node.nodeName() === "IFRAME"})).length, 0, "No <iframe> owner elements should be loaded in the page tree yet.");

            let node = await pushNodeForExpression(sameOriginFrameTarget, `document.getElementById("frame-paragraph")`);
            let ownerElement = await pushNodeForExpression(WI.mainTarget, `document.getElementById("same-origin-frame")`);

            InspectorTest.expectEqual(node?.nodeName(), "P", "Pushed node should be the frame's paragraph.");
            InspectorTest.expectThat(ownerElement?.isAncestor(node), "Pushed node should be under the frame's owner in the page tree.");
            await expectNodeInPageTree(node);
        }
    });

    suite.addTestCase({
        name: "NodeInCrossOriginFrame",
        description: "A node pushed from a cross-origin frame's target should stay owned by that frame target and splice under its <iframe> owner.",
        async test() {
            InspectorTest.expectNull(Array.from(WI.domManager.attachedNodes({filter: (node) => node.getAttribute("id") === "cross-origin-frame"}))[0] ?? null, "Cross-origin <iframe> owner should not be loaded in the page tree yet.");

            let node = await pushNodeForExpression(crossOriginFrameTarget, `document.getElementById("frame-paragraph")`);
            let ownerElement = await pushNodeForExpression(WI.mainTarget, `document.getElementById("cross-origin-frame")`);

            InspectorTest.expectEqual(node?.nodeName(), "P", "Pushed node should be the cross-origin frame's paragraph.");
            InspectorTest.expectThat(node?.owningTarget === crossOriginFrameTarget, "Pushed node should stay owned by the cross-origin frame's target.");
            InspectorTest.expectThat(ownerElement?.isAncestor(node), "Pushed node should be under the cross-origin frame's owner in the page tree.");
        }
    });

    suite.addTestCase({
        name: "CanvasNodeInMainFrame",
        description: "Canvas.prototype.requestNodes on the main frame's target should resolve to the page tree's <canvas> node.",
        async test() {
            let canvas = await waitForCanvasOnTarget(mainFrameTarget);
            let nodes = await canvas.requestNodes();
            let pageTargetNode = await pushNodeForExpression(WI.mainTarget, `document.getElementById("canvas")`);

            InspectorTest.expectEqual(nodes.length, 1, "Canvas should resolve one node.");
            InspectorTest.expectThat(nodes[0] === pageTargetNode, "Canvas node should be the node the page target pushes.");
            await expectNodeInPageTree(nodes[0]);
        }
    });

    suite.addTestCase({
        name: "PageTargetIdsAreNotScoped",
        description: "Nodes pushed from the page target keep their unscoped ids.",
        async test() {
            let node = await pushNodeForExpression(WI.mainTarget, `document.getElementById("paragraph")`);
            InspectorTest.expectEqual(typeof node?.id, "number", "Page target node ids should stay numeric.");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="setup()">
<p>Tests that a DOM node pushed to the frontend from the frame target of a document that is also in the page tree resolves to the page tree's node.</p>
<div style="display: none">
    <div id="host"></div>
    <p id="paragraph">paragraph</p>
    <canvas id="canvas"></canvas>
    <div><div><iframe id="same-origin-frame" src="resources/push-node-to-frontend-same-origin-frame.html?same-origin"></iframe></div></div>
    <div><div><iframe id="cross-origin-frame" src="http://localhost:8000/site-isolation/inspector/dom/resources/push-node-to-frontend-same-origin-frame.html?cross-origin"></iframe></div></div>
</div>
</body>
</html>
