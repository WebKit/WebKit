<!doctype html>
<html>
<head>
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="../debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script>
function setup()
{
    let shadow = document.getElementById("host").attachShadow({mode: "open"});
    let input = document.createElement("input");
    input.name = "Username";
    shadow.appendChild(input);

    runTest();
}

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.DOM.FrameDOMAgent.PushNodeToFrontend");

    let mainFrameTarget = null;
    let sameOriginFrameTarget = null;

    async function pushNodeForExpression(target, expression) {
        let {result} = await target.RuntimeAgent.evaluate.invoke({expression, objectGroup: "test"});
        let remoteObject = WI.RemoteObject.fromPayload(result, target);
        let nodeId = await new Promise((resolve) => remoteObject.pushNodeToFrontend(resolve));
        return WI.domManager.nodeForId(nodeId);
    }

    async function expectNodeInPageTree(node) {
        let pageDocument = await WI.domManager.requestDocument();
        let root = node;
        while (root?.parentNode)
            root = root.parentNode;
        InspectorTest.expectThat(root === pageDocument, "Pushed node should be in the page tree.");
        InspectorTest.expectNull(node?.owningTarget, "Pushed node should not be owned by a frame target.");
    }

    suite.addTestCase({
        name: "Setup",
        description: "Under site isolation the main frame and a frame in its process each have a frame target of their own.",
        async test() {
            mainFrameTarget = await waitForFrameTargetForURLContaining("push-node-to-frontend-frame-target-id-space.html");
            InspectorTest.expectNotNull(mainFrameTarget, "Should find the main frame's target.");

            sameOriginFrameTarget = await waitForFrameTargetForURLContaining("push-node-to-frontend-same-origin-frame.html");
            InspectorTest.expectNotNull(sameOriginFrameTarget, "Should find the same-origin frame's target.");

            InspectorTest.expectNotNull(await WI.domManager.requestDocument(), "Page target should have a document.");
        }
    });

    suite.addTestCase({
        name: "NodeInDocumentTree",
        description: "A node pushed from the main frame's target should resolve to the page tree's node, not to a copy in that target's own tree.",
        async test() {
            let expression = `document.getElementById("paragraph")`;
            let node = await pushNodeForExpression(mainFrameTarget, expression);
            let pageTargetNode = await pushNodeForExpression(WI.mainTarget, expression);

            InspectorTest.expectEqual(node?.nodeName(), "P", "Pushed node should be the paragraph.");
            InspectorTest.expectThat(node === pageTargetNode, "Pushed node should be the node the page target pushes.");
            await expectNodeInPageTree(node);
        }
    });

    suite.addTestCase({
        name: "NodeInShadowTree",
        description: "A node inside a shadow tree pushed from the main frame's target should resolve to the page tree's node.",
        async test() {
            let expression = `document.getElementById("host").shadowRoot.querySelector("input")`;
            let node = await pushNodeForExpression(mainFrameTarget, expression);
            let pageTargetNode = await pushNodeForExpression(WI.mainTarget, expression);

            InspectorTest.expectEqual(node?.nodeName(), "INPUT", "Pushed node should be the input inside the shadow tree.");
            InspectorTest.expectEqual(node?.getAttribute("name"), "Username", "Pushed node should be the shadow tree's Username input.");
            InspectorTest.expectThat(node === pageTargetNode, "Pushed node should be the node the page target pushes.");
            await expectNodeInPageTree(node);
        }
    });

    suite.addTestCase({
        name: "NodeInSameOriginFrame",
        description: "A node pushed from the target of a frame in the main frame's process should resolve to the page tree's node under the frame's owner.",
        async test() {
            let ownerElement = await pushNodeForExpression(WI.mainTarget, `document.getElementById("same-origin-frame")`);
            let node = await pushNodeForExpression(sameOriginFrameTarget, `document.getElementById("frame-paragraph")`);

            InspectorTest.expectEqual(node?.nodeName(), "P", "Pushed node should be the frame's paragraph.");
            InspectorTest.expectThat(ownerElement?.isAncestor(node), "Pushed node should be under the frame's owner in the page tree.");
            await expectNodeInPageTree(node);
        }
    });

    suite.addTestCase({
        name: "PageTargetIdsAreNotScoped",
        description: "Nodes pushed from the page target keep their unscoped ids.",
        async test() {
            let node = await pushNodeForExpression(WI.mainTarget, `document.getElementById("paragraph")`);
            InspectorTest.expectEqual(typeof node?.id, "number", "Page target node ids should stay numeric.");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
</head>
<body onload="setup()">
<p>Tests that a DOM node pushed to the frontend from the frame target of a document that is also in the page tree resolves to the page tree's node.</p>
<div style="display: none">
    <div id="host"></div>
    <p id="paragraph">paragraph</p>
    <iframe id="same-origin-frame" src="resources/push-node-to-frontend-same-origin-frame.html"></iframe>
</div>
</body>
</html>
