<!DOCTYPE html>
<html>
<head>

    <style>
        body { margin: 0; }
        #spacer { height: 400px; }
        #target { width: 120px; height: 60px; margin: 10px; padding: 8px; border: 4px solid black; background: cyan; }

    <div id="container">

        <div id="target">Highlight me</div>
