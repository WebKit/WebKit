<!-- webkit-test-runner [ SiteIsolationEnabled=true SiteIsolationGlobalDebuggerPauseEnabled=true ] -->
<script src="/inspector/resources/inspector-test.js"></script>
<script src="/site-isolation/inspector/debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script src="/site-isolation/inspector/debugger/resources/global-pause-test-utilities.js"></script>
<script>
window.mainTicks = 0;
setInterval(() => { window.mainTicks++; }, 50);

window.loadListenerRan = false;
addEventListener("load", () => { window.loadListenerRan = true; });

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Debugger.MainFrameNavigationWhileStopped");

    suite.addTestCase({
        name: "SiteIsolation.Debugger.MainFrameNavigationWhileStopped.NavigationReplaced",
        description: "A navigation of the main frame that replaces another one, while a cross-site frame is stopped, should keep the page released and should not hold the new document.",
        async test() {
            let frameTarget = await waitForFrameTargetForURLContaining("same-process-frame.html");
            InspectorTest.expectNotNull(frameTarget, "Should find the frame target of the cross-site frame.");
            if (!frameTarget)
                return;

            await GlobalPause.pause(frameTarget);

            // The first navigation goes to another site, so it continues in a provisional page.
            GlobalPause.evaluate(InspectorTest.mainFrameTarget, `location.href = "https://localhost:8443/resources/load-and-stall.py?name=../site-isolation/inspector/debugger/resources/same-process-frame.html&mimeType=text/html&stallAt=0&stallFor=10&rand=" + Math.random()`);
            await GlobalPause.expectRunning(InspectorTest.mainFrameTarget, "window.mainTicks", await GlobalPause.evaluate(InspectorTest.mainFrameTarget, "window.mainTicks"), "The main frame's interval while the first navigation is pending");

            // The second one stays in the process of the page, so it cancels the provisional page.
            let loaded = InspectorTest.awaitEvent(FrontendTestHarness.Event.TestPageDidLoad);
            InspectorTest.deferOutputUntilTestPageIsReloaded();
            GlobalPause.evaluate(InspectorTest.mainFrameTarget, `location.href = "/resources/load-and-stall.py?name=../site-isolation/inspector/debugger/pause-session-main-frame-navigation-replaced-while-cross-site-frame-stopped.html&mimeType=text/html&stallAt=0&stallFor=2&rand=" + Math.random()`);
            await GlobalPause.expectRunning(InspectorTest.mainFrameTarget, "window.mainTicks", await GlobalPause.evaluate(InspectorTest.mainFrameTarget, "window.mainTicks"), "The main frame's interval while the second navigation is pending");
            await loaded;

            InspectorTest.pass("The new document loaded.");
            InspectorTest.expectThat(await InspectorTest.evaluateInPage("window.loadListenerRan"), "The new document's load listener should run.");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
<body onload="runTest()">
<p>Tests that a navigation of the main frame that replaces another navigation leaves the page released while a cross-site frame is stopped in the debugger.</p>
<script>
if (!location.pathname.includes("load-and-stall")) {
    let iframe = document.createElement("iframe");
    iframe.src = "http://localhost:8000/site-isolation/inspector/debugger/resources/same-process-frame.html";
    document.body.appendChild(iframe);
}
</script>
</body>
