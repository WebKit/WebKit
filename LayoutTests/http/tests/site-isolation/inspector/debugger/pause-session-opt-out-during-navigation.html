<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="/inspector/resources/inspector-test.js"></script>
<script src="/site-isolation/inspector/debugger/resources/site-isolation-debugger-test-utilities.js"></script>
<script src="/site-isolation/inspector/debugger/resources/global-pause-test-utilities.js"></script>
<script>
window.mainTicks = 0;
setInterval(() => { window.mainTicks++; }, 50);

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Debugger.PauseSessionOptOutDuringNavigation");

    let frameTarget;
    let sessionEvents;
    let listener;

    function startNavigation()
    {
        GlobalPause.evaluate(InspectorTest.mainFrameTarget, `location.href = "/resources/load-and-stall.py?name=../site-isolation/inspector/debugger/resources/same-process-frame.html&mimeType=text/html&stallAt=0&stallFor=10&rand=" + Math.random()`);
        return GlobalPause.sleep(500);
    }

    function countSessionEvents()
    {
        sessionEvents = 0;
        listener = WI.debuggerManager.addEventListener(WI.DebuggerManager.Event.PauseSessionChanged, () => { ++sessionEvents; });
    }

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseSessionOptOutDuringNavigation.Setup",
        description: "Find the frame target of the cross-site iframe.",
        async test() {
            frameTarget = await waitForFrameTargetForURLContaining("same-process-frame.html");
            InspectorTest.expectNotNull(frameTarget, "Should find the frame target of the cross-site frame.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseSessionOptOutDuringNavigation.EnabledDuringNavigation",
        description: "Turning global pause on while the main frame navigates should not hold the page until the navigation ends.",
        async test() {
            await GlobalPause.pageTarget().TargetAgent.setGlobalDebuggerPauseEnabled(false);
            await startNavigation();
            await GlobalPause.pause(frameTarget);

            countSessionEvents();
            await GlobalPause.pageTarget().TargetAgent.setGlobalDebuggerPauseEnabled(true);
            await GlobalPause.sleep(300);
            InspectorTest.expectEqual(sessionEvents, 0, "No session should open while the navigation is pending.");
            let before = await GlobalPause.evaluate(InspectorTest.mainFrameTarget, "window.mainTicks");
            await GlobalPause.expectRunning(InspectorTest.mainFrameTarget, "window.mainTicks", before, "The main frame's interval while the navigation is pending");

            let opened = GlobalPause.awaitSessionEvent((data) => data.state === "paused");
            await GlobalPause.evaluate(InspectorTest.mainFrameTarget, "window.stop()");
            await opened;
            WI.debuggerManager.removeEventListener(WI.DebuggerManager.Event.PauseSessionChanged, listener);
            await GlobalPause.expectHeld(InspectorTest.mainFrameTarget, "window.mainTicks", "The main frame's interval", "after the navigation was cancelled");

            await GlobalPause.resumeAll();
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseSessionOptOutDuringNavigation.NavigationCancelledWhileDisabled",
        description: "A navigation that does not commit should not open a session while global pause is off, and turning it on afterwards should hold the page again.",
        async test() {
            await GlobalPause.pageTarget().TargetAgent.setGlobalDebuggerPauseEnabled(false);
            await startNavigation();
            await GlobalPause.pause(frameTarget);

            countSessionEvents();
            await GlobalPause.evaluate(InspectorTest.mainFrameTarget, "window.stop()");
            await GlobalPause.sleep(300);
            InspectorTest.expectEqual(sessionEvents, 0, "No session should open after the navigation was cancelled.");
            let before = await GlobalPause.evaluate(InspectorTest.mainFrameTarget, "window.mainTicks");
            await GlobalPause.expectRunning(InspectorTest.mainFrameTarget, "window.mainTicks", before, "The main frame's interval after the navigation was cancelled");
            WI.debuggerManager.removeEventListener(WI.DebuggerManager.Event.PauseSessionChanged, listener);

            let opened = GlobalPause.awaitSessionEvent((data) => data.state === "paused");
            await GlobalPause.pageTarget().TargetAgent.setGlobalDebuggerPauseEnabled(true);
            await opened;
            await GlobalPause.expectHeld(InspectorTest.mainFrameTarget, "window.mainTicks", "The main frame's interval", "after global pause was turned on");

            await GlobalPause.resumeAll();
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
<body onload="runTest()">
<p>Tests that turning global pause on during a navigation of the main frame does not hold the page, and that a navigation that does not commit does not open a session while global pause is off.</p>
<iframe src="http://localhost:8000/site-isolation/inspector/debugger/resources/same-process-frame.html"></iframe>
</body>
