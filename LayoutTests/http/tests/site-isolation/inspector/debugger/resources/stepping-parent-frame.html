<script>
window.parentTicks = 0;
setInterval(() => { window.parentTicks++; }, 50);

function pauseAndDispatch()
{

    childDocument.dispatchEvent(new CustomEvent("test-event"));
    return childDocument.defaultView.testEventCount;
}
</script>
