<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="resources/site-isolation-debugger-test-utilities.js"></script>
<script src="resources/global-pause-test-utilities.js"></script>
<script>
window.loadListenerRan = false;
addEventListener("load", () => { window.loadListenerRan = true; });

function pauseHere()
{
    debugger;
}

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Debugger.FrontendNavigationNewFrameTargets");

    function targetsLeftPaused()
    {
        return Array.from(WI.targets).filter((target) => {
            let data = WI.debuggerManager.dataForTarget(target);
            return data.paused || data.pausing;
        });
    }

    async function navigate(origin, search)
    {
        let loaded = InspectorTest.awaitEvent(FrontendTestHarness.Event.TestPageDidLoad);
        InspectorTest.deferOutputUntilTestPageIsReloaded();
        InspectorTest.evaluateInPage(`location.href = "${origin}" + location.pathname + "${search}"`);
        await loaded;
    }

    async function expectNewDocumentRuns(frameName)
    {
        InspectorTest.expectThat(await InspectorTest.evaluateInPage("window.loadListenerRan"), "The new document's load listener should run.");

        let frameTarget = await waitForFrameTargetForURLContaining(`same-process-frame.html?${frameName}`);
        InspectorTest.expectNotNull(frameTarget, `Should find the frame target of the new frame ${frameName}.`);
        if (!frameTarget)
            return;

        InspectorTest.expectFalse(WI.debuggerManager.paused, "The debugger should not be paused.");
        InspectorTest.expectEqual(targetsLeftPaused().length, 0, "No target should be paused or asked to pause.");

        let before = await GlobalPause.evaluate(frameTarget, "window.ticks");
        await GlobalPause.expectRunning(frameTarget, "window.ticks", before, `The new frame ${frameName}'s interval`);
    }

    suite.addTestCase({
        name: "SiteIsolation.Debugger.FrontendNavigationNewFrameTargets.CrossSiteFrameStopped",
        description: "A navigation of the main frame while a cross-site frame is stopped should not leave the frame targets of the new document paused.",
        async test() {
            let frameTarget = await waitForFrameTargetForURLContaining("same-process-frame.html?A");
            InspectorTest.expectNotNull(frameTarget, "Should find the frame target of frame A.");
            if (!frameTarget)
                return;

            await GlobalPause.pause(frameTarget);
            await navigate("https://localhost:8443", "?second");
            await expectNewDocumentRuns("B");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Debugger.FrontendNavigationNewFrameTargets.MainFrameStopped",
        description: "A navigation of the main frame while the main frame is stopped should not leave the frame targets of the new document paused.",
        async test() {
            let paused = WI.debuggerManager.awaitEvent(WI.DebuggerManager.Event.Paused);
            InspectorTest.evaluateInPage("setTimeout(pauseHere)");
            await paused;

            await navigate("http://localhost:8000", "?third");
            await expectNewDocumentRuns("C");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>
<body onload="runTest()">
<p>Tests that the frame targets of a document that replaces a page which was paused in the debugger are not paused.</p>
<script>
// Each document is on a different site than the previous one, and has one frame on yet another site. The sites are http://127.0.0.1, http://localhost, https://localhost and https://127.0.0.1.
let frames = {
    "": ["http://localhost:8000", "A"],
    "?second": ["https://127.0.0.1:8443", "B"],
    "?third": ["http://127.0.0.1:8000", "C"],
};
let [origin, name] = frames[location.search];
let iframe = document.createElement("iframe");
iframe.src = `${origin}/site-isolation/inspector/debugger/resources/same-process-frame.html?${name}`;
document.body.appendChild(iframe);
</script>
</body>
