<!DOCTYPE html>
<html>
<body style="margin: 0">
<video id="video" muted autoplay></video>
<script>

var video = document.getElementById("video");
var didPlay = "false";

// Without this restriction the visibility of the frame does not enter the autoplay decision at all.
// It is applied to the element rather than through a setting, because a setting is only read when the
// element is created.
if (window.internals)
    internals.setMediaElementRestrictions(video, "invisibleautoplaynotpermitted");

video.addEventListener("play", function() {
    didPlay = "true";
}, false);

// The embedder is cross-origin, so it cannot reach this video element directly.
window.addEventListener("message", function(event) {
    if (!window.internals) {
        parent.postMessage("no internals", "*");
        return;
    }

    if (event.data === "start-autoplay") {
        video.src = "/media/resources/test.mp4";
        return;
    }

    parent.postMessage(didPlay, "*");
}, false);

</script>
</body>
</html>
