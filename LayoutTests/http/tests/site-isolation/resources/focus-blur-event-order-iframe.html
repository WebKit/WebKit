<!DOCTYPE html>
<html>
<body style="margin: 0;">
<input type="text" id="input" style="width: 200px; font-size: 16px;">
<script>
const input = document.getElementById("input");
let recording = false;
let events = [];

function record(name)
{
    if (recording)
        events.push(name);
}

window.addEventListener("focus", () => record("window:focus"));

input.addEventListener("focus", () => record("input:focus"));

input.addEventListener("focusin", () => {
    record("input:focusin");
    if (recording)
        window.parent.postMessage({ type: "iframeEvents", events }, "*");
});

window.addEventListener("message", (event) => {
    if (event.data.type === "startRecording") {
        recording = true;
        event.source.postMessage({ type: "recording" }, event.origin);
    }
});
</script>
</body>
</html>
