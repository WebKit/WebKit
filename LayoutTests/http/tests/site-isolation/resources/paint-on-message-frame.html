<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Transparent. Turns orange on "paint", and replies after the next animation frame. -->
<style>html, body { margin: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<script>
addEventListener("message", event => {
    if (event.data === "paint")
        document.documentElement.style.backgroundColor = "rgb(255, 120, 0)";
    requestAnimationFrame(() => event.source.postMessage({ reply: event.data }, "*"));
});
</script>
</body>
</html>
