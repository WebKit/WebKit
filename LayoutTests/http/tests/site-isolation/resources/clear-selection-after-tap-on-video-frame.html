<!DOCTYPE html>
<html>
<head>
<style>
body, html {
    font-family: system-ui;
    font-size: 18px;
    margin: 0;
}

video {
    display: block;
    width: 300px;
    height: 240px;
    position: absolute;
    top: 2em;
    z-index: -1;
}

#placeholder {
    width: 300px;
    height: 240px;
}
</style>
<script>
function centerOf(element)
{
    const rect = element.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

addEventListener("message", (event) => {
    if (event.data !== "select all")
        return;
    getSelection().selectAllChildren(document.getElementById("container"));
    window.top.postMessage({ type: "selected all" }, "*");
});

addEventListener("load", () => {
    window.top.postMessage({ type: "ready", bottom: centerOf(document.getElementById("bottom")), video: centerOf(document.querySelector("video")) }, "*");
});
</script>
</head>
<body>
    <video controls src="/media-resources/content/test.mp4"></video>
    <div id="container">
        <p id="top">Foo</p>
        <div id="placeholder"></div>
        <h1 id="bottom">Bar</h1>
    </div>
</body>
</html>
