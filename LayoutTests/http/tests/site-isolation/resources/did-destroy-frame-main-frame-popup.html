<body>
<script>
addEventListener("message", (event) => {
    if (event.data?.loaded !== undefined) {
        event.source.postMessage({ name: "WebPageProxy_DidDestroyFrame", args: [{ type: "FrameID", value: [BigInt(IPC.frameID[0])] }] }, "*");
        return;
    }

    if (event.data == "sent")
        opener.postMessage("main frame still responding", "*");
});

onload = () => {
    const frame = document.createElement("iframe");
    frame.src = "http://localhost:8000/site-isolation/resources/ipc-message-sender-iframe.html";
    document.body.appendChild(frame);
};
</script>
</body>
