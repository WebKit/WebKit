<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<html>
<body>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

const frame = document.createElement("iframe");

onmessage = function (event) {
    if (event.data == "ready") {
        // This load runs in this process while the frame's previous process calls document.open(),
        // which does not stop it.
        frame.src = "resources/pushstate-after-delayed-load.py";
        return;
    }
    document.write(event.data);
    if (window.testRunner)
        testRunner.notifyDone();
};

onload = function () {
    frame.src = "http://localhost:8000/site-isolation/resources/explicit-open-repeatedly.html";
    document.body.appendChild(frame);
};
</script>
</body>
</html>
