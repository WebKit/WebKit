<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<html>
<body>
<script src="/js-test-resources/js-test.js"></script>
<iframe id="f" width="420" height="44" frameborder="0"
        src="http://localhost:8000/site-isolation/resources/page-zoom-frame.html"
        onload="run()"></iframe>
<script>
description("Tests that page zoom changes neither the viewport a cross-origin iframe sees nor the size of fixed-pixel content inside it");

jsTestIsAsync = true;

const iframeWidth = 420;
const iframeHeight = 44;
const logoSize = 32;
const tolerance = 2;

var childViewportWidth, childViewportHeight, childLogoWidth, childLogoHeight;
var parentBoxWidth, parentBoxHeight;

var resolveReport = null;
window.addEventListener("message", event => {
    const resolve = resolveReport;
    resolveReport = null;
    if (resolve)
        resolve(event.data);
});

function askChild()
{
    return new Promise(resolve => {
        resolveReport = resolve;
        document.getElementById("f").contentWindow.postMessage("measure", "*");
    });
}

async function settledReport()
{
    let previous = null;
    for (let attempt = 0; attempt < 30; ++attempt) {
        await new Promise(requestAnimationFrame);
        const report = await askChild();
        const key = `${report.innerWidth}x${report.innerHeight}`;
        if (previous === key)
            return report;
        previous = key;
    }
    return await askChild();
}

async function checkZoomStep(step)
{
    const report = await settledReport();
    const box = document.getElementById("f").getBoundingClientRect();

    childViewportWidth = report.innerWidth;
    childViewportHeight = report.innerHeight;
    childLogoWidth = report.logoW;
    childLogoHeight = report.logoH;
    parentBoxWidth = box.width;
    parentBoxHeight = box.height;

    debug(`zoom step ${step}:`);
    shouldBeCloseTo("parentBoxWidth", iframeWidth, tolerance);
    shouldBeCloseTo("parentBoxHeight", iframeHeight, tolerance);
    shouldBeCloseTo("childViewportWidth", iframeWidth, tolerance);
    shouldBeCloseTo("childViewportHeight", iframeHeight, tolerance);
    shouldBeCloseTo("childLogoWidth", logoSize, tolerance);
    shouldBeCloseTo("childLogoHeight", logoSize, tolerance);
    debug("");
}

async function run()
{
    await checkZoomStep(0);

    for (let step = 1; step <= 4; ++step) {
        eventSender.zoomPageIn();
        await checkZoomStep(step);
    }

    eventSender.zoomPageOut();
    finishJSTest();
}
</script>
</body>
</html>
