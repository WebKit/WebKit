<script src="/js-test-resources/js-test.js"></script>
<script>
description("Tests that a cross-site iframe whose response has a Content-Security-Policy: upgrade-insecure-requests header loads without the UI process terminating the web process or crashing.");

    if (event.data !== "loaded")
        return;
    testPassed("The cross-site iframe loaded.");
    finishJSTest();
});
</script>
