<!-- webkit-test-runner [ SiteIsolationEnabled=true RemoteSnapshottingEnabled=true UseGPUProcessForDOMRenderingEnabled=true ] -->
<!DOCTYPE html>
<html>
<head>
<style>
:root { view-transition-name: none; }
body { margin: 0; }
#withframe { view-transition-name: withframe; position: absolute; left: 10px; top: 10px; width: 100px; height: 100px; }
iframe { display: block; width: 100px; height: 100px; border: none; }

/* Hold the transition, showing only the old capture. */
::view-transition-group(*) { animation-duration: 300s; }
::view-transition-old(*) { animation: unset; opacity: 1; }
::view-transition-new(*) { animation: unset; opacity: 0; }

::view-transition-old(withframe) { box-shadow: 0 0 0 10px blue; }
</style>
</head>
<body>
<div id="withframe"><iframe src="http://localhost:8000/site-isolation/resources/green-background.html"></iframe></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

onmessage = (event) => {
    if (event.data != "onload")
        return;

    // Only the old capture can show the iframe once it is hidden.
    const transition = document.startViewTransition(() => {
        document.querySelector("iframe").style.visibility = "hidden";
    });
    transition.ready.then(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => testRunner.notifyDone()));
    }, () => {
        document.body.style.backgroundColor = "red";
        testRunner.notifyDone();
    });
};
</script>
</body>
</html>
