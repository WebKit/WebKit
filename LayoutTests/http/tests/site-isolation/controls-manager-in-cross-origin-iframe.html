<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<body>
<p>A large, playing video in a cross-origin iframe should be eligible to be the playback controls manager.</p>
<iframe width="680" height="520" frameborder="0" src="http://localhost:8000/site-isolation/resources/controls-manager-in-cross-origin-iframe.html"></iframe>
<script>
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.dumpAsText();
}

addEventListener("message", (event) => {
    document.body.textContent = event.data;
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
