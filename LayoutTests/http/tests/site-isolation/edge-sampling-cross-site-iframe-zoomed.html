<!DOCTYPE html> <!-- webkit-test-runner [ SiteIsolationEnabled=true pageTopColorSamplingEnabled=true ContentInsetBackgroundFillEnabled=true TopContentInsetBackgroundCanChangeAfterScrolling=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page is zoomed and scrolled before the frame is first sampled, so the strip has to be mapped through both. -->
<link rel="stylesheet" href="resources/edge-sampling.css">
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<script src="resources/edge-sampling.js"></script>
</head>
<body>
<div class="edge top"><iframe data-src="http://localhost:8000/site-isolation/resources/solid-color.html?color=ff7800"></iframe></div>
<div class="tall"></div>
<script>
async function runTest()
{
    await waitForEdgeSamplingFramesToLoad();
    await UIHelper.ensurePresentationUpdate();
    await UIHelper.zoomToScale(1.5);
    scrollTo(0, 1000);
    await UIHelper.ensurePresentationUpdate();
    await setTopAndBottomEdgeInsets();

    edgeSamplingColors = await settledEdges({ top: "rgb(255, 120, 0)" });
    assertEdges({ top: "rgb(255, 120, 0)" });
    finishJSTest();
}

runTest();
</script>
</body>
</html>
