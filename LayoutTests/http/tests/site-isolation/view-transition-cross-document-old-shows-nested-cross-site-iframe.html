<!DOCTYPE html>
<html>
<head>
<style>
@view-transition { navigation: auto; }
:root { view-transition-name: none; }
body { margin: 0; }
#withframe { view-transition-name: withframe; width: 100px; height: 100px; }
iframe { display: block; width: 100px; height: 100px; border: none; }

/* Hold the transition, showing only the old capture. */
::view-transition-group(*) { animation-duration: 300s; }
::view-transition-old(*) { animation: unset; opacity: 1; }
::view-transition-new(*) { animation: unset; opacity: 0; }
</style>
<script>
// Navigates to itself with a changed query parameter, which shows the old capture over an empty box.
// The cross-site iframe's child is hosted in this document's process, and is only asked to record
// once its parent has, so it is easily lost if the navigation does not wait.
const isInitialPage = !location.search.includes("new");

testRunner.waitUntilDone();

if (isInitialPage) {
    onmessage = (event) => {
        if (event.data == "onload")
            requestAnimationFrame(() => requestAnimationFrame(() => location.replace(location.href + "?new")));
    };
} else {
    addEventListener("pagereveal", (event) => {
        if (!event.viewTransition) {
            document.body.style.backgroundColor = "red";
            testRunner.notifyDone();
            return;
        }
        event.viewTransition.ready.then(() => {
            requestAnimationFrame(() => requestAnimationFrame(() => testRunner.notifyDone()));
        }, () => {
            document.body.style.backgroundColor = "red";
            testRunner.notifyDone();
        });
    });
}
</script>
</head>
<body>
<div id="withframe"></div>
<script>
if (isInitialPage) {
    const iframe = document.createElement("iframe");
    iframe.src = "http://localhost:8000/site-isolation/resources/cross-site-frame-with-same-site-child.html";
    document.getElementById("withframe").appendChild(iframe);
}
</script>
</body>
</html>
