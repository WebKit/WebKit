<!-- webkit-test-runner [ SiteIsolationEnabled=true RemoteSnapshottingEnabled=true UseGPUProcessForDOMRenderingEnabled=true ] -->
<!DOCTYPE html>
<html>
<head>
<style>
:root { view-transition-name: none; }
body { margin: 0; }
#captured { view-transition-name: captured; width: 150px; height: 100px; }
#captured.hidden > * { visibility: hidden; }
#captured > div { float: left; width: 50px; height: 50px; background-color: lime; }
iframe { display: block; clear: both; width: 150px; height: 50px; border: none; }

/* Luminance masks are made by reading back the pixels drawn into an image buffer. A capture that paints a cross-site
   iframe is recorded, so the image buffers made while recording it have to hold pixels.
   Black masks everything out as a luminance mask, and nothing as an alpha mask. */
.mask { mask-mode: luminance; mask-size: 10px 10px; }
.gradient { mask-image: linear-gradient(black, black); }
.image { mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><rect width='10' height='10' fill='black'/></svg>"); }

/* Hold the transition, showing only the old capture. */
::view-transition-group(*) { animation-duration: 300s; }
::view-transition-old(*) { animation: unset; opacity: 1; }
::view-transition-new(*) { animation: unset; opacity: 0; }
</style>
</head>
<body>
<div id="captured"><div class="mask gradient"></div><div class="mask image"></div><div></div><iframe src="http://localhost:8000/site-isolation/resources/luminance-masked-squares.html"></iframe></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

onmessage = (event) => {
    if (event.data != "onload")
        return;

    // Only the old capture can show the squares once they are hidden.
    const transition = document.startViewTransition(() => {
        document.getElementById("captured").classList.add("hidden");
    });
    transition.ready.then(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => testRunner.notifyDone()));
    }, () => {
        document.body.style.backgroundColor = "red";
        testRunner.notifyDone();
    });
};
</script>
</body>
</html>
