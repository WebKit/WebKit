<!DOCTYPE html> <!-- webkit-test-runner [ pageTopColorSamplingEnabled=true ContentInsetBackgroundFillEnabled=true TopContentInsetBackgroundCanChangeAfterScrolling=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A header goes fixed, static, then fixed again; only the frame's own answer can complete the color. -->
<link rel="stylesheet" href="resources/edge-sampling.css">
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<script src="resources/edge-sampling.js"></script>
</head>
<body>
<div class="edge top" id="header">
<div class="half" style="left: 0; background-color: rgb(255, 120, 0)"></div>
<div class="half" style="right: 0"><iframe data-src="http://localhost:8000/site-isolation/resources/solid-color.html?color=ff7800"></iframe></div>
</div>
<div class="tall"></div>
<script>
const EXPECTED = { top: "rgb(255, 120, 0)" };

addEventListener("load", async () => {
    await prepareEdgeSampling();

    // fixed -> static -> fixed: the header becomes a fixed container a second time and must be sampled again.
    document.getElementById("header").style.position = "static";
    await UIHelper.ensurePresentationUpdate();
    document.getElementById("header").style.position = "fixed";

    color = await settledEdges(EXPECTED);
    assertEdges(EXPECTED);
    finishJSTest();
});
</script>
</body>
</html>
