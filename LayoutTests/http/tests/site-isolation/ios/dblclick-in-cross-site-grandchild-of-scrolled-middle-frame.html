<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<script>
description("Double-tapping a small dblclick target near the top of a cross-site grandchild frame, whose parent is itself a cross-site frame that is SCROLLED, must fire dblclick. Regression test for the coordinate bug where the middle frame's scroll offset was applied twice when forwarding a point into the grandchild, which made the 'should begin' decision look at the wrong point and never start the gesture.");
jsTestIsAsync = true;

const middleFrameTopInDocument = 100;
const middleFrameScroll = 120;
const grandchildTopInMiddleDocument = 200;
const grandchildTopInMiddleView = grandchildTopInMiddleDocument - middleFrameScroll;
const tapXInDocument = 30;
const tapYInDocument = middleFrameTopInDocument + grandchildTopInMiddleView + 30;

let middleScrollMessage = "";
let grandchildReady = false;
let started = false;
let receivedClientY;

addEventListener("message", (event) => {
    if (event.data === "ready")
        grandchildReady = true;
    else if (typeof event.data === "string" && event.data.startsWith("middle scrolled to "))
        middleScrollMessage = event.data;
    else if (event.data && event.data.type === "dblclick")
        receivedClientY = event.data.clientY;

    if (grandchildReady && middleScrollMessage && !started) {
        started = true;
        runTest();
    }
});

async function runTest() {
    await UIHelper.ensurePresentationUpdate();

    shouldBeEqualToString("middleScrollMessage", "middle scrolled to " + middleFrameScroll);

    for (let attempt = 0; attempt < 20 && receivedClientY === undefined; ++attempt) {
        await UIHelper.humanSpeedDoubleTapAt(tapXInDocument, tapYInDocument);
        await UIHelper.waitForDoubleTapDelay();
        for (let frame = 0; frame < 10 && receivedClientY === undefined; ++frame)
            await UIHelper.animationFrame();
    }
    shouldBe("receivedClientY", "30");
    finishJSTest();
}
</script>
