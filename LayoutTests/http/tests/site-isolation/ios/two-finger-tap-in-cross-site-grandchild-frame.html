<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<script>
description("A two-finger tap inside a cross-site grandchild frame, whose parent is a cross-site frame, should send the grandchild a click with metaKey set, at the tapped point in the grandchild's coordinates.");
jsTestIsAsync = true;

let receivedClick = null;

function twoFingerTapAt(x, y)
{
    return new Promise(resolve => {
        testRunner.runUIScript(`uiController.twoFingerSingleTapAtPoint(${x}, ${y}, () => uiController.uiScriptComplete())`, resolve);
    });
}

addEventListener("message", async (event) => {
    if (event.data.type === "click") {
        receivedClick = event.data;
        shouldBeTrue("receivedClick.metaKey");
        shouldBe("receivedClick.clientX", "150");
        shouldBe("receivedClick.clientY", "100");
        finishJSTest();
        return;
    }
    if (event.data.type !== "ready")
        return;

    await UIHelper.ensurePresentationUpdate();
    await twoFingerTapAt(200, 250);
});
</script>
<body style="margin: 0;">
<!-- The middle frame is at (0, 100), and the grandchild is at (50, 50) inside it, back on this page's site. A tap at
     (200, 250) goes to the middle frame's process at (200, 150), then back to this page's process at (150, 100). -->
<iframe style="position: absolute; left: 0; top: 100px; width: 400px; height: 400px; border: none;" src="http://localhost:8000/site-isolation/resources/two-finger-tap-middle-frame.html"></iframe>
</body>
