<!DOCTYPE html><!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<html>
<head>
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
</head>
<body style="margin: 0">
<div id="scroller" style="position: absolute; left: 10px; top: 50px; width: 280px; height: 300px; overflow: scroll;">
    <div style="height: 1500px">
        <iframe id="frame" style="position: absolute; left: 10px; top: 200px; width: 240px; height: 100px; border: none;" src="http://localhost:8000/site-isolation/resources/text-input.html" onload="runTest()"></iframe>
    </div>
</div>
<script>
description("The caret in a text field in a cross-origin iframe follows the iframe when the overflow scroller that contains the iframe scrolls.");
jsTestIsAsync = true;

async function waitUntil(condition, maxAttempts = 100)
{
    for (let attempt = 0; attempt < maxAttempts; ++attempt) {
        if (await condition())
            return true;
        await UIHelper.ensurePresentationUpdate();
    }
    return false;
}

// The UI caret is in document coordinates, while the iframe's rect is in viewport coordinates.
async function caretIsInsideFrame()
{
    const caret = await UIHelper.getUICaretViewRect();
    if (!caret || !caret.width)
        return false;
    const caretInViewport = { left: caret.left - pageXOffset, top: caret.top - pageYOffset, width: caret.width, height: caret.height };
    return UIHelper.rectContainsOtherRect(document.getElementById("frame").getBoundingClientRect(), caretInViewport);
}

async function runTest()
{
    const frameRect = document.getElementById("frame").getBoundingClientRect();
    await UIHelper.activateAndWaitForInputSessionAt(frameRect.left + 50, frameRect.top + 15);

    window.caretIsInsideFrameBeforeScrolling = await waitUntil(caretIsInsideFrame);
    shouldBeTrue("caretIsInsideFrameBeforeScrolling");

    // Scroll the container by dragging on a part of it that doesn't have the iframe.
    const scrollerRect = document.getElementById("scroller").getBoundingClientRect();
    const dragX = scrollerRect.right - 15;
    await UIHelper.dragFromPointToPoint(dragX, scrollerRect.top + 250, dragX, scrollerRect.top + 100, 0.5);

    window.scrolledContainer = await waitUntil(() => document.getElementById("scroller").scrollTop > 0);
    shouldBeTrue("scrolledContainer");

    // The iframe moved within the page along with the scroll, and so should its caret.
    window.caretIsInsideFrameAfterScrolling = await waitUntil(caretIsInsideFrame);
    shouldBeTrue("caretIsInsideFrameAfterScrolling");

    finishJSTest();
}
</script>
</body>
</html>
