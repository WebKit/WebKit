<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<html>
<body>
<script>
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

const frame = document.createElement("iframe");

onmessage = function (event) {
    if (event.data == "ready") {
        // This load commits in this process before the frame's previous process calls document.open().
        frame.src = "resources/pushstate-after-delay.html";
        return;
    }
    document.write(event.data);
    if (window.testRunner)
        testRunner.notifyDone();
};

onload = function () {
    frame.src = "http://localhost:8000/site-isolation/resources/explicit-open-while-busy.html";
    document.body.appendChild(frame);
};
</script>
</body>
</html>
