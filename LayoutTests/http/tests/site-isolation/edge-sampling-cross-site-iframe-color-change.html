<!DOCTYPE html> <!-- webkit-test-runner [ SiteIsolationEnabled=true pageTopColorSamplingEnabled=true ContentInsetBackgroundFillEnabled=true TopContentInsetBackgroundCanChangeAfterScrolling=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The frame changes color after its edge has a color. The edge keeps the first color, as it does with site isolation off. -->
<link rel="stylesheet" href="resources/edge-sampling.css">
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<script src="resources/edge-sampling.js"></script>
</head>
<body>
<div class="edge top"><iframe id="frame" data-src="http://localhost:8000/site-isolation/resources/recolor-frame.html"></iframe></div>
<div class="tall"></div>
<script>
async function runTest()
{
    await prepareEdgeSampling();
    await settledEdges({ top: "rgb(255, 120, 0)" });

    await messageEdgeSamplingFrame(document.getElementById("frame"), "recolor");
    await UIHelper.ensurePresentationUpdate();

    edgeSamplingColors = await UIHelper.fixedContainerEdgeColors();
    assertEdges({ top: "rgb(255, 120, 0)" });
    finishJSTest();
}

runTest();
</script>
</body>
</html>
