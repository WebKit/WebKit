<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<head>
<meta name="fuzzy" content="maxDifference=0-26; totalPixels=0-150" />
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

function done() {
    eventSender.textZoomIn();
    let frame = document.createElement("iframe");
    frame.frameBorder = 0;
    frame.onload = () => testRunner.notifyDone();
    frame.src = "http://localhost:8000/site-isolation/resources/text.html";
    document.body.appendChild(frame);
}
</script>
</head>
<iframe onload="done()" src="http://localhost:8000/site-isolation/resources/text.html" frameborder=0></iframe>
