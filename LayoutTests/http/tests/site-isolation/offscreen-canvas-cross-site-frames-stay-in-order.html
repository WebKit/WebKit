<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<html class="reftest-wait">
<style>
canvas { display: block; }
iframe { width: 0; height: 0; border: 0; }
</style>
<body>
<canvas id="canvas" width="100" height="100"></canvas>
<iframe src="http://localhost:8000/site-isolation/resources/offscreen-canvas-draw-and-ack.html" id="frame"></iframe>
<script>
// Frames committed from a cross-site iframe reach the layer both directly from the UI process and in
// the placeholder process's rendering updates. The last frame committed must be the one displayed.
function placeholderPixel()
{
    const copy = document.createElement("canvas");
    copy.width = 100;
    copy.height = 100;
    const context = copy.getContext("2d");
    context.drawImage(canvas, 0, 0);
    return Array.from(context.getImageData(50, 50, 1, 1).data).join();
}

function finish()
{
    document.documentElement.classList.remove("reftest-wait");
}

addEventListener("message", (event) => {
    if (!event.data)
        return;

    if (event.data.type == "child-ack") {
        const colors = [];
        for (let i = 0; i < 30; ++i)
            colors.push(i % 2 ? "blue" : "red");
        colors.push("green");
        frame.contentWindow.postMessage({ type: "draw-sequence", colors }, "*");
        return;
    }

    if (event.data.type == "sequence-done") {
        let attempts = 0;
        (function poll() {
            if (placeholderPixel() == "0,128,0,255" || ++attempts > 120) {
                requestAnimationFrame(() => requestAnimationFrame(finish));
                return;
            }
            requestAnimationFrame(poll);
        })();
    }
});

frame.addEventListener("load", () => {
    const offscreen = canvas.transferControlToOffscreen();
    frame.contentWindow.postMessage({ type: "offscreen-canvas", canvas: offscreen }, "*", [offscreen]);
});
</script>
</body>
</html>
