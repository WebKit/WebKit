<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<html>
<body>
<script src="/js-test-resources/js-test.js"></script>
<script>
description("Tests that a sandbox attribute change applies when a cross-site iframe navigates itself.");

var jsTestIsAsync = true;
var reportedOrigin;

addEventListener("message", (event) => {
    if (event.data == "loaded") {
        const frame = document.getElementById("testFrame");
        frame.sandbox = "allow-scripts";
        frame.contentWindow.postMessage("navigate", "*");
        return;
    }

    reportedOrigin = event.data;
    shouldBeEqualToString("reportedOrigin", "null");
    finishJSTest();
});
</script>
<iframe id="testFrame" src="http://localhost:8000/site-isolation/resources/navigate-self-on-message.html"></iframe>
</body>
</html>
