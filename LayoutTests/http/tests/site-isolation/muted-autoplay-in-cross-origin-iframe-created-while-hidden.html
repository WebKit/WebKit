<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->

<!DOCTYPE html>
<html>
<body>
<script src="/js-test-resources/js-test.js"></script>
<script>
description("Tests that a muted video in an out-of-process subframe may autoplay once the page becomes visible, for a frame whose view was created while the page was hidden");

var jsTestIsAsync = true;
var videoDidPlay = "";
var testFrame;

// The subframe is cross-origin, so its video element cannot be reached directly.
window.addEventListener("message", function(event) {
    videoDidPlay = event.data;
}, false);

function runTest()
{
    // Wait for the main frame to observe the change, so that the process of the subframe is created
    // after the page is already hidden.
    document.addEventListener("visibilitychange", pageDidHide);
    testRunner.setPageVisibility("hidden");
}

function pageDidHide()
{
    document.removeEventListener("visibilitychange", pageDidHide);

    // A view learns the visibility of the page at the moment it is created, so the view of this local
    // root starts out hidden, and reports isOffscreen() until it receives show().
    debug("The page is hidden, so create the subframe now.");
    testFrame = document.createElement("iframe");
    testFrame.src = "http://localhost:8000/site-isolation/resources/muted-autoplay-frame.html";
    testFrame.onload = frameDidLoad;
    document.body.appendChild(testFrame);
}

function frameDidLoad()
{
    // Show the page before the video is given a source, so that the autoplay decision is made while the
    // page is visible. A view that never received show() still refuses autoplay at that point.
    debug("Showing the page, then starting the muted autoplay.");
    testRunner.resetPageVisibility();
    testFrame.contentWindow.postMessage("start-autoplay", "*");

    // Ask repeatedly: the video loads and starts in the process of the subframe asynchronously.
    setInterval(function() {
        testFrame.contentWindow.postMessage("report-did-play", "*");
    }, 50);

    shouldBecomeEqualToString("videoDidPlay", "true", finishJSTest);
}

runTest();
</script>
</body>
</html>
