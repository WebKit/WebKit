<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>

<html>
<head>
  <style type="text/css" media="screen">
    iframe {
        margin: 20px;
        height: 200px;
        width: 200px;
        border: 1px solid black;
    }
  </style>
  <script src="/js-test-resources/js-test.js"></script>
  <script src="/js-test-resources/ui-helper.js"></script>
  <script type="text/javascript" charset="utf-8">
    description("Tests that changing the 'scrolling' attribute of a cross-origin iframe updates the scrollbar modes of the iframe's frame scrolling node.");
    jsTestIsAsync = true;

    const scrollbarModeNames = ["Auto", "AlwaysOff", "AlwaysOn"];

    async function subframeScrollbarModes()
    {
        const tree = await UIHelper.getScrollingTree();
        const subframeTree = tree.slice(tree.indexOf("(frame hosting node"));
        const horizontal = subframeTree.match(/\(horizontal scrollbar mode (\d)\)/);
        const vertical = subframeTree.match(/\(vertical scrollbar mode (\d)\)/);
        if (!horizontal || !vertical)
            return "not found";
        return `horizontal ${scrollbarModeNames[horizontal[1]]}, vertical ${scrollbarModeNames[vertical[1]]}`;
    }

    var modesBefore;
    var modesAfter;

    async function doTest()
    {
      await UIHelper.renderingUpdate();
      modesBefore = await subframeScrollbarModes();

      document.getElementById('iframe').setAttribute('scrolling', 'yes');

      await UIHelper.waitForConditionAsync(async () => {
          modesAfter = await subframeScrollbarModes();
          return modesAfter != modesBefore;
      }, 100);

      shouldBeEqualToString("modesBefore", "horizontal AlwaysOff, vertical AlwaysOff");
      shouldBeEqualToString("modesAfter", "horizontal Auto, vertical Auto");
      finishJSTest();
    }

    window.addEventListener('load', doTest, false);
  </script>
</head>
<body>
    <iframe id="iframe" scrolling="no" src="http://localhost:8000/root/compositing/iframes/resources/red-green-subframe.html"></iframe>
</body>
</html>
