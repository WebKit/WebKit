<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="/js-test-resources/js-test.js"></script>
<body>
<iframe src="http://localhost:8000/site-isolation/resources/image-bitmap-draw-and-ack.html" id="frame"></iframe>
<script>
description("An ImageBitmap transferred to a cross-site iframe should arrive with its pixels intact.");
jsTestIsAsync = true;

addEventListener("message", (event) => {
    if (!event.data || event.data.type != "child-ack")
        return;
    result = event.data.result;
    shouldBeEqualToString("result", "40x20 pixel 0,0,255,255");
    finishJSTest();
});

frame.addEventListener("load", async () => {
    const source = document.createElement("canvas");
    source.width = 40;
    source.height = 20;
    const context = source.getContext("2d");
    context.fillStyle = "blue";
    context.fillRect(0, 0, source.width, source.height);

    const bitmap = await createImageBitmap(source);
    frame.contentWindow.postMessage({ type: "image-bitmap", bitmap }, "*", [bitmap]);
    if (!bitmap.width && !bitmap.height)
        debug("source ImageBitmap was detached by the transfer, as expected");

    setTimeout(() => {
        testFailed("the cross-site iframe never acknowledged the ImageBitmap");
        finishJSTest();
    }, 5000);
});
</script>
</body>
