<!-- webkit-test-runner [ SiteIsolationEnabled=true RemoteSnapshottingEnabled=true UseGPUProcessForDOMRenderingEnabled=true ] -->
<script src="/js-test-resources/js-test.js"></script>
<style>
#withframe { view-transition-name: withframe; }
iframe { width: 100px; height: 100px; border: none; }
</style>
<body>
<div id="withframe"><iframe src="http://localhost:8000/site-isolation/resources/green-background.html"></iframe></div>
<script>
description("The update callback of a view transition is only called once the old state is captured, including a cross-site iframe recorded out of process, so removing the iframe in the callback does not leave a hole in the old capture.");
jsTestIsAsync = true;

let stateInUpdateCallback = null;
let stateWhenReady = null;

onmessage = (event) => {
    if (event.data != "onload")
        return;

    const transition = document.startViewTransition(() => {
        stateInUpdateCallback = internals.viewTransitionOldCaptureState(document, "withframe");
        document.querySelector("iframe").remove();
    });

    transition.ready.then(() => {
        // The captures are dropped once the transition finishes.
        stateWhenReady = internals.viewTransitionOldCaptureState(document, "withframe");
        transition.skipTransition();
    }, (error) => {
        testFailed("the transition was skipped: " + error);
        finishJSTest();
    });

    transition.finished.then(() => {
        shouldBeEqualToString("stateInUpdateCallback", "remote");
        shouldBeEqualToString("stateWhenReady", "remote");
        finishJSTest();
    });
};
</script>
</body>
