<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<script src="/js-test-resources/js-test.js"></script>
<script src="/js-test-resources/ui-helper.js"></script>
<style>
iframe { width: 300px; height: 300px; border: none; }
</style>
<script>
description("Verifies that a magnify gesture over a cross-origin iframe is delivered at coordinates translated into that iframe's coordinate space.");
jsTestIsAsync = true;

addEventListener("message", (event) => {
    shouldBe("event.data", "'target,40,50'");
    finishJSTest();
});

async function onLoad() {
    const rect = document.querySelector("iframe").getBoundingClientRect();
    await UIHelper.moveMouseAndWaitForFrame(Math.round(rect.left) + 40, Math.round(rect.top) + 50);
    eventSender.scaleGestureStart(1.0);
    eventSender.scaleGestureChange(1.5);
    eventSender.scaleGestureEnd(1.5);
}
</script>
<iframe onload="onLoad()" src="http://localhost:8000/site-isolation/resources/post-message-gesture-coordinates.html"></iframe>
