<!-- webkit-test-runner [ SiteIsolationEnabled=true applicationManifest=resources/standalone.manifest ] -->
<!doctype html>
<title>display-mode application value in iframes with site isolation</title>
<body>
    <script src="/applicationmanifest/resources/display-mode-application-frames.js"></script>
    <script>
        if (window.testRunner) {
            testRunner.dumpAsText();
            testRunner.waitUntilDone();
        }

        async function run() {
            try {
                log(
                    `Top level: application=${matchMedia("(display-mode: application)").matches} standalone=${matchMedia("(display-mode: standalone)").matches}`,
                );
                await logIframeReport("Same-origin iframe", sameOriginURL);
                await logIframeReport("Cross-origin iframe", crossOriginURL);
                await logIframeReport(
                    "Same-origin grandchild under a cross-origin iframe",
                    nestedEmbedderURL,
                );
            } catch (error) {
                log(`ERROR: ${error.message}`);
            } finally {
                if (window.testRunner) testRunner.notifyDone();
            }
        }

        run();
    </script>
</body>
