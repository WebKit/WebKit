<!-- webkit-test-runner [ IPCTestingAPIEnabled=true SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body style="margin: 0">
<iframe style="position: absolute; left: 0; top: 1000px; width: 100px; height: 100px; border: none"
    src="http://localhost:8000/site-isolation/resources/frame-with-text.html"></iframe>
<div style="height: 3000px"></div>
<script>

let broadcastCount = 0;

if (window.IPC) {
    IPC.addOutgoingMessageListener("UI", message => {
        if (message.description === "WebPageProxy_BroadcastFrameTreeSyncData")
            broadcastCount++;
    });
}

async function settle()
{
    for (let i = 0; i < 3; i++)
        await new Promise(resolve => requestAnimationFrame(resolve));
    await new Promise(resolve => setTimeout(resolve, 0));
}

// Adding a frame keeps broadcasting geometry for a few rendering updates as the layout and frame
// rects propagate. Wait for that to stop.
async function settleUntilQuiescent()
{
    for (let i = 0; i < 20; i++) {
        await settle();
        broadcastCount = 0;
        await settle();
        if (!broadcastCount)
            return;
    }
    assert_unreached("frame geometry never stopped being broadcast");
}

async function countBroadcastsFor(action)
{
    await settleUntilQuiescent();
    broadcastCount = 0;
    action();
    await settle();
    return broadcastCount;
}

promise_test(async t => {
    // IPC interception only works in debug builds.
    if (!window.IPC)
        return;

    await new Promise(resolve => window.addEventListener("load", resolve));
    t.add_cleanup(() => window.scrollTo(0, 0));

    // We expect one FrameViewportInfo message to be sent, as this contains the scroll position. No
    // FrameGeometry messages should be sent, since the iframe is out of the viewport.
    assert_equals(await countBroadcastsFor(() => window.scrollTo(0, 100)), 1,
        "a scroll that leaves FrameGeometry alone should only broadcast FrameViewportInfo");

    // All the scroll position changes should coalesce in to one rendering update step that sends
    // the last scroll position in one FrameViewportInfo message. No FrameGeometry messages should
    // be sent, since the iframe is out of the viewport.
    assert_equals(await countBroadcastsFor(() => {
        window.scrollTo(0, 200);
        window.scrollTo(0, 300);
        window.scrollTo(0, 400);
    }), 1, "several scrolls within one event loop tick should be coalesced into one FrameViewportInfo update");

    // This scroll should send both a FrameViewportInfo and FrameGeometry message, since the iframe
    // is now in the viewport.
    assert_equals(await countBroadcastsFor(() => window.scrollTo(0, 950)), 2,
        "a scroll that brings an iframe into the viewport should broadcast both FrameViewportInfo and FrameGeometry");

    assert_equals(await countBroadcastsFor(() => { }), 0,
        "an idle rendering update should broadcast nothing");
}, "Scrolling broadcasts the viewport info once per rendering update and leaves the geometry alone");

</script>
