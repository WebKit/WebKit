<!-- webkit-test-runner [ IPCTestingAPIEnabled=true SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body style="margin: 0">
<iframe style="width: 100px; height: 100px;" src="http://localhost:8000/site-isolation/resources/frame-with-text.html"></iframe>
<div id="spacer" style="height: 3000px"></div>
<script>

let broadcastCount = 0;

if (window.IPC) {
    IPC.addOutgoingMessageListener("UI", message => {
        if (message.description === "WebPageProxy_BroadcastFrameTreeSyncData")
            broadcastCount++;
    });
}

async function settle()
{
    for (let i = 0; i < 3; i++)
        await new Promise(resolve => requestAnimationFrame(resolve));
    await new Promise(resolve => setTimeout(resolve, 0));
}

async function countBroadcastsFor(action)
{
    await settle();
    broadcastCount = 0;
    action();
    await settle();
    return broadcastCount;
}

promise_test(async t => {
    // IPC interception only works in debug builds.
    if (!window.IPC)
        return;

    await new Promise(resolve => window.addEventListener("load", resolve));

    assert_equals(await countBroadcastsFor(() => { }), 0,
        "a rendering update that changes nothing must not rebroadcast the frame geometry");

    assert_equals(await countBroadcastsFor(() => spacer.style.height = "3100px"), 1,
        "changing the geometry must broadcast it exactly once");

    assert_equals(await countBroadcastsFor(() => { }), 0,
        "the rendering updates after a geometry change must not rebroadcast the same geometry");

    assert_equals(await countBroadcastsFor(() => spacer.style.height = "3100px"), 0,
        "re-applying a style that leaves the geometry alone must not broadcast it");
}, "Frame geometry is only broadcast when it has changed");
</script>
