<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->

<!DOCTYPE html>
<html>
<body>
<script src="/js-test-resources/js-test.js"></script>
<script>
description("Tests that posting a message to a cross-origin iframe in another process while the main frame is processing a user gesture does not give the iframe user activation.");

var jsTestIsAsync = true;
var iframeBeforeGesture;
var iframeAfterGesture;
var testFrame;

window.addEventListener("message", function(event) {
    if (event.data.type == "ready") {
        // The iframe has not seen a user gesture yet.
        testFrame.contentWindow.postMessage("before-gesture", "*");
    } else if (event.data.type == "before-gesture") {
        iframeBeforeGesture = event.data;
        // Only the main frame is processing a user gesture. The iframe is cross-origin and gets nothing but a message.
        internals.withUserGesture(function() {
            testFrame.contentWindow.postMessage("after-gesture", "*");
        });
    } else if (event.data.type == "after-gesture") {
        iframeAfterGesture = event.data;
        checkResults();
    }
}, false);

function checkResults()
{
    debug("The main frame handled a user gesture:");
    shouldBeTrue("navigator.userActivation.isActive");
    debug("");
    debug("The iframe before the main frame posted a message during its user gesture:");
    shouldBeFalse("iframeBeforeGesture.isActive");
    shouldBeFalse("iframeBeforeGesture.hasBeenActive");
    debug("");
    debug("The iframe after the main frame posted a message during its user gesture:");
    shouldBeFalse("iframeAfterGesture.isActive");
    shouldBeFalse("iframeAfterGesture.hasBeenActive");
    finishJSTest();
}

testFrame = document.createElement("iframe");
testFrame.src = "http://localhost:8000/site-isolation/resources/report-user-activation.html";
document.body.appendChild(testFrame);
</script>
</body>
</html>
