<!-- webkit-test-runner [ SiteIsolationEnabled=true ] -->
<!DOCTYPE html>
<body style="margin: 0">
<iframe id="frame" style="position: absolute; left: 0; top: 0; width: 200px; height: 200px; border: none"
    src="http://localhost:8000/site-isolation/resources/100x100-blue-box-green-background.html"></iframe>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

async function settle()
{
    for (let i = 0; i < 3; i++)
        await new Promise(resolve => requestAnimationFrame(resolve));
    await new Promise(resolve => setTimeout(resolve, 0));
}

window.addEventListener("message", async event => {
    if (event.data !== "onload")
        return;
    await settle();

    // Check that the iframe renders at the new position if we only move it without a resize.
    const frame = document.getElementById("frame");
    for (let i = 1; i <= 5; ++i) {
        frame.style.left = `${i * 20}px`;
        frame.style.top = `${i * 10}px`;
        await settle();
    }

    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
