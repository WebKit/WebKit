<!DOCTYPE html> <!-- webkit-test-runner [ useFlexibleViewport=true ] -->
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=overlays-content"/>
    <style>
        input {
            width: 400px;
            height: 50px;
        }
    </style>
    <script src="/js-test-resources/js-test.js"></script>
    <script src="/js-test-resources/ui-helper.js"></script>
</head>
<body>
    <input id="input" type="text">
    <script>
        jsTestIsAsync = true;
        addEventListener("load", async () => {
            let textField = document.querySelector("input");

            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();
            let initialLayoutViewportHeight = internals.layoutViewportRect().height;
            let initialVisualViewportHeight = internals.visualViewportRect().height;

            await UIHelper.activateElement(textField);
            await UIHelper.waitForKeyboardToShow();
            await UIHelper.ensureVisibleContentRectAndStablePresentationUpdate();
            let keyboardUpLayoutViewportHeight = internals.layoutViewportRect().height;
            let keyboardUpVisualViewportHeight = internals.visualViewportRect().height;

            // Navigate while the keyboard is still up and still overlaying the content.
            window.location.href = "http://localhost:8000/visual-viewport/ios/interactive-widget/resources/no-interactive-widget-after-overlays-content.html"
                + "?previousProcessIdentifier=" + internals.processIdentifier
                + "&initialLayoutViewportHeight=" + initialLayoutViewportHeight
                + "&initialVisualViewportHeight=" + initialVisualViewportHeight
                + "&keyboardUpLayoutViewportHeight=" + keyboardUpLayoutViewportHeight
                + "&keyboardUpVisualViewportHeight=" + keyboardUpVisualViewportHeight;
        });
    </script>
</body>

</html>
