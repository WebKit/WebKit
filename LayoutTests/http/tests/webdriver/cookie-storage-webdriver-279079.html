<!DOCTYPE html>
<html>
<head>
    <title>WebDriver Cookie Storage Test - Bug 279079</title>
    <script src="../../../resources/js-test-pre.js"></script>
</head>
<body>
    <div id="test-container">
        <h1>WebDriver Cookie Storage Test</h1>
        <p>This test verifies that WebDriver cookies are properly stored and trigger the 'changed' signal.</p>
    </div>

    <script>
        description("Test WebDriver cookie storage functionality (Bug 279079)");

        // Clear any existing cookies
        document.cookie.split(";").forEach(function(c) { 
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        });

        // Debug: Check what domain we're on
        debug("Current domain: " + window.location.hostname);
        debug("Current URL: " + window.location.href);

        // Test 1: Basic cookie storage
        debug("Basic WebDriver cookie storage");
        const testCookie = {
            name: "webdriver_test",
            value: "test_value",
            domain: window.location.hostname,
            path: "/",
            secure: false,
            httpOnly: false,
            sameSite: "Lax"
        };
        
        // This would be called by WebDriver
        // In a real scenario, this would go through the WebDriver API
        document.cookie = `${testCookie.name}=${testCookie.value}; path=${testCookie.path}`;
        
        // Verify the cookie was set
        shouldBe("document.cookie.includes('webdriver_test=test_value')", "true");

        // Test 2: Multiple cookies
        debug("Multiple WebDriver cookies");
        const cookies = [
            { name: "webdriver_cookie1", value: "value1" },
            { name: "webdriver_cookie2", value: "value2" },
            { name: "webdriver_cookie3", value: "value3" }
        ];
        
        cookies.forEach(cookie => {
            document.cookie = `${cookie.name}=${cookie.value}; path=/`;
        });
        
        // Verify all cookies were set
        shouldBe("document.cookie.includes('webdriver_cookie1=value1')", "true");
        shouldBe("document.cookie.includes('webdriver_cookie2=value2')", "true");
        shouldBe("document.cookie.includes('webdriver_cookie3=value3')", "true");

        // Test 3: Cookie with different attributes
        debug("WebDriver cookies with various attributes");
        // Test cookie with expiration (secure cookies won't work on HTTP)
        const futureDate = new Date();
        futureDate.setDate(futureDate.getDate() + 1);
        document.cookie = `expiring_cookie=expiring_value; path=/; expires=${futureDate.toUTCString()}`;
        
        // Verify the cookies we can check
        shouldBe("document.cookie.includes('expiring_cookie=expiring_value')", "true");

        // Test 4: Cookie change detection
        debug("Cookie change detection");
        // Set a cookie that should trigger the change event
        document.cookie = "change_test=initial_value; path=/";
        
        // Update the cookie
        document.cookie = "change_test=updated_value; path=/";
        
        // Verify the cookie was updated
        shouldBe("document.cookie.includes('change_test=updated_value')", "true");

        // Test 5: Cookie deletion
        debug("WebDriver cookie deletion");
        // Set a cookie to delete
        document.cookie = "delete_test=delete_value; path=/";
        shouldBe("document.cookie.includes('delete_test=delete_value')", "true");
        
        // Delete the cookie
        document.cookie = "delete_test=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
        shouldBe("document.cookie.includes('delete_test=')", "false");

        // Test 6: Cross-domain cookie handling
        debug("Cross-domain cookie handling");
        // Test setting a cookie for a subdomain
        document.cookie = "subdomain_cookie=subdomain_value; path=/";
        
        // This should work in the test environment
        shouldBe("document.cookie.includes('subdomain_cookie=subdomain_value')", "true");

        // Test 7: SameSite attribute handling
        debug("SameSite attribute handling");
        // Test Strict SameSite
        document.cookie = "samesite_strict=strict_value; path=/; samesite=strict";
        
        // Test Lax SameSite
        document.cookie = "samesite_lax=lax_value; path=/; samesite=lax";
        
        // Test None SameSite (requires secure context, so skip in HTTP)
        // document.cookie = "samesite_none=none_value; path=/; samesite=none; secure";
        
        // Verify the cookies were set
        shouldBe("document.cookie.includes('samesite_strict=strict_value')", "true");
        shouldBe("document.cookie.includes('samesite_lax=lax_value')", "true");
        // shouldBe("document.cookie.includes('samesite_none=none_value')", "true");

        // Test 8: Stress test - multiple rapid cookie operations
        debug("Stress test - multiple rapid cookie operations");
        const cookieCount = 10;
        
        // Set multiple cookies rapidly
        for (let i = 0; i < cookieCount; i++) {
            document.cookie = `stress_cookie_${i}=stress_value_${i}; path=/`;
        }
        
        // Verify all cookies were set
        for (let i = 0; i < cookieCount; i++) {
            shouldBe(`document.cookie.includes('stress_cookie_${i}=stress_value_${i}')`, "true");
        }
        
        // Clean up
        for (let i = 0; i < cookieCount; i++) {
            document.cookie = `stress_cookie_${i}=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT`;
        }

        // Test 9: Verify cookie persistence
        debug("Cookie persistence verification");
        // Set a persistent cookie
        const futureDate2 = new Date();
        futureDate2.setFullYear(futureDate2.getFullYear() + 1);
        document.cookie = `persistent_cookie=persistent_value; path=/; expires=${futureDate2.toUTCString()}`;
        
        // Verify it was set
        shouldBe("document.cookie.includes('persistent_cookie=persistent_value')", "true");
        
        // Clean up
        document.cookie = "persistent_cookie=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";

        // Test 10: Final verification
        debug("Final verification - all WebDriver cookie functionality works");
        // Set one final test cookie
        document.cookie = "final_test=final_value; path=/";
        
        // Verify it works
        shouldBe("document.cookie.includes('final_test=final_value')", "true");
        
        // Clean up
        document.cookie = "final_test=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
        
        // Final success message
        shouldBe("true", "true");
    </script>

    <script src="../../../resources/js-test-post.js"></script>
</body>
</html>
