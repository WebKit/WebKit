<!DOCTYPE html>
<html>
<title>image-set() selecting a gradient tiles the same as the gradient itself</title>
<style>
div {
    width: 100px;
    height: 100px;
    margin: 10px;
    background-size: 25px 40px;
    background-repeat: repeat;
    border: 1px solid black;
}
</style>
<body>
<div style="background-image: linear-gradient(green, white);"></div>
</body>
</html>
