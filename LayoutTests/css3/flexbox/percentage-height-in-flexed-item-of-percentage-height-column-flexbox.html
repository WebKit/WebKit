<!DOCTYPE html>

<title>CSS Flexbox: percentage height inside an aspect-ratio flexed item of a column flexbox with a percentage height</title>

<style>
.outer {
  display: flex;
  width: 400px;
}

.column {
  display: flex;
  flex-direction: column;
}

.flexed {
  flex: 1 1 0%;
  width: 400px;
}

.percentage {
  height: 100%;
  background-color: green;
}
</style>

<link rel="help" href="https://drafts.csswg.org/css-flexbox/#definite-sizes">

<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<script src="../../resources/check-layout-th.js"></script>

<body onload="checkLayout('.outer')">
<div id=log></div>

<p>Column flexbox with an unresolvable height: 100%. The flexed item is sized by aspect-ratio, and its specified height is overridden by the 0% flex-basis, so the percentage resolves against the flexed size:</p>
<div class="outer">
  <div class="column" style="height: 100%;">
    <div class="flexed" style="height: 300px; aspect-ratio: 16 / 9;" data-expected-height="225">
      <div class="percentage" data-expected-height="225"></div>
    </div>
  </div>
</div>
</body>
