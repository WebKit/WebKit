<!DOCTYPE html> <!-- webkit-test-runner [ CSSTextDecorationInsetEnabled=true ] -->
<meta charset="utf-8">
<title>CSS Text Decoration: text-decoration-inset: auto separates adjacent underlined CJK runs</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-auto-cjk-expected.html">
<meta name="assert" content="'text-decoration-inset: auto' insets each decorating box's endpoints by a UA-chosen amount so two adjacent underlined elements do not appear to share a single underline (the spec's CJK example, &lt;u&gt;石井&lt;/u&gt;&lt;u&gt;艾俐俐&lt;/u&gt;). WebKit's auto amount is font-size/8, so 'auto' must render identically to '0.125em'.">
<style>
    body { margin: 20px; background: white; }
    div { font: 60px/1.5 sans-serif; color: black; }
    u { text-decoration-line: underline; text-decoration-color: blue; text-underline-position: under; text-decoration-inset: auto; }
</style>
<p>The underlines for the two elements should be visibly separated by a gap:</p>
<div lang="zh"><u>石井</u><u>艾俐俐</u></div>
