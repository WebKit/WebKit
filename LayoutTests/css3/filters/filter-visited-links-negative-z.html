<!DOCTYPE html>
<style>
    .container {
        margin: 10px;
        width: 400px;
        height: 140px;
        padding: 10px;
        border: 1px solid black;
        font-size: 20pt;
        text-align: center;
    }
    h1 {
        font-size: 20pt;
    }
    .no-op-css-filter {
        filter: blur(0px);
    }
    .no-op-svg-filter {
        filter: url(#svg-no-op-blur);
    }
    .css-filter {
        filter: blur(2px);
    }
    .svg-filter {
        filter: url(#svg-blur);
    }
    a {
        color: white;
        text-decoration: none;
        background-color: green;
    }
    .negative-z {
        z-index: -1;

        /* important to reproduce besides the negative z-index */
        position: relative;
    }
    a:visited {
        background-color: red;
    }
</style>
<body>
    <div class="container">
        <h1>No-op filter</h1>
        <div class="no-op-css-filter">
            <div class="negative-z">
                <a href="">Visited link (no-op CSS filter)</a>
            </div>
        </div>
        <div class="no-op-svg-filter">
            <div class="negative-z">
                <a href="">Visited link (no-op SVG filter)</a>
            </div>
        </div>
    </div>
    <div class="container">
        <h1>Blur filter</h1>
        <div class="css-filter">
            <div class="negative-z">
                <a href="">Visited link (CSS filter)</a>
            </div>
        </div>
        <div class="svg-filter">
            <div class="negative-z">
                <a href="">Visited link (SVG filter)</a>
            </div>
        </div>
    </div>
    <svg style="position: absolute; top: -99999px">
        <filter id="svg-no-op-blur">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0"/>
        </filter>
        <filter id="svg-blur">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
        </filter>
    </svg>
</body>
