<!DOCTYPE HTML>
<html>
<head>
<script src="../resources/js-test.js"></script>
</head>
<body>
<input type="text" id="textinput" value="Hello World">
<script>
description("Ensure event timestamps are neither ahead of Performance::now() nor more than 1 minute in the past.")
window.jsTestIsAsync = true;
let keydownEvent;
new Promise( (resolve) => {
    let listener = (event) => {
        keydownEvent = event
        textinput.removeEventListener('keydown', listener)
        resolve()
    }
    textinput.addEventListener('keydown', listener)
    textinput.focus()
    eventSender.keyDown('a')
}).then( () => {
    dt = performance.now() - keydownEvent.timeStamp
    shouldBeGreaterThanOrEqual("dt", "0")
    shouldBeLessThanOrEqual("dt", "60000")
    finishJSTest();
})
</script>
</body>
</html>
