<!DOCTYPE html>
<style>
    .container {
        width: 240px;
        height: 240px;
        border: solid 1px black;
        position: relative;
    }
    .box {
        height: 100px;
        width: 100px;
        background-color: rgb(0 255 0 / 0.5);
        border: solid 10px rgb(0 0 255);
    }
    .right-bottom {
        position: absolute;
        bottom: 0;
        right: 0;
        background-color: rgb(255 0 0 / 0.5);
    }
</style>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="right-bottom box"></div>
    </div>
</body>
