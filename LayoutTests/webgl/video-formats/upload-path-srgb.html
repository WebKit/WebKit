<body>
<script>
"use strict";
description("texImage2D of a video into sRGB internal formats with the default, forced hardware and forced software paths: WebGL 2 SRGB8_ALPHA8 and SRGB8, and WebGL 1 SRGB_ALPHA_EXT and SRGB_EXT (EXT_sRGB). The sources are a video the hardware path uses directly (h264-420-bt709-videorange.mp4) and one it converts first (hevc-420-10bit-bt709-videorange.mp4). The stored bytes must be the frame's own R'G'B' values, as a texImage2D of the same pixels stores them (no further sRGB encoding). Renderable formats are read with readPixels; SRGB8 is sampled (decoded) and encoded again.");

UploadPathTest.run(() => UploadPathTest.runSrgbTest({
    videos: ["h264-420-bt709-videorange.mp4", "hevc-420-10bit-bt709-videorange.mp4"],
}));
</script>
</body>
