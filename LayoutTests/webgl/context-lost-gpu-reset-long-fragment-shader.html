<!DOCTYPE html><!-- webkit-test-runner [ runSingly=true ] -->
<html>
<head>
<meta charset="utf-8">
<title>WebGL context loss caused by a GPU reset from a long running fragment shader</title>
<script src="../resources/js-test.js"></script>
<script src="resources/webgl_test_files/js/webgl-test-utils.js"></script>
<script src="resources/context-lost-gpu-reset.js"></script>
</head>
<body>
<div id="description"></div>
<div id="console"></div>
<script>
"use strict";
description("Tests that a draw whose fragment shader runs for too long to complete causes the GPU to reset the work, and that the context reports this as a real context loss. The context is restored, and a context created after the reset works. Every context that shares the GPU state with the reset context is lost, too.");

// A triangle that covers the whole canvas.
var vertexShaderSource = `#version 300 es
void main() {
    vec2 position = vec2(float((gl_VertexID & 1) * 4 - 1), float((gl_VertexID & 2) * 2 - 1));
    gl_Position = vec4(position, 0.0, 1.0);
}`;

var fragmentShaderSource = `#version 300 es
precision highp float;
uniform int count;
uniform float seed;
out vec4 fragColor;
void main() {
    float value = seed + gl_FragCoord.x;
    ${longRunningLoopsSource}
    fragColor = vec4(value, 0.0, 0.0, 1.0);
}`;

runTest(vertexShaderSource, fragmentShaderSource, () => gl.drawArrays(gl.TRIANGLES, 0, 3));
</script>
</body>
</html>
