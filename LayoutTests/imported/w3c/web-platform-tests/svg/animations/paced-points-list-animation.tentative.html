<!DOCTYPE html>
<meta charset="utf-8">
<title>calcMode=paced on a point list spaces segments by distance</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/animations/#CalcModeAttribute">
<meta name="assert" content="Paced point list animation uses the Euclidean distance between lists, as Gecko does. Tentative: SVG Animations 2 does not currently define a distance function for list types.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="50">
    <polyline id="single" points="0,0 0,0" fill="none" stroke="black">
        <animate attributeName="points" calcMode="paced"
            values="0,0 0,0; 0,0 5,0; 0,0 100,0" begin="0s" dur="10s"/>
    </polyline>
    <polyline id="multiple" points="0,0 0,10" fill="none" stroke="black">
        <animate attributeName="points" calcMode="paced"
            values="0,0 0,10; 10,0 10,10; 20,0 10,10" begin="0s" dur="10s"/>
    </polyline>
</svg>

<script>
async_test(t => {
    window.onload = t.step_func(() => {
        const svg = document.querySelector("svg");
        svg.pauseAnimations();
        svg.setCurrentTime(5);
        requestAnimationFrame(t.step_func_done(() => {
            // Segment distances are 5 and 95, so the midpoint is at distance 50.
            assert_approx_equals(document.getElementById("single").getBBox().width, 50, 1, "single moving point");
            // Segment distances are sqrt(200) and 10. A sum of per-point
            // distances (20 and 10) would give x = 7.5 for both points instead.
            const multiple = document.getElementById("multiple").animatedPoints;
            assert_approx_equals(multiple.getItem(0).x, 8.54, 0.3, "first point");
            assert_approx_equals(multiple.getItem(1).x, 8.54, 0.3, "second point");
        }));
    });
}, "calcMode=paced on a point list spaces segments by distance, not uniformly");
</script>
