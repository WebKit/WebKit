<!DOCTYPE html>
<meta charset="utf-8">
<title>calcMode=paced on a length list spaces segments by distance</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/animations/#CalcModeAttribute">
<meta name="assert" content="Paced length list animation uses the Euclidean distance between lists, as Gecko does. Tentative: SVG Animations 2 does not currently define a distance function for list types.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="50">
    <text id="single" x="0 0" y="20"><animate attributeName="x" calcMode="paced"
        values="0 0; 0 10; 0 100" begin="0s" dur="10s"/></text>
    <text id="multiple" x="0 0" y="40"><animate attributeName="x" calcMode="paced"
        values="0 0; 10 10; 20 10" begin="0s" dur="10s"/></text>
</svg>

<script>
async_test(t => {
    window.onload = t.step_func(() => {
        const svg = document.querySelector("svg");
        svg.pauseAnimations();
        svg.setCurrentTime(5);
        requestAnimationFrame(t.step_func_done(() => {
            // Segment distances are 10 and 90, so the midpoint is at distance 50.
            assert_approx_equals(document.getElementById("single").x.animVal.getItem(1).value, 50, 1, "single changing component");
            // Segment distances are sqrt(200) and 10. A sum of per-component
            // deltas (20 and 10) would give 7.5 for both components instead.
            const multiple = document.getElementById("multiple").x.animVal;
            assert_approx_equals(multiple.getItem(0).value, 8.54, 0.3, "first component");
            assert_approx_equals(multiple.getItem(1).value, 8.54, 0.3, "second component");
        }));
    });
}, "calcMode=paced on a length list spaces segments by distance, not uniformly");
</script>
