<!DOCTYPE html>
<title>Changing the 'begin' or 'end' attribute replaces the instance times it previously created</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/animations/#BeginAttribute">
<link rel="help" href="https://www.w3.org/TR/SMIL3/smil-timing.html#q86">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg id="begin-replaced">
  <rect width="100" height="100" fill="green">
    <set attributeName="fill" to="red" begin="1s" dur="1s"/>
  </rect>
</svg>
<svg id="implicit-begin">
  <rect width="100" height="100" fill="green">
    <set attributeName="fill" to="red" dur="1s"/>
  </rect>
</svg>
<svg id="begin-indefinite">
  <rect width="100" height="100" fill="green">
    <set attributeName="fill" to="red" begin="1s" dur="1s"/>
  </rect>
</svg>
<svg id="end-replaced">
  <rect width="100" height="100" fill="green">
    <set attributeName="fill" to="red" begin="0s" end="1s"/>
  </rect>
</svg>
<script>
  const cases = [
    { id: 'begin-replaced', attributeName: 'begin', value: '5s', time: 1.5 },
    { id: 'implicit-begin', attributeName: 'begin', value: '1s', time: 0.5 },
    { id: 'begin-indefinite', attributeName: 'begin', value: 'indefinite', time: 1.5 },
    { id: 'end-replaced', attributeName: 'end', value: '3s', time: 2 },
  ];

  for (const { id, attributeName, value } of cases)
    document.getElementById(id).querySelector('set').setAttribute(attributeName, value);

  const ready = new Promise(resolve => window.addEventListener('load', resolve)).then(() => {
    for (const { id, time } of cases) {
      const svg = document.getElementById(id);
      svg.pauseAnimations();
      svg.setCurrentTime(time);
    }
    return new Promise(resolve => requestAnimationFrame(resolve));
  });

  function fill(id) {
    return getComputedStyle(document.getElementById(id).querySelector('rect')).fill;
  }

  promise_test(async () => {
    await ready;
    assert_equals(fill('begin-replaced'), 'rgb(0, 128, 0)');
  }, "Changing 'begin' discards the begin time from the previous value");

  promise_test(async () => {
    await ready;
    assert_equals(fill('implicit-begin'), 'rgb(0, 128, 0)');
  }, "Adding 'begin' discards the implicit begin time of 0");

  promise_test(async () => {
    await ready;
    assert_equals(fill('begin-indefinite'), 'rgb(0, 128, 0)');
  }, "Changing 'begin' to 'indefinite' discards the begin time from the previous value");

  promise_test(async () => {
    await ready;
    assert_equals(fill('end-replaced'), 'rgb(255, 0, 0)');
  }, "Changing 'end' discards the end time from the previous value");
</script>
