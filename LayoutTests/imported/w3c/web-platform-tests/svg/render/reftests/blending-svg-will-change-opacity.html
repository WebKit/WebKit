<!DOCTYPE html>
<title>'mix-blend-mode' inside an SVG element with 'will-change: opacity'</title>
<link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
<link rel="help" href="https://drafts.csswg.org/compositing-1/#csscompositingrules_SVG">
<link rel="match" href="blending-svg-root-ref.html">
<meta name="assert" content="'will-change: opacity' on an SVG element creates an isolated group, as 'opacity' would, so blending descendants do not blend with the content behind the 'svg' element.">
<div style="background: green">
  <div>Expected: a black square on green background.</div>
  <svg style="width: 200px; height: 200px">
    <g style="will-change: opacity">
      <rect width="200" height="200" fill="black" style="mix-blend-mode: difference"/>
    </g>
  </svg>
</div>
