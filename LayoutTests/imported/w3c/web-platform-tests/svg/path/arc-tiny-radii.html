<!DOCTYPE html>
<meta charset="utf-8">
<title>Elliptical arcs with tiny radii still reach their endpoint</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/paths.html#ArcOutOfRangeParameters">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg width="100" height="100">
  <path id="target"/>
</svg>
<script>
const target = document.getElementById("target");

// Radii that are too small to span the endpoints are scaled up (or, if zero, the arc becomes a
// line), so the path must always end at the arc's endpoint.
const cases = [
  ["tiny radii, small arc",   "M 0 0 A 1e-30 1e-30 0 0 1 10 10", 10, 10],
  ["tiny radii, large arc",   "M 0 0 A 1e-30 1e-30 0 1 0 10 10", 10, 10],
  ["denormal radii, rotated", "M 0 0 a 1e-38 1e-38 45 0 1 5 5",  5,  5],
];

for (const [name, d, x, y] of cases) {
  test(() => {
    target.setAttribute("d", d);
    const length = target.getTotalLength();
    assert_true(Number.isFinite(length), "length is finite");
    assert_greater_than(length, 0, "arc is not dropped");
    const end = target.getPointAtLength(length);
    assert_approx_equals(end.x, x, 0.01, "end x");
    assert_approx_equals(end.y, y, 0.01, "end y");
  }, name);
}

// Scaling up a single tiny radius yields an ellipse far too elongated for float precision to
// resolve its endpoint, so only check that the arc isn't dropped and the geometry stays finite.
test(() => {
  target.setAttribute("d", "M 0 0 A 1e-30 1 0 0 1 10 10");
  const length = target.getTotalLength();
  assert_true(Number.isFinite(length), "length is finite");
  assert_greater_than(length, 0, "arc is not dropped");
  const end = target.getPointAtLength(length);
  assert_true(Number.isFinite(end.x) && Number.isFinite(end.y), "end point is finite");
}, "one tiny radius");
</script>
