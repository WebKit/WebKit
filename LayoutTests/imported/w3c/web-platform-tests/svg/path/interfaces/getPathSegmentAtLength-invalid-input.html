<!doctype html>
<title>SVGPathElement.getPathSegmentAtLength(): non-finite and missing arguments</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/paths/#__svg__SVGPathElement__getPathSegmentAtLength">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/getPathData-helpers.js"></script>

<svg></svg>
<script>
// Four segments. Each lineto is exactly 5 units and axis-aligned, so the
// cumulative lengths 0, 5, 10 and 15 are exact in floating point and the
// segment boundaries can be probed without tolerance.
//
//   index 0   M 0 0   zero length, ends at 0
//   index 1   L 0 5   ends at 5
//   index 2   L 5 5   ends at 10
//   index 3   L 5 0   ends at 15
const D = "M 0 0 L 0 5 L 5 5 L 5 0";
const SEGMENTS = [
  { type: "M", values: [0, 0] },
  { type: "L", values: [0, 5] },
  { type: "L", values: [5, 5] },
  { type: "L", values: [5, 0] }
];

function assert_segment_equals(actual, expectedIndex, description) {
  assert_not_equals(actual, null, description + ": expected a segment, got null");
  assert_path_data_equals([actual], [SEGMENTS[expectedIndex]]);
}

// The IDL declares "float distance", which is restricted, so the bindings reject
// a non-finite argument before the method runs. Note this makes the spec's
// sentence "If distance is NaN, returns null" unreachable through its own IDL.
for (const value of [NaN, Infinity, -Infinity]) {
  test(() => {
    const path = createPath(D);
    assert_throws_js(TypeError, () => path.getPathSegmentAtLength(value));
  }, `getPathSegmentAtLength(${value}) throws TypeError`);
}

test(() => {
  const path = createPath(D);
  assert_throws_js(TypeError, () => path.getPathSegmentAtLength());
}, "getPathSegmentAtLength() with no argument throws TypeError");

test(() => {
  const path = createPath(D);
  assert_throws_js(TypeError, () => path.getPathSegmentAtLength("abc"));
}, "getPathSegmentAtLength() with a non-numeric string throws TypeError");
</script>
