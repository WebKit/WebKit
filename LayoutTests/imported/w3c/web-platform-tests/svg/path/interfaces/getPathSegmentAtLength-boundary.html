<!doctype html>
<title>SVGPathElement.getPathSegmentAtLength(): a distance exactly on a segment boundary</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/paths/#__svg__SVGPathElement__getPathSegmentAtLength">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/getPathData-helpers.js"></script>

<svg></svg>
<script>
// Four segments. Each lineto is exactly 5 units and axis-aligned, so the
// cumulative lengths 0, 5, 10 and 15 are exact in floating point and the
// segment boundaries can be probed without tolerance.
//
//   index 0   M 0 0   zero length, ends at 0
//   index 1   L 0 5   ends at 5
//   index 2   L 5 5   ends at 10
//   index 3   L 5 0   ends at 15
const D = "M 0 0 L 0 5 L 5 5 L 5 0";
const SEGMENTS = [
  { type: "M", values: [0, 0] },
  { type: "L", values: [0, 5] },
  { type: "L", values: [5, 5] },
  { type: "L", values: [5, 0] }
];

function assert_segment_equals(actual, expectedIndex, description) {
  assert_not_equals(actual, null, description + ": expected a segment, got null");
  assert_path_data_equals([actual], [SEGMENTS[expectedIndex]]);
}

// Spec: "If the clamped distance falls exactly on the boundary between two
// segments, the later segment shall be returned."
for (const [distance, index] of [[5, 2], [10, 3]]) {
  test(() => {
    const path = createPath(D);
    assert_segment_equals(path.getPathSegmentAtLength(distance), index,
        "boundary at " + distance);
  }, `getPathSegmentAtLength(${distance}) on a boundary returns the later segment`);
}

// The two sides of the same boundary, so a failure above is readable as a
// tie-breaking difference rather than an off-by-one everywhere.
test(() => {
  const path = createPath(D);
  assert_segment_equals(path.getPathSegmentAtLength(4.99), 1, "just before 5");
  assert_segment_equals(path.getPathSegmentAtLength(5.01), 2, "just after 5");
}, "getPathSegmentAtLength() either side of a boundary");
</script>
