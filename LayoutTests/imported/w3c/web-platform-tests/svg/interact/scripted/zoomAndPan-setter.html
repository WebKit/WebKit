<!doctype html>
<meta charset="utf-8">
<title>SVGZoomAndPan.zoomAndPan setter on SVGSVGElement and SVGViewElement</title>
<link rel="help" href="https://www.w3.org/TR/SVG11/interact.html#ZoomAndPanAttribute">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg id="svg">
  <view id="view"/>
</svg>
<script>
for (const id of ["svg", "view"]) {
    test(() => {
        const element = document.getElementById(id);
        element.zoomAndPan = SVGSVGElement.SVG_ZOOMANDPAN_DISABLE;
        assert_equals(element.zoomAndPan, SVGSVGElement.SVG_ZOOMANDPAN_DISABLE);
        element.zoomAndPan = SVGSVGElement.SVG_ZOOMANDPAN_MAGNIFY;
        assert_equals(element.zoomAndPan, SVGSVGElement.SVG_ZOOMANDPAN_MAGNIFY);
    }, `Setting zoomAndPan on <${id}> to a valid value updates the IDL attribute`);

    test(() => {
        const element = document.getElementById(id);
        element.setAttribute("zoomAndPan", "disable");
        assert_equals(element.zoomAndPan, SVGSVGElement.SVG_ZOOMANDPAN_DISABLE);
        element.zoomAndPan = SVGSVGElement.SVG_ZOOMANDPAN_MAGNIFY;
        assert_equals(element.zoomAndPan, SVGSVGElement.SVG_ZOOMANDPAN_MAGNIFY);
    }, `Setting zoomAndPan on <${id}> overrides the value from the zoomAndPan content attribute`);
}
</script>
