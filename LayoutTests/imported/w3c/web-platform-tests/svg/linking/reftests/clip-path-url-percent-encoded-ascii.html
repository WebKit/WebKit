<!DOCTYPE html>
<title>clip-path: url() finds an element whose id is written percent-encoded (ASCII)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-percent-encode-set">
<link rel="match" href="clip-path-url-percent-encoded-ref.html">
<meta name="assert" content="url(#%74gt) in clip-path resolves to the clipPath with id tgt, so only the left half of the rect is painted.">
<style>svg { display: block; }</style>
<svg width="64" height="64" viewBox="0 0 64 64">
  <clipPath id="tgt"><rect width="32" height="64"/></clipPath>
  <rect width="64" height="64" fill="green" style="clip-path: url(#%74gt)"/>
</svg>
