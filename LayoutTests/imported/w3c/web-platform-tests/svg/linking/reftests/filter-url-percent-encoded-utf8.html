<!DOCTYPE html>
<meta charset="utf-8">
<title>filter: url() finds an element whose id is non-ASCII and written percent-encoded (UTF-8)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-percent-encode-set">
<link rel="match" href="filter-url-percent-encoded-ref.html">
<meta name="assert" content="url(#%C3%A9) in filter resolves to the filter with id é (U+00E9), so the rect is replaced by the flood colour over its filter region.">
<style>svg { display: block; }</style>
<svg width="64" height="64" viewBox="0 0 64 64">
  <filter id="é"><feFlood flood-color="green"/></filter>
  <rect x="20" y="20" width="40" height="40" fill="red" style="filter: url(#%C3%A9)"/>
</svg>
