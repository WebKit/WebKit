<!DOCTYPE html>
<meta charset="utf-8">
<title>marker: url() to an external document finds an element whose id is non-ASCII and written percent-encoded (UTF-8)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/painting.html#VertexMarkerProperties">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-state">
<link rel="match" href="url-percent-encoded-external-ref.html">
<meta name="assert" content="url(support/percent-encoded-fragment-targets.svg#%C3%A9-marker) and url(support/percent-encoded-fragment-targets.svg#é-marker), which the URL parser also stores as #%C3%A9-marker, resolve to the marker with id é-marker (U+00E9) in the external document, so the green marker covers each red stroke.">
<style>svg { display: block; }</style>
<svg width="100" height="100" viewBox="0 0 100 100">
  <path d="M0,25h100" fill="none" stroke="red" stroke-width="50"
        marker-start="url(support/percent-encoded-fragment-targets.svg#%C3%A9-marker)"/>
  <path d="M100,75h-100" fill="none" stroke="red" stroke-width="50"
        marker-end="url(support/percent-encoded-fragment-targets.svg#é-marker)"/>
</svg>
