<!DOCTYPE html>
<meta charset="utf-8">
<title>fill and stroke: url() to an external document finds an element whose id is non-ASCII and written percent-encoded (UTF-8)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/painting.html#SpecifyingPaint">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-state">
<link rel="match" href="url-percent-encoded-external-ref.html">
<meta name="assert" content="In fill and stroke, url(support/percent-encoded-fragment-targets.svg#%C3%A9) and url(support/percent-encoded-fragment-targets.svg#é), which the URL parser also stores as #%C3%A9, resolve to the pattern with id é (U+00E9) in the external document, so the red fallback is never used.">
<style>svg { display: block; }</style>
<svg width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="50"
        fill="url(support/percent-encoded-fragment-targets.svg#%C3%A9) red"/>
  <rect x="25" y="15" width="50" height="20" fill="none" stroke-width="10"
        stroke="url(support/percent-encoded-fragment-targets.svg#%C3%A9) red"/>
  <rect y="50" width="100" height="50"
        fill="url(support/percent-encoded-fragment-targets.svg#é) red"/>
  <rect x="25" y="65" width="50" height="20" fill="none" stroke-width="10"
        stroke="url(support/percent-encoded-fragment-targets.svg#é) red"/>
</svg>
