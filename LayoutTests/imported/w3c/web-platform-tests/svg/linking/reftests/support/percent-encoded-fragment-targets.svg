<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
  <!-- No id in this file contains a literal "%". -->

  <pattern id="tgt" viewBox="0 0 1 1" preserveAspectRatio="none" width="1" height="1">
    <rect width="1" height="1" fill="green"/>
  </pattern>
  <pattern id="é" viewBox="0 0 1 1" preserveAspectRatio="none" width="1" height="1">
    <rect width="1" height="1" fill="green"/>
  </pattern>

  <marker id="tgt-marker" markerUnits="userSpaceOnUse" markerWidth="100" markerHeight="50"
          refX="0" refY="25" orient="0">
    <rect width="100" height="50" fill="green"/>
  </marker>
  <marker id="é-marker" markerUnits="userSpaceOnUse" markerWidth="100" markerHeight="50"
          refX="0" refY="25" orient="0">
    <rect width="100" height="50" fill="green"/>
  </marker>

  <clipPath id="tgt-clip" clipPathUnits="objectBoundingBox">
    <rect width="1" height="0.5"/>
  </clipPath>
  <clipPath id="é-clip" clipPathUnits="objectBoundingBox">
    <rect width="1" height="0.5"/>
  </clipPath>

  <filter id="tgt-filter" x="0" y="0" width="1" height="1">
    <feFlood flood-color="green"/>
  </filter>
  <filter id="é-filter" x="0" y="0" width="1" height="1">
    <feFlood flood-color="green"/>
  </filter>
</svg>
