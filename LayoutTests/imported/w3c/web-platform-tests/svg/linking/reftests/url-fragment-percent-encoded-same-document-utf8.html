<!DOCTYPE html>
<meta charset="utf-8">
<title>SVG references in the same document find an element whose id is non-ASCII and written percent-encoded (UTF-8)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-percent-encode-set">
<link rel="match" href="url-fragment-percent-encoded-same-document-ref.html">
<meta name="fuzzy" content="maxDifference=0-1;totalPixels=0-2500">
<meta name="assert" content="fill, marker-start and mask url(), use href, and gradient and pattern href, each written with é (U+00E9) percent-encoded as its UTF-8 bytes %C3%A9, find the element whose id has the character é, so every cell is green.">
<style>svg { display: block; }</style>
<!-- Firefox decodes only ASCII escapes in same-document references, so this file is separate from the ASCII one. -->
<svg width="230" height="110" viewBox="0 0 230 110">
  <defs>
    <pattern id="paint-é" width="1" height="1" viewBox="0 0 1 1">
      <rect width="1" height="1" fill="green"/>
    </pattern>
    <marker id="marker-é" markerUnits="userSpaceOnUse" markerWidth="50" markerHeight="50">
      <rect width="50" height="50" fill="green"/>
    </marker>
    <mask id="mask-é">
      <rect width="50" height="50" fill="white"/>
      <rect x="20" y="20" width="10" height="10" fill="black"/>
    </mask>
    <symbol id="symbol-é">
      <rect width="50" height="50" fill="green"/>
    </symbol>
    <linearGradient id="stops-é">
      <stop stop-color="green"/>
    </linearGradient>
    <linearGradient id="gradient-href" href="#stops-%C3%A9"/>
    <pattern id="tile-é" width="1" height="1" viewBox="0 0 1 1">
      <rect width="1" height="1" fill="green"/>
    </pattern>
    <pattern id="pattern-href" href="#tile-%C3%A9"/>
    <pattern id="chain-end-é" width="1" height="1" viewBox="0 0 1 1">
      <rect width="1" height="1" fill="green"/>
    </pattern>
    <pattern id="chain-middle-é" href="#chain-end-%C3%A9"/>
    <pattern id="chain-start" href="#chain-middle-%C3%A9"/>
  </defs>

  <g transform="translate(0 0)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#paint-%C3%A9) red"/>
  </g>
  <g transform="translate(60 0)">
    <rect width="50" height="50" fill="red"/>
    <path d="M0 0 h1" fill="none" marker-start="url(#marker-%C3%A9)"/>
  </g>
  <!-- Engines differ on a missing mask: drawn without a mask, or not drawn (https://drafts.csswg.org/css-masking-1/#the-mask-image). Each shows red. -->
  <g transform="translate(120 0)">
    <rect width="50" height="50" fill="red"/>
    <rect x="20" y="20" width="10" height="10" fill="green"/>
    <g mask="url(#mask-%C3%A9)">
      <rect width="50" height="50" fill="green"/>
      <rect x="20" y="20" width="10" height="10" fill="red"/>
    </g>
  </g>
  <g transform="translate(180 0)">
    <rect width="50" height="50" fill="red"/>
    <use href="#symbol-%C3%A9" width="50" height="50"/>
  </g>
  <g transform="translate(0 60)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#gradient-href)"/>
  </g>
  <g transform="translate(60 60)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#pattern-href)"/>
  </g>
  <g transform="translate(120 60)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#chain-start)"/>
  </g>
</svg>
