<!DOCTYPE html>
<title>SVG references in the same document find an element whose id is written percent-encoded (ASCII)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-percent-encode-set">
<link rel="match" href="url-fragment-percent-encoded-same-document-ref.html">
<meta name="fuzzy" content="maxDifference=0-1;totalPixels=0-2500">
<meta name="assert" content="fill, marker-start and mask url(), use href, and gradient and pattern href, each written with one ASCII letter percent-encoded (%65 for e), find the element whose id has the plain letter, so every cell is green.">
<style>svg { display: block; }</style>
<svg width="230" height="110" viewBox="0 0 230 110">
  <defs>
    <pattern id="paint-e" width="1" height="1" viewBox="0 0 1 1">
      <rect width="1" height="1" fill="green"/>
    </pattern>
    <marker id="marker-e" markerUnits="userSpaceOnUse" markerWidth="50" markerHeight="50">
      <rect width="50" height="50" fill="green"/>
    </marker>
    <mask id="mask-e">
      <rect width="50" height="50" fill="white"/>
      <rect x="20" y="20" width="10" height="10" fill="black"/>
    </mask>
    <symbol id="symbol-e">
      <rect width="50" height="50" fill="green"/>
    </symbol>
    <linearGradient id="stops-e">
      <stop stop-color="green"/>
    </linearGradient>
    <linearGradient id="gradient-href" href="#stops-%65"/>
    <pattern id="tile-e" width="1" height="1" viewBox="0 0 1 1">
      <rect width="1" height="1" fill="green"/>
    </pattern>
    <pattern id="pattern-href" href="#tile-%65"/>
    <pattern id="chain-end-e" width="1" height="1" viewBox="0 0 1 1">
      <rect width="1" height="1" fill="green"/>
    </pattern>
    <pattern id="chain-middle-e" href="#chain-end-%65"/>
    <pattern id="chain-start" href="#chain-middle-%65"/>
  </defs>

  <g transform="translate(0 0)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#paint-%65) red"/>
  </g>
  <g transform="translate(60 0)">
    <rect width="50" height="50" fill="red"/>
    <path d="M0 0 h1" fill="none" marker-start="url(#marker-%65)"/>
  </g>
  <!-- Engines differ on a missing mask: drawn without a mask, or not drawn (https://drafts.csswg.org/css-masking-1/#the-mask-image). Each shows red. -->
  <g transform="translate(120 0)">
    <rect width="50" height="50" fill="red"/>
    <rect x="20" y="20" width="10" height="10" fill="green"/>
    <g mask="url(#mask-%65)">
      <rect width="50" height="50" fill="green"/>
      <rect x="20" y="20" width="10" height="10" fill="red"/>
    </g>
  </g>
  <g transform="translate(180 0)">
    <rect width="50" height="50" fill="red"/>
    <use href="#symbol-%65" width="50" height="50"/>
  </g>
  <g transform="translate(0 60)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#gradient-href)"/>
  </g>
  <g transform="translate(60 60)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#pattern-href)"/>
  </g>
  <g transform="translate(120 60)">
    <rect width="50" height="50" fill="red"/>
    <rect width="50" height="50" fill="url(#chain-start)"/>
  </g>
</svg>
