<!doctype html>
<title>SVG media fragment: spatial clip extending beyond image bounds is clamped</title>
<link rel="help" href="https://www.w3.org/TR/media-frags/#naming-space">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#LinksIntoSVG">
<link rel="match" href="../../struct/reftests/reference/green-100x100.html">
<style>
  .control {
    width: 100px;
    height: 50px;
    background-repeat: no-repeat;
    background-image: url("support/red-green-200x200.svg#xywh=100,100,100,100");
  }
  .case {
    width: 100px;
    height: 50px;
    background-repeat: no-repeat;
    /* Per the spec, when x+w > image width or y+h > image height, the UA
       should clamp to the actual image dimensions. Here 0+200 > 100 for both
       axes, so the clip should be clamped to 0,0,100,100. */
    background-image: url("support/green-100x100.svg#xywh=0,0,200,200");
  }
</style>
<!-- Must apply: red-green-200x200.svg shows green here only once xywh= is applied, so the test fails where spatial media fragments are not supported. -->
<div class="control"></div>
<div class="case"></div>
