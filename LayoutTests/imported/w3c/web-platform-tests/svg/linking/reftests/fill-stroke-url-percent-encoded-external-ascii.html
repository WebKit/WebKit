<!DOCTYPE html>
<meta charset="utf-8">
<title>fill and stroke: url() to an external document finds an element whose id is written percent-encoded (ASCII)</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-target">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/painting.html#SpecifyingPaint">
<link rel="help" href="https://url.spec.whatwg.org/#fragment-state">
<link rel="match" href="url-percent-encoded-external-ref.html">
<meta name="assert" content="url(support/percent-encoded-fragment-targets.svg#%74gt) in fill and stroke resolves to the pattern with id tgt in the external document, so the red fallback is never used.">
<style>svg { display: block; }</style>
<svg width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="100"
        fill="url(support/percent-encoded-fragment-targets.svg#%74gt) red"/>
  <rect x="25" y="25" width="50" height="50" fill="none" stroke-width="20"
        stroke="url(support/percent-encoded-fragment-targets.svg#%74gt) red"/>
</svg>
