<!doctype html>
<meta charset="utf-8">
<title>SVG media fragment: space segment numbers are unsigned integers without spaces</title>
<link rel="author" title="Karl Dubost" href="mailto:k_dubost@apple.com">
<link rel="help" href="https://www.w3.org/TR/media-frags/#naming-space">
<link rel="help" href="https://www.w3.org/TR/media-frags/#error-uri-spatial">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#SVGFragmentIdentifiersDefinitions">
<link rel="match" href="../../struct/reftests/reference/green-100x100.html">
<meta name="assert" content="Each number is 1*DIGIT. A plus sign or a space before or after a number makes the spatial fragment invalid, so it is ignored.">
<style>
  div { width: 100px; height: 20px; background-repeat: no-repeat; }
</style>
<!-- Must apply: red-green-200x200.svg shows green here only once xywh= is applied, so the test fails where spatial media fragments are not supported. -->
<div style="background-image: url('support/red-green-200x200.svg#xywh=100,100,100,100')"></div>
<!-- Must be ignored: green-red-200x200.svg is green at its top-left when no fragment applies, and red where these fragments point. -->
<div style="background-image: url('support/green-red-200x200.svg#xywh=+100,100,100,100')"></div>
<div style="background-image: url('support/green-red-200x200.svg#xywh=100,%20100,100,100')"></div>
<div style="background-image: url('support/green-red-200x200.svg#xywh=%20100,100,100,100')"></div>
<div style="background-image: url('support/green-red-200x200.svg#xywh=100,100,100,100%20')"></div>
