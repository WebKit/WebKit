<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>SVG fragment identifier: svgView() applies when drawing an image into a canvas</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#SVGFragmentIdentifiersDefinitions">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<!--
  ../reftests/support/squares.svg is a 200x200 sprite of four solid quadrants:

        #d46847 terracotta | #2a9d8f teal
        #264653 indigo     | #e9c46a sand

  svgView(viewBox(100,0,100,100)) selects the top-right one, so an image drawn
  with that fragment must be entirely teal.

  Each test uses its own URL, via a distinct query string, so that a view applied
  by one test cannot change what a later test draws. Do not consolidate them.
-->

<div id="host"></div>

<script>
const BASE = '../reftests/support/squares.svg';
const src = (tag) => BASE + '?' + tag;

const TOP_RIGHT = '#svgView(viewBox(100,0,100,100))';
const TOP_LEFT = '#svgView(viewBox(0,0,100,100))';

const TERRACOTTA = '212,104,71';
const TEAL = '42,157,143';

function loadDetached(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('failed to load ' + url));
    img.src = url;
  });
}

// Inserted in the document and given a layout size, so it has a renderer.
function loadAttached(url) {
  return new Promise((resolve, reject) => {
    const img = document.createElement('img');
    img.width = 100;
    img.height = 100;
    img.onload = () => {
      // Force layout so the img has a renderer before the draw. Without it the
      // first image on a cold page can be drawn before layout has run, and the
      // case stops being a control for the renderer path.
      img.getBoundingClientRect();
      requestAnimationFrame(() => resolve(img));
    };
    img.onerror = () => reject(new Error('failed to load ' + url));
    document.getElementById('host').appendChild(img);
    img.src = url;
  });
}

// Returns the colours present, most common first, as "r,g,b" with the percentage
// of the canvas each covers.
function colours(img) {
  const N = 32;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = N;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, N, N);
  const data = ctx.getImageData(0, 0, N, N).data;
  const counts = new Map();
  for (let i = 0; i < data.length; i += 4) {
    const key = data[i] + ',' + data[i + 1] + ',' + data[i + 2];
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([rgb, n]) => ({ rgb: rgb, pct: Math.round(n / (N * N) * 100) }));
}

function assertSolid(list, expectedRgb, description) {
  assert_equals(list.length, 1, description + ': expected one colour, got '
    + list.map((c) => c.rgb + ' at ' + c.pct + '%').join(' '));
  assert_equals(list[0].rgb, expectedRgb, description + ': wrong colour');
}

// Controls first, so that "four colours" cannot be read as the sprite having
// failed to draw at all.
promise_test(async () => {
  const list = colours(await loadDetached(src('control-whole')));
  assert_equals(list.length, 4, 'the sprite has four quadrants, so drawing it '
    + 'whole must give four colours, got ' + list.map((c) => c.rgb).join(' '));
  assert_equals(list[0].pct, 25, 'each quadrant covers a quarter of the image');
}, 'control: the sprite drawn with no fragment gives four colours');

promise_test(async () => {
  const list = colours(await loadAttached(src('control-topleft') + TOP_LEFT));
  assertSolid(list, TERRACOTTA, 'top-left quadrant');
}, 'control: a different viewBox() selects a different quadrant');

// The two tests that differ only in attachment.
promise_test(async () => {
  const list = colours(await loadAttached(src('attached') + TOP_RIGHT));
  assertSolid(list, TEAL, 'top-right quadrant, image in the document');
}, 'svgView() applies when drawing an img that is in the document');

promise_test(async () => {
  const list = colours(await loadDetached(src('detached') + TOP_RIGHT));
  assertSolid(list, TEAL, 'top-right quadrant, image not in the document');
}, 'svgView() applies when drawing an Image that is not in the document');

promise_test(async () => {
  const shared = src('shared');
  const first = colours(await loadAttached(shared + TOP_LEFT));
  const second = colours(await loadDetached(shared + TOP_RIGHT));
  assertSolid(first, TERRACOTTA, 'first consumer asked for the top-left quadrant');
  assertSolid(second, TEAL, 'second consumer asked for the top-right quadrant');
}, 'two references to one URL with different svgView() fragments do not share a view');
</script>
