<!DOCTYPE html>
<meta charset="utf-8">
<title>SVG a: a fragment-only href resolves against the base element, like an HTML link</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/linking.html#processingURL-absolute">
<link rel="help" href="https://html.spec.whatwg.org/multipage/links.html#following-hyperlinks">
<meta name="assert" content="Activating an SVG a element is navigation, not a reference to an element used for rendering, so its fragment-only href resolves against the document base URL set by a base element, exactly as for an HTML a element.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// The base element lives inside each frame, so this document's own URLs are
// unaffected. It points at a same-origin page so that the frame stays readable
// whichever way the link resolves:
//   resolved against the base URL  -> the frame loads /common/blank.html#t
//   resolved against the document  -> the frame stays at about:srcdoc#t
const BASE = new URL("/common/blank.html", location.href).href;

function frameWith(markup) {
  return new Promise(resolve => {
    const frame = document.createElement("iframe");
    frame.srcdoc = `<!DOCTYPE html><base href="${BASE}"><body>${markup}<p id="t">target</p></body>`;
    frame.addEventListener("load", () => resolve(frame), { once: true });
    document.body.append(frame);
  });
}

async function activate(t, frame, id) {
  const link = frame.contentDocument.getElementById(id);
  const navigated = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
  link.dispatchEvent(new frame.contentWindow.MouseEvent("click", { bubbles: true, cancelable: true }));
  // A fragment navigation within about:srcdoc fires no load event, so do not wait forever.
  await Promise.race([navigated, new Promise(resolve => t.step_timeout(resolve, 3000))]);
  return frame.contentWindow.location.href;
}

promise_test(async t => {
  const frame = await frameWith(`<a id="link" href="#t">HTML link</a>`);
  t.add_cleanup(() => frame.remove());
  assert_equals(frame.contentDocument.baseURI, BASE, "the base element sets the frame's base URL");
  assert_equals(await activate(t, frame, "link"), BASE + "#t");
}, "HTML a with a fragment-only href navigates to the base URL (control)");

promise_test(async t => {
  const frame = await frameWith(`<svg width="100" height="30"><a id="link" href="#t"><text x="0" y="20">SVG link</text></a></svg>`);
  t.add_cleanup(() => frame.remove());
  assert_equals(frame.contentDocument.baseURI, BASE, "the base element sets the frame's base URL");
  assert_equals(await activate(t, frame, "link"), BASE + "#t");
}, "SVG a with a fragment-only href navigates to the base URL, like an HTML link");
</script>
</body>
