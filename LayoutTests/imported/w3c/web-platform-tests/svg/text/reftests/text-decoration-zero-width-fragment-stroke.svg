<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml">
  <metadata>
    <h:title>Stroked text decoration is not painted for a zero-width text fragment</h:title>
    <h:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/text.html#TextDecorationProperties"/>
    <h:link rel="match" href="text-decoration-zero-width-fragment-stroke-ref.svg"/>
    <h:link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
  </metadata>
  <style>
    text {
      font-family: Ahem;
      font-size: 100px;
      fill: none;
      stroke: black;
      stroke-width: 20px;
      text-decoration: underline;
    }
  </style>
  <text x="20" y="120">X<tspan x="220">&#x200B;</tspan></text>
</svg>
