<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml">
  <title>Pattern: nested pattern painted at two different scales</title>
  <h:link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com"/>
  <h:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#Patterns"/>
  <h:link rel="match" href="reference/pattern-nested-different-scales-ref.svg"/>

  <pattern id="inner" patternUnits="userSpaceOnUse" width="100" height="100">
    <rect width="50" height="100" fill="green"/>
    <rect x="51" width="49" height="100" fill="green"/>
  </pattern>
  <pattern id="outer" patternUnits="userSpaceOnUse" width="100" height="100">
    <rect width="100" height="100" fill="url(#inner)"/>
  </pattern>
  <!-- Paints the content of 'outer' at a quarter of the size first, then covers it. -->
  <rect transform="translate(150 0) scale(0.25)" width="100" height="100" fill="url(#outer)"/>
  <rect x="150" width="25" height="25" fill="green"/>
  <rect width="100" height="100" fill="url(#outer)"/>
</svg>
