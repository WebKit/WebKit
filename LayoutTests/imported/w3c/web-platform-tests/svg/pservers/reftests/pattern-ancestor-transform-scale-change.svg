<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" class="reftest-wait">
  <title>Pattern: after the scale of an ancestor changes</title>
  <h:link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com"/>
  <h:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#Patterns"/>
  <h:link rel="match" href="reference/green-100x100.svg"/>
  <h:script src="/common/reftest-wait.js"/>
  <h:script src="/common/rendering-utils.js"/>

  <pattern id="pattern" patternUnits="userSpaceOnUse" width="200" height="100">
    <rect width="100" height="100" fill="green"/>
    <rect x="100" width="100" height="100" fill="red"/>
  </pattern>
  <g id="group" transform="scale(0.25)">
    <rect width="100" height="100" fill="url(#pattern)"/>
  </g>
  <script>
    waitForAtLeastOneFrame().then(() => {
      document.getElementById('group').setAttribute('transform', 'scale(1)');
      takeScreenshot();
    });
  </script>
</svg>
