<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" class="reftest-wait">
  <title>Gradient with 'transform' property added dynamically</title>
  <h:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/single-page.html#pservers-LinearGradientElementGradientTransformAttribute"/>
  <h:link rel="help" href="https://drafts.csswg.org/css-transforms/#transform-attribute-specificity"/>
  <h:link rel="match" href="reference/gradient-transform-03-ref.svg"/>
  <h:script src="/common/reftest-wait.js"/>
  <h:script src="/common/rendering-utils.js"/>

  <!-- The reference draws the same gradient with gradientTransform="scale(2)",
       not a solid green fill. Rendering engines may dither gradients, so a
       gradient is not always identical to a solid fill of its stop colour,
       even where it only shows one colour. Drawn the same way twice, it is.
       If the transform property is ignored, the square shows the fade to red. -->

  <linearGradient id="lg">
    <stop offset="0" stop-color="green"/>
    <stop offset="0.5" stop-color="green"/>
    <stop offset="1" stop-color="red"/>
  </linearGradient>
  <rect width="100" height="100" fill="url(#lg)"/>
  <script>
    waitForAtLeastOneFrame().then(() => {
      const gradient = document.getElementById('lg');
      gradient.style.transform = 'scale(2)';
      takeScreenshot();
    });
  </script>
</svg>
