<!DOCTYPE html>
<meta charset="utf-8">
<title>fill: reference, two green squares</title>
<!-- The squares use the same gradient as the test so that any dithering is
     identical, and a green fallback so that the reference is still green if
     gradients are not supported at all. Without a base element this page's
     url(#g) resolves normally. -->
<p>Test passes if there are two green squares and no red.</p>
<svg width="220" height="100">
  <linearGradient id="g">
    <stop offset="0" stop-color="green"/>
    <stop offset="1" stop-color="green"/>
  </linearGradient>
  <rect width="100" height="100" fill="url(#g) green"/>
  <rect x="120" width="100" height="100" fill="url(#g) green"/>
</svg>
