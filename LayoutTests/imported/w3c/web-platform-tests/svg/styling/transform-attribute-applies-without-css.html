<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG transform attribute applies when no CSS transform is set</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/styling.html#PresentationAttributes">
<link rel="match" href="transform-attribute-applies-without-css-ref.html">
</head>
<body>
<p>Test passes if there is a small green circle in the top-left quadrant.</p>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <circle cx="100" cy="100" r="100" fill="green" transform="scale(0.5)"/>
</svg>
</body>
</html>
