<!DOCTYPE html>
<html class="reftest-wait">
<head>
<meta charset="utf-8">
<title>Adding CSS transform: none after load overrides the SVG transform attribute</title>
<link rel="help" href="https://drafts.csswg.org/css-transforms-1/#transform-property">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/styling.html#PresentationAttributes">
<link rel="match" href="transform-none-overrides-attribute-dynamic-ref.html">
<style>
.override { transform: none; }
</style>
</head>
<body>
<p>Test passes if there is a green circle, a green square and the word PASS in green.</p>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <circle cx="50" cy="50" r="50" fill="green" transform="scale(0.01)"/>
    <g transform="translate(-1000 0)">
        <rect x="100" y="0" width="100" height="100" fill="green"/>
    </g>
    <text x="10" y="150" font-size="40" fill="green" transform="scale(0.01)">PASS</text>
</svg>
<script>
requestAnimationFrame(() => requestAnimationFrame(() => {
    for (const element of document.querySelectorAll("svg [transform]"))
        element.classList.add("override");
    requestAnimationFrame(() => document.documentElement.classList.remove("reftest-wait"));
}));
</script>
</body>
</html>
