<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Adding CSS transform: none after load overrides the SVG transform attribute (reference)</title>
</head>
<body>
<p>Test passes if there is a green circle, a green square and the word PASS in green.</p>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <circle cx="50" cy="50" r="50" fill="green"/>
    <rect x="100" y="0" width="100" height="100" fill="green"/>
    <text x="10" y="150" font-size="40" fill="green">PASS</text>
</svg>
</body>
</html>
