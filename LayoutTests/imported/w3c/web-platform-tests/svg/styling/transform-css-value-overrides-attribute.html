<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS transform value overrides SVG transform attribute</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/styling.html#PresentationAttributes">
<link rel="match" href="transform-css-value-overrides-attribute-ref.html">
<style>
circle { transform: scale(1); }
</style>
</head>
<body>
<p>Test passes if there is a green circle covering the whole viewport.</p>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <circle cx="100" cy="100" r="100" fill="green" transform="scale(0.01)"/>
</svg>
</body>
</html>
