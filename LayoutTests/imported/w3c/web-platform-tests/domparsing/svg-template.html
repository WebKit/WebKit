<!DOCTYPE html>
<meta charset="utf-8">
<title>SVG-namespace template elements are treated as expected</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<script>
"use strict";

// Regression test for https://github.com/jsdom/jsdom/issues/3150

test(() => {
  const p = new DOMParser();
  const doc = p.parseFromString("<svg xmlns='http://www.w3.org/2000/svg'><template>text</template></svg>", "image/svg+xml");

  const template = doc.querySelector("template");
  assert_equals(template.textContent, "text");
  assert_equals(template.namespaceURI, "http://www.w3.org/2000/svg");
  assert_false("content" in template);
}, "document");

test(() => {
  const doc = document.implementation.createHTMLDocument();
  const svg = doc.createElementNS("http://www.w3.org/2000/svg", "svg");
  const svgTemplate = doc.createElementNS("http://www.w3.org/2000/svg", "template");
  svg.appendChild(svgTemplate);
  doc.body.appendChild(svg);
  svgTemplate.innerHTML = "text";

  const template = doc.querySelector("template");
  assert_equals(template.textContent, "text");
  assert_equals(template.namespaceURI, "http://www.w3.org/2000/svg");
  assert_false("content" in template);
}, "fragment");
</script>
