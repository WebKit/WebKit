<!DOCTYPE html>
<meta charset="utf-8">
<title>Keyboard generated click event has zero coordinates</title>
<link rel="help" href="https://w3c.github.io/uievents/#event-type-click">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>

<p>Tests that a button activated from the keyboard fires a click event whose coordinates are 0</p>
<button id="inViewport">Activate me by pressing Enter or Space</button>
<div style="height: 3000px"></div>
<button id="belowTheFold">Activate me by pressing Enter or Space</button>
<div style="height: 3000px"></div>
<button id="outOfView">Activate me by pressing Enter or Space</button>

<script>
const enterKey = '\uE006';
const spaceKey = ' ';
const keyNames = new Map([[enterKey, "enter"], [spaceKey, "space"]]);
const coordinates = ["screenX", "screenY", "clientX", "clientY", "pageX", "pageY"];
const targets = [
  { id: "inViewport", preventScroll: false },
  { id: "belowTheFold", preventScroll: false },
  { id: "outOfView", preventScroll: true },
];

for (const { id, preventScroll } of targets) {
  for (const key of [spaceKey, enterKey]) {
    promise_test(async (test) => {
      let target = document.getElementById(id);
      let eventWatcher = new EventWatcher(test, target, ['click']);
      let waitForClick = eventWatcher.wait_for('click');
      target.focus({ preventScroll });
      await test_driver.send_keys(target, key);
      let event = await waitForClick;

      for (const coordinate of coordinates)
        assert_equals(event[coordinate], 0, `Click's ${coordinate} has default value`);
    }, `Test that the click generated by the ${keyNames.get(key)} key on ${id} has zero coordinates`);
  }
}
</script>
