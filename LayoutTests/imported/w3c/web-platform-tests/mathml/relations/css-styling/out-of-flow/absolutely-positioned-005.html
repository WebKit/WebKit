<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Absolutely positioned MathML element sized relative to its MathML containing block</title>
<link rel="help" href="https://w3c.github.io/mathml-core/#layout-algorithms">
<link rel="help" href="https://w3c.github.io/mathml-core/#css-styling">
<link rel="help" href="https://drafts.csswg.org/css-position/#abspos-layout">
<link rel="match" href="absolutely-positioned-005-ref.html"/>
<meta name="assert" content="Verify that an absolutely positioned mrow sized with percentages or insets paints over its MathML containing block.">
<body>
  <p>Test passes if you see four green squares and no red.</p>
  <div style="position: absolute; left: 100px; top: 100px;">
    <math>
      <mrow style="position: relative;">
        <mspace width="100px" height="50px" depth="50px" style="background: red"/>
        <mrow style="position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; background: green;"></mrow>
      </mrow>
    </math>
  </div>
  <div style="position: absolute; left: 250px; top: 100px;">
    <math>
      <mrow style="position: relative;">
        <mspace width="100px" height="50px" depth="50px" style="background: red"/>
        <mrow style="position: absolute; inset: 0; background: green;"></mrow>
      </mrow>
    </math>
  </div>
  <div style="position: absolute; left: 400px; top: 100px;">
    <math>
      <mrow style="position: relative;">
        <mspace width="50px" height="50px" depth="50px" style="background: green"/>
        <mspace width="50px" height="50px" depth="50px" style="background: red"/>
        <mrow style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: green; clip-path: inset(0 0 0 50%);"></mrow>
      </mrow>
    </math>
  </div>
  <div style="position: absolute; left: 550px; top: 100px;">
    <math dir="rtl">
      <mrow style="position: relative;">
        <mspace width="50px" height="50px" depth="50px" style="background: green"/>
        <mspace width="50px" height="50px" depth="50px" style="background: red"/>
        <mrow style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: green; clip-path: inset(0 50% 0 0);"></mrow>
      </mrow>
    </math>
  </div>
</body>
</html>
