<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>HTML partial updates - a nested patch whose scope is the body still reaches head markers</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/parsing.html#parsing-main-inhead">
<link rel="help" href="https://html.spec.whatwg.org/multipage/scripting.html#find-markers">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<?marker name="in-head">
</head>
<body>
  <?start name="outer">old<?end>
  <template for="outer">patched<template for="in-head"><meta name="probe" content="yes"></template></template>
  <script>
    test(() => {
      assert_not_equals(document.head.querySelector('meta[name="probe"]'), null,
        "the nested patch should find the marker in the head");
      assert_regexp_match(document.body.textContent, /patched/,
        "the outer patch should apply to the body");
    }, "A patch nested in a patch targeting a body child widens its marker scope from body to html");
  </script>
</body>
</html>
