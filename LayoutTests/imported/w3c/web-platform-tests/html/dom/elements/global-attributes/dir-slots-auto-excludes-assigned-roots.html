<!doctype html>
<title>HTML Test: dir=auto slot skips excluded assigned elements</title>
<meta charset="UTF-8">
<link rel="help" href="https://html.spec.whatwg.org/multipage/dom.html#auto-directionality">
<link rel="help" href="https://html.spec.whatwg.org/multipage/dom.html#contained-text-auto-directionality">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="dir-shadow-utils.js"></script>

<div></div>

<script>

for (let [description, markup] of [
  ["textarea", `<textarea>א</textarea>`],
  ["script", `<script type="text/plain">א<\/script>`],
  ["style", `<style>/* א */</style>`],
  ["dir=auto", `<span dir="auto">א</span>`],
]) {
  test(() => {
    let [tree, shadow] = setup_tree(`
      <div>
        <div id="root">${markup}</div>
      </div>
    `, `
      <slot dir="auto"></slot>
    `);
    let slot = shadow.querySelector("slot");
    assert_equals(html_direction(slot), "ltr");
    tree.remove();
  }, `dir=auto slot ignores text in ${description} assigned nodes`);

  test(() => {
    let [tree, shadow] = setup_tree(`
      <div>
        <div id="root">${markup}<span>א</span></div>
      </div>
    `, `
      <slot dir="auto"></slot>
    `);
    let slot = shadow.querySelector("slot");
    assert_equals(html_direction(slot), "rtl");
    tree.remove();
  }, `dir=auto slot continues past ${description} assigned nodes`);
}

</script>
