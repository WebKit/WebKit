<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference: table rules attribute with separate borders</title>
<style>
  table { border-collapse: separate; color: black; display: inline-table; vertical-align: top; margin: 0 12px 12px 0; }
  table.border { border: 1px outset; }
  td { width: 20px; height: 20px; padding: 0; }
  .cols td { border-left: 1px solid; border-right: 1px solid; }
  .all td { border: 1px solid; }
</style>

<table>
  <colgroup span="2"></colgroup><colgroup></colgroup>
  <thead><tr><td></td><td></td><td></td></tr></thead>
  <tbody><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr></tbody>
  <tfoot><tr><td></td><td></td><td></td></tr></tfoot>
</table>
<table class="border">

</table>
