<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference: table rules=rows lines in vertical-rl drawn with cell borders</title>
<style>
  table { writing-mode: vertical-rl; color: black; display: inline-table; vertical-align: top; margin: 0 12px 12px 0;
          border-collapse: collapse; border-style: hidden; }
  table.border { border: 1px outset; }
  td { width: 20px; height: 20px; padding: 0; border-left: 1px solid; border-right: 1px solid; }
</style>

<table>
  <thead><tr><td></td><td></td><td></td></tr></thead>
  <tbody><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr></tbody>
  <tfoot><tr><td></td><td></td><td></td></tr></tfoot>
</table>
<table class="border">
  <thead><tr><td></td><td></td><td></td></tr></thead>
  <tbody><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr></tbody>
  <tfoot><tr><td></td><td></td><td></td></tr></tfoot>
</table>
