<!DOCTYPE html>
<title>createImageBitmap: imageOrientation flipY flips the cropped region, not the region at the mirrored position</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/imagebitmap-and-animations.html#cropped-to-the-source-rectangle-with-formatting">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/html/canvas/resources/canvas-tests.js"></script>
<script src="/common/media.js"></script>
<script src="common.sub.js"></script>
<body>
<script>
const kPatternColors = {
    red: [255, 0, 0, 255],
    green: [0, 255, 0, 255],
    blue: [0, 0, 255, 255],
    black: [0, 0, 0, 255],
    transparent: [0, 0, 0, 0],
};

function nearestPatternColor(pixel) {
    let nearest, nearestDistance = Infinity;
    for (const [name, color] of Object.entries(kPatternColors)) {
        const distance = color.reduce((sum, component, i) => sum + (component - pixel[i]) ** 2, 0);
        if (distance < nearestDistance)
            [nearest, nearestDistance] = [name, distance];
    }
    return nearest;
}

function checkPixel(canvas, x, y, expected, sourceIsVideo) {
    if (sourceIsVideo) {
        const pixel = Array.from(canvas.getContext("2d").getImageData(x, y, 1, 1).data);
        assert_equals(nearestPatternColor(pixel), expected, `nearest pattern color of the pixel at (${x}, ${y}), which is ${pixel}`);
        return;
    }
    const [r, g, b, a] = kPatternColors[expected];
    _assertPixelApprox(canvas, x, y, r, g, b, a, 3);
}

const kCrops = [
    { name: "top-left", rect: [0, 0, 10, 10], expected: "red" },
    { name: "top-right", rect: [10, 0, 10, 10], expected: "green" },
    { name: "bottom-left", rect: [0, 10, 10, 10], expected: "blue" },
    { name: "bottom-right", rect: [10, 10, 10, 10], expected: "black" },
];

const kVariants = [
    { name: "imageOrientation flipY", options: { imageOrientation: "flipY" }, width: 10, height: 10 },
    { name: "imageOrientation flipY and resized up", options: { imageOrientation: "flipY", resizeWidth: 20, resizeHeight: 20 }, width: 20, height: 20 },
    { name: "imageOrientation flipY and resized non-uniformly", options: { imageOrientation: "flipY", resizeWidth: 20, resizeHeight: 6 }, width: 20, height: 6 },
    { name: "imageOrientation flipY and premultiplyAlpha none", options: { imageOrientation: "flipY", premultiplyAlpha: "none" }, width: 10, height: 10 },
];

const kSamplePoints = [[1, 1], [3, 1], [1, 3], [3, 3]];

function checkUniformPatternColor(canvas, width, height, expected, sourceIsVideo) {
    for (const [fx, fy] of kSamplePoints)
        checkPixel(canvas, Math.floor(fx * width / 4), Math.floor(fy * height / 4), expected, sourceIsVideo);
}

function checkUniformColor(canvas, width, height, [r, g, b, a], tolerance) {
    for (const [fx, fy] of kSamplePoints)
        _assertPixelApprox(canvas, Math.floor(fx * width / 4), Math.floor(fy * height / 4), r, g, b, a, tolerance);
}

for (const { name, factory } of imageSourceTypes) {
    for (const crop of kCrops) {
        for (const variant of kVariants) {
            promise_test(async t => {
                const source = await factory();
                const bitmap = await createImageBitmap(source, ...crop.rect, variant.options);
                t.add_cleanup(() => bitmap.close());
                assert_equals(bitmap.width, variant.width, "width");
                assert_equals(bitmap.height, variant.height, "height");

                const canvas = document.createElement("canvas");
                canvas.width = variant.width;
                canvas.height = variant.height;
                canvas.getContext("2d").drawImage(bitmap, 0, 0);

                checkUniformPatternColor(canvas, variant.width, variant.height, crop.expected, source instanceof HTMLVideoElement);
            }, `createImageBitmap from ${name} with a crop rect of its ${crop.name} quadrant, ${variant.name}`);
        }
    }
}

function loadImage(src) {
    return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
    });
}

const kExifCrops = [
    { name: "top-left", rect: [0, 0, 80, 80], expected: [255, 0, 0, 255] },
    { name: "bottom-right", rect: [240, 80, 80, 80], expected: [128, 128, 128, 255] },
];

const kExifVariants = [
    { name: "imageOrientation flipY", options: { imageOrientation: "flipY" } },
    { name: "imageOrientation flipY and premultiplyAlpha none", options: { imageOrientation: "flipY", premultiplyAlpha: "none" } },
];

for (const crop of kExifCrops) {
    for (const variant of kExifVariants) {
        promise_test(async t => {
            const image = await loadImage("resources/squares_6.jpg");
            const bitmap = await createImageBitmap(image, ...crop.rect, variant.options);
            t.add_cleanup(() => bitmap.close());
            assert_equals(bitmap.width, 80, "width");
            assert_equals(bitmap.height, 80, "height");

            const canvas = document.createElement("canvas");
            canvas.width = 80;
            canvas.height = 80;
            canvas.getContext("2d").drawImage(bitmap, 0, 0);

            checkUniformColor(canvas, 80, 80, crop.expected, 2);
        }, `createImageBitmap with EXIF rotation and a crop rect of its ${crop.name} tile, ${variant.name}`);
    }
}
</script>
</body>
</html>
