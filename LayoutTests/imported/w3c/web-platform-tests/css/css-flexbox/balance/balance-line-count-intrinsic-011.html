<!DOCTYPE html>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-flexbox-2/#flex-line-count-property">
<link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#intrinsic-item-contributions">
<link rel="stylesheet" href="/fonts/ahem.css">
<meta name="assert" content="Tests that a balanced row flexbox sized at its max-content width leaves its flexible items room for their max-content contributions, so their text does not wrap.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<style>
.flex {
  display: flex;
  width: max-content;
  gap: 20px;
  flex-wrap: balance;
  flex-line-count: 2;
  font: 10px/1 Ahem;
}
</style>
<!-- Each item's max-content contribution is 50px, though its 0% flex basis is smaller than its 20px min-content size. -->
<div class="flex" data-expected-width="120" data-expected-height="40">
  <div style="flex: 1;" data-expected-height="10">XX XX</div>
  <div style="flex: 1;" data-expected-height="10">XX XX</div>
  <div style="flex: 1;" data-expected-height="10">XX XX</div>
</div>
<!-- An item that can't grow contributes no more than its 30px flex basis, which its 20px min-content size fits in. -->
<div class="flex" data-expected-width="80" data-expected-height="60">
  <div style="flex: 0 1 30px;" data-expected-height="20">XX XX</div>
  <div style="flex: 0 1 30px;" data-expected-height="20">XX XX</div>
  <div style="flex: 0 1 30px;" data-expected-height="20">XX XX</div>
</div>
<script>
document.fonts.ready.then(() => checkLayout('.flex'));
</script>
