}

.flex > div {
  writing-mode: vertical-rl;
  background: green;
  line-height: 0;
}

  display: inline-block;
  width: 50px;
  height: 60px;
}
</style>

<div class="flex" style="flex-wrap: wrap">
  <div>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
<div class="flex" style="flex-wrap: balance">
  <div>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
