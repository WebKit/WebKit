<!DOCTYPE html>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-flexbox-2/#flex-line-count-property">
<link rel="match" href="balance-available-size-001-ref.html">
<meta name="assert" content="Tests that the available-size for measuring is updated when flex-line-count changes.">
<style>
#flex {
  display: flex;
  flex-direction: column;
  flex-wrap: balance;
  flex-line-count: 1;
  gap: 20px;
  width: 220px;
}

#flex > div {
  background: green;
  line-height: 0;
}

span {
  display: inline-block;
  width: 100px;
  height: 50px;
}
</style>
<p>There should be three (3) green squares below.</p>
<div id="flex">
  <div>
    <span></span><span></span>
  </div>
  <div>
    <span></span><span></span>
  </div>
  <div>
    <span></span><span></span>
  </div>
</div>
<script>
document.body.offsetTop;
document.getElementById('flex').style.flexLineCount = '2';
</script>
