<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Flexible Box Layout Module Level 1: parsing flex with invalid values</title>
<link rel="author" title="Eric Willigers" href="mailto:ericwilligers@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-flexbox/#propdef-flex">
<meta name="assert" content="flex supports only the grammar 'none | [ <‘flex-grow’> <‘flex-shrink’>? || <‘flex-basis’> ]'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_invalid_value("flex", "none 1");
test_invalid_value("flex", "2 3 4");
test_invalid_value("flex", "5px 7%");
test_invalid_value("flex", "9 none");
test_invalid_value("flex", "junk");
test_invalid_value("flex", "-2");
test_invalid_value("flex", "1 -1");
test_invalid_value("flex", "1,");
test_invalid_value("flex", "-1 5");
test_invalid_value("flex", "-1 -1");
test_invalid_value("flex", "auto 2em");
test_invalid_value("flex", "2px 4px");
test_invalid_value("flex", "0px 0px");
test_invalid_value("flex", "1 3px 2");
test_invalid_value("flex", "1 auto 1");
test_invalid_value("flex", "1 2 3");
test_invalid_value("flex", "1 0 3");
test_invalid_value("flex", "1 -2 3px");
test_invalid_value("flex", "1 2px 3px");
test_invalid_value("flex", "1 2px auto");
test_invalid_value("flex", "0px 0px 0");
test_invalid_value("flex", "0 0px 0");
test_invalid_value("flex", "0 2 3");
test_invalid_value("flex", "0 0 1");
test_invalid_value("flex", "0 0 0 0");
test_invalid_value("flex", "0 0 0px 0");
test_invalid_value("flex", "0 0 0px 0px");
test_invalid_value("flex", "1, 2, 3px");
test_invalid_value("flex", "1 2 calc(0)");
test_invalid_value("flex", "1 2 calc(3 - 3)");
</script>
</body>
</html>
