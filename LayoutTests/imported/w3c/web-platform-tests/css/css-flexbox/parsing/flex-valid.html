<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Flexible Box Layout Module Level 1: parsing flex with valid values</title>
<link rel="author" title="Eric Willigers" href="mailto:ericwilligers@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-flexbox/#propdef-flex">
<meta name="assert" content="flex supports the full grammar 'none | [ <‘flex-grow’> <‘flex-shrink’>? || <‘flex-basis’> ]'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
<style>
  #container {
    container-type: inline-size;
    width: 10px;
  }
  #target {
    font-size: 40px;
  }
</style>
</head>
<body>
<div id="container">
    <div id="target"></div>
</div>
<script>
test_valid_value("flex", "none", "0 0 auto");
test_valid_value("flex", "1", "1 1 0%");
test_valid_value("flex", "2 3", "2 3 0%");
test_valid_value("flex", "4 5 6px");
test_valid_value("flex", "6px 4 5", "4 5 6px");
test_valid_value("flex", "6px 4", "4 1 6px");
test_valid_value("flex", "6px", "1 1 6px");
test_valid_value("flex", "7% 8", "8 1 7%");
test_valid_value("flex", "8 auto", "8 1 auto");
test_valid_value("flex", "2", "2 1 0%");
test_valid_value("flex", "0", "0 1 0%");
test_valid_value("flex", "1.5", "1.5 1 0%");
test_valid_value("flex", "auto", "1 1 auto");
test_valid_value("flex", "1px", "1 1 1px");
test_valid_value("flex", "2em", "1 1 2em");
test_valid_value("flex", "0px", "1 1 0px");
test_valid_value("flex", "2 auto", "2 1 auto");
test_valid_value("flex", "4 0px", "4 1 0px");
test_valid_value("flex", "1 0", "1 0 0%");
test_valid_value("flex", "0 0", "0 0 0%");
test_valid_value("flex", "0 1", "0 1 0%");
test_valid_value("flex", "0 0px", "0 1 0px");
test_valid_value("flex", "auto 5.25", "5.25 1 auto");
test_valid_value("flex", "auto 0", "0 1 auto");
test_valid_value("flex", "auto 3", "3 1 auto");
test_valid_value("flex", "0px 0", "0 1 0px");
test_valid_value("flex", "3 4px", "3 1 4px");
test_valid_value("flex", "6em 4", "4 1 6em");
test_valid_value("flex", "1 2 0", "1 2 0px");
test_valid_value("flex", "1 2 auto");
test_valid_value("flex", "0 0 0", "0 0 0px");
test_valid_value("flex", "auto 0 0", "0 0 auto");
test_valid_value("flex", "1.75 2 3px");
test_valid_value("flex", "3px 1 2", "1 2 3px");
test_valid_value("flex", "1 1 10em", "1 1 10em");
test_valid_value("flex", "1 1 calc(10em)", "1 1 calc(10em)");
test_valid_value("flex", "1 1 calc(-10em)", "1 1 calc(-10em)");
test_valid_value("flex", "calc(10 + (sign(20cqw - 10px) * 5)) calc(10 + (sign(20cqw - 10px) * 5)) 1px", "calc(10 + (5 * sign(20cqw - 10px))) calc(10 + (5 * sign(20cqw - 10px))) 1px");
test_valid_value("flex", "1 1 calc(10px + (sign(20cqw - 10px) * 5px))", "1 1 calc(10px + (5px * sign(20cqw - 10px)))");
test_valid_value("flex", "calc(1) calc(2 + 1) calc(3px)", "calc(1) calc(3) calc(3px)");
test_valid_value("flex", "calc(-1) calc(-1) 0", "calc(-1) calc(-1) 0px");
test_valid_value("flex", "1 2 calc(10px + 50%)", "1 2 calc(50% + 10px)");
test_valid_value("flex", "calc(20px + 40%) 4 3", "4 3 calc(40% + 20px)");

// The following is not yet supported by browsers:
// test_valid_value("flex", "content");
</script>
</body>
</html>
