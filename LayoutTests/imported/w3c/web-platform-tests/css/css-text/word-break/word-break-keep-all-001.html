<!DOCTYPE html>
<html  lang="en" >
<head>
<meta charset="utf-8">
<title>word-break: keep-all, japanese</title>
<meta name="assert" content="word-break: keep-all means breaking is forbidden within 'words'.  In this style, sequences of CJK characters do not break, nor around brackets; breaks after ideographic commas are allowed.">
<link rel='help' href='https://drafts.csswg.org/css-text-3/#word-break-property'>
<link rel='match' href='reference/word-break-keep-all-ref-001.html'>
<link rel='author' title='Richard Ishida' href='mailto:ishida@w3.org'>
<style type='text/css'>
.test > div { word-break: keep-all; width: 1ch; }
/* the CSS below is not part of the test */
.test, .ref { float: left; border: 1px solid orange;  margin: 20px;  padding: 10px; width: 13em; font: 24px/1 sans-serif; }
.ref > div { white-space: nowrap; }
</style>
</head>
<body>
<div id='instructions'>Test passes if the two orange boxes are the same.</div>
<div class="test" lang="ja"><div>彼は、「往復切符（普通席）は、1,250円です。」と言った。</div></div>
<div class="ref" lang="ja"><div>彼は、<br/>「往復切符（普通席）は、<br/>1,250円です。」と言った。</div></div>
</body>
</html>
