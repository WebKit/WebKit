<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp on a button with display: flex does not clamp its content</title>
<link rel="author" title="Christian Biesinger" href="mailto:cbiesinger@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#max-lines">
<link rel="help" href="https://html.spec.whatwg.org/multipage/rendering.html#button-layout">
<link rel="match" href="reference/line-clamp-form-button-007-ref.html">
<meta name="assert" content="A button with display: flex behaves as a flex container, which is not a block container, so line-clamp on it does not clamp the lines of its content.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
body {
  font: 25px/1 Ahem;
}
button {
  font: inherit;
  width: 150px;
}
.clamp {
  line-clamp: 2;
}
</style>

<div>
  <button class="clamp" style="display: flex"><span>XX<br>XX<br>XX<br>XX</span></button>
</div>
