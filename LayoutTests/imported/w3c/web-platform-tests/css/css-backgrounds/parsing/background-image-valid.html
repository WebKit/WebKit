<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Backgrounds and Borders Module Level 3: parsing background-image with valid values</title>
<link rel="author" title="Eric Willigers" href="mailto:ericwilligers@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-backgrounds/#background-image">
<meta name="assert" content="background-image supports the full grammar '<bg-image>#'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_valid_value("background-image", "none");

// Safari removes quotes.
test_valid_value("background-image", 'url("http://www.example.com/")', ['url("http://www.example.com/")', 'url(http://www.example.com/)']);
test_valid_value("background-image", 'none, url("http://www.example.com/")', ['none, url("http://www.example.com/")', 'none, url(http://www.example.com/)']);

test_valid_value("background-image", 'light-dark(url("a.png"), url("b.png"))');
test_valid_value("background-image", 'light-dark(linear-gradient(red), url("b.png"))');
test_valid_value("background-image", 'light-dark(image(blue), url("b.png"))');
test_valid_value("background-image", 'light-dark(image-set(url("a.png") 1x), image-set(url("b.png") 2x))');
test_valid_value("background-image", 'light-dark(image-set("a.png" 1x), image-set("b.png" 2x))', ['light-dark(image-set("a.png" 1x), image-set("b.png" 2x))', 'light-dark(image-set(url("a.png") 1x), image-set(url("b.png") 2x))']);

test_valid_value("background-image", "linear-gradient(red)");
test_valid_value("background-image", "linear-gradient(red 0%)");
test_valid_value("background-image", "linear-gradient(red 0, blue)", "linear-gradient(red 0px, blue)");
test_valid_value("background-image", "linear-gradient(red 10px, blue 20px)");
test_valid_value("background-image", "linear-gradient(to top, red, blue)");
test_valid_value("background-image", "linear-gradient(to top left, red, blue)", "linear-gradient(to left top, red, blue)");
test_valid_value("background-image", "linear-gradient(10deg, red 0%, 25%, blue)");
test_valid_value("background-image", "repeating-linear-gradient(red, blue)");

test_valid_value("background-image", "radial-gradient(red, blue)");
test_valid_value("background-image", "radial-gradient(farthest-corner, red, blue)", "radial-gradient(red, blue)");
test_valid_value("background-image", "radial-gradient(closest-side, red, blue)");
test_valid_value("background-image", "radial-gradient(ellipse, red, blue)", "radial-gradient(red, blue)");
test_valid_value("background-image", "radial-gradient(ellipse farthest-corner, red, blue)", "radial-gradient(red, blue)");
test_valid_value("background-image", "radial-gradient(ellipse closest-side, red, blue)", "radial-gradient(closest-side, red, blue)");
test_valid_value("background-image", "radial-gradient(ellipse 10px 20px, red, blue)", "radial-gradient(10px 20px, red, blue)");
test_valid_value("background-image", "radial-gradient(circle, red, blue)");
test_valid_value("background-image", "radial-gradient(circle farthest-corner, red, blue)", "radial-gradient(circle, red, blue)");
test_valid_value("background-image", "radial-gradient(circle closest-side, red, blue)");
test_valid_value("background-image", "radial-gradient(circle 10px, red, blue)", "radial-gradient(10px, red, blue)");
test_valid_value("background-image", "repeating-radial-gradient(red, blue)");

test_valid_value(
    "background-image",
    "cross-fade(50% url(http://www.example.com), 50% url(http://www.example.com))", [
        "cross-fade(url(http://www.example.com) 50%, url(http://www.example.com) 50%)",
        'cross-fade(url("http://www.example.com") 50%, url("http://www.example.com") 50%)'
    ]);
test_valid_value(
    "background-image",
    "cross-fade(red 33%, white 33%, blue)");
test_valid_value(
    "background-image",
    "cross-fade(blue, linear-gradient(90deg, rgb(2, 0, 36) 0%, rgb(0, 212, 255) 100%))");
test_valid_value("background-image", "cross-fade( 1% red, green)", "cross-fade(red 1%, green)");
test_valid_value("background-image", "cross-fade(1% red , green)", "cross-fade(red 1%, green)");
test_valid_value("background-image", "cross-fade(1% red, green )", "cross-fade(red 1%, green)");
test_valid_value("background-image", "cross-fade(red 1%, cross-fade(red 2%, green))");
</script>
</body>
</html>
