<!DOCTYPE html>
<title>CSS Position Reference</title>
<style>
body {
  margin: 0;
}
#block {
  position: absolute;
  top: 0;
  right: 0;
  width: 200px;
  height: 300px;
  background: green;
}
#abspos {
  position: absolute;
  top: 100px;
  right: 200px;
  width: 50px;
  height: 50px;
  background: black;
}
</style>
<div id="block"></div>
<div id="abspos"></div>
