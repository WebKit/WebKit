<!DOCTYPE html>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: base;
    src: url(support/fonts/LigatureSymbolsWithSpaces.woff);
  }
  @font-face {
    font-family: swoosh;
    src: url(support/fonts/Rochester.otf);
    unicode-range: U+26;
  }
  .ref {
    font-family: base;
  }
  .ref .amp {
	  font-family: swoosh, base;
  }
  div {
	  font-size: 5em;
  }
</style>
<body>
  <div class="ref"><span class="amp">A&amp;</span></div>
  <div class="ref">This <span class="amp">&amp;</span> That</div>
</body>
