<!DOCTYPE html>
<title>CSS Lists: counters updated when an element that changes them starts generating a box</title>
<link rel="help" href="https://drafts.csswg.org/css-lists/#auto-numbering">
<link rel="match" href="counter-increment-box-generated-update-ref.html">
<style>
div {
  counter-reset: c;
}
div::after {
  content: counter(c);
}
.increment {
  counter-increment: c;
}
.hidden {
  display: none;
}
.position {
  position: absolute;
  counter-increment: c;
}
#reset {
  counter-reset: c;
}
#set {
  counter-set: c 5;
}
</style>
<div><span id="increment" class="increment hidden"></span></div>
<div><span id="position"></span></div>
<div><span class="increment"></span><span id="reset" class="hidden"></span><span class="increment"></span></div>
<div><span class="increment"></span><span id="set" class="hidden"></span><span class="increment"></span></div>
<script>
  document.documentElement.offsetTop;
  for (const id of ["increment", "reset", "set"])
    document.getElementById(id).classList.remove("hidden");
  document.getElementById("position").classList.add("position");
</script>
