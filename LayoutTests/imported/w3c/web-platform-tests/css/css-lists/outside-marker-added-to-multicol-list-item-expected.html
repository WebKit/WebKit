<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: an outside marker added to a multi-column list item aligns with its first formatted line (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; width: 200px; columns: 2; }
</style>

<p>The test passes if the bullet is aligned with the upper "x".</p>

<ul><li><div>x</div><div>x</div></li></ul>
