<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: an outside marker added to a multi-column list item aligns with its first formatted line</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-added-to-multicol-list-item-ref.html">
<meta name="assert" content="A marker generated after the list item became a multi-column container is placed the same as one the list item had from the start.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; width: 200px; columns: 2; }
</style>

<p>The test passes if the bullet is aligned with the upper "x".</p>

<ul><li id="item" style="list-style-type: none"><div>x</div><div>x</div></li></ul>
<script>
  document.body.offsetHeight;
  document.getElementById("item").style.listStyleType = "disc";
  document.body.offsetHeight;
</script>
