<!DOCTYPE html>
<html>
<head>
<title>CSS zoom: absolutely positioned iframe inserted into an already laid out container</title>
<link rel="help" href="https://drafts.csswg.org/css-viewport/#zoom-property">
<link rel="match" href="iframe-abspos-zoom-late-insert-ref.html">
<style>
  html { zoom: 1.25; }
  body { margin: 0; }
  #box { position: fixed; top: 150px; left: 0; right: 0; bottom: 0; background: magenta; }
  #box iframe { position: absolute; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="box"></div>
<script>
  document.body.offsetHeight;                     // lay out the empty box first
  const frame = document.createElement("iframe"); // then insert the iframe into it
  frame.srcdoc = "<style>body { margin: 0; background: green; }</style>";
  document.getElementById("box").append(frame);
</script>
</body>
</html>
