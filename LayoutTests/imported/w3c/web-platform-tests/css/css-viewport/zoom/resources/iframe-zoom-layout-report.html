<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; }
  #viewport-width { width: 100vw; height: 10px; }
  #fill { height: 10px; }
</style>
<div id="viewport-width"></div>
<div id="fill"></div>
<script>
// Replies with the sizes layout produced, since a cross-origin parent cannot read this document.
addEventListener("message", event => {
  parent.postMessage({
    tag: event.data,
    fill: document.getElementById("fill").offsetWidth,
    viewportWidth: document.getElementById("viewport-width").offsetWidth,
    clientWidth: document.documentElement.clientWidth,
  }, "*");
});
</script>
