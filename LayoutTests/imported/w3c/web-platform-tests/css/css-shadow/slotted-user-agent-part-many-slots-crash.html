<!doctype html>
<link rel="help" href="https://drafts.csswg.org/css-scoping/#slotted-pseudo">
<div id="host"><details open><summary>Summary</summary>Details content</details></div>
<script>
let host = document.getElementById("host");
for (let i = 0; i < 200; i++) {
  host = host.attachShadow({ mode: "open" }).appendChild(document.createElement("div"));
  host.appendChild(document.createElement("slot"));
}
document.body.offsetWidth;
</script>
