  <title>CSS Shape Test: float left, half-border-box with asymmetric borders, padding and margin reference</title>

  .container {
    position: relative;
    width: 400px;
  }

  .shape {
    float: left;
    box-sizing: content-box;
    background-color: orange;
    border-style: solid;
    border-color: lightgreen;
    width: 200px;
    height: 200px;
    padding: 10px;
    border-width: 10px 30px 20px 40px;
    margin: 10px;

  .box {

    height: 5px;
    background-color: blue;
  }
