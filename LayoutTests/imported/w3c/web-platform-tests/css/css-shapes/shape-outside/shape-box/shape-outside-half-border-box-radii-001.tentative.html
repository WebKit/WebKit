<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Shape Test: float left, half-border-box with border-radius (001)</title>
<link rel="help" href="https://drafts.csswg.org/css-shapes-1/#valdef-shape-box-half-border-box">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14794">
<link rel="match" href="reference/shape-outside-half-border-box-radii-001.tentative-ref.html">
<meta name="assert" content="Text should wrap around a float whose half-border-box has 40px corner radii (a 50px border-radius less half of the 20px border). Expected shape: inset(10px round 40px). The spec does not define the radii yet: https://github.com/w3c/csswg-drafts/issues/14794">
<style>
    .container {
        width: 500px;
    }

    .shape {
        float: left;
        box-sizing: content-box;
        background-color: orange;
        border-style: solid;
        border-color: lightgreen;
        width: 200px;
        height: 200px;
        border-width: 20px;
        border-radius: 50px;
        shape-outside: half-border-box;
    }

    .line {
        line-height: 0;
        height: 5px;
    }

    .box {
        display: inline-block;
        width: 5px;
        height: 5px;
        background-color: blue;
    }
</style>
</head>
<body>
<p>Text should wrap around a float whose half-border-box has 40px corner radii (a 50px border-radius less half of the 20px border). Expected shape: inset(10px round 40px).</p>
<main class="container">

    <div class="line"><div class="box"></div></div>
