<title>CSS Shape Test: float left, half-border-box with border-radius (001) (reference)</title>
<style>
    .container {
        width: 500px;
    }

    .shape {
        float: left;
        box-sizing: content-box;
        background-color: orange;
        border-style: solid;
        border-color: lightgreen;
        width: 200px;
        height: 200px;
        border-width: 20px;
        border-radius: 50px;
        shape-outside: inset(10px round 40px) border-box;
    }

    .line {
        line-height: 0;
        height: 5px;
    }

    .box {
        display: inline-block;
        width: 5px;
        height: 5px;
        background-color: blue;
    }
</style>
</head>
<body>
<p>Text should wrap around a float whose half-border-box has 40px corner radii (a 50px border-radius less half of the 20px border). Expected shape: inset(10px round 40px).</p>
