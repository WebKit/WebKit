<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <title>CSS Shape Test: float left, half-border-box</title>
  <link rel="help" href="https://drafts.csswg.org/css-shapes-1/#valdef-shape-box-half-border-box">
  <link rel="match" href="reference/shape-outside-half-border-box-001-ref.html">
  <meta name="assert" content="Test that content wraps around the left float shape defined by the half-border-box value: the box midway between the padding-box and the border-box.">
  <style>
  .container {
    width: 300px;
  }

  .shape {
    float: left;
    box-sizing: content-box;
    background-color: orange;
    border-style: solid;
    border-color: lightgreen;
    width: 200px;
    height: 200px;
    border-width: 20px;
    shape-outside: half-border-box;
  }

  .line {
    line-height: 0;
    height: 10px;
  }

  .box {
    display: inline-block;
    vertical-align: top;
    width: 10px;
    height: 10px;
    background-color: blue;
  }
  </style>

  <main class="container">
    <div class="shape"></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
  </main>
</html>
