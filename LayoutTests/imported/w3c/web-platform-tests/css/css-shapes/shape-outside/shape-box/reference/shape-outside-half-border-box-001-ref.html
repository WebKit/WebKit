<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <title>CSS Shape Test: float left, half-border-box reference</title>
  <style>
  .container {
    position: relative;
    width: 300px;
  }

  .shape {
    float: left;
    box-sizing: content-box;
    background-color: orange;
    border-style: solid;
    border-color: lightgreen;
    width: 200px;
    height: 200px;
    border-width: 20px;
  }

  .box {
    position: absolute;
    width: 10px;
    height: 10px;
    background-color: blue;
  }
  </style>

  <main class="container">
    <div class="shape"></div>
    <div class="box" style="top: 0px; left: 0px"></div>
    <div class="box" style="top: 10px; left: 230px"></div>
    <div class="box" style="top: 20px; left: 230px"></div>
    <div class="box" style="top: 30px; left: 230px"></div>
    <div class="box" style="top: 40px; left: 230px"></div>
    <div class="box" style="top: 50px; left: 230px"></div>
    <div class="box" style="top: 60px; left: 230px"></div>
    <div class="box" style="top: 70px; left: 230px"></div>
    <div class="box" style="top: 80px; left: 230px"></div>
    <div class="box" style="top: 90px; left: 230px"></div>
    <div class="box" style="top: 100px; left: 230px"></div>
    <div class="box" style="top: 110px; left: 230px"></div>
    <div class="box" style="top: 120px; left: 230px"></div>
    <div class="box" style="top: 130px; left: 230px"></div>
    <div class="box" style="top: 140px; left: 230px"></div>
    <div class="box" style="top: 150px; left: 230px"></div>
    <div class="box" style="top: 160px; left: 230px"></div>
    <div class="box" style="top: 170px; left: 230px"></div>
    <div class="box" style="top: 180px; left: 230px"></div>
    <div class="box" style="top: 190px; left: 230px"></div>
    <div class="box" style="top: 200px; left: 230px"></div>
    <div class="box" style="top: 210px; left: 230px"></div>
    <div class="box" style="top: 220px; left: 230px"></div>
    <div class="box" style="top: 230px; left: 0px"></div>
  </main>
</html>
