<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <title>CSS Shape Test: float left, half-border-box with asymmetric borders, padding and margin</title>
  <link rel="help" href="https://drafts.csswg.org/css-shapes-1/#valdef-shape-box-half-border-box">
  <link rel="match" href="reference/shape-outside-half-border-box-002-ref.html">
  <meta name="assert" content="Test that the half-border-box value insets each edge of the border-box by half of the corresponding border width, and is unaffected by padding and margin.">
  <style>
  .container {
    width: 400px;
  }

  .shape {
    float: left;
    box-sizing: content-box;
    background-color: orange;
    border-style: solid;
    border-color: lightgreen;
    width: 200px;
    height: 200px;
    padding: 10px;
    border-width: 10px 30px 20px 40px;
    margin: 10px;
    shape-outside: half-border-box;
  }

  .line {
    line-height: 0;
    height: 5px;
  }

  .box {
    display: inline-block;
    vertical-align: top;
    width: 5px;
    height: 5px;
    background-color: blue;
  }
  </style>

  <main class="container">
    <div class="shape"></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
    <div class="line"><div class="box"></div></div>
