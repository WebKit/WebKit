<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Masking: clip-path: half-border-box with border-radius (reference)</title>
<style>
    div {
        position: absolute;
        left: 50px;
        top: 50px;
        box-sizing: content-box;
        width: 200px;
        height: 200px;
        padding: 10px;
        border: solid green;
        border-width: 10px 30px 20px 40px;
        border-radius: 50px 5px 100px 0;
        background-color: blue;
        clip-path: inset(5px 15px 10px 20px round 30px 0 85px 0 / 45px 0 90px 0) border-box;
    }
</style>
</head>
<body>
<p>Clipped to the half-border-box: border-radius minus half of each adjacent border width, clamped to zero.</p>
<div></div>
</body>
</html>
