<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml">
<g id="testmeta">
  <title>CSS Masking: masked element inside a pattern painted at two different scales</title>
  <html:link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com"/>
  <html:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/render.html#ClippingAndMasking"/>
  <html:link rel="match" href="reference/mask-in-pattern-different-scales-ref.svg"/>
  <metadata class="flags">svg</metadata>
</g>
<mask id="mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
  <rect width="50" height="100" fill="white"/>
  <rect x="51" width="49" height="100" fill="white"/>
</mask>
<pattern id="pattern" patternUnits="userSpaceOnUse" width="100" height="100">
  <rect width="100" height="100" fill="green" mask="url(#mask)"/>
</pattern>
<!-- Paints the masked element at a quarter of the size first, then covers it. -->
<rect transform="translate(150 0) scale(0.25)" width="100" height="100" fill="url(#pattern)"/>
<rect x="150" width="25" height="25" fill="green"/>
<rect width="100" height="100" fill="url(#pattern)"/>
</svg>
