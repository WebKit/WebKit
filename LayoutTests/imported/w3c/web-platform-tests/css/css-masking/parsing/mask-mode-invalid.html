<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Masking Module Level 1: parsing mask-mode with invalid values</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.fxtf.org/css-masking-1/#the-mask-mode">
<meta name="assert" content="mask-mode supports only the grammar '<masking-mode>#'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_invalid_value("mask-mode", "auto");
test_invalid_value("mask-mode", "none");
test_invalid_value("mask-mode", "alpha luminance");
test_invalid_value("mask-mode", "alpha,");
test_invalid_value("mask-mode", ", alpha");
test_invalid_value("mask-mode", "rubbish");
test_invalid_value("mask-mode", "center");
test_invalid_value("mask-mode", "repeat");
</script>
</body>
</html>
