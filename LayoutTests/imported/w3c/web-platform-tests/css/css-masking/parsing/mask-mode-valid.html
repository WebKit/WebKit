<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Masking Module Level 1: parsing mask-mode with valid values</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.fxtf.org/css-masking-1/#the-mask-mode">
<meta name="assert" content="mask-mode supports the full grammar '<masking-mode>#'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>

<body>
<script>
test_valid_value("mask-mode", "alpha");
test_valid_value("mask-mode", "luminance");

test_valid_value("mask-mode", "alpha, alpha, alpha, alpha");
test_valid_value("mask-mode", "match-source, alpha, luminance, luminance");
</script>
