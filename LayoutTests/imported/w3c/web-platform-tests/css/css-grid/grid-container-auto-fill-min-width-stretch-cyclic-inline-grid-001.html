<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: A stretch min-width is no constraint for repeat(auto-fill) when the containing block is a grid with an auto track</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#auto-repeat">
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#stretch-fit-sizing">
<link rel="match" href="grid-container-auto-fill-min-width-stretch-cyclic-inline-grid-001-ref.html">
<meta name="assert" content="The auto column of the outer inline grid is sized from the inner grid container's intrinsic size, so the inner container's stretch min-width is cyclic and behaves as auto: repeat(auto-fill) repeats once, and the outer grid is as wide as one 50px column. Both items are in the only column.">
<style>
.outer {
  display: inline-grid;
  grid-template-columns: auto;
}
.grid {
  display: grid;
  grid-auto-rows: 50px;
  grid-template-columns: repeat(auto-fill, 50px);
  min-width: stretch;
  background: grey;
}
.grid > div:nth-child(1) { grid-column: 1; background: green; }
.grid > div:nth-child(2) { grid-column: -2; background: lime; }
</style>
<div class="outer">
  <div class="grid"><div></div><div></div></div>
</div>
