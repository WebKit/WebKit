<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: changing the height of the rendered legend of a grid fieldset with an automatic width and a height</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/rendering.html#the-fieldset-and-legend-elements">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-item">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
body { margin: 0; }
/* The tracks do not depend on the content and the fieldset has an automatic width and a height. */
fieldset {
  display: grid;
  margin: 0;
  padding: 5px;
  border: 10px solid blue;
  height: 100px;
  grid-template-columns: 100px;
  grid-template-rows: 20px;
}
legend { padding: 0; width: 60px; line-height: 20px; white-space: pre; }
.item { background: orange; }
</style>
<div><fieldset id="f"><legend id="legend">a</legend><div class="item" id="item"></div></fieldset></div>
<script>
const f = document.getElementById("f");
const legend = document.getElementById("legend");
const item = document.getElementById("item");

// The height of the fieldset, then the rect of the legend and the item relative to the fieldset.
function state() {
  const c = f.getBoundingClientRect();
  const l = legend.getBoundingClientRect();
  const r = item.getBoundingClientRect();
  return `${c.height} | legend ${l.left - c.left},${l.top - c.top} ${l.width}x${l.height} | item ${r.left - c.left},${r.top - c.top} ${r.width}x${r.height}`;
}

test(() => {
  assert_equals(state(), "130 | legend 15,0 60x20 | item 15,25 100x20");

  // The legend is not a grid item, but it moves the content box of the fieldset.
  legend.firstChild.data = "a\nb\nc";
  assert_equals(state(), "130 | legend 15,0 60x60 | item 15,65 100x20", "the legend gets taller");

  legend.firstChild.data = "a";
  assert_equals(state(), "130 | legend 15,0 60x20 | item 15,25 100x20", "the legend gets shorter");
}, "Changing the height of the rendered legend");
</script>
