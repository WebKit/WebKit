<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: Last baseline of a grid container with an item spanning into the last row</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-baselines">
<link rel="help" href="https://drafts.csswg.org/css-align-3/#baseline-export">
<meta name="flags" content="ahem">
<link rel="stylesheet" href="/fonts/ahem.css">
<meta name="assert" content="A block grid container's last baseline comes from the last row containing a grid item. Of the items intersecting that row, including those spanning into it, the one encountered last in row-major grid order (the one ending in the last column) provides it.">
<style>
body { margin: 0; font: 20px/20px Ahem; }
.ref { width: 10px; height: 100px; background: gray; }
.flex { display: flex; position: relative; align-items: baseline; margin-bottom: 10px; }
.last { align-items: last baseline; }
.fc { display: flex; }
.grid { display: grid; grid-template-columns: 100px 100px; background: lightblue; }
.grid > div { background: yellow; }
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<body onload="checkLayout('.fc, .inline')">
<div id="log"></div>
<!-- A spans rows 1-2 in column 2, B is in row 2 column 1: the last row holds both, and A is encountered last in the row. -->
<div class="flex last">
  <div class="ref"></div>
  <div class="fc" data-offset-y="81">
    <div class="grid" style="grid-template-rows: 40px 40px;">
      <div style="grid-area: 1 / 2 / 3 / 3; padding-top: 3px;">A</div>
      <div style="grid-area: 2 / 1; padding-top: 12px;">B</div>
    </div>
  </div>
</div>
<!-- A spans rows 1-2 in column 1, B in row 2 column 2. B is last. -->
<div class="flex last">
  <div class="ref"></div>
  <div class="fc" data-offset-y="32">
    <div class="grid" style="grid-template-rows: 40px 40px;">
      <div style="grid-area: 1 / 1 / 3 / 2; padding-top: 3px;">A</div>
      <div style="grid-area: 2 / 2; padding-top: 12px;">B</div>
    </div>
  </div>
</div>
<!-- Only an item spanning into the last row. -->
<div class="flex last">
  <div class="ref"></div>
  <div class="fc" data-offset-y="78">
    <div class="grid" style="grid-template-rows: 40px 40px;">
      <div style="grid-area: 1 / 1 / 3 / 2; padding-top: 6px;">A</div>
      <div style="grid-area: 1 / 2; padding-top: 12px;">B</div>
    </div>
  </div>
</div>
<!-- Cells are visited back to front for the last baseline: A, which spans all three columns, ends last, so it wins over B in column 2. -->
<div class="flex last">
  <div class="ref"></div>
  <div class="fc" data-offset-y="81">
    <div class="grid" style="grid-template-columns: 100px 100px 100px; grid-template-rows: 40px;">
      <div style="grid-area: 1 / 1 / 2 / 4; padding-top: 3px;">A</div>
      <div style="grid-area: 1 / 2; padding-top: 12px;">B</div>
    </div>
  </div>
</div>
