<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: Baselines come from the first and last row containing a grid item</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-baselines">
<link rel="help" href="https://drafts.csswg.org/css-align-3/#baseline-export">
<meta name="flags" content="ahem">
<link rel="stylesheet" href="/fonts/ahem.css">
<meta name="assert" content="The first (last) baseline of a grid container comes from the first (last) row that contains a grid item, not from an empty first (last) explicit row.">
<style>
body { margin: 0; font: 20px/20px Ahem; }
.ref { width: 10px; height: 100px; background: gray; }
.flex { display: flex; position: relative; align-items: baseline; margin-bottom: 10px; }
.last { align-items: last baseline; }
.fc { display: flex; }
.grid { display: grid; grid-template-columns: 100px 100px; background: lightblue; }
.grid > div { background: yellow; }
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<body onload="checkLayout('.fc')">
<div id="log"></div>
<!-- Row 1 and row 3 are empty. Row 2 holds both items. -->
<div class="flex">
  <div class="ref"></div>
  <div class="fc" data-offset-y="41">
    <div class="grid" style="grid-template-rows: 40px 40px 40px;">
      <div style="grid-row: 2; padding-top: 3px;">A</div>
      <div style="grid-row: 2; padding-top: 9px;">B</div>
    </div>
  </div>
</div>
<div class="flex last">
  <div class="ref"></div>
  <div class="fc" data-offset-y="35">
    <div class="grid" style="grid-template-rows: 40px 40px 40px;">
      <div style="grid-row: 2; padding-top: 3px;">A</div>
      <div style="grid-row: 2; padding-top: 9px;">B</div>
    </div>
  </div>
</div>
<!-- First baseline: the item starts in row 2, and row 1 is empty. -->
<div class="flex">
  <div class="ref"></div>
  <div class="fc" data-offset-y="39">
    <div class="grid" style="grid-template-rows: 40px 40px 40px;">
      <div style="grid-row: 2 / 4; padding-top: 5px;">A</div>
    </div>
  </div>
</div>
<!-- Last baseline: the item spans rows 1-2, and row 3 is empty. -->
<div class="flex last">
  <div class="ref"></div>
  <div class="fc" data-offset-y="79">
    <div class="grid" style="grid-template-rows: 40px 40px 40px;">
      <div style="grid-row: 1 / 3; padding-top: 5px;">A</div>
    </div>
  </div>
</div>
