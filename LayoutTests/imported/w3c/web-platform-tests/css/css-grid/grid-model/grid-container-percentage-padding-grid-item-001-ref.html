<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference for CSS Grid: a grid container's percentage padding resolves against its grid area when it is a grid item of a grid</title>
<style>
.o { display: grid; width: 400px; grid-template-columns: 100px 300px; }
.i { display: grid; grid-template-columns: 50px; padding: 30px; background: yellow; }
.i > div { height: 10px; background: green; }
</style>
<div class="o"><div></div><div class="i"><div></div></div></div>
