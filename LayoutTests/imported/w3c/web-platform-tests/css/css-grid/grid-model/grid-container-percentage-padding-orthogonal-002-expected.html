<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference for CSS Grid: a horizontal nested grid container in a vertical grid item area resolves percentage padding against the area's inline size</title>
<style>
.o { display: grid; writing-mode: vertical-rl; height: 400px; grid-template-columns: 100px 300px; }
.i { display: grid; writing-mode: horizontal-tb; grid-template-columns: 50px; padding: 30px; background: yellow; }
.i > div { height: 10px; background: green; }
</style>
<div class="o"><div></div><div class="i"><div></div></div></div>
