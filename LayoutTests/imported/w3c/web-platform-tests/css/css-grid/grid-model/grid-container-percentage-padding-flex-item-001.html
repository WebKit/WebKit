<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: a grid container's percentage padding resolves against the flex container when it is a flex item</title>
<link rel="help" href="https://drafts.csswg.org/css-box-4/#padding-props">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-item-sizing">
<link rel="match" href="grid-container-percentage-padding-flex-item-001-ref.html">
<meta name="assert" content="Guard. The flex container has 30px padding and a 400px content box. The nested grid is a flex item, so its 10% padding is 40px.">
<style>
.o { display: flex; width: 400px; padding: 30px; background: lightgray; }
.i { display: grid; grid-template-columns: 50px; padding: 10%; background: yellow; }
.i > div { height: 10px; background: green; }
</style>
<div class="o"><div class="i"><div></div></div></div>
