<!DOCTYPE html>
<meta charset="utf-8">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#explicit-grids">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#implicit-grids">
<meta name="assert" content="A grid container with no grid items has no implicit tracks and sizes its explicit tracks normally.">
<style>
.grid {
    display: grid;
}
.maxContent {
    width: max-content;
}
.paddingBorder {
    padding: 5px;
    border: 3px solid;
}
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<body onload="checkLayout('.grid')">
<div style="width: 400px">
    <!-- grid-auto-rows has no effect without items: no forced row. -->
    <div class="grid" style="grid-auto-rows: 100px" data-expected-width="400" data-expected-height="0"></div>
    <div class="grid maxContent" style="grid-auto-columns: 100px" data-expected-width="0" data-expected-height="0"></div>
    <div class="grid" style="grid-template-columns: 50px 1fr; grid-template-rows: 30px 2fr; gap: 10px" data-expected-width="400" data-expected-height="40"></div>
    <div class="grid" style="gap: 20px" data-expected-width="400" data-expected-height="0"></div>
    <div class="grid paddingBorder" style="gap: 20px" data-expected-width="400" data-expected-height="16"></div>
    <div class="grid maxContent" style="grid-template-columns: min-content 30px; gap: 7px" data-expected-width="37" data-expected-height="0"></div>
    <div class="grid" style="grid-template-rows: 1fr 2fr" data-expected-width="400" data-expected-height="0"></div>
    <div class="grid" style="grid-template-columns: 100px 100px" data-expected-width="400" data-expected-height="0"></div>
    <div class="grid maxContent" style="grid-template-columns: 100px 100px" data-expected-width="200" data-expected-height="0"></div>
</div>
</body>
