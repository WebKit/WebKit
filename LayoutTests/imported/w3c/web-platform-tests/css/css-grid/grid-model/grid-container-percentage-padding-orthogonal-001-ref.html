<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference for CSS Grid: a grid container's percentage padding uses the inline size of its containing block in the containing block's writing mode</title>
<style>
.p1 { writing-mode: vertical-rl; width: 500px; height: 300px; background: lightgray; }
.i { display: grid; grid-template-columns: 50px; background: yellow; }
.h { writing-mode: horizontal-tb; padding: 30px; }
.i > div { width: 10px; height: 10px; background: green; }
</style>
<div class="p1"><div class="i h"><div></div></div></div>
