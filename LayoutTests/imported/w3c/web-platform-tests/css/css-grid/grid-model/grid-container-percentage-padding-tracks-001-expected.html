<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference for percentage tracks of a grid item grid container</title>
<style>
.o { display: grid; width: 400px; grid-template-columns: 100px 300px; }
.i { display: grid; grid-template-columns: 120px 120px; padding: 30px; background: yellow; }
.i > div { height: 10px; background: green; }
.i > div:nth-child(2) { background: blue; }
</style>
<div class="o"><div></div><div class="i"><div></div><div></div></div></div>
