<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: a grid container's percentage padding uses the inline size of its containing block in the containing block's writing mode</title>
<link rel="help" href="https://drafts.csswg.org/css-box-4/#padding-props">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-item-sizing">
<link rel="match" href="grid-container-percentage-padding-orthogonal-001-ref.html">
<meta name="assert" content="Guard. The vertical-rl parent is 500px wide and 300px tall, so its inline size is 300px and the horizontal nested grid's 10% padding is 30px (not 50px, 10% of the parent's physical width).">
<style>
.p1 { writing-mode: vertical-rl; width: 500px; height: 300px; background: lightgray; }
.i { display: grid; grid-template-columns: 50px; padding: 10%; background: yellow; }
.h { writing-mode: horizontal-tb; }
.i > div { width: 10px; height: 10px; background: green; }
</style>
<div class="p1"><div class="i h"><div></div></div></div>
