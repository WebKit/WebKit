<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: percentage tracks of a grid item grid container resolve against its own content box</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#track-sizes">
<link rel="match" href="grid-container-percentage-padding-tracks-001-ref.html">
<meta name="assert" content="The nested grid stretches to its 300px grid area and has 10% (30px) padding, so its 50% 50% columns are 120px each, 50% of its 240px content box and not of its grid area.">
<style>
.o { display: grid; width: 400px; grid-template-columns: 100px 300px; }
.i { display: grid; grid-template-columns: 50% 50%; padding: 10%; background: yellow; }
.i > div { height: 10px; background: green; }
.i > div:nth-child(2) { background: blue; }
</style>
<div class="o"><div></div><div class="i"><div></div><div></div></div></div>
