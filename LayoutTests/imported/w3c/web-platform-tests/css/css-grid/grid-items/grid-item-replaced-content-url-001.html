<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: a grid item replaced through content:url() uses its natural size</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-item-sizing">
<link rel="help" href="https://drafts.csswg.org/css-images-3/#content-property">
<link rel="match" href="grid-item-replaced-content-url-001-ref.html">
<meta name="assert" content="A div with content:url() is a replaced element, so with normal alignment it keeps the image's natural 60x60 size rather than stretching to the 100px by 200px grid area.">
<style>
.grid { display: grid; grid-template-columns: 100px 1fr; grid-template-rows: 200px; width: 300px; }
.item { content: url(../../support/60x60-green.png); }
</style>
<div class="grid"><div class="item"></div></div>
