<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Reference: Grid container with aspect-ratio and percentage width centers its items</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
div {
  display: grid;
  place-items: center;

  width: 200px;
  height: 200px;

  border: solid;

  font-family: Ahem;
  font-size: 20px;
}
</style>
