<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: reference for a replaced grid item with a definite width transfers its size through the natural aspect ratio</title>
<style>
.grid { display: grid; grid-template-columns: 150px; grid-template-rows: 200px; }
.item { width: 100px; height: 100px; background: rgb(0, 128, 0); }
</style>
<div class="grid"><div class="item"></div></div>
