<title>CSS Grid: reference for pseudo-element grid items with content:url() are sized by the image</title>
<style>
.grid { display: grid; grid-template-columns: 60px 60px; width: 120px; }
.grid > div { width: 60px; height: 60px; background: rgb(0, 128, 0); }
</style>
