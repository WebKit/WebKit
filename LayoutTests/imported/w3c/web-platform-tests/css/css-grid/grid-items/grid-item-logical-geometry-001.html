<!DOCTYPE html>
<title>CSS Grid: a grid item's position, size and margins are in the grid container's inline and block axes</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-item-sizing">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#alignment">
<meta name="assert" content="Grid items are positioned in their grid areas by their four distinct margins and self-alignment, offset by the grid container's border and padding, which differ on each edge.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<style>
.container {
  position: relative;
}
.grid {
  display: grid;
  grid-template-columns: 100px 80px 60px;
  grid-template-rows: 50px 70px;
  column-gap: 10px;
  row-gap: 6px;
  width: 400px;
  height: 200px;
  padding: 3px 5px 7px 11px;
  border: solid;
  border-width: 2px 4px 6px 8px;
}
</style>
<body onload="checkLayout('.container')">
<div id="log"></div>

<div class="container">
<div class="grid">
  <!-- Spans two columns and the gap (190px), end-aligned inline and centered in the block axis. -->
  <div style="grid-column: 1 / 3; grid-row: 1; margin: 1px 2px 3px 4px; width: 50px; height: 20px; justify-self: end; align-self: center"
      data-offset-x="157" data-offset-y="19" data-expected-width="50" data-expected-height="20"></div>
  <!-- Stretched in both axes, the size is the area minus the margins. -->
  <div style="grid-column: 3; grid-row: 2; margin: 5px 6px 7px 8px"
      data-offset-x="227" data-offset-y="66" data-expected-width="46" data-expected-height="58"></div>
  <!-- Centered in the inline axis with only a start margin, end-aligned in the block axis. -->
  <div style="grid-column: 2; grid-row: 2; width: 30px; height: 10px; margin-left: 10px; justify-self: center; align-self: end"
      data-offset-x="159" data-offset-y="121" data-expected-width="30" data-expected-height="10"></div>
</div>
</div>
