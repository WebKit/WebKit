<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: Grid item percentage padding in an auto row</title>
<link rel="author" title="Yulun Wu" href="mailto:yulun_wu@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#item-margins">
<link rel="match" href="../../reference/ref-filled-green-100px-square.xht">
<meta name="assert" content="Checks that a grid item's percentage padding-top resolves against the inline size of its grid area, rather than against the width of the grid container, when it sizes an auto row.">
<style>
.grid {
  display: grid;
  width: 500px;
  grid-template-columns: 100px;
}
.item {
  grid-row: 1;
  grid-column: 1;
  padding-top: 100%;
  background-color: red;
}
.cover {
  grid-row: 1;
  grid-column: 1;
  width: 100px;
  height: 100px;
  background-color: green;
}
</style>

<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>

<div class="grid">
  <div class="item"></div>
  <div class="cover"></div>
</div>
