<!DOCTYPE html>
<title>CSS Grid: block-axis margins of an aspect-ratio grid item don't inflate the base size of its flexible column</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#algo-content">
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#aspect-ratio">
<link rel="match" href="grid-item-aspect-ratio-block-margin-001-ref.html">
<meta name="assert" content="The block-axis margins of a grid item with a preferred aspect ratio are not transferred through the ratio into its inline-size contribution.">
<style>
.grid { display: grid; grid-template-columns: 1fr; width: 200px; }
.item { aspect-ratio: 2 / 1; margin-block: 50px 0; background: green; }
.below { height: 20px; background: green; }
</style>
<p>Test passes if there is a green 200px-wide rectangle 100px tall, followed by a 20px-tall one.</p>
<div class="grid">
  <div class="item"></div>
  <div class="below"></div>
</div>
