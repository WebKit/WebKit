<!DOCTYPE html>
<title>CSS Grid: block-axis margins of an aspect-ratio grid item don't inflate the base size of its flexible column in a vertical grid</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#algo-content">
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#aspect-ratio">
<link rel="match" href="grid-item-aspect-ratio-block-margin-002-ref.html">
<meta name="assert" content="In a vertical-rl grid, the block-axis margins of a grid item with a preferred aspect ratio are not transferred through the ratio into its inline-size contribution.">
<style>
.grid { display: grid; writing-mode: vertical-rl; grid-template-columns: 1fr; height: 200px; }
.item { aspect-ratio: 1 / 2; margin-block: 50px 0; background: green; }
.below { block-size: 20px; background: green; }
</style>
<p>Test passes if there is a green 100px by 200px rectangle, a 50px gap to its right, and a 20px-wide green bar to its left.</p>
<div class="grid">
  <div class="item"></div>
  <div class="below"></div>
</div>
