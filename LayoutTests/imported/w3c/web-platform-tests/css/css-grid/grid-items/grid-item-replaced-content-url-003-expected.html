<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: reference for an auto track is sized by a replaced grid item's natural width</title>
<style>
.grid { display: grid; grid-template-columns: 60px 40px; width: 100px; }
.item { width: 60px; height: 60px; background: rgb(0, 128, 0); }
.other { width: 40px; height: 20px; background: lime; }
</style>
<div class="grid"><div class="item"></div><div class="other"></div></div>
