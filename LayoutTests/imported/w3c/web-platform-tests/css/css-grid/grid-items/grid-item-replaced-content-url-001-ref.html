<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: reference for a grid item replaced through content:url() uses its natural size</title>
<style>
.grid { display: grid; grid-template-columns: 100px 1fr; grid-template-rows: 200px; width: 300px; }
.item { width: 60px; height: 60px; background: rgb(0, 128, 0); }
</style>
<div class="grid"><div class="item"></div></div>
