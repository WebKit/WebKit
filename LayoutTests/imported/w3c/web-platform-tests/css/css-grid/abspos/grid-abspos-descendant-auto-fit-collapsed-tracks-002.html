<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: absolutely positioned descendant placed against collapsed auto-fit tracks, with leading implicit tracks</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#abspos">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#valdef-repeat-auto-fit">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#collapsed-gutter">
<link rel="match" href="grid-abspos-descendant-auto-fit-collapsed-tracks-002-ref.html">
<meta name="assert" content="Collapsed auto-fit tracks are accounted for when an absolutely positioned descendant, whose containing block is the grid container, is placed against grid lines and the grid has implicit tracks before the explicit grid.">
<style>
.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fit, 100px);
  grid-auto-columns: 30px;
  column-gap: 20px;
  width: 580px;
  height: 200px;
}
.item {
  width: 10px;
  height: 10px;
}
.abspos {
  position: absolute;
  left: 0;
  right: 0;
  height: 10px;
  background: green;
  border-left: 1px solid black;
}
</style>
<!-- Two leading implicit tracks, then five explicit ones. The second leading implicit track and the explicit
     tracks 1, 2, 4 and 5 are empty, and the explicit ones are collapsed. -->
<div class="grid">
  <div class="item" style="grid-column: -8">
    <div class="abspos" style="top: 0; grid-column: -8 / -7"></div>
    <div class="abspos" style="top: 20px; grid-column: -7 / 1"></div>
    <div class="abspos" style="top: 40px; grid-column: -7 / 4"></div>
    <div class="abspos" style="top: 60px; grid-column: 3 / 4"></div>
    <div class="abspos" style="top: 80px; grid-column: 1 / 3"></div>
    <div class="abspos" style="top: 100px; grid-column: -6 / 6"></div>
    <div class="abspos" style="top: 120px; grid-column: -8 / auto"></div>
  </div>
  <div class="item" style="grid-column: 3"></div>
</div>
