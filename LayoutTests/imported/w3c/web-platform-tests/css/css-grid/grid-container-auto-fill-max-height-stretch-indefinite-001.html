<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: A stretch max-height in a containing block with an indefinite height is not a definite size for repeat(auto-fill)</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#auto-repeat">
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#stretch-fit-sizing">
<link rel="match" href="grid-container-auto-fill-stretch-indefinite-001-ref.html">
<meta name="assert" content="With an indefinite containing block height stretch behaves as auto, so the grid container has no definite max size and repeat(auto-fill) repeats once. Both items are in the only row, so they are in different columns.">
<style>
.grid {
  display: grid;
  grid-auto-columns: 100px;
  grid-template-rows: repeat(auto-fill, 20px);
  max-height: stretch;
}
.grid > div:nth-child(1) { grid-row: 1; background: green; }
.grid > div:nth-child(2) { grid-row: -2; background: lime; }
</style>
<div class="containing-block">
  <div class="grid"><div></div><div></div></div>
</div>
