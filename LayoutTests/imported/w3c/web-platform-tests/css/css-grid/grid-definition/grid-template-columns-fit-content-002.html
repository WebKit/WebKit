<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: fit-content() in grid-template-columns</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#valdef-grid-template-columns-fit-content">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#algo-single-span-items">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#algo-spanning-items">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#extra-space">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#algo-stretch">
<meta name="assert" content="Checks that fit-content() columns are sized to their max-content contribution clamped by the fit-content() argument, floored by the min-content contribution, and are not stretched.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
.grid {
  display: grid;
  width: 200px;
  font: 10px/1 Ahem;
}
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<body onload="document.fonts.ready.then(() => { checkLayout('.grid'); })">
<div id="log"></div>

<!-- Max-content contribution smaller than the argument. -->
<div class="grid" style="grid-template-columns: fit-content(50px);">
  <div data-expected-width="20" data-expected-height="10">XX</div>
</div>

<!-- Min-content contribution larger than the argument. -->
<div class="grid" style="grid-template-columns: fit-content(50px);">
  <div data-expected-width="80" data-expected-height="10">XXXXXXXX</div>
</div>

<!-- Max-content contribution larger than the argument. -->
<div class="grid" style="grid-template-columns: fit-content(50px);">
  <div data-expected-width="50" data-expected-height="20">XX XX XX XX</div>
</div>

<!-- A zero argument leaves the column at its min-content contribution. -->
<div class="grid" style="grid-template-columns: fit-content(0px);">
  <div data-expected-width="20" data-expected-height="20">XX XX</div>
</div>

<!-- Percentage argument resolved against the grid container's width. -->
<div class="grid" style="grid-template-columns: fit-content(25%);">
  <div data-expected-width="50" data-expected-height="20">XX XX XX XX</div>
</div>

<div class="grid" style="grid-template-columns: fit-content(calc(10% + 30px));">
  <div data-expected-width="50" data-expected-height="20">XX XX XX XX</div>
</div>

<!-- An argument larger than the max-content contribution does not grow the column. -->
<div class="grid" style="grid-template-columns: fit-content(150%);">
  <div data-expected-width="110" data-expected-height="10">XX XX XX XX</div>
</div>

<div class="grid" style="grid-template-columns: repeat(2, fit-content(40px));">
  <div data-expected-width="40" data-expected-height="20">XX XX XX</div>
  <div data-expected-width="40" data-expected-height="20">XX XX XX</div>
</div>

<!-- Only the auto column is stretched. -->
<div class="grid" style="grid-template-columns: fit-content(50px) auto;">
  <div data-expected-width="20" data-expected-height="10">XX</div>
  <div data-expected-width="180" data-expected-height="10">X</div>
</div>

<!-- A spanning item's minimum contribution fills the first column up to its argument before the second. -->
<div class="grid" style="grid-template-columns: fit-content(30px) fit-content(70px);">
  <div style="grid-column: 1 / -1; grid-row: 1;" data-expected-width="100" data-expected-height="10">XXXXXXXXXX</div>
  <div style="grid-column: 1; grid-row: 2;" data-expected-width="30"></div>
  <div style="grid-column: 2; grid-row: 2;" data-expected-width="70"></div>
</div>

<!-- A spanning item's max-content contribution grows each column only up to its argument. -->
<div class="grid" style="grid-template-columns: fit-content(30px) fit-content(70px);">
  <div style="grid-column: 1 / -1; grid-row: 1;" data-expected-width="100" data-expected-height="30">XXXXX XXXXX XXXXX</div>
  <div style="grid-column: 1; grid-row: 2;" data-expected-width="30"></div>
  <div style="grid-column: 2; grid-row: 2;" data-expected-width="70"></div>
</div>
</body>
