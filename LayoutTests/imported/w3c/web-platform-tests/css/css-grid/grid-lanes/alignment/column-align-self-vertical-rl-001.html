<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: align-self in the stacking axis of a vertical-rl column grid lanes container</title>
  <link rel="author" title="Joanne Pan" href="mailto:jopan@apple.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#stacking-self-alignment">
  <link rel="match" href="column-align-self-vertical-rl-001-ref.html">
  <meta name="assert" content="Test passes if, in a vertical-rl column grid lanes container, align-self: end aligns the last item of a track to the left edge of its alignment container and align-self: start to its right edge.">
  <style>
    .grid-lanes {
      display: grid-lanes;
      gap: 10px;
      grid-template-columns: repeat(2, 50px);
      height: 110px;
      margin-bottom: 20px;
      width: 100px;
      writing-mode: vertical-rl;
    }
    item {
      background: green;
      display: block;
    }
  </style>
</head>
<body>
  <div class="grid-lanes">
    <item style="inline-size: auto; block-size: 20px; align-self: end"></item>
    <item style="block-size: 100px"></item>
  </div>
  <div class="grid-lanes">
    <item style="inline-size: auto; block-size: 20px; align-self: start"></item>
    <item style="block-size: 100px"></item>
  </div>
</body>
</html>
