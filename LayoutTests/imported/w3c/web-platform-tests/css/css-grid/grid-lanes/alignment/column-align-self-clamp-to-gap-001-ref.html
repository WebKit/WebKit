<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .container {
      height: 100px;
      margin-bottom: 70px;
      position: relative;
    }
    .box {
      background: green;
      position: absolute;
      width: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box" style="left: 0; top: 0; height: 100px"></div>
    <div class="box" style="left: 60px; top: 0; height: 150px"></div>
  </div>
  <div class="container">
    <div class="box" style="left: 0; top: 0; height: 100px"></div>
    <div class="box" style="left: 60px; top: 80px; height: 20px"></div>
  </div>
</body>
</html>
