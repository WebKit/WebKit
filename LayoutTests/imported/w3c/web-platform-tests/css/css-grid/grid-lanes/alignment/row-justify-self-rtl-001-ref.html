<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .container {
      height: 110px;
      margin-bottom: 20px;
      position: relative;
      width: 300px;
    }
    .box {
      background: green;
      height: 50px;
      position: absolute;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box" style="left: 200px; top: 0; width: 20px"></div>
    <div class="box" style="left: 200px; top: 60px; width: 100px"></div>
  </div>
  <div class="container">
    <div class="box" style="left: 280px; top: 0; width: 20px"></div>
    <div class="box" style="left: 200px; top: 60px; width: 100px"></div>
  </div>
</body>
</html>
