<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: a stretched orthogonal item resolves percentage max-height against the container's height</title>
  <link rel="author" title="Joanne Pan" href="mailto:jopan@apple.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#stacking-self-alignment">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#containing-block">
  <link rel="match" href="column-align-self-orthogonal-stretch-001-ref.html">
  <meta name="assert" content="Test passes if a vertical-rl item stretched in the stacking axis of a column grid lanes container is clamped by max-height: 50% of the container's content box height.">
  <style>
    .grid-lanes {
      display: grid-lanes;
      grid-template-columns: repeat(2, 50px);
      gap: 10px;
      width: 200px;
      height: 300px;
      align-items: stretch;
    }
    item {
      display: block;
      background: green;
    }
  </style>
</head>
<body>
  <div class="grid-lanes">
    <item style="writing-mode: vertical-rl; max-height: 50%"></item>
    <item style="height: 280px"></item>
  </div>
</body>
</html>
