<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .container {
      position: relative;
      margin-bottom: 20px;
    }
    .box {
      position: absolute;
      width: 50px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="container" style="height: 60px">
    <div class="box" style="left: 0; top: 0; height: 10px; background: blue"></div>
    <div class="box" style="left: 60px; top: 0; height: 60px"></div>
    <div class="box" style="left: 0; top: 40px; height: 20px"></div>
  </div>
  <div class="container" style="height: 60px">
    <div class="box" style="left: 60px; top: 0; height: 60px"></div>
    <div class="box" style="left: 0; top: 10px; height: 20px"></div>
  </div>
  <div class="container" style="height: 0">
    <div class="box" style="left: 0; top: 0; height: 10px; background: blue"></div>
  </div>
</body>
</html>
