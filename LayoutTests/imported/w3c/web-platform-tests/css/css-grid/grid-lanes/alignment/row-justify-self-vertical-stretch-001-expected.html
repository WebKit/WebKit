<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .container {
      position: relative;
      width: 200px;
      height: 300px;
    }
    .box {
      position: absolute;
      top: 0;
      width: 50px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box" style="left: 150px; height: 150px"></div>
    <div class="box" style="left: 90px; height: 280px"></div>
  </div>
</body>
</html>
