<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 10px 20px 20px 10px;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div style="grid-area: 1 / 1; background: blue"></div>
    <div style="grid-area: 2 / 1; background: orange"></div>
    <div style="grid-area: 1 / 2 / 4; background: green"></div>
    <div style="grid-area: 1 / 3 / 4; background: green"></div>
    <div style="grid-area: 4 / 1 / 5 / 3; background: purple"></div>
  </div>
</body>
</html>
