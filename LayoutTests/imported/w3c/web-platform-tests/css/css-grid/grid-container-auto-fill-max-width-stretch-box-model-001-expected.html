<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: reference for A stretch max-width subtracts the margin, border and padding for repeat(auto-fill)</title>
<style>
.containing-block { width: 400px; }
.grid {
  float: left;
  display: grid;
  grid-auto-rows: 20px;
  grid-template-columns: repeat(5, 60px);
  margin: 0 10px 0 20px;
  padding: 10px;
  border: 5px solid;
  background: grey;
}
.grid > div:nth-child(1) { grid-column: 1; background: green; }
.grid > div:nth-child(2) { grid-column: 5; background: lime; }
</style>
<div class="containing-block">
  <div class="grid"><div></div><div></div></div>
</div>
