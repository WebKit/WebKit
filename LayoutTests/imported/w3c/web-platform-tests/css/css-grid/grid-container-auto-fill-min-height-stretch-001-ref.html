<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: reference for repeat(auto-fill) with a stretch min-height</title>
<style>
.grid {
  display: grid;
  grid-template-columns: 100px;
  grid-template-rows: repeat(10, 20px);
}
.grid > div:nth-child(1) { grid-row: 1; background: green; }
.grid > div:nth-child(2) { grid-row: 10; background: lime; }
</style>
<div class="grid"><div></div><div></div></div>
