<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: A stretch max-width resolves against the block size of an orthogonal containing block for repeat(auto-fill)</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#auto-repeat">
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#stretch-fit-sizing">
<link rel="match" href="grid-container-auto-fill-max-width-stretch-orthogonal-001-ref.html">
<meta name="assert" content="The grid container's inline axis is the block axis of its vertical containing block, which is 500px wide and 200px tall, so its stretch max-width is 500px, not the 200px logical width of the containing block. 500px is 10 columns of 50px. The item on grid-column: -2 is in the last column, so it shows the number of columns.">
<style>
.containing-block {
  writing-mode: vertical-rl;
  width: 500px;
  height: 200px;
}
.grid {
  display: grid;
  writing-mode: horizontal-tb;
  grid-auto-rows: 50px;
  grid-template-columns: repeat(auto-fill, 50px);
  max-width: stretch;
}
.grid > div:nth-child(1) { grid-column: 1; background: green; }
.grid > div:nth-child(2) { grid-column: -2; background: lime; }
</style>
<div class="containing-block">
  <div class="grid"><div></div><div></div></div>
</div>
