<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: single-track grid item placed into a leading implicit column with a negative line number</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#line-placement">
<link rel="match" href="grid-column-negative-line-leading-implicit-placement-ref.html">
<meta name="assert" content="A negative column line whose magnitude exceeds the number of explicit grid lines resolves before the explicit grid start, generating a leading implicit column sized by grid-auto-columns. grid-column: -5 in a 3-column grid places the item one track before the explicit grid.">
<style>
  .grid {
    display: grid;
    grid-template-columns: 100px 100px 100px;
    grid-auto-columns: 100px;
    grid-template-rows: 100px;
  }
  .grid > div {
    border: 2px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px/1 sans-serif;
  }
  /* -5 in a 3-column grid (4 explicit lines) resolves to one line before the explicit grid start,
     placing this item in a leading implicit column sized by grid-auto-columns. The explicit columns
     (grid-column 1/2/3) shift one track to the right to make room for it. */
  .leading { grid-column: -5; background: green; }
  .a { grid-column: 1; background: blue; }
  .b { grid-column: 2; background: purple; }
  .c { grid-column: 3; background: orange; }
</style>
<p>Test passes if there are four adjacent 100px squares in a single row, in this order left to
right: green "lead" (a leading implicit column), then blue "col 1", purple "col 2", orange "col 3"
(the three explicit columns). There should be no gaps.</p>
<div class="grid">
  <div class="leading">lead</div>
  <div class="a">col 1</div>
  <div class="b">col 2</div>
  <div class="c">col 3</div>
</div>
