<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: computed grid-template-columns with items placed using a named span</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-placement-span-int">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#line-placement">
<meta name="assert" content="The resolved value of grid-template-columns lists the implicit tracks created by an item whose named span runs out of named lines.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
.grid { display: grid; width: 400px; grid-template-rows: 10px; grid-auto-columns: 20px; }
</style>
<div id="trailing" class="grid" style="grid-template-columns: [foo] 40px [bar] 40px [foo] 40px"><div style="grid-column: 1 / span 3 foo"></div></div>
<div id="leading" class="grid" style="grid-template-columns: [foo] 40px [bar] 40px [foo] 40px"><div style="grid-column: span 3 foo / 4"></div></div>
<div id="enough" class="grid" style="grid-template-columns: [bar] 40px 40px"><div style="grid-column: 1 / span 2 foo"></div></div>
<script>
function columns(id) { return getComputedStyle(document.getElementById(id)).gridTemplateColumns; }
test(() => {
    assert_equals(columns("trailing"), "[foo] 40px [bar] 40px [foo] 40px 20px 20px");
}, "a named span with too few named lines adds trailing implicit tracks");
test(() => {
    assert_equals(columns("leading"), "20px [foo] 40px [bar] 40px [foo] 40px");
}, "a named span with too few named lines adds leading implicit tracks");
test(() => {
    assert_equals(columns("enough"), "[bar] 40px 40px 20px 20px");
}, "a named span with no named lines adds trailing implicit tracks");
</script>
