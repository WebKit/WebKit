<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: auto-placement with 'grid-auto-flow: column'</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#auto-placement-algo">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#propdef-grid-auto-flow">
<meta name="assert" content="With grid-auto-flow: column the auto-placement cursor advances down the rows first, and spans in both axes are honored.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<body onload="checkLayout('.grid')">
<style>
.grid { display: grid; position: relative; grid-auto-flow: column; width: 400px; background: lightgray; margin-bottom: 10px; }
.grid > div { background: green; }
#g1 { grid-template-rows: 20px 30px 40px; grid-auto-columns: 50px 70px; }
#g2 { grid-template-rows: 20px 30px; grid-auto-columns: 40px 60px 80px; }
</style>
<div class="grid" id="g1">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="50" data-expected-height="20"></div>
  <div data-offset-x="0" data-offset-y="20" data-expected-width="50" data-expected-height="70" style="grid-row: span 2"></div>
  <div data-offset-x="50" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: span 2"></div>
  <div data-offset-x="50" data-offset-y="20" data-expected-width="70" data-expected-height="30"></div>
  <div data-offset-x="170" data-offset-y="0" data-expected-width="70" data-expected-height="90" style="grid-row: span 3"></div>
  <div data-offset-x="240" data-offset-y="0" data-expected-width="50" data-expected-height="20"></div>
</div>
<div class="grid" id="g2">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="100" data-expected-height="50" style="grid-row: span 2; grid-column: span 2"></div>
  <div data-offset-x="100" data-offset-y="0" data-expected-width="80" data-expected-height="20"></div>
  <div data-offset-x="100" data-offset-y="20" data-expected-width="80" data-expected-height="30"></div>
  <div data-offset-x="180" data-offset-y="0" data-expected-width="180" data-expected-height="20" style="grid-column: span 3"></div>
  <div data-offset-x="180" data-offset-y="20" data-expected-width="40" data-expected-height="30"></div>
</div>
