<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: grid-column placement with a named span next to a line</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-placement-span-int">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#line-placement">
<meta name="assert" content="A span with a name counts only the lines with that name, starting at the line on the other edge, and counts implicit lines once the named lines run out.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<body onload="checkLayout('.grid')">
<style>
.grid { display: grid; position: relative; width: 400px; background: lightgray; margin-bottom: 10px; grid-auto-columns: 20px; grid-auto-rows: 10px; }
.grid > div { background: green; }
</style>
<!-- a named span from a line with enough named lines: only foo lines count -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="40" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: 2 / span 2 foo"></div>
</div>
<!-- a named span with too few named lines: the remaining count is implicit lines -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="200" data-expected-height="20" style="grid-column: 3 / span 3 foo"></div>
</div>
<!-- a named span with no named lines: every counted line is implicit -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [bar] 40px 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: 1 / span 2 foo"></div>
</div>
<!-- a named span before the end line: only foo lines count -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: span 2 foo / 6"></div>
</div>
<!-- a named span before the end line with too few named lines: leading implicit tracks -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px 40px [foo] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="140" data-expected-height="20" style="grid-column: span 3 foo / 4"></div>
</div>
<!-- span 2 foo before a negative end line -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="160" data-expected-height="20" style="grid-column: span 2 foo / -1"></div>
</div>
<!-- the end line is past the explicit grid, counting start-ward -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="160" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: span foo / 9"></div>
</div>
<!-- the start line is in the leading implicit grid, counting end-ward -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="40" data-expected-height="20" style="grid-column: -9 / span foo"></div>
</div>
<!-- span 6 foo before an end line past the explicit grid -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="320" data-expected-height="20" style="grid-column: span 6 foo / 8"></div>
</div>
<!-- a lone name next to a named span -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [bar] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: foo / span 2 bar"></div>
</div>
<!-- an integer and a name next to a named span -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [x] 40px [bar] 40px [bar] 40px">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: 2 foo / span 2 bar"></div>
</div>
<!-- a named span next to an integer and a name -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [bar] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="100" data-expected-height="20" style="grid-column: span 2 bar / 2 foo"></div>
</div>
<!-- a named span next to a negative integer and a name -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="80" data-expected-height="20" style="grid-column: span foo / -1 foo"></div>
</div>
<!-- a named span next to a lone name -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [x] 40px [foo] 40px [bar] 40px [foo] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="100" data-expected-height="20" style="grid-column: span 2 foo / bar"></div>
</div>
<!-- an integer next to a named span -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="80" data-expected-height="20" style="grid-column: 3 / span foo"></div>
</div>
<!-- names inside repeat(auto-fill) counted end-ward -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: repeat(auto-fill, [foo] 20px [bar] 20px)">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="120" data-expected-height="20" style="grid-column: 1 / span 3 foo"></div>
</div>
<!-- names inside repeat(auto-fill) counted start-ward -->
<div class="grid" style="grid-template-rows: 20px; grid-template-columns: repeat(auto-fill, [foo] 20px [bar] 20px)">
  <div data-offset-x="80" data-offset-y="0" data-expected-width="60" data-expected-height="20" style="grid-column: span 2 foo / 8"></div>
</div>
<!-- grid-auto-flow: column with a named span -->
<div class="grid" style="grid-template-rows: 40px 40px; grid-auto-flow: column; grid-template-columns: [foo] 40px [bar] 40px [foo] 40px [bar] 40px [foo] 40px [bar] 40px">
  <div data-offset-x="0" data-offset-y="0" data-expected-width="160" data-expected-height="40" style="grid-column: 1 / span 2 foo"></div>
</div>
