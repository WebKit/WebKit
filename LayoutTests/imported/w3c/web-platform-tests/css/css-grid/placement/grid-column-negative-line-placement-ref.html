<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: single-track grid items placed with negative column line numbers</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<style>
  .grid {
    display: grid;
    grid-template-columns: 100px 100px 100px;
    grid-template-rows: 100px;
  }
  .grid > div {
    grid-row: 1;
    border: 2px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px/1 sans-serif;
  }
  .a { grid-column: 1 / 2; background: green; }
  .b { grid-column: 2 / 3; background: blue; }
  .c { grid-column: 3 / 4; background: purple; }
</style>
<p>Test passes if there are three adjacent 100px squares in a single row, in this
order left to right: green "col 1", blue "col 2", purple "col 3". There should be
no gaps.</p>
<div class="grid">
  <div class="a">col 1</div>
  <div class="b">col 2</div>
  <div class="c">col 3</div>
</div>
