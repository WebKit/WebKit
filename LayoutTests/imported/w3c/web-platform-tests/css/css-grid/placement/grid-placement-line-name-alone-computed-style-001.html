<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid: computed grid-template-columns with items placed using a line name alone</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-placement-slot">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#resolved-track-list">
<meta name="assert" content="The resolved value of grid-template-columns lists the implicit tracks created by an item whose line name alone matches no line: the edge is the first implicit line after the explicit grid.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
.grid { display: grid; width: 400px; grid-template-columns: [a-start] 50px [a-end] 60px; grid-template-rows: 20px; grid-auto-columns: 30px 40px; }
</style>
<div id="unknown" class="grid"><div style="grid-column: foo"></div></div>
<div id="leading" class="grid"><div style="grid-column: span 3 / a"></div></div>
<div id="known" class="grid"><div style="grid-column: a"></div></div>
<script>
function columns(id) { return getComputedStyle(document.getElementById(id)).gridTemplateColumns; }
test(() => {
    assert_equals(columns("unknown"), "[a-start] 50px [a-end] 60px 30px 40px");
}, "a name with no line is the first implicit line after the explicit grid");
test(() => {
    assert_equals(columns("leading"), "30px 40px [a-start] 50px [a-end] 60px");
}, "a lone name end at a-end, with span 3, adds leading implicit tracks");
test(() => {
    assert_equals(columns("known"), "[a-start] 50px [a-end] 60px");
}, "a name with a-start and a-end lines adds no implicit tracks");
</script>
