<!DOCTYPE html>
<title>justify-self aligns a statically-positioned abspos box within its parent's content box, in the parent's direction</title>
<link rel="help" href="https://drafts.csswg.org/css-align-3/#justify-abspos">
<link rel="help" href="https://drafts.csswg.org/css-position-3/#staticpos-rect">
<link rel="match" href="justify-self-static-position-parent-not-containing-block-ref.html">
<meta name="assert" content="When the parent is not the containing block, justify-self aligns the box within the parent's content box and resolves start and end against the parent's direction.">
<style>
.containing-block {
  position: relative;
  width: 300px;
}

.ltr {
  direction: ltr;
}

.rtl {
  direction: rtl;
}

.parent {
  width: 100px;
  height: 20px;
  margin-left: 100px;
  margin-right: 100px;
}

.box {
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: green;
}
</style>
<div class="containing-block rtl">
  <div class="parent ltr"><div class="box" style="justify-self: start"></div></div>
  <div class="parent ltr"><div class="box" style="justify-self: center"></div></div>
  <div class="parent ltr"><div class="box" style="justify-self: end"></div></div>
  <div class="parent ltr"><div class="box" style="justify-self: left"></div></div>
  <div class="parent ltr"><div class="box" style="justify-self: right"></div></div>
</div>
<div class="containing-block ltr">
  <div class="parent rtl"><div class="box" style="justify-self: start"></div></div>
  <div class="parent rtl"><div class="box" style="justify-self: center"></div></div>
  <div class="parent rtl"><div class="box" style="justify-self: end"></div></div>
  <div class="parent rtl"><div class="box" style="justify-self: left"></div></div>
  <div class="parent rtl"><div class="box" style="justify-self: right"></div></div>
</div>
