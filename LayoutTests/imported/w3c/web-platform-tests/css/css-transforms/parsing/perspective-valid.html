<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Transform Module Level 2: parsing perspective with valid values</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-transforms-2/#perspective-property">
<meta name="assert" content="perspective supports the full grammar 'none | <length [0,∞]>'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_valid_value("perspective", "none");
test_valid_value("perspective", "0px");
test_valid_value("perspective", "10px");
test_valid_value("perspective", "10em");
test_valid_value("perspective", "calc(10px)");
test_valid_value("perspective", "calc(-10px)");
test_valid_value("perspective", "calc(10em)");
test_valid_value("perspective", "calc(-10em)");
test_valid_value("perspective", "calc(10px + (5px * sign(2cqw - 10px)))");
</script>
</body>
</html>
