<!DOCTYPE html>
<title>CSS Test: Collapsed border with colspan in vertical writing mode — single cell border should not bleed</title>
<link rel="author" title="Karl Dubost" href="https://otsukare.info/">
<link rel="help" href="https://www.w3.org/TR/CSS22/tables.html#border-conflict-resolution">
<link rel="help" href="https://bugs.webkit.org/show_bug.cgi?id=20840">
<link rel="match" href="collapsed-border-colspan-005-ref.html">
<meta name="assert" content="In a border-collapsed vertical-rl table, when a cell with a thick border shares an edge with a colspanned cell, only the border segment directly adjacent to that cell should be thick.">
<style>
  table { border-collapse: collapse; table-layout: fixed; width: 300px; writing-mode: vertical-rl; }
  td { border: 1px solid orange; padding: 5px; }
</style>

<p>The border of the colspanned cell should be thick black only adjacent to "def", and thin orange adjacent to "ghi" and "jkl".</p>

<table>
  <tr>
    <td colspan="3">abc</td>
  </tr>
  <tr>
    <td style="border-right: 5px solid black;">def</td>
    <td>ghi</td>
    <td>jkl</td>
  </tr>
</table>
