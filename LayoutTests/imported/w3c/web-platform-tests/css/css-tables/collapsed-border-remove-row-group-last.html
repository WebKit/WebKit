<!doctype html>
<meta charset="utf-8">
<title>Removing the last row group updates the collapsed border of the row group above</title>
<link rel="help" href="https://drafts.csswg.org/css-tables/#border-collapse-property">
<link rel="match" href="collapsed-border-remove-row-group-last-ref.html">
<style>
  table { border-collapse: collapse; }
  td { padding: 5px; }
  .thick { border-top: 10px solid green; }
</style>
<table>
  <tbody><tr><td>Kept</td></tr></tbody>
  <tbody id="removeMe"><tr><td class="thick">Removed</td></tr></tbody>
</table>
<script>
  onload = function () {
    removeMe.getBoundingClientRect();
    removeMe.remove();
  };
</script>
