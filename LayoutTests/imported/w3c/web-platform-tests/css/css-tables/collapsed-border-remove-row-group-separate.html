<!doctype html>
<meta charset="utf-8">
<title>Removing a row group in a separated-borders table</title>
<link rel="help" href="https://drafts.csswg.org/css-tables/#border-collapse-property">
<link rel="match" href="collapsed-border-remove-row-group-separate-ref.html">
<style>
  table { border-collapse: separate; }
  td { padding: 5px; }
  .thick { border-top: 10px solid green; }
</style>
<table>
  <tbody><tr><td>Above</td></tr></tbody>
  <tbody id="removeMe"><tr><td class="thick">Removed</td></tr></tbody>
  <tbody><tr><td>Below</td></tr></tbody>
</table>
<script>
  onload = function () {
    removeMe.getBoundingClientRect();
    removeMe.remove();
  };
</script>
