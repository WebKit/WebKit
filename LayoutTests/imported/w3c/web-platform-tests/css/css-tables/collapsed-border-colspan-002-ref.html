<!DOCTYPE html>
<title>CSS Test Reference</title>
<link rel="author" title="Karl Dubost" href="https://otsukare.info/">
<style>
  table { border-collapse: collapse; table-layout: fixed; width: 300px; }
  td { border: 1px solid orange; padding: 5px; }
</style>

<p>The top border of the bottom colspanned cell should be thick black only below "abc", and thin orange below "ghi" and "jkl".</p>

<!-- Reference: three separate cells in row 1 (no colspan) with internal
     vertical borders removed. Cell 1 has a thick black top border (matching
     the conflict with abc's thick bottom border). Cells 2 and 3 keep the
     default thin orange border. -->
<table>
  <tr>
    <td style="border-bottom: 5px solid black;">abc</td>
    <td>ghi</td>
    <td>jkl</td>
  </tr>
  <tr>
    <td style="border-top: 5px solid black; border-right-style: none;">def</td>
    <td style="border-left-style: none; border-right-style: none;"></td>
    <td style="border-left-style: none;"></td>
  </tr>
</table>
