<!DOCTYPE html>
<title>CSS Test Reference</title>
<link rel="author" title="Karl Dubost" href="https://otsukare.info/">
<style>
  table { border-collapse: collapse; }
  td { border: 1px solid orange; padding: 5px; width: 80px; color: transparent; }
</style>

<p>The right border of the left rowspanned cell should be thick black only beside "def", and thin orange beside "ghi" and "jkl".</p>

<!-- Reference: three separate cells in column 0 (no rowspan) with internal
     horizontal borders removed. Cell 1 has a thick black right border (matching
     the conflict with def's thick left border). Cells 2 and 3 keep the default
     thin orange border. -->
<table>
  <tr>
    <td style="border-right: 5px solid black; border-bottom-style: none;">abc</td>
    <td style="border-left: 5px solid black;">def</td>
  </tr>
  <tr>
    <td style="border-top-style: none; border-bottom-style: none;"></td>
    <td>ghi</td>
  </tr>
  <tr>
    <td style="border-top-style: none;"></td>
    <td>jkl</td>
  </tr>
</table>
