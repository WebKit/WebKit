<!DOCTYPE html>
<title>CSS Test: Collapsed border with rowspan — cell border beside rowspanned cell should not bleed</title>
<link rel="author" title="Karl Dubost" href="https://otsukare.info/">
<link rel="help" href="https://www.w3.org/TR/CSS22/tables.html#border-conflict-resolution">
<link rel="help" href="https://bugs.webkit.org/show_bug.cgi?id=20840">
<link rel="match" href="collapsed-border-rowspan-003-ref.html">
<meta name="assert" content="In a border-collapsed table, when a cell with a thick left border shares an edge with a rowspanned cell to its left, only the border segment directly beside that cell should be thick. The remaining segments of the rowspanned cell's right border should retain the thin border.">
<style>
  table { border-collapse: collapse; }
  td { border: 1px solid orange; padding: 5px; width: 80px; color: transparent; }
</style>

<p>The right border of the left rowspanned cell should be thick black only beside "def", and thin orange beside "ghi" and "jkl".</p>

<table>
  <tr>
    <td rowspan="3">abc</td>
    <td style="border-left: 5px solid black;">def</td>
  </tr>
  <tr>
    <td>ghi</td>
  </tr>
  <tr>
    <td>jkl</td>
  </tr>
</table>
