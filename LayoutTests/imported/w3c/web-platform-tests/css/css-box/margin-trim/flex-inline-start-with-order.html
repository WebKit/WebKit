<!DOCTYPE html>
<html>
<head>
<title>margin-trim: flex-inline-start-with-order</title>
<link rel="help" href="https://drafts.csswg.org/css-box-4/#margin-trim-flex">
<link rel="match" href="flex-inline-start-with-order-ref.html">
<meta name="assert" content="inline-start trims the margin of the item at the start of the flex line, which the used 'order' value determines, and the trimmed margin is left out of the container's intrinsic width">
<style>
flexbox {
    display: flex;
    /* Sizing to content makes the container use its own intrinsic width, which the trimmed margin must not contribute to. */
    width: max-content;
    border: 1px black solid;
    margin-trim: inline-start;
}
item {
    display: block;
    background-color: green;
    width: 50px;
    height: 50px;
}
/* 'order' puts the second item at the start of the flex line, so it is the one whose inline-start margin
   is trimmed. It carries the only margin in the test, so trimming it leaves the two items flush. */
item:nth-child(2) {
    order: -1;
    margin-inline-start: 40px;
}
</style>
</head>
<body>
<flexbox>
  <item></item>
  <item></item>
</flexbox>
</body>
</html>
