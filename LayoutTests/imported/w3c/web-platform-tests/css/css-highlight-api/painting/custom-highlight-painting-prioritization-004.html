<!DOCTYPE html>
<meta charset="UTF-8">
<title>CSS Highlight API Test: Highlights registered out of priority order paint in priority order</title>
<link rel="help" href="https://drafts.csswg.org/css-highlight-api-1/#priorities">
<link rel="match" href="custom-highlight-painting-prioritization-004-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<meta name="assert" value="A highlight registered after higher priority highlights is painted above lower priority highlights and below higher priority ones.">
<style>
  div {
    font: 20px/1 Ahem;
  }
  ::highlight(priority-1), ::highlight(priority-2) {
    background-color: red;
    color: red;
  }
  ::highlight(priority-5) {
    background-color: transparent;
  }
  ::highlight(priority-3) {
    background-color: green;
    color: green;
  }
</style>
<div id="first">XXXXXXXX</div>
<div id="second">XXXXXXXX</div>
<script>
  // Highlights are registered with priorities 1, 2, 5, 3. The priority 3 highlight must paint above the
  // red lower priority highlights and show through the transparent priority 5 highlight.
  // The first line is covered by priorities 1, 5 and 3; the second line by priorities 1, 2, 5 and 3.
  const first = document.getElementById("first").firstChild;
  const second = document.getElementById("second").firstChild;
  function rangeFor(text) {
    return new StaticRange({ startContainer: text, startOffset: 0, endContainer: text, endOffset: text.length });
  }
  for (const [priority, texts] of [[1, [first, second]], [2, [second]], [5, [first, second]], [3, [first, second]]]) {
    const highlight = new Highlight(...texts.map(rangeFor));
    highlight.priority = priority;
    CSS.highlights.set(`priority-${priority}`, highlight);
  }
</script>
