<!DOCTYPE html>
<title>CSS stretch(): the argument is the size of the margin box in the inline axis</title>
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#funcdef-width-stretch">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht" />
<meta name="assert" content="stretch() fits the margin box to its argument, treating auto margins as zero, whatever the box-sizing.">
<style>
  #reference-overlapped-red {
    position: absolute;
    background-color: red;
    width: 100px;
    height: 100px;
    z-index: -1;
  }
  .container {
    width: 200px;
  }
  .test {
    height: 20px;
    background: green;
  }
</style>

<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>

<div id="reference-overlapped-red"></div>
<div class="container">
  <div class="test" style="width: stretch(150px); margin-right: 50px;"></div>
  <div class="test" style="width: stretch(75%); margin-right: 50px;"></div>
  <div class="test" style="width: stretch(100px); margin-right: auto;"></div>
  <div class="test" style="width: stretch(100px); padding-right: 20px;"></div>
  <div class="test" style="width: stretch(100px); border-right: 20px solid green;"></div>
</div>
