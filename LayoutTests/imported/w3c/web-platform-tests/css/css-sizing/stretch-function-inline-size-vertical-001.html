<!DOCTYPE html>
<title>CSS stretch(): the argument is the size of the margin box in the inline axis, in vertical writing mode</title>
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#funcdef-width-stretch">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht" />
<meta name="assert" content="stretch() fits the margin box to its argument in the inline axis of a vertical writing mode.">
<style>
  #reference-overlapped-red {
    position: absolute;
    background-color: red;
    width: 100px;
    height: 100px;
    z-index: -1;
  }
  .container {
    writing-mode: vertical-lr;
    height: 200px;
  }
  .test {
    width: 20px;
    background: green;
  }
</style>

<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>

<div id="reference-overlapped-red"></div>
<div class="container">
  <div class="test" style="height: stretch(150px); margin-bottom: 50px;"></div>
  <div class="test" style="height: stretch(75%); margin-bottom: 50px;"></div>
  <div class="test" style="height: stretch(150px); margin-bottom: 25%;"></div>
  <div class="test" style="height: stretch(100px); margin-bottom: auto;"></div>
  <div class="test" style="height: stretch(100px); padding-bottom: 20px;"></div>
</div>
