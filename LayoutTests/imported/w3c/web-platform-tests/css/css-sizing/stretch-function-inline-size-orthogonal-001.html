<!DOCTYPE html>
<title>CSS stretch(): the argument is the size of the margin box in the inline axis of an orthogonal flow</title>
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#funcdef-width-stretch">
<link rel="help" href="https://drafts.csswg.org/css-writing-modes-4/#dimension-mapping">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht" />
<meta name="assert" content="In an orthogonal flow, a stretch() percentage resolves against the containing block's height, as height percentages do, while the margins resolve against the containing block's inline size.">
<style>
  #reference-overlapped-red {
    position: absolute;
    background-color: red;
    width: 100px;
    height: 100px;
    z-index: -1;
  }
  .container {
    width: 100px;
    height: 200px;
  }
  .test {
    writing-mode: vertical-lr;
    width: 100px;
    /* 75% of 200px, less 50% of 100px. */
    height: stretch(75%);
    margin-bottom: 50%;
    background: green;
  }
</style>

<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>

<div id="reference-overlapped-red"></div>
<div class="container">
  <div class="test"></div>
</div>
