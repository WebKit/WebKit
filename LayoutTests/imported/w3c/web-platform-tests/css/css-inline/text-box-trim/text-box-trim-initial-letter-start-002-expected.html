<!DOCTYPE html>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.spacer {
  height: 50px;
  background: lightgray;
}
.target {
  font: 40px/1 Ahem;
  width: 400px;
  position: relative;
}
.target::first-letter {
  initial-letter: 2 1;
  -webkit-initial-letter: 2 1;
}
</style>
<div class="spacer"></div>
<div class="target">ApÉx ApÉx ApÉx ApÉx</div>
<script>
// The font size of raised initial letters is undefined[1], so this computes where the target goes, as
// text-box-trim-initial-letter-start-001-ref.html does. Trimming the start of the first line takes away
// what the initial letter raised it by and leaves the four lines, 40px each, right below the spacer.
// [1] https://drafts.csswg.org/css-inline-3/#sizing-initial-letter
const spacer = document.getElementsByClassName('spacer')[0];
const target = document.getElementsByClassName('target')[0];
const lineCount = 4;
const spacer_bottom = spacer.getBoundingClientRect().bottom;
const target_bottom = target.getBoundingClientRect().bottom;
target.style.top = `${spacer_bottom - target_bottom + 40 * lineCount}px`;
</script>
