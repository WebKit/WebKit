<!DOCTYPE html>
<title>text-box-trim: trim-start moves an initial letter with the first line when the content takes more than one line</title>
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-edge">
<link rel="match" href="text-box-trim-initial-letter-start-002-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.spacer {
  height: 50px;
  background: lightgray;
}
.target {
  font: 40px/1 Ahem;
  width: 400px;
  text-box-trim: trim-start;
  text-box-edge: text;
}
.target::first-letter {
  initial-letter: 2 1;
  -webkit-initial-letter: 2 1;
}
</style>
<div class="spacer"></div>
<div class="target">ApÉx ApÉx ApÉx ApÉx</div>
