<!DOCTYPE html>
<meta charset="UTF-8">
<title>text-box-trim on an ancestor of a line-clamp container does not apply to the line before the clamp point</title>
<link rel="author" title="Christian Biesinger" href="mailto:cbiesinger@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="text-box-trim-line-clamp-003-ref.html">
<meta name="assert" content="The last formatted line of the box with trim-end is the line after the line-clamp container, so the last line before the clamp point inside the line-clamp container is not trimmed.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.spacer {
  background: lightgray;
  block-size: 100px;
}
.target {
  font: 50px/2 Ahem;
  text-box-trim: trim-end;
  text-box-edge: text;
}
.clamp {
  line-clamp: 3;
}
</style>
<div class="spacer"></div>
<div class="target">
  <div class="clamp">
    A<br>
    B<br>
    C<br>
    D
  </div>
  E
</div>
<div class="spacer"></div>
