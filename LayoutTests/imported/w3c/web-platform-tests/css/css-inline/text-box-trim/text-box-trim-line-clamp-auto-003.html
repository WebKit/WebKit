<!DOCTYPE html>
<meta charset="UTF-8">
<title>text-box-trim: a line that does not fit trimmed either is not the last line before clamp when clamping by a height</title>
<link rel="author" title="Christian Biesinger" href="mailto:cbiesinger@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="text-box-trim-line-clamp-auto-003-ref.html">
<meta name="assert" content="The first line does not fit within the block size limit even when its block end is trimmed, so the auto clamp point is the start of the line-clamp container, as without text-box-trim.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.spacer {
  background: lightgray;
  block-size: 100px;
}
.target {
  font: 50px/2 Ahem;
  text-box-trim: trim-end;
  text-box-edge: text;

  line-clamp: auto;
  max-height: 50px;
}
</style>
<div class="spacer"></div>
<div class="target">
  A<br>
  B<br>
  C<br>
  D</div>
<div class="spacer"></div>
