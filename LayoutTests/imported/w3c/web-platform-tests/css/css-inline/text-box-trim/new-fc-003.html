<!DOCTYPE html>
<title>text-box-trim does not propagate into flex, grid, or table formatting contexts</title>
<link rel="author" title="Christian Biesinger" href="mailto:cbiesinger@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="match" href="new-fc-003-ref.html">
<meta name="assert" content="Like ::first-line, text-box-trim does not apply to, or propagate through, flex, grid, or table formatting contexts, so the lines inside them are not trimmed.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  .spacer {
    background: lightgray;
    block-size: 20px;
  }
  .container {
    text-box-trim: trim-both;
    text-box-edge: text;
    font: 20px/40px Ahem;
  }
</style>
<div class="spacer"></div>
<div class="container"><div style="display:flex;">xxxxx</div></div>
<div class="spacer"></div>
<div class="container"><div style="display:grid;">xxxxx</div></div>
<div class="spacer"></div>
<div class="container"><div style="display:table;">xxxxx</div></div>
<div class="spacer"></div>
