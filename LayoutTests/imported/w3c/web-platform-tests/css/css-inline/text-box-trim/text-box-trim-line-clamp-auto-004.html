<!DOCTYPE html>
<meta charset="UTF-8">
<title>text-box-trim on a block inside the line-clamp container applies to the last line before clamp when clamping by a height</title>
<link rel="author" title="Christian Biesinger" href="mailto:cbiesinger@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="text-box-trim-line-clamp-auto-004-ref.html">
<meta name="assert" content="The third line only fits within the block size limit with its block end trimmed by the trim-end of the block that contains it, so the clamp point is after it.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.spacer {
  background: lightgray;
  block-size: 100px;
}
.target {
  font: 50px/2 Ahem;
  line-clamp: auto;
  max-height: 285px;
}
.inner {
  text-box-trim: trim-end;
  text-box-edge: text;
}
</style>
<div class="spacer"></div>
<div class="target">
  <div class="inner">
    A<br>
    B<br>
    C<br>
    D
  </div>
</div>
<div class="spacer"></div>
