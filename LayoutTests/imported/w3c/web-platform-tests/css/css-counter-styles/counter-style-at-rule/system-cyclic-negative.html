<!DOCTYPE html>
<meta charset="UTF-8">
<title>CSS Test: system cyclic with negative values at or below minus the symbol count</title>
<link rel="help" href="https://drafts.csswg.org/css-counter-styles-3/#cyclic-system">
<link rel="match" href="system-cyclic-negative-ref.html">
<link rel="stylesheet" href="support/test-common.css">
<style type="text/css">
  @counter-style a {
    system: cyclic;
    symbols: \2021  \2022  \2023;
    suffix: "";
  }
  @counter-style b {
    system: cyclic;
    symbols: \2020  \2021  \2022  \2023  \A7;
    suffix: "";
  }
</style>
<ol start="-6" style="list-style-type: a">
  <li><li><li><li><li>
</ol>
<ol start="-10" style="list-style-type: b">
  <li><li><li><li><li>
</ol>
