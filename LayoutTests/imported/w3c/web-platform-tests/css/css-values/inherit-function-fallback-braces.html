<!DOCTYPE html>
<title>CSS Values: {}-wrapped inherit() fallback</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-values-5/#component-function-commas">
<link rel="help" href="https://drafts.csswg.org/css-values-5/#inherit-notation">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
<div id="target"></div>
<script>
  test_computed_value('color', 'inherit(--missing, {rgb(1, 2, 3)})', 'rgb(1, 2, 3)');
  test_computed_value('color', 'inherit(--missing, { rgb(1, 2, 3) })', 'rgb(1, 2, 3)');
  test_computed_value('color', 'inherit(--missing, {rgb(1, 2, 3)} )', 'rgb(1, 2, 3)');
  test_computed_value('font-family', 'inherit(--missing, {Arial, sans-serif})', 'Arial, sans-serif');

  test_invalid_value('color', 'inherit(--missing, {rgb(1, 2, 3)} rgb(4, 5, 6))');
  test_invalid_value('font-family', 'inherit(--missing, {Arial}, sans-serif)');

  // Unlike var()'s, the fallback of inherit() is a strict free-form production, so a {} block may not
  // be mixed with other values even when the fallback does not start with it.
  test_invalid_value('color', 'inherit(--missing, rgb(1, 2, 3) {})');
</script>
