<!DOCTYPE html>
<link rel="help" href="https://drafts.csswg.org/css-values-5/#random-item">
<link rel="author" title="Joanne Pan" href="https://github.com/J0pan">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="../support/parsing-testcommon.js"></script>
<script>

// Caching argument: keyword forms.
test_valid_value('font-family', 'random-item(auto, serif, sans-serif, monospace)');
test_valid_value('font-family', 'random-item(--x, serif, sans-serif, monospace)');
test_valid_value('font-family', 'random-item(element-scoped, serif, sans-serif)');
test_valid_value('font-family', 'random-item(--x element-scoped, serif, sans-serif)');
test_valid_value('font-family', 'random-item(element-scoped --x, serif, sans-serif)');
test_valid_value('font-family', 'random-item(auto element-scoped, serif, sans-serif)');
test_valid_value('font-family', 'random-item(element-scoped auto, serif, sans-serif)');

// fixed <number [0,1]>, including calc()/var()-derived numbers (parity with random()).
test_valid_value('font-family', 'random-item(fixed 0, serif, sans-serif)');
test_valid_value('font-family', 'random-item(fixed 0.5, serif, sans-serif)');
test_valid_value('font-family', 'random-item(fixed 1, serif, sans-serif)');
test_valid_value('font-family', 'random-item(fixed calc(0.5), serif, sans-serif)');
test_valid_value('font-family', 'random-item(fixed calc(1 / 4), serif, sans-serif)');

// Item lists: single, brace-wrapped commas, mixed, and empty items (<declaration-value>?#).
test_valid_value('font-family', 'random-item(auto, serif)');
test_valid_value('font-family', 'random-item(auto, {Times, serif}, {Arial, sans-serif})');
test_valid_value('font-family', 'random-item(auto, {Times, serif}, sans-serif, {monospace})');
test_valid_value('font-family', 'random-item(auto, serif,)');
test_valid_value('font-family', 'random-item(auto, , serif)');
test_valid_value('font-family', 'random-item(auto, ,)');

// A dashed-ident may collide with a keyword name; it is still a custom-property name.
test_valid_value('font-family', 'random-item(--auto, serif, sans-serif)');
test_valid_value('font-family', 'random-item(--fixed, serif, sans-serif)');

// Keyword matching is ASCII case-insensitive (specified value preserves the author's casing).
test_valid_value('font-family', 'random-item(AUTO, serif, sans-serif)');
test_valid_value('font-family', 'RANDOM-ITEM(auto, serif, sans-serif)');
test_valid_value('font-family', 'random-item(FIXED 0.5, serif, sans-serif)');
test_valid_value('font-family', 'random-item(Element-Scoped, serif, sans-serif)');

// Missing / malformed caching argument.
test_invalid_value('font-family', 'random-item()');
test_invalid_value('font-family', 'random-item(auto)');
test_invalid_value('font-family', 'random-item(, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(serif, sans-serif)');
test_invalid_value('font-family', 'random-item(foo, serif, sans-serif)');
test_invalid_value('font-family', 'random-item("--x", serif, sans-serif)');

// Duplicated / conflicting caching keywords.
test_invalid_value('font-family', 'random-item(--x --y, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(auto auto, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(auto --x, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(element-scoped element-scoped, serif, sans-serif)');

// fixed errors.
test_invalid_value('font-family', 'random-item(fixed, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(fixed -0.5, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(fixed 2, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(fixed 0.5px, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(fixed 0.5%, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(fixed 0.5 auto, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(auto fixed 0.5, serif, sans-serif)');

// property-scoped / property-index-scoped / ua-idents are not supported (subset matching random()).
test_invalid_value('font-family', 'random-item(property-scoped, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(property-index-scoped, serif, sans-serif)');
test_invalid_value('font-family', 'random-item(ua-foo, serif, sans-serif)');

// Brace-wrapping must wrap the whole item.
test_invalid_value('font-family', 'random-item(auto, {Times, serif} extra)');

</script>
