<!DOCTYPE html>
<html class="reftest-wait">
<title>Request URL Modifiers: cross-origin(anonymous) does not send cookies for a cross-origin background-image</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/css-values-5/#typedef-request-url-modifier-cross-origin-modifier">
<link rel="match" href="/css/reference/ref-filled-green-100px-square.xht">
<meta name="assert" content="A cross-origin url with cross-origin(anonymous) should be requested without cookies.">
<script>
document.cookie = "url-image-cross-origin-anonymous-credentials=1; path=/";
window.addEventListener("load", () => {
  document.fonts.ready.then(() => {
    document.cookie = "url-image-cross-origin-anonymous-credentials=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
    document.documentElement.classList.remove("reftest-wait");
  });
});
</script>
<style>
.test {
  width: 100px;
  height: 100px;
  background-color: red;
  background-image: url("http://{{hosts[][]}}:{{ports[http][1]}}/css/css-values/urls/support/cross-origin-credentials.py?kind=image&acao=star&expect=none&cookie=url-image-cross-origin-anonymous-credentials" cross-origin(anonymous));
}
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="test"></div>
</html>
