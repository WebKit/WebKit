<!DOCTYPE html>
<html class="reftest-wait">
<title>Request URL Modifiers: cross-origin(anonymous) does not send cookies after a background-image redirects cross-origin</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/css-values-5/#typedef-request-url-modifier-cross-origin-modifier">
<link rel="help" href="https://fetch.spec.whatwg.org/#http-network-or-cache-fetch">
<link rel="match" href="/css/reference/ref-filled-green-100px-square.xht">
<meta name="assert" content="A same-origin url with cross-origin(anonymous) that redirects cross-origin should be requested there without cookies.">
<script>
document.cookie = "url-image-cross-origin-anonymous-credentials-redirect=1; path=/";
window.addEventListener("load", () => {
  document.fonts.ready.then(() => {
    document.cookie = "url-image-cross-origin-anonymous-credentials-redirect=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
    document.documentElement.classList.remove("reftest-wait");
  });
});
</script>
<style>
.test {
  width: 100px;
  height: 100px;
  background-color: red;
  background-image: url("/common/redirect.py?location=http%3A%2F%2F{{hosts[][]}}%3A{{ports[http][1]}}%2Fcss%2Fcss-values%2Furls%2Fsupport%2Fcross-origin-credentials.py%3Fkind%3Dimage%26acao%3Dstar%26expect%3Dnone%26cookie%3Durl-image-cross-origin-anonymous-credentials-redirect" cross-origin(anonymous));
}
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="test"></div>
</html>
