<!DOCTYPE html>
<title>Request URL Modifiers: integrity() negative test for a cross-origin background-image without cross-origin()</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/css-values-5/#typedef-request-url-modifier-integrity-modifier">
<link rel="help" href="https://w3c.github.io/webappsec-subresource-integrity/#does-response-match-metadatalist">
<link rel="match" href="/css/reference/ref-filled-green-100px-square.xht">
<meta name="assert" content="A cross-origin url with a matching integrity() modifier but no cross-origin() modifier should not load the image.">
<style>
.test {
  width: 100px;
  height: 100px;
  background-color: green;
  background-image: url("http://{{hosts[][]}}:{{ports[http][1]}}/css/support/1x1-red.png" integrity("sha256-SLUCKDea0sL/rls4A5RcVppSuuxvJ0R3pKF4JY1hIvY="));
}
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="test"></div>
