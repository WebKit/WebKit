<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Anchor Positioning Test: position-visibility: anchor-valid</title>
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#position-visibility">
<link rel="match" href="position-visibility-anchor-valid-ref.html">
<style>
  .anchor {
    width: 100px;
    height: 100px;
    background: orange;
    display: inline-block;
  }

  .target {
    position: absolute;
    position-visibility: anchor-valid;
    width: 100px;
    height: 100px;
  }

  .target.visible { background: green; }
  .target.hidden { background: red; }
</style>

<!-- #target1 should be visible. -->
<div class="anchor" style="anchor-name: --a1;">anchor1</div>
<div id="target1" class="target visible" style="position-anchor: --a1; position-area: inline-end">target1</div>

<!-- #target2 should be visible; the default anchor exists, even though anchor() uses a nonexistent anchor. -->
<div id="target2" class="target visible" style="position-anchor: --a1; left: anchor(--does-not-exist right)">target2</div>

<!-- #target3, 4 should not be visible because the default anchor does not exist. -->
<div id="target3" class="target hidden" style="position-anchor: --does-not-exist; top: anchor(bottom);">target3</div>
<div id="target4" class="target hidden" style="position-anchor: --does-not-exist; position-area: block-end">target4</div>

<!-- #target5 should not be visible because the default anchor does not exist
     (even though the anchor function doesn't use it) -->
<div id="target5" class="target hidden" style="position-anchor: --does-not-exist; top: anchor(--a1 bottom);">target5</div>
