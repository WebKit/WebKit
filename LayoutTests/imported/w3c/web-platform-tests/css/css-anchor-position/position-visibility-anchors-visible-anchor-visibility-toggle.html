<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS Anchor Positioning Test: position-visibility: anchors-visible follows repeated anchor visibility changes</title>
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#position-visibility">
<link rel="match" href="position-visibility-anchors-visible-anchor-visibility-toggle-ref.html">
<meta name="assert" content="An anchor() positioned element with position-visibility: anchors-visible follows repeated visibility changes of its anchor, with unrelated style changes in between.">
<script src="/common/reftest-wait.js"></script>
<script src="/common/rendering-utils.js"></script>
<style>
  body { margin: 8px; }
  #container { visibility: hidden; }
  #anchor { anchor-name: --a1; width: 100px; height: 100px; background: orange; }
  #target {
    position: absolute;
    position-anchor: --a1;
    position-visibility: anchors-visible;
    left: anchor(left);
    top: anchor(bottom);
    width: 100px;
    height: 100px;
    background: green;
  }
  #unrelated { position: absolute; left: 300px; top: 0; width: 50px; height: 50px; background-color: rgb(0, 128, 0); }
</style>
<div id="container"><div id="anchor"></div></div>
<div id="target"></div>
<div id="unrelated"></div>
<script>
async function unrelatedStyleChanges() {
  for (let i = 0; i < 3; ++i) {
    unrelated.style.backgroundColor = i % 2 ? "rgb(0, 128, 0)" : "rgb(0, 100, 0)";
    await waitForAtLeastOneFrame();
  }
  unrelated.style.backgroundColor = "rgb(0, 128, 0)";
  await waitForAtLeastOneFrame();
}
async function run() {
  await waitForAtLeastOneFrame();
  // hidden -> visible -> hidden -> visible, changing only the container's visibility.
  for (const visibility of ["visible", "hidden", "visible"]) {
    await unrelatedStyleChanges();
    container.style.visibility = visibility;
    await waitForAtLeastOneFrame();
  }
  takeScreenshot();
}
run();
</script>
</html>
