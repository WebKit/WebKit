<!DOCTYPE html>

<style>
.container {
  position: relative;
  display: inline-block;
  vertical-align: middle;
  width: 100px;
  height: 100px;
  margin: 10px;
  border: solid 3px;
}

.vrl {
  writing-mode: vertical-rl;
}

.anchor {
  position: absolute;
  anchor-name: --a;
  width: 25px;
  height: 25px;
  background: dodgerblue;
}

.anchored {
  position: absolute;
  position-anchor: --a;
  width: 15px;
  height: 15px;
  background: green;
}
</style>

</div>
