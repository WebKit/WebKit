<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Anchor Positioning Test: anchor() fallback when the anchor is removed or display: none</title>
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#anchor-pos">
<meta name="assert" content="An anchor-positioned element whose own style is unchanged uses its anchor() fallback when its anchor is removed or stops being rendered, and is anchored again when the anchor returns.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
.anchor { position: absolute; top: 0; width: 100px; height: 50px; }
#anchorA { anchor-name: --a; left: 100px; }
#target { position: absolute; top: 200px; left: anchor(--a right, 7px); width: 20px; height: 20px; }
</style>
<div id="host"><div id="anchorA" class="anchor"></div></div>
<div id="target"></div>
<script>
const host = document.getElementById("host");
const anchorA = document.getElementById("anchorA");
const target = document.getElementById("target");

function checkTargetLeft(expected) {
  document.body.offsetTop;
  assert_equals(target.getBoundingClientRect().left, expected);
}

test(() => checkTargetLeft(200), "Initially anchored to the right edge of --a");
test(() => { anchorA.remove(); checkTargetLeft(7); }, "Anchor removed from the document: fallback is used");
test(() => { host.appendChild(anchorA); checkTargetLeft(200); }, "Anchor inserted again: anchored again");
test(() => { host.style.display = "none"; checkTargetLeft(7); }, "Anchor's parent display: none: fallback is used");
test(() => { host.style.display = ""; checkTargetLeft(200); }, "Anchor's parent displayed again: anchored again");
test(() => { anchorA.style.left = "150px"; checkTargetLeft(250); }, "Anchor moved, target style unchanged: target follows");
</script>
