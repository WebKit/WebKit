<!DOCTYPE html>

<title>CSS Anchor Positioning: position-try-order also sorts the base style along with position options</title>
<link rel="author" title="Kiet Ho" href="mailto:kiet.ho@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#position-options-list">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/13268">

<script src="/common/rendering-utils.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<style>
  #container {
    position: relative;
    width: 400px;
    height: 400px;
    background: teal;
  }
  #anchor {
    position: relative;
    top: 200px;
    left: 100px;
    width: 100px;
    height: 100px;
    background: red;
    anchor-name: --a;
  }
  #anchored {
    position: absolute;
    width: 100px;
    height: 100px;
    background: lime;

    position-anchor: --a;
    position-area: bottom center;
    position-try-fallbacks: flip-block;
    position-try-order: most-block-size;
  }
</style>

<div id="container">
  <div id="anchor"></div>
  <div id="anchored"></div>
</div>

<script>
  promise_test(async () => {
    await waitForAtLeastOneFrame();
    await waitForAtLeastOneFrame();
    assert_equals(anchored.offsetTop, 100);
  }, "When both the base style and fallback position don't overflow, the fallback is preferred over the base style, as its block size is more");
</script>
