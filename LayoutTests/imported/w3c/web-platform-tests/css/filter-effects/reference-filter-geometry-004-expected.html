<!DOCTYPE html>
<html>
<head>
  <style>
    body {
        margin: 0;
    }
    svg {
        position: absolute;
        top: 40px;
        left: 20px;
    }
  </style>
</head>
<body>
  <svg width="600" height="480" viewBox="-100 -80 600 480">
    <filter id="test" color-interpolation-filters="sRGB" x="-100" y="-80" width="600" height="480" primitiveUnits="userSpaceOnUse" filterUnits="userSpaceOnUse">
      <feFlood flood-color="blue" flood-opacity="0.2" result="wash"/>
      <feFlood x="-50" y="-50" width="100" height="100" flood-color="orange" flood-opacity="0.5" result="topleft"/>
      <feFlood x="350" y="270" width="100" height="100" flood-color="orange" flood-opacity="0.5" result="bottomRight"/>
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="wash" />
        <feMergeNode in="topleft" />
        <feMergeNode in="bottomRight" />
      </feMerge>
    </filter>
    <g filter="url(#test)">
      <rect x="0" y="0" width="400" height="320" fill="green"></rect>
      <rect x="-50" y="-50" width="100" height="100" fill="green"></rect>
      <rect x="350" y="270" width="100" height="100" fill="green"></rect>
    </g>
  </svg>
</body>
</html>
