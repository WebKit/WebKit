<!DOCTYPE html>
<title>SVG Filters: feDisplacementMap filter samples outside subregion</title>
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#FilterPrimitiveSubRegion">
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#feDisplacementMapElement">
<link rel="match" href="reference/fedisplacementmap-sample-subregion-001-ref.html">
<meta name="assert" content="feDisplacementMap samples the 'in' image anywhere within the filter region, including outside its primitive subregion.">

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <filter id="f" x="0" y="0" width="200" height="200" filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feFlood flood-color="rgb(255, 128, 0)" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="100" xChannelSelector="R"
            yChannelSelector="G" x="50" y="50" width="100" height="100" />
    </filter>
    <rect x="50" y="50" width="100" height="100" fill="red" />
    <g filter="url(#f)">
        <rect x="100" y="0" width="100" height="200" fill="green" />
    </g>
</svg>
