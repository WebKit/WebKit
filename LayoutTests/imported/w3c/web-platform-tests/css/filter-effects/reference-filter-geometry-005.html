<!DOCTYPE html>
<html>
<head>
<link rel="help" href="https://drafts.csswg.org/filter-effects/#FilterEffectsRegion">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/13964">
<link rel="match" href="reference/reference-filter-geometry-005-ref.html">
<meta name="assert" content="Tests that the SVG filter region of an inline that is split around a block is the union of its bounding client rects, when filterUnits are `objectBoundingBox`">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
    body {
        margin: 0;
    }
    .container {
        margin: 50px;
        width: 12em;
        font: 50px/50px Ahem;
        line-height: 2em;
        color: #EEE;
    }

    .filtered {
        color: black;
        filter: url(#test);
    }

    svg {
        position: absolute;
    }
</style>
</head>
<body>
  <svg width="0" height="0">
    <filter id="test" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%" primitiveUnits="userSpaceOnUse" filterUnits="objectBoundingBox">
      <feFlood flood-color="blue" flood-opacity="0.2" result="wash"/>
      <feFlood x="0" y="0" width="40" height="40" flood-color="orange" flood-opacity="0.5" result="topleft"/>
      <feFlood x="160" y="80" width="40" height="40" flood-color="orange" flood-opacity="0.5" result="bottomRight"/>
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="wash" />
        <feMergeNode in="topleft" />
        <feMergeNode in="bottomRight" />
      </feMerge>
    </filter>
  </svg>
  <!-- The inline is split by the block into three pieces: "XX" (80x40), the block (200x40) and "XXX" (120x40).
       The union of its bounding client rects is 200x120. -->
  <div class="container">XXX <span class="filtered">XXX XXX XXX</span>XXXX</div>
</body>
</html>
