<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Filter Effects Module Level 1: parsing filter with invalid values</title>
<link rel="author" title="Eric Willigers" href="mailto:ericwilligers@chromium.org">
<link rel="help" href="https://drafts.fxtf.org/filter-effects/#FilterProperty">
<meta name="assert" content="filter supports only the grammar 'none | <filter-function-list>'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
// Edge fails: expected "" but got "none"

test_invalid_value("filter", "auto");
test_invalid_value("filter", "none hue-rotate(0deg)");

test_invalid_value("filter", "blur(10)");
test_invalid_value("filter", "blur(-100px)");
test_invalid_value("filter", "blur(1)");
test_invalid_value("filter", "blur(-1px)");
test_invalid_value("filter", "blur(10%)");
test_invalid_value("filter", "blur(1px 1px)");
test_invalid_value("filter", "blur(1em, 1em)");
test_invalid_value("filter", "blur(10px, 10px)");
test_invalid_value("filter", "blur(1em,)");
test_invalid_value("filter", "blur(-2px)");

test_invalid_value("filter", "brightness(-20)"); // crbug.com/776208 Blink/WebKit accept negative brightness.
test_invalid_value("filter", "brightness(30px)");
test_invalid_value("filter", "brightness(10px)");
test_invalid_value("filter", "brightness(0.5 0.5)");
test_invalid_value("filter", "brightness(0.5, 0.5)");
test_invalid_value("filter", "brightness(0.5,)");
test_invalid_value("filter", "brightness(-2)");
test_invalid_value("filter", "brightness(-1.1)");
test_invalid_value("filter", "brightness(-0.6)");

test_invalid_value("filter", "contrast(-20)");
test_invalid_value("filter", "contrast(30px)");
test_invalid_value("filter", "contrast(10px)");
test_invalid_value("filter", "contrast(0.5 0.5)");
test_invalid_value("filter", "contrast(0.5, 0.5)");
test_invalid_value("filter", "contrast(0.5,)");
test_invalid_value("filter", "contrast(-0.5)");
test_invalid_value("filter", "contrast(-10%)");
test_invalid_value("filter", "contrast(-0.2)");
test_invalid_value("filter", "contrast(-0.8)");

test_invalid_value("filter", "drop-shadow(10 20)");
test_invalid_value("filter", "drop-shadow(10% 20%)");
test_invalid_value("filter", "drop-shadow(1px)");
test_invalid_value("filter", "drop-shadow(1px 2px 3px 4px)");
test_invalid_value("filter", "drop-shadow(rgb(4, 5, 6))");
test_invalid_value("filter", "drop-shadow()");
test_invalid_value("filter", "drop-shadow(red)");
test_invalid_value("filter", "drop-shadow(red 1px)");
test_invalid_value("filter", "drop-shadow(red 1 2 3)");
test_invalid_value("filter", "drop-shadow(red 1px 2px 3px inset)");
test_invalid_value("filter", "drop-shadow(red 1px 2px 3px 4px)");
test_invalid_value("filter", "drop-shadow(red, 1px, 2px, 3px)");
test_invalid_value("filter", "drop-shadow(10px 10px -1px red)");

test_invalid_value("filter", "grayscale(-20)");
test_invalid_value("filter", "grayscale(30px)");
test_invalid_value("filter", "grayscale(10px)");
test_invalid_value("filter", "grayscale(0.5 0.5)");
test_invalid_value("filter", "grayscale(0.5, 0.5)");
test_invalid_value("filter", "grayscale(0.5,)");
test_invalid_value("filter", "grayscale(-0.5)");
test_invalid_value("filter", "grayscale(-10%)");
test_invalid_value("filter", "grayscale(-0.2)");

test_invalid_value("filter", "hue-rotate(90)");
test_invalid_value("filter", "hue-rotate(10)");
test_invalid_value("filter", "hue-rotate(10px)");
test_invalid_value("filter", "hue-rotate(10deg 4)");
test_invalid_value("filter", "hue-rotate(10deg, 5deg)");
test_invalid_value("filter", "hue-rotate(10deg,)");

test_invalid_value("filter", "invert(-20)");
test_invalid_value("filter", "invert(30px)");
test_invalid_value("filter", "invert(10px)");
test_invalid_value("filter", "invert(0.5 0.5)");
test_invalid_value("filter", "invert(0.5, 0.5)");
test_invalid_value("filter", "invert(0.5,)");
test_invalid_value("filter", "invert(-0.5)");

test_invalid_value("filter", "opacity(-20)");
test_invalid_value("filter", "opacity(30px)");
test_invalid_value("filter", "opacity(10px)");
test_invalid_value("filter", "opacity(0.5 0.5)");
test_invalid_value("filter", "opacity(0.5, 0.5)");
test_invalid_value("filter", "opacity(0.5,)");
test_invalid_value("filter", "opacity(-0.5)");
test_invalid_value("filter", "opacity(-10%)");

test_invalid_value("filter", "saturate(-20)");
test_invalid_value("filter", "saturate(30px)");
test_invalid_value("filter", "saturate(10px)");
test_invalid_value("filter", "saturate(0.5 0.5)");
test_invalid_value("filter", "saturate(0.5, 0.5)");
test_invalid_value("filter", "saturate(0.5,)");
test_invalid_value("filter", "saturate(-0.5)");
test_invalid_value("filter", "saturate(-10%)");

test_invalid_value("filter", "sepia(-20)");
test_invalid_value("filter", "sepia(30px)");
test_invalid_value("filter", "sepia(0.5 0.5 3.0)");
test_invalid_value("filter", "sepia(0.1, 0.1)");
test_invalid_value("filter", "sepia(0.5,)");
test_invalid_value("filter", "sepia(-0.01)");
test_invalid_value("filter", "sepia(-10%)");
test_invalid_value("filter", "sepia(-0.5)");
test_invalid_value("filter", "url(#a #b)");
</script>
</body>
</html>
