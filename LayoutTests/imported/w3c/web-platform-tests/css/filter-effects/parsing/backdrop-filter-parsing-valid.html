<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Filter Effects Module Level 2: parsing backdrop-filter with valid values</title>
<link rel="author" title="Eric Willigers" href="mailto:ericwilligers@chromium.org">
<link rel="help" href="https://drafts.fxtf.org/filter-effects-2/#BackdropFilterProperty">
<meta name="assert" content="backdrop-filter supports the full grammar 'none | <backdrop-filter-function-list>'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_valid_value("backdrop-filter", "none");

test_valid_value("backdrop-filter", "blur(100px)");
test_valid_value("backdrop-filter", "blur(0)", "blur(0px)");
test_valid_value("backdrop-filter", "blur()", ["blur()", "blur(0px)"]);
test_valid_value("backdrop-filter", "blur(10px)");

test_valid_value("backdrop-filter", "brightness(0)");
test_valid_value("backdrop-filter", "brightness(300%)");
test_valid_value("backdrop-filter", "brightness()", ["brightness()", "brightness(1)"]);
test_valid_value("backdrop-filter", "brightness(1)");
test_valid_value("backdrop-filter", "brightness(50%)");
test_valid_value("backdrop-filter", "brightness(1.0)", "brightness(1)");
test_valid_value("backdrop-filter", "brightness(101%)");

test_valid_value("backdrop-filter", "contrast(0)");
test_valid_value("backdrop-filter", "contrast(300%)");
test_valid_value("backdrop-filter", "contrast()", ["contrast()", "contrast(1)"]);
test_valid_value("backdrop-filter", "contrast(1)");
test_valid_value("backdrop-filter", "contrast(50%)");
test_valid_value("backdrop-filter", "contrast(250%)");
test_valid_value("backdrop-filter", "contrast(1.0)", "contrast(1)");
test_valid_value("backdrop-filter", "contrast(2)");

test_valid_value("backdrop-filter", "drop-shadow(1px 2px)");
test_valid_value("backdrop-filter", "drop-shadow(1px 2px 3px)");
test_valid_value("backdrop-filter", "drop-shadow(0 0 0)", "drop-shadow(0px 0px 0px)");
test_valid_value("backdrop-filter", "drop-shadow(rgb(4, 5, 6) 1px 2px)");
test_valid_value("backdrop-filter", "drop-shadow(1px 2px rgb(4, 5, 6))", "drop-shadow(rgb(4, 5, 6) 1px 2px)");
test_valid_value("backdrop-filter", "drop-shadow(rgba(4, 5, 6, 0.75) 1px 2px 3px)");
test_valid_value("backdrop-filter", "drop-shadow(red 1px 2px 3px)");
test_valid_value("backdrop-filter", "drop-shadow(1px 2px 3px red)", "drop-shadow(red 1px 2px 3px)");
test_valid_value("backdrop-filter", "drop-shadow(#abc 0 0 0)", "drop-shadow(rgb(170, 187, 204) 0px 0px 0px)");

test_valid_value("backdrop-filter", "grayscale(0)");
test_valid_value("backdrop-filter", "grayscale(300%)", "grayscale(100%)");
test_valid_value("backdrop-filter", "grayscale()", ["grayscale()", "grayscale(1)"]);
test_valid_value("backdrop-filter", "grayscale(1)");
test_valid_value("backdrop-filter", "grayscale(50%)");
test_valid_value("backdrop-filter", "grayscale(1.0)", "grayscale(1)");

test_valid_value("backdrop-filter", "hue-rotate(90deg)");
test_valid_value("backdrop-filter", "hue-rotate(0)", "hue-rotate(0deg)");
test_valid_value("backdrop-filter", "hue-rotate()", ["hue-rotate()", "hue-rotate(0deg)"]);
test_valid_value("backdrop-filter", "hue-rotate(10deg)");
test_valid_value("backdrop-filter", "hue-rotate(10.0deg)", "hue-rotate(10deg)");
test_valid_value("backdrop-filter", "hue-rotate(10rad)");
test_valid_value("backdrop-filter", "hue-rotate(10grad)");
test_valid_value("backdrop-filter", "hue-rotate(0.5turn)");
test_valid_value("backdrop-filter", "hue-rotate(-370.2deg)");

test_valid_value("backdrop-filter", "invert(0)");
test_valid_value("backdrop-filter", "invert(300%)", "invert(100%)");
test_valid_value("backdrop-filter", "invert()", ["invert()", "invert(1)"]);
test_valid_value("backdrop-filter", "invert(1)");
test_valid_value("backdrop-filter", "invert(50%)");
test_valid_value("backdrop-filter", "invert(1.0)", "invert(1)");

test_valid_value("backdrop-filter", "opacity(0)");
test_valid_value("backdrop-filter", "opacity(300%)", "opacity(100%)");
test_valid_value("backdrop-filter", "opacity()", ["opacity()", "opacity(1)"]);
test_valid_value("backdrop-filter", "opacity(1)");
test_valid_value("backdrop-filter", "opacity(50%)");
test_valid_value("backdrop-filter", "opacity(1.0)", "opacity(1)");

test_valid_value("backdrop-filter", "saturate(0)");
test_valid_value("backdrop-filter", "saturate(300%)");
test_valid_value("backdrop-filter", "saturate()", ["saturate()", "saturate(1)"]);
test_valid_value("backdrop-filter", "saturate(1)");
test_valid_value("backdrop-filter", "saturate(50%)");
test_valid_value("backdrop-filter", "saturate(250%)");
test_valid_value("backdrop-filter", "saturate(1.0)", "saturate(1)");
test_valid_value("backdrop-filter", "saturate(5.5)");

test_valid_value("backdrop-filter", "sepia(0)");
test_valid_value("backdrop-filter", "sepia(300%)", "sepia(100%)");
test_valid_value("backdrop-filter", "sepia()", ["sepia()", "sepia(1)"]);
test_valid_value("backdrop-filter", "sepia(1)");
test_valid_value("backdrop-filter", "sepia(50%)");
test_valid_value("backdrop-filter", "sepia(1.0)", "sepia(1)");

test_valid_value("backdrop-filter", 'url("picture.svg#f")');

test_valid_value("backdrop-filter", 'url("https://www.example.com/picture.svg#f")');
test_valid_value("backdrop-filter", "url(#a)", 'url("#a")');
test_valid_value("backdrop-filter", "url('#a')", 'url("#a")');

test_valid_value("backdrop-filter", 'blur(10px) url("picture.svg#f") contrast(20) brightness(30)');
test_valid_value("backdrop-filter", "brightness(0.5) brightness(0.25)");
test_valid_value("backdrop-filter", "brightness(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "contrast(0.5) contrast(0.25)");
test_valid_value("backdrop-filter", "contrast(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "grayscale(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "grayscale(0.25) brightness(0.5)");
test_valid_value("backdrop-filter", "grayscale(0.25) contrast(0.5)");
test_valid_value("backdrop-filter", "grayscale(0.5) sepia(0.25) saturate(0.75) hue-rotate(35deg) invert(0.2) opacity(0.9) blur(5px) drop-shadow(green 1px 2px 3px)");
test_valid_value("backdrop-filter", "grayscale(1) url('#a')", 'grayscale(1) url("#a")');
test_valid_value("backdrop-filter", "hue-rotate(10deg) grayscale(0.25)");
test_valid_value("backdrop-filter", "invert(0.5) invert(0.25)");
test_valid_value("backdrop-filter", "invert(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "opacity(0.5) opacity(0.25)");
test_valid_value("backdrop-filter", "opacity(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "saturate(0.5) saturate(0.25)");
test_valid_value("backdrop-filter", "saturate(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "sepia(0.5) sepia(0.25)");
test_valid_value("backdrop-filter", "sepia(0.5) grayscale(0.25)");
test_valid_value("backdrop-filter", "url('#a') url('#b')", 'url("#a") url("#b")');
</script>
</body>
</html>
