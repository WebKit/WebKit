<!DOCTYPE html>
<html>
<style>
    #container {
        position: relative;
        width: 400px;
        height: 400px;
    }
    #container > div {
        position: absolute;
        width: 100%;
        height: 100%;
    }
    #cyan-rect {
        background-color: cyan;
    }
    #white-circle {
        border-radius: 200px;
        background-color: white;
        position: absolute;
        width: 100%;
        height: 100%;
    }
    #cyan-circle {
        border-radius: 200px;
        top: 25%;
        left: 25%;
        background-color: cyan;
        position: absolute;
        width: 50%;
        height: 50%;
    }
    #foreground {
        color: purple;
    }
</style>
<div id="container">
    <div id="cyan-rect">
        <div id="white-circle">
            <div id="cyan-circle"></div>
        </div>
    </div>
    <div id="foreground">This text should be purple on a background with a striped blue gradient.</div>
</div>
</html>
