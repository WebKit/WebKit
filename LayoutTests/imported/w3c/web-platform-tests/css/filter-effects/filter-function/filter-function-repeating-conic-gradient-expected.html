<!DOCTYPE html>
<html>
<style>
    #container {
        position: relative;
        width: 400px;
        height: 400px;
    }
    .cyan-rect {
        position: absolute;
        width: 50%;
        height: 50%;
        background-color: cyan;
    }
    .top-right {
        left: 50%;
    }
    .bottom-left {
        top: 50%;
    }
    #foreground {
        position: absolute;
        width: 100%;
        height: 100%;
        color: purple;
    }
</style>
<div id="container">
    <div class="top-right cyan-rect"></div>
    <div class="bottom-left cyan-rect"></div>
    <div id="foreground">This text should be purple on a background with a striped blue gradient.</div>
</div>
</html>
