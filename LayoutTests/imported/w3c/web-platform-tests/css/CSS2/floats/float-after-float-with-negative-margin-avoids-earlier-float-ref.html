<!DOCTYPE html>
<style>
.container {
  position: relative;
  width: 300px;
  height: 100px;
}

.green {
  position: absolute;
  top: 0;
  width: 100px;
  height: 100px;
  background-color: green;
}

.blue {
  position: absolute;
  top: 60px;
  left: 100px;
  width: 50px;
  height: 10px;
  background-color: blue;
}
</style>
<div class="container">
  <div class="green"></div>
  <div class="blue"></div>
</div>

  <div class="green"></div>
  <div class="blue"></div>
