<!DOCTYPE html>
<style>
.container {
  position: relative;
  margin-left: 300px;
  width: 200px;
  height: 40px;
  background-color: lightgray;
}

.no-room {
  position: absolute;
  top: 10px;
  left: -300px;
  width: 50px;
  height: 20px;
  background-color: green;
}

.wide {
  position: absolute;
  top: 10px;
  left: 0;
  width: 250px;
  height: 10px;
  background-color: blue;
}
</style>
<div class="container">
  <div class="no-room"></div>
  <div class="wide"></div>
</div>
<div class="container">
  <div class="no-room"></div>
  <div class="wide"></div>
</div>
