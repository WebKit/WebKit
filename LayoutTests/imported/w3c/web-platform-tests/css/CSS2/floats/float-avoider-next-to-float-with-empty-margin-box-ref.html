<!DOCTYPE html>
<style>
.container {
  position: relative;
  width: 200px;
  height: 40px;
  margin-bottom: 10px;
  background-color: lightgray;
}

.float {
  position: absolute;
  top: 0;
  left: 0;
  width: 50px;
  height: 10px;
  background-color: green;
}

.avoider {
  position: absolute;
  top: 20px;
  left: 0;
  width: 200px;
  height: 10px;
  background-color: blue;
}

.fixed-width {
  width: 100px;
}
</style>
<div class="container">
  <div class="float"></div>
  <div class="avoider fixed-width"></div>
</div>

  <div class="float"></div>
  <div class="avoider fixed-width"></div>
</div>
