<!DOCTYPE html>
<meta charset="utf-8">
<meta name="variant" content="?delay=none">
<meta name="variant" content="?delay=headers">
<meta name="variant" content="?delay=body">
<title>Navigation Preload: reading preloadResponse after respondWith()</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="../resources/test-helpers.sub.js"></script>
<script>
// The worker answers the navigation with a synthetic response right away,
// then reads event.preloadResponse in waitUntil() and posts the body text
// back. The preload must stay usable after respondWith() has settled, also
// when the server sends the preload headers or body only later.
const script = 'resources/read-after-respondwith-worker.js';
const scope = 'resources/read-after-respondwith-scope.py';
const delay = new URLSearchParams(location.search).get('delay');

function preload_result(url) {
  return new Promise(resolve => {
    navigator.serviceWorker.addEventListener('message', function listener(e) {
      if (e.data.url !== url)
        return;
      navigator.serviceWorker.removeEventListener('message', listener);
      resolve(e.data.result);
    });
  });
}

promise_test(async t => {
  const registration =
      await service_worker_unregister_and_register(t, script, scope);
  t.add_cleanup(() => registration.unregister());
  await wait_for_state(t, registration.installing, 'activated');

  const url = new URL(`${scope}?delay=${delay}`, location).href;
  const result = preload_result(url);
  const frame = await with_iframe(url);
  t.add_cleanup(() => frame.remove());
  assert_equals(frame.contentDocument.body.textContent, 'synthetic',
                'the navigation uses the respondWith() response');
  assert_equals(await result, 'preload body');
}, `preloadResponse can be read in waitUntil() after respondWith() (delay=${delay})`);
</script>
