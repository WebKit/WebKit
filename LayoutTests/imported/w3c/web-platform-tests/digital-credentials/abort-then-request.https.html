<!doctype html>
<meta charset="utf-8" />
<title>Digital Credential: a request aborted as soon as it's made doesn't affect the next request</title>
<link rel="help" href="https://w3c-fedid.github.io/digital-credentials/" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js?feature=bidi"></script>
<script src="/resources/testdriver-vendor.js"></script>

<body></body>
<script type="module">
  import { makeGetOptions } from "./support/helper.js";

  promise_test(async (t) => {
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    const reason = new Error("The first request was aborted.");
    let firstRequest;
    await test_driver.bless("user activation for the first request", () => {
      firstRequest = navigator.credentials.get(makeGetOptions({ protocol: "org-iso-mdoc", signal: abortController.signal }));
      abortController.abort(reason);
    });
    await promise_rejects_exactly(t, reason, firstRequest, "The first request should be aborted");

    const secondAbortController = new AbortController();
    const secondReason = new Error("The second request was aborted.");
    await test_driver.bless("user activation for the second request");
    const secondRequest = navigator.credentials.get(makeGetOptions({ protocol: "org-iso-mdoc", signal: secondAbortController.signal }));
    await new Promise((resolve) => t.step_timeout(resolve, 100));
    secondAbortController.abort(secondReason);
    await promise_rejects_exactly(t, secondReason, secondRequest, "The second request should settle only when it is aborted");
  }, "A request aborted as soon as it's made doesn't affect the next request.");
</script>
