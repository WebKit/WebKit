<!DOCTYPE html>
<html>
<head>
    <title>StorageManager.persist() ITP Test</title>
</head>
<body>
    <h1>StorageManager.persist() ITP Test</h1>
    <p>This test verifies that StorageManager.persist() prevents ITP from deleting storage data.</p>
    
    <button id="requestPersistence">Request Persistence</button>
    <button id="checkPersistence">Check Persistence Status</button>
    <button id="storeData">Store Test Data</button>
    <button id="checkData">Check Stored Data</button>
    
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }
        
        // Test localStorage
        function storeTestData() {
            try {
                localStorage.setItem('testKey', 'testValue_' + Date.now());
                localStorage.setItem('secretKey', '1password-secret-key-12345');
                log('✅ Stored test data in localStorage');
            } catch (e) {
                log('❌ Failed to store localStorage data: ' + e.message);
            }
            
            // Test IndexedDB
            const request = indexedDB.open('testDB', 1);
            request.onerror = () => log('❌ Failed to open IndexedDB');
            request.onsuccess = () => {
                const db = request.result;
                const transaction = db.transaction(['testStore'], 'readwrite');
                const store = transaction.objectStore('testStore');
                const addRequest = store.add({ id: 1, data: 'testData_' + Date.now() });
                addRequest.onsuccess = () => log('✅ Stored test data in IndexedDB');
                addRequest.onerror = () => log('❌ Failed to store IndexedDB data');
            };
            request.onupgradeneeded = () => {
                const db = request.result;
                db.createObjectStore('testStore', { keyPath: 'id' });
            };
        }
        
        function checkStoredData() {
            try {
                const localStorageData = localStorage.getItem('testKey');
                log('localStorage testKey: ' + (localStorageData || 'NOT FOUND'));
                
                const secretKey = localStorage.getItem('secretKey');
                log('localStorage secretKey: ' + (secretKey || 'NOT FOUND'));
            } catch (e) {
                log('❌ Failed to read localStorage: ' + e.message);
            }
            
            // Check IndexedDB
            const request = indexedDB.open('testDB', 1);
            request.onerror = () => log('❌ Failed to open IndexedDB for reading');
            request.onsuccess = () => {
                const db = request.result;
                const transaction = db.transaction(['testStore'], 'readonly');
                const store = transaction.objectStore('testStore');
                const getRequest = store.get(1);
                getRequest.onsuccess = () => {
                    const data = getRequest.result;
                    log('IndexedDB data: ' + (data ? JSON.stringify(data) : 'NOT FOUND'));
                };
                getRequest.onerror = () => log('❌ Failed to read IndexedDB data');
            };
        }
        
        async function requestPersistence() {
            try {
                if ('storage' in navigator && 'persist' in navigator.storage) {
                    const persisted = await navigator.storage.persist();
                    log('✅ Persistence request result: ' + persisted);
                } else {
                    log('❌ StorageManager.persist() not supported');
                }
            } catch (e) {
                log('❌ Failed to request persistence: ' + e.message);
            }
        }
        
        async function checkPersistenceStatus() {
            try {
                if ('storage' in navigator && 'persisted' in navigator.storage) {
                    const persisted = await navigator.storage.persisted();
                    log('✅ Current persistence status: ' + persisted);
                } else {
                    log('❌ StorageManager.persisted() not supported');
                }
            } catch (e) {
                log('❌ Failed to check persistence status: ' + e.message);
            }
        }
        
        // Event listeners
        document.getElementById('requestPersistence').addEventListener('click', requestPersistence);
        document.getElementById('checkPersistence').addEventListener('click', checkPersistenceStatus);
        document.getElementById('storeData').addEventListener('click', storeTestData);
        document.getElementById('checkData').addEventListener('click', checkStoredData);
        
        // Auto-run some tests on load
        window.addEventListener('load', () => {
            log('🚀 Page loaded. Testing StorageManager.persist() with ITP...');
            checkPersistenceStatus();
        });
    </script>
</body>
</html>
